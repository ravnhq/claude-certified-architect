name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install CJK fonts for Japanese/Chinese/Korean support
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install build deps
        run: npm install --no-save marked@13 minisearch@7 md-to-pdf

      - name: Regenerate guide PDFs from current markdown
        run: |
          mkdir -p pdf
          shopt -s nullglob nocaseglob
          for file in guide_*.md; do
            echo "Generating PDF for $file"
            npx md-to-pdf "$file" \
              --basedir "$(pwd)" \
              --stylesheet "$(pwd)/.github/workflows/pdf-style.css" \
              --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}'
            mv "${file%.*}.pdf" pdf/
          done

      - name: Build static site
        run: node scripts/build-pages.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
