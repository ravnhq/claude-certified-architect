name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The guides are EN/ES/PT only, so the runner's default Latin fonts are
      # enough for the PDFs. Add `fonts-noto-cjk` back if a JA/ZH/KO guide lands.

      - name: Install build deps
        run: npm install --no-save marked@13 minisearch@7 md-to-pdf

      - name: Regenerate guide PDFs from current markdown
        run: |
          mkdir -p pdf
          shopt -s nullglob nocaseglob
          for file in guide_*.md; do
            echo "Generating PDF for $file"
            npx md-to-pdf "$file" \
              --basedir "$(pwd)" \
              --stylesheet "$(pwd)/.github/workflows/pdf-style.css" \
              --launch-options '{"args":["--no-sandbox","--disable-setuid-sandbox"]}'
            mv "${file%.*}.pdf" pdf/
          done

      - name: Regenerate practice exam HTML from guides + mock bank
        run: python3 utils/build_exam_html.py

      - name: Validate the Professional question bank against the blueprint
        run: python3 utils/validate_professional_bank.py

      - name: Regenerate the Professional practice exam
        run: python3 utils/build_professional_exam.py

      - name: Check the quiz engine
        run: node utils/test_exam_engine.mjs

      # Covers what the engine harness cannot: the summary and question screens
      # only exist once the engine writes them, and a review pane that silently
      # drops an item still scores it as incorrect.
      - name: Check the rendered exam screens
        run: node utils/test_exam_render.mjs

      # Must stay before build-pages.mjs: the site build copies the exam HTML,
      # and falls back to a "not generated yet" placeholder if it is missing.
      - name: Build static site
        run: node scripts/build-pages.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
