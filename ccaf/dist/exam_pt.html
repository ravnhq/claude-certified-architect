nation": ""}, {"letter": "D", "text": "Recomendar um portfólio balanceado sem tratar do conflito.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "5.1", "objective": "Manage conversation context to preserve critical information across long interactions", "group": "G"}, {"id": "g64", "domain": 5, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Usuários refinam preferências de playlist em vários turnos. Duas mensagens depois de o usuário dizer \"amo jazz\", Claude pergunta \"Quais gêneros você gosta?\".", "question": "Qual a causa mais provável?", "options": [{"letter": "A", "text": "Claude exige conexão com base vetorial para manter memória de conversa.", "correct": false, "explanation": ""}, {"letter": "B", "text": "A janela de contexto do modelo foi excedida.", "correct": false, "explanation": ""}, {"letter": "C", "text": "A Claude API exige um parâmetro `session_id`.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Sua aplicação não está incluindo as mensagens anteriores no array `messages`.", "correct": true, "explanation": "Claude não tem memória do lado do servidor — toda chamada de API é stateless. Sem incluir o histórico completo no array `messages` de cada requisição, Claude não tem conhecimento de turnos anteriores. Bases vetoriais (A) e `session_id` (C) não fazem parte da arquitetura do Claude; estouro de janela de contexto (B) é impossível em troca de duas mensagens."}], "correct": "D", "task_id": "5.1", "objective": "Manage conversation context to preserve critical information across long interactions", "group": "G"}, {"id": "g65", "domain": 5, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Após uma sessão culinária de 40 minutos, a conversa atinge 78.000 tokens. O histórico inclui alergias, escala de receitas, termos culinários esclarecidos e discussão geral. Você precisa reduzir tokens preservando informação importante.", "question": "Qual abordagem melhor balanceia preservação e redução de tokens?", "options": [{"letter": "A", "text": "Sumarizar todo o histórico da conversa.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Manter apenas os 20.000 tokens mais recentes.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Extrair dados estruturados críticos (alergias, quantidades, preferências), sumarizar a discussão geral e manter trocas recentes verbatim.", "correct": true, "explanation": "A abordagem híbrida preserva a informação de maior valor ao menor custo. Fatos críticos como alergias e quantidades são extraídos para um bloco estruturado compacto (evitando perda de precisão que ocorre na sumarização), discussão geral é sumarizada e trocas recentes mantidas verbatim para coerência conversacional. A e B arriscam perder informação dietética crítica; D é overkill arquitetural para uma única sessão."}, {"letter": "D", "text": "Armazenar a conversa completa externamente e recuperar partes relevantes via busca semântica.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "5.1", "objective": "Manage conversation context to preserve critical information across long interactions", "group": "G"}, {"id": "g66", "domain": 5, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Usuários reportam que durante conversas extensas o assistente perde o rastro de tópicos e preferências anteriores. Sua implementação atual mantém apenas os últimos 25 pares de mensagens.", "question": "Qual a solução mais efetiva?", "options": [{"letter": "A", "text": "Abordagem híbrida: sumarizar mensagens antigas mantendo as recentes verbatim.", "correct": true, "explanation": "A abordagem híbrida ataca ambas as dimensões do problema: retém contexto exato recente (crítico para coerência conversacional) enquanto mantém uma representação comprimida das preferências anteriores (evitando perda total quando pares são descartados). Aumentar a janela (C) só atrasa o mesmo problema. Busca vetorial (B) pode perder contexto importante que não é semanticamente similar à query atual. Sumarização total por turno (D) adiciona overhead e acumula erros de sumarização."}, {"letter": "B", "text": "Busca por similaridade vetorial sobre o histórico completo da conversa.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Aumentar a janela para 50 pares de mensagens.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Sumarizar mensagens descartadas a cada turno e prepender o sumário corrente.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "5.1", "objective": "Manage conversation context to preserve critical information across long interactions", "group": "G"}, {"id": "g67", "domain": 5, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Usuários reportam que latência aumenta e custos sobem quando conversas excedem 50 turnos.", "question": "Qual a causa principal?", "options": [{"letter": "A", "text": "Todo o histórico da conversa é incluído em cada requisição da API.", "correct": true, "explanation": "A API do Claude é totalmente stateless — toda requisição precisa incluir o histórico completo no array `messages`. Conforme conversas crescem, cada requisição carrega mais tokens, o que aumenta diretamente latência de processamento e custo. O modelo não mantém estado interno entre chamadas (D é falso) e o tamanho da resposta não está intrinsecamente ligado ao tamanho da conversa (B)."}, {"letter": "B", "text": "O modelo gera respostas progressivamente mais longas.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Operações de banco ficam mais lentas conforme o histórico cresce.", "correct": false, "explanation": ""}, {"letter": "D", "text": "O modelo constrói um perfil interno do usuário que exige mais processamento.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "5.1", "objective": "Manage conversation context to preserve critical information across long interactions", "group": "G"}, {"id": "g68", "domain": 5, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Após três meses de sessões semanais, o histórico cresce para 85.000 tokens. Quando um usuário pergunta \"O que concluímos sobre o tema do isolamento?\", o assistente dá respostas genéricas em vez de referenciar discussões anteriores.", "question": "Qual a abordagem mais efetiva?", "options": [{"letter": "A", "text": "Truncamento por janela rolante.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Sumarização progressiva capturando conclusões-chave.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Embeddings semânticos com recuperação de trocas relevantes.", "correct": true, "explanation": "Busca semântica sobre o histórico de conversa é a única abordagem que escala para três meses de discussão sendo capaz de surfar trocas específicas relevantes sob demanda. Janela rolante (A) descartaria a maior parte do histórico. Sumarização progressiva (B) comprime discussões em abstrações que perdem as conclusões específicas que os usuários estão pedindo. Tags XML (D) exigem reestruturar todo conteúdo passado e não resolvem o problema de recuperação nessa escala."}, {"letter": "D", "text": "Adicionar tags XML estruturadas marcando conclusões da discussão.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "5.1", "objective": "Manage conversation context to preserve critical information across long interactions", "group": "G"}, {"id": "g70", "domain": 5, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Seu tutor de IA tem um system prompt de 2.800 tokens definindo metodologia de ensino e regras de adaptação. Após 12 turnos, o assistente começa a ignorar níveis de proficiência.", "question": "Qual a correção mais efetiva?", "options": [{"letter": "A", "text": "Injetar lembretes a cada 4–5 turnos.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Substituir regras verbosas por exemplos few-shot demonstrando adaptação por nível de proficiência.", "correct": true, "explanation": "Um system prompt de 2.800 tokens com regras declarativas é vulnerável a deriva porque regras abstratas exigem que o modelo raciocine sobre elas a cada turno. Substituir regras verbosas por exemplos few-shot concretos que demonstram adaptação correta por nível de proficiência dá ao modelo padrões comportamentais claros para casar — isso é seguido de forma mais confiável ao longo de muitos turnos do que instruções abstratas. Injeção de lembretes (A) ajuda mas trata sintomas; posicionamento no fim (C) ajuda inicialmente mas não com deriva por turno; regeneração (D) é cara e corretiva."}, {"letter": "C", "text": "Posicionar regras críticas no fim do system prompt.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Avaliar respostas e regenerar se o nível de dificuldade não casar.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "5.1", "objective": "Manage conversation context to preserve critical information across long interactions", "group": "G"}, {"id": "g75", "domain": 5, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Seu assistente usa um system prompt de persona \"empreiteiro\". Os primeiros turnos seguem as regras, mas no turno 7 o assistente passa a dar conselhos genéricos. O comprimento da conversa é de apenas 2.500 tokens.", "question": "Qual a causa mais provável?", "options": [{"letter": "A", "text": "System prompts apenas estabelecem comportamento inicial.", "correct": false, "explanation": ""}, {"letter": "B", "text": "A atenção do modelo enfraquece à medida que turnos se acumulam.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Respostas acumuladas do assistente diluem a influência do system prompt.", "correct": true, "explanation": "Conforme respostas do assistente se acumulam no histórico, a proporção de texto refletindo as restrições comportamentais do system prompt diminui em relação ao volume crescente de conteúdo gerado pelo assistente. O modelo cada vez mais casa padrão com suas próprias saídas anteriores em vez do system prompt, agravando deriva mesmo em comprimentos curtos de tokens. O system prompt é incluído em toda chamada de API (D é falso isoladamente) e degradação de atenção (B) não opera em 2.500 tokens."}, {"letter": "D", "text": "O system prompt é enviado apenas uma vez.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "5.1", "objective": "Manage conversation context to preserve critical information across long interactions", "group": "G"}, {"id": "m18", "domain": 5, "scenario": null, "situation": "Durante os testes, você observa que em sessões de exploração prolongadas (mais de 30 minutos), o agente começa a dar respostas inconsistentes sobre a estrutura de código que discutiu anteriormente. Os engenheiros relatam ter que repetir o contexto sobre módulos que já exploraram.", "question": "Qual é a abordagem mais eficaz para resolver isso?", "options": [{"letter": "A", "text": "Fazer o agente manter um arquivo de rascunho que registra as descobertas principais, consultando-o para perguntas subsequentes.", "correct": true, "explanation": "Correto. Um arquivo de rascunho descarrega as descobertas em um armazenamento durável que o agente pode reler sob demanda, dando a ele uma 'memória' estável independente de quão cheia a janela de contexto fique."}, {"letter": "B", "text": "Mudar para um nível de modelo de maior capacidade para fornecer mais espaço de janela de contexto para os dados de exploração acumulados.", "correct": false, "explanation": "Uma janela maior adia o problema, mas não resolve a degradação da atenção em contextos longos e ruidosos."}, {"letter": "C", "text": "Implementar a limpeza automática do contexto a cada 15 minutos para garantir que o agente comece com um contexto novo e não contaminado.", "correct": false, "explanation": "A limpeza completa descarta descobertas válidas — exatamente o estado que os engenheiros reclamam de ter que reestabelecer."}, {"letter": "D", "text": "Criar resumos de todos os arquivos-fonte antes do início da exploração, carregando no contexto apenas essas representações comprimidas.", "correct": false, "explanation": "Resumos prévios perdem os detalhes que tornam a exploração de código útil e frequentemente distorcem os arquivos que mais importam ao engenheiro."}], "correct": "A", "task_id": "5.4", "objective": "Manage context effectively in large codebase exploration", "group": "G"}, {"id": "m20", "domain": 5, "scenario": null, "situation": "Seu agente passou 25 minutos explorando o subsistema de renderização de um motor de jogos — lendo código de shaders, gerenciamento de buffers e a lógica de sincronização de frames. Um engenheiro agora pede que ele entenda como o motor de física se integra à renderização para sobreposições de depuração de colisão. Você nota que respostas recentes fazem referência a \"padrões típicos de renderização\" em vez das classes específicas VulkanPipeline e FrameGraph que ele descobriu antes.", "question": "Qual é a abordagem mais eficaz?", "options": [{"letter": "A", "text": "Criar um subagente para explorar a física de forma independente e, então, sintetizar manualmente suas descobertas com o conhecimento de renderização acumulado na conversa principal.", "correct": false, "explanation": "A síntese manual na conversa principal empurra ainda mais conteúdo para um contexto que já está se degradando."}, {"letter": "B", "text": "Continuar no contexto atual com prompts mais direcionados que referenciam as classes específicas pelo nome.", "correct": false, "explanation": "O agente já está perdendo especificidade ('padrões típicos' em vez de VulkanPipeline). Insistir mais sobre o mesmo contexto degradado não o restaura."}, {"letter": "C", "text": "Resumir as descobertas principais de renderização e, então, criar um subagente para a exploração de física com esse resumo em seu contexto inicial.", "correct": true   const domStat = {}, wrongByDomain = {};

    domStat[q.domain].total++;

  state.reportSignature = signature;
  state.answers = {};
  state.graded = {};

  buildSidebar();
  updateLengthUI();

// ---- sidebar -------------------------------------------------------------
function buildSidebar() {
  const list = document.getElementById("sidebarList");
  list.innerHTML = "";
  document.getElementById("totalCount").textContent = state.order.length;
  const qs = orderedQuestions();
  // A weak-spot drill is ordered by miss count, so its domains interleave:
  // grouping it by domain would produce a column of one-item headings. It gets
  // a single group instead, under the drill's own name.
  const weak = state.focus === "misses";
  let curDomain = null, groupEl = null;
  qs.forEach((q, idx) => {
    const groupKey = weak ? "misses" : q.domain;
    if (groupKey !== curDomain) {
      curDomain = groupKey;
      const sg = document.createElement("div");
      sg.className = "domain-group";
      const lbl = document.createElement("div");
      lbl.className = "domain-label";
      const dm = DOMAINS[q.domain];
      lbl.innerHTML = weak
        ? "<span>" + esc(T.misses_label) + "</span><span class='dl-weight'>" + qs.length + "</span>"
        : "<span>" + T.domain + " " + q.domain + " · " + esc(dm.name) +
          "</span><span class='dl-weight'>" + dm.weight + "%</span>";
      sg.appendChild(lbl);
      groupEl = sg;
      list.appendChild(sg);
    }
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "q-btn";
    btn.id = "sb-" + idx;
    btn.onclick = () => goto(idx);
    btn.innerHTML = "<span class='q-dot'></span> " + (idx + 1);
    groupEl.appendChild(btn);
  });
}

function updateSidebar() {
  const qs = orderedQuestions();
  let answeredCount = 0;
  qs.forEach((q, idx) => {
    const btn = document.getElementById("sb-" + idx);
    if (!btn) return;
    btn.className = "q-btn";
    if (idx === state.current) btn.classList.add("active");
    const ans = state.answers[q.id];
    if (hasAnswer(q, ans)) {
      answeredCount++;
      if (state.mode === "exam") btn.classList.add("answered");
      else btn.classList.add(isCorrect(q, ans) ? "answered-correct" : "answered-wrong");
    }

// ---- question render -----------------------------------------------------
function renderQuestion(idx) {
  const qs = orderedQuestions();
  const q = qs[idx];
  const chosen = state.answers[q.id];
  // Study mode reveals only once the answer is complete — for a multi item that
  // means all N letters are selected, so partial picks stay editable.
  const reveal = hasAnswer(q, chosen) && state.mode === "study";

  document.getElementById("qCounter").textContent = (idx + 1) + " / " + qs.length;
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === qs.length - 1;

  const dm = DOMAINS[q.domain];
  const scenarioTag = q.scenario ? "<span class='q-scenario'>" + esc(q.scenario) + "</span>" : "";
  const situation = q.situation ? "<div class='q-situation'>" + md(q.situation) + "</div>" : "";

  // A multi item with all N picks in place: the remaining options are dimmed
  // and inert, so it reads as "deselect one first" instead of a dead click.
  const atCapacity = !reveal && isMulti(q) && hasAnswer(q, chosen);

  const optionsHtml = q.options.map(opt => {
    let cls = "option";
    const isChosen = isChosenLetter(chosen, opt.letter);
    if (reveal) {
      cls += " locked";
      if (opt.correct) cls += " correct";
      else if (isChosen) cls += " wrong";
      else cls += " dimmed";
    } else if (isChosen) {
      cls += " selected";
    } else if (atCapacity) {
      cls += " dimmed";
    }
    // In study mode after answering, show explanation for the correct option
    // and for the (wrong) one the user picked.
    const showExpl = reveal && opt.explanation && (opt.correct || isChosen);
    // A revealed option is inert for good, so `disabled` fits. An at-capacity
    // option is not: it becomes selectable again as soon as the candidate
    // deselects a letter, so it stays in the tab order and only reports itself
    // as unavailable. `disabled` here would hide it from keyboard and screen
    // reader users, and the visible hint below explains the state.
    const disabled = reveal ? " disabled"
                   : ((atCapacity && !isChosen) ? " aria-disabled='true'" : "");
    const expl = opt.explanation
      ? "<div class='opt-expl" + (showExpl ? " show" : "") + "'>" + md(opt.explanation) + "</div>"
      : "";
    return "<div class='" + cls + "' data-letter='" + opt.letter + "'>" +
      "<button type='button' class='option-head' aria-pressed='" + String(isChosen) + "'" + disabled +
        " onclick=\"answer('" + q.id + "','" + opt.letter + "')\">" +
        "<span class='opt-letter'>" + opt.letter + "</span>" +
        "<span class='opt-text'>" + md(opt.text) + "</span>" +
      "</button>" + expl + "</div>";
  }).join("");

  document.getElementById("qCard").innerHTML =
    "<div class='q-number'>" + T.question + " " + (idx + 1) + "</div>" +
    "<div><span class='q-domain'>" + T.domain + " " + q.domain + " · " + esc(dm.name) + "</span>" +
    scenarioTag + "</div>" +
    situation +
    "<div class='q-prompt'>" + md(q.question) + "</div>" +
    (isMulti(q)
      ? "<div class='q-select'>" + T.select_n.replace("{n}", selectCount(q)) + "</div>" +
        (atCapacity
          ? "<div class='q-select-hint'>" + T.select_full.replace("{n}", selectCount(q)) + "</div>"
          : "")
      : "") +
    "<div class='options'>" + optionsHtml + "</div>";
}

function answer(id, letter) {
  const q = qById(id);
  const n = selectCount(q);

  if (locked) return;

  if (n === 1) {
    state.answers[id] = letter;
  } else {
    // Toggle within the allowed number of selections. Re-clicking a chosen
    // letter removes it, so a candidate can correct a pick before completing.
    const cur = Array.isArray(state.answers[id]) ? state.answers[id].slice() : [];
    const at = cur.indexOf(letter);
    if (at >= 0) cur.splice(at, 1);
    else if (cur.length < n) cur.push(letter);

    // re-render. Repainting the card would throw away the keyboard focus.
    else return;
    state.answers[id] = cur;
  }
  // Study mode reveals the answer as soon as it is complete — that reveal is
  // the grading the candidate sees, so the weak-spot record follows it. Exam
  // mode stays editable until the attempt is scored, so it records there.
  if (state.mode === "study" && hasAnswer(q, state.answers[id])) {
    noteResult(q, state.answers[id]);
    updateMissesUI();
  }
  save();
  renderQuestion(state.current);
  updateSidebar();
}

function navigate(dir) { goto(state.current + dir); }

// Three screens now share the content pane, so showing one always hides the
// other two: a half-hidden browse list under a summary was the failure mode.
function showScreen(name) {
  ["questionScreen", "summaryScreen", "browseScreen"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.toggle("active", id === name);
  });
  const btn = document.getElementById("browseBtn");
  if (btn) btn.classList.toggle("active", name === "browseScreen");
}

function goto(idx) {
  const qs = orderedQuestions();
  if (idx < 0 || idx >= qs.length) return;
  showScreen("questionScreen");
  state.current = idx;
  save();
  renderQuestion(idx);
  updateSidebar();
}

function setMode(mode) {
  state.mode = mode;
  document.getElementById("modeStudy").classList.toggle("active", mode === "study");
  document.getElementById("modeExam").classList.toggle("active", mode === "exam");
  document.getElementById("modeStudy").setAttribute("aria-pressed", String(mode === "study"));
  document.getElementById("modeExam").setAttribute("aria-pressed", String(mode === "exam"));
  updateModeHint();
  save();
  renderQuestion(state.current);
  updateSidebar();
}

function updateModeHint() {
  const hint = document.getElementById("modeHint");
  if (!hint) return;
  hint.textContent = (state.mode === "study" ? T.mode_hint_study : T.mode_hint_exam) +
    (persistenceUnavailable ? " Progress could not be saved on this device." : "");
}

// ---- new draw ------------------------------------------------------------
// Drawing a different set is available at all times: the header button, the
// length toggle, and the summary's restart all end in restart(). The first
// two run while an attempt may be in progress, so they share one guard that
// asks before discarding it. The summary's button stays unguarded, as it
// always was: that attempt is already finished and scored.
function confirmDiscard() {
  return Object.keys(state.answers).length === 0 ||
    typeof confirm !== "function" || confirm(T.new_draw_confirm);
}

function newDraw() {
  if (confirmDiscard()) restart();
}

// ---- attempt length ------------------------------------------------------
// "full" mirrors the real exam's draw; "quick" is a short drill for a spare
// twenty minutes. Switching lengths redraws, so a started attempt asks first.
// Length is meaningless while a domain is focused (the drill holds the whole
// domain bank), so the toggle is disabled there and this is unreachable.
function setLength(length) {
  if (state.focus !== "all") return;
  if (length === state.length) return;
  if (!confirmDiscard()) return;
  state.length = length;
  restart();
}

function updateLengthUI() {
  [["lengthFull", "full", T.length_full], ["lengthQuick", "quick", T.length_quick]]
    .forEach(([id, len, label]) => {
      const btn = document.getElementById(id);
      // The toggle labels always describe the full draw, even mid-drill.
      btn.textContent = label.replace("{n}", examSize(len, "all"));
      btn.classList.toggle("active", state.length === len);
      btn.setAttribute("aria-pressed", String(state.length === len));
      btn.disabled = state.focus !== "all";
    });
  // The weak-spot drill reads its size off the order in play, not off a
  // recomputed draw: answering during the drill adds misses, and the strip
  // must keep describing the attempt the candidate is actually taking.
  const note = state.focus === "misses"
    ? T.misses_note.replace("{n}", state.order.length)
    : (state.focus === "report"
        ? T.report_note.replace("{n}", examSize())
        : (state.focus !== "all"
            ? T.focus_note.replace("{n}", examSize()).replace("{d}", state.focus)
            : (state.length === "quick" ? T.draw_note_quick : T.draw_note_full)
                .replace("{n}", examSize())
                .replace("{bank}", QUESTIONS.length)));
  document.getElementById("drawNote").innerHTML =
    "<span class='dn-icon'>&#10227;</span>" + note +
    (state.focus === "misses"
      ? "<button type='button' class='dn-action' onclick='clearMisses()'>" +
        esc(T.misses_clear) + "</button>"
      : "");
  updateFocusUI();
}

// ---- domain focus ----------------------------------------------------------
// Scoping an attempt to one domain drills its whole bank: every question in
// the domain, shuffled. Switching scope redraws, so a started attempt asks
// first, through the same guard a new draw uses.
function setFocus(focus) {
  if (String(focus) === String(state.focus)) return;
  if (focus === "misses" && missedIds().length === 0) return;
  if (focus === "report" && !reportScores()) return;
  if (!confirmDiscard()) { updateFocusUI(); return; }
  state.focus = focus;
  state.reportSignature = focus === "report" ? reportScoreSignature() : null;
  restart();
}

// ---- weak-spot drill -------------------------------------------------------
// Only the questions this candidate has answered wrong before, most-missed
// first. It is a scope like the domain drill, so it goes through setFocus and
// inherits the discard guard, the disabled length toggle and the raw scoring.
function toggleMisses() {
  setFocus(state.focus === "misses" ? "all" : "misses");
}

function updateMissesUI() {
  const btn = document.getElementById("missesBtn");
  if (!btn) return;
  const n = missedIds().length;
  btn.textContent = n ? T.misses_btn.replace("{n}", n) : T.misses_empty;
  btn.disabled = n === 0 && state.focus !== "misses";
  btn.classList.toggle("active", state.focus === "misses");
  btn.setAttribute("aria-pressed", String(state.focus === "misses"));
}

// Clearing the weak-spot record also ends the attempt in progress: a drill
// scoped to misses that no longer exist is not an attempt anyone can finish.
function clearMisses() {
  if (typeof confirm === "function" && !confirm(T.misses_clear_confirm)) return;
  clearProgress();
}

function clearProgress() {
  const cleared = removeStored("local", MISS_KEY) && removeStored("local", STORE_KEY) &&
    removeStored("session", MISS_KEY) && removeStored("session", STORE_KEY);
  if (!cleared) {
    persistenceUnavailable = true;
    updateModeHint();
  }
  state.answers = {};
  state.graded = {};
  state.current = 0;
  state.focus = "all";
  state.reportSignature = null;
  restart();
}

function fillDomainOptions(sel) {
  if (!sel) return;
  sel.innerHTML = "";
  const all = document.createElement("option");
  all.value = "all";
  all.textContent = T.focus_all;
  sel.appendChild(all);
  if (reportScores()) {
    const report = document.createElement("option");
    report.value = "report";
    report.textContent = T.focus_report;
    sel.appendChild(report);
  }
  Object.keys(DOMAINS).sort((a, b) => a - b).forEach(d => {
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = T.domain + " " + d + " · " + DOMAINS[d].name;
    sel.appendChild(opt);
  });
}

function buildFocusOptions() {
  fillDomainOptions(document.getElementById("focusSelect"));
  fillBrowseOptions(document.getElementById("browseDomain"));
}

function groupKey(q) { return GROUPS ? String(q.group || "") : String(q.domain); }
function groupLabel(key) {
  if (GROUPS) return GROUPS[key] || key;
  const dm = DOMAINS[key] || {};
  return T.domain + " " + key + (dm.name ? " · " + dm.name : "");
}
function groupKeys() {
  if (GROUPS) return Object.keys(GROUPS).sort();
  return Object.keys(DOMAINS).sort((a, b) => a - b);
}

function fillBrowseOptions(sel) {
  if (!sel) return;
  sel.innerHTML = "";
  const all = document.createElement("option");
  all.value = "all";
  all.textContent = GROUPS ? T.browse_all : T.focus_all;
  sel.appendChild(all);
  groupKeys().forEach(k => {
    const opt = document.createElement("option");
    opt.value = k;
    opt.textContent = groupLabel(k);
    sel.appendChild(opt);
  });
}

function updateFocusUI() {
  updateMissesUI();
  const sel = document.getElementById("focusSelect");
  if (!sel) return;
  // Weak-spot and score-report drills are not domains, so the selector has no
  // domain value to show while either focused attempt is active.
  sel.disabled = state.focus === "misses";
  sel.value = state.focus === "misses" ? "all" : String(state.focus);
}

// ---- browse the bank -------------------------------------------------------
// Every question in the bank, filtered by domain and free text, each one
// expandable to its full answer key. Built for ~500 items on a phone: the
// index is computed once, a filter paints one <summary> row per match, and an
// item's options and explanations are rendered only when it is opened.
let BROWSE_INDEX = null;

function browseIndex() {
  if (BROWSE_INDEX) return BROWSE_INDEX;
  // Items that share a stem are imported as a cluster. Counting the cluster up
  // front is what lets each row say which variant of the scenario it is, so a
  // reader who meets the same setup three times knows why.
  const size = {}, seen = {};
  QUESTIONS.forEach(q => { if (q.cluster) size[q.cluster] = (size[q.cluster] || 0) + 1; });
  const ordered = QUESTIONS.slice().sort((a, b) =>
    (GROUPS ? groupKey(a).localeCompare(groupKey(b)) : Number(a.domain) - Number(b.domain)) ||
    String(a.task_id || "").localeCompare(String(b.task_id || ""), undefined, { numeric: true }) ||
    String(a.id).localeCompare(String(b.id), undefined, { numeric: true }));
  BROWSE_INDEX = ordered.map((q, idx) => {
    // Rows are numbered in bank order, not filter order, so "#42" names the
    // same question whatever the reader has typed or scoped to. Typing "#42"
    // in the search box finds it.
    const n = idx + 1;
    // `task_id` is the blueprint subdomain ("3.2"), so typing it finds every
    // item on that objective. The objective *text* is deliberately left out:
    // every item in a domain repeats it, so it would match half the bank on a
    // common word and drown the question the reader was actually looking for.
    const hay = [q.id, q.task_id, q.situation, q.question]
      .concat(q.options.map(o => o.text))
      .concat(q.options.map(o => o.explanation))
      .filter(Boolean).join(" ").toLowerCase();
    const cn = q.cluster ? size[q.cluster] : 0;
    const ci = q.cluster ? (seen[q.cluster] = (seen[q.cluster] || 0) + 1) : 0;
    return { q: q, n: n, hay: hay, ci: ci, cn: cn };
  });
  return BROWSE_INDEX;
}

// Pure, so the filter can be checked without a DOM. Every whitespace-separated
// term must appear somewhere in the item — question, options or explanations.
// A "#42" term names one row exactly, so it does not also surface #420-#429.
function filteredBank(domain, query) {
  if (domain === undefined) domain = state.browse.domain;
  if (query === undefined) query = state.browse.q;
  const terms = String(query || "").toLowerCase().split(/\s+/).filter(Boolean);
  return browseIndex().filter(r =>
    (String(domain) === "all" || groupKey(r.q) === String(domain)) &&
    terms.every(t => /^#\d+$/.test(t) ? String(r.n) === t.slice(1) : r.hay.indexOf(t) >= 0));
}

function browseRowHtml(r) {
  const q = r.q;
  const tags =
    (r.cn > 1
      ? "<span class='br-tag cluster'>" +
        esc(T.cluster_note.replace("{i}", r.ci).replace("{n}", r.cn)) + "</span>" : "");
  // The situation is what tells one row from the next; the ask ("Which
  // approach is most effective?") repeats across the bank, so it is demoted to
  // a subline when a situation exists.
  const lead = q.situation
    ? md(q.situation) + "<span class='br-ask'>" + md(q.question) + "</span>"
    : md(q.question);
  return "<details class='br-item' data-id='" + esc(q.id) + "'>" +
    "<summary class='br-head'>" +
      "<span class='br-id'>#" + r.n + "</span>" +
      "<span class='br-stem'>" + lead + "</span>" +
      "<span class='br-tags'>" + tags + "</span>" +
    "</summary><div class='br-body'></div></details>";
}

// The expensive half: options, correctness marks and every explanation. Kept
// out of the list render so the cost is paid per opened item, not per bank.
function browseBody(id) {
  const q = qById(id);
  if (!q) return "";
  const opts = q.options.map(o =>
    "<div class='br-opt" + (o.correct ? " is-correct" : "") + "'>" +
      "<span class='opt-letter'>" + esc(o.letter) + "</span>" +
      "<span><span class='br-opt-text'>" + md(o.text) +
        (o.correct ? " <span class='wi-correct-tag'>&#10003; " + T.correct + "</span>" : "") +
      "</span>" +
      (o.explanation ? "<div class='br-opt-expl'>" + md(o.explanation) + "</div>" : "") +
      "</span></div>").join("");
  // The head already shows the full situation, so the body starts at the options.
  return (isMulti(q) ? "<div class='q-select'>" + T.select_n.replace("{n}", selectCount(q)) + "</div>" : "") +
    opts;
}

function renderBrowse() {
  const rows = filteredBank();
  const count = document.getElementById("browseCount");
  if (count) {
    count.textContent = T.browse_count.replace("{n}", rows.length)
                                      .replace("{bank}", QUESTIONS.length);
  }
  const list = document.getElementById("browseList");
  if (!list) return;
  list.innerHTML = rows.length
    ? groupedBrowseHtml(rows)
    : "<p class='br-empty'>" + esc(T.browse_none) + "</p>";
  renderToc();
}

// ---- bank navigation ------------------------------------------------------
// The table of contents lists every group and subdomain in the bank with its
// item count, whatever the current filter, so it doubles as a map of coverage.
function tocEntries() {
  const groups = {};
  browseIndex().forEach(r => {
    const g = groupKey(r.q);
    const entry = groups[g] = groups[g] || { key: g, n: 0, subs: {} };
    entry.n += 1;
    if (r.q.task_id) {
      const s = entry.subs[r.q.task_id] = entry.subs[r.q.task_id] ||
        { id: r.q.task_id, name: r.q.objective || "", n: 0 };
      s.n += 1;
    }
  });
  return Object.keys(groups).map(k => groups[k]);
}

function renderToc() {
  const toc = document.getElementById("bankToc");
  if (!toc) return;
  const cur = state.browse;
  toc.innerHTML = tocEntries().map(g =>
    "<button type='button' class='toc-group" + (String(cur.domain) === g.key ? " active" : "") +
      "' onclick=\"gotoGroup('" + esc(g.key) + "')\">" + esc(groupLabel(g.key)) + "</button>" +
    Object.keys(g.subs).sort((a, b) => a.localeCompare(b, undefined, { numeric: true })).map(id => {
      const s = g.subs[id];
      return "<a class='toc-sub" + (cur.sub === id ? " active" : "") + "' id='toc-" + esc(id) + "' href='#" + esc(id) +
        "' onclick=\"gotoSub('" + esc(id) + "'); return false;\" title='" + esc(s.name) + "'>" +
        "<span class='toc-id'>" + esc(id) + "</span><span>" + esc(s.name) + "</span>" +
        "<span class='toc-n'>" + s.n + "</span></a>";
    }).join("")).join("");
}

function setHash(h) {
  if (typeof history !== "undefined" && history.replaceState) {
    try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch (e) {}
  }
}

// A group link scopes the list to that group; a subdomain link scopes to its
// group and scrolls to its heading. Either is a shareable URL: #A or #1.5.
function gotoGroup(key) {
  state.browse.sub = null;
  setBrowseDomain(key);
  setHash(key === "all" ? "" : key);
}

function gotoSub(id) {
  const owner = browseIndex().find(r => r.q.task_id === id);
  if (!owner) return;
  state.browse.sub = id;
  setBrowseDomain(groupKey(owner.q));
  setHash(id);
  // Scroll the list pane itself: the sticky group heading sits at its top,
  // so the subheading needs to land just below it, not under it.
  const h = document.getElementById("s-" + id);
  const pane = h && h.closest ? h.closest(".content") : null;
  if (h && pane && h.getBoundingClientRect) {
    const top = h.getBoundingClientRect().top - pane.getBoundingClientRect().top + pane.scrollTop;
    pane.scrollTop = Math.max(0, top - 88);
  }
  const active = document.getElementById("toc-" + id);
  if (active && typeof active.scrollIntoView === "function") active.scrollIntoView({ block: "nearest" });
}

function applyHash() {
  if (typeof location === "undefined") return;
  const h = decodeURIComponent((location.hash || "").slice(1));
  if (!h) return;
  if (groupKeys().indexOf(h) >= 0) gotoGroup(h);
  else gotoSub(h);
}

// Domain heading, then one subheading per blueprint subdomain (task_id) for
// banks that carry them. Order is bank order, which is already domain-sorted.
function groupedBrowseHtml(rows) {
  const out = [];
  let dom = null, sub = null;
  rows.forEach(r => {
    const q = r.q;
    if (groupKey(q) !== dom) {
      dom = groupKey(q); sub = null;
      out.push("<h2 class='br-group' id='g-" + esc(dom) + "'>" + esc(groupLabel(dom)) + "</h2>");
    }
    if (q.task_id && q.task_id !== sub) {
      sub = q.task_id;
      const n = rows.filter(x => x.q.task_id === sub && groupKey(x.q) === dom).length;
      out.push("<h3 class='br-sub' id='s-" + esc(sub) + "'><span class='br-id'>" + esc(sub) + "</span>" +
               (q.objective ? "<span>" + esc(q.objective) + "</span>" : "") +
               "<span class='br-n'>" + n + "</span>" +
               "<a class='br-anchor' href='#" + esc(sub) + "' title='" + esc(T.bank_link) + "'>#</a></h3>");
    }
    out.push(browseRowHtml(r));
  });
  return out.join("");
}

// One delegated listener for the whole list, so 500 rows cost 500 strings and
// no handlers. `toggle` does not bubble, hence the capture phase.
function wireBrowse() {
  const list = document.getElementById("browseList");
  if (!list || list.__wired || typeof list.addEventListener !== "function") return;
  list.__wired = true;
  list.addEventListener("toggle", ev => {
    const d = ev.target;
    if (!d || !d.open || !d.getAttribute) return;
    const body = d.lastElementChild;
    if (body && !body.innerHTML) body.innerHTML = browseBody(d.getAttribute("data-id"));
  }, true);
}

function setBrowseDomain(d) {
  state.browse.domain = d;
  const sel = document.getElementById("browseDomain");
  if (sel) sel.value = d;
  renderBrowse();
}

// The search box repaints the list, so it waits for a pause in typing. On a
// phone that is the difference between a smooth field and a stuttering one.
let browseTimer = null;
function onBrowseSearch(v) {
  state.browse.q = v;
  if (typeof setTimeout !== "function") { renderBrowse(); return; }
  if (browseTimer) clearTimeout(browseTimer);
  browseTimer = setTimeout(renderBrowse, 120);
}

function toggleBrowse() {
  const screen = document.getElementById("browseScreen");
  if (screen && screen.classList.contains("active")) { goto(state.current); return; }
  showScreen("browseScreen");
  wireBrowse();
  renderBrowse();
}

// ---- summary -------------------------------------------------------------
function showSummary() {
  showScreen("summaryScreen");

  // Only the questions in this attempt (PER_DOMAIN per domain) count. The
  // review pane lists every item that did not score, including the ones left
  // blank or half-picked: those count as incorrect, so they need a rationale.
  const active = orderedQuestions();
  const tally = tallyAttempt(active, state.answers);
  // Scoring is the grading a candidate sees in exam mode, so the weak-spot
  // record is written here. noteResult() skips anything study mode already
  // counted, so finishing after answering cannot double-count an item.
  active.forEach(q => noteResult(q, state.answers[q.id]));
  save();
  updateMissesUI();
  const total = tally.total, answered = tally.answered, correct = tally.correct;
  const wrong = tally.wrong, unanswered = tally.unanswered;
  const domStat = tally.domStat, wrongByDomain = tally.wrongByDomain;

  const pct = total ? Math.round(correct / total * 100) : 0;
  const score = total ? Math.round(correct / total * 1000) : 0; // scaled to 1000
  const passed = score >= PASS_SCORE;
  // A domain drill covers one domain only, so the 100–1000 scaled score and
  // its pass/fail verdict would mislead: the summary reports the raw domain
  // result instead, with the same review pane below.
  const drilling = state.focus !== "all";
  const weak = state.focus === "misses";

  // What this attempt was scoped to, in the scope's own words — the sentence
  // is repeated under the score and again at the foot of the review pane.
  const scopeNote = weak
    ? T.misses_note.replace("{n}", total)
    : (state.focus === "report"
        ? T.report_note.replace("{n}", total)
        : T.focus_note.replace("{n}", total).replace("{d}", state.focus));

  let domainScoresHtml = "";
  Object.keys(domStat).sort((a, b) => a - b).forEach(d => {
    const s = domStat[d], dm = DOMAINS[d];
    const dpct = s.total ? Math.round(s.correct / s.total * 100) : 0;
    const barCls = dpct >= PASS_PCT ? "" : (dpct >= 50 ? "low" : "bad");
    domainScoresHtml +=
      "<div class='ds-row'>" +
        "<div class='ds-name'>" + T.domain + " " + d + " · " + esc(dm.name) +
          " <small>(" + dm.weight + "% " + T.weight + ")</small></div>" +
        "<div class='ds-bar'><div class='" + barCls + "' style='width:" + dpct + "%'></div></div>" +
        "<div class='ds-pct'>" + s.correct + "/" + s.total + " · " + dpct + "%</div>" +
      "</div>";
  });

  let wrongGroupsHtml = "";
  Object.keys(wrongByDomain).sort((a, b) => a - b).forEach(d => {
    const items = wrongByDomain[d], dm = DOMAINS[d];
    const rows = items.map(item => {
      // Both shapes resolve to a list of letters, so a multi item shows every
      // letter it needed and every letter the candidate actually picked.
      const optText = letters => letters
        .map(L => { const o = item.q.options.find(x => x.letter === L); return o ? md(o.text) : ""; })
        .filter(Boolean).join("<br>");
      const chosenLetters = asLetters(item.chosen);
      const correctLetters = asLetters(item.q.correct);
      // One block per correct letter. Joining them into a single paragraph left
      // the reader unable to tell which rationale explained which letter.
      const expl = correctLetters.map(L => {
        const o = item.q.options.find(x => x.letter === L);
        return (o && o.explanation)
          ? "<div class='wi-expl'><strong>" + T.why + " " + L + ":</strong> " + md(o.explanation) + "</div>"
          : "";
      }).join("");
      // Nothing picked reads as "Not answered" rather than an empty dash; a
      // half-picked multi item shows its letters and says it is incomplete.
      const yours = chosenLetters.length
        ? "<span class='wi-wrong-tag'>" + letterLabel(chosenLetters) + "</span>" +
          (item.verdict === "incomplete"
            ? " <span class='wi-wrong-tag'>(" + T.incomplete_answer + ")</span>" : "") +
          " — " + optText(chosenLetters)
        : "<span class='wi-wrong-tag'>" + T.not_answered + "</span>";
      return "<div class='wrong-item'>" +
        "<div class='wi-n'>" + esc(item.q.id).toUpperCase() + "</div>" +
        "<div class='wi-q'>" +
          (item.q.situation ? "<div class='wi-situation'>" + md(item.q.situation) + "</div>" : "") +
          "<div class='wi-prompt'>" + md(item.q.question) + "</div>" +
          "<div class='wi-ans'>" + T.your_answer + ": " + yours + "<br>" +
            T.correct + ": <span class='wi-correct-tag'>" + letterLabel(correctLetters) + "</span> — " +
            optText(correctLetters) + "</div>" + expl +
        "</div></div>";
    }).join("");
    wrongGroupsHtml += "<div class='group-block'><div class='group-title'>" +
      T.domain + " " + d + " · " + esc(dm.name) +
      "<span class='group-badge'>" + items.length + " " + T.incorrect + "</span></div>" + rows + "</div>";
  });

  const unansweredNote = unanswered > 0
    ? "<p style='color:#e53e3e;font-size:14px;margin-bottom:18px;font-weight:600;'>" +
      T.unanswered.replace("{n}", unanswered) + "</p>" : "";

  // Raw-only head for a drill; the scaled head for a full draw.
  const headHtml = drilling
    ? "<div class='score-grid'>" +
        "<div class='score-card total'><div class='big'>" + correct + "/" + total + "</div>" +
          "<div class='label'>" +
            (weak ? T.misses_score : (state.focus === "report" ? T.report_score : T.drill_score.replace("{d}", state.focus))) +
            " · " + pct + "%</div></div>" +
        "<div class='score-card correct-c'><div class='big'>" + correct + "</div>" +
          "<div class='label'>" + T.correct + "</div></div>" +
        "<div class='score-card wrong-c'><div class='big'>" + (wrong + unanswered) + "</div>" +
          "<div class='label'>" + T.incorrect + "</div></div>" +
      "</div>" +
      "<p class='threshold-note'>" + scopeNote + "</p>"
    : "<div class='verdict " + (passed ? "pass" : "fail") + "'>" + (passed ? T.pass : T.fail) + "</div>" +
      unansweredNote +
      "<div class='score-grid'>" +
        "<div class='score-card total'><div class='big'>" + score +
          "<span style='font-size:18px;color:#a0aec0;font-weight:700;'>/1000</span></div>" +
          "<div class='label'>" + T.score + "</div></div>" +
        "<div class='score-card correct-c'><div class='big'>" + correct + "</div><div class='label'>" + T.correct + "</div></div>" +
        "<div class='score-card wrong-c'><div class='big'>" + (wrong + unanswered) + "</div><div class='label'>" + T.incorrect + "</div></div>" +
      "</div>" +
      "<p class='threshold-note'>" +
        (state.length === "quick" ? T.threshold_note_quick : T.threshold_note)
          .replace("{p}", PASS_SCORE) + "</p>";

  // In a drill the unanswered warning still matters, so it comes back below
  // the head: the raw branch above skips it, prepending it here keeps both
  // heads honest without duplicating it in the full-draw branch.
  const drillUnanswered = (drilling && unanswered > 0) ? unansweredNote : "";

  document.getElementById("summaryContent").innerHTML =
    "<h1>" + T.complete + "</h1>" +
    "<p class='summary-subtitle'>" + T.answered_of.replace("{a}", answered).replace("{t}", total) + "</p>" +
    headHtml + drillUnanswered +
    "<div class='section-title'>" + T.by_domain + "</div>" +
    "<div class='domain-scores'>" + domainScoresHtml + "</div>" +
    ((wrong + unanswered) > 0
      ? "<div class='section-title'>" + T.review_wrong + "</div>" + wrongGroupsHtml
      : "<p style='color:#38a169;font-weight:700;font-size:17px;'>" + T.all_correct + "</p>") +
    "<div class='rotate-note'><span class='dn-icon'>&#10227;</span>" +
      (drilling ? scopeNote
                : T.summary_rotate.replace("{n}", total).replace("{bank}", QUESTIONS.length)) + "</div>" +
    "<button type='button' class='restart-btn' onclick='restart()'>" + T.restart + "</button>";
}

function restart() {
  state.answers = {};
  // A fresh attempt has graded nothing yet, so every item in it can record a
  // miss again — that is what makes a repeated mistake count twice.
  state.graded = {};
  state.current = 0;
  state.order = shuffleOrder();
  if (!state.order.length && state.focus !== "all") {
    state.focus = "all";
    state.order = shuffleOrder();
  }
  save();
  updateLengthUI();
  buildSidebar();
  showScreen("questionScreen");
  renderQuestion(0);
  updateSidebar();
}

// ---- init ----------------------------------------------------------------
(function init() {
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener("storage", onReportStorageChange);
  }
  if (BANK_ONLY) {
    fillBrowseOptions(document.getElementById("browseDomain"));
    showScreen("browseScreen");
    wireBrowse();
    renderBrowse();
    applyHash();
    if (typeof window !== "undefined" && window.addEventListener) {
      window.addEventListener("hashchange", applyHash);
    }
    return;
  }
  buildFocusOptions();
  const saved = load();
  if (saved) {
    state.answers = saved.answers || {};
    state.order = saved.order;
    state.mode = saved.mode || "study";
    // load() normalized the length, so a pre-quick payload restores as "full".
    state.length = saved.length;
    // Same for the focus: a pre-drill payload restores as the full draw.
    state.focus = saved.focus;
    state.reportSignature = saved.reportSignature || null;
    state.graded = saved.graded || {};
    state.current = Math.min(saved.current || 0, state.order.length - 1);
  } else {
    if (reportScores()) {
      state.focus = "report";
      state.reportSignature = reportScoreSignature();
    }
    state.order = shuffleOrder();
  }
  setMode(state.mode);
  updateLengthUI();
  buildSidebar();
  renderQuestion(state.current);
  updateSidebar();
})();
</script>
</body>
</html>
