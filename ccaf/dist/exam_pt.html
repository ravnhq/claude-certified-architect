orrect": false, "explanation": "Possível, mas trabalhoso — ela teria que caçar o UUID quando já tem o nome da sessão."}, {"letter": "C", "text": "Usar `--continue` para retomar de onde a conversa mais recente parou", "correct": false, "explanation": "`--continue` retoma a sessão mais recente neste repositório. Ela trabalhou em outras três bases de código desde então, então a mais recente não é a auth-deep-dive."}, {"letter": "D", "text": "Usar `--resume` auth-deep-dive para carregar essa sessão específica pelo nome", "correct": true, "explanation": "Correto. `--resume` com o nome da sessão foi projetado exatamente para isso: escolher uma sessão anterior específica dentre muitas, pelo nome que você deu a ela."}], "correct": "D", "task_id": "1.7", "objective": "Manage session state, resumption, and forking", "group": "A"}, {"id": "g17", "domain": 4, "scenario": "Claude Code para Integração Contínua", "situation": "Seu time usa Claude Code para gerar sugestões de código, mas você nota um padrão: questões não-óbvias — otimizações de performance que quebram casos de borda, limpezas que mudam comportamento inesperadamente — só são pegas quando outro membro do time revisa o PR. O raciocínio do Claude durante a geração mostra que ele considerou esses casos mas concluiu que sua abordagem estava correta. Qual abordagem aborda diretamente a causa-raiz dessa limitação de auto-checagem?", "question": "Qual abordagem aborda diretamente a causa-raiz?", "options": [{"letter": "A", "text": "Rodar uma segunda instância independente do Claude Code para revisar as mudanças sem acesso ao raciocínio do gerador.", "correct": true, "explanation": "Uma segunda instância independente do Claude Code sem acesso ao raciocínio do gerador ataca diretamente a causa-raiz evitando viés de confirmação. Essa perspectiva de \"olhos novos\" espelha a peer review humana, em que outro revisor pega problemas que o autor racionalizou."}, {"letter": "B", "text": "Habilitar modo de extended thinking na geração para permitir deliberação mais minuciosa antes de produzir sugestões.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Adicionar instruções explícitas de auto-review ao prompt de geração pedindo que Claude critique suas próprias sugestões antes de finalizar.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Incluir arquivos de teste e documentação completos no contexto do prompt para que Claude entenda melhor o comportamento esperado durante a geração.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "4.6", "objective": "Design multi-instance and multi-pass review architectures", "group": "F"}, {"id": "g19", "domain": 4, "scenario": "Claude Code para Integração Contínua", "situation": "Seu sistema CI/CD roda três análises baseadas em Claude: (1) checagens rápidas de estilo em todo PR que bloqueiam o merge até concluir, (2) auditorias semanais e abrangentes de segurança em toda a base, e (3) geração noturna de casos de teste para módulos recém-modificados. A Message Batches API oferece 50% de economia, mas o processamento pode levar até 24 horas. Você quer otimizar custo de API mantendo experiência aceitável para devs. Qual combinação casa corretamente cada tarefa com uma abordagem de API?", "question": "Qual combinação está correta?", "options": [{"letter": "A", "text": "Use a Message Batches API para todas as três tarefas para maximizar a economia de 50%, configurando o pipeline para fazer polling até a conclusão dos lotes.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Use chamadas síncronas para checagens de estilo em PR; use a Message Batches API para auditorias semanais de segurança e geração noturna de testes.", "correct": true, "explanation": "Checagens de estilo em PR bloqueiam devs e exigem respostas imediatas via síncronas, enquanto auditorias semanais e geração noturna de testes são tarefas agendadas com prazos flexíveis que toleram a janela de até 24 horas — capturando 50% de economia em ambas."}, {"letter": "C", "text": "Use chamadas síncronas para todas para tempos de resposta consistentes, contando com prompt caching para reduzir custos.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Use chamadas síncronas para checagens de estilo em PR e geração noturna de testes; use a Message Batches API apenas para auditorias semanais.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "4.5", "objective": "Design efficient batch processing strategies", "group": "H"}, {"id": "g20", "domain": 4, "scenario": "Claude Code para Integração Contínua", "situation": "Suas reviews automatizadas encontram problemas reais, mas devs reportam que o feedback não é acionável. Achados incluem frases como \"lógica complexa de roteamento de tickets\" ou \"potencial null pointer\" sem especificar o que exatamente mudar. Quando você adiciona instruções detalhadas como \"sempre inclua sugestões concretas de correção\", o modelo ainda produz saída inconsistente — às vezes detalhada, às vezes vaga. Qual técnica de prompting produz feedback consistentemente acionável de forma mais confiável?", "question": "Qual técnica de prompting é mais confiável?", "options": [{"letter": "A", "text": "Refinar mais as instruções com requisitos mais explícitos para cada parte do formato de feedback (location, issue, severity, proposed fix).", "correct": false, "explanation": ""}, {"letter": "B", "text": "Expandir a janela de contexto para incluir mais código adjacente para que o modelo tenha informação suficiente para propor correções concretas.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Implementar uma abordagem em duas passagens em que um prompt identifica problemas e outro gera correções, permitindo especialização.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Adicionar 3–4 exemplos few-shot mostrando o formato exato exigido: problema identificado, localização no código, sugestão concreta de correção.", "correct": true, "explanation": "Exemplos few-shot são a técnica mais efetiva para alcançar formato consistente quando instruções sozinhas produzem resultados variáveis. Fornecer 3–4 exemplos que mostram a estrutura desejada (issue, location, concrete fix) dá ao modelo um padrão concreto a seguir, mais confiável que instruções abstratas."}], "correct": "D", "task_id": "3.5", "objective": "Apply iterative refinement techniques for progressive improvement", "group": "I"}, {"id": "g21", "domain": 4, "scenario": "Claude Code para Integração Contínua", "situation": "Seu pipeline CI inclui dois modos de code review baseados em Claude: um hook pré-merge-commit que bloqueia o merge do PR até concluir, e uma \"análise profunda\" que roda à noite, faz polling até concluir o lote e posta sugestões detalhadas no PR. Você quer reduzir custo de API usando a Message Batches API, que oferece 50% de economia mas exige polling e pode levar até 24 horas. Qual modo deveria usar processamento em lote?", "question": "Qual modo deveria usar processamento em lote?", "options": [{"letter": "A", "text": "Apenas o hook pré-merge-commit.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Apenas a análise profunda.", "correct": true, "explanation": "Análise profunda é candidata ideal para processamento em lote porque já roda à noite, tolera atraso e usa um modelo de polling antes de publicar resultados — o que casa com a arquitetura assíncrona baseada em polling da Message Batches API enquanto captura 50% de economia."}, {"letter": "C", "text": "Ambos os modos.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Nenhum dos modos.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "4.5", "objective": "Design efficient batch processing strategies", "group": "H"}, {"id": "g22", "domain": 4, "scenario": "Claude Code para Integração Contínua", "situation": "Sua review automatizada analisa comentários e docstrings. O prompt atual instrui Claude a \"verificar que comentários estão precisos e atualizados\". Achados frequentemente sinalizam padrões aceitáveis (marcadores TODO, descrições simples) enquanto perdem comentários que descrevem comportamento que o código não implementa mais. Qual mudança ataca a causa-raiz dessa análise inconsistente?", "question": "Qual mudança ataca a causa-raiz?", "options": [{"letter": "A", "text": "Incluir dados de `git blame` para que Claude possa identificar comentários anteriores a mudanças recentes de código.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Adicionar exemplos few-shot de comentários enganosos para ajudar o modelo a reconhecer padrões similares na base.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Filtrar TODO, FIXME e padrões de comentários descritivos antes da análise para reduzir ruído.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Especificar critérios explícitos: marcar comentários apenas quando o comportamento que afirmam contradiz o comportamento real do código.", "correct": true, "explanation": "Critérios explícitos — marcar comentários apenas quando o comportamento afirmado contradiz o comportamento real do código — atacam diretamente a causa-raiz substituindo uma instrução vaga por uma definição precisa do que constitui um problema. Isso reduz falsos positivos em padrões aceitáveis e perdas de comentários genuinamente enganosos."}], "correct": "D", "task_id": "4.1", "objective": "Design prompts with explicit criteria to improve precision and reduce false positives", "group": "I"}, {"id": "g23", "domain": 4, "scenario": "Claude Code para Integração Contínua", "situation": "Seu sistema de code review automatizado mostra severidades inconsistentes — questões similares como riscos de null pointer são classificadas \"critical\" em alguns PRs mas só \"medium\" em outros. Pesquisas com devs mostram desconfiança crescente — muitos começam a descartar achados sem ler porque \"metade está errada\". Categorias com altas taxas de falsos positivos minam a confiança em categorias acuradas. Qual abordagem melhor restaura a confiança dos devs enquanto melhora o sistema?", "question": "Qual abordagem melhor restaura a confiança dos devs?", "options": [{"letter": "A", "text": "Desabilitar temporariamente categorias de alto FP (estilo, naming, documentação) e manter apenas categorias de alta precisão enquanto melhora os prompts.", "correct": true, "explanation": "Desabilitar temporariamente categorias com alto FP interrompe imediatamente a erosão de confiança removendo achados ruidosos que levam devs a descartar tudo, preservando valor de categorias de alta precisão como segurança e correção. Também cria espaço para melhorar prompts das categorias problemáticas antes de reabilitá-las."}, {"letter": "B", "text": "Manter todas as categorias mas exibir scores de confiança junto a cada achado para que devs decidam o que investigar.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Manter todas as categorias e adicionar exemplos few-shot para melhorar a acurácia em cada categoria nas próximas semanas.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Aplicar uma redução uniforme de rigor em todas as categorias para baixar a taxa geral de FP.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "4.1", "objective": "Design prompts with explicit criteria to improve precision and reduce false positives", "group": "I"}, {"id": "g24", "domain": 4, "scenario": "Claude Code para Integração Contínua", "situation": "Sua review automatizada gera sugestões de casos de teste para cada PR. Revisando um PR que adiciona tracking de conclusão de curso, Claude sugere 10 casos de teste, mas o feedback dos devs mostra que 6 duplicam cenários já cobertos pela suíte de testes existente. Qual mudança reduz duplicação de forma mais efetiva?", "question": "Qual mudança é mais efetiva?", "options": [{"letter": "A", "text": "Incluir o arquivo de teste existente no contexto para que Claude possa determinar quais cenários já estão cobertos.", "correct": true, "explanation": "Incluir o arquivo de teste existente corrige a causa-raiz da duplicação: Claude só pode evitar sugerir cenários já cobertos se souber quais testes já existem. Isso dá a Claude a informação necessária para propor testes genuinamente novos e valiosos."}, {"letter": "B", "text": "Reduzir o número solicitado de sugestões de 10 para 5, assumindo que Claude prioriza os casos mais valiosos primeiro.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Adicionar instruções direcionando Claude a focar exclusivamente em casos de borda e condições de erro em vez de caminhos felizes.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Implementar pós-processamento que filtra sugestões cujas descrições casam com nomes de testes existentes via sobreposição de palavras-chave.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "3.5", "objective": "Apply iterative refinement techniques for progressive improvement", "group": "I"}, {"id": "g25", "domain": 4, "scenario": "Claude Code para Integração Contínua", "situation": "Após uma review automatizada inicial identificar 12 achados, um dev faz push de novos commits para tratar os problemas. Re-rodar a review produz 8 achados, mas devs reportam que 5 duplicam comentários anteriores em código que já foi corrigido nos novos commits. Qual é a forma mais efetiva de eliminar esse feedback redundante mantendo a profundidade?", "question": "Qual é a forma mais efetiva de eliminar feedback redundante?", "options": [{"letter": "A", "text": "Rodar review apenas quando o PR é criado e no estado final pré-merge, pulando commits intermediários.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Adicionar um filtro de pós-processamento que remove achados que casam com anteriores por path e descrição antes de postar comentários.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Restringir o escopo da review aos arquivos alterados no push mais recente, excluindo arquivos de commits anteriores.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Incluir achados de reviews anteriores no contexto e instruir Claude a reportar apenas problemas novos ou ainda não resolvidos.", "correct": true, "explanation": "Incluir achados de reviews anteriores no contexto deixa Claude distinguir problemas novos dos já tratados em commits recentes. Isso preserva profundidade da review enquanto usa o raciocínio do Claude para evitar feedback redundante em código já corrigido."}], "correct": "D", "task_id": "4.1", "objective": "Design prompts with explicit criteria to improve precision and reduce false positives", "group": "I"}, {"id": "g27", "domain": 4, "scenario": "Claude Code para Integração Contínua", "situation": "Um pull request altera 14 arquivos em um módulo de tracking de inventário. Uma review de única passagem que analisa todos os arquivos juntos produz resultados inconsistentes: feedback detalhado em alguns arquivos mas comentários superficiais em outros, bugs óbvios não detectados e feedback contraditório (um padrão é marcado em um arquivo mas código idêntico aprovado em outro arquivo no mesmo PR). Como reestruturar a review?", "question": "Como reestruturar a review?", "options": [{"letter": "A", "text": "Rodar três passagens independentes de review do PR completo e marcar apenas problemas que aparecem em pelo menos duas das três execuções.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Dividir em passagens focadas: revisar cada arquivo individualmente para problemas locais, depois rodar uma passagem separada orientada a integração para examinar fluxos de dados cross-file.", "correct": true, "explanation": "Passagens focadas por arquivo atacam a causa-raiz — diluição de atenção — garantindo profundidade consistente e detecção confiável de problemas locais. Uma passagem separada de integração cobre questões cross-file como dependências e interações de fluxo de dados."}, {"letter": "C", "text": "Exigir que devs dividam PRs grandes em submissões menores de 3–4 arquivos antes de rodar review automatizada.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Mudar para um modelo maior com janela de contexto maior para que ele possa atender suficientemente todos os 14 arquivos em uma passagem.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "4.6", "objective": "Design multi-instance and multi-pass review architectures", "group": "F"}, {"id": "g28", "domain": 4, "scenario": "Claude Code para Integração Contínua", "situation": "Sua review automatizada média 15 achados por PR e devs reportam taxa de FP de 40%. O gargalo é tempo de investigação: devs precisam clicar em cada achado para ler a justificativa do Claude antes de decidir corrigir ou descartar. Seu CLAUDE.md já contém regras abrangentes para padrões aceitáveis e stakeholders rejeitaram qualquer abordagem que filtre achados antes de devs verem. Qual mudança melhor ataca o tempo de investigação?", "question": "Qual mudança ataca melhor o tempo de investigação?", "options": [{"letter": "A", "text": "Exigir que Claude inclua sua justificativa e estimativa de confiança diretamente em cada achado.", "correct": true, "explanation": "Incluir justificativa e confiança diretamente em cada achado reduz tempo de investigação ao deixar devs triar rapidamente sem abrir cada achado. Satisfaz a restrição de \"não filtrar\" porque todos os achados permanecem visíveis enquanto acelera a tomada de decisão."}, {"letter": "B", "text": "Adicionar um pós-processador que analisa padrões de achados e suprime automaticamente os que casam com assinaturas históricas de FP.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Categorizar achados como \"blocking issues\" vs \"suggestions\", com requisitos de revisão diferentes por nível.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Configurar Claude para mostrar apenas achados de alta confiança, filtrando flags incertas antes de devs verem.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "4.6", "objective": "Design multi-instance and multi-pass review architectures", "group": "F"}, {"id": "g29", "domain": 4, "scenario": "Claude Code para Integração Contínua", "situation": "A análise da sua review automatizada de código mostra grandes diferenças nas taxas de falsos positivos por categoria de achado: achados de segurança/correção têm 8% de FP, performance 18%, estilo/naming 52% e documentação 48%. Pesquisas com devs mostram desconfiança crescente — muitos começam a descartar achados sem ler porque \"metade está errada\". Categorias de alto FP minam a confiança em categorias acuradas. Qual abordagem melhor restaura a confiança dos devs enquanto melhora o sistema?", "question": "Qual abordagem melhor restaura a confiança dos devs?", "options": [{"letter": "A", "text": "Desabilitar temporariamente categorias de alto FP (estilo, naming, documentação) e manter apenas categorias de alta precisão enquanto melhora os prompts.", "correct": true, "explanation": "Desabilitar temporariamente categorias com alto FP interrompe imediatamente a erosão de confiança removendo achados ruidosos que levam devs a descartar tudo, preservando valor de categorias de alta precisão como segurança e correção. Também cria espaço para melhorar prompts das categorias problemáticas antes de reabilitá-las."}, {"letter": "B", "text": "Manter todas as categorias mas exibir scores de confiança junto a cada achado para que devs decidam o que investigar.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Manter todas as categorias e adicionar exemplos few-shot para melhorar a acurácia em cada categoria nas próximas semanas.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Aplicar uma redução uniforme de rigor em todas as categorias para baixar a taxa geral de FP.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "4.1", "objective": "Design prompts with explicit criteria to improve precision and reduce false positives", "group": "I"}, {"id": "g30", "domain": 4, "scenario": "Claude Code para Integração Contínua", "situation": "Seu time quer reduzir custos de API para análise automatizada. Atualmente, chamadas síncronas ao Claude atendem dois fluxos: (1) checagem bloqueante pré-merge que precisa concluir antes de devs poderem mergear, e (2) relatório de tech-debt gerado de noite para revisão na manhã seguinte. Seu gerente propõe mover ambos para a Message Batches API para economizar 50%. Como avaliar essa proposta?", "question": "Como avaliar essa proposta?", "options": [{"letter": "A", "text": "Mover ambos para processamento em lote com fallback para chamadas síncronas se os lotes demorarem demais.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Mover ambos os fluxos para processamento em lote com polling de status para verificar conclusão.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Use processamento em lote apenas para relatórios de tech-debt; mantenha chamadas síncronas para checagens pré-merge.", "correct": true, "explanation": "O processamento da Message Batches API pode levar até 24 horas sem SLA de latência, o que é aceitável para relatórios de tech-debt noturnos mas inaceitável para checagens pré-merge bloqueantes em que devs esperam. Isso casa cada fluxo com a API certa baseada em requisitos de latência."}, {"letter": "D", "text": "Manter chamadas síncronas para ambos os fluxos para evitar problemas com ordenação de resultados em lote.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "4.5", "objective": "Design efficient batch processing strategies", "group": "H"}, {"id": "g31", "domain": 4, "scenario": "Geração de Código com Claude Code", "situation": "Você pediu ao Claude Code para implementar uma função que transforma respostas de API em um formato interno normalizado. Após duas iterações, a estrutura de saída ainda não casa com as expectativas — alguns campos são aninhados de modo diferente e timestamps formatados incorretamente. Você descreveu requisitos em prosa, mas Claude os interpreta de forma diferente a cada vez.", "question": "Qual abordagem é mais efetiva para a próxima iteração?", "options": [{"letter": "A", "text": "Escrever um JSON schema descrevendo a estrutura de saída esperada e validar a saída do Claude contra ele após cada iteração.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Fornecer 2–3 exemplos concretos de entrada-saída mostrando a transformação esperada para respostas representativas da API.", "correct": true, "explanation": "Exemplos concretos de entrada-saída removem a ambiguidade inerente a descrições em prosa mostrando a Claude o resultado exato esperado da transformação. Isso ataca diretamente a causa-raiz — interpretação errada de requisitos textuais — fornecendo padrões inequívocos para aninhamento e formatação de timestamp."}, {"letter": "C", "text": "Reescrever requisitos com mais precisão técnica, especificando mapeamentos exatos de campos, regras de aninhamento e strings de formato de timestamp.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Pedir ao Claude para explicar seu entendimento atual dos requisitos para identificar onde as interpretações divergem.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "3.5", "objective": "Apply iterative refinement techniques for progressive improvement", "group": "I"}, {"id": "g49", "domain": 4, "scenario": "Agente de Suporte ao Cliente", "situation": "Seu agente atinge 55% de resolução no primeiro contato, bem abaixo da meta de 80%. Logs mostram que ele escala casos simples (substituições padrão para mercadorias danificadas com prova fotográfica) enquanto tenta lidar autonomamente com situações complexas que exigem exceções de política. Qual é a forma mais efetiva de melhorar a calibração de escalonamento?", "question": "Qual é a forma mais efetiva de melhorar a calibração?", "options": [{"letter": "A", "text": "Exigir que o agente auto-classifique confiança em escala 1–10 antes de cada resposta e roteie automaticamente para humanos quando a confiança cair abaixo de um limiar.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Implantar um modelo classificador separado treinado em tickets históricos para prever quais pedidos precisam de escalonamento antes de o agente principal começar.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Adicionar critérios explícitos de escalonamento ao system prompt com exemplos few-shot mostrando quando escalar vs resolver autonomamente.", "correct": true, "explanation": "Critérios explícitos de escalonamento com exemplos few-shot atacam diretamente a causa-raiz — limites de decisão pouco claros entre casos simples e complexos. É a primeira intervenção mais proporcional e efetiva, ensinando o agente quando escalar e quando resolver autonomamente sem infraestrutura extra."}, {"letter": "D", "text": "Implementar análise de sentimento para determinar nível de frustração do cliente e escalar automaticamente acima de um limiar de sentimento negativo.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "5.2", "objective": "Design effective escalation and ambiguity resolution patterns", "group": "C"}, {"id": "g52", "domain": 4, "scenario": "Agente de Suporte ao Cliente", "situation": "Métricas de produção mostram que ao resolver disputas complexas de cobrança ou devoluções multi-pedido, scores de satisfação do cliente são 15% menores que para casos simples — mesmo quando a resolução está tecnicamente correta. Análise de causa-raiz mostra que o agente fornece soluções acuradas mas explica a justificativa de forma inconsistente: às vezes omitindo detalhes relevantes de política, às vezes perdendo info de timeline ou próximos passos. As lacunas de contexto variam caso a caso. Você quer melhorar qualidade da solução sem adicionar supervisão humana. Qual abordagem é mais efetiva?", "question": "Qual abordagem é mais efetiva?", "options": [{"letter": "A", "text": "Adicionar uma etapa de auto-crítica em que o agente avalia uma resposta de rascunho quanto à completude — garantindo que resolva o problema, inclua contexto relevante e antecipe perguntas de follow-up.", "correct": true, "explanation": "Uma etapa de auto-crítica (padrão evaluator-optimizer) ataca diretamente a completude inconsistente das explicações forçando o agente a avaliar seu próprio rascunho contra critérios concretos — como contexto de política, timelines e próximos passos — antes de apresentá-lo. Isso captura lacunas específicas do caso sem supervisão humana."}, {"letter": "B", "text": "Adicionar uma etapa de confirmação em que o agente pergunta \"Isso resolve totalmente seu problema?\" antes de fechar, permitindo que clientes peçam informações adicionais.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Atualizar o modelo de Haiku para Sonnet em casos complexos, roteando com base em uma métrica de complexidade definida.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Implementar exemplos few-shot no system prompt mostrando explicações completas para cinco tipos comuns de casos complexos, demonstrando como incluir contexto de política, timelines e próximos passos.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "3.5", "objective": "Apply iterative refinement techniques for progressive improvement", "group": "I"}, {"id": "g56", "domain": 4, "scenario": "Agente de Suporte ao Cliente", "situation": "Logs de produção mostram um padrão consistente: quando clientes incluem a palavra \"conta\" em sua mensagem (ex.: \"quero verificar minha conta de um pedido que fiz ontem\"), o agente chama `get_customer` primeiro 78% das vezes. Quando clientes formulam pedidos similares sem \"conta\" (ex.: \"quero verificar um pedido que fiz ontem\"), chama `lookup_order` primeiro 93% das vezes. As descrições das ferramentas são claras e inequívocas. Qual a causa-raiz mais provável dessa discrepância?", "question": "Qual a causa-raiz mais provável?", "options": [{"letter": "A", "text": "O system prompt contém instruções sensíveis a palavras-chave que direcionam comportamento baseado em termos como \"conta\", criando padrões não intencionais de seleção de ferramenta.", "correct": true, "explanation": "O padrão sistemático dirigido por palavra-chave (78% vs 93%) indica fortemente lógica explícita de roteamento no system prompt reagindo à palavra \"conta\" e direcionando o agente a ferramentas relacionadas ao cliente. Como as descrições já são claras, a discrepância aponta para instruções no nível do prompt criando direcionamento comportamental não intencional."}, {"letter": "B", "text": "O treinamento base do modelo cria associações entre terminologia de \"conta\" e operações relacionadas ao cliente que sobrepõem descrições de ferramentas.", "correct": false, "explanation": ""}, {"letter": "C", "text": "O modelo precisa de mais dados de treino sobre mensagens multi-conceito e deveria ser fine-tuned em exemplos contendo terminologias de conta e pedido.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Descrições de ferramentas precisam de exemplos negativos adicionais especificando quando NÃO usar cada ferramenta para evitar essa confusão induzida por palavras-chave.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "4.1", "objective": "Design prompts with explicit criteria to improve precision and reduce false positives", "group": "I"}, {"id": "g60", "domain": 4, "scenario": "Agente de Suporte ao Cliente", "situation": "Logs de produção mostram que o agente às vezes escolhe `get_customer` quando `lookup_order` seria mais apropriado, especialmente para queries ambíguas como \"preciso de ajuda com minha compra recente\". Você decide adicionar exemplos few-shot ao system prompt para melhorar a seleção. Qual abordagem trata o problema de forma mais efetiva?", "question": "Qual abordagem é mais efetiva?", "options": [{"letter": "A", "text": "Adicionar orientações explícitas \"use quando\" e \"não use quando\" em cada descrição de ferramenta cobrindo casos ambíguos.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Adicionar exemplos agrupados por ferramenta — todos os cenários de `get_customer` juntos, depois todos os cenários de `lookup_order`.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Adicionar 4–6 exemplos direcionados a cenários ambíguos, cada um com justificativa de por que uma ferramenta foi escolhida em detrimento de alternativas plausíveis.", "correct": true, "explanation": "Direcionar exemplos few-shot aos cenários ambíguos específicos onde os erros ocorrem, com justificativa explícita de por que uma ferramenta é preferível, ensina ao modelo o processo de decisão comparativo necessário para casos de borda. Mais efetivo que exemplos genéricos ou regras declarativas."}, {"letter": "D", "text": "Adicionar 10–15 exemplos de pedidos claros e inequívocos demonstrando escolha correta para cenários típicos de cada ferramenta.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "2.1", "objective": "Design effective tool interfaces with clear descriptions and boundaries", "group": "J"}, {"id": "g69", "domain": 4, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Durante testes de QA, Claude segue diretrizes do system prompt nos primeiros 10–15 turnos, mas respostas posteriores desviam. A conversa ainda está dentro dos limites de tokens.", "question": "Qual a melhor solução?", "options": [{"letter": "A", "text": "Mover diretrizes comportamentais para a primeira mensagem do usuário.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Iniciar nova conversa após 20 turnos.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Inserir mensagens com role user reforçando diretrizes em pontos de interrupção da conversa.", "correct": true, "explanation": "A injeção periódica de lembretes comportamentais combate diretamente a deriva de instrução restabelecendo restrições em intervalos regulares conforme o histórico se acumula. Mover diretrizes para a primeira mensagem do usuário (A) reduz sua autoridade. Iniciar nova conversa (B) destrói contexto. Validação pós-resposta (D) é corretiva em vez de preventiva e adiciona latência significativa."}, {"letter": "D", "text": "Usar validação pós-resposta para regenerar respostas não conformes.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "5.1", "objective": "Manage conversation context to preserve critical information across long interactions", "group": "G"}, {"id": "g71", "domain": 4, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Seu assistente precisa manter um tom entusiástico, explicar seu raciocínio e fazer perguntas esclarecedoras. Onde essas diretrizes comportamentais devem ser definidas?", "question": "Onde essas diretrizes comportamentais devem ser definidas?", "options": [{"letter": "A", "text": "Prependendo a cada mensagem do usuário.", "correct": false, "explanation": ""}, {"letter": "B", "text": "No system prompt.", "correct": true, "explanation": "O system prompt é especificamente desenhado para restrições e diretrizes comportamentais persistentes que se aplicam ao longo de toda a conversa. Prependê-las a cada mensagem do usuário (A) é overhead redundante. A primeira mensagem do assistente (C) não é confiável porque o modelo pode desviar de suas próprias declarações anteriores. Variáveis de ambiente (D) não têm efeito sobre o comportamento do modelo."}, {"letter": "C", "text": "Na primeira mensagem do assistente.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Em variáveis de ambiente.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "5.1", "objective": "Manage conversation context to preserve critical information across long interactions", "group": "G"}, {"id": "g72", "domain": 4, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Usuários reportam aberturas de resposta repetitivas como \"Certamente!\" e \"Ficarei feliz em ajudar!\".", "question": "Qual a abordagem mais efetiva?", "options": [{"letter": "A", "text": "Anexar uma mensagem parcial do assistente com uma abertura direta.", "correct": true, "explanation": "Pré-preencher a resposta do assistente com o início de uma resposta direta evita padrões de saudação no nível de geração — o modelo continua a partir do prefill em vez de gerar novas frases de abertura. Instruções no system prompt (D) podem ajudar mas são menos confiáveis pois o modelo ainda pode produzir variantes. Pós-processamento (C) é um workaround frágil. Temperatura (B) controla aleatoriedade, não padrões específicos de frase."}, {"letter": "B", "text": "Reduzir o ajuste de temperatura.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Pós-processar respostas para remover saudações.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Adicionar instruções no system prompt para evitar essas frases.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "4.3", "objective": "Enforce structured output using tool use and JSON schemas", "group": "H"}, {"id": "g73", "domain": 4, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Um webhook notifica seu sistema de que o pacote do usuário foi enviado enquanto o usuário está conversando ativamente. Você quer que o assistente incorpore isso naturalmente na próxima resposta.", "question": "Qual a melhor abordagem?", "options": [{"letter": "A", "text": "Adicionar status de envio ao system prompt.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Enviar imediatamente uma mensagem sintética do usuário.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Forçar o assistente a chamar uma ferramenta de status a cada turno.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Anexar a atualização de status como prefixo à próxima mensagem do usuário.", "correct": true, "explanation": "Prefixar a atualização de status à próxima mensagem do usuário injeta contexto em tempo real em uma fronteira natural da conversa sem perturbar o fluxo. Modificar o system prompt (A) exige reconstruir a sessão ou é arquiteturalmente custoso. Uma mensagem sintética do usuário (B) pode quebrar o fluxo natural do diálogo e confundir atribuição. Forçar uma chamada de ferramenta a cada turno (C) é desperdício quando eventos são raros."}], "correct": "D", "task_id": "5.1", "objective": "Manage conversation context to preserve critical information across long interactions", "group": "G"}, {"id": "g74", "domain": 4, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Usuários frequentemente enviam pedidos como \"Reserve um local para a festa\". O assistente faz 4+ perguntas esclarecedoras, causando 35% de abandono.", "question": "Qual abordagem melhora melhor o trade-off?", "options": [{"letter": "A", "text": "Prosseguir com defaults ocultos.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Fazer todas as perguntas esclarecedoras em uma única mensagem composta.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Declarar suposições explicitamente e prosseguir convidando correções.", "correct": true, "explanation": "Declarar suposições explicitamente e prosseguir dá ao usuário uma resposta imediata e útil enquanto preserva sua capacidade de corrigir suposições erradas. Defaults ocultos (A) deixam o usuário sem saber o que foi assumido. Uma lista composta de perguntas (B) ainda exige esforço inicial do usuário. Um formulário estruturado (D) adiciona mais atrito, não menos — contradiz o objetivo de reduzir abandono."}, {"letter": "D", "text": "Usar um formulário estruturado de coleta.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "5.2", "objective": "Design effective escalation and ambiguity resolution patterns", "group": "C"}, {"id": "g76", "domain": 4, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Usuários fazem pedidos vagos como \"Pode ajudar com o relatório?\". O assistente responde fazendo várias perguntas (qual relatório? que ajuda? prazo?), causando 40% de abandono.", "question": "Qual a melhor solução?", "options": [{"letter": "A", "text": "Fazer suposições razoáveis, declará-las explicitamente e oferecer ajustes.", "correct": true, "explanation": "Prosseguir com suposições razoáveis declaradas elimina totalmente o vai-e-vem mantendo o usuário informado e no controle. Interpretações silenciosas predefinidas (C) deixam usuários confusos quando a resposta não casa com sua intenção. Um limite de uma pergunta (D) ainda exige turnos de vai-e-vem. Um modelo menor de classificação (B) adiciona latência e complexidade de infraestrutura sem resolver o problema central de UX."}, {"letter": "B", "text": "Classificar a ambiguidade com um modelo menor antes de responder.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Usar interpretações predefinidas sem declarar suposições.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Limitar o assistente a uma pergunta esclarecedora por turno.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "5.2", "objective": "Design effective escalation and ambiguity resolution patterns", "group": "C"}, {"id": "m8", "domain": 4, "scenario": null, "situation": "Revisões em produção revelam um tratamento inconsistente da incerteza nos relatórios finais. Às vezes, descobertas conflitantes dos subagentes são sintetizadas em uma única afirmação confiante (perdendo a nuance), enquanto outras vezes os relatórios fazem ressalvas em excesso com qualificações exageradas (tornando-se inúteis). Quando o agente de busca na web retorna \"analistas do setor estimam um mercado de US$ 50 bi (a metodologia varia)\" e o agente de análise de documentos retorna \"estudo revisado por pares estima 35 bi (±7 bi, IC 95%)\", o coordenador ou escolhe um arbitrariamente ou produz afirmações vagas como \"o mercado pode ser de 35 bi a 50 bi dependendo de fatores\".", "question": "Qual abordagem sistemática aborda melhor isso?", "options": [{"letter": "A", "text": "Configurar os subagentes para relatar apenas descobertas que atendam a um limite de alta confiança, filtrando informações incertas antes que cheguem ao coordenador.", "correct": false, "explanation": "A filtragem descarta evidências úteis, porém incertas. Ela não ajuda o agente de síntese a raciocinar sobre conflitos — apenas os esconde."}, {"letter": "B", "text": "Implementar uma camada de calibração de confiança que normaliza as expressões de incerteza dos subagentes em pontuações de probabilidade padronizadas (0,0 a 1,0) e, em seguida, faz a média ponderada das descobertas por sua confiança calibrada.", "correct": false, "explanation": "Reduzir os ICs revisados por pares e as estimativas de analistas a um único número médio destrói a diferença metodológica que é o cerne da questão."}, {"letter": "C", "text": "Instruir o agente de síntese a estruturar os relatórios com seções explícitas que distinguem descobertas bem estabelecidas das contestadas, preservando as caracterizações das fontes originais e o contexto metodológico.", "correct": true, "explanation": "Correto. Uma estrutura de relatório que mantém o contexto metodológico e separa afirmações consolidadas das contestadas é como se obtém nuance sem ressalvas em excesso."}, {"letter": "D", "text": "Adicionar um subagente de verificação que faz referência cruzada das descobertas entre as fontes, passando para a síntese apenas as afirmações corroboradas por ao menos duas fontes independentes.", "correct": false, "explanation": "Mínimos de duas fontes descartam descobertas legítimas de fonte única e não resolvem estimativas genuinamente conflitantes com metodologias diferentes."}], "correct": "C", "task_id": "5.6", "objective": "Preserve information provenance and handle uncertainty in multi-source synthesis", "group": "B"}, {"id": "m11", "domain": 4, "scenario": null, "situation": "Um usuário está expandindo o sistema de pesquisa além de seu único agente de busca na web, adicionando fontes de dados especializadas. Ele adiciona um agente de API financeira que retorna JSON estruturado com receita, margens e taxas de crescimento; um agente de monitoramento de notícias que retorna resumos em prosa de acontecimentos recentes; e um agente de análise de patentes que retorna listas estruturadas de áreas de tecnologia. O agente de síntese combina tudo isso em briefings executivos. Atualmente, ele converte tudo em tópicos, fazendo com que as comparações financeiras percam a clareza tabular e os resumos de notícias percam o fluxo narrativo.", "question": "Qual mudança melhoraria mais a qualidade do briefing?", "options": [{"letter": "A", "text": "Padronizar todas as saídas dos subagentes como resumos em prosa com citações em linha.", "correct": false, "explanation": "Achatar dados financeiros estruturados em prosa perde a comparabilidade que você deseja em um briefing executivo."}, {"letter": "B", "text": "Adicionar uma camada de conversão de formato entre os subagentes e a síntese que transforma todas as saídas em uma representação intermediária comum.", "correct": false, "explanation": "Uma única representação intermediária costuma acabar com perdas demais — ou mantém a estrutura (as notícias sofrem) ou mantém a prosa (as tabelas sofrem). A correção é renderização ciente do tipo, não uniformidade."}, {"letter": "C", "text": "Atualizar o agente de síntese para renderizar cada tipo de conteúdo de forma apropriada — dados financeiros como tabelas, notícias como prosa.", "correct": true, "explanation": "Correto. Briefings executivos precisam de renderização mista: tabelas para números, prosa para narrativa. Pedir à síntese que preserve o formato nativo de cada entrada é a abstração certa."}, {"letter": "D", "text": "Padronizar todas as saídas dos subagentes como JSON com campos para afirmação, evidência, fonte e confiança.", "correct": false, "explanation": "Forçar notícias densas em prosa em um esquema de afirmação/evidência retira o fluxo narrativo que os executivos realmente leem."}], "correct": "C", "task_id": "5.6", "objective": "Preserve information provenance and handle uncertainty in multi-source synthesis", "group": "B"}, {"id": "m46", "domain": 4, "scenario": null, "situation": "Seu sistema de extração processa dois tipos de documentos: relatórios mensais padrão (arquivados após o processamento) e relatórios de exceção urgentes (que devem disparar alertas de negócio em até 30 minutos do recebimento). Ambos usam o mesmo esquema JSON. Você quer minimizar os custos de API atendendo aos requisitos de latência.", "question": "Como você deve arquitetar o pipeline de processamento?", "options": [{"letter": "A", "text": "Enviar todos os documentos para a Messages API em tempo real, garantindo latência de processamento consistente entre os tipos de documento.", "correct": false, "explanation": "Consistente, porém caro. Os relatórios mensais padrão não precisam de latência em tempo real e não deveriam pagar por ela."}, {"letter": "B", "text": "Enviar todos os documentos para a `Batch API` com `custom_ids` para rastreamento. Quando os resultados chegarem, processar imediatamente os documentos urgentes e disparar alertas atrasados para as exceções.", "correct": false, "explanation": "O batch tem uma janela de até 24 horas — SLAs de alerta de 30 minutos para relatórios de exceção não podem ser atendidos roteando-os pelo batch."}, {"letter": "C", "text": "Enfileirar todos os documentos e enviar batches a cada hora, sinalizando os documentos urgentes para tratamento acelerado quando os resultados do batch retornarem.", "correct": false, "explanation": "Batches a cada hora ainda dependem do SLO do batch e não garantem a janela de alerta de 30 minutos para as exceções."}, {"letter": "D", "text": "Rotear os relatórios padrão para a `Batch API`, obtendo 50% de economia de custo, e rotear os relatórios de exceção urgentes para a Messages API em tempo real.", "correct": true, "explanation": "Correto. Combine o perfil de latência com a urgência do documento: batch para o volume (barato), tempo real para as exceções sensíveis à latência (rápido). Minimiza o custo atendendo ao SLA."}], "correct": "D", "task_id": "4.5", "objective": "Design efficient batch processing strategies", "group": "H"}, {"id": "m47", "domain": 4, "scenario": null, "situation": "Seu esquema inclui um campo skills: string[]. O monitoramento em produção revela três problemas de consistência: (1) frases compostas como \"Python and SQL\" às vezes são mantidas como uma única entrada, às vezes divididas; (2) habilidades implícitas, mas não declaradas, ocasionalmente aparecem nas extrações; (3) documentos semelhantes produzem comprimentos de array muito diferentes (5-10 vs. 40+ entradas). Seu prompt atualmente diz \"Extract all skills mentioned.\"", "question": "Qual é a melhoria mais eficaz?", "options": [{"letter": "A", "text": "Adicionar exemplos few-shot demonstrando o tratamento de frases compostas, critérios explícitos de menção e a granularidade adequada das entradas.", "correct": true, "explanation": "Correto. Os três problemas dizem respeito à interpretação do modelo sobre o que conta como 'uma habilidade'. Exemplos few-shot ensinam o padrão de forma concreta — dividir ou não dividir, mencionado ou inferido, granularidade adequada."}, {"letter": "B", "text": "Adicionar restrições: \"Extract 10-20 skills maximum, one skill per entry, only explicitly named skills.\"", "correct": false, "explanation": "Limites rígidos de contagem são arbitrários e podem forçar o modelo a descartar habilidades reais ou inventar preenchimento para atingir a faixa."}, {"letter": "C", "text": "Adicionar uma normalização pós-extração que mapeia as habilidades para uma taxonomia canônica e deduplica entradas semelhantes.", "correct": false, "explanation": "O pós-processamento não consegue corrigir habilidades inferidas, mas não mencionadas, nem escolher a divisão correta para 'Python and SQL' — essa decisão precisa ser tomada no momento da extração."}, {"letter": "D", "text": "Enriquecer o esquema para {skill: string, confidence: float, `source_quote`: string}[] para capturar metadados da extração.", "correct": false, "explanation": "Sinal útil, mas não trata a inconsistência subjacente na forma como as habilidades são interpretadas em primeiro lugar."}], "correct": "A", "task_id": "4.2", "objective": "Apply few-shot prompting to improve output consistency and quality", "group": "I"}, {"id": "m48", "domain": 4, "scenario": null, "situation": null, "question": "Seu sistema opera com revisão humana de 100% há 3 meses. A análise mostra que extrações com confiança do modelo >90% têm 97% de precisão no geral. Para reduzir a carga de trabalho dos revisores, você planeja automatizar as extrações de alta confiança. Antes de implantar, qual etapa de validação é a mais crítica?", "options": [{"letter": "A", "text": "Analisar a precisão por tipo de documento e por campo para verificar se as extrações de alta confiança têm desempenho consistente em todos os segmentos, e não apenas no agregado.", "correct": true, "explanation": "Correto. A precisão agregada esconde falhas por segmento — um tipo de documento pode estar em 70% enquanto outros estão em 99%. O roteamento automático apenas pelo número global arrisca erros sistêmicos nos segmentos fracos."}, {"letter": "B", "text": "Comparar a precisão em diferentes limiares de confiança (85%, 90%, 95%) para encontrar o ponto de corte ótimo que maximiza a automação minimizando os erros.", "correct": false, "explanation": "Ajustar o limiar vale a pena, mas só depois de saber que a precisão se mantém uniformemente entre os segmentos — caso contrário, você está otimizando um número que mente."}, {"letter": "C", "text": "Executar um piloto de duas semanas roteando 25% das extrações de alta confiança diretamente para os sistemas downstream e monitorar os relatórios de erro.", "correct": false, "explanation": "Um piloto é uma boa prática, mas vem depois da análise por segmento — se um segmento estiver sistematicamente errado, você só descobrirá prejudicando os usuários."}, {"letter": "D", "text": "Verificar se a precisão de 97% atende aos requisitos de todos os sistemas downstream que consomem os dados extraídos.", "correct": false, "explanation": "Uma questão de produto importante, mas que pressupõe que os 97% se mantêm em todos os lugares — de novo, é justamente isso que a análise por segmento verifica primeiro."}], "correct": "A", "task_id": "5.5", "objective": "Design human review workflows and confidence calibration", "group": "C"}, {"id": "m49", "domain": 4, "scenario": null, "situation": "Seu pipeline de extração processa contratos que frequentemente incluem aditivos. Quando um contrato contém tanto os termos originais quanto aditivos posteriores (por exemplo, a cláusula original especifica \"30-day payment terms\" enquanto o Aditivo 1 altera isso para \"45 days\"), o modelo extrai de forma inconsistente um valor ou o outro, sem indicar qual se aplica.", "question": "Qual é a abordagem mais eficaz para melhorar a precisão da extração em documentos com aditivos?", "options": [{"letter": "A", "text": "Redesenhar o esquema para que os campos alterados capturem múltiplos valores, cada um com sua localização na fonte e data de vigência.", "correct": true, "explanation": "Correto. Aditivos são estruturalmente sobre valores versionados. Um esquema com valor + localização na fonte + data de vigência modela o domínio corretamente e deixa de forçar o modelo a escolher um único."}, {"letter": "B", "text": "Adicionar instruções no prompt para sempre extrair o valor do aditivo mais recente e ignorar os termos originais substituídos.", "correct": false, "explanation": "Os consumidores downstream às vezes também precisam do original (por exemplo, para resolução de disputas). Fixar 'o mais recente prevalece' descarta isso."}, {"letter": "C", "text": "Pré-processar os documentos com um classificador que identifica e remove as seções substituídas antes da etapa principal de extração.", "correct": false, "explanation": "Apagar seções com um classificador pode remover acidentalmente conteúdo que ainda está legalmente vigente — aditivos frequentemente modificam apenas subconjuntos de cláusulas."}, {"letter": "D", "text": "Implementar uma validação pós-extração usando correspondência de padrões para detectar aditivos e sinalizar essas extrações para revisão manual.", "correct": false, "explanation": "Roteia todo contrato com aditivo para um humano — caro, e ainda assim não fornece aos sistemas downstream uma resposta estruturada."}], "correct": "A", "task_id": "4.3", "objective": "Enforce structured output using tool use and JSON schemas", "group": "H"}, {"id": "m50", "domain": 4, "scenario": null, "situation": "Seu sistema de extração implementa novas tentativas automáticas quando a validação falha. A cada nova tentativa, o erro de validação específico é anexado ao prompt. Essa abordagem de nova tentativa com feedback de erro resolve a maioria das falhas em 2-3 tentativas.", "question": "Para qual padrão de falha novas tentativas seriam MENOS eficazes?", "options": [{"letter": "A", "text": "O modelo extrai palavras-chave como um objeto aninhado organizado por categoria quando o esquema exige um array plano de strings", "correct": false, "explanation": "Uma incompatibilidade estrutural que o modelo definitivamente consegue corrigir com feedback sobre o formato esperado."}, {"letter": "B", "text": "O modelo extrai contagens de citações como strings formatadas conforme o local (\"1,234\") quando o esquema exige inteiros", "correct": false, "explanation": "O número exigido está presente no documento — o modelo só precisa parar de formatá-lo. Fácil de corrigir com nova tentativa por feedback."}, {"letter": "C", "text": "O modelo extrai datas como strings de data e hora ISO 8601 (\"2023-03-15T00:00:00Z\") quando o esquema exige apenas a parte da data (YYYY-MM-DD)", "correct": false, "explanation": "Correção puramente de formato — o valor subjacente está correto e o modelo pode remover a parte da hora na nova tentativa."}, {"letter": "D", "text": "O modelo extrai \"et al.\" para coautores quando a lista completa existe apenas em um documento externo que não está na entrada", "correct": true, "explanation": "Correto. Nenhuma quantidade de novas tentativas ensina ao modelo informações que não estão na entrada. A nova tentativa com feedback de erro só corrige erros que o modelo poderia ter acertado a partir da fonte."}], "correct": "D", "task_id": "3.5", "objective": "Apply iterative refinement techniques for progressive improvement", "group": "I"}, {"id": "m51", "domain": 4, "scenario": null, "situation": "Seu pipeline de extração processa cardápios de restaurantes e deve produzir um JSON estruturado com campos para nomes dos itens, descrições, preços e tags dietéticas. Alguns cardápios usam formatação inconsistente — preços como \"$12\" vs. \"12.00\", informação dietética como ícones vs. texto.", "question": "Qual é a abordagem mais confiável?", "options": [{"letter": "A", "text": "Usar chamadas de extração separadas para cada campo, garantindo o tratamento consistente de cada tipo.", "correct": false, "explanation": "Múltiplas chamadas por cardápio multiplicam custo e latência e perdem o contexto entre campos (por exemplo, quais ícones dietéticos ficam ao lado de quais itens)."}, {"letter": "B", "text": "Extrair os dados como estão e normalizar os formatos em código de pós-processamento depois que o Claude retornar.", "correct": false, "explanation": "Pós-processar um blob bruto é frágil — código determinístico tem que lidar com todas as permutações de formato. É melhor deixar o modelo normalizar no momento da extração."}, {"letter": "C", "text": "Solicitar várias tentativas de extração por documento e selecionar o formato mais comum.", "correct": false, "explanation": "A votação por conjunto é cara e ainda pode escolher uma maioria com formato errado."}, {"letter": "D", "text": "Definir um esquema de saída estrito e incluir regras de normalização de formato no seu prompt.", "correct": true, "explanation": "Correto. Esquema estrito + regras de normalização explícitas ('preços como decimal com duas casas', 'dietético como tags enumeradas') permite ao modelo extrair e normalizar em uma única passada."}], "correct": "D", "task_id": "4.2", "objective": "Apply few-shot prompting to improve output consistency and quality", "group": "I"}, {"id": "m52", "domain": 4, "scenario": null, "situation": "Seu sistema extrai metadados de eventos (data, local, organizador, `attendee_count`) de artigos de notícias usando um esquema JSON com todos os campos anuláveis. Durante a avaliação, você observa que o modelo frequentemente gera valores plausíveis, porém incorretos, para campos não mencionados no artigo — por exemplo, gerando \"500\" para `attendee_count` quando a fonte não contém nenhuma informação de público.", "question": "Qual é a maneira mais eficaz de reduzir essas extrações falsas?", "options": [{"letter": "A", "text": "Adicionar uma etapa de pós-processamento usando uma segunda chamada de LLM para verificar se cada valor extraído existe no documento de origem.", "correct": false, "explanation": "Uma segunda passada cara para um comportamento que você pode corrigir na fonte — diga ao modelo para retornar null quando o campo não estiver declarado."}, {"letter": "B", "text": "Adicionar instruções no prompt para retornar null em qualquer campo cuja informação não esteja diretamente declarada na fonte.", "correct": true, "explanation": "Correto. Os campos já são anuláveis; o modelo só precisa de uma instrução explícita para preferir null em vez de um palpite plausível. Essa é a correção padrão para alucinação consciente do esquema."}, {"letter": "C", "text": "Tornar todos os campos do esquema obrigatórios (não anuláveis) com regras de validação estritas para garantir que o modelo só produza dados verificáveis.", "correct": false, "explanation": "Campos obrigatórios forçam o modelo a inventar valores quando a informação está ausente — o oposto do que você quer."}, {"letter": "D", "text": "Migrar para um nível de modelo mais capaz, com melhor aderência a instruções, para reduzir a tendência a alucinações.", "correct": false, "explanation": "Adiciona custo e ainda assim não comunica sua política ao modelo — retornar null em vez de inventar."}], "correct": "B", "task_id": "4.3", "objective": "Enforce structured output using tool use and JSON schemas", "group": "H"}, {"id": "m53", "domain": 4, "scenario": null, "situation": "Depois de implementar o uso de ferramentas com definições de esquema estritas, os erros de sintaxe JSON foram eliminados, mas 5% das extrações ainda têm JSON válido com arrays vazios ou valores nulos para campos obrigatórios como citações e metodologia. Uma verificação por amostragem revela que os documentos de origem contêm essas informações, mas em formatos variados — citações inline vs. bibliografias, seções de metodologia vs. detalhes embutidos nas introduções.", "question": "Qual é a maneira mais eficaz de tratar essas falhas?", "options": [{"letter": "A", "text": "Implementar uma lógica de nova tentativa que reenvia as requisições quando a validação detecta campos obrigatórios vazios.", "correct": false, "explanation": "Uma nova tentativa com o mesmo prompt não vai, de repente, ensinar o modelo a reconhecer metodologia embutida numa introdução. A capacidade de extração é a lacuna."}, {"letter": "B", "text": "Construir uma camada de pós-processamento baseada em regex que varre os documentos de origem em busca de padrões de citação e palavras-chave de metodologia, preenchendo os campos vazios quando o modelo falha em extrair.", "correct": false, "explanation": "Regex sobre prosa é frágil, perde os casos sutis (metodologia embutida na introdução) e entrega dados silenciosamente errados."}, {"letter": "C", "text": "Modificar seu esquema para tornar citações e metodologia opcionais e sinalizar os registros incompletos para revisão manual em vez de falhar na validação.", "correct": false, "explanation": "Mascara o sintoma. Os campos realmente são obrigatórios downstream — roteá-los para humanos troca um problema pela carga de trabalho dos revisores."}, {"letter": "D", "text": "Adicionar exemplos few-shot demonstrando extrações de documentos com estruturas variadas — mostrando como identificar citações em diferentes formatos e localizar detalhes de metodologia em tipos diferentes de seção.", "correct": true, "explanation": "Correto. O modo de falha é o modelo não reconhecer formatos variados. Exemplos concretos ao longo da distribuição de formatos elevam diretamente a revocação nos 5%."}], "correct": "D", "task_id": "4.2", "objective": "Apply few-shot prompting to improve output consistency and quality", "group": "I"}, {"id": "m54", "domain": 4, "scenario": null, "situation": "Seu pipeline de extração processa faturas e extrai itens de linha, subtotais, valores de impostos e totais gerais. Durante a avaliação, você descobre que em 18% das extrações a soma dos valores dos itens de linha extraídos não corresponde ao total geral extraído — às vezes por erros de OCR no documento de origem, às vezes por erros de extração do modelo. Os sistemas contábeis downstream rejeitam registros com totais discrepantes.", "question": "Qual é a abordagem mais eficaz para melhorar a confiabilidade da extração?", "options": [{"letter": "A", "text": "Adicionar um campo \"`calculated_total`\", em que o modelo soma os itens de linha extraídos, ao lado de um campo \"`stated_total`\". Sinalizar os registros para revisão humana quando os valores diferirem.", "correct": true, "explanation": "Correto. Capturar ambos os valores transforma a discrepância em um sinal de primeira classe — você detecta erros de OCR e erros de extração de forma uniforme e pode rotear apenas os 18% discrepantes para humanos."}, {"letter": "B", "text": "Extrair os itens de linha e os totais de forma independente e, então, usar um modelo de validação separado para reconciliar as discrepâncias, determinando quais valores extraídos são mais prováveis de estar corretos.", "correct": false, "explanation": "Um modelo de reconciliação pode mascarar erros de OCR ao escolher silenciosamente um número em vez do outro — o sistema contábil ainda recebe dados errados sem nenhuma sinalização."}, {"letter": "C", "text": "Adicionar exemplos few-shot demonstrando faturas em que os itens de linha extraídos somam corretamente ao total declarado, incentivando o modelo a produzir extrações matematicamente consistentes.", "correct": false, "explanation": "Pode incentivar o modelo rumo à consistência, mas quando a própria fonte é internamente inconsistente (erros de OCR), o modelo tem que escolher um número 'errado'."}, {"letter": "D", "text": "Implementar um pós-processamento que ajusta automaticamente os valores dos itens de linha de forma proporcional quando a soma deles não corresponde ao total declarado.", "correct": false, "explanation": "Reescritas silenciosas de dados financeiros são perigosas — você estaria fabricando itens de linha para um sistema contábil downstream."}], "correct": "A", "task_id": "4.2", "objective": "Apply few-shot prompting to improve output consistency and quality", "group": "I"}, {"id": "m56", "domain": 4, "scenario": null, "situation": "Sua extração usa uso de ferramentas com um esquema JSON em que `property_type` é definido como um enum: ['house', 'apartment', 'condo', 'townhouse']. Após a implantação, 8% das extrações falham na validação do esquema. A investigação revela que os anúncios mencionam muitos tipos de imóvel incomuns — \"studio\", \"loft\", \"duplex\", \"mobile home\", \"tiny house\", \"converted warehouse\" — e novos tipos continuam surgindo regularmente.", "question": "Qual é a solução de longo prazo mais eficaz?", "options": [{"letter": "A", "text": "Expandir continuamente o enum para incluir os tipos de imóvel recém-observados e adicionar monitoramento para casos extremos adicionais.", "correct": false, "explanation": "Manutenção do enum tipo 'enxuga-gelo' — cada novo estilo de anúncio arrisca outra falha de validação."}, {"letter": "B", "text": "Adicionar um valor \"other\" ao seu enum, com um campo string `property_type_detail` separado para as especificidades quando \"other\" for selecionado.", "correct": true, "explanation": "Correto. Mantém o enum forte para os casos comuns (joins downstream limpos) ao mesmo tempo em que oferece uma válvula de escape bem tipada que preserva o detalhe. Estável no longo prazo."}, {"letter": "C", "text": "Mudar `property_type` de enum para uma string de formato livre e implementar uma etapa de normalização no pós-processamento.", "correct": false, "explanation": "Perde por completo a garantia de validação e empurra o problema de normalização para downstream sem nenhum vocabulário canônico."}, {"letter": "D", "text": "Adicionar exemplos few-shot ao seu prompt demonstrando como mapear tipos de imóvel inesperados para o valor de enum existente mais próximo.", "correct": false, "explanation": "Forçar 'tiny house' para dentro de 'house' descarta distinções reais downstream — você está sendo silenciosamente lossy."}], "correct": "B", "task_id": "4.3", "objective": "Enforce structured output using tool use and JSON schemas", "group": "H"}, {"id": "m57", "domain": 4, "scenario": null, "situation": "Seu sistema de extração analisa descrições de produtos de e-commerce para extrair especificações como dimensões, peso e materiais em JSON. Apesar de ter um esquema bem definido, o modelo extrai o campo \"materials\" de forma inconsistente — às vezes retornando \"cotton blend\", outras vezes \"Cotton/Polyester mix\" e, ocasionalmente, omitindo o campo quando a informação de material está claramente presente na fonte.", "question": "Qual é a maneira mais eficaz de melhorar a consistência da extração?", "options": [{"letter": "A", "text": "Tornar o campo \"materials\" obrigatório em vez de opcional no esquema para forçar o modelo a sempre extrair um valor", "correct": false, "explanation": "A obrigatoriedade não resolve a inconsistência de formato e pode forçar valores inventados quando a informação de material realmente está ausente."}, {"letter": "B", "text": "Migrar para um nível de modelo mais capaz, já que a extração inconsistente indica capacidade de modelo insuficiente", "correct": false, "explanation": "Caro, e não trata a causa real — o modelo não conhece o formato de saída canônico que você quer."}, {"letter": "C", "text": "Definir a temperatura como 0 para eliminar a aleatoriedade e garantir saídas determinísticas", "correct": false, "explanation": "O determinismo não define o formato correto; apenas torna consistentes as respostas com formato errado."}, {"letter": "D", "text": "Adicionar exemplos few-shot mostrando 2-3 pares completos de entrada-saída com formatos padronizados de descrição de material", "correct": true, "explanation": "Correto. Exemplos few-shot demonstram o formato canônico exato que você quer ('cotton/polyester' como uma lista normalizada) e também elevam a revocação da informação de material que estava sendo ignorada."}], "correct": "D", "task_id": "4.2", "objective": "Apply few-shot prompting to improve output consistency and quality", "group": "I"}, {"id": "m58", "domain": 4, "scenario": null, "situation": "Documentos chegam continuamente ao longo do horário comercial e precisam ter dados estruturados extraídos. Para reduzir custos, você quer usar a `Message Batches API` (50% de desconto, janela de processamento de até 24 horas). Seu SLA especifica que os resultados da extração devem estar disponíveis em até 30 horas da chegada do documento, com 99,9% de confiabilidade.", "question": "Qual estratégia de batch é a mais apropriada?", "options": [{"letter": "A", "text": "Enviar batches a cada 6 horas contendo os documentos daquela janela", "correct": false, "explanation": "No pior caso, um documento espera 6 horas para ser inserido em um batch e, depois, até 24 horas para ser processado = exatamente 30 horas. Sem margem de segurança para uma meta de confiabilidade de 99,9%."}, {"letter": "B", "text": "Enviar um único batch no fim do dia contendo todos os documentos daquele dia", "correct": false, "explanation": "Um documento que chega logo após o início da manhã espera o dia inteiro para ser inserido no batch, mais até 24 horas de processamento — bem acima das 30 horas."}, {"letter": "C", "text": "Enviar batches a cada 4 horas contendo os documentos daquela janela", "correct": true, "explanation": "Correto. Espera máxima de 4 horas + SLO de batch de até 24 horas = pior caso de 28 horas, deixando uma folga de 2 horas abaixo do SLA de 30 horas para absorver a variação do batch e atingir 99,9%."}, {"letter": "D", "text": "Usar a API em tempo real para todos os documentos em vez do processamento em batch", "correct": false, "explanation": "Atende ao SLA trivialmente, mas joga fora a economia de 50% de custo que a questão pede para capturar."}], "correct": "C", "task_id": "4.5", "objective": "Design efficient batch processing strategies", "group": "H"}, {"id": "m59", "domain": 4, "scenario": null, "situation": "Após a implantação, você descobre que 12% das extrações contêm erros semânticos que passam na validação do esquema JSON (por exemplo, uma duração como \"30 minutes\" colocada incorretamente em um campo de quantidade de ingrediente). Os revisores humanos têm capacidade para verificar apenas 20% das extrações.", "question": "Qual abordagem aloca a atenção dos revisores de forma mais eficaz?", "options": [{"letter": "A", "text": "Fazer o modelo gerar pontuações de confiança no nível de campo e, então, calibrar os limiares de revisão usando um conjunto de validação rotulado.", "correct": true, "explanation": "Correto. A confiança no nível de campo permite rotear os 20% de baixa confiança — onde se concentram os 12% de erros semânticos — para humanos. A calibração torna a escolha do limiar orientada por dados."}, {"letter": "B", "text": "Amostrar aleatoriamente 20% das extrações para revisão, usando as correções para acompanhar a precisão e identificar padrões de erro.", "correct": false, "explanation": "Ótimo para medição, ruim para cobertura — a amostragem aleatória só captura 20% dos 12% de erros (~2,4% no total). O roteamento por confiança encontra muito mais."}, {"letter": "C", "text": "Priorizar a revisão de todas as extrações em que campos obrigatórios estão vazios ou explicitamente marcados como não encontrados.", "correct": false, "explanation": "Campos vazios são um modo de erro estreito. O problema dos 12% são valores errados em campos preenchidos, que esse filtro não detecta."}, {"letter": "D", "text": "Revisar todas as extrações de documentos com anomalias de formatação, como layouts incomuns ou tipos de conteúdo mistos.", "correct": false, "explanation": "Uma heurística útil, mas anomalia de formatação não prevê de forma confiável onde os campos foram confundidos uns com os outros."}], "correct": "A", "task_id": "5.5", "objective": "Design human review workflows and confidence calibration", "group": "C"}, {"id": "g13", "domain": 5, "scenario": "Sistema de Pesquisa Multiagente", "situation": "O monitoramento de produção mostra qualidade inconsistente de síntese. Quando os resultados agregados têm ~75K tokens, o agente de síntese cita de forma confiável informações dos primeiros 15K tokens (manchetes/snippets de busca web) e dos últimos 10K (conclusões da análise de documentos), mas frequentemente perde achados críticos nos 50K do meio — mesmo quando respondem diretamente à pergunta de pesquisa. Como reestruturar a entrada agregada?", "question": "Como reestruturar a entrada agregada?", "options": [{"letter": "A", "text": "Sumarizar todas as saídas dos subagentes para abaixo de 20K tokens antes da agregação para manter o conteúdo dentro do alcance confiável de processamento do modelo.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Streamar incrementalmente os resultados dos subagentes ao agente de síntese, processando primeiro os de busca web até concluir e depois adicionando os de análise de documentos.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Posicionar um sumário de achados-chave no início da entrada agregada e organizar resultados detalhados com cabeçalhos de seção explícitos para navegação mais fácil.", "correct": true, "explanation": "Posicionar um sumário de achados-chave no início aproveita o efeito de primazia, colocando informação crítica na posição de processamento mais confiável. Adicionar cabeçalhos de seção explícitos ajuda o modelo a navegar e atender ao conteúdo do meio, mitigando diretamente o fenômeno \"lost in the middle\"."}, {"letter": "D", "text": "Implementar rotação que alterne quais resultados aparecem primeiro entre tarefas de pesquisa para garantir que ambas as fontes ganhem posição superior ao longo do tempo.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "5.1", "objective": "Manage conversation context to preserve critical information across long interactions", "group": "G"}, {"id": "g14", "domain": 5, "scenario": "Sistema de Pesquisa Multiagente", "situation": "Em testes, a saída combinada do agente de busca web (85K tokens incluindo conteúdo de páginas) e do agente de análise de documentos (70K tokens incluindo cadeias de raciocínio) totaliza 155K tokens, mas o agente de síntese performa melhor com entradas abaixo de 50K tokens. Qual solução é mais efetiva?", "question": "Qual solução é mais efetiva?", "options": [{"letter": "A", "text": "Modificar agentes upstream para retornar dados estruturados (fatos-chave, citações, scores de relevância) em vez de conteúdo verboso e raciocínio.", "correct": true, "explanation": "Modificar agentes upstream para retornar dados estruturados ataca a causa-raiz reduzindo o volume de tokens na origem enquanto preserva informação essencial. Evita passar conteúdo volumoso de páginas e traços de raciocínio que inflam tokens sem melhorar a etapa de síntese."}, {"letter": "B", "text": "Adicionar um agente intermediário de sumarização que condense achados antes de passá-los à síntese.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Fazer o agente de síntese processar achados em lotes sequenciais, mantendo estado entre chamadas.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Armazenar achados em uma base vetorial e dar ao agente de síntese ferramentas de busca para consultar durante o trabalho.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "5.6", "objective": "Preserve information provenance and handle uncertainty in multi-source synthesis", "group": "B"}, {"id": "g45", "domain": 5, "scenario": "Geração de Código com Claude Code", "situation": "Você está adicionando wrappers de tratamento de erros ao redor de chamadas de API externas em uma base de 120 arquivos. O trabalho tem três fases: (1) descobrir todos os call sites e padrões, (2) desenhar colaborativamente a abordagem de tratamento de erros, e (3) implementar wrappers de forma consistente. Na Fase 1, Claude gera saída grande listando centenas de call sites com contexto, enchendo rapidamente a janela de contexto antes da descoberta terminar.", "question": "Qual abordagem é mais efetiva para concluir a tarefa mantendo consistência de implementação?", "options": [{"letter": "A", "text": "Usar um subagente Explore para a Fase 1 para isolar saída verbosa de descoberta e retornar um sumário, depois continuar Fases 2–3 na conversa principal.", "correct": true, "explanation": "Um subagente Explore isola a saída verbosa de descoberta em contexto separado e retorna apenas um sumário conciso à conversa principal. Isso preserva a janela de contexto principal para as fases de design colaborativo e implementação consistente, em que contexto retido é mais valioso."}, {"letter": "B", "text": "Fazer todas as fases na conversa principal, periodicamente usando `/compact` para reduzir uso de contexto enquanto avança nos arquivos.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Mudar para modo headless com `--continue`, passando sumários explícitos de contexto entre chamadas em batch para manter continuidade.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Definir o padrão de tratamento de erros no CLAUDE.md, depois processar arquivos em lotes em múltiplas sessões contando com o arquivo de memória compartilhada para consistência.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "5.4", "objective": "Manage context effectively in large codebase exploration", "group": "G"}, {"id": "g54", "domain": 5, "scenario": "Agente de Suporte ao Cliente", "situation": "Logs de produção mostram um padrão: clientes referenciam valores específicos (ex.: \"o desconto de 15% que mencionei\"), mas o agente responde com valores incorretos. Investigação mostra que esses detalhes foram mencionados 20+ turnos atrás e condensados em sumários vagos como \"preços promocionais foram discutidos\". Qual correção é mais efetiva?", "question": "Qual correção é mais efetiva?", "options": [{"letter": "A", "text": "Aumentar o limiar de sumarização de 70% para 85% para que conversas tenham mais espaço antes de a sumarização disparar.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Armazenar histórico completo da conversa em armazenamento externo e implementar recuperação quando o agente detectar referências como \"como mencionei\".", "correct": false, "explanation": ""}, {"letter": "C", "text": "Extrair fatos transacionais (valores, datas, números de pedido) para um bloco persistente de \"case facts\" incluído em todo prompt fora do histórico sumarizado.", "correct": true, "explanation": "Sumarização inerentemente perde detalhes precisos. Extrair fatos transacionais para um bloco estruturado \"case facts\" fora do histórico sumarizado preserva informação crítica para que esteja disponível de forma confiável em todo prompt, independente de quantos turnos foram sumarizados."}, {"letter": "D", "text": "Revisar o prompt de sumarização para preservar explicitamente todos os números, percentuais, datas e expectativas declaradas pelo cliente verbatim.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "5.1", "objective": "Manage conversation context to preserve critical information across long interactions", "group": "G"}, {"id": "g63", "domain": 5, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Ao longo de vários turnos discutindo estratégia de investimento, um usuário declarou \"tenho tolerância a risco muito baixa\" e depois \"quero maximizar meus retornos\". Agora ele pergunta: \"Em que devo investir?\"", "question": "Qual abordagem melhor garante que a recomendação se alinhe com a prioridade real do usuário?", "options": [{"letter": "A", "text": "Trazer à tona a contradição e pedir ao usuário que esclareça o que importa mais.", "correct": true, "explanation": "Quando preferências do usuário se contradizem diretamente, trazer o conflito à tona e pedir esclarecimento é a única forma de garantir que a recomendação se alinhe com a real intenção do usuário. Qualquer outra abordagem envolve assumir algo que pode estar errado — maximizar retornos e baixa tolerância a risco são objetivos fundamentalmente incompatíveis que exigem decisão humana."}, {"letter": "B", "text": "Fornecer recomendações separadas para ambos os cenários.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Prosseguir com a preferência declarada mais recentemente.", "correct": false, "expla
