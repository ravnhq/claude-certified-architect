: null, "situation": "Você está implementando a lógica de escalonamento para quando o agente deve chamar `escalate_to_human`. Sua equipe propõe quatro abordagens diferentes para acionar o escalonamento.", "question": "Qual abordagem identificará de forma mais confiável os casos que genuinamente exigem intervenção humana?", "options": [{"letter": "A", "text": "Instruir o agente a escalonar quando o cliente solicitar um humano, quando o problema exigir exceções de política ou quando o agente não conseguir avançar de forma significativa.", "correct": true, "explanation": "Correto. Decisões de escalonamento são julgamentos sobre intenção e progresso — exatamente aquilo em que os LLMs são bons. Critérios claros em linguagem natural superam regras rígidas para a cauda longa."}, {"letter": "B", "text": "Configurar o agente para escalonar após três chamadas de ferramenta consecutivas que falhem em resolver o problema declarado pelo cliente, garantindo uma tentativa razoável antes de envolver um humano.", "correct": false, "explanation": "Um número fixo de novas tentativas dispara tanto cedo demais (novas tentativas legítimas) quanto tarde demais (problemas óbvios de política logo na primeira chamada)."}, {"letter": "C", "text": "Implementar análise de sentimento que monitore indicadores de frustração (linguagem negativa, perguntas repetidas, pontos de exclamação) e acione o escalonamento quando a pontuação de frustração ultrapassar um limite configurado.", "correct": false, "explanation": "A análise de sentimento pode captar a frustração, mas ignora clientes calmos que simplesmente precisam de um humano para uma exceção de política, e escalona em excesso diante de linguagem estilística."}, {"letter": "D", "text": "Construir um motor de regras que mapeie tipos específicos de problemas, segmentos de clientes e categorias de produtos para decisões de escalonamento, eliminando a necessidade de julgamentos do modelo.", "correct": false, "explanation": "Motores de regras quebram nos casos para os quais não foram projetados — e o atendimento ao cliente é cheio deles."}], "correct": "A", "task_id": "5.2", "objective": "Design effective escalation and ambiguity resolution patterns", "group": "C"}, {"id": "m33", "domain": 1, "scenario": null, "situation": "Após investigar uma disputa de cobrança ao longo de mais de 25 turnos, você identificou que as cobranças duplicadas ocorreram devido a um timeout do gateway de pagamento que acionou a lógica de nova tentativa. O reembolso necessário (US$ 847) excede seu limite de autorização de US$ 500. Você precisa chamar `escalate_to_human`, e o agente humano não terá acesso à transcrição da sua conversa.", "question": "Qual contexto você deve repassar para permitir uma resolução eficaz?", "options": [{"letter": "A", "text": "A reclamação original do cliente na íntegra, mais os trechos dos resultados de ferramentas que mostram as transações duplicadas.", "correct": false, "explanation": "Artefatos brutos sem síntese forçam o humano a refazer os 25 turnos de investigação que você acabou de concluir."}, {"letter": "B", "text": "Um resumo estruturado: ID do cliente, causa raiz, valor do reembolso e ação recomendada.", "correct": true, "explanation": "Correto. Um repasse estruturado com identificadores, causa, valor e ação recomendada é o que um agente humano precisa para assumir o caso instantaneamente, sem reinvestigar."}, {"letter": "C", "text": "A transcrição completa da conversa com todos os resultados de ferramentas.", "correct": false, "explanation": "Despejar a transcrição inteira força o humano a vasculhar 25 turnos em vez de ler um resumo de uma tela."}, {"letter": "D", "text": "Apenas o seu diagnóstico e o valor do reembolso.", "correct": false, "explanation": "Faltam os identificadores do cliente e a ação recomendada — o humano não consegue agir sem eles."}], "correct": "B", "task_id": "1.4", "objective": "Implement multi-step workflows with enforcement and handoff patterns", "group": "A"}, {"id": "m34", "domain": 1, "scenario": null, "situation": "A conformidade exige que reembolsos acima de US$ 500 sejam automaticamente escalonados para um agente humano — essa regra não pode ficar a critério do modelo. Apesar de instruções claras no prompt do sistema, os logs de produção mostram que o agente ocasionalmente processa reembolsos de alto valor diretamente (taxa de falha de 3%).", "question": "Como você deve garantir conformidade assegurada?", "options": [{"letter": "A", "text": "Modificar a ferramenta de reembolso para retornar um erro com a mensagem \"Valor excede o limite da política — favor escalonar\" quando o limite for ultrapassado.", "correct": false, "explanation": "Isso ajuda, mas depende de o agente interpretar o erro corretamente e escalonar — ainda é critério do modelo no ponto de decisão."}, {"letter": "B", "text": "Adicionar exemplos few-shot ao prompt mostrando o comportamento correto de escalonamento em diversos valores de reembolso (US$ 400, US$ 500, US$ 600).", "correct": false, "explanation": "Exemplos few-shot deslocam a distribuição, mas não eliminam a falha de 3%. A conformidade diz que a regra não pode ficar a critério do modelo."}, {"letter": "C", "text": "Implementar um hook para interceptar as chamadas de ferramenta; quando o valor do processo de reembolso exceder US$ 500, bloqueá-lo e invocar o escalonamento humano.", "correct": true, "explanation": "Correto. Regras de nível de conformidade pertencem fora do modelo — um hook determinístico na chamada de ferramenta é garantido de disparar sempre, independentemente do comportamento do modelo."}, {"letter": "D", "text": "Reforçar o prompt do sistema com linguagem enfática: \"POLÍTICA CRÍTICA: Reembolsos acima de US$ 500 DEVEM acionar escalonamento humano. NUNCA processe esses diretamente.\"", "correct": false, "explanation": "Prompts enfáticos reduzem, mas não eliminam o uso indevido. Regras que \"não podem ficar a critério do modelo\" descartam qualquer solução baseada apenas em prompt."}], "correct": "C", "task_id": "1.5", "objective": "Apply Agent SDK hooks for tool call interception and data normalization", "group": "E"}, {"id": "m35", "domain": 1, "scenario": null, "situation": "Durante a resolução de uma disputa de cobrança, seu agente recupera com sucesso as informações do cliente via `get_customer` e os detalhes do pedido via `lookup_order`, mas, ao tentar chamar `process_refund`, a ferramenta retorna um erro de timeout. O agente tem informações suficientes para explicar as cobranças e verificar a elegibilidade do reembolso, mas não consegue de fato processar o reembolso devido à falha no backend.", "question": "Qual abordagem equilibra melhor a resolução no primeiro contato com o tratamento de erros adequado?", "options": [{"letter": "A", "text": "Escalonar imediatamente para um agente humano, já que a ação de reembolso não pode ser concluída.", "correct": false, "explanation": "Repassa um problema transitório de backend a um humano quando o agente ainda poderia explicar a situação e oferecer opções."}, {"letter": "B", "text": "Implementar novas tentativas automáticas com backoff exponencial para `process_refund`, mantendo a conversa aberta até que o reembolso seja processado com sucesso.", "correct": false, "explanation": "Forçar o cliente a esperar por novas tentativas indefinidas é uma péssima experiência e pode nunca dar certo se a indisponibilidade for prolongada."}, {"letter": "C", "text": "Explicar a cobrança, confirmar a elegibilidade do reembolso, reconhecer o problema do sistema que impede o processamento imediato e oferecer escalonamento ou nova tentativa mais tarde.", "correct": true, "explanation": "Correto. Entregue o valor parcial que você pode (explicação + elegibilidade), seja honesto sobre a falha e deixe o cliente escolher entre escalonamento humano ou uma nova tentativa. Degradação graciosa clássica."}, {"letter": "D", "text": "Confirmar que o reembolso será processado e encerrar a conversa, já que o sistema tem todas as informações necessárias para concluí-lo automaticamente.", "correct": false, "explanation": "Comprometer-se com um resultado que não aconteceu é enganar o cliente — uma falha maior do que o próprio timeout."}], "correct": "C", "task_id": "1.4", "objective": "Implement multi-step workflows with enforcement and handoff patterns", "group": "A"}, {"id": "m36", "domain": 1, "scenario": null, "situation": "Um cliente escreve: \"Já estou indo e voltando com essa devolução há dias. Só quero falar com alguém que possa realmente me ajudar.\" O agente confirmou via `lookup_order` que a devolução é simples — dentro da política e elegível para processamento imediato.", "question": "O que o agente deve fazer?", "options": [{"letter": "A", "text": "Reconhecer a frustração, informar que isso pode ser resolvido agora e oferecer-se para concluí-la ou escalonar.", "correct": true, "explanation": "Correto. Acolha o sentimento, ofereça por escrito o caminho de resolução rápida e preserve a escolha do cliente. Essa é a atitude de respeito ao cliente que ainda aproveita a capacidade do agente."}, {"letter": "B", "text": "Chamar `escalate_to_human` imediatamente para atender ao pedido do cliente.", "correct": false, "explanation": "Enfileiramento desnecessário quando o problema está a uma chamada de ferramenta de distância. Frustra ainda mais o cliente ao adicionar espera a um caso já simples."}, {"letter": "C", "text": "Processar o reembolso via `process_refund` para resolver o problema de fundo e, em seguida, informar que está concluído.", "correct": false, "explanation": "Toma uma ação unilateral depois que o cliente pediu explicitamente para falar com alguém — passa por cima da preferência declarada por ele."}, {"letter": "D", "text": "Perguntar especificamente o que não funcionou nas tentativas anteriores antes de decidir se escalona ou resolve automaticamente.", "correct": false, "explanation": "Interrogar um cliente frustrado sobre falhas passadas é o oposto do que ele pediu."}], "correct": "A", "task_id": "5.2", "objective": "Design effective escalation and ambiguity resolution patterns", "group": "C"}, {"id": "m39", "domain": 1, "scenario": null, "situation": null, "question": "Quando o agente chama `lookup_order` e recebe detalhes do pedido mostrando que o item foi comprado há 45 dias, como o loop agêntico determina se deve chamar `process_refund` ou `escalate_to_human` em seguida?", "options": [{"letter": "A", "text": "A camada de orquestração roteia automaticamente para a próxima ferramenta com base no campo de status do pedido.", "correct": false, "explanation": "Não existe uma camada de orquestração implícita escolhendo ferramentas a partir de um campo. O modelo conduz a seleção de ferramentas."}, {"letter": "B", "text": "O agente segue uma árvore de decisão pré-configurada que mapeia atributos do pedido para chamadas de ferramentas específicas.", "correct": false, "explanation": "Loops agênticos são conduzidos pelo modelo, não por árvores de decisão. Árvores codificadas são o oposto da proposta do padrão de agente."}, {"letter": "C", "text": "Os detalhes do pedido são adicionados à conversa e o modelo raciocina sobre qual ação tomar.", "correct": true, "explanation": "Correto. O loop agêntico funciona acrescentando mensagens `tool_result` à conversa e deixando o modelo decidir o próximo passo a cada turno. É assim que 45 dias → reembolso vs. escalonamento é resolvido."}, {"letter": "D", "text": "O agente executa as etapas restantes em uma sequência de ferramentas planejada no início da requisição.", "correct": false, "explanation": "Não há um plano comprometido de antemão — o agente escolhe cada próximo passo com base no contexto mais recente."}], "correct": "C", "task_id": "1.1", "objective": "Design and implement agentic loops for autonomous task execution", "group": "A"}, {"id": "m40", "domain": 1, "scenario": null, "situation": "Um cliente envia: \"Isso é frustrante. Já expliquei meu problema duas vezes e nada está sendo resolvido. Quero falar com uma pessoa de verdade AGORA.\" O agente ainda não chamou nenhuma ferramenta para investigar a conta dele.", "question": "O que o agente deve fazer?", "options": [{"letter": "A", "text": "Reconhecer a frustração e fazer uma pergunta direcionada para entender o problema específico antes de escalonar.", "correct": true, "explanation": "Correto. O cliente disse \"duas vezes\", mas você ainda não tem contexto. Uma pergunta focada e acolhedora lhe dá uma chance de resolução no primeiro contato, sem desconsiderar a frustração nem atrasar um possível repasse."}, {"letter": "B", "text": "Explicar brevemente com o que o agente pode ajudar e oferecer-se para resolver o problema rapidamente, escalonando apenas se o cliente repetir o pedido.", "correct": false, "explanation": "Começar a listar capacidades para um cliente frustrado que pediu um humano soa como descaso."}, {"letter": "C", "text": "Chamar `escalate_to_human` imediatamente com o histórico da conversa.", "correct": false, "explanation": "Escalonar sem nenhum contexto de ferramentas cria um repasse frio, no qual o humano também começa do zero."}, {"letter": "D", "text": "Primeiro chamar `get_customer` e `lookup_order` para reunir o contexto da conta e, em seguida, escalonar para um agente humano.", "correct": false, "explanation": "Investigar sem perguntar adiciona latência e não respeita o pedido do cliente. Uma única pergunta acolhedora é mais rápida e mais respeitosa."}], "correct": "A", "task_id": "5.2", "objective": "Design effective escalation and ambiguity resolution patterns", "group": "C"}, {"id": "m41", "domain": 1, "scenario": null, "situation": "Seu agente está tratando uma disputa de cobrança. Depois de chamar `get_customer` e `lookup_order`, ele identifica que a disputa envolve um erro de preço promocional que exige aprovação gerencial — acima do nível de autorização do agente.", "question": "Como o fluxo de trabalho deve lidar com esse escalonamento no meio do processo?", "options": [{"letter": "A", "text": "Chamar `escalate_to_human` repassando apenas a mensagem original do cliente.", "correct": false, "explanation": "Descarta o contexto derivado das ferramentas que o agente acabou de reunir, forçando o humano a refazer a investigação."}, {"letter": "B", "text": "Compilar um repasse estruturado com os dados do cliente, informações do pedido e o problema identificado antes de chamar `escalate_to_human`.", "correct": true, "explanation": "Correto. Um resumo estruturado (quem, qual pedido, qual problema, por que excede a autorização) permite que o agente humano assuma instantaneamente. Esse é o padrão de escalonamento no meio do processo."}, {"letter": "C", "text": "Tentar o reembolso com `process_refund` mesmo assim, escalonando apenas se o sistema rejeitar a transação.", "correct": false, "explanation": "Exceder a autorização de forma consciente é uma violação de política — não é algo para tentar e torcer para que o sistema detecte."}, {"letter": "D", "text": "Persistir a conversa completa e o histórico de respostas das ferramentas em um banco de dados e, em seguida, chamar `escalate_to_human` com um ID de referência.", "correct": false, "explanation": "Adiciona infraestrutura e uma etapa extra de consulta quando um resumo estruturado embutido é mais simples e rápido."}], "correct": "B", "task_id": "1.4", "objective": "Implement multi-step workflows with enforcement and handoff patterns", "group": "A"}, {"id": "g7", "domain": 2, "scenario": "Sistema de Pesquisa Multiagente", "situation": "Logs de produção mostram um padrão persistente: pedidos como \"analise o relatório trimestral enviado\" são roteados ao agente de busca web em 45% das vezes em vez de ao agente de análise de documentos. Revisando as definições das ferramentas, você descobre que o agente de busca web tem uma ferramenta `analyze_content` descrita como \"analyzes content and extracts key information\", enquanto o agente de análise de documentos tem `analyze_document` descrita como \"analyzes documents and extracts key information\". Como corrigir o problema de roteamento errado?", "question": "Como corrigir o problema?", "options": [{"letter": "A", "text": "Adicionar um classificador de pré-roteamento que detecta se o usuário se refere a arquivos enviados ou a conteúdo web antes de o coordenador decidir a delegação.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Renomear a ferramenta de busca web para `extract_web_results` e atualizar sua descrição para \"processes and returns information retrieved from web search and URLs.\"", "correct": true, "explanation": "Renomear a ferramenta de busca web para `extract_web_results` e atualizar a descrição para referenciar explicitamente busca web e URLs remove diretamente a causa-raiz ao eliminar a sobreposição semântica entre nomes e descrições. Isso torna o propósito de cada ferramenta inequívoco, permitindo ao coordenador distinguir análise de documentos de busca web de forma confiável."}, {"letter": "C", "text": "Adicionar exemplos few-shot ao prompt do coordenador mostrando o roteamento correto: \"User uploads a quarterly report → document analysis agent\" e \"User asks about a web page → web-search agent.\"", "correct": false, "explanation": ""}, {"letter": "D", "text": "Expandir a descrição da ferramenta de análise de documentos com exemplos de uso como \"Use for uploaded PDFs, Word docs, and spreadsheets,\" deixando a ferramenta de busca web inalterada.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "2.1", "objective": "Design effective tool interfaces with clear descriptions and boundaries", "group": "J"}, {"id": "g10", "domain": 2, "scenario": "Sistema de Pesquisa Multiagente", "situation": "No seu desenho de sistema, você deu ao agente de análise de documentos acesso a uma ferramenta de uso geral `fetch_url` para que ele pudesse baixar documentos por URL. Logs de produção mostram que esse agente agora frequentemente baixa páginas de resultados de busca para fazer busca web ad hoc — comportamento que deveria passar pelo agente de busca web — causando resultados inconsistentes. Qual correção é mais efetiva?", "question": "Qual correção é mais efetiva?", "options": [{"letter": "A", "text": "Substituir `fetch_url` por uma ferramenta `load_document` que valida que URLs apontem para formatos de documento.", "correct": true, "explanation": "Substituir uma ferramenta de uso geral por uma específica de documento que valida URLs contra formatos de documento ataca a causa-raiz ao restringir capacidade no nível da interface. Isso segue o princípio do menor privilégio, tornando o comportamento indesejado de busca impossível em vez de meramente desencorajado."}, {"letter": "B", "text": "Remover `fetch_url` do agente de análise de documentos e rotear toda busca por URL pelo coordenador para o agente de busca web.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Implementar filtragem que bloqueia chamadas de `fetch_url` para domínios conhecidos de buscadores enquanto permite outras URLs.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Adicionar instruções no prompt do agente de análise de documentos dizendo que `fetch_url` só deve ser usada para baixar URLs de documentos, não para buscar.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "2.3", "objective": "Distribute tools appropriately across agents and configure tool choice", "group": "B"}, {"id": "g15", "domain": 2, "scenario": "Sistema de Pesquisa Multiagente", "situation": "Em testes, você observa que o agente de síntese frequentemente precisa verificar afirmações específicas ao mesclar resultados. Atualmente, quando verificação é necessária, o agente de síntese devolve o controle ao coordenador, que chama o agente de busca web e então re-invoca a síntese com os resultados. Isso adiciona 2–3 loops extras por tarefa e aumenta a latência em 40%. Sua avaliação mostra que 85% dessas verificações são checagens simples (datas, nomes, estatísticas) e 15% exigem pesquisa mais profunda. Qual abordagem é mais efetiva para reduzir overhead preservando confiabilidade?", "question": "Qual abordagem é mais efetiva?", "options": [{"letter": "A", "text": "Dar ao agente de síntese acesso a todas as ferramentas de busca web para que ele possa lidar com qualquer necessidade de verificação diretamente, sem loops do coordenador.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Fazer o agente de síntese acumular todas as necessidades de verificação e devolvê-las como um lote ao coordenador no fim, que então as envia todas de uma vez ao agente de busca web.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Fazer o agente de busca web cachear proativamente contexto extra ao redor de cada fonte durante a pesquisa inicial, antecipando necessidades da síntese.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Dar ao agente de síntese uma ferramenta `verify_fact` de escopo limitado para checagens simples, enquanto roteia verificações complexas pelo coordenador para o agente de busca web.", "correct": true, "explanation": "Uma ferramenta de verificação de fato de escopo limitado deixa o agente de síntese lidar diretamente com 85% das checagens simples, eliminando a maioria dos loops, enquanto preserva o caminho de delegação pelo coordenador para os 15% de verificações complexas. Aplica menor privilégio enquanto reduz significativamente a latência."}], "correct": "D", "task_id": "2.3", "objective": "Distribute tools appropriately across agents and configure tool choice", "group": "B"}, {"id": "g18", "domain": 2, "scenario": "Claude Code para Integração Contínua", "situation": "Seu componente de code review é iterativo: Claude analisa o arquivo modificado, depois pode pedir arquivos relacionados (imports, classes-base, testes) via chamadas de ferramenta para entender contexto antes de prover feedback final. Sua aplicação define uma ferramenta que permite a Claude pedir conteúdo de arquivos; Claude chama a ferramenta, recebe resultados e continua a análise. Você está avaliando processamento em lote para reduzir custo de API. Qual é a principal limitação técnica ao considerar processamento em lote para esse fluxo?", "question": "Qual é a principal limitação técnica?", "options": [{"letter": "A", "text": "O processamento em lote não inclui IDs de correlação para mapear saídas de volta às requisições de entrada.", "correct": false, "explanation": ""}, {"letter": "B", "text": "O modelo assíncrono não consegue executar ferramentas no meio da requisição e devolver resultados para Claude continuar a análise.", "correct": true, "explanation": "A natureza assíncrona da Batch API (uma requisição = uma resposta) significa que ela não consegue executar ferramentas no meio da chamada e devolver resultados para o modelo continuar a análise iterativa. Isso torna fundamentalmente incompatível workflows que precisam de tool calling multi-turn. (A está incorreta: `custom_id` existe. C está incorreta: a Batch API aceita ferramentas nos params. D é uma preocupação real mas não é a limitação fundamental — algumas review podem tolerar 24 horas; a limitação fundamental é não conseguir executar tool calls iterativos em meio à requisição.)"}, {"letter": "C", "text": "A Batch API não suporta definições de ferramentas nos parâmetros da requisição.", "correct": false, "explanation": ""}, {"letter": "D", "text": "A latência de até 24 horas do processamento em lote é lenta demais para feedback de pull request, embora o fluxo funcionasse no resto.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "4.5", "objective": "Design efficient batch processing strategies", "group": "H"}, {"id": "g46", "domain": 2, "scenario": "Agente de Suporte ao Cliente", "situation": "Em testes, você nota que o agente frequentemente chama `get_customer` quando usuários perguntam sobre status de pedido, embora `lookup_order` fosse mais apropriado. O que você deve checar primeiro para tratar esse problema?", "question": "O que você deve checar primeiro?", "options": [{"letter": "A", "text": "Implementar um classificador de pré-processamento para detectar pedidos relacionados a ordem e roteá-los diretamente a `lookup_order`.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Reduzir o número de ferramentas disponíveis ao agente para simplificar a escolha.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Adicionar exemplos few-shot ao system prompt cobrindo todos os padrões possíveis de pedido para melhorar a seleção de ferramentas.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Verificar as descrições das ferramentas para garantir que diferenciem claramente o propósito de cada uma.", "correct": true, "explanation": "Descrições de ferramentas são a entrada principal que o modelo usa para decidir qual chamar. Quando um agente escolhe consistentemente a ferramenta errada, o primeiro passo de diagnóstico é verificar se as descrições separam claramente o propósito e os limites de uso."}], "correct": "D", "task_id": "2.1", "objective": "Design effective tool interfaces with clear descriptions and boundaries", "group": "J"}, {"id": "g51", "domain": 2, "scenario": "Agente de Suporte ao Cliente", "situation": "Logs de produção mostram que em 12% dos casos seu agente pula `get_customer` e chama `lookup_order` diretamente usando apenas o nome fornecido pelo cliente, às vezes levando a contas mal identificadas e reembolsos incorretos. Qual mudança corrige esse problema de confiabilidade de forma mais efetiva?", "question": "Qual mudança é mais efetiva?", "options": [{"letter": "A", "text": "Adicionar exemplos few-shot mostrando que o agente sempre chama `get_customer` primeiro, mesmo quando clientes voluntariamente fornecem detalhes do pedido.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Implementar um classificador de roteamento que analisa cada pedido e habilita só um subconjunto de ferramentas apropriado para o tipo.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Adicionar uma pré-condição programática que bloqueia `lookup_order` e `process_refund` até que `get_customer` retorne um identificador verificado.", "correct": true, "explanation": "Uma pré-condição programática fornece garantia determinística de que o sequenciamento exigido seja seguido. É a abordagem mais efetiva porque elimina a possibilidade de pular a verificação, independentemente do comportamento do LLM."}, {"letter": "D", "text": "Reforçar o system prompt declarando que verificação do cliente via `get_customer` é mandatória antes de qualquer operação de pedido.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "1.5", "objective": "Apply Agent SDK hooks for tool call interception and data normalization", "group": "E"}, {"id": "g55", "domain": 2, "scenario": "Agente de Suporte ao Cliente", "situation": "Sua ferramenta `get_customer` retorna todas as correspondências ao buscar por nome. Atualmente, quando há múltiplos resultados, Claude escolhe o cliente com pedido mais recente, mas dados de produção mostram que isso seleciona a conta errada em 15% dos casos para correspondências ambíguas. Como você deveria tratar isso?", "question": "Como você deveria tratar isso?", "options": [{"letter": "A", "text": "Implementar um sistema de pontuação de confiança que age autonomamente acima de 85% e pede esclarecimento abaixo do limiar.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Instruir Claude a pedir um identificador adicional (email, telefone ou número do pedido) quando `get_customer` retornar múltiplas correspondências antes de tomar qualquer ação específica do cliente.", "correct": true, "explanation": "Pedir ao usuário um identificador adicional é a forma mais confiável de resolver ambiguidade porque o usuário tem conhecimento definitivo da própria identidade. Um turno de conversa extra é um preço pequeno a pagar para eliminar uma taxa de erro de 15% causada por escolher a conta errada."}, {"letter": "C", "text": "Modificar `get_customer` para retornar apenas uma única correspondência mais provável com base em algoritmo de ranking, eliminando ambiguidade.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Adicionar exemplos few-shot ao prompt demonstrando raciocínio correto e sequenciamento de ferramentas para correspondências ambíguas.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "2.1", "objective": "Design effective tool interfaces with clear descriptions and boundaries", "group": "J"}, {"id": "g57", "domain": 2, "scenario": "Agente de Suporte ao Cliente", "situation": "Logs de produção mostram que o agente frequentemente chama `get_customer` quando usuários perguntam sobre pedidos (ex.: \"verifique meu pedido #12345\") em vez de chamar `lookup_order`. Ambas as ferramentas têm descrições mínimas (\"Gets customer information\" / \"Gets order details\") e aceitam formatos de identificador parecidos. Qual é o primeiro passo mais efetivo para melhorar a confiabilidade da seleção de ferramenta?", "question": "Qual é o primeiro passo mais efetivo?", "options": [{"letter": "A", "text": "Implementar uma camada de roteamento que analisa o input do usuário antes de cada turno e pré-seleciona a ferramenta correta com base em palavras-chave detectadas e padrões de ID.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Combinar ambas em uma única `lookup_entity` que aceita qualquer identificador e decide internamente qual backend consultar.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Adicionar exemplos few-shot ao system prompt demonstrando padrões corretos de seleção, com 5–8 exemplos roteando consultas relacionadas a pedido para `lookup_order`.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Expandir a descrição de cada ferramenta para incluir formatos de entrada, queries de exemplo, casos de borda e fronteiras explicando quando usá-la versus ferramentas similares.", "correct": true, "explanation": "Expandir descrições com formatos de entrada, queries de exemplo, casos de borda e fronteiras claras corrige diretamente a causa-raiz — descrições mínimas que não dão ao LLM informação suficiente para distinguir ferramentas similares. É um primeiro passo de baixo esforço e alto impacto que melhora o mecanismo principal usado pelo LLM para seleção de ferramenta."}], "correct": "D", "task_id": "2.1", "objective": "Design effective tool interfaces with clear descriptions and boundaries", "group": "J"}, {"id": "g59", "domain": 2, "scenario": "Agente de Suporte ao Cliente", "situation": "Logs de produção mostram que o agente interpreta mal saídas de suas ferramentas MCP: timestamps Unix de `get_customer`, datas ISO 8601 de `lookup_order` e códigos de status numéricos (1=pendente, 2=enviado). Algumas ferramentas são servidores MCP de terceiros que você não pode modificar. Qual abordagem para normalização de formato de dados é mais mantível?", "question": "Qual abordagem é mais mantível?", "options": [{"letter": "A", "text": "Usar um hook PostToolUse para interceptar saídas de ferramentas e aplicar transformações de formato antes que o agente processe.", "correct": true, "explanation": "Um hook PostToolUse fornece um ponto centralizado e determinístico para interceptar e normalizar todas as saídas de ferramenta — incluindo dados de servidores MCP de terceiros — antes que o agente as processe. É mais mantível porque transformações vivem em código e se aplicam uniformemente, sem depender da interpretação do LLM."}, {"letter": "B", "text": "Modificar ferramentas que você controla para retornar formatos legíveis para humanos e criar wrappers para ferramentas de terceiros.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Criar uma ferramenta `normalize_data` que o agente chama após cada recuperação de dados para transformar valores.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Adicionar documentação detalhada de formato no system prompt explicando convenções de dado de cada ferramenta.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "1.5", "objective": "Apply Agent SDK hooks for tool call interception and data normalization", "group": "E"}, {"id": "g61", "domain": 2, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Sua ferramenta `remove_team_member` usa um parâmetro `dry_run: boolean` para visualizar impactos antes da execução. Monitoramento de produção mostra que o agente burla o passo de preview chamando com `dry_run=false` diretamente. Você precisa garantir que toda remoção seja precedida por um preview que o usuário confirme explicitamente.", "question": "Qual é a abordagem mais confiável?", "options": [{"letter": "A", "text": "Adicionar validação no servidor que permite `dry_run=false` apenas quando uma chamada `dry_run=true` com parâmetros idênticos ocorreu nos últimos 60 segundos.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Anotar a ferramenta como exigindo confirmação e configurar a camada de orquestração para pedir aprovação ao usuário antes de encaminhar quaisquer chamadas a ferramentas anotadas.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Adicionar instruções detalhadas e exemplos few-shot na descrição da ferramenta exigindo que o agente sempre chame com `dry_run=true` primeiro e espere confirmação antes de chamar de novo.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Substituir por duas ferramentas: `preview_remove_member` retorna detalhes de impacto e um token de confirmação de uso único; `execute_remove_member` exige esse token, ligando a execução ao preview.", "correct": true, "explanation": "A abordagem de duas ferramentas com binding por token torna arquiteturalmente impossível executar sem um preview prévio — a ferramenta de execução literalmente exige um token que só a ferramenta de preview pode gerar. É a única abordagem que aplica a restrição no nível de código em vez de depender de conformidade do LLM com instruções (C), heurísticas de timing (A) ou infraestrutura de orquestração (B)."}], "correct": "D", "task_id": "2.1", "objective": "Design effective tool interfaces with clear descriptions and boundaries", "group": "J"}, {"id": "g62", "domain": 2, "scenario": "Padrões de Arquitetura de IA Conversacional", "situation": "Monitoramento de produção mostra que sua ferramenta `search_catalog` falha 12% do tempo: 8% são timeouts de rede que sucedem ao retentar e 4% são erros de sintaxe de query que nunca sucedem por mais que se retente. Atualmente ambos os tipos de erro são retornados de forma idêntica, causando retentativas desperdiçadas.", "question": "Como você deveria modificar o tratamento de erros da ferramenta?", "options": [{"letter": "A", "text": "Adicionar exemplos few-shot ao system prompt demonstrando como distinguir erros de rede de erros de sintaxe.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Aplicar lógica de retry com backoff exponencial uniformemente a todos os erros.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Implementar retry automático com backoff para timeouts de rede dentro da ferramenta; retornar erros de sintaxe imediatamente com detalhes de validação de parâmetro.", "correct": true, "explanation": "Tratar retries no nível da ferramenta para erros transitórios é a fronteira de abstração correta — a ferramenta tem conhecimento definitivo do tipo de erro e pode implementar lógica de retry determinística sem depender do agente para interpretar uma flag (D) ou seguir instruções no nível do prompt (A). Backoff uniforme (B) desperdiça tempo em erros de sintaxe que nunca sucederão."}, {"letter": "D", "text": "Retornar todos os erros com flag booleana `retryable` e detalhes do tipo de erro.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "2.2", "objective": "Implement structured error responses for MCP tools", "group": "J"}, {"id": "m3", "domain": 2, "scenario": null, "situation": "O agente de análise de documentos tem uma única ferramenta `analyze_document` que recebe um documento e um parâmetro de instrução em texto livre. Durante a avaliação, solicitações como \"extrair as principais métricas financeiras\" frequentemente retornam resumos narrativos, enquanto \"resumir a metodologia\" às vezes retorna tabelas de dados brutos. O agente de síntese relata que 35% dos resultados de análise exigem novas solicitações com instruções esclarecidas.", "question": "Qual é a forma mais eficaz de melhorar a confiabilidade?", "options": [{"letter": "A", "text": "Dividir a ferramenta genérica em ferramentas específicas para cada propósito — `extract_data_points`, `summarize_content`, `verify_claim_against_source` — cada uma com contratos de entrada/saída definidos.", "correct": true, "explanation": "Correto. Instruções em texto livre colocam a semântica na prosa, que o modelo interpreta de forma inconsistente. Ferramentas específicas para cada propósito dão ao modelo um contrato explícito e bem tipado para escolher."}, {"letter": "B", "text": "Manter a ferramenta única, mas adicionar um parâmetro enum `analysis_type` que exija a seleção explícita entre os modos de extração, resumo e verificação.", "correct": false, "explanation": "Melhor que texto livre, mas ainda é uma única ferramenta com um único formato de saída. A saída ainda precisa ser uma string genérica, e o modelo pode confundir os modos. Ferramentas separadas impõem contratos de entrada/saída distintos."}, {"letter": "C", "text": "Fazer com que o coordenador pré-classifique cada solicitação de análise antes de passar as instruções ao agente de análise de documentos.", "correct": false, "explanation": "Move a ambiguidade para cima sem resolvê-la. O contrato da ferramenta continua impreciso; a classificação do coordenador é mais uma superfície de erro."}, {"letter": "D", "text": "Aprimorar a descrição da ferramenta com exemplos detalhados mostrando como diferentes formulações de instrução devem mapear para diferentes formatos de saída.", "correct": false, "explanation": "Exemplos ajudam, mas a confiabilidade no uso de ferramentas vem primeiro de limites de ferramenta claros e esquemas de saída, não de engenharia de prompt heroica em uma única ferramenta genérica."}], "correct": "A", "task_id": "2.1", "objective": "Design effective tool interfaces with clear descriptions and boundaries", "group": "J"}, {"id": "m16", "domain": 2, "scenario": null, "situation": "Após integrar um servidor MCP local que fornece ferramentas de análise de código (`analyze_dependencies`, `find_dead_code`, `calculate_complexity`), você verifica que o servidor está saudável e que as ferramentas aparecem na resposta de tools/list. No entanto, você observa que o agente usa consistentemente o Grep para buscar declarações de importação em vez de chamar `analyze_dependencies` — mesmo quando os usuários perguntam explicitamente sobre \"dependências de código\". Ao examinar as definições das ferramentas, você encontra: MCP: `analyze_dependencies` - \"Analisa o grafo de dependências\" Nativa: Grep - \"Busca o conteúdo de arquivos por um padrão usando expressões regulares. Retorna as linhas correspondentes com números de linha e contexto ao redor.\"", "question": "Qual é a abordagem mais eficaz para melhorar a seleção de ferramentas MCP pelo agente?", "options": [{"letter": "A", "text": "Remover o Grep das ferramentas disponíveis quando o servidor MCP estiver conectado, para eliminar a sobreposição funcional.", "correct": false, "explanation": "Mutilar uma ferramenta de uso geral para forçar a adoção de uma especializada penaliza outros casos legítimos de uso do Grep."}, {"letter": "B", "text": "Adicionar instruções de roteamento ao prompt do sistema especificando que perguntas relacionadas a dependências devem usar ferramentas MCP em vez do Grep.", "correct": false, "explanation": "O roteamento no nível do prompt pode ajudar, mas a causa raiz é que a descrição da ferramenta MCP é mais pobre que a do Grep. Corrija primeiro as descrições das ferramentas."}, {"letter": "C", "text": "Dividir `analyze_dependencies` em ferramentas granulares (`list_imports`, `resolve_transitive_deps`, `detect_circular_deps`) para que cada uma tenha um propósito focado e menos propenso a se sobrepor ao Grep.", "correct": false, "explanation": "Dividir às vezes é o certo, mas aqui as ferramentas irmãs ainda teriam descrições fracas. O mesmo bug de seleção reapareceria."}, {"letter": "D", "text": "Expandir as descrições das ferramentas MCP para detalhar capacidades e saídas — por exemplo, \"Constrói um grafo de dependências mostrando importações diretas, dependências transitivas e ciclos.\"", "correct": true, "explanation": "Correto. A seleção de ferramentas é guiada pelas descrições que o modelo vê. Uma descrição de uma linha como 'Analisa o grafo de dependências' perde para a descrição rica do Grep. Reforce a descrição da ferramenta MCP."}], "correct": "D", "task_id": "2.1", "objective": "Design effective tool interfaces with clear descriptions and boundaries", "group": "J"}, {"id": "m17", "domain": 2, "scenario": null, "situation": "Um engenheiro pede ao agente para encontrar todos os chamadores de uma função antes de removê-la. A função é definida em uma biblioteca central, mas também é exposta por meio de módulos wrapper que renomeiam a função para uso específico de domínio (por exemplo, calculateTax na biblioteca torna-se computeOrderTax no módulo de pedidos).", "question": "Qual estratégia de exploração identificará de forma mais confiável todos os chamadores?", "options": [{"letter": "A", "text": "Ler a biblioteca e os módulos wrapper para identificar todos os nomes sob os quais a função é exposta e, em seguida, usar o Grep para cada nome em toda a base de código.", "correct": true, "explanation": "Correto. Você precisa enumerar cada nome sob o qual a função é exposta — caso contrário, wrappers renomeados ocultam chamadores. Leia os módulos relevantes, reúna todos os aliases e então faça grep para cada um."}, {"letter": "B", "text": "Usar o Grep para encontrar todos os arquivos que importam da biblioteca ou dos módulos wrapper e, então, ler cada arquivo para verificar se ele usa a função.", "correct": false, "explanation": "Deixa de fora importações dinâmicas, reexportações e cadeias de chamada indiretas. Além disso, escala mal."}, {"letter": "C", "text": "Usar o Grep para buscar o nome original da função em toda a base de código.", "correct": false, "explanation": "O nome original não aparecerá em lugar nenhum onde um wrapper o tenha renomeado — você perderia uma classe significativa de chamadores."}, {"letter": "D", "text": "Buscar o nome da função na documentação do projeto para entender os padrões de uso pretendidos e navegar até os pontos de integração documentados.", "correct": false, "explanation": "A documentação é incompleta e frequentemente desatualizada. Você não pode remover uma função com segurança baseando-se em evidências de nível documental."}], "correct": "A", "task_id": "5.4", "objective": "Manage context effectively in large codebase exploration", "group": "G"}, {"id": "m27", "domain": 2, "scenario": null, "situation": "Após adicionar um servidor MCP com ferramentas especializadas de refatoração de código (`extract_function`, `rename_variable`, `inline_function`), você nota que o agente ainda usa manipulação básica de texto via Write e comandos sed do Bash para tarefas de refatoração. O servidor MCP está conectado e saudável. Ao examinar a configuração, você descobre que cada ferramenta MCP tem uma descrição mínima como \"`extract_function`: extrai uma função do código.\"", "question": "Qual é a maneira mais eficaz de melhorar a adoção das ferramentas de refatoração MCP?", "options": [{"letter": "A", "text": "Implementar um classificador de requisições que detecta a intenção de refatoração e roteia automaticamente essas requisições para o servidor MCP antes de o agente processá-las.", "correct": false, "explanation": "Um classificador prévio é um sistema separado para manter e pode rotear de forma errada. A correção mais barata é tornar as descrições das ferramentas fortes o suficiente para que o agente as escolha por conta própria."}, {"letter": "B", "text": "Remover a ferramenta Write da configuração do agente durante as sessões de refatoração, de modo que ele seja obrigado a usar as ferramentas MCP para modificações de código.", "correct": false, "explanation": "Remover ferramentas de uso geral força a adoção por subtração e quebra casos legítimos de uso do Write."}, {"letter": "C", "text": "Aceitar isso como comportamento esperado, já que ferramentas mais simples como o sed são mais previsíveis do que ferramentas especializadas de refatoração.", "correct": false, "explanation": "Capitular anula o propósito de integrar ferramentas de refatoração. A integração está bem — as descrições é que são o problema."}, {"letter": "D", "text": "Aprimorar as descrições das ferramentas MCP para explicar quando cada ferramenta é preferível à manipulação de texto e esclarecer as entradas e saídas esperadas.", "correct": true, "explanation": "Correto. A seleção de ferramentas é guiada pelas descrições que o Claude vê. Quando as ferramentas MCP dizem 'extrai uma função do código' e o Write/sed vêm com documentação rica, o Claude escolhe o Write/sed. Reforce as descrições."}], "correct": "D", "task_id": "2.1", "objective": "Design effective tool interfaces with clear descriptions and boundaries", "group": "J"}, {"id": "m29", "domain": 2, "scenario": null, "situation": "Seu agente precisa inserir uma nova função auxiliar no meio de um módulo utilitário de 150 linhas, entre duas funções existentes. A ferramenta Edit falha porque seu parâmetro `old_string` não consegue encontrar um texto único para correspondência — o arquivo tem docstrings, nomes de variáveis e padrões estruturais repetitivos.", "question": "Qual é a maneira mais confiável de concluir essa inserção?", "options": [{"letter": "A", "text": "Usar o Edit com um `old_string` extremamente longo, capturando mais de 30 linhas de contexto para garantir a unicidade", "correct": false, "explanation": "Strings de correspondência longas e frágeis frequentemente falham devido a espaços em branco ou pequenas edições e produzem falhas confusas."}, {"letter": "B", "text": "Usar o parâmetro `replace_all` do Edit para mirar em um padrão comum e embutir a nova função no texto de substituição", "correct": false, "explanation": "`replace_all` modificaria todas as ocorrências do padrão — corrompendo o arquivo inteiro."}, {"letter": "C", "text": "Usar o Bash para anexar a definição da função ao final do arquivo usando a sintaxe de heredoc", "correct": false, "explanation": "Anexar coloca a função no local errado. O requisito é inserir entre duas funções existentes."}, {"letter": "D", "text": "Usar o Read para carregar o arquivo, adicionar a função no local apropriado e, então, usar o Write para gravar o arquivo atualizado", "correct": true, "explanation": "Correto. Quando o contrato de correspondência única do Edit não pode ser satisfeito em um arquivo repetitivo, recorra a Read → modificar em memória na linha pretendida → gravar o arquivo completo de volta com Write."}], "correct": "D", "task_id": "2.5", "objective": "Select and apply built-in tools (Read, Write, Edit, Bash, Grep, Glob) effectively", "group": "F"}, {"id": "m38", "domain": 2, "scenario": null, "situation": "Os logs de produção revelam um tratamento de erros inconsistente: quando `lookup_order` falha, o agente às vezes tenta novamente mais de 5 vezes (desperdício quando o ID do pedido não existe), às vezes escalona imediatamente (prematuro para problemas temporários de rede) e às vezes pede esclarecimentos ao usuário (inadequado quando o problema é um erro de permissão no backend). A investigação mostra que sua ferramenta MCP retorna respostas de erro uniformes: {\"isError\": true, \"content\": [{\"type\": \"text\", \"text\": \"Operation failed\"}]}. O agente não consegue distinguir entre os tipos de erro.", "question": "Qual é a melhoria mais eficaz?", "options": [{"letter": "A", "text": "Enriquecer as respostas de erro com metadados estruturados: incluir errorCategory (transient/validation/permission), um booleano isRetryable e uma descrição do que causou a falha.", "correct": true, "explanation": "Correto. Dê ao agente a informação de que ele precisa para tomar a decisão certa: categoria, possibilidade de nova tentativa e uma causa legível por humanos. Isso substitui a adivinhação por uma política determinística."}, {"letter": "B", "text": "Criar uma ferramenta MCP `analyze_error` que o agente chama após qualquer falha para determinar a categoria do erro e a ação recomendada.", "correct": false, "explanation": "Adiciona uma viagem de ida e volta extra para algo que a ferramenta original já sabe. Coloque os metadados na resposta original."}, {"letter": "C", "text": "Implementar lógica de nova tentativa com backoff exponencial no seu servidor MCP para todos os erros, retornando ao agente somente depois de esgotadas as tentativas.", "correct": false, "explanation": "Novas tentativas indiscriminadas prejudicam em erros permanentes (pedido não encontrado) e escondem distinções úteis do agente."}, {"letter": "D", "text": "Adicionar exemplos few-shot ao prompt do sistema demonstrando como interpretar padrões de mensagens de erro e selecionar respostas adequadas para cada um.", "correct": false, "explanation": "Se a ferramenta retorna \"Operation failed\" para toda falha, nenhuma quantidade de exemplos few-shot extrai informação de categoria que não está lá."}], "correct": "A", "task_id": "2.2", "objective": "Implement structured error responses for MCP tools", "group": "J"}, {"id": "m43", "domain": 2, "scenario": null, "situation": "Ao implementar sua ferramenta MCP `lookup_order`, o backend às vezes retorna erros (por exemplo, \"Order not found\" ou falhas temporárias de banco de dados).", "question": "Qual é o padrão correto para comunicar esses erros de volta ao agente?", "options": [{"letter": "A", "text": "Registrar o erro no lado do servidor e retornar um resultado vazio para evitar confundir o modelo.", "correct": false, "explanation": "Retornar sucessos vazios faz o agente pensar que não existem dados, em vez de que algo deu errado — uma confusão diferente e pior."}, {"letter": "B", "text": "Retornar a mensagem de erro no conteúdo do resultado da ferramenta, com a flag isError definida como true.", "correct": true, "explanation": "Correto. O padrão projetado do MCP: colocar o texto do erro no campo content e marcar isError=true. O Claude vê tanto a flag de falha quanto uma mensagem legível para raciocinar."}, {"letter": "C", "text": "Lançar uma exceção a partir do handler da ferramenta para que o framework do agente possa capturá-la e registrá-la.", "correct": false, "explanation": "Exceções não capturadas quebram o protocolo da ferramenta e não dão ao modelo nada com que raciocinar."}, {"letter": "D", "text": "Retornar uma resposta de sucesso com um campo \"status\" indicando o tipo de erro.", "correct": false, "explanation": "Campos \"status\" improvisados variam entre ferramentas e o modelo não tem uma forma padrão de interpretá-los. isError é o padrão."}], "correct": "B", "task_id": "2.2", "objective": "Implement structured error responses for MCP tools", "group": "J"}, {"id": "m44", "domain": 2, "scenario": null, "situation": "Sua ferramenta `process_refund` retorna dois tipos de erro: erros técnicos (\"503 Service Unavailable\", \"Connection timeout\") que são transitórios (5% das chamadas) e erros de negócio (\"Order exceeds 30-day return window\", \"Item already refunded\") que são permanentes (12% das chamadas). O monitoramento mostra que o agente desperdiça de 3 a 4 turnos tentando novamente erros de negócio que nunca podem ter sucesso. Atualmente, ambos os tipos de erro retornam apenas uma mensagem de texto simples ao Claude.", "question": "Qual é a forma mais eficaz de reduzir as novas tentativas desperdiçadas e, ao mesmo tempo, melhorar a qualidade das respostas voltadas ao cliente?", "options": [{"letter": "A", "text": "Retornar respostas de erro estruturadas com retryable: false para erros de negócio e uma explicação amigável ao cliente para o Claude usar.", "correct": true, "explanation": "Correto. Uma flag retryable diz ao Claude, de forma determinística, \"não tente novamente\", e uma mensagem amigável ao cliente já pronta melhora a resposta de saída. Resolve os dois problemas de uma vez."}, {"letter": "B", "text": "Adicionar exemplos few-shot mostrando como distinguir erros recuperáveis de não recuperáveis analisando o texto da mensagem de erro.", "correct": false, "explanation": "Depender de o modelo analisar textos de erro como strings é frágil e é exatamente a instabilidade que você vê hoje."}, {"letter": "C", "text": "Adicionar uma ferramenta `check_refund_eligibility` que deve ser chamada antes de `process_refund` para evitar violações de regras de negócio.", "correct": false, "explanation": "Útil em princípio, mas adiciona uma viagem de ida e volta a todo reembolso para proteger contra 12% dos casos, e não ajuda quando `process_refund` ainda falha por outros motivos de negócio."}, {"letter": "D", "text": "Implementar lógica de nova tentativa automática no nível da ferramenta apenas para erros técnicos, repassando erros de negócio ao Claude sem novas tentativas.", "correct": false, "explanation": "Esconder novas tentativas transitórias dentro da ferramenta pode mascarar latência e tira o modelo do circuito nas decisões de recuperação. Os erros de negócio também continuam chegando como uma string simples, então a resposta voltada ao cliente não melhora."}], "correct": "A", "task_id": "2.2", "objective": "Implement structured error responses for MCP tools", "group": "J"}, {"id": "m55", "domain": 2, "scenario": null, "situation": "Seu pipeline usa uma ferramenta chamada `extract_metadata` com um esquema JSON para detalhes do artigo. Você também definiu as ferramentas `lookup_citations` e `verify_doi` para enriquecimento. Durante os testes, você nota que, quando os usuários incluem pedidos como \"extract the metadata and tell me how cited it is\", o Claude às vezes chama `lookup_citations` primeiro, o que falha porque ela precisa do DOI que `extract_metadata` forneceria.", "question": "Qual é a maneira mais eficaz de garantir que a extração estruturada de metadados aconteça primeiro?", "options": [{"letter": "A", "text": "Definir `tool_choice` como \"any\" para que o Claude tenha de usar uma ferramenta, combinado com instruções no prompt do sistema priorizando `extract_metadata`.", "correct": false, "explanation": "'any' força uma chamada de ferramenta, mas não força a correta. Você ainda veria `lookup_citations` sendo escolhida primeiro."}, {"letter": "B", "text": "Definir `tool_choice` como \"auto\" e reordenar as definições de ferramentas para que `extract_metadata` apareça primeiro no array de ferramentas, já que o Claude prioriza as ferramentas listadas antes.", "correct": false, "explanation": "Não há uma preferência de ordenação documentada na qual confiar; isso pressupõe um comportamento que não é contratual."}, {"letter": "C", "text": "Definir `tool_choice` como {\"type\": \"tool\", \"name\": \"`extract_metadata`\"} e processar os pedidos de enriquecimento em turnos subsequentes, depois de receber os metadados extraídos.", "correct": true, "explanation": "Correto. `tool_choice`=ferramenta-específica força de forma determinística `extract_metadata` no primeiro turno. Em seguida, você devolve o controle para 'auto' e deixa o modelo usar o enriquecimento de citações/DOI com os metadados em contexto."}, {"letter": "D", "text": "Definir `tool_choice` como {\"type\": \"tool\", \"name\": \"`extract_metadata`\"} para toda chamada de API no pipeline, garantindo que o Claude sempre extraia metadados antes que qualquer enriquecimento possa ocorrer.", "correct": false, "explanation": "Fixar `extract_metadata` em toda chamada impede que as ferramentas de enriquecimento sejam usadas."}], "correct": "C", "task_id": "2.3", "objective": "Distribute tools appropriately across agents and configure tool choice", "group": "B"}, {"id": "g16", "domain": 3, "scenario": "Claude Code para Integração Contínua", "situation": "Seu pipeline de CI executa o Claude Code CLI (em modo `--print`) usando CLAUDE.md para fornecer contexto do projeto para code review, e os devs em geral acham as reviews substantivas. Porém, eles relatam que integrar achados ao workflow é difícil — Claude emite parágrafos narrativos que precisam ser copiados manualmente para comentários no PR. O time quer postar automaticamente cada achado como comentário inline separado no local relevante do código, o que exige dados estruturados com path do arquivo, número da linha, nível de severidade e correção sugerida. Qual abordagem é mais efetiva?", "question": "Qual abordagem é mais efetiva?", "options": [{"letter": "A", "text": "Adicionar uma seção \"Output Format for Review\" ao CLAUDE.md com exemplos de achados estruturados para que Claude aprenda o formato esperado a partir do contexto do projeto.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Usar as flags do CLI `--output-format json` e `--json-schema` para forçar achados estruturados, depois parsear a saída para postar comentários inline via API do GitHub.", "correct": true, "explanation": "Usar `--output-format json` com `--json-schema` força saída estruturada no nível do CLI, garantindo JSON bem formado com os campos exigidos (path, linha, severidade, correção sugerida) que pode ser parseado de forma confiável e postado como comentários inline via API do GitHub. Aproveita capacidades nativas do CLI projetadas justamente para saída estruturada."}, {"letter": "C", "text": "Incluir instruções explícitas de formatação no prompt de review exigindo que cada achado siga um template parseável como `[FILE:path] [LINE:n] [SEVERITY:level] ...`.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Manter o formato narrativo de review mas adicionar um passo de sumarização que use Claude para gerar um sumário JSON estruturado dos achados.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "3.6", "objective": "Integrate Claude Code into CI/CD pipelines", "group": "D"}, {"id": "g26", "domain": 3, "scenario": "Claude Code para Integração Contínua", "situation": "Seu script de pipeline executa `claude \"Analyze this pull request for security issues\"`, mas o job trava indefinidamente. Logs mostram que o Claude Code está esperando entrada interativa. Qual é a abordagem correta para rodar Claude Code em pipeline automatizado?", "question": "Qual é a abordagem correta?", "options": [{"letter": "A", "text": "Adicionar a flag `--batch`: `claude --batch \"Analyze this pull request for security issues\"`.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Adicionar a flag `-p`: `claude -p \"Analyze this pull request for security issues\"`.", "correct": true, "explanation": "A flag `-p` (ou `--print`) é a forma documentada de rodar Claude Code em modo não-interativo. Processa o prompt, imprime o resultado no stdout e encerra sem esperar entrada do usuário — ideal para pipelines CI/CD."}, {"letter": "C", "text": "Redirecionar stdin de `/dev/null`: `claude \"Analyze this pull request for security issues\" \u003c /dev/null`.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Definir a variável de ambiente `CLAUDE_HEADLESS=true` antes de executar o comando.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "3.6", "objective": "Integrate Claude Code into CI/CD pipelines", "group": "D"}, {"id": "g32", "domain": 3, "scenario": "Geração de Código com Claude Code", "situation": "Você precisa adicionar Slack como novo canal de notificação. A base existente tem padrões claros e estabelecidos para email, SMS e push. Porém, a API do Slack oferece abordagens fundamentalmente diferentes — webhooks de entrada (simples, unidirecional), bot tokens (suporte a confirmação de entrega e controle programático), ou Slack Apps (eventos bidirecionais, requer aprovação do workspace). Sua tarefa diz \"adicionar suporte a Slack\" sem especificar método de integração ou exigir features avançadas como tracking de entrega.", "question": "Como abordar essa tarefa?", "options": [{"letter": "A", "text": "Começar em modo de execução direta usando webhooks de entrada para casar com o padrão existente unidirecional.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Mudar para modo de planejamento para explorar opções de integração e implicações arquiteturais, depois apresentar uma recomendação antes da implementação.", "correct": true, "explanation": "Integração com Slack tem múltiplas abordagens válidas com implicações arquiteturais significativamente diferentes, e os requisitos são ambíguos. O modo de planejamento deixa avaliar trade-offs entre webhooks, bot tokens e Slack Apps e alinhar uma abordagem antes de implementar."}, {"letter": "C", "text": "Começar em execução direta fazendo scaffolding de uma classe de canal Slack usando padrões existentes, adiando a decisão do método de integração.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Começar em execução direta usando uma abordagem de bot-token para garantir que confirmação de entrega seja possível.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "3.4", "objective": "Determine when to use plan mode vs direct execution", "group": "C"}, {"id": "g33", "domain": 3, "scenario": "Geração de Código com Claude Code", "situation": "Seu CLAUDE.md cresceu para 400+ linhas contendo padrões de código, convenções de testes, um checklist detalhado de PR review, instruções de deploy e procedimentos de migração de banco. Você quer que Claude sempre siga padrões de código e convenções de testes, mas aplique guias de PR review, deploy e migration apenas quando estiver fazendo essas tarefas.", "question": "Qual abordagem de reestruturação é mais efetiva?", "options": [{"letter": "A", "text": "Mover toda a orientação para arquivos Skills separados organizados por tipo de fluxo, deixando apenas uma breve descrição do projeto no CLAUDE.md.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Manter tudo no CLAUDE.md mas usar sintaxe `@import` para organizar em arquivos mantidos separadamente por categoria.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Dividir o CLAUDE.md em arquivos sob `.claude/rules/` com padrões glob path-bound para que cada regra carregue só para os tipos de arquivo relevantes.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Manter padrões universais no CLAUDE.md e criar Skills para guias específicos de fluxo (PR review, deploy, migrations) com palavras-chave de gatilho.", "correct": true, "explanation": "Conteúdo do CLAUDE.md carrega em toda sessão, garantindo que padrões de código e convenções de teste sempre se apliquem, enquanto Skills são invocadas sob demanda quando Claude detecta palavras-chave de gatilho — ideal para guias específicos de fluxo como PR review, deploy e migrations."}], "correct": "D", "task_id": "3.1", "objective": "Configure CLAUDE.md files with appropriate hierarchy, scoping, and modular organization", "group": "D"}, {"id": "g34", "domain": 3, "scenario": "Geração de Código com Claude Code", "situation": "Você foi designado para reestruturar a aplicação monolítica do seu time em microsserviços. Isso impacta mudanças em dezenas de arquivos e exige decisões sobre fronteiras de serviço e dependências de módulos.", "question": "Qual abordagem você deve escolher?", "options": [{"letter": "A", "text": "Mudar para modo de planejamento para explorar a base, entender dependências e desenhar a abordagem de implementação antes de fazer mudanças.", "correct": true, "explanation": "Modo de planejamento é a estratégia certa para reestruturação arquitetural complexa como dividir um monolito: permite exploração segura e decisões informadas sobre fronteiras antes de comprometer-se com mudanças potencialmente caras em muitos arquivos."}, {"letter": "B", "text": "Começar em execução direta e mudar para planejamento somente após encontrar complexidade inesperada durante a implementação.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Começar em execução direta e fazer mudanças incrementais, deixando a implementação revelar fronteiras naturais de serviço.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Usar execução direta com instruções detalhadas antecipadas que especificam a estrutura de cada serviço.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "3.4", "objective": "Determine when to use plan mode vs direct execution", "group": "C"}, {"id": "g35", "domain": 3, "scenario": "Geração de Código com Claude Code", "situation": "Seu time criou uma skill `/analyze-codebase` que faz análise profunda de código — varredura de dependências, contagem de cobertura de testes e métricas de qualidade. Após rodar o comando, membros do time relatam que Claude fica menos responsivo na sessão e perde o contexto da tarefa original.", "question": "Como você corrige isso de forma mais efetiva mantendo as capacidades plenas de análise?", "options": [{"letter": "A", "text": "Adicionar `context: fork` no frontmatter da skill para rodar a análise em contexto isolado de subagente.", "correct": true, "explanation": "`context: fork` roda a análise em contexto de subagente isolado, de modo que a saída grande não polui a janela de contexto da sessão principal e Claude não perde o rastro da tarefa original. Preserva capacidade plena de análise mantendo a sessão principal responsiva."}, {"letter": "B", "text": "Adicionar `model: haiku` no ": 3, "scenario": "Geração de Código com Claude Code", "situation": "Seu time usa Claude Code há meses. Recentemente, três devs reportam que Claude segue a orientação \"sempre incluir tratamento abrangente de erros\", mas um quarto dev recém-chegado diz que Claude não a segue. Os quatro trabalham no mesmo repo e têm código atualizado.", "question": "Qual a causa mais provável e correção?", "options": [{"letter": "A", "text": "A orientação está nos arquivos de nível usuário `~/.claude/CLAUDE.md` dos devs originais, não no `.claude/CLAUDE.md` do projeto. Mover a instrução para o arquivo de nível projeto para que todos os membros recebam.", "correct": true, "explanation": "Se a orientação foi adicionada apenas aos configs de nível usuário dos devs originais e não ao `.claude/CLAUDE.md` do projeto, novos membros não a recebem. Mover para a configuração de nível projeto garante que todos os membros atuais e futuros recebam a orientação automaticamente."}, {"letter": "B", "text": "O `~/.claude/CLAUDE.md` do novo dev contém instruções conflitantes que sobrescrevem o projeto; ele deve apagar a seção conflitante.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Claude Code aprende preferências por usuário com o tempo; o novo dev precisa repetir o requisito até Claude \"lembrar\".", "correct": false, "explanation": ""}, {"letter": "D", "text": "Claude Code cacheia CLAUDE.md após a primeira leitura; os devs originais usam versões em cache. Todos devem limpar o cache.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "3.1", "objective": "Configure CLAUDE.md files with appropriate hierarchy, scoping, and modular organization", "group": "D"}, {"id": "g38", "domain": 3, "scenario": "Geração de Código com Claude Code", "situation": "Você descobre que incluir 2–3 implementações completas de endpoint como contexto melhora significativamente a consistência ao gerar novos endpoints de API. Porém, esse contexto só é útil ao criar novos endpoints — não ao depurar, revisar código ou outros trabalhos no diretório de API.", "question": "Qual abordagem de configuração é mais efetiva?", "options": [{"letter": "A", "text": "Adicionar exemplos de endpoint e documentação de padrão ao CLAUDE.md do projeto para que estejam sempre disponíveis.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Referenciar manualmente exemplos de endpoint em cada solicitação de geração copiando código no prompt.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Configurar regras path-specific em `.claude/rules/api/` que incluam exemplos de endpoint e ativem ao trabalhar no diretório de API.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Criar uma skill que referencie os exemplos de endpoint e contenha instruções de seguimento de padrão, invocada sob demanda via slash command.", "correct": true, "explanation": "Uma skill invocada sob demanda carrega o contexto de exemplo apenas ao gerar novos endpoints, não em tarefas não relacionadas como depuração ou review. Isso mantém o contexto principal limpo enquanto preserva geração de alta qualidade quando necessária."}], "correct": "D", "task_id": "3.1", "objective": "Configure CLAUDE.md files with appropriate hierarchy, scoping, and modular organization", "group": "D"}, {"id": "g39", "domain": 3, "scenario": "Geração de Código com Claude Code", "situation": "Seu time criou uma skill `/migration` que gera arquivos de migração de banco. Recebe o nome da migração via `$ARGUMENTS`. Em produção você observa três problemas: (1) devs frequentemente rodam a skill sem argumentos, causando arquivos mal nomeados, (2) a skill às vezes usa detalhes de schema de conversas anteriores não relacionadas, e (3) um dev rodou acidentalmente cleanup destrutivo de teste quando a skill tinha acesso amplo a ferramentas.", "question": "Qual abordagem de configuração corrige todos os três problemas?", "options": [{"letter": "A", "text": "Usar parâmetros posicionais `$1` e `$2` em vez de `$ARGUMENTS` para forçar entradas específicas, incluir referências explícitas a schema via sintaxe `@` para controle de contexto, e adicionar uma descrição no frontmatter alertando sobre operações destrutivas.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Adicionar `argument-hint` no frontmatter para pedir parâmetros obrigatórios, usar `context: fork` para isolar a execução, e restringir `allowed-tools` a operações de escrita de arquivo.", "correct": true, "explanation": "Usa três features de configuração separadas para tratar cada problema: `argument-hint` melhora a entrada de argumentos e reduz argumentos faltando, `context: fork` impede vazamento de contexto de conversas anteriores e `allowed-tools` restringe a skill a operações seguras de escrita de arquivo, prevenindo ações destrutivas."}, {"letter": "C", "text": "Dividir em `/migration-create` e `/migration-apply`, adicionar instruções de validação para pedir o nome da migração se faltar e usar escopos de `allowed-tools` diferentes para cada.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Adicionar instruções de validação no SKILL.md para garantir que `$ARGUMENTS` seja um nome válido, adicionar prompts para ignorar contexto de conversas anteriores e listar operações proibidas.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "3.2", "objective": "Create and configure custom slash commands and skills", "group": "D"}, {"id": "g40", "domain": 3, "scenario": "Geração de Código com Claude Code", "situation": "Sua base contém áreas com convenções de código diferentes: componentes React usam estilo funcional com hooks, handlers de API usam async/await com tratamento específico de erros e modelos de banco seguem o padrão repository. Arquivos de teste estão distribuídos pela base ao lado do código sob teste (ex.: `Button.test.tsx` ao lado de `Button.tsx`), e você quer que todos os testes sigam as mesmas convenções independentemente da localização.", "question": "Qual é a forma mais suportada de garantir que Claude aplique automaticamente as convenções corretas ao gerar código?", "options": [{"letter": "A", "text": "Colocar todas as convenções no CLAUDE.md raiz sob cabeçalhos por área e contar com Claude para inferir qual seção se aplica.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Criar skills em `.claude/skills/` para cada tipo de código, embutindo convenções em cada SKILL.md.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Colocar um arquivo CLAUDE.md separado em cada subdiretório com convenções para aquela área.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Criar arquivos de regra em `.claude/rules/` com frontmatter YAML especificando padrões glob para aplicar convenções condicionalmente baseadas em paths.", "correct": true, "explanation": "Arquivos `.claude/rules/` com frontmatter YAML e padrões glob (ex.: `**/*.test.tsx`, `src/api/**/*.ts`) permitem aplicação determinística e baseada em path de convenções independente da estrutura de diretórios. É a abordagem mais suportada para padrões cross-cutting como arquivos de teste distribuídos."}], "correct": "D", "task_id": "3.1", "objective": "Configure CLAUDE.md files with appropriate hierarchy, scoping, and modular organization", "group": "D"}, {"id": "g41", "domain": 3, "scenario": "Geração de Código com Claude Code", "situation": "Você quer criar um slash command customizado `/review` que rode o checklist padrão de code review do seu time. Ele deve estar disponível para todo dev quando clonar ou atualizar o repositório.", "question": "Onde criar o arquivo do comando?", "options": [{"letter": "A", "text": "Em `~/.claude/commands/` no diretório home de cada dev.", "correct": false, "explanation": ""}, {"letter": "B", "text": "No repositório do projeto sob `.claude/commands/`.", "correct": true, "explanation": "Colocar slash commands customizados sob `.claude/commands/` dentro do repositório do projeto garante que estejam versionados e disponíveis automaticamente para todo dev que clone ou atualize o repo. É o local previsto para comandos customizados de nível projeto no Claude Code."}, {"letter": "C", "text": "Em `.claude/config.json` como array de comandos.", "correct": false, "explanation": ""}, {"letter": "D", "text": "No CLAUDE.md raiz do projeto.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "3.2", "objective": "Create and configure custom slash commands and skills", "group": "D"}, {"id": "g42", "domain": 3, "scenario": "Geração de Código com Claude Code", "situation": "O CLAUDE.md do seu time cresceu além de 500 linhas misturando convenções TypeScript, orientação de testes, padrões de API e procedimentos de deploy. Devs têm dificuldade de localizar e atualizar as seções certas.", "question": "Qual abordagem o Claude Code suporta para organizar instruções de nível projeto em módulos tópicos focados?", "options": [{"letter": "A", "text": "Definir um `.claude/config.yaml` mapeando padrões de arquivo a seções específicas dentro do CLAUDE.md.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Criar arquivos Markdown separados em `.claude/rules/`, cada um cobrindo um tópico (ex.: `testing.md`, `api-conventions.md`).", "correct": true, "explanation": "Claude Code suporta um diretório `.claude/rules/` onde você pode criar arquivos Markdown separados para guias tópicos (ex.: `testing.md`, `api-conventions.md`), permitindo a times organizar grandes conjuntos de instruções em módulos focados e mantíveis."}, {"letter": "C", "text": "Dividir instruções em arquivos README.md em subdiretórios relevantes que Claude carrega automaticamente como instruções.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Criar múltiplos arquivos chamados CLAUDE.md em níveis diferentes da árvore de diretórios, cada um sobrescrevendo instruções pai.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "3.1", "objective": "Configure CLAUDE.md files with appropriate hierarchy, scoping, and modular organization", "group": "D"}, {"id": "g43", "domain": 3, "scenario": "Geração de Código com Claude Code", "situation": "Você cria uma skill customizada `/explore-alternatives` que seu time usa para fazer brainstorming e avaliar abordagens de implementação antes de escolher uma. Devs reportam que após rodar a skill, respostas subsequentes do Claude são influenciadas pela discussão de alternativas — às vezes referenciando abordagens rejeitadas ou retendo contexto de exploração que interfere na implementação real.", "question": "Como configurar essa skill de forma mais efetiva?", "options": [{"letter": "A", "text": "Usar o prefixo `!` na skill para rodar lógica de exploração como subprocesso bash.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Adicionar `context: fork` no frontmatter da skill.", "correct": true, "explanation": "`context: fork` roda a skill em contexto isolado de subagente para que discussões de exploração não poluam o histórico da conversa principal. Isso impede que abordagens rejeitadas e contexto de brainstorming influenciem trabalho subsequente de implementação."}, {"letter": "C", "text": "Dividir em duas skills — `/explore-start` e `/explore-end` — para marcar fronteiras quando o contexto de exploração deve ser descartado.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Criar a skill em `~/.claude/skills/` em vez de `.claude/skills/`.", "correct": false, "explanation": ""}], "correct": "B", "task_id": "3.2", "objective": "Create and configure custom slash commands and skills", "group": "D"}, {"id": "g44", "domain": 3, "scenario": "Geração de Código com Claude Code", "situation": "Seu time quer adicionar um servidor MCP do GitHub para buscar PRs e checar status de CI via Claude Code. Cada um dos seis devs tem seu próprio token pessoal de acesso ao GitHub. Você quer ferramental consistente em todo o time sem commitar credenciais no controle de versão.", "question": "Qual abordagem de configuração é mais efetiva?", "options": [{"letter": "A", "text": "Que cada dev adicione o servidor em escopo de usuário via `claude mcp add --scope user`.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Criar um wrapper de servidor MCP que leia tokens de um arquivo `.env` e proxie chamadas à API do GitHub, depois adicionar o wrapper ao `.mcp.json` do projeto.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Adicionar o servidor ao `.mcp.json` do projeto usando substituição de variável de ambiente (`${GITHUB_TOKEN}`) para auth e documentar a variável necessária no README.", "correct": true, "explanation": "Um `.mcp.json` de projeto com substituição de variável de ambiente é idiomático: fornece uma única fonte versionada de verdade para a configuração MCP enquanto deixa cada dev fornecer credenciais via variáveis de ambiente. Documentar a variável facilita o onboarding sem commitar segredos."}, {"letter": "D", "text": "Configurar o servidor no escopo de projeto com token placeholder, depois pedir aos devs que sobrescrevam no config local.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "2.4", "objective": "Integrate MCP servers into Claude Code and agent workflows", "group": "J"}, {"id": "m19", "domain": 3, "scenario": null, "situation": "Uma engenheira usou o `Claude Code` ontem para investigar fluxos de autenticação em um monolito legado, acumulando um contexto significativo ao longo de uma sessão de 2 horas. Hoje ela quer continuar essa investigação específica. Ela trabalhou em outras três bases de código desde então e sabe que a sessão se chamava \"auth-deep-dive\".", "question": "Como ela deve retomar?", "options": [{"letter": "A", "text": "Começar do zero e reler os mesmos arquivos", "correct": false, "explanation": "Desperdiça as duas horas de contexto acumulado de ontem."}, {"letter": "B", "text": "Usar `--session-id` com o UUID do arquivo de transcrição da sessão de ontem", "c
