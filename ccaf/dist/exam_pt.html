/* Study controls use the current Ravn palette; feedback colors remain semantic. */
:root {
  --bg: #0E0E0E; --surface: #141414; --surface-2: #1C1C1C;
  --fg: #FFFFFF; --fg-soft: #D4D4D4; --muted: #A3A3A3; --subtle: #949494;
  --border: #292929; --border-strong: #333333;
  --accent: #F8E3A0; --accent-soft: rgba(248,227,160,0.12); --accent-fg: #0E0E0E;
  --bad: #C16B57; --bad-soft: rgba(193,107,87,0.14);
  --good: #6FA97C; --good-soft: rgba(111,169,124,0.14); --good-fg: #0E0E0E;
  --r-sm: 4px; --r-md: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.6; background: var(--bg); color: var(--fg);
  height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased; }

.ravn-topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
  justify-content: space-between; padding: 12px 32px; background: var(--bg); color: var(--fg);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ravn-brand { display: inline-flex; align-items: center; gap: 16px; color: var(--fg);
  text-decoration: none; font-weight: 600; }
.ravn-brand:hover { color: var(--accent); }
.ravn-brand svg { height: 20px; width: auto; fill: currentColor; flex-shrink: 0; }
.ravn-brand-tagline { font-size: 12px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.167em; font-weight: 600; }

/* Mode toggle in the brand bar */
.mode-toggle { display: inline-flex; align-items: center; gap: 0; background: transparent;
  border: 1px solid var(--border-strong); border-radius: var(--r-md); overflow: hidden; }
.mode-toggle button { background: none; border: none; color: var(--muted); cursor: pointer;
  font-family: inherit; font-size: 11.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.1em; padding: 6px 14px; transition: background .15s, color .15s; }
.mode-toggle button.active { background: var(--accent); color: var(--accent-fg); }
.mode-hint { font-size: 11.5px; color: var(--subtle); margin-left: 12px; }
.mode-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 0;
  min-width: 0; justify-content: flex-end; }
.mode-toggle, .new-draw-btn, .misses-btn, .browse-btn { flex-shrink: 0; }
.length-toggle { margin-left: 10px; }
.mode-toggle button:disabled { opacity: .35; cursor: default; }
.focus-select { margin-left: 10px; background: var(--surface); color: var(--fg);
  border: 1px solid var(--border-strong); border-radius: var(--r-md);
  font-family: inherit; font-size: 11.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em; padding: 6px 8px;
  /* A select sizes to its longest option, and the domain names are long
     enough to push the rest of the header off the row. */
  max-width: 220px; min-width: 0; cursor: pointer; }
.focus-select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.focus-select:disabled { opacity: .35; cursor: default; }
.new-draw-btn { margin-left: 10px; }
.new-draw-btn .dn-icon { margin-right: 5px; }

/* Rotation notice — the strip under the brand bar and the summary callout both
   say the same thing: every attempt is a fresh random draw from the bank. */
.draw-note { padding: 8px 32px; background: var(--surface); color: var(--muted);
  font-size: 12.5px; line-height: 1.5; border-bottom: 1px solid var(--border);
  flex-shrink: 0; }
.dn-icon { color: var(--accent); font-weight: 700; margin-right: 7px; }
.rotate-note { margin-top: 26px; padding: 14px 18px; background: var(--accent-soft);
  border: 1px solid var(--accent); border-radius: var(--r-md); font-size: 13.5px;
  color: var(--fg-soft); line-height: 1.6; }

.shell { display: flex; flex: 1; min-height: 0; overflow: hidden; }
.shell.bank .main { flex: 1 1 auto; }
/* Bank table of contents: one row per group, its subdomains beneath, counts on
   the right. Mirrors the exam sidebar so the two pages feel like one tool. */
.toc-group { display: flex; align-items: center; width: 100%; padding: 12px 16px 5px;
  background: none; border: none; color: var(--muted); cursor: pointer; text-align: left;
  font-family: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; }
.toc-group:hover, .toc-group.active { color: var(--accent); }
.toc-sub { display: flex; align-items: baseline; gap: 8px; width: 100%; padding: 5px 16px 5px 18px;
  color: var(--muted); text-decoration: none; font-size: 12.5px; line-height: 1.4;
  border-left: 2px solid transparent; }
.toc-sub:hover { background: var(--surface-2); color: var(--fg); }
.toc-sub.active { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); }
.toc-sub .toc-id { flex: 0 0 auto; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-size: 11px; font-weight: 600; color: var(--accent); }
.toc-sub .toc-n { margin-left: auto; flex: 0 0 auto; font-size: 11px; color: var(--subtle); }
.br-sub .br-anchor { margin-left: auto; color: var(--subtle); text-decoration: none;
  font-weight: 400; opacity: 0; }
.br-sub:hover .br-anchor, .br-sub:target .br-anchor { opacity: 1; }
.br-sub .br-anchor:hover { color: var(--accent); }
.br-sub:target { color: var(--accent); }

.sidebar { width: 272px; min-width: 272px; background: var(--surface); color: var(--muted);
  display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  border-right: 1px solid var(--border); }
.sidebar-header { padding: 18px 16px 12px; font-size: 11.5px; font-weight: 600;
  letter-spacing: .167em; text-transform: uppercase; color: var(--accent);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-progress { padding: 10px 16px; font-size: 12px; color: var(--muted);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-progress span { color: var(--fg); font-weight: 600; }
.sidebar-scroll { overflow-y: auto; flex: 1; padding: 8px 0; }
.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

.domain-group { margin-bottom: 6px; }
.domain-label { padding: 8px 16px 5px; font-size: 10px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; gap: 8px; }
.domain-label .dl-weight { color: var(--subtle); font-weight: 600; }
.q-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 16px;
  background: none; border: none; cursor: pointer; font-size: 13.5px; color: var(--muted);
  font-family: inherit; text-align: left; transition: background .15s, color .15s;
  border-left: 3px solid transparent; }
.q-btn:hover { background: var(--surface-2); color: var(--fg); }
.q-btn.active { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); }
.q-btn.answered .q-dot { background: var(--accent); }
.q-btn.answered-correct { color: var(--good); }
.q-btn.answered-correct .q-dot { background: var(--good); }
.q-btn.answered-wrong { color: var(--bad); }
.q-btn.answered-wrong .q-dot { background: var(--bad); }
.q-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--subtle);
  flex-shrink: 0; transition: background .2s; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; min-width: 0; }
.topbar { background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 32px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-title { font-size: 15px; font-weight: 600; color: var(--fg); }
.topbar-nav { display: flex; gap: 10px; align-items: center; }
.nav-btn { padding: 8px 18px; border-radius: var(--r-md); border: 1px solid var(--border-strong);
  background: transparent; font-family: inherit; font-size: 12px; cursor: pointer; color: var(--muted);
  font-weight: 600; text-transform: uppercase; letter-spacing: .1em; transition: all .15s; }
.nav-btn:hover { color: var(--fg); border-color: var(--accent); }
.nav-btn:disabled { opacity: .35; cursor: default; }
.nav-btn.finish { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.nav-btn.finish:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.q-counter { font-size: 13px; color: var(--muted); font-weight: 500; }

.content { flex: 1; overflow-y: auto; padding: 36px 48px; }
/* Question text carries paths, env-var names and error codes that have no
   break opportunity of their own; `anywhere` lets them wrap so a long token
   never widens the page past the viewport on a phone. Scoped to the prose
   containers: on a flex row it would also let short labels such as a count
   ("19") shrink to one character per line. */
.q-situation, .q-prompt, .q-select-hint, .opt-text, .opt-expl, .explanation,
.wi-q, .ds-name, .rotate-note, .br-stem, .br-opt-text, .br-opt-expl { overflow-wrap: anywhere; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.q-card { max-width: 820px; margin: 0 auto; }
.q-domain { display: inline-block; background: transparent; color: var(--fg); font-size: 11px;
  font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 4px 11px;
  border: 1px solid var(--border-strong); border-radius: var(--r-sm); margin-bottom: 8px; }
.q-scenario { display: inline-block; background: transparent; color: var(--accent); font-size: 11px;
  font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 4px 11px;

.q-situation code, .opt-text code, .explanation code, .opt-expl code {
  background: var(--surface-2); padding: 1px 5px; border-radius: var(--r-sm);
  font-family: "JetBrains Mono", ui-monospace, Menlo, Monaco, monospace; font-size: 13.5px; color: var(--accent); }
.q-prompt { font-size: 17px; font-weight: 700; color: var(--fg); margin-bottom: 20px; }

.q-select { display: inline-block; background: var(--accent-soft); color: var(--accent); font-size: 11.5px;

.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.option { border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface);
  transition: border-color .15s, background .15s; overflow: hidden; }
.option-head { display: flex; align-items: flex-start; gap: 14px; width: 100%; padding: 14px 18px;
  border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.option-head:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.option:hover:not(.locked):not(.dimmed) .option-head { background: var(--surface-2); }
.option:hover:not(.locked):not(.dimmed) { border-color: var(--accent); }
.option.locked .option-head, .option-head[aria-disabled="true"] { cursor: default; }
.option.locked .option-head:disabled { opacity: 1; }
.option.selected { border-color: var(--accent); }
.opt-letter { width: 30px; height: 30px; min-width: 30px; border-radius: 50%; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  color: var(--muted); transition: background .2s, color .2s; flex-shrink: 0; }
.option.selected .opt-letter { background: var(--accent); color: var(--accent-fg); }
.opt-text { font-size: 15px; color: var(--fg-soft); line-height: 1.55; padding-top: 3px; }
.option.correct { border-color: var(--good); background: var(--good-soft); }
.option.correct .opt-letter { background: var(--good); color: var(--good-fg); }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.wrong .opt-letter { background: var(--bad); color: #fff; }
.option.dimmed { opacity: .5; }
.opt-expl { display: none; font-size: 13.5px; line-height: 1.6; color: var(--muted);
  padding: 0 18px 14px 62px; }
.option.locked .opt-expl.show { display: block; }
.option.correct .opt-expl { color: var(--good); }
.option.wrong .opt-expl { color: var(--bad); }

.explanation { margin-top: 4px; padding: 14px 18px; background: var(--surface);
  border-left: 3px solid var(--accent); border-radius: 0 var(--r-md) var(--r-md) 0; font-size: 14.5px;
  color: var(--muted); line-height: 1.65; display: none; }
.explanation.show { display: block; }
.explanation strong { color: var(--accent); }

.summary { max-width: 860px; margin: 0 auto; display: none; }
.summary.show { display: block; }
.summary h1 { font-size: 26px; font-weight: 600; color: var(--fg); margin-bottom: 6px; }
.summary-subtitle { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
.verdict { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; padding: 7px 18px; border-radius: var(--r-sm); margin-bottom: 22px; }
.verdict.pass { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
.verdict.fail { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.score-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 14px; }
.score-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 20px; text-align: center; }
.score-card .big { font-size: 38px; font-weight: 600; line-height: 1; margin-bottom: 6px; }
.score-card .label { font-size: 11px; color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .12em; }
.score-card.total .big { color: var(--fg); }
.score-card.correct-c .big { color: var(--good); }
.score-card.wrong-c .big { color: var(--bad); }
.threshold-note { font-size: 12.5px; color: var(--subtle); margin-bottom: 26px; }

.domain-scores { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 8px 20px; margin-bottom: 26px; }
.ds-row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.ds-row:last-child { border-bottom: none; }
.ds-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--fg); }
.ds-name small { color: var(--subtle); font-weight: 500; }
.ds-bar { width: 160px; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.ds-bar > div { height: 100%; background: var(--accent); }
.ds-bar > div.low { background: var(--muted); }
.ds-bar > div.bad { background: var(--bad); }
.ds-pct { width: 92px; text-align: right; font-size: 13px; color: var(--muted); font-weight: 600; }

.section-title { font-size: 18px; font-weight: 700; color: var(--fg); margin-bottom: 12px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.group-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 18px 20px; margin-bottom: 16px; }
.group-title { font-size: 15px; font-weight: 700; color: var(--fg); margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px; }
.group-badge { font-size: 10px; padding: 3px 10px; border-radius: var(--r-sm); font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; background: var(--bad-soft); color: var(--bad); }
.wrong-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0;
  border-bottom: 1px solid var(--border); font-size: 14px; color: var(--muted); }
.wrong-item:last-child { border-bottom: none; }
.wrong-item .wi-n { min-width: 36px; font-weight: 700; color: var(--subtle); font-size: 12px; padding-top: 2px; }
.wrong-item .wi-q { flex: 1; min-width: 0; }
.wrong-item .wi-situation { font-size: 13.5px; color: var(--fg-soft); font-weight: 500; margin-bottom: 4px; line-height: 1.5; }
.wrong-item .wi-prompt { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 4px; }
.wrong-item .wi-ans { font-size: 12.5px; margin-top: 3px; color: var(--muted); }
.wi-wrong-tag { color: var(--bad); font-weight: 700; }
.wi-correct-tag { color: var(--good); font-weight: 700; }
.wi-expl { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: var(--r-sm);
  padding: 8px 10px; margin-top: 6px; line-height: 1.55; }

.restart-btn { margin-top: 28px; padding: 12px 32px; background: var(--fg); color: var(--bg);
  border: none; border-radius: var(--r-md); font-family: inherit; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em; cursor: pointer; transition: background .15s, color .15s; }
.restart-btn:hover { background: var(--accent); color: var(--accent-fg); }
.screen { display: none; }
.screen.active { display: block; }

/* Weak-spot drill + browse entry points share the nav-btn shape; `active`
   marks the one currently scoping the page. */
.nav-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.dn-action { margin-left: 10px; background: none; border: 0; padding: 0; color: var(--accent);
  font: inherit; font-size: 12.5px; text-decoration: underline; cursor: pointer; }

/* Browse the bank — every question, filtered by domain and free text. Bodies
   are filled on expand, so a 500-item list paints one <summary> row each. */
.browse-head { max-width: 980px; margin: 0 auto 16px; display: flex; flex-wrap: wrap;
  align-items: center; gap: 10px; }
.browse-head h1 { flex: 1 1 100%; font-size: 22px; font-weight: 600; color: var(--fg); }
.browse-head .focus-select { margin-left: 0; }
.browse-search { flex: 1 1 240px; min-width: 0; background: var(--surface); color: var(--fg);
  border: 1px solid var(--border-strong); border-radius: var(--r-md);
  font-family: inherit; font-size: 14px; padding: 8px 12px; }
.browse-search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.browse-count { flex: 0 0 auto; font-size: 12.5px; color: var(--subtle); }
.browse-list, .br-empty { max-width: 980px; margin: 0 auto; }
.br-empty { color: var(--muted); font-size: 14px; }
.br-item { background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-md); margin-bottom: 8px; }
.br-item[open] { border-color: var(--border-strong); }
.br-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px;
  padding: 12px 16px; cursor: pointer; list-style: none; }
.br-head::-webkit-details-marker { display: none; }
.br-head:hover { background: var(--surface-2); }
.br-id { flex: 0 0 auto; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  font-size: 11.5px; font-weight: 600; color: var(--accent); }
.br-stem { flex: 1 1 260px; font-size: 14.5px; line-height: 1.5; color: var(--fg-soft); }
.br-ask { display: block; margin-top: 3px; font-size: 12.5px; color: var(--subtle);
  line-height: 1.45; }
/* Rows are grouped by domain, then blueprint subdomain, so a reader scans
   headings instead of tags. Headings stick so the group stays named while its
   rows scroll past. */
.br-group { position: sticky; top: 0; z-index: 1; margin: 22px 0 10px; padding: 6px 0;
  background: var(--bg); font-size: 11px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; color: var(--accent); }
.br-group:first-child { margin-top: 0; }
.br-sub { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 8px; padding: 0 2px;
  font-size: 13.5px; font-weight: 600; color: var(--fg-soft); }
.br-sub .br-id { font-size: 11px; }
.br-sub .br-n { font-size: 12px; font-weight: 500; color: var(--subtle); }
.br-tags { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; }
.br-tag { padding: 3px 8px; border: 1px solid var(--border-strong); border-radius: var(--r-sm);
  font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); white-space: nowrap; }
.br-tag.cluster { border-color: var(--accent); color: var(--accent);
  font-size: 11px; letter-spacing: normal; text-transform: none; }
.br-tag.src { border-style: dashed; }
.br-body { padding: 0 16px 14px; }
.br-opt { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
.br-opt .opt-letter { width: 24px; height: 24px; min-width: 24px; font-size: 12px; }
.br-opt.is-correct .opt-letter { background: var(--good); color: var(--good-fg); }
.br-opt-text { font-size: 14px; line-height: 1.5; color: var(--fg-soft); }
.br-opt.is-correct .br-opt-text { color: var(--fg); font-weight: 600; }
.br-opt-expl { margin-top: 4px; font-size: 12.5px; line-height: 1.55; color: var(--muted); }

@media (max-width: 760px) {
  html, body { height: auto; }
  body { min-height: 100vh; height: auto; overflow: auto; display: block; }
  .ravn-topbar { position: static; padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
  .draw-note { padding: 8px 16px; }
  .shell.bank .sidebar { display: none; }
  .ravn-brand-tagline { display: none; }
  .mode-controls { max-width: 100%; justify-content: flex-start; }
  .mode-hint { margin-left: 8px; }
  /* Phone order: question first. The navigator and the page title used to
     push the question ~590px down an 844px screen. */
  .shell { display: flex; flex-direction: column; overflow: visible; }
  .main { order: 1; display: flex; flex-direction: column; overflow: visible; }
  .sidebar { order: 2; width: 100%; min-width: 0; height: auto; max-height: 260px;
    min-height: 0; border-right: 0; border-top: 1px solid var(--border);
    border-bottom: 0; }
  .content { order: 1; overflow: visible; padding: 20px 16px 16px; }
  .topbar { order: 2; padding: 12px 16px; gap: 10px; flex-wrap: wrap;
    border-top: 1px solid var(--border); border-bottom: 0;
    position: sticky; bottom: 0; background: var(--surface); z-index: 5; }
  .topbar-title { display: none; }
  .topbar-nav { width: 100%; flex-wrap: nowrap; gap: 8px; }
  .topbar-nav .nav-btn { flex: 1; text-align: center; }
  .q-scenario { display: block; width: fit-content; margin-left: 0; }
  .score-grid { grid-template-columns: 1fr; }
  .ds-row { flex-wrap: wrap; }
  .ds-name { flex-basis: 100%; }
  .ds-bar { flex: 1; min-width: 140px; }
  .browse-head, .browse-list, .br-empty { max-width: none; }
  .br-head { padding: 10px 12px; gap: 8px; }
  .br-stem { flex-basis: 100%; }
}

@media (max-width: 420px) {
  .mode-hint { width: 100%; margin-left: 0; order: 99; }
  .nav-btn { padding: 8px 10px; }
  /* Prev / Next / Finish share one row and cannot shrink below their longest
     word. At 320px the Spanish and Portuguese labels ("Finalizar y revisar")
     overran the viewport by ~22px, so drop the tracking and padding on that
     row only, and give the three-word Finish label twice the room of Prev /
     Next so it does not stack one word per line. */
  .topbar-nav .nav-btn { padding: 8px 6px; letter-spacing: -0.025em; font-size: 11px; }
  .topbar-nav .nav-btn.finish { flex: 2; }
  /* The counter sits inside the nav row; with nowrap it shared the row with
     the buttons and its `width: 100%` below never took effect. */
  .topbar-nav { flex-wrap: wrap; }
  /* Fit all three controls on one row at 390px instead of orphaning New set
     onto its own line: trim padding, tracking and the gaps between groups. */
  .mode-controls { gap: 6px; justify-content: flex-start; }
  .mode-toggle button { padding: 5px 7px; font-size: 0.66rem; letter-spacing: 0.04em; }
  .length-toggle, .new-draw-btn { margin-left: 4px; }
  .focus-select { margin-left: 4px; max-width: 140px; }
  .new-draw-btn { padding: 5px 8px; font-size: 0.66rem; }
  .new-draw-btn .dn-icon { margin-right: 3px; }
  .draw-note { font-size: 0.78rem; line-height: 1.45; padding: 8px 16px; }
  .q-counter { width: 100%; }
  .wrong-item { display: block; }
  .wrong-item .wi-n { margin-bottom: 4px; }
  .browse-head h1 { font-size: 1.15rem; }
  .br-tag { font-size: 0.6rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}

<script>
const QUESTIONS = [{"id": "g1", "domain": 1, "scenario": "Sistema de Pesquisa Multiagente", "situation": "Um agente de análise de documentos descobre que duas fontes confiáveis contêm estatísticas diretamente contraditórias para uma métrica-chave: um relatório governamental indica crescimento de 40%, enquanto uma análise da indústria indica 12%. Ambas as fontes parecem confiáveis e a discrepância pode afetar materialmente as conclusões da pesquisa. Como o agente de análise de documentos deve lidar com essa situação da forma mais efetiva?", "question": "Qual abordagem é mais efetiva?", "options": [{"letter": "A", "text": "Aplicar heurísticas de credibilidade para escolher o número mais provavelmente correto, finalizar a análise com esse valor e adicionar uma nota de rodapé mencionando a discrepância.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Incluir ambos os números na saída da análise sem marcá-los como conflitantes, deixando o agente de síntese decidir qual usar com base em contexto mais amplo.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Parar a análise e escalar imediatamente ao coordenador, pedindo que ele decida qual fonte é mais autoritativa antes de continuar.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Concluir a análise com ambos os números, anotar explicitamente o conflito com atribuição de fonte e deixar o coordenador decidir como reconciliar os dados antes de passá-los à síntese.", "correct": true, "explanation": "Esta abordagem preserva a separação de responsabilidades: o agente de análise conclui seu trabalho principal sem bloquear, preserva ambos os valores conflitantes com atribuição clara e passa corretamente a reconciliação ao coordenador, que tem contexto mais amplo."}], "correct": "D", "task_id": "5.6", "objective": "Preserve information provenance and handle uncertainty in multi-source synthesis", "group": "B"}, {"id": "g2", "domain": 1, "scenario": "Sistema de Pesquisa Multiagente" do a tratamento de erros que monitore todas as falhas via fila compartilhada e decida ações de recuperação, enviando comandos de reinício diretamente aos subagentes.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Configurar o subagente para sempre retornar resultados parciais com status de sucesso, embutindo detalhes do erro em metadados; o coordenador trata todas as respostas como bem-sucedidas.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Fazer com que o coordenador valide todos os documentos antes de enviá-los ao subagente, rejeitando documentos que possam causar falhas.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Implementar recuperação local no subagente para falhas transitórias e escalar ao coordenador apenas erros que ele não consegue resolver, incluindo passos tentados e resultados parciais.", "correct": true, "explanation": "Trate erros no nível mais baixo capaz de resolvê-los. A recuperação local reduz a carga do coordenador enquanto ainda escala questões verdadeiramente irrecuperáveis com contexto completo e progresso parcial."}], "correct": "D", "task_id": "2.2", "objective": "Implement structured error responses for MCP tools", "group": "J"}, {"id": "g4", "domain": 1, "scenario": "Sistema de Pesquisa Multiagente", "situation": "Após executar o sistema sobre \"impacto da IA nas indústrias criativas\", você observa que cada subagente conclui com sucesso: o agente de busca web encontra artigos relevantes, o agente de análise de documentos os sumariza corretamente e o agente de síntese produz um texto coerente. No entanto, os relatórios finais cobrem somente artes visuais e perdem totalmente música, literatura e cinema. Nos logs do coordenador, você vê que ele decompôs o tema em três subtarefas: \"IA em arte digital\", \"IA em design gráfico\" e \"IA em fotografia\". Qual é a causa-raiz mais provável?", "question": "Qual é a causa-raiz mais provável?", "options": [{"letter": "A", "text": "Faltam ao , "task_id": "2.2", "objective": "Implement structured error responses for MCP tools", "group": "J"}, {"id": "g8", "domain": 1, "scenario": "Sistema de Pesquisa Multiagente", "situation": "Um colega propõe que o agente de análise de documentos envie seus resultados diretamente ao agente de síntese, contornando o coordenador. Qual é a vantagem principal de manter o coordenador como hub central para toda comunicação entre subagentes?", "question": "Qual é a vantagem principal de manter o coordenador como hub central?", "options": [{"letter": "A", "text": "O coordenador pode observar todas as interações, tratar erros de forma uniforme e decidir que informação cada subagente deve receber.", "correct": true, "explanation": "O padrão coordenador fornece visibilidade central sobre todas as interações, tratamento de erros uniforme em todo o sistema e controle granular sobre que informação cada subagente recebe — essas são as principais vantagens de uma topologia de comunicação em estrela."}, {"letter": "B", "text": "O coordenador agrupa múltiplas requisições aos subagentes, reduzindo o total de chamadas de API e a latência geral.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Roteamento pelo coordenador habilita lógica de retry automática que chamadas inter-agente diretas não suportam.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Subagentes usam memória isolada e a comunicação direta exigiria serialização complexa que só o coordenador consegue realizar.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "1.2", "objective": "Orchestrate multi-agent systems with coordinator-subagent patterns", "group": "A"}, {"id": "g9", "domain": 1, "scenario": "Sistema de Pesquisa Multiagente", "situation": "O subagente de busca web sofre timeout ao pesquisar um tema complexo. Você precisa desenhar como a informação sobre essa falha é retornada ao coordenador. Qual abordagem de propagação de erro melhor habilita recuperação inteligente?", "question": "Qual abordagem de propagação de erro melhor habilita recuperação inteligente?", "options": [{"letter": "A", "text": "Retornar contexto estruturado de erro ao coordenador, incluindo o tipo de falha, a query executada, quaisquer resultados parciais e abordagens alternativas potenciais.", "correct": true, "explanation": "Retornar contexto estruturado de erro — incluindo tipo de falha, query executada, resultados parciais e abordagens alternativas — dá ao coordenador tudo que precisa para tomar decisões inteligentes de recuperação (ex.: retentar com query modificada ou continuar com resultados parciais). Preserva o máximo de contexto para decisões informadas no nível de coordenação."}, {"letter": "B", "text": "Capturar o timeout dentro do subagente e retornar um conjunto de resultados vazio marcado como bem-sucedido.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Implementar retentativas automáticas com backoff exponencial dentro do subagente, retornando apenas um status genérico \"busca indisponível\" depois de esgotar as tentativas.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Propagar a exceção de timeout diretamente ao handler de topo, terminando o workflow de pesquisa inteiro.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "2.2", "objective": "Implement structured error responses for MCP tools", "group": "J"}, {"id": "g11", "domain": 1, "scenario": "Sistema de Pesquisa Multiagente", "situation": "Ao pesquisar um tema amplo, você observa que o agente de busca web e o agente de análise de documentos investigam os mesmos subtemas, levando a duplicação substancial em suas saídas. O uso de tokens quase dobra sem aumento proporcional na amplitude ou profundidade da pesquisa. Qual é a forma mais efetiva de tratar isso?", "question": "Qual é a forma mais efetiva de tratar isso?", "options": [{"letter": "A", "text": "Permitir que ambos os agentes terminem em paralelo e fazer com que o coordenador des acuna de política: regras da empresa cobrem quedas de preço no próprio site mas não tratam matching de concorrente. O agente não deve inventar política e deve escalar para julgamento humano sobre como interpretar ou estender regras existentes."}, {"letter": "D", "text": "Uma mensagem do cliente contém tanto uma questão de cobrança quanto uma devolução. O agente deve escalar para que um humano coordene ambas em uma única interação.", "correct": false, "explanation": ""}], "correct": "C", "task_id": "5.2", "objective": "Design effective escalation and ambiguity resolution patterns", "group": "C"}, {"id": "g53", "domain": 1, "scenario": "Agente de Suporte ao Cliente", "situation": "Métricas de produção mostram que seu agente faz em média 4+ loops de API por resolução. A análise revela que Claude frequentemente solicita `get_customer` e `lookup_order` em turnos sequenciais separados, mesmo quando ambos são necessários inicialmente. Qual é a forma mais efetiva de reduzir o número de loops?", "question": "Qual é a forma mais efetiva de reduzir loops?", "options": [{"letter": "A", "text": "Implementar execução especulativa que automaticamente chama ferramentas provavelmente necessárias em paralelo a qualquer ferramenta solicitada e retorna todos os resultados, independentemente do que foi pedido.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Aumentar `max_tokens` para dar a Claude mais espaço para planejar e combinar naturalmente solicitações de ferramenta.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Criar ferramentas compostas como `get_customer_with_orders` que agrupam combinações comuns de lookup em uma única chamada.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Instruir Claude no prompt a agrupar solicitações de ferramenta em um turno e retornar todos os resultados juntos antes da próxima chamada de API.", "correct": true, "explanation": "Pedir a Claude que agrupe solicitações de ferramenta relacionadas em um único turno aproveita sua capacidade nativa de pedir múltiplas ferramentas de uma vez. Corrige diretamente o padrão de chamadas sequenciais com mudança arquitetural mínima."}], "correct": "D", "task_id": "1.1", "objective": "Design and implement agentic loops for autonomous task execution", "group": "A"}, {"id": "g58", "domain": 1, "scenario": "Agente de Suporte ao Cliente", "situation": "Você está implementando o loop do agente de suporte. Após cada chamada de API ao Claude, é preciso decidir se continua o loop (executa as ferramentas pedidas e chama Claude novamente) ou para (apresenta a resposta final ao cliente). O que determina essa decisão?", "question": "O que determina essa decisão?", "options": [{"letter": "A", "text": "Verificar o campo `stop_reason` na resposta do Claude — continuar se for `tool_use` e parar se for `end_turn`.", "correct": true, "explanation": "`stop_reason` é o sinal estruturado explícito do Claude para controle de loop: `tool_use` indica que Claude quer rodar uma ferramenta e receber resultados de volta, enquanto `end_turn` indica que Claude completou sua resposta e o loop deve encerrar."}, {"letter": "B", "text": "Parsear o texto do Claude por frases como \"Estou pronto\" ou \"Posso ajudar com mais alguma coisa?\" — sinais de linguagem natural indicam conclusão.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Definir um número máximo de iterações (ex.: 10 chamadas) e parar quando atingido, independentemente de Claude indicar mais trabalho.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Verificar se a resposta contém conteúdo de texto do assistente — se Claude gerou texto explicativo, o loop deve terminar.", "correct": false, "explanation": ""}], "correct": "A", "task_id": "1.1", "objective": "Design and implement agentic loops for autonomous task execution", "group": "A"}, {"id": "m1", "domain": 1, "scenario": null, "situation": "Seu pipeline de pesquisa multiagente falhou após processar 12 de 28 documentos. O agente de busca na web havia identificado fontes relevantes, o agente de análise de documentos havia concluído parcialmente a extração e o sintetizador havia iniciado a identificação de padrões. Você precisa retomar o processamento sem repetir trabalho nem perder a fidelidade das descobertas anteriores.", "question": "Qual abordagem de gerenciamento de estado equilibra melhor a fidelidade das informações com a eficiência da janela de contexto ao restaurar o estado dos agentes?", "options": [{"letter": "A", "text": "Fazer com que cada agente mantenha seu próprio arquivo de estado persistente e o recarregue de forma independente no início de cada sessão.", "correct": false, "explanation": "Estado fragmentado por agente quebra a visibilidade do coordenador e torna o raciocínio entre agentes frágil. Cada agente recarregando estado interno não relacionado também sobrecarrega seu contexto com ruído de que não precisa."}, {"letter": "B", "text": "Persistir o log de conversa do coordenador contendo todas as delegações de tarefas e respostas, fornecendo-o aos agentes na retomada.", "correct": false, "explanation": "Um log de conversa completo é a opção de maior fidelidade, mas a menos eficiente em contexto. Você reproduziria tudo em cada subagente e estouraria os orçamentos de contexto."}, {"letter": "C", "text": "Fazer com que cada agente persista um relatório estruturado em um local conhecido. Na retomada, o coordenador carrega os relatórios e injeta o estado relevante nos prompts dos agentes.", "correct": true, "explanation": "Correto. Relatórios estruturados por agente mantêm a fidelidade (as descobertas, com esquema), permitem que o coordenador permaneça no comando da orquestração e mantêm o contexto de cada subagente focado. Este é o padrão de coordenador + artefato compacto."}, {"letter": "D", "text": "Indexar todas as saídas dos agentes em um armazenamento vetorial compartilhado. Ao retomar, cada agente consulta o armazenamento usando busca semântica para recuperar descobertas anteriores relevantes.", "correct": false, "explanation": "A recuperação semântica sobre as saídas dos agentes é exagero para retomar um pipeline que falhou — adiciona um modo de falha de recuperação e pode perder o estado preciso que um relatório estruturado preserva exatamente."}], "correct": "C", "task_id": "1.7", "objective": "Manage session state, resumption, and forking", "group": "A"}, {"id": "m2", "domain": 1, "scenario": null, "situation": "Depois que o agente de busca na web encontra 25 fontes (120 mil tokens de conteúdo bruto), o agente de análise de documentos extrai os principais insights (15 mil tokens) e o agente de síntese produz um rascunho de narrativa coerente (3 mil tokens), o coordenador deve passar o contexto para o agente de geração de relatórios para a saída final com as devidas citações de fonte.", "question": "Qual estratégia de passagem de contexto oferece o melhor equilíbrio entre completude e eficiência?", "options": [{"letter": "A", "text": "Passar apenas o rascunho de síntese e ter um pipeline de pós-processamento separado para associar afirmações às fontes e inserir citações depois que o relatório for gerado.", "correct": false, "explanation": "A associação posterior é frágil — sem o mapeamento que o modelo usou, você não consegue vincular afirmações à fonte correta de forma confiável. Citações alucinadas ou mal atribuídas são o modo de falha habitual."}, {"letter": "B", "text": "Passar o rascunho de síntese junto com um índice de fontes estruturado que mapeia as principais afirmações às URLs de suas fontes e aos trechos relevantes.", "correct": true, "explanation": "Correto. A síntese fornece a narrativa; o índice de fontes dá ao gerador de relatórios exatamente o vínculo de que ele precisa para citar sem reler 120 mil tokens de conteúdo bruto."}, {"letter": "C", "text": "Passar um resumo condensado de todas as etapas anteriores que preserva as principais descobertas e as atribui às fontes apenas pelo nome.", "correct": false, "explanation": "A atribuição apenas por nome perde URLs e trechos, então o gerador de relatórios não consegue citar nem verificar — e 'apenas por nome' tende a derivar para citações vagas."}, {"letter": "D", "text": "Passar todo o contexto acumulado de todos os agentes anteriores.", "correct": false, "explanation": "Completude máxima, mas perdulária — mais de 120 mil tokens de conteúdo bruto de busca são, em sua maioria, ruído irrelevante na etapa de geração de relatórios."}], "correct": "B", "task_id": "1.4", "objective": "Implement multi-step workflows with enforcement and handoff patterns", "group": "A"}, {"id": "m4", "domain": 1, "scenario": null, "situation": "O agente de busca na web reuniu várias fontes relevantes para um tópico de pesquisa. O agente de análise de documentos agora precisa examinar essas fontes.", "question": "Como as informações normalmente fluem entre esses dois subagentes especializados?", "options": [{"letter": "A", "text": "Os agentes se comunicam por meio de uma fila de mensagens orientada a eventos, com o agente de análise de documentos assinando os eventos de conclusão da busca na web.", "correct": false, "explanation": "Barramentos de eventos não fazem parte do modelo de subagentes do Claude. Os subagentes não publicam nem assinam uns aos outros diretamente."}, {"letter": "B", "text": "O agente de busca na web invoca diretamente o agente de análise de documentos, passando as fontes descobertas como parâmetros.", "correct": false, "explanation": "Os subagentes são isolados — eles não conseguem chamar diretamente subagentes irmãos. Isso também os acoplaria fortemente e anularia o padrão de coordenador."}, {"letter": "C", "text": "O agente coordenador recebe a saída do agente de busca na web e inclui as descobertas relevantes no prompt ao invocar o agente de análise de documentos.", "correct": true, "explanation": "Correto. Em um padrão coordenador-trabalhador, o coordenador é o hub. Ele coleta a saída de cada subagente e encaminha explicitamente as partes relevantes para o prompt do próximo subagente."}, {"letter": "D", "text": "Ambos os agentes acessam um armazenamento de memória compartilhado, onde o agente de busca na web grava as descobertas e o agente de análise de documentos as lê.", "correct": false, "explanation": "Um armazenamento compartilhado pode ser adicionado como otimização, mas não é assim que os subagentes normalmente se comunicam — e ele introduz problemas de leituras desatualizadas e de consistência."}], "correct": "C", "task_id": "1.2", "objective": "Orchestrate multi-agent systems with coordinator-subagent patterns", "group": "A"}, {"id": "m5", "domain": 1, "scenario": null, "situation": "Em produção, você observa que consultas simples de verificação de fatos (por exemplo, \"Em que ano o Acordo de Paris sobre o Clima foi assinado?\") percorrem todos os quatro subagentes sequencialmente, consumindo mais de 40 segundos e tokens significativos por consulta. Pesquisas comparativas complexas se beneficiam do pipeline completo. Sua distribuição de consultas é diversa e está evoluindo à medida que os usuários descobrem novas aplicações.", "question": "Qual é a abordagem mais eficaz para otimizar para variações de complexidade das consultas?", "options": [{"letter": "A", "text": "Implementar roteamento baseado em padrões que categoriza as consultas por estrutura (fato único vs. comparativa vs. analítica) e mapeia cada categoria para uma combinação predefinida de subagentes.", "correct": false, "explanation": "O roteamento por padrões se cristaliza à medida que a distribuição de consultas evolui — novas intenções quebram os padrões e caem silenciosamente no pipeline errado."}, {"letter": "B", "text": "Criar um caminho rápido para perguntas factuais que ignora completamente os subagentes, roteando todas as outras consultas pelo pipeline completo para garantir a profundidade da pesquisa.", "correct": false, "explanation": "Um caminho rápido binário resolve o pior caso, mas desperdiça o pipeline completo em toda consulta moderadamente complexa que poderia ter usado um subconjunto."}, {"letter": "C", "text": "Fazer com que o coordenador analise cada consulta e decida dinamicamente quais subagentes invocar com base em sua avaliação dos requisitos da consulta.", "correct": true, "explanation": "Correto. Permitir que o LLM coordenador raciocine sobre cada consulta e escolha apenas os subagentes de que precisa se adapta naturalmente a uma distribuição de consultas diversa e em evolução — esta é a força do padrão de coordenador."}, {"letter": "D", "text": "Treinar um classificador de complexidade de consultas com dados históricos rotulados para prever as combinações ideais de subagentes, retreinando periodicamente à medida que os padrões de consulta evoluem.", "correct": false, "explanation": "Um classificador treinado precisa de rótulos, retreinamento e monitoramento de desvio. Isso é sobre-engenharia quando o coordenador pode tomar a mesma decisão em tempo de execução a partir da própria consulta."}], "correct": "C", "task_id": "1.2", "objective": "Orchestrate multi-agent systems with coordinator-subagent patterns", "group": "A"}, {"id": "m6", "domain": 1, "scenario": null, "situation": "Ao pesquisar \"adoção de energia renovável\", o agente de busca na web retorna estatísticas recentes (2024: 35% de adoção), enquanto o agente de análise de documentos extrai dados de relatórios internos (2022: 18% de adoção). O agente de síntese sinaliza incorretamente essas fontes como contraditórias, em vez de reconhecer que os dados mostram crescimento ao longo do tempo.", "question": "Qual mudança permitiria melhor que o agente de síntese interpretasse corretamente essas diferenças temporais?", "options": [{"letter": "A", "text": "Exigir que os subagentes incluam as datas de publicação ou de coleta de dados em suas saídas estruturadas.", "correct": true, "explanation": "Correto. O agente de síntese interpreta mal os dados porque nunca vê as datas. Fazer com que cada ponto de dado carregue seu próprio carimbo de data na saída estruturada permite que a síntese raciocine sobre tendências em vez de contradições."}, {"letter": "B", "text": "Adicionar um agente de resolução de conflitos que descarta automaticamente os dados mais antigos quando existem dados mais recentes para a mesma métrica.", "correct": false, "explanation": "Descartar silenciosamente dados mais antigos destrói as informações de tendência — exatamente aquilo que a pergunta está abordando."}, {"letter": "C", "text": "Configurar o agente de busca na web para retornar apenas resultados dos últimos 6 meses.", "correct": false, "explanation": "Reduzir a janela descarta o contexto histórico e não corrige a lacuna arquitetural de que os metadados não estão sendo passados para a síntese."}, {"letter": "D", "text": "Instruir o agente de síntese a sempre tratar os dados mais recentes como autoritativos e colocar as descobertas mais antigas em um apêndice histórico separado.", "correct": false, "explanation": "Instruções de prompt sozinhas não são confiáveis e ainda escondem o raciocínio temporal por trás de uma regra. Estruturar os dados com datas é a correção sistemática."}], "correct": "A", "task_id": "5.6", "objective": "Preserve information provenance and handle uncertainty in multi-source synthesis", "group": "B"}, {"id": "m7", "domain": 1, "scenario": null, "situation": "O agente de síntese recebe descobertas resumidas dos agentes de busca na web e de análise de documentos e, em seguida, passa um resumo consolidado para o gerador de relatórios. Durante os testes, você descobre que os relatórios gerados fazem afirmações factuais sem as devidas citações — o gerador de relatórios não consegue atribuir as declarações às suas fontes originais porque esses metadados foram perdidos durante as etapas de resumo.", "question": "Qual é a abordagem mais eficaz para garantir a atribuição correta de fontes nos relatórios finais?", "options": [{"letter": "A", "text": "Fazer com que cada agente produza dados estruturados que separem os resumos de conteúdo dos metadados de fonte (URLs, nomes de documentos, números de página).", "correct": true, "explanation": "Correto. Conteúdo estruturado + metadados de fonte separados preservam o mapeamento de ponta a ponta, de modo que o gerador de relatórios recebe tanto o que foi dito quanto de onde veio."}, {"letter": "B", "text": "Fazer com que o gerador de relatórios consulte o agente de busca na web para relocalizar as fontes das afirmações no relatório final.", "correct": false, "explanation": "Reconsultar é lento, com perdas e propenso a má atribuição — o agente de busca na web não sabe qual afirmação veio de qual fonte."}, {"letter": "C", "text": "Instruir o agente de síntese a incorporar referências de fonte em linha no texto do resumo usando um formato de citação consistente.", "correct": false, "explanation": "Citações em linha em texto livre se deslocam e são descartadas durante resumos posteriores. Metadados estruturados sobrevivem melhor às transformações."}, {"letter": "D", "text": "Pular o resumo e passar as saídas brutas completas da busca na web e da análise de documentos diretamente para o gerador de relatórios.", "correct": false, "explanation": "Você estouraria o orçamento de contexto e tornaria o trabalho do gerador de relatórios mais difícil. O resumo é útil; perder os metadados durante o resumo é o verdadeiro bug."}], "correct": "A", "task_id": "5.6", "objective": "Preserve information provenance and handle uncertainty in multi-source synthesis", "group": "B"}, {"id": "m9", "domain": 1, "scenario": null, "situation": "Em produção, os relatórios finais frequentemente contêm afirmações sem a devida atribuição de fonte. A investigação mostra que, embora os agentes de busca na web e de análise de documentos anexem corretamente as citações às suas saídas, o agente de síntese perde o controle de quais fontes sustentam quais conclusões ao combinar as descobertas.", "question": "Qual é a mudança arquitetural mais eficaz?", "options": [{"letter": "A", "text": "Manter transcrições completas de todas as interações dos subagentes e adicionar um agente de resolução de citações para analisar os logs e determinar as atribuições antes da geração do relatório.", "correct": false, "explanation": "A análise posterior de logs é frágil e cara — e ainda perde os vínculos quando a síntese mescla pontos de várias fontes."}, {"letter": "B", "text": "Exigir que todos os subagentes produzam mapeamentos estruturados de afirmação-fonte que o agente de síntese deve preservar e mesclar ao combinar descobertas de várias fontes.", "correct": true, "explanation": "Correto. Mapeamentos explícitos de afirmação-fonte são uma saída de primeira classe que o agente de síntese pode mesclar de forma determinística — nenhuma atribuição é descartada durante o resumo."}, {"letter": "C", "text": "Adicionar uma etapa de verificação em que o gerador de relatórios usa correspondência por similaridade semântica com as fontes originais para reconstruir quais afirmações vieram de quais documentos.", "correct": false, "explanation": "A busca por similaridade pode atribuir a fonte errada quando duas fontes dizem coisas parecidas. Você quer o mapeamento original do modelo, não uma reconstrução."}, {"letter": "D", "text": "Fazer com que o coordenador injete prefixos de identificador de fonte no texto antes de cada transferência e, em seguida, analise esses prefixos na geração do relatório para reconstruir as citações.", "correct": false, "explanation": "Tokens de prefixo dentro da prosa são descartados, parafraseados ou alucinados. Mapeamentos estruturados fora da prosa são mais robustos."}], "correct": "B", "task_id": "5.6", "objective": "Preserve information provenance and handle uncertainty in multi-source synthesis", "group": "B"}, {"id": "m10", "domain": 1, "scenario": null, "situation": "Depois que o agente de busca na web e o agente de análise de documentos concluem suas tarefas, o coordenador invoca o agente de síntese. No entanto, o agente de síntese responde que não consegue concluir a tarefa porque nenhuma descoberta de pesquisa foi fornecida.", "question": "Qual é a causa mais provável desse problema?", "options": [{"letter": "A", "text": "A janela de contexto do agente de síntese não é grande o suficiente para conter as saídas combinadas dos dois agentes anteriores.", "correct": false, "explanation": "Um estouro da janela de contexto normalmente se manifesta como truncamento ou erro de API, não como o agente dizendo 'nenhuma descoberta fornecida'."}, {"letter": "B", "text": "O coordenador não incluiu as saídas dos agentes anteriores no prompt do agente de síntese.", "correct": true, "explanation": "Correto. As invocações de subagentes são isoladas — nada flui entre eles a menos que o coordenador coloque explicitamente no prompt. A mensagem 'nenhuma descoberta fornecida' é exatamente o que você veria."}, {"letter": "C", "text": "Os subagentes precisam compartilhar uma única conexão de API para permitir o compartilhamento automático de contexto entre as invocações.", "correct": false, "explanation": "Não existe 'compartilhamento automático de contexto' sobre uma conexão compartilhada. O isolamento de contexto é intencional."}, {"letter": "D", "text": "O agente de síntese precisa de ferramentas que possam buscar resultados diretamente dos históricos de conversa dos outros agentes.", "correct": false, "explanation": "Buscar o histórico entre agentes não é uma capacidade padrão e não é a correção certa — o coordenador deveria estar encaminhando as descobertas explicitamente."}], "correct": "B", "task_id": "1.3", "objective": "Configure subagent invocation, context passing, and spawning", "group": "B"}, {"id": "m12", "domain": 1, "scenario": null, "situation": "O coordenador fornece instruções detalhadas passo a passo ao subagente de busca na web, especificando consultas de busca exatas, prioridades de fontes e filtros de data. O monitoramento em produção revela três problemas: (1) o subagente relata \"resultados insuficientes\" em vez de tentar abordagens alternativas quando as buscas pré-especificadas falham, (2) a qualidade da pesquisa cai para tópicos emergentes que não correspondem aos padrões esperados e (3) o subagente raramente traz à tona fontes tangenciais valiosas.", "question": "Qual é a forma mais eficaz de melhorar a adaptabilidade do subagente?", "options": [{"letter": "A", "text": "Remover completamente os detalhes procedurais, delegando com metas simples como \"pesquise X minuciosamente\" e contando com as capacidades gerais do subagente.", "correct": false, "explanation": "Longe demais na direção oposta — 'pesquise X minuciosamente' perde as proteções (qualidade da fonte, atualidade) que tornam a delegação confiável."}, {"letter": "B", "text": "Adicionar diretivas explícitas de contingência às instruções detalhadas: \"Se as buscas especificadas retornarem menos de N resultados, tente formulações de consulta alternativas antes de relatar falha.\"", "correct": false, "explanation": "Remenda um modo de falha, mas mantém o agente preso ao pensamento procedural — ainda frágil para tópicos emergentes e fontes tangenciais."}, {"letter": "C", "text": "Implementar uma etapa de classificação de tópicos em que o coordenador categoriza as solicitações como \"bem definidas\" ou \"exploratórias\" e usa estilos de instrução diferentes para cada categoria.", "correct": false, "explanation": "Um classificador com dois grupos é frágil, e você ainda envia instruções rígidas no ramo bem definido."}, {"letter": "D", "text": "Especificar metas de pesquisa e critérios de qualidade (amplitude de cobertura, diversidade de fontes, atualidade) em vez de etapas procedurais, deixando que o subagente determine sua estratégia de busca.", "correct": true, "explanation": "Correto. Delegue intenção e parâmetros de qualidade, não procedimentos. O subagente pode então escolher consultas, seguir tangentes promissoras e se recuperar de becos sem saída por conta própria."}], "correct": "D", "task_id": "1.3", "objective": "Configure subagent invocation, context passing, and spawning", "group": "B"}, {"id": "m13", "domain": 1, "scenario": null, "situation": "O monitoramento em produção mostra que consultas de acompanhamento como \"resuma o que aprendemos sobre tendências de mercado\" levam consistentemente mais de 40 segundos. A investigação revela que o coordenador inicia o subagente de síntese para cada solicitação de resumo, passando mais de 80 mil tokens de descobertas acumuladas. O coordenador já tem essas descobertas em seu contexto por ter orquestrado a pesquisa.", "question": "Qual é a forma mais eficaz de melhorar o tempo de resposta para esses resumos de acompanhamento?", "options": [{"letter": "A", "text": "Pré-gerar e armazenar em cache resumos em várias granularidades sempre que novas descobertas se acumulem.", "correct": false, "explanation": "A geração especulativa desperdiça tokens com resumos que o usuário pode nunca pedir, e as granularidades em cache nunca correspondem exatamente ao que é solicitado."}, {"letter": "B", "text": "Fazer com que o coordenador trate diretamente as solicitações de resumo simples usando seu contexto existente, reservando o início de subagentes para análises complexas.", "correct": true, "explanation": "Correto. Se o coordenador já tem as descobertas, iniciar um subagente para reingerir 80 mil tokens é puro custo adicional. Deixe o coordenador responder a acompanhamentos simples por conta própria."}, {"letter": "C", "text": "Habilitar o cache de prompt no subagente de síntese para reduzir o custo adicional de transferir repetidamente as mesmas descobertas de pesquisa.", "correct": false, "explanation": "O cache de prompt reduz o custo no prefixo repetido, mas o desperdício arquitetural — iniciar um subagente inteiro para um resumo — permanece."}, {"letter": "D", "text": "Iniciar o subagente de síntese com contexto reduzido e fazer com que ele solicite descobertas específicas ao coordenador sob demanda.", "correct": false, "explanation": "Adiciona idas e voltas e complexidade para o mesmo resultado que o coordenador poderia produzir diretamente."}], "correct": "B", "task_id": "1.2", "objective": "Orchestrate multi-agent systems with coordinator-subagent patterns", "group": "A"}, {"id": "m14", "domain": 1, "scenario": null, "situation": "Ao analisar casos jurídicos complexos que citam vários precedentes, o subagente de análise de documentos processa cada um sequencialmente. Um caso paradigmático que cita 12 precedentes leva mais de 3 minutos para ser analisado completamente.", "question": "Qual é a forma mais eficaz de reduzir essa latência, preservando a capacidade do coordenador de monitorar e depurar o sistema?", "options": [{"letter": "A", "text": "Implementar uma fila de mensagens em que as tarefas de análise de precedentes são processadas de forma assíncrona por um pool de agentes trabalhadores.", "correct": false, "explanation": "Filas externas complicam a observabilidade — o coordenador perde a visibilidade direta de quais tarefas tiveram êxito e o que produziram."}, {"letter": "B", "text": "Criar uma hierarquia recursiva de agentes em que os agentes de análise subdividem o trabalho entre agentes filhos até atingir a granularidade de um único precedente.", "correct": false, "explanation": "A recursão adiciona níveis de indireção que dificultam a depuração e o monitoramento, sem ganho real de velocidade além da primeira distribuição."}, {"letter": "C", "text": "Fazer com que o coordenador inicie subagentes de análise de documentos em paralelo, cada um tratando um subconjunto de precedentes, e depois agregue os resultados antes da síntese.", "correct": true, "explanation": "Correto. O paralelismo gerenciado pelo coordenador distribui o trabalho, mantém o escopo de cada subagente restrito e preserva um único hub para monitoramento e agregação."}, {"letter": "D", "text": "Permitir que o subagente de análise de documentos inicie seus próprios subagentes especializados dinamicamente quando encontrar casos com muitas citações.", "correct": false, "explanation": "O início aninhado esconde a execução dentro dos subagentes e torna a visão de depuração do coordenador incompleta."}], "correct": "C", "task_id": "1.2", "objective": "Orchestrate multi-agent systems with coordinator-subagent patterns", "group": "A"}, {"id": "m15", "domain": 1, "scenario": null, "situation": "O agente coordenador tem `AgentDefinitions` configuradas para todos os quatro subagentes especializados, cada um com descrições, prompts e restrições de ferramentas apropriadas. Durante os testes, você percebe que o coordenador raciocina corretamente sobre quando delegar — ele gera mensagens como \"Vou pedir ao agente de busca na web que encontre fontes sobre este tópico\" — mas nenhuma execução de subagente jamais ocorre. O coordenador então prossegue como se a delegação tivesse acontecido e continua com informações incompletas. Os logs não mostram erros.", "question": "Qual é a causa mais provável?", "options": [{"letter": "A", "text": "A configuração `max_tokens` do coordenador é baixa demais, fazendo com que a invocação da ferramenta Task seja truncada antes que o parâmetro de tipo do subagente possa ser especificado.", "correct": false, "explanation": "Um truncamento apareceria nos logs e normalmente deixaria blocos `tool_use` parciais — não no-ops silenciosos."}, {"letter": "B", "text": "As `AgentDefinitions` estão configuradas corretamente, mas o prompt de sistema do coordenador não lista explicitamente os tipos de subagentes disponíveis, impedindo que o modelo saiba que eles podem ser invocados.", "correct": false, "explanation": "Os esquemas de ferramentas/agentes são apresentados ao modelo automaticamente — você não precisa relistá-los no prompt de sistema para que o modelo os veja."}, {"letter": "C", "text": "A configuração allowedTools do coordenador não inclui \"Task\", então, embora ele possa raciocinar sobre a delegação, não consegue invocar a ferramenta necessária para iniciar subagentes.", "correct": true, "explanation": "Correto. Sem a ferramenta Task em allowedTools, o coordenador pode falar sobre delegar, mas não tem como realmente chamar um subagente — o que corresponde ao sintoma 'raciocina sobre isso, sem execução, sem erros'."}, {"letter": "D", "text": "O isolamento de contexto dos subagentes significa que as descrições de tarefa do coordenador não chegam automaticamente aos subagentes; você precisa configurar o encaminhamento explícito de contexto em ClaudeAgentOptions.", "correct": false, "explanation": "O isolamento de contexto é real, mas afeta o que o subagente vê uma vez iniciado — não se o coordenador consegue iniciá-lo."}], "correct": "C", "task_id": "1.3", "objective": "Configure subagent invocation, context passing, and spawning", "group": "B"}, {"id": "m21", "domain": 1, "scenario": null, "situation": "Sua ferramenta de exploração de base de código armazena IDs de sessão para permitir que os engenheiros continuem investigações entre sessões de trabalho. Um engenheiro passou uma hora ontem analisando um módulo de autenticação legado, acumulando contexto sobre sua arquitetura e dependências. Ele quer continuar hoje. O ID da sessão é válido, mas o controle de versão mostra que 3 dos 12 arquivos que o agente leu anteriormente foram modificados durante a noite pelo merge de um colega.", "question": "Qual abordagem melhor equilibra eficiência e precisão?", "options": [{"letter": "A", "text": "Retomar a sessão sem informar o agente sobre os arquivos alterados", "correct": false, "explanation": "Retomar silenciosamente deixa o agente raciocinando sobre conteúdo desatualizado em 3 dos 12 arquivos — exatamente a origem de recomendações ruins."}, {"letter": "B", "text": "Iniciar uma nova sessão para garantir que o agente trabalhe com o estado atual da base de código sem suposições desatualizadas", "correct": false, "explanation": "Joga fora uma hora de contexto válido sobre os 9 arquivos que não mudaram."}, {"letter": "C", "text": "Retomar a sessão e informar o agente sobre quais arquivos específicos mudaram para uma reanálise direcionada", "correct": true, "explanation": "Correto. Mantém o contexto custoso que você já construiu, ao mesmo tempo em que diz ao agente exatamente quais 3 arquivos reler — desperdício mínimo, precisão máxima."}, {"letter": "D", "text": "Retomar a sessão e imediatamente fazer o agente reler todos os 12 arquivos previamente analisados", "correct": false, "explanation": "Desnecessário para os 9 arquivos inalterados. Apenas adiciona tokens sem melhorar a precisão."}], "correct": "C", "task_id": "1.7", "objective": "Manage session state, resumption, and forking", "group": "A"}, {"id": "m22", "domain": 1, "scenario": null, "situation": "Um engenheiro usou o agente ontem para analisar um módulo de autenticação legado, identificando duas abordagens distintas de refatoração: extrair um microsserviço versus refatorar no local. Hoje, ele quer explorar ambas as abordagens em profundidade — fazendo o agente propor mudanças de código específicas para cada uma — antes de decidir qual implementar.", "question": "Qual é a maneira mais eficaz de estruturar essa exploração?", "options": [{"letter": "A", "text": "Retomar a sessão de ontem para explorar a primeira abordagem e, então, iniciar uma nova sessão para a segunda, recriando manualmente o contexto original.", "correct": false, "explanation": "A recriação manual é propensa a erros e perde o estado de trabalho exato da análise de ontem."}, {"letter": "B", "text": "Iniciar duas sessões novas, fornecendo manualmente um resumo das descobertas da análise de ontem para estabelecer o contexto.", "correct": false, "explanation": "Refaz o trabalho e arrisca que as duas sessões divirjam da mesma linha de base que você estabeleceu ontem."}, {"letter": "C", "text": "Retomar a sessão de ontem e explorar ambas as abordagens sequencialmente dentro da mesma thread de conversa.", "correct": false, "explanation": "A exploração sequencial em uma única thread permite que cada abordagem contamine o contexto da outra."}, {"letter": "D", "text": "Usar `fork_session` para criar duas ramificações a partir da análise de ontem, explorando uma abordagem em cada ramificação.", "correct": true, "explanation": "Correto. Ramificar a partir da sessão de ontem dá a cada abordagem seu próprio contexto independente, partindo da mesma linha de base de análise — limpo, paralelo, sem contaminação."}], "correct": "D", "task_id": "1.7", "objective": "Manage session state, resumption, and forking", "group": "A"}, {"id": "m24", "domain": 1, "scenario": null, "situation": "Um engenheiro pede ao seu agente para identificar caminhos de código não testados em um módulo legado de processamento de pagamentos que abrange 45 arquivos. Após ler os primeiros 8 arquivos-fonte, as respostas do agente estão ficando visivelmente menos precisas — ele está esquecendo padrões de código discutidos anteriormente e ainda não localizou todos os arquivos de teste nem rastreou os fluxos de pagamento críticos.", "question": "Qual é a abordagem mais eficaz para concluir essa investigação?", "options": [{"letter": "A", "text": "Documentar todas as descobertas atuais em um relatório de resumo, limpar o contexto completamente e, então, usar esse relatório como única referência para continuar a investigação.", "correct": false, "explanation": "Um único relatório torna-se a única fonte de verdade e tende a comprimir e descartar os padrões de código específicos que você precisaria depois."}, {"letter": "B", "text": "Criar subagentes para investigar perguntas específicas (por exemplo, \"encontrar todos os arquivos de teste do processamento de pagamentos\", \"rastrear as dependências do fluxo de reembolso\") enquanto o agente principal coordena as descobertas e preserva o entendimento de alto nível.", "correct": true, "explanation": "Correto. Delegue investigações bem delimitadas a subagentes com contexto novo, enquanto o agente principal mantém a visão arquitetural geral. Este é o padrão para escalar a exploração além de uma única janela de contexto."}, {"letter": "C", "text": "Limpar o contexto com /clear e, então, reler seletivamente apenas os arquivos mais críticos descobertos até agora, gravando as descobertas-chave em um arquivo de rascunho que persiste entre as redefinições de contexto.", "correct": false, "explanation": "Arquivos de rascunho ajudam, mas limpar + reler descarta o entendimento que você já construiu ao longo de 8 arquivos."}, {"letter": "D", "text": "Passar a usar o Grep para buscar nomes de funções específicas em vez de ler arquivos inteiros, reduzindo o conteúdo carregado no contexto para a exploração restante.", "correct": false, "explanation": "Você não consegue identificar caminhos não testados apenas fazendo grep de nomes — é preciso ler o suficiente de cada caminho para saber quais ramificações os testes não cobrem."}], "correct": "B", "task_id": "5.4", "objective": "Manage context effectively in large codebase exploration", "group": "G"}, {"id": "m25", "domain": 1, "scenario": null, "situation": "Um desenvolvedor pede ao agente para investigar por que um endpoint de API específico retorna erros 500 de forma intermitente. A base de código tem mais de 200 arquivos e o desenvolvedor não sabe quais componentes estão envolvidos. O agente precisa rastrear o erro pelas camadas de roteamento, middleware, lógica de negócio e banco de dados.", "question": "Qual abordagem de decomposição de tarefas seria mais eficaz?", "options": [{"letter": "A", "text": "Fazer o agente primeiro criar um plano abrangente mapeando todos os caminhos de código pelo endpoint antes de iniciar qualquer exploração de arquivos ou leitura de código.", "correct": false, "explanation": "Você não consegue construir um plano correto para um erro desconhecido sem nenhuma exploração. Planejar às cegas desperdiça tempo e ignora o caminho real da falha."}, {"letter": "B", "text": "Fazer o agente gerar dinamicamente subtarefas de investigação com base no que descobre a cada passo, adaptando seu plano de exploração à medida que novas informações sobre o caminho do erro surgem.", "correct": true, "explanation": "Correto. A depuração é adaptativa por natureza — cada arquivo que você lê muda qual é o próximo passo mais útil. Deixe o agente seguir as evidências."}, {"letter": "C", "text": "Definir antecipadamente uma sequência fixa de passos de investigação — fazer grep de padrões de erro, depois ler os tratadores de erro, depois verificar as consultas ao banco de dados, depois examinar o middleware — executando cada passo independentemente das descobertas intermediárias.", "correct": false, "explanation": "Um pipeline fixo desperdiça trabalho em camadas que não estão envolvidas e pode impedir o agente de chegar ao caminho real da causa raiz."}, {"letter": "D", "text": "Executar agentes de trabalho paralelos que investigam simultaneamente todas as quatro camadas e, então, sintetizar suas descobertas para identificar onde o erro se origina.", "correct": false, "explanation": "A divisão em paralelo é útil quando você já tem subtarefas bem delimitadas. Aqui você não tem — você pagaria 4× o custo para olhar em três camadas que não são o problema."}], "correct": "B", "task_id": "1.6", "objective": "Design task decomposition strategies for complex workflows", "group": "A"}, {"id": "m26", "domain": 1, "scenario": null, "situation": "O subagente de exploração de um engenheiro passou 30 minutos analisando um sistema de pagamentos legado, lendo 47 arquivos e documentando os fluxos de dados. A sessão foi interrompida quando a conexão do engenheiro caiu. Enquanto ele estava ausente, um colega fez o merge de um PR que renomeou duas funções utilitárias. O engenheiro quer continuar a mesma exploração.", "question": "Qual é a abordagem mais eficaz?", "options": [{"letter": "A", "text": "Retomar o subagente a partir de sua transcrição anterior sem mencionar as mudanças — o entendimento da arquitetura continua válido.", "correct": false, "explanation": "Retomar silenciosamente faz com que o agente continue referenciando os nomes antigos das funções em suas recomendações."}, {"letter": "B", "text": "Iniciar um subagente novo e incluir a transcrição anterior no prompt inicial para fornecer contexto.", "correct": false, "explanation": "Carregar 30 minutos de transcrição no prompt de um novo subagente é um desperdício e polui seu contexto inicial."}, {"letter": "C", "text": "Iniciar um subagente novo com um resumo das descobertas anteriores.", "correct": false, "explanation": "Refazer o resumo descarta os fluxos de dados detalhados que o agente já estava rastreando ao longo de 47 arquivos."}, {"letter": "D", "text": "Retomar o subagente a partir de sua transcrição anterior e informá-lo sobre as funções renomeadas.", "correct": true, "explanation": "Correto. Mantenha o entendimento acumulado e dê a ele um delta direcionado sobre as renomeações para que possa atualizar seu modelo mental — desperdício mínimo, precisão máxima."}], "correct": "D", "task_id": "1.7", "objective": "Manage session state, resumption, and forking", "group": "A"}, {"id": "m28", "domain": 1, "scenario": null, "situation": "Seu agente analisou um módulo de serviço complexo — lendo 23 arquivos-fonte, rastreando fluxos de requisição e identificando padrões de tratamento de erros. Um desenvolvedor quer comparar duas estratégias de teste antes de se comprometer com uma: testes ponta a ponta com serviços externos simulados (mocked) versus testes de snapshot que capturam as saídas esperadas. Ele precisa desenvolver ambas as abordagens de forma independente para avaliar os trade-offs.", "question": "Como você deve gerenciar as sessões?", "options": [{"letter": "A", "text": "Exportar as descobertas principais da sessão de análise para um arquivo e, então, criar duas novas sessões que referenciem esse arquivo.", "correct": false, "explanation": "Um resumo exportado perde mais informação do que o estado vivo da sessão que o agente construiu enquanto lia 23 arquivos."}, {"letter": "B", "text": "Retomar a sessão de análise com `fork_session` habilitado, criando uma ramificação separada para cada estratégia de teste.", "correct": true, "explanation": "Correto. Ramificar dá a cada estratégia seu próprio contexto independente, partindo exatamente da linha de base da análise — sem contaminação cruzada, sem reanálise."}, {"letter": "C", "text": "Iniciar duas sessões novas, fazendo cada uma reler os arquivos-fonte relevantes antes de começar.", "correct": false, "explanation": "Queima tokens refazendo um trabalho que a sessão original já fez e arrisca que cada sessão nova chegue a conclusões diferentes a partir do mesmo código."}, {"letter": "D", "text": "Continuar na sessão original, desenvolvendo primeiro os testes ponta a ponta e depois os testes de snapshot, sequencialmente.", "correct": false, "explanation": "O desenvolvimento sequencial em uma única thread permite que a implementação da primeira estratégia enviese o raciocínio sobre a segunda."}], "correct": "B", "task_id": "1.7", "objective": "Manage session state, resumption, and forking", "group": "A"}, {"id": "m30", "domain": 1, "scenario": null, "situation": "Um engenheiro que acabou de entrar na equipe pede ao agente para ajudá-lo a entender a arquitetura de autenticação e autorização antes de fazer melhorias de segurança. A base de código tem mais de 800 arquivos espalhados por múltiplos serviços.", "question": "Qual estratégia de exploração construirá o entendimento de forma mais eficaz, considerando as ferramentas nativas do Claude e os limites de contexto?", "options": [{"letter": "A", "text": "Ler primeiro quaisquer arquivos CLAUDE.md e README e, então, pedir ao engenheiro para especificar quais 10 a 15 arquivos são mais importantes para entender o sistema de autenticação.", "correct": false, "explanation": "O engenheiro acabou de entrar — ele provavelmente não sabe quais arquivos importam. É exatamente nisso que o agente deveria ajudar."}, {"letter": "B", "text": "Iniciar subagentes paralelos para explorar diferentes serviços simultaneamente e, então, sintetizar suas descobertas em uma visão arquitetural geral.", "correct": false, "explanation": "Sem saber onde a autenticação está, a divisão em paralelo explora de forma ampla demais e os subagentes duplicam trabalho e perdem os fluxos entre serviços."}, {"letter": "C", "text": "Usar o Grep para encontrar os pontos de entrada de autenticação, ler esses arquivos e, então, seguir as importações e chamadas de função para mapear o fluxo de autenticação de forma incremental.", "correct": true, "explanation": "Correto. Comece pelos pontos de entrada (login, verificação de token, middleware) e, então, rastreie para fora seguindo as conexões reais do código. Incremental, fundamentado e dentro dos limites de contexto."}, {"letter": "D", "text": "Ler todos os arquivos que contenham \"auth\", \"login\", \"permission\" ou \"token\" em seu conteúdo ou nome de arquivo.", "correct": false, "explanation": "Essas palavras-chave atingem uma enorme quantidade de código não relacionado em mais de 800 arquivos e afogam o contexto em ruído."}], "correct": "C", "task_id": "5.4", "objective": "Manage context effectively in large codebase exploration", "group": "G"}, {"id": "m31", "domain": 1, "scenario": null, "situation": "Um cliente retorna 4 horas após a sessão inicial sobre a mesma disputa de cobrança. A sessão anterior, com 32 turnos, contém resultados de `lookup_order` mostrando \"Status: PENDING, Resolução prevista: 24-48 horas.\" Em testes, você observa que, ao retomar sessões com resultados de ferramentas desatualizados, o agente frequentemente faz referência aos dados obsoletos nas respostas (por exemplo, \"Vejo que seu reembolso ainda está em processamento\"), mesmo após chamadas de ferramentas mais recentes retornarem informações diferentes.", "question": "Qual abordagem lida de forma mais confiável com clientes que retornam?", "options": [{"letter": "A", "text": "Retomar com o histórico completo, mas filtrar as mensagens `tool_result` anteriores antes de retomar, mantendo apenas os turnos do humano/assistente para que o agente precise buscar novamente os dados necessários.", "correct": false, "explanation": "Remover os `tool_results` do meio de uma conversa pode deixar mensagens do assistente referenciando resultados inexistentes — a transcrição se torna internamente inconsistente."}, {"letter": "B", "text": "Iniciar uma nova sessão, injetar um resumo estruturado da interação anterior (tipo de problema, ações tomadas, status de resolução) e fazer novas chamadas de ferramentas antes de iniciar o atendimento.", "correct": true, "explanation": "Correto. Uma sessão limpa com um resumo mantém a continuidade narrativa, ao mesmo tempo em que garante que o agente não esteja raciocinando sobre resultados de ferramentas desatualizados."}, {"letter": "C", "text": "Retomar com o histórico completo e adicionar uma instrução no prompt do sistema dizendo ao agente para sempre preferir os resultados de ferramentas mais recentes quando houver várias chamadas à mesma ferramenta no contexto.", "correct": false, "explanation": "Instruções no prompt são sugestões. Você observou exatamente esse modo de falha nos testes — o modelo ainda faz referência a resultados antigos."}, {"letter": "D", "text": "Retomar com o histórico completo e configurar o agente para chamar novamente, de forma automática, todas as ferramentas usadas anteriormente no início da sessão, garantindo a atualidade dos dados.", "correct": false, "explanation": "Chamar tudo novamente de forma indiscriminada é um desperdício, é lento e ainda deixa os resultados antigos no contexto, confundindo o modelo."}], "correct": "B", "task_id": "1.4", "objective": "Implement multi-step workflows with enforcement and handoff patterns", "group": "A"}, {"id": "m32", "domain": 1, "scenario"
