<style>
/* Ravn Brand System — dark canvas, white text, muted gray, single gold accent.
   Flat (no shadows/gradients), Work Sans + Source Code Pro. Functional red is
   kept only for wrong-answer / fail feedback; green marks correct answers;
   gold carries selection / emphasis. */
:root {
  --bg: #161616; --surface: #1d1d1d; --surface-2: #222222;
  --fg: #FFFFFF; --fg-soft: #D4D4D4; --muted: #ADB5BD; --subtle: #8B949E;
  --border: #2A2A2A; --border-strong: #3A3A3A;
  --gold: #B7986A; --gold-soft: rgba(183,152,106,0.12); --gold-fg: #161616;
  --bad: #C16B57; --bad-soft: rgba(193,107,87,0.14);
  --good: #6FA97C; --good-soft: rgba(111,169,124,0.14); --good-fg: #161616;
  --r-sm: 4px; --r-md: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.6; background: var(--bg); color: var(--fg);
  height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased; }

.ravn-topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
  justify-content: space-between; padding: 12px 32px; background: var(--bg); color: var(--fg);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ravn-brand { display: inline-flex; align-items: center; gap: 16px; color: var(--fg);
  text-decoration: none; font-weight: 600; }
.ravn-brand:hover { color: var(--gold); }
.ravn-brand svg { height: 20px; width: auto; fill: currentColor; flex-shrink: 0; }
.ravn-brand-tagline { font-size: 12px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.167em; font-weight: 600; }

/* Mode toggle in the brand bar */
.mode-toggle { display: inline-flex; align-items: center; gap: 0; background: transparent;
  border: 1px solid var(--border-strong); border-radius: var(--r-md); overflow: hidden; }
.mode-toggle button { background: none; border: none; color: var(--muted); cursor: pointer;
  font-family: inherit; font-size: 11.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.1em; padding: 6px 14px; transition: background .15s, color .15s; }
.mode-toggle button.active { background: var(--gold); color: var(--gold-fg); }
.mode-hint { font-size: 11.5px; color: var(--subtle); margin-left: 12px; }
.mode-controls { display: flex; align-items: center; }
.length-toggle { margin-left: 10px; }
.new-draw-btn { margin-left: 10px; }
.new-draw-btn .dn-icon { margin-right: 5px; }

/* Rotation notice — the strip under the brand bar and the summary callout both
   say the same thing: every attempt is a fresh random draw from the bank. */
.draw-note { padding: 8px 32px; background: var(--surface); color: var(--muted);
  font-size: 12.5px; line-height: 1.5; border-bottom: 1px solid var(--border);
  flex-shrink: 0; }
.dn-icon { color: var(--gold); font-weight: 700; margin-right: 7px; }
.rotate-note { margin-top: 26px; padding: 14px 18px; background: var(--gold-soft);
  border: 1px solid var(--gold); border-radius: var(--r-md); font-size: 13.5px;
  color: var(--fg-soft); line-height: 1.6; }

.shell { display: flex; flex: 1; min-height: 0; overflow: hidden; }

.sidebar { width: 272px; min-width: 272px; background: var(--surface); color: var(--muted);
  display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  border-right: 1px solid var(--border); }
.sidebar-header { padding: 18px 16px 12px; font-size: 11.5px; font-weight: 600;
  letter-spacing: .167em; text-transform: uppercase; color: var(--gold);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-progress { padding: 10px 16px; font-size: 12px; color: var(--muted);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-progress span { color: var(--fg); font-weight: 600; }
.sidebar-scroll { overflow-y: auto; flex: 1; padding: 8px 0; }
.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

.domain-group { margin-bottom: 6px; }
.domain-label { padding: 8px 16px 5px; font-size: 10px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; gap: 8px; }
.domain-label .dl-weight { color: var(--subtle); font-weight: 600; }
.q-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 16px;
  background: none; border: none; cursor: pointer; font-size: 13.5px; color: var(--muted);
  font-family: inherit; text-align: left; transition: background .15s, color .15s;
  border-left: 3px solid transparent; }
.q-btn:hover { background: var(--surface-2); color: var(--fg); }
.q-btn.active { background: var(--gold-soft); color: var(--gold); border-left-color: var(--gold); }
.q-btn.answered .q-dot { background: var(--gold); }
.q-btn.answered-correct { color: var(--good); }
.q-btn.answered-correct .q-dot { background: var(--good); }
.q-btn.answered-wrong { color: var(--bad); }
.q-btn.answered-wrong .q-dot { background: var(--bad); }
.q-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--subtle);
  flex-shrink: 0; transition: background .2s; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; min-width: 0; }
.topbar { background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 32px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-title { font-size: 15px; font-weight: 600; color: var(--fg); }
.topbar-nav { display: flex; gap: 10px; align-items: center; }
.nav-btn { padding: 8px 18px; border-radius: var(--r-md); border: 1px solid var(--border-strong);
  background: transparent; font-family: inherit; font-size: 12px; cursor: pointer; color: var(--muted);
  font-weight: 600; text-transform: uppercase; letter-spacing: .1em; transition: all .15s; }
.nav-btn:hover { color: var(--fg); border-color: var(--gold); }
.nav-btn:disabled { opacity: .35; cursor: default; }
.nav-btn.finish { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.nav-btn.finish:hover { background: var(--gold); border-color: var(--gold); color: var(--gold-fg); }
.q-counter { font-size: 13px; color: var(--muted); font-weight: 500; }

.content { flex: 1; overflow-y: auto; padding: 36px 48px; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.q-card { max-width: 820px; margin: 0 auto; }
.q-domain { display: inline-block; background: transparent; color: var(--fg); font-size: 11px;
  font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 4px 11px;
  border: 1px solid var(--border-strong); border-radius: var(--r-sm); margin-bottom: 8px; }
.q-scenario { display: inline-block; background: transparent; color: var(--gold); font-size: 11px;
  font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 4px 11px;
  border: 1px solid var(--gold); border-radius: var(--r-sm); margin-bottom: 16px; margin-left: 8px; }
.q-number { font-size: 11px; color: var(--subtle); margin-bottom: 6px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; }
.q-situation { font-size: 16.5px; color: var(--fg-soft); font-weight: 400; line-height: 1.7;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 16px 20px; margin-bottom: 22px; }
.q-situation code, .opt-text code, .explanation code, .opt-expl code {
  background: var(--surface-2); padding: 1px 5px; border-radius: var(--r-sm);
  font-family: "Source Code Pro", ui-monospace, Menlo, Monaco, monospace; font-size: 13.5px; color: var(--gold); }
.q-prompt { font-size: 17px; font-weight: 700; color: var(--fg); margin-bottom: 20px; }

.q-select { display: inline-block; background: var(--gold-soft); color: var(--gold); font-size: 11.5px;
  font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 12px;
  border-radius: var(--r-sm); margin-bottom: 16px; }
.q-select-hint { font-size: 12.5px; color: var(--subtle); margin: -8px 0 16px; }
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.option { border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface);
  transition: border-color .15s, background .15s; overflow: hidden; }
.option-head { display: flex; align-items: flex-start; gap: 14px; width: 100%; padding: 14px 18px;
  border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.option-head:focus-visible { outline: 2px solid var(--gold); outline-offset: -3px; }
.option:hover:not(.locked):not(.dimmed) .option-head { background: var(--surface-2); }
.option:hover:not(.locked):not(.dimmed) { border-color: var(--gold); }
.option.locked .option-head, .option-head[aria-disabled="true"] { cursor: default; }
.option.locked .option-head:disabled { opacity: 1; }
.option.selected { border-color: var(--gold); }
.opt-letter { width: 30px; height: 30px; min-width: 30px; border-radius: 50%; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  color: var(--muted); transition: background .2s, color .2s; flex-shrink: 0; }
.option.selected .opt-letter { background: var(--gold); color: var(--gold-fg); }
.opt-text { font-size: 15px; color: var(--fg-soft); line-height: 1.55; padding-top: 3px; }
.option.correct { border-color: var(--good); background: var(--good-soft); }
.option.correct .opt-letter { background: var(--good); color: var(--good-fg); }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.wrong .opt-letter { background: var(--bad); color: #fff; }
.option.dimmed { opacity: .5; }
.opt-expl { display: none; font-size: 13.5px; line-height: 1.6; color: var(--muted);
  padding: 0 18px 14px 62px; }
.option.locked .opt-expl.show { display: block; }
.option.correct .opt-expl { color: var(--good); }
.option.wrong .opt-expl { color: var(--bad); }

.explanation { margin-top: 4px; padding: 14px 18px; background: var(--surface);
  border-left: 3px solid var(--gold); border-radius: 0 var(--r-md) var(--r-md) 0; font-size: 14.5px;
  color: var(--muted); line-height: 1.65; display: none; }
.explanation.show { display: block; }
.explanation strong { color: var(--gold); }

.summary { max-width: 860px; margin: 0 auto; display: none; }
.summary.show { display: block; }
.summary h1 { font-size: 26px; font-weight: 800; color: var(--fg); margin-bottom: 6px; }
.summary-subtitle { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
.verdict { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; padding: 7px 18px; border-radius: var(--r-sm); margin-bottom: 22px; }
.verdict.pass { background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold); }
.verdict.fail { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.score-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 14px; }
.score-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 20px; text-align: center; }
.score-card .big { font-size: 38px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
.score-card .label { font-size: 11px; color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .12em; }
.score-card.total .big { color: var(--fg); }
.score-card.correct-c .big { color: var(--good); }
.score-card.wrong-c .big { color: var(--bad); }
.threshold-note { font-size: 12.5px; color: var(--subtle); margin-bottom: 26px; }

.domain-scores { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 8px 20px; margin-bottom: 26px; }
.ds-row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.ds-row:last-child { border-bottom: none; }
.ds-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--fg); }
.ds-name small { color: var(--subtle); font-weight: 500; }
.ds-bar { width: 160px; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.ds-bar > div { height: 100%; background: var(--gold); }
.ds-bar > div.low { background: var(--muted); }
.ds-bar > div.bad { background: var(--bad); }
.ds-pct { width: 92px; text-align: right; font-size: 13px; color: var(--muted); font-weight: 600; }

.section-title { font-size: 18px; font-weight: 700; color: var(--fg); margin-bottom: 12px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.group-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 18px 20px; margin-bottom: 16px; }
.group-title { font-size: 15px; font-weight: 700; color: var(--fg); margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px; }
.group-badge { font-size: 10px; padding: 3px 10px; border-radius: var(--r-sm); font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; background: var(--bad-soft); color: var(--bad); }
.wrong-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0;
  border-bottom: 1px solid var(--border); font-size: 14px; color: var(--muted); }
.wrong-item:last-child { border-bottom: none; }
.wrong-item .wi-n { min-width: 36px; font-weight: 700; color: var(--subtle); font-size: 12px; padding-top: 2px; }
.wrong-item .wi-q { flex: 1; }
.wrong-item .wi-situation { font-size: 13.5px; color: var(--fg-soft); font-weight: 500; margin-bottom: 4px; line-height: 1.5; }
.wrong-item .wi-prompt { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 4px; }
.wrong-item .wi-ans { font-size: 12.5px; margin-top: 3px; color: var(--muted); }
.wi-wrong-tag { color: var(--bad); font-weight: 700; }
.wi-correct-tag { color: var(--good); font-weight: 700; }
.wi-expl { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: var(--r-sm);
  padding: 8px 10px; margin-top: 6px; line-height: 1.55; }

.restart-btn { margin-top: 28px; padding: 12px 32px; background: var(--fg); color: var(--bg);
  border: none; border-radius: var(--r-md); font-family: inherit; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em; cursor: pointer; transition: background .15s, color .15s; }
.restart-btn:hover { background: var(--gold); color: var(--gold-fg); }
.screen { display: none; }
.screen.active { display: block; }

@media (max-width: 760px) {
  html, body { height: auto; }
  body { min-height: 100vh; height: auto; overflow: auto; display: block; }
  .ravn-topbar { position: static; padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
  .draw-note { padding: 8px 16px; }
  .ravn-brand-tagline { display: none; }
  .mode-controls { max-width: 100%; flex-wrap: wrap; gap: 6px 0; }
  .mode-hint { margin-left: 8px; }
  /* Phone order: question first. The navigator and the page title used to
     push the question ~590px down an 844px screen. */
  .shell { display: flex; flex-direction: column; overflow: visible; }
  .main { order: 1; display: flex; flex-direction: column; overflow: visible; }
  .sidebar { order: 2; width: 100%; min-width: 0; height: auto; max-height: 260px;
    min-height: 0; border-right: 0; border-top: 1px solid var(--border);
    border-bottom: 0; }
  .content { order: 1; overflow: visible; padding: 20px 16px 16px; }
  .topbar { order: 2; padding: 12px 16px; gap: 10px; flex-wrap: wrap;
    border-top: 1px solid var(--border); border-bottom: 0;
    position: sticky; bottom: 0; background: var(--surface); z-index: 5; }
  .topbar-title { display: none; }
  .topbar-nav { width: 100%; flex-wrap: nowrap; gap: 8px; }
  .topbar-nav .nav-btn { flex: 1; text-align: center; }
  .q-scenario { display: block; width: fit-content; margin-left: 0; }
  .score-grid { grid-template-columns: 1fr; }
  .ds-row { flex-wrap: wrap; }
  .ds-name { flex-basis: 100%; }
  .ds-bar { flex: 1; min-width: 140px; }
}

@media (max-width: 420px) {
  .mode-hint { width: 100%; margin-left: 0; order: 99; }
  .mode-toggle button { padding: 6px 9px; font-size: 0.72rem; }
  .nav-btn { padding: 8px 10px; }
  /* Keep the control strip on two tidy rows instead of orphaning New set. */
  .mode-controls { gap: 6px; justify-content: flex-start; }

<script>
const QUESTIONS = [{"id": "g1", "source": "guide", "domain": 1, "scenario": "Sistema de investigación multiagente", "situation": "Un agente de análisis de documentos descubre que dos fuentes creíbles contienen estadísticas directamente contradictorias para una métrica clave: un informe gubernamental indica un crecimiento del 40%, mientras que un análisis de la industria indica un 12%. Ambas fuentes parecen creíbles, y la discrepancia podría afectar materialmente las conclusiones de la investigación. ¿Cómo debería el agente de análisis de documentos manejar esta situación de la forma más efectiva?", "question": "¿Cuál es el enfoque más efectivo?", "options": [{"letter": "A", "text": "Aplicar heurísticas de credibilidad para elegir el número más probablemente correcto, terminar el análisis con ese valor y agregar una nota al pie mencionando la discrepancia.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Incluir ambos números en la salida del análisis sin marcarlos como conflictivos, dejando que el agente de síntesis decida cuál usar según el contexto más amplio.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Detener el análisis y escalar inmediatamente al coordinador, pidiéndole que decida qué fuente es más autoritativa antes de continuar.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Completar el análisis con ambos números, anotar explícitamente el conflicto con atribución de fuente y dejar que el coordinador decida cómo reconciliar los datos antes de pasarlos a síntesis.", "correct": true, "explanation": "Este enfoque preserva la separación de responsabilidades: el agente de análisis completa su trabajo principal sin bloquearse, conserva ambos valores conflictivos con atribución clara y traslada correctamente la reconciliación al coordinador, que tiene un contexto más amplio."}], "correct": "D"}, {"id": "g2", "source": "guide", "domain": 1, "scenario": "Sistema de investigación multiagente", "situation": "Los agentes de búsqueda web y de análisis de documentos completaron sus tareas y devolvieron resultados al coordinador. ¿Cuál es el siguiente paso para crear un informe de investigación integrado?", "question": "¿Cuál es el siguiente paso más apropiado?", "options": [{"letter": "A", "text": "Cada agente envía sus resultados directamente al agente redactor del informe, evitando al coordinador.", "correct": false, "explanation": ""}, {"letter": "B", "text": "El agente de análisis de documentos solicita los resultados de búsqueda web y los fusiona internamente.", "correct": false, "explanation": ""}, {"letter": "C", "text": "El coordinador pasa ambos conjuntos de resultados al agente de síntesis para una integración unificada.", "correct": true, "explanation": "En una arquitectura coordinador–subagente, el coordinador reenvía ambos conjuntos de resultados al agente de síntesis para una integración centralizada, preservando el control y asegurando una fusión de alta calidad."}, {"letter": "D", "text": "El coordinador concatena las salidas crudas de ambos agentes y las devuelve como resultado final.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g3", "source": "guide", "domain": 1, "scenario": "Sistema de investigación multiagente", "situation": "Un subagente de análisis de documentos falla con frecuencia al procesar archivos PDF: algunos tienen secciones corruptas que disparan excepciones de parseo, otros están protegidos con contraseña, y a veces la biblioteca de parseo se cuelga con archivos grandes. Actualmente, cualquier excepción termina inmediatamente el subagente y devuelve un error al coordinador, que debe decidir si reintentar, omitir o fallar toda la tarea. Esto causa una participación excesiva del coordinador en el manejo rutinario de errores. ¿Qué mejora arquitectónica es más efectiva?", "question": "¿Qué mejora es más efectiva?", "options": [{"letter": "A", "text": "Crear un agente dedicado al manejo de errores que monitoree todos los fallos a través de una cola compartida y decida acciones de recuperación, enviando comandos de reinicio directamente a los subagentes.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Configurar el subagente para que siempre devuelva resultados parciales con estado de éxito, embebiendo detalles del error en metadatos; el coordinador trata todas las respuestas como exitosas.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Hacer que el coordinador valide todos los documentos antes de enviarlos al subagente, rechazando documentos que puedan causar fallos.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Implementar recuperación local en el subagente para fallos transitorios y escalar al coordinador solo los errores que no puede resolver, incluyendo pasos intentados y resultados parciales.", "correct": true, "explanation": "Maneja los errores en el nivel más bajo capaz de resolverlos. La recuperación local reduce la carga del coordinador mientras escala los problemas verdaderamente irrecuperables con contexto completo y progreso parcial."}], "correct": "D"}, {"id": "g4", "source": "guide", "domain": 1, "scenario": "Sistema de investigación multiagente", "situation": "Después de ejecutar el sistema sobre \"el impacto de la IA en las industrias creativas\", observas que cada subagente se completa con éxito: el agente de búsqueda web encuentra artículos relevantes, el agente de análisis de documentos los resume correctamente y el agente de síntesis produce un texto coherente. Sin embargo, los informes finales solo cubren artes visuales y omiten por completo música, literatura y cine. En los registros del coordinador, ves que descompuso el tema en tres subtareas: \"IA en arte digital\", \"IA en diseño gráfico\" e \"IA en fotografía\". ¿Cuál es la causa raíz más probable?", "question": "¿Cuál es la causa raíz más probable?", "options": [{"letter": "A", "text": "Al agente de síntesis le faltan instrucciones para detectar lagunas de cobertura.", "correct": false, "explanation": ""}, {"letter": "B", "text": "El agente de análisis de documentos filtra fuentes no visuales debido a criterios de relevancia demasiado estrictos.", "correct": false, "explanation": ""}, {"letter": "C", "text": "La descomposición de tareas del coordinador es demasiado estrecha, asignando a los subagentes trabajo que no cubre todas las áreas relevantes.", "correct": true, "explanation": "El coordinador descompuso un tema amplio solo en subtareas de artes visuales, omitiendo por completo música, literatura y cine. Como los subagentes ejecutaron sus asignaciones correctamente, la descomposición estrecha es la causa raíz evidente."}, {"letter": "D", "text": "Las consultas del agente de búsqueda web son insuficientes y deberían ampliarse para cubrir más sectores.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g5", "source": "guide", "domain": 1, "scenario": "Sistema de investigación multiagente", "situation": "El subagente de búsqueda web devuelve resultados solo para 3 de 5 categorías de fuentes solicitadas (sitios de competencia e informes de la industria tienen éxito, pero archivos de noticias y feeds sociales agotan el tiempo). El subagente de análisis de documentos procesa con éxito todos los documentos provistos. El subagente de síntesis debe producir un resumen a partir de entradas previas de calidad mixta. ¿Qué estrategia de propagación de errores es más efectiva?", "question": "¿Qué estrategia de propagación de errores es más efectiva?", "options": [{"letter": "A", "text": "Continuar la síntesis usando solo las fuentes exitosas y producir una salida sin mencionar qué datos no estaban disponibles.", "correct": false, "explanation": ""}, {"letter": "B", "text": "El subagente de síntesis devuelve un error al coordinador, disparando un reintento completo o el fallo de la tarea por datos incompletos.", "correct": false, "explanation": ""}, {"letter": "C", "text": "El subagente de síntesis pide al coordinador que reintente las fuentes con tiempo de espera agotado con un timeout más largo antes de iniciar la síntesis.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Estructurar la salida de síntesis con anotaciones de cobertura que indiquen qué conclusiones están bien respaldadas y dónde hay vacíos por fuentes no disponibles.", "correct": true, "explanation": "Las anotaciones de cobertura implementan una degradación elegante con transparencia, preservando el valor del trabajo completado mientras propagan la incertidumbre para permitir decisiones informadas sobre la confianza."}], "correct": "D"}, {"id": "g6", "source": "guide", "domain": 1, "scenario": "Sistema de investigación multiagente", "situation": "El subagente de análisis de documentos encuentra un archivo PDF corrupto que no puede parsear. Al diseñar el manejo de errores del sistema, ¿cuál es la forma más efectiva de manejar este fallo?", "question": "¿Cuál es el enfoque más efectivo?", "options": [{"letter": "A", "text": "Devolver un error con contexto al agente coordinador, permitiéndole decidir cómo proceder.", "correct": true, "explanation": "Devolver un error con contexto al coordinador es lo más efectivo porque le permite tomar una decisión informada—omitir el archivo, intentar un método de parseo alternativo o notificar al usuario—mientras se mantiene visibilidad sobre el fallo."}, {"letter": "B", "text": "Omitir silenciosamente el documento corrupto y continuar procesando los archivos restantes para no interrumpir el flujo.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Reintentar automáticamente el parseo del documento tres veces con retroceso exponencial antes de reportar un fallo.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Lanzar una excepción que termine todo el flujo de investigación.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g8", "source": "guide", "domain": 1, "scenario": "Sistema de investigación multiagente", "situation": "Un colega propone que el agente de análisis de documentos envíe sus resultados directamente al agente de síntesis, evitando al coordinador. ¿Cuál es la principal ventaja de mantener al coordinador como hub central de toda la comunicación entre subagentes?", "question": "¿Cuál es la principal ventaja de mantener al coordinador como hub central?", "options": [{"letter": "A", "text": "El coordinador puede observar todas las interacciones, manejar errores uniformemente y decidir qué información debe recibir cada subagente.", "correct": true, "explanation": "El patrón coordinador proporciona visibilidad centralizada de todas las interacciones, manejo uniforme de errores en todo el sistema y control fino sobre qué información recibe cada subagente—estas son las ventajas principales de una topología de comunicación en estrella."}, {"letter": "B", "text": "El coordinador agrupa múltiples solicitudes a los subagentes, reduciendo el total de llamadas a la API y la latencia general.", "correct": false, "explanation": ""}, {"letter": "C", "text": "El enrutamiento a través del coordinador permite lógica de reintento automático que las llamadas directas entre agentes no pueden soportar.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Los subagentes usan memoria aislada, y la comunicación directa requeriría serialización compleja que solo el coordinador puede realizar.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g9", "source": "guide", "domain": 1, "scenario": "Sistema de investigación multiagente", "situation": "El subagente de búsqueda web agota el tiempo de espera mientras investiga un tema complejo. Necesitas diseñar cómo se devuelve la información sobre este fallo al coordinador. ¿Qué enfoque de propagación de errores permite mejor una recuperación inteligente?", "question": "¿Qué enfoque de propagación de errores permite mejor una recuperación inteligente?", "options": [{"letter": "A", "text": "Devolver contexto de error estructurado al coordinador, incluyendo el tipo de fallo, la consulta ejecutada, cualquier resultado parcial y posibles enfoques alternativos.", "correct": true, "explanation": "Devolver contexto de error estructurado—incluyendo tipo de fallo, consulta ejecutada, resultados parciales y enfoques alternativos—da al coordinador todo lo necesario para tomar decisiones inteligentes de recuperación (por ejemplo, reintentar con una consulta modificada o continuar con resultados parciales). Preserva el máximo contexto para una toma de decisiones informada a nivel de coordinación."}, {"letter": "B", "text": "Capturar el timeout dentro del subagente y devolver un conjunto de resultados vacío marcado como exitoso.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Implementar reintentos automáticos con retroceso exponencial dentro del subagente, devolviendo solo un estado genérico \"búsqueda no disponible\" después de agotar los reintentos.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Propagar la excepción de timeout directamente al manejador de nivel superior, terminando todo el flujo de investigación.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g11", "source": "guide", "domain": 1, "scenario": "Sistema de investigación multiagente", "situation": "Mientras investigas un tema amplio, observas que el agente de búsqueda web y el agente de análisis de documentos investigan los mismos subtemas, llevando a una duplicación sustancial en sus salidas. El uso de tokens casi se duplica sin un aumento proporcional en la amplitud o profundidad de la investigación. ¿Cuál es la forma más efectiva de abordar esto?", "question": "¿Cuál es la forma más efectiva de abordar esto?", "options": [{"letter": "A", "text": "Permitir que ambos agentes terminen en paralelo y luego que el coordinador deduplique los resultados solapados antes de pasarlos al agente de síntesis.", "correct": false, "explanation": ""}, {"letter": "B", "text": "El coordinador particiona explícitamente el espacio de investigación antes de delegar, asignando a cada agente subtemas o tipos de fuente distintos.", "correct": true, "explanation": "Hacer que el coordinador particione explícitamente el espacio de investigación antes de delegar es lo más efectivo porque aborda la causa raíz—límites de tarea poco claros—antes de que comience cualquier trabajo. Preserva el paralelismo mientras previene esfuerzo duplicado y tokens desperdiciados."}, {"letter": "C", "text": "Implementar un mecanismo de estado compartido donde los agentes registran su área de enfoque actual para que otros agentes puedan evitar dinámicamente la duplicación durante la ejecución.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Cambiar a ejecución secuencial donde el análisis de documentos se ejecuta solo después de que la búsqueda web termina, usando los resultados de búsqueda como contexto para evitar duplicación.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g12", "source": "guide", "domain": 1, "scenario": "Sistema de investigación multiagente", "situation": "Durante la investigación, el subagente de búsqueda web consulta tres categorías de fuentes con resultados diferentes: las bases de datos académicas devuelven 15 artículos relevantes, los informes de la industria devuelven \"0 resultados\" y las bases de datos de patentes devuelven \"Tiempo de conexión agotado\". Al diseñar la propagación de errores al coordinador, ¿qué enfoque permite las mejores decisiones de recuperación?", "question": "¿Qué enfoque permite las mejores decisiones de recuperación?", "options": [{"letter": "A", "text": "Agregar los resultados en una sola métrica de porcentaje de éxito (por ejemplo, \"67% de cobertura de fuentes\") con registros detallados disponibles a demanda.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Reportar tanto \"timeout\" como \"0 resultados\" como fallos que requieren intervención del coordinador.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Reintentar fallos transitorios internamente y reportar solo errores persistentes.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Distinguir fallos de acceso (timeout) que requieren una decisión de reintento de resultados vacíos válidos (\"0 resultados\") que representan consultas exitosas.", "correct": true, "explanation": "Un timeout (fallo de acceso) y \"0 resultados\" (resultado vacío válido) son resultados semánticamente diferentes que requieren respuestas diferentes. Distinguirlos permite al coordinador reintentar la base de datos de patentes mientras acepta los \"0 resultados\" de informes de la industria como un hallazgo válido e informativo."}], "correct": "D"}, {"id": "g47", "source": "guide", "domain": 1, "scenario": "Agente de soporte al cliente", "situation": "Tu agente maneja solicitudes de un solo problema con 94% de precisión (por ejemplo, \"Necesito un reembolso para el pedido #1234\"). Pero cuando los clientes incluyen múltiples problemas en un solo mensaje (por ejemplo, \"Necesito un reembolso para el pedido #1234 y también quiero actualizar la dirección de envío del pedido #5678\"), la precisión de selección de herramientas baja al 58%. El agente generalmente resuelve solo un problema o mezcla parámetros entre solicitudes. ¿Qué enfoque mejora más efectivamente la confiabilidad para solicitudes de múltiples problemas?", "question": "¿Qué enfoque es más efectivo?", "options": [{"letter": "A", "text": "Implementar una capa de preprocesamiento que use una llamada de modelo separada para descomponer mensajes de múltiples problemas en solicitudes separadas, manejar cada una independientemente y fusionar resultados.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Combinar herramientas relacionadas en menos herramientas universales.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Agregar ejemplos few-shot al prompt demostrando razonamiento correcto y secuenciación de herramientas para solicitudes de múltiples problemas.", "correct": true, "explanation": "Los ejemplos few-shot que demuestran razonamiento correcto y secuenciación de herramientas para solicitudes de múltiples problemas son los más efectivos porque el agente ya funciona bien en problemas únicos—lo que necesita es guía sobre el patrón para descomponer y enrutar múltiples problemas y mantener los parámetros separados."}, {"letter": "D", "text": "Implementar validación de respuesta que detecte respuestas incompletas y reprompte automáticamente al agente para resolver problemas omitidos.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g48", "source": "guide", "domain": 1, "scenario": "Agente de soporte al cliente", "situation": "Los registros de producción muestran que para solicitudes simples como \"reembolso para el pedido #1234\", tu agente resuelve el problema en 3–4 llamadas a herramientas con 91% de éxito. Pero para solicitudes complejas como \"Me cobraron dos veces, mi descuento no se aplicó y quiero cancelar\", el agente promedia 12+ llamadas a herramientas con solo 54% de éxito—a menudo investigando problemas secuencialmente y obteniendo datos de cliente redundantes para cada uno. ¿Qué cambio mejora más efectivamente el manejo de solicitudes complejas?", "question": "¿Qué cambio es más efectivo?", "options": [{"letter": "A", "text": "Agregar puntos de control explícitos de verificación entre etapas, requiriendo que el agente registre el progreso después de resolver cada problema antes de pasar al siguiente.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Reducir el número de herramientas combinando `get_customer`, `lookup_order` y herramientas relacionadas con facturación en una sola herramienta `investigate_issue`.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Descomponer la solicitud en problemas separados, luego investigar cada uno en paralelo usando contexto de cliente compartido antes de sintetizar una resolución final.", "correct": true, "explanation": "Descomponer en problemas separados e investigar en paralelo con contexto de cliente compartido corrige ambos problemas clave: elimina la recuperación de datos redundante reutilizando el contexto compartido entre problemas y reduce los bucles totales de llamadas a herramientas paralelizando la investigación antes de sintetizar una sola resolución."}, {"letter": "D", "text": "Agregar ejemplos few-shot al prompt del sistema demostrando secuencias ideales de llamadas a herramientas para varios escenarios de facturación multifacéticos.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g50", "source": "guide", "domain": 1, "scenario": "Agente de soporte al cliente", "situation": "Después de llamar a `get_customer` y `lookup_order`, el agente tiene todos los datos disponibles del sistema pero aún enfrenta incertidumbre. ¿Qué situación es el disparador más justificado para llamar a `escalate_to_human`?", "question": "¿Qué situación es la más justificada para escalación?", "options": [{"letter": "A", "text": "Un cliente quiere cancelar un pedido enviado ayer y que llega mañana. El agente debería escalar porque el cliente podría cambiar de opinión después de recibir el paquete.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Un cliente afirma que no recibió un pedido, pero el seguimiento muestra que fue entregado y firmado en su dirección hace tres días. El agente debería escalar porque presentar evidencia contradictoria podría dañar la relación con el cliente.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Un cliente solicita igualar el precio de un competidor. Tus políticas permiten ajustes de precio para bajadas de precio en tu propio sitio dentro de 14 días, pero no dicen nada sobre precios de competidores. El agente debería escalar para interpretación de política.", "correct": true, "explanation": "Esta es una verdadera laguna de política: las reglas de la empresa cubren bajadas de precio en tu propio sitio pero no abordan la igualación de precios de competidores. El agente no debe inventar política y debería escalar para juicio humano sobre cómo interpretar o extender las reglas existentes."}, {"letter": "D", "text": "Un mensaje de cliente contiene tanto una pregunta de facturación como una devolución de producto. El agente debería escalar para que un humano coordine ambos problemas en una sola interacción.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g53", "source": "guide", "domain": 1, "scenario": "Agente de soporte al cliente", "situation": "Las métricas de producción muestran que tu agente promedia 4+ bucles de API por resolución. El análisis revela que Claude a menudo solicita `get_customer` y `lookup_order` en turnos secuenciales separados incluso cuando ambos se necesitan inicialmente. ¿Cuál es la forma más efectiva de reducir el número de bucles?", "question": "¿Cuál es la forma más efectiva de reducir bucles?", "options": [{"letter": "A", "text": "Implementar ejecución especulativa que llame automáticamente a herramientas probablemente necesarias en paralelo con cualquier herramienta solicitada y devuelva todos los resultados independientemente de lo que se solicitó.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Aumentar `max_tokens` para dar a Claude más espacio para planificar y combinar naturalmente solicitudes de herramientas.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Crear herramientas compuestas como `get_customer_with_orders` que agrupen combinaciones comunes de búsqueda en llamadas únicas.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Instruir a Claude en el prompt para agrupar solicitudes de herramientas en un turno y devolver todos los resultados juntos antes de la siguiente llamada a la API.", "correct": true, "explanation": "Promptear a Claude para agrupar solicitudes de herramientas relacionadas en un solo turno aprovecha su capacidad nativa de solicitar múltiples herramientas a la vez. Corrige directamente el patrón de llamada secuencial con cambio arquitectónico mínimo."}], "correct": "D"}, {"id": "g58", "source": "guide", "domain": 1, "scenario": "Agente de soporte al cliente", "situation": "Estás implementando el bucle del agente para tu agente de soporte. Después de cada llamada a la API de Claude, debes decidir si continuar el bucle (ejecutar las herramientas solicitadas y llamar a Claude de nuevo) o detenerte (presentar la respuesta final al cliente). ¿Qué determina esta decisión?", "question": "¿Qué determina esta decisión?", "options": [{"letter": "A", "text": "Verificar el campo `stop_reason` en la respuesta de Claude—continuar si es `tool_use` y detenerse si es `end_turn`.", "correct": true, "explanation": "`stop_reason` es la señal estructurada explícita de Claude para el control del bucle: `tool_use` indica que Claude quiere ejecutar una herramienta y recibir resultados de vuelta, mientras que `end_turn` indica que Claude ha completado su respuesta y el bucle debería terminar."}, {"letter": "B", "text": "Parsear el texto de Claude para frases como \"He terminado\" o \"¿Puedo ayudarte con algo más?\"—las señales de lenguaje natural indican finalización de tarea.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Establecer un conteo máximo de iteraciones (por ejemplo, 10 llamadas) y detenerse cuando se alcance, independientemente de si Claude indica que se necesita más trabajo.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Verificar si la respuesta contiene contenido de texto del asistente—si Claude generó texto explicativo, el bucle debería terminar.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "m1", "source": "mock", "domain": 1, "scenario": null, "situation": "Tu pipeline de investigación multiagente se cayó después de procesar 12 de 28 documentos. El agente de búsqueda web había identificado fuentes relevantes, el agente de análisis de documentos había completado parcialmente la extracción, y el sintetizador había comenzado a identificar patrones. Necesitas reanudar el procesamiento sin repetir trabajo ni perder la fidelidad de los hallazgos previos.", "question": "¿Qué enfoque de gestión de estado equilibra mejor la fidelidad de la información con la eficiencia de contexto al restaurar el estado de los agentes?", "options": [{"letter": "A", "text": "Que cada agente mantenga su propio archivo de estado persistente y lo recargue de forma independiente al inicio de cada sesión.", "correct": false, "explanation": "Un estado fragmentado por agente rompe la visibilidad del coordinador y hace que el razonamiento entre agentes sea frágil. Además, que cada agente recargue estado interno no relacionado satura su contexto con ruido que no necesita."}, {"letter": "B", "text": "Persistir el registro de conversación del coordinador con todas las delegaciones de tareas y respuestas, y entregarlo a los agentes al reanudar.", "correct": false, "explanation": "Un registro completo de conversación es la opción de mayor fidelidad pero menor eficiencia de contexto. Reproducirías todo en cada subagente y superarías los presupuestos de contexto."}, {"letter": "C", "text": "Que cada agente persista un reporte estructurado en una ubicación conocida. Al reanudar, el coordinador carga los reportes e inyecta el estado relevante en los prompts de los agentes.", "correct": true, "explanation": "Correcto. Los reportes estructurados por agente conservan la fidelidad (los hallazgos, con esquema), permiten que el coordinador mantenga el control de la orquestación y mantienen enfocado el contexto de cada subagente. Es el patrón de coordinador + artefacto compacto."}, {"letter": "D", "text": "Indexar todas las salidas de los agentes en un almacén vectorial compartido. Al reanudar, cada agente consulta el almacén mediante búsqueda semántica para recuperar los hallazgos previos relevantes.", "correct": false, "explanation": "La recuperación semántica sobre las salidas de los agentes es excesiva para reanudar un pipeline caído: añade un modo de fallo de recuperación y puede pasar por alto el estado preciso que un reporte estructurado preserva exactamente. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m2", "source": "mock", "domain": 1, "scenario": null, "situation": "Después de que el agente de búsqueda web encuentra 25 fuentes (120K tokens de contenido sin procesar), el agente de análisis de documentos extrae ideas clave (15K tokens) y el agente de síntesis produce un borrador de narrativa coherente (3K tokens), el coordinador debe pasar el contexto al agente de generación de reportes para la salida final con las citas de fuentes adecuadas.", "question": "¿Qué estrategia para pasar el contexto ofrece el mejor equilibrio entre completitud y eficiencia?", "options": [{"letter": "A", "text": "Pasar solo el borrador de síntesis y usar un pipeline de posprocesamiento aparte que vincule las afirmaciones con las fuentes e inserte las citas después de generar el reporte.", "correct": false, "explanation": "La vinculación posterior es frágil: sin el mapeo que usó el modelo, no puedes ligar de forma confiable las afirmaciones con la fuente correcta. El modo de fallo habitual son citas alucinadas o mal atribuidas."}, {"letter": "B", "text": "Pasar el borrador de síntesis junto con un índice de fuentes estructurado que mapee las afirmaciones clave con las URLs de sus fuentes y los extractos relevantes.", "correct": true, "explanation": "Correcto. La síntesis aporta la narrativa; el índice de fuentes le da al generador de reportes exactamente la vinculación que necesita para citar sin volver a leer 120K tokens de contenido sin procesar."}, {"letter": "C", "text": "Pasar un resumen condensado de todas las etapas previas que preserve los hallazgos principales y los atribuya a las fuentes solo por nombre.", "correct": false, "explanation": "La atribución solo por nombre pierde las URLs y los extractos, así que el generador de reportes no puede citar ni verificar; además, el 'solo por nombre' tiende a derivar en citas vagas."}, {"letter": "D", "text": "Pasar el contexto completo acumulado de todos los agentes previos.", "correct": false, "explanation": "Máxima completitud pero derrochadora: más de 120K tokens de contenido de búsqueda sin procesar son, en su mayoría, ruido irrelevante en la etapa de generación de reportes. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m4", "source": "mock", "domain": 1, "scenario": null, "situation": "El agente de búsqueda web ha reunido varias fuentes relevantes para un tema de investigación. El agente de análisis de documentos ahora necesita examinar esas fuentes.", "question": "¿Cómo fluye normalmente la información entre estos dos subagentes especializados?", "options": [{"letter": "A", "text": "Los agentes se comunican a través de una cola de mensajes basada en eventos, y el agente de análisis de documentos se suscribe a los eventos de finalización de la búsqueda web.", "correct": false, "explanation": "Los buses de eventos no forman parte del modelo de subagentes de Claude. Los subagentes no se publican/suscriben entre sí directamente."}, {"letter": "B", "text": "El agente de búsqueda web invoca directamente al agente de análisis de documentos, pasándole las fuentes descubiertas como parámetros.", "correct": false, "explanation": "Los subagentes están aislados: no pueden llamar directamente a subagentes hermanos. Eso también los acoplaría fuertemente y anularía el patrón de coordinador."}, {"letter": "C", "text": "El coordinador recibe la salida del agente de búsqueda web e incluye los hallazgos relevantes en el prompt al invocar al agente de análisis de documentos.", "correct": true, "explanation": "Correcto. En un patrón coordinador-trabajador, el coordinador es el eje. Recoge la salida de cada subagente y reenvía explícitamente las partes relevantes al prompt del siguiente subagente."}, {"letter": "D", "text": "Ambos agentes acceden a un almacén de memoria compartido donde el agente de búsqueda web escribe los hallazgos y el agente de análisis de documentos los lee.", "correct": false, "explanation": "Un almacén compartido puede añadirse como optimización, pero no es la forma habitual en que se comunican los subagentes, y además introduce problemas de lecturas obsoletas y consistencia. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m5", "source": "mock", "domain": 1, "scenario": null, "situation": "En producción observas que consultas simples de verificación de hechos (p. ej., \"¿En qué año se firmó el Acuerdo de París sobre el Clima?\") recorren los cuatro subagentes de forma secuencial, consumiendo más de 40 segundos y bastantes tokens por consulta. La investigación comparativa compleja sí se beneficia del pipeline completo. Tu distribución de consultas es diversa y evoluciona a medida que los usuarios descubren nuevas aplicaciones.", "question": "¿Cuál es el enfoque más eficaz para optimizar ante una complejidad de consulta variable?", "options": [{"letter": "A", "text": "Implementar enrutamiento basado en patrones que categorice las consultas por su estructura (hecho único vs. comparativa vs. analítica) y mapee cada categoría a una combinación predefinida de subagentes.", "correct": false, "explanation": "El enrutamiento por patrones se cristaliza a medida que la distribución de consultas evoluciona: las nuevas intenciones rompen los patrones y caen silenciosamente en el pipeline equivocado."}, {"letter": "B", "text": "Crear una vía rápida para las preguntas factuales que omita por completo a los subagentes, y enrutar todas las demás consultas por el pipeline completo para asegurar la exhaustividad de la investigación.", "correct": false, "explanation": "Una vía rápida binaria corrige el peor caso pero desperdicia el pipeline completo en cada consulta moderadamente compleja que podría haber usado un subconjunto."}, {"letter": "C", "text": "Que el coordinador analice cada consulta y decida dinámicamente qué subagentes invocar según su evaluación de los requisitos de la consulta.", "correct": true, "explanation": "Correcto. Dejar que el LLM coordinador razone sobre cada consulta y elija solo los subagentes que necesita se adapta de forma natural a una distribución de consultas diversa y en evolución: esa es la fortaleza del patrón de coordinador."}, {"letter": "D", "text": "Entrenar un clasificador de complejidad de consultas con datos históricos etiquetados para predecir las combinaciones óptimas de subagentes, reentrenándolo periódicamente a medida que evolucionan los patrones de consulta.", "correct": false, "explanation": "Un clasificador entrenado necesita etiquetas, reentrenamiento y monitoreo de deriva. Es sobreingeniería cuando el coordinador puede tomar la misma decisión en tiempo de ejecución a partir de la propia consulta. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m6", "source": "mock", "domain": 1, "scenario": null, "situation": "Al investigar \"adopción de energías renovables\", el agente de búsqueda web devuelve estadísticas recientes (2024: 35% de adopción), mientras que el agente de análisis de documentos extrae datos de reportes internos (2022: 18% de adopción). El agente de síntesis marca incorrectamente estas fuentes como contradictorias en lugar de reconocer que los datos muestran crecimiento a lo largo del tiempo.", "question": "¿Qué cambio permitiría mejor que el agente de síntesis interprete correctamente esas diferencias temporales?", "options": [{"letter": "A", "text": "Exigir que los subagentes incluyan las fechas de publicación o de recolección de datos en sus salidas estructuradas.", "correct": true, "explanation": "Correcto. El agente de síntesis malinterpreta los datos porque nunca ve las fechas. Hacer que cada dato lleve su propia marca de tiempo en la salida estructurada le permite a la síntesis razonar sobre tendencias en lugar de contradicciones."}, {"letter": "B", "text": "Añadir un agente de resolución de conflictos que descarte automáticamente los datos más antiguos cuando existan datos más recientes para la misma métrica.", "correct": false, "explanation": "Descartar silenciosamente los datos más antiguos destruye la información de tendencia, que es justamente lo que pregunta el enunciado."}, {"letter": "C", "text": "Configurar el agente de búsqueda web para que solo devuelva resultados de los últimos 6 meses.", "correct": false, "explanation": "Reducir la ventana descarta el contexto histórico y no corrige la brecha arquitectónica de que los metadatos no se están pasando a la síntesis."}, {"letter": "D", "text": "Instruir al agente de síntesis para que siempre trate los datos más recientes como autoritativos y coloque los hallazgos más antiguos en un apéndice histórico separado.", "correct": false, "explanation": "Las instrucciones de prompt por sí solas no son confiables y, además, esconden el razonamiento temporal detrás de una regla. Estructurar los datos con fechas es la solución sistemática. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m7", "source": "mock", "domain": 1, "scenario": null, "situation": "El agente de síntesis recibe hallazgos resumidos de los agentes de búsqueda web y de análisis de documentos, y luego pasa un resumen consolidado al generador de reportes. Durante las pruebas, descubres que los reportes generados hacen afirmaciones factuales sin las citas adecuadas: el generador de reportes no puede atribuir las afirmaciones a sus fuentes originales porque esos metadatos se perdieron durante los pasos de resumen.", "question": "¿Cuál es el enfoque más eficaz para asegurar una atribución de fuentes adecuada en los reportes finales?", "options": [{"letter": "A", "text": "Que cada agente emita datos estructurados que separen los resúmenes de contenido de los metadatos de fuente (URLs, nombres de documentos, números de página).", "correct": true, "explanation": "Correcto. El contenido estructurado + los metadatos de fuente separados preservan el mapeo de extremo a extremo, de modo que el generador de reportes recibe tanto lo que se dijo como de dónde provino."}, {"letter": "B", "text": "Que el generador de reportes consulte al agente de búsqueda web para relocalizar las fuentes de las afirmaciones del reporte final.", "correct": false, "explanation": "Volver a consultar es lento, con pérdidas, e invita a la atribución errónea: el agente de búsqueda web no sabe qué afirmación provino de qué fuente."}, {"letter": "C", "text": "Instruir al agente de síntesis para que incruste las referencias de fuente en línea dentro de su texto de resumen usando un formato de cita consistente.", "correct": false, "explanation": "Las citas en línea dentro de texto libre se desvían y se pierden durante resúmenes posteriores. Los metadatos estructurados sobreviven mejor a las transformaciones."}, {"letter": "D", "text": "Omitir el resumen y pasar las salidas completas sin procesar de la búsqueda web y del análisis de documentos directamente al generador de reportes.", "correct": false, "explanation": "Reventarías el presupuesto de contexto y le complicarías la tarea al generador de reportes. El resumen es útil; el verdadero bug es perder los metadatos durante el resumen. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m9", "source": "mock", "domain": 1, "scenario": null, "situation": "En producción, los reportes finales suelen contener afirmaciones sin la atribución de fuentes adecuada. La investigación muestra que, si bien los agentes de búsqueda web y de análisis de documentos adjuntan correctamente las citas a sus salidas, el agente de síntesis pierde el rastro de qué fuentes respaldan qué conclusiones al combinar los hallazgos.", "question": "¿Cuál es el cambio arquitectónico más eficaz?", "options": [{"letter": "A", "text": "Mantener transcripciones completas de todas las interacciones de los subagentes y añadir un agente de resolución de citas que analice los registros y determine las atribuciones antes de generar el reporte.", "correct": false, "explanation": "El análisis posterior de registros es frágil y costoso, y aun así pierde las vinculaciones cuando la síntesis fusiona puntos de múltiples fuentes."}, {"letter": "B", "text": "Exigir que todos los subagentes emitan mapeos estructurados de afirmación-fuente que el agente de síntesis deba preservar y fusionar al combinar hallazgos de múltiples fuentes.", "correct": true, "explanation": "Correcto. Los mapeos explícitos de afirmación-fuente son una salida de primera clase que el agente de síntesis puede fusionar de forma determinista: no se pierde ninguna atribución durante el resumen."}, {"letter": "C", "text": "Añadir un paso de verificación en el que el generador de reportes use coincidencia por similitud semántica contra las fuentes originales para reconstruir qué afirmaciones provinieron de qué documentos.", "correct": false, "explanation": "La búsqueda por similitud puede atribuir la fuente equivocada cuando dos fuentes dicen cosas similares. Quieres el mapeo original del modelo, no una reconstrucción."}, {"letter": "D", "text": "Que el coordinador inyecte prefijos identificadores de fuente en el texto antes de cada traspaso, y luego analice esos prefijos en la generación del reporte para reconstruir las citas.", "correct": false, "explanation": "Los tokens de prefijo dentro de la prosa se pierden, se parafrasean o se alucinan. Los mapeos estructurados fuera de la prosa son más robustos. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m10", "source": "mock", "domain": 1, "scenario": null, "situation": "Después de que el agente de búsqueda web y el agente de análisis de documentos completan sus tareas, el coordinador invoca al agente de síntesis. Sin embargo, el agente de síntesis responde que no puede completar la tarea porque no se le proporcionaron hallazgos de investigación.", "question": "¿Cuál es la causa más probable de este problema?", "options": [{"letter": "A", "text": "La ventana de contexto del agente de síntesis no es lo suficientemente grande para contener las salidas combinadas de ambos agentes previos.", "correct": false, "explanation": "Un desbordamiento de la ventana de contexto suele manifestarse como un truncamiento o un error de la API, no como que el agente diga 'no se proporcionaron hallazgos'."}, {"letter": "B", "text": "El coordinador no incluyó las salidas de los agentes previos en el prompt del agente de síntesis.", "correct": true, "explanation": "Correcto. Las invocaciones de subagentes están aisladas: nada fluye entre ellas a menos que el coordinador lo coloque explícitamente en el prompt. El mensaje 'no se proporcionaron hallazgos' es exactamente lo que verías."}, {"letter": "C", "text": "Los subagentes necesitan compartir una única conexión a la API para habilitar el intercambio automático de contexto entre invocaciones.", "correct": false, "explanation": "No existe ningún 'intercambio automático de contexto' a través de una conexión compartida. El aislamiento de contexto es por diseño."}, {"letter": "D", "text": "El agente de síntesis necesita herramientas que puedan obtener resultados directamente de los historiales de conversación de los otros agentes.", "correct": false, "explanation": "Obtener el historial entre agentes no es una capacidad estándar ni la solución correcta: el coordinador debería reenviar los hallazgos explícitamente. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m12", "source": "mock", "domain": 1, "scenario": null, "situation": "El coordinador entrega instrucciones detalladas paso a paso al subagente de búsqueda web, especificando consultas de búsqueda exactas, prioridades de fuentes y filtros de fecha. El monitoreo en producción revela tres problemas: (1) el subagente reporta \"resultados insuficientes\" en lugar de intentar enfoques alternativos cuando las búsquedas preespecificadas fallan, (2) la calidad de la investigación cae para temas emergentes que no coinciden con los patrones esperados, y (3) el subagente rara vez saca a la luz fuentes tangenciales valiosas.", "question": "¿Cuál es la forma más eficaz de mejorar la adaptabilidad del subagente?", "options": [{"letter": "A", "text": "Eliminar por completo los detalles procedimentales, delegando con objetivos simples como \"investiga X a fondo\" y confiando en las capacidades generales del subagente.", "correct": false, "explanation": "Demasiado hacia el otro extremo: 'investiga X a fondo' pierde las salvaguardas (calidad de fuentes, actualidad) que hacen confiable la delegación."}, {"letter": "B", "text": "Añadir directivas de respaldo explícitas a las instrucciones detalladas: \"Si las búsquedas especificadas arrojan menos de N resultados, intenta formulaciones alternativas de la consulta antes de reportar un fallo\".", "correct": false, "explanation": "Parcha un modo de fallo pero mantiene al agente atrapado en un pensamiento procedimental: sigue siendo frágil para los temas emergentes y las fuentes tangenciales."}, {"letter": "C", "text": "Implementar un paso de clasificación de temas en el que el coordinador categorice las solicitudes como \"bien definidas\" o \"exploratorias\" y use estilos de instrucción distintos para cada categoría.", "correct": false, "explanation": "Un clasificador con dos categorías es frágil, y de todos modos seguirías enviando instrucciones rígidas en la rama bien definida."}, {"letter": "D", "text": "Especificar los objetivos de investigación y los criterios de calidad (amplitud de cobertura, diversidad de fuentes, actualidad) en lugar de pasos procedimentales, dejando que el subagente determine su estrategia de búsqueda.", "correct": true, "explanation": "Correcto. Delega la intención y los estándares de calidad, no los procedimientos. Así el subagente puede elegir consultas, seguir tangentes prometedoras y recuperarse de callejones sin salida por su cuenta. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m13", "source": "mock", "domain": 1, "scenario": null, "situation": "El monitoreo en producción muestra que las consultas de seguimiento como \"resume lo que aprendimos sobre las tendencias del mercado\" tardan sistemáticamente más de 40 segundos. La investigación revela que el coordinador genera el subagente de síntesis para cada solicitud de resumen, pasándole más de 80K tokens de hallazgos acumulados. El coordinador ya tiene esos hallazgos en su contexto por haber orquestado la investigación.", "question": "¿Cuál es la forma más eficaz de mejorar el tiempo de respuesta para estos resúmenes de seguimiento?", "options": [{"letter": "A", "text": "Pregenerar y cachear resúmenes en múltiples granularidades cada vez que se acumulan nuevos hallazgos.", "correct": false, "explanation": "La generación especulativa desperdicia tokens en resúmenes que el usuario quizá nunca pida, y las granularidades del caché nunca coinciden del todo con lo que se solicita."}, {"letter": "B", "text": "Que el coordinador maneje las solicitudes de resumen sencillas directamente usando su contexto existente, reservando la generación de subagentes para los análisis complejos.", "correct": true, "explanation": "Correcto. Si el coordinador ya tiene los hallazgos, generar un subagente para reingerir 80K tokens es puro sobrecosto. Deja que el coordinador responda él mismo los seguimientos simples."}, {"letter": "C", "text": "Habilitar el cacheo de prompts en el subagente de síntesis para reducir el sobrecosto de transferir repetidamente los mismos hallazgos de investigación.", "correct": false, "explanation": "El cacheo de prompts recorta el costo del prefijo repetido, pero el desperdicio arquitectónico —generar un subagente entero para un resumen— sigue ahí."}, {"letter": "D", "text": "Generar el subagente de síntesis con contexto reducido y hacer que solicite hallazgos específicos al coordinador bajo demanda.", "correct": false, "explanation": "Añade idas y vueltas y complejidad para el mismo resultado que el coordinador podría producir directamente. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m14", "source": "mock", "domain": 1, "scenario": null, "situation": "Al analizar casos legales complejos que citan múltiples precedentes, el subagente de análisis de documentos procesa cada uno de forma secuencial. Un caso emblemático que cita 12 precedentes tarda más de 3 minutos en analizarse por completo.", "question": "¿Cuál es la forma más eficaz de reducir esta latencia preservando la capacidad del coordinador para monitorear y depurar el sistema?", "options": [{"letter": "A", "text": "Implementar una cola de mensajes donde las tareas de análisis de precedentes se procesen de forma asíncrona mediante un grupo de agentes trabajadores.", "correct": false, "explanation": "Las colas externas complican la observabilidad: el coordinador pierde la visibilidad directa de qué tareas tuvieron éxito y qué produjeron."}, {"letter": "B", "text": "Crear una jerarquía recursiva de agentes donde los agentes de análisis subdividan el trabajo entre agentes hijos hasta llegar a la granularidad de un solo precedente.", "correct": false, "explanation": "La recursión añade niveles de indirección que dificultan la depuración y el monitoreo, sin una aceleración real más allá del primer reparto."}, {"letter": "C", "text": "Que el coordinador genere subagentes de análisis de documentos en paralelo, cada uno encargándose de un subconjunto de precedentes, y luego agregue los resultados antes de la síntesis.", "correct": true, "explanation": "Correcto. El paralelismo gestionado por el coordinador reparte el trabajo, mantiene acotado el alcance de cada subagente y preserva un único eje para el monitoreo y la agregación."}, {"letter": "D", "text": "Permitir que el subagente de análisis de documentos genere dinámicamente sus propios subagentes especializados cuando se encuentre con casos que tengan muchas citas.", "correct": false, "explanation": "La generación anidada esconde la ejecución dentro de los subagentes y deja incompleta la vista de depuración del coordinador. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m15", "source": "mock", "domain": 1, "scenario": null, "situation": "El coordinador tiene `AgentDefinitions` configuradas para los cuatro subagentes especializados, cada una con descripciones, prompts y restricciones de herramientas adecuadas. Durante las pruebas, notas que el coordinador razona correctamente sobre cuándo delegar —genera mensajes como \"le pediré al agente de búsqueda web que encuentre fuentes sobre este tema\"— pero nunca ocurre ninguna ejecución de subagente. El coordinador luego continúa como si la delegación hubiera ocurrido y prosigue con información incompleta. Los registros no muestran errores.", "question": "¿Cuál es la causa más probable?", "options": [{"letter": "A", "text": "El valor de `max_tokens` del coordinador es demasiado bajo, lo que provoca que la invocación de la herramienta Task se trunque antes de poder especificar el parámetro de tipo de subagente.", "correct": false, "explanation": "Un truncamiento aparecería en los registros y normalmente dejaría bloques `tool_use` parciales, no operaciones silenciosas sin efecto."}, {"letter": "B", "text": "Las `AgentDefinitions` están configuradas correctamente, pero el prompt de sistema del coordinador no lista explícitamente los tipos de subagente disponibles, lo que impide que el modelo sepa que pueden invocarse.", "correct": false, "explanation": "Los esquemas de herramientas/agentes se exponen al modelo automáticamente: no necesitas volver a listarlos en el prompt de sistema para que el modelo los vea."}, {"letter": "C", "text": "La configuración de allowedTools del coordinador no incluye \"Task\", así que, aunque puede razonar sobre la delegación, no puede invocar la herramienta necesaria para generar subagentes.", "correct": true, "explanation": "Correcto. Sin la herramienta Task en allowedTools, el coordinador puede hablar de delegar pero no tiene forma de llamar realmente a un subagente, lo que coincide con el síntoma de 'razona sobre ello, sin ejecución, sin errores'."}, {"letter": "D", "text": "El aislamiento de contexto de los subagentes implica que las descripciones de tareas del coordinador no llegan automáticamente a los subagentes; necesitas configurar el reenvío explícito de contexto en ClaudeAgentOptions.", "correct": false, "explanation": "El aislamiento de contexto es real, pero afecta lo que ve el subagente una vez generado, no si el coordinador puede generarlo siquiera. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m21", "source": "mock", "domain": 1, "scenario": null, "situation": "Tu herramienta de exploración de código base almacena IDs de sesión para permitir que los ingenieros continúen sus investigaciones entre sesiones de trabajo. Un ingeniero dedicó una hora ayer a analizar un módulo de autenticación heredado, acumulando contexto sobre su arquitectura y dependencias. Quiere continuar hoy. El ID de sesión es válido, pero el control de versiones muestra que 3 de los 12 archivos que el agente había leído fueron modificados durante la noche por el merge de un compañero.", "question": "¿Qué enfoque equilibra mejor la eficiencia y la precisión?", "options": [{"letter": "A", "text": "Reanudar la sesión sin informar al agente sobre los archivos modificados", "correct": false, "explanation": "Reanudar en silencio deja al agente razonando sobre contenido desactualizado en 3 de 12 archivos: justo la fuente de malas recomendaciones."}, {"letter": "B", "text": "Iniciar una sesión nueva para garantizar que el agente trabaje con el estado actual del código base, sin suposiciones desactualizadas", "correct": false, "explanation": "Desecha una hora de contexto válido sobre los 9 archivos que no cambiaron."}, {"letter": "C", "text": "Reanudar la sesión e informar al agente qué archivos específicos cambiaron, para un reanálisis dirigido", "correct": true, "explanation": "Correcto. Conserva el costoso contexto que ya construiste, a la vez que le dices al agente exactamente cuáles 3 archivos releer: mínimo desperdicio, máxima precisión."}, {"letter": "D", "text": "Reanudar la sesión y hacer que el agente relea de inmediato los 12 archivos analizados previamente", "correct": false, "explanation": "Innecesario para los 9 archivos sin cambios. Solo agrega tokens sin mejorar la precisión. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m22", "source": "mock", "domain": 1, "scenario": null, "situation": "Un ingeniero usó el agente ayer para analizar un módulo de autenticación heredado e identificó dos enfoques de refactorización distintos: extraer un microservicio frente a refactorizar en el sitio. Hoy quiere explorar ambos enfoques en profundidad —haciendo que el agente proponga cambios de código específicos para cada uno— antes de decidir cuál implementar.", "question": "¿Cuál es la forma más efectiva de estructurar esta exploración?", "options": [{"letter": "A", "text": "Reanudar la sesión de ayer para explorar el primer enfoque y luego iniciar una sesión nueva para el segundo, recreando manualmente el contexto original.", "correct": false, "explanation": "La recreación manual es propensa a errores y pierde el estado de trabajo exacto del análisis de ayer."}, {"letter": "B", "text": "Iniciar dos sesiones nuevas, proporcionando manualmente un resumen de los hallazgos del análisis de ayer para establecer el contexto.", "correct": false, "explanation": "Rehace el trabajo y arriesga que las dos sesiones diverjan de la misma base que estableciste ayer."}, {"letter": "C", "text": "Reanudar la sesión de ayer y explorar ambos enfoques de forma secuencial dentro del mismo hilo de conversación.", "correct": false, "explanation": "La exploración secuencial en un solo hilo permite que cada enfoque contamine el contexto del otro."}, {"letter": "D", "text": "Usar `fork_session` para crear dos ramas a partir del análisis de ayer, explorando un enfoque en cada bifurcación.", "correct": true, "explanation": "Correcto. Bifurcar desde la sesión de ayer le da a cada enfoque su propio contexto independiente a partir de la misma base de análisis: limpio, paralelo y sin contaminación. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m24", "source": "mock", "domain": 1, "scenario": null, "situation": "Un ingeniero le pide a tu agente que identifique las rutas de código sin pruebas en un módulo heredado de procesamiento de pagos que abarca 45 archivos. Tras leer los primeros 8 archivos fuente, las respuestas del agente se vuelven notablemente menos precisas: olvida patrones de código discutidos previamente y aún no ha localizado todos los archivos de prueba ni rastreado los flujos críticos de pago.", "question": "¿Cuál es el enfoque más efectivo para completar esta investigación?", "options": [{"letter": "A", "text": "Documentar todos los hallazgos actuales en un informe de resumen, borrar el contexto por completo y luego usar ese informe como única referencia para continuar la investigación.", "correct": false, "explanation": "Un único informe se convierte en la única fuente de verdad y tiende a comprimir y eliminar los patrones de código específicos que necesitarías después."}, {"letter": "B", "text": "Generar subagentes para investigar preguntas específicas (por ejemplo, \"encuentra todos los archivos de prueba para el procesamiento de pagos\", \"rastrea las dependencias del flujo de reembolso\") mientras el agente principal coordina los hallazgos y preserva la comprensión de alto nivel.", "correct": true, "explanation": "Correcto. Delega investigaciones bien acotadas a subagentes con contexto fresco, mientras el agente principal conserva la visión arquitectónica general. Este es el patrón para escalar la exploración más allá de una sola ventana de contexto."}, {"letter": "C", "text": "Borrar el contexto con /clear y luego releer selectivamente solo los archivos más críticos descubiertos hasta ahora, escribiendo los hallazgos clave en un archivo de notas (scratchpad) que persiste entre reinicios de contexto.", "correct": false, "explanation": "Los scratchpads ayudan, pero borrar y releer descarta la comprensión que ya construiste a lo largo de 8 archivos."}, {"letter": "D", "text": "Cambiar a usar Grep para buscar nombres de funciones específicos en lugar de leer archivos completos, reduciendo el contenido cargado en el contexto para la exploración restante.", "correct": false, "explanation": "No puedes identificar rutas sin pruebas con solo hacer grep de nombres: necesitas leer lo suficiente de cada ruta para saber qué ramas no cubren las pruebas. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m25", "source": "mock", "domain": 1, "scenario": null, "situation": "Un desarrollador le pide al agente que investigue por qué un endpoint de API específico devuelve errores 500 de forma intermitente. El código base tiene más de 200 archivos y el desarrollador no sabe qué componentes están involucrados. El agente debe rastrear el error a través de las capas de enrutamiento, middleware, lógica de negocio y base de datos.", "question": "¿Qué enfoque de descomposición de tareas sería más efectivo?", "options": [{"letter": "A", "text": "Hacer que el agente primero cree un plan integral que mapee todas las rutas de código a través del endpoint, antes de comenzar cualquier exploración de archivos o lectura de código.", "correct": false, "explanation": "No puedes construir un plan correcto para un error desconocido sin ninguna exploración. Planificar a ciegas desperdicia tiempo y pasa por alto la ruta de fallo real."}, {"letter": "B", "text": "Hacer que el agente genere dinámicamente subtareas de investigación según lo que descubre en cada paso, adaptando su plan de exploración a medida que emerge nueva información sobre la ruta del error.", "correct": true, "explanation": "Correcto. La depuración es adaptativa por naturaleza: cada archivo que lees cambia cuál es el siguiente paso más útil. Deja que el agente siga la evidencia."}, {"letter": "C", "text": "Definir de antemano una secuencia fija de pasos de investigación —hacer grep de patrones de error, luego leer los manejadores de errores, luego revisar las consultas a la base de datos, luego examinar el middleware—, ejecutando cada paso sin importar los hallazgos intermedios.", "correct": false, "explanation": "Una tubería fija desperdicia trabajo en capas que no están involucradas y puede bloquear al agente de la ruta real de la causa raíz."}, {"letter": "D", "text": "Ejecutar agentes trabajadores en paralelo que investiguen simultáneamente las cuatro capas, y luego sintetizar sus hallazgos para identificar dónde se origina el error.", "correct": false, "explanation": "El despliegue en paralelo es útil una vez que tienes subtareas bien acotadas. Aquí no las tienes: pagarías 4 veces el costo para buscar en tres capas que no son el problema. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m26", "source": "mock", "domain": 1, "scenario": null, "situation": "El subagente de exploración de un ingeniero dedicó 30 minutos a analizar un sistema de pagos heredado, leyendo 47 archivos y documentando flujos de datos. La sesión se interrumpió cuando se cayó la conexión del ingeniero. Mientras tanto, un compañero hizo merge de un PR que renombró dos funciones de utilidad. El ingeniero quiere continuar la misma exploración.", "question": "¿Cuál es el enfoque m
