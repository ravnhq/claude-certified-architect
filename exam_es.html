ás efectivo?", "options": [{"letter": "A", "text": "Reanudar el subagente desde su transcripción anterior sin mencionar los cambios: la comprensión de la arquitectura sigue siendo válida.", "correct": false, "explanation": "Reanudar en silencio permite que el agente siga referenciando los nombres de función antiguos en sus recomendaciones."}, {"letter": "B", "text": "Lanzar un subagente nuevo e incluir la transcripción previa en el prompt inicial como contexto.", "correct": false, "explanation": "Cargar 30 minutos de transcripción en el prompt de un subagente nuevo es un desperdicio y contamina su contexto inicial."}, {"letter": "C", "text": "Lanzar un subagente nuevo con un resumen de los hallazgos previos.", "correct": false, "explanation": "Volver a resumir descarta los flujos de datos detallados que el agente ya estaba rastreando a lo largo de 47 archivos."}, {"letter": "D", "text": "Reanudar el subagente desde su transcripción anterior e informarle sobre las funciones renombradas.", "correct": true, "explanation": "Correcto. Conserva la comprensión acumulada y dale un delta dirigido sobre los renombramientos para que pueda actualizar su modelo mental: mínimo desperdicio, máxima precisión. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m28", "source": "mock", "domain": 1, "scenario": null, "situation": "Tu agente ha analizado un módulo de servicio complejo: leyó 23 archivos fuente, rastreó flujos de solicitudes e identificó patrones de manejo de errores. Un desarrollador quiere comparar dos estrategias de pruebas antes de comprometerse con una: pruebas de extremo a extremo con servicios externos simulados frente a pruebas de snapshot que capturan las salidas esperadas. Necesita desarrollar ambos enfoques de forma independiente para evaluar las compensaciones.", "question": "¿Cómo deberías gestionar las sesiones?", "options": [{"letter": "A", "text": "Exportar los hallazgos clave de la sesión de análisis a un archivo y luego crear dos sesiones nuevas que hagan referencia a ese archivo.", "correct": false, "explanation": "Un resumen exportado pierde más información que el estado vivo de la sesión que el agente construyó mientras leía 23 archivos."}, {"letter": "B", "text": "Reanudar la sesión de análisis con `fork_session` habilitado, creando una rama separada para cada estrategia de pruebas.", "correct": true, "explanation": "Correcto. Bifurcar le da a cada estrategia su propio contexto independiente a partir de la base de análisis exacta: sin contaminación cruzada, sin reanálisis."}, {"letter": "C", "text": "Iniciar dos sesiones nuevas, haciendo que cada una relea los archivos fuente relevantes antes de comenzar.", "correct": false, "explanation": "Quema tokens rehaciendo trabajo que la sesión original ya hizo, y arriesga que cada sesión nueva llegue a conclusiones distintas a partir del mismo código."}, {"letter": "D", "text": "Continuar en la sesión original, desarrollando primero las pruebas de extremo a extremo y luego las pruebas de snapshot de forma secuencial.", "correct": false, "explanation": "El desarrollo secuencial en un solo hilo permite que la implementación de la primera estrategia sesgue el razonamiento sobre la segunda. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m30", "source": "mock", "domain": 1, "scenario": null, "situation": "Un ingeniero que acaba de unirse al equipo le pide al agente que lo ayude a entender la arquitectura de autenticación y autorización antes de realizar mejoras de seguridad. El código base tiene más de 800 archivos repartidos en múltiples servicios.", "question": "¿Qué estrategia de exploración construirá la comprensión de forma más efectiva, dadas las herramientas integradas de Claude y los límites de contexto?", "options": [{"letter": "A", "text": "Leer primero cualquier archivo CLAUDE.md y README, y luego pedirle al ingeniero que especifique cuáles 10-15 archivos son los más importantes para entender el sistema de autenticación.", "correct": false, "explanation": "El ingeniero acaba de unirse: probablemente no sepa qué archivos importan. Eso es exactamente con lo que se supone que el agente debe ayudar."}, {"letter": "B", "text": "Lanzar subagentes en paralelo para explorar distintos servicios simultáneamente y luego sintetizar sus hallazgos en una visión arquitectónica general.", "correct": false, "explanation": "Sin saber dónde reside la autenticación, el despliegue en paralelo explora demasiado ampliamente y los subagentes se duplican y pasan por alto los flujos entre servicios."}, {"letter": "C", "text": "Usar Grep para encontrar los puntos de entrada de autenticación, leer esos archivos y luego seguir las importaciones y llamadas a funciones para mapear el flujo de autenticación de forma incremental.", "correct": true, "explanation": "Correcto. Empieza en los puntos de entrada (login, verificación de token, middleware) y luego rastrea hacia afuera siguiendo las aristas reales del código. Incremental, fundamentado y se ajusta a los límites de contexto."}, {"letter": "D", "text": "Leer todos los archivos que contengan \"auth\", \"login\", \"permission\" o \"token\" en su contenido o nombre de archivo.", "correct": false, "explanation": "Esas palabras clave coinciden con una enorme cantidad de código no relacionado a lo largo de más de 800 archivos y ahogan el contexto en ruido. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m31", "source": "mock", "domain": 1, "scenario": null, "situation": "Un cliente regresa 4 horas después de su sesión inicial sobre la misma disputa de facturación. La sesión anterior de 32 turnos contiene resultados de `lookup_order` que muestran \"Status: PENDING, Expected resolution: 24-48 hours.\" En las pruebas, observas que al reanudar sesiones con resultados de herramienta obsoletos, el agente a menudo hace referencia a los datos desactualizados en sus respuestas (por ejemplo, \"Veo que tu reembolso aún se está procesando\") incluso después de que llamadas frescas a la herramienta devuelven información distinta.", "question": "¿Qué enfoque maneja de forma más confiable a los clientes que regresan?", "options": [{"letter": "A", "text": "Reanudar con el historial completo, pero filtrar los mensajes previos de `tool_result` antes de reanudar, conservando solo los turnos de humano/asistente para que el agente deba volver a obtener los datos necesarios.", "correct": false, "explanation": "Eliminar los `tool_results` de en medio de una conversación puede dejar mensajes del asistente que hacen referencia a resultados inexistentes; la transcripción queda internamente inconsistente."}, {"letter": "B", "text": "Iniciar una nueva sesión, inyectar un resumen estructurado de la interacción previa (tipo de problema, acciones tomadas, estado de resolución) y luego hacer llamadas frescas a las herramientas antes de interactuar.", "correct": true, "explanation": "Correcto. Una sesión limpia con un resumen mantiene la continuidad narrativa y a la vez garantiza que el agente no razone sobre resultados de herramienta obsoletos."}, {"letter": "C", "text": "Reanudar con el historial completo y agregar una instrucción al prompt del sistema indicándole al agente que siempre prefiera los resultados de herramienta más recientes cuando existan varias llamadas a la misma herramienta en el contexto.", "correct": false, "explanation": "Las instrucciones del prompt son sugerencias. Observaste exactamente ese modo de falla en las pruebas: el modelo aún hace referencia a resultados antiguos."}, {"letter": "D", "text": "Reanudar con el historial completo y configurar el agente para que vuelva a llamar automáticamente a todas las herramientas usadas previamente al inicio de la sesión para asegurar la frescura de los datos.", "correct": false, "explanation": "Volver a llamar todo de forma indiscriminada es un desperdicio, es lento y aun así deja los resultados antiguos en el contexto, confundiendo al modelo. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m32", "source": "mock", "domain": 1, "scenario": null, "situation": "Estás implementando la lógica de escalamiento para cuando el agente deba llamar a `escalate_to_human`. Tu equipo propone cuatro enfoques distintos para disparar el escalamiento.", "question": "¿Qué enfoque identificará de forma más confiable los casos que realmente requieren intervención humana?", "options": [{"letter": "A", "text": "Indicarle al agente que escale cuando el cliente solicite un humano, cuando el problema requiera excepciones de política o cuando el agente no pueda avanzar de forma significativa.", "correct": true, "explanation": "Correcto. Las decisiones de escalamiento son juicios sobre la intención y el progreso, exactamente en lo que los LLM son buenos. Criterios claros en lenguaje natural superan a las reglas rígidas para la cola larga de casos."}, {"letter": "B", "text": "Configurar el agente para que escale tras tres llamadas consecutivas a herramientas que no logren resolver el problema declarado por el cliente, asegurando un intento razonable antes de involucrar a un humano.", "correct": false, "explanation": "Un conteo fijo de reintentos se dispara tanto demasiado pronto (reintentos legítimos) como demasiado tarde (problemas evidentes de política en la primera llamada)."}, {"letter": "C", "text": "Implementar un análisis de sentimiento que monitoree indicadores de frustración (lenguaje negativo, preguntas repetidas, signos de exclamación) y disparar el escalamiento cuando la puntuación de frustración supere un umbral configurado.", "correct": false, "explanation": "El sentimiento puede captar la frustración, pero pasa por alto a clientes tranquilos que simplemente necesitan un humano para una excepción de política, y sobre-escala ante lenguaje estilístico."}, {"letter": "D", "text": "Construir un motor de reglas que mapee tipos específicos de problemas, segmentos de clientes y categorías de productos a decisiones de escalamiento, eliminando la necesidad de juicios del modelo.", "correct": false, "explanation": "Los motores de reglas se rompen ante los casos para los que no fueron diseñados, y el soporte al cliente está lleno de esos. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m33", "source": "mock", "domain": 1, "scenario": null, "situation": "Tras investigar una disputa de facturación durante más de 25 turnos, identificaste que los cargos duplicados ocurrieron porque un timeout de la pasarela de pago disparó la lógica de reintento. El reembolso requerido ($847) excede tu límite de autorización de $500. Necesitas llamar a `escalate_to_human`, y el agente humano no tendrá acceso a la transcripción de tu conversación.", "question": "¿Qué contexto deberías pasar para permitir una resolución efectiva?", "options": [{"letter": "A", "text": "La queja original del cliente textualmente, más los fragmentos del resultado de la herramienta que muestran las transacciones duplicadas.", "correct": false, "explanation": "Artefactos en bruto sin síntesis obligan al humano a rehacer los 25 turnos de investigación que acabas de terminar."}, {"letter": "B", "text": "Un resumen estructurado: ID del cliente, causa raíz, monto del reembolso y acción recomendada.", "correct": true, "explanation": "Correcto. Un traspaso estructurado con identificadores, causa, monto y acción recomendada es lo que un agente humano necesita para retomar el caso al instante sin volver a investigar."}, {"letter": "C", "text": "La transcripción completa de la conversación con todos los resultados de las herramientas.", "correct": false, "explanation": "Volcar toda la transcripción obliga al humano a vadear 25 turnos en lugar de leer un resumen de una pantalla."}, {"letter": "D", "text": "Solo tu diagnóstico y el monto del reembolso.", "correct": false, "explanation": "Faltan los identificadores del cliente y la acción recomendada: el humano no puede actuar sin ellos. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m34", "source": "mock", "domain": 1, "scenario": null, "situation": "El cumplimiento normativo exige que los reembolsos que superen los $500 deben escalar automáticamente a un agente humano; esta regla no puede dejarse a discreción del modelo. A pesar de instrucciones claras en el prompt del sistema, los registros de producción muestran que el agente ocasionalmente procesa reembolsos de alto valor directamente (tasa de falla del 3%).", "question": "¿Cómo deberías lograr un cumplimiento garantizado?", "options": [{"letter": "A", "text": "Modificar la herramienta de reembolso para que devuelva un error con el mensaje \"Amount exceeds policy limit—please escalate\" cuando se supere el umbral.", "correct": false, "explanation": "Esto ayuda, pero depende de que el agente interprete correctamente el error y escale; sigue siendo discreción del modelo en el punto de decisión."}, {"letter": "B", "text": "Agregar ejemplos few-shot al prompt que muestren el comportamiento de escalamiento correcto en varios montos de reembolso ($400, $500, $600).", "correct": false, "explanation": "Los few-shots desplazan la distribución, pero no eliminan la falla del 3%. El cumplimiento dice que la regla no puede dejarse a discreción del modelo."}, {"letter": "C", "text": "Implementar un hook para interceptar las llamadas a herramientas; cuando el monto a procesar por reembolso supere los $500, bloquearla e invocar el escalamiento humano.", "correct": true, "explanation": "Correcto. Las reglas de grado de cumplimiento pertenecen fuera del modelo: un hook determinista sobre la llamada a la herramienta se dispara de forma garantizada cada vez, independientemente del comportamiento del modelo."}, {"letter": "D", "text": "Reforzar el prompt del sistema con lenguaje enfático: \"CRITICAL POLICY: Refunds over $500 MUST trigger human escalation. NEVER process these directly.\"", "correct": false, "explanation": "Los prompts enfáticos reducen pero no eliminan el mal uso. La frase \"no puede dejarse a discreción del modelo\" descarta cualquier solución basada solo en el prompt. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m35", "source": "mock", "domain": 1, "scenario": null, "situation": "Durante la resolución de una disputa de facturación, tu agente obtiene con éxito la información del cliente vía `get_customer` y los detalles del pedido vía `lookup_order`, pero al intentar llamar a `process_refund`, la herramienta devuelve un error de timeout. El agente tiene suficiente información para explicar los cargos y verificar la elegibilidad del reembolso, pero no puede procesar realmente el reembolso debido a la falla del backend.", "question": "¿Qué enfoque equilibra mejor la resolución en el primer contacto con un manejo de errores adecuado?", "options": [{"letter": "A", "text": "Escalar de inmediato a un agente humano, ya que la acción de reembolso no puede completarse.", "correct": false, "explanation": "Traslada un problema transitorio del backend a un humano cuando el agente aún podría explicar la situación y ofrecer opciones."}, {"letter": "B", "text": "Implementar reintentos automáticos con retroceso exponencial para `process_refund`, manteniendo la conversación abierta hasta que el reembolso se procese con éxito.", "correct": false, "explanation": "Obligar al cliente a esperar reintentos indefinidos es una mala experiencia y puede que nunca tenga éxito si la interrupción es prolongada."}, {"letter": "C", "text": "Explicar la facturación, confirmar la elegibilidad del reembolso, reconocer el problema del sistema que impide el procesamiento inmediato y ofrecer escalamiento o reintentar más tarde.", "correct": true, "explanation": "Correcto. Entrega el valor parcial que puedas (explicación + elegibilidad), sé honesto sobre la falla y deja que el cliente elija entre el escalamiento humano o un reintento. Degradación elegante clásica."}, {"letter": "D", "text": "Confirmar que el reembolso se procesará y cerrar la conversación, ya que el sistema tiene toda la información necesaria para completarlo automáticamente.", "correct": false, "explanation": "Comprometerse con un resultado que no ocurrió es engañar al cliente, una falla mayor que el timeout. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m36", "source": "mock", "domain": 1, "scenario": null, "situation": "Un cliente escribe: \"Llevo días yendo y viniendo con esta devolución. Solo quiero hablar con alguien que realmente pueda ayudarme.\" El agente ha confirmado vía `lookup_order` que la devolución es sencilla: dentro de la política y elegible para procesamiento inmediato.", "question": "¿Qué debería hacer el agente?", "options": [{"letter": "A", "text": "Reconocer la frustración, informarle que esto se puede resolver ahora y ofrecer completarlo o escalar.", "correct": true, "explanation": "Correcto. Honra el sentimiento, dale la vía de resolución rápida por escrito y preserva su elección. Esa es la jugada de respeto al cliente que a la vez aprovecha la capacidad del agente."}, {"letter": "B", "text": "Llamar a `escalate_to_human` de inmediato para honrar la solicitud del cliente.", "correct": false, "explanation": "Encolamiento innecesario cuando el problema está a una llamada de herramienta de distancia. Frustra aún más al cliente al añadir espera a un caso ya simple."}, {"letter": "C", "text": "Procesar el reembolso vía `process_refund` para resolver el problema de fondo y luego informarle que está completo.", "correct": false, "explanation": "Toma una acción unilateral después de que el cliente pidió explícitamente hablar con alguien; ignora su preferencia declarada."}, {"letter": "D", "text": "Preguntar qué específicamente no ha funcionado en los intentos anteriores antes de decidir si escalar o resolver automáticamente.", "correct": false, "explanation": "Interrogar a un cliente frustrado sobre fallas pasadas es lo opuesto a lo que pidió. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m39", "source": "mock", "domain": 1, "scenario": null, "situation": null, "question": "Cuando el agente llama a `lookup_order` y recibe detalles del pedido que muestran que el artículo se compró hace 45 días, ¿cómo determina el bucle agéntico si debe llamar a `process_refund` o a `escalate_to_human` a continuación?", "options": [{"letter": "A", "text": "La capa de orquestación enruta automáticamente a la siguiente herramienta según el campo de estado del pedido.", "correct": false, "explanation": "No hay una capa de orquestación implícita que elija herramientas a partir de un campo. El modelo conduce la selección de herramientas."}, {"letter": "B", "text": "El agente sigue un árbol de decisión preconfigurado que mapea atributos del pedido a llamadas de herramienta específicas.", "correct": false, "explanation": "Los bucles agénticos son impulsados por el modelo, no por árboles de decisión. Los árboles codificados son lo opuesto a aquello para lo que sirve el patrón de agente."}, {"letter": "C", "text": "Los detalles del pedido se agregan a la conversación y el modelo razona sobre qué acción tomar.", "correct": true, "explanation": "Correcto. El bucle agéntico funciona agregando mensajes de `tool_result` a la conversación y dejando que el modelo decida el siguiente paso en cada turno. Así es como se resuelve 45 días → reembolso vs. escalar."}, {"letter": "D", "text": "El agente ejecuta los pasos restantes en una secuencia de herramientas planificada al inicio de la solicitud.", "correct": false, "explanation": "No hay un plan comprometido por adelantado; el agente elige cada siguiente paso según el contexto más reciente. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m40", "source": "mock", "domain": 1, "scenario": null, "situation": "Un cliente envía: \"Esto es frustrante. Ya expliqué mi problema dos veces y no se está resolviendo nada. Quiero hablar con una persona real AHORA.\" El agente aún no ha llamado a ninguna herramienta para investigar su cuenta.", "question": "¿Qué debería hacer el agente?", "options": [{"letter": "A", "text": "Reconocer la frustración y hacer una pregunta dirigida para entender el problema específico antes de escalar.", "correct": true, "explanation": "Correcto. El cliente dijo \"dos veces\", pero aún no tienes contexto. Una pregunta enfocada que reconozca la situación te da una oportunidad de resolución en el primer contacto sin desestimar la frustración ni retrasar un posible traspaso."}, {"letter": "B", "text": "Explicar brevemente con qué puede ayudar el agente y ofrecer resolver el problema rápidamente, escalando solo si el cliente repite su solicitud.", "correct": false, "explanation": "Lanzarse a enumerar capacidades ante un cliente frustrado que pidió un humano se percibe como desdeñoso."}, {"letter": "C", "text": "Llamar de inmediato a `escalate_to_human` con el historial de la conversación.", "correct": false, "explanation": "Escalar sin contexto de herramientas crea un traspaso en frío donde el humano también empieza desde cero."}, {"letter": "D", "text": "Primero llamar a `get_customer` y `lookup_order` para reunir contexto de la cuenta y luego escalar a un agente humano.", "correct": false, "explanation": "Investigar sin preguntar añade latencia y no respeta la solicitud del cliente. Una sola pregunta que reconozca la situación es más rápida y respetuosa. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m41", "source": "mock", "domain": 1, "scenario": null, "situation": "Tu agente está manejando una disputa de facturación. Tras llamar a `get_customer` y `lookup_order`, identifica que la disputa involucra un error de precios promocionales que requiere aprobación de un gerente, más allá del nivel de autorización del agente.", "question": "¿Cómo debería el flujo de trabajo manejar este escalamiento a mitad del proceso?", "options": [{"letter": "A", "text": "Llamar a `escalate_to_human` pasando solo el mensaje original del cliente.", "correct": false, "explanation": "Descarta el contexto derivado de las herramientas que el agente acaba de reunir, forzando al humano a rehacer la investigación."}, {"letter": "B", "text": "Compilar un traspaso estructurado con los detalles del cliente, la información del pedido y el problema identificado antes de llamar a `escalate_to_human`.", "correct": true, "explanation": "Correcto. Un resumen estructurado (quién, qué pedido, qué problema, por qué excede la autorización) le permite al agente humano retomar al instante. Ese es el patrón de escalamiento a mitad del proceso."}, {"letter": "C", "text": "Intentar el reembolso con `process_refund` de todos modos, escalando solo si el sistema rechaza la transacción.", "correct": false, "explanation": "Exceder la autorización a sabiendas es una violación de política, no algo que se deba intentar con la esperanza de que el sistema lo detecte."}, {"letter": "D", "text": "Persistir la conversación completa y el historial de respuestas de las herramientas en una base de datos, y luego llamar a `escalate_to_human` con un ID de referencia.", "correct": false, "explanation": "Añade infraestructura y un paso de búsqueda adicional cuando un resumen estructurado en línea es más simple y rápido. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "g7", "source": "guide", "domain": 2, "scenario": "Sistema de investigación multiagente", "situation": "Los registros de producción muestran un patrón persistente: solicitudes como \"analiza el informe trimestral subido\" se enrutan al agente de búsqueda web el 45% del tiempo en lugar de al agente de análisis de documentos. Revisando las definiciones de herramientas, encuentras que el agente de búsqueda web tiene una herramienta `analyze_content` descrita como \"analiza contenido y extrae información clave\", mientras que el agente de análisis de documentos tiene una herramienta `analyze_document` descrita como \"analiza documentos y extrae información clave\". ¿Cómo deberías corregir el problema de enrutamiento?", "question": "¿Cómo deberías corregir el problema de enrutamiento?", "options": [{"letter": "A", "text": "Agregar un clasificador de pre-enrutamiento que detecte si el usuario se refiere a archivos subidos o contenido web antes de que el coordinador decida la delegación.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Renombrar la herramienta de búsqueda web a `extract_web_results` y actualizar su descripción a \"procesa y devuelve información obtenida de búsqueda web y URLs\".", "correct": true, "explanation": "Renombrar la herramienta de búsqueda web a `extract_web_results` y actualizar su descripción para referenciar explícitamente la búsqueda web y las URLs elimina directamente la causa raíz al eliminar el solapamiento semántico entre los nombres y descripciones de las dos herramientas. Esto hace inequívoco el propósito de cada herramienta, permitiendo al coordinador distinguir confiablemente análisis de documentos de búsqueda web."}, {"letter": "C", "text": "Agregar ejemplos few-shot al prompt del coordinador mostrando el enrutamiento correcto: \"El usuario sube un informe trimestral → agente de análisis de documentos\" y \"El usuario pregunta sobre una página web → agente de búsqueda web\".", "correct": false, "explanation": ""}, {"letter": "D", "text": "Expandir la descripción de la herramienta de análisis de documentos con ejemplos de uso como \"Usar para PDFs subidos, documentos de Word y hojas de cálculo\", dejando la herramienta de búsqueda web sin cambios.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g10", "source": "guide", "domain": 2, "scenario": "Sistema de investigación multiagente", "situation": "En tu diseño del sistema, le diste al agente de análisis de documentos acceso a una herramienta de propósito general `fetch_url` para que pudiera descargar documentos por URL. Los registros de producción muestran que este agente ahora descarga frecuentemente páginas de resultados de motores de búsqueda para realizar búsquedas web ad hoc—comportamiento que debería enrutarse a través del agente de búsqueda web—causando resultados inconsistentes. ¿Qué corrección es más efectiva?", "question": "¿Qué corrección es más efectiva?", "options": [{"letter": "A", "text": "Reemplazar `fetch_url` con una herramienta `load_document` que valide que las URLs apunten a formatos de documento.", "correct": true, "explanation": "Reemplazar una herramienta de propósito general con una herramienta específica para documentos que valida URLs contra formatos de documento corrige la causa raíz limitando la capacidad a nivel de la interfaz. Esto sigue el principio de menor privilegio, haciendo imposible el comportamiento de búsqueda no deseado en lugar de meramente desincentivarlo."}, {"letter": "B", "text": "Eliminar `fetch_url` del agente de análisis de documentos y enrutar toda obtención de URL a través del coordinador hacia el agente de búsqueda web.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Implementar un filtro que bloquee llamadas de `fetch_url` a dominios conocidos de motores de búsqueda mientras permite otras URLs.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Agregar instrucciones al prompt del agente de análisis de documentos indicando que `fetch_url` solo debe usarse para descargar URLs de documentos, no para buscar.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g15", "source": "guide", "domain": 2, "scenario": "Sistema de investigación multiagente", "situation": "En pruebas, observas que el agente de síntesis a menudo necesita verificar afirmaciones específicas mientras fusiona resultados. Actualmente, cuando se necesita verificación, el agente de síntesis devuelve el control al coordinador, que llama al agente de búsqueda web y luego reinvoca la síntesis con los resultados. Esto añade 2–3 bucles extra por tarea y aumenta la latencia un 40%. Tu evaluación muestra que el 85% de estas verificaciones son comprobaciones simples de hechos (fechas, nombres, estadísticas) y el 15% requiere investigación más profunda. ¿Qué enfoque reduce más efectivamente la sobrecarga preservando la confiabilidad del sistema?", "question": "¿Cuál es el enfoque más efectivo?", "options": [{"letter": "A", "text": "Dar al agente de síntesis acceso a todas las herramientas de búsqueda web para que pueda manejar cualquier necesidad de verificación directamente sin bucles del coordinador.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Hacer que el agente de síntesis acumule todas las necesidades de verificación y las devuelva como un lote al coordinador al final, que las envía todas al agente de búsqueda web a la vez.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Hacer que el agente de búsqueda web cachee proactivamente contexto extra alrededor de cada fuente durante la investigación inicial en anticipación a que la síntesis necesite verificación.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Dar al agente de síntesis una herramienta `verify_fact` de alcance limitado para comprobaciones simples, mientras se enrutan las verificaciones complejas a través del coordinador al agente de búsqueda web.", "correct": true, "explanation": "Una herramienta de verificación de hechos de alcance limitado permite al agente de síntesis manejar el 85% de las comprobaciones simples directamente, eliminando la mayoría de los bucles, mientras se preserva la ruta de delegación del coordinador para el 15% de verificaciones complejas. Esto aplica el menor privilegio mientras reduce significativamente la latencia."}], "correct": "D"}, {"id": "g18", "source": "guide", "domain": 2, "scenario": "Claude Code para Integración Continua", "situation": "Tu componente de revisión de código es iterativo: Claude analiza el archivo modificado, luego puede solicitar archivos relacionados (imports, clases base, pruebas) mediante llamadas a herramientas para entender el contexto antes de proporcionar la retroalimentación final. Tu aplicación define una herramienta que permite a Claude solicitar contenido de archivos; Claude llama la herramienta, obtiene resultados y continúa el análisis. Estás evaluando procesamiento en lote para reducir el costo de la API. ¿Cuál es la principal limitación técnica al considerar procesamiento en lote para este flujo?", "question": "¿Cuál es la principal limitación técnica?", "options": [{"letter": "A", "text": "El procesamiento en lote no incluye IDs de correlación para mapear las salidas de vuelta a las solicitudes de entrada.", "correct": false, "explanation": ""}, {"letter": "B", "text": "El modelo asíncrono no puede ejecutar herramientas a mitad de solicitud y devolver resultados para que Claude continúe el análisis.", "correct": true, "explanation": "Un modelo asíncrono \"fire-and-forget\" de Batch API no tiene mecanismo para interceptar una llamada a herramienta durante una solicitud, ejecutar la herramienta y devolver resultados para que Claude continúe el análisis. Esto es fundamentalmente incompatible con flujos iterativos de llamadas a herramientas que requieren múltiples rondas de solicitud/respuesta de herramientas dentro de una sola interacción lógica."}, {"letter": "C", "text": "La Batch API no soporta definiciones de herramientas en los parámetros de solicitud.", "correct": false, "explanation": ""}, {"letter": "D", "text": "La latencia de procesamiento en lote de hasta 24 horas es demasiado lenta para retroalimentación de pull requests, aunque el flujo funcionaría de otro modo.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g46", "source": "guide", "domain": 2, "scenario": "Agente de soporte al cliente", "situation": "Mientras pruebas, notas que el agente a menudo llama a `get_customer` cuando los usuarios preguntan sobre el estado del pedido, aunque `lookup_order` sería más apropiado. ¿Qué deberías verificar primero para abordar este problema?", "question": "¿Qué deberías verificar primero?", "options": [{"letter": "A", "text": "Implementar un clasificador de preprocesamiento para detectar solicitudes relacionadas con pedidos y enrutarlas directamente a `lookup_order`.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Reducir el número de herramientas disponibles para el agente para simplificar la elección.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Agregar ejemplos few-shot al prompt del sistema cubriendo todos los patrones posibles de solicitud de pedido para mejorar la selección de herramientas.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Verificar las descripciones de las herramientas para asegurar que diferencien claramente el propósito de cada una.", "correct": true, "explanation": "Las descripciones de herramientas son la entrada principal que el modelo usa para decidir qué herramienta llamar. Cuando un agente elige consistentemente la herramienta equivocada, el primer paso de diagnóstico es verificar que las descripciones de herramientas separen claramente el propósito y los límites de uso de cada una."}], "correct": "D"}, {"id": "g51", "source": "guide", "domain": 2, "scenario": "Agente de soporte al cliente", "situation": "Los registros de producción muestran que en el 12% de los casos tu agente omite `get_customer` y llama a `lookup_order` directamente usando solo el nombre proporcionado por el cliente, a veces llevando a cuentas mal identificadas y reembolsos incorrectos. ¿Qué cambio corrige más efectivamente este problema de confiabilidad?", "question": "¿Qué cambio es más efectivo?", "options": [{"letter": "A", "text": "Agregar ejemplos few-shot que muestren que el agente siempre llama primero a `get_customer`, incluso cuando los clientes proporcionan voluntariamente detalles del pedido.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Implementar un clasificador de enrutamiento que analice cada solicitud y habilite solo un subconjunto de herramientas apropiadas para ese tipo de solicitud.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Agregar una precondición programática que bloquee `lookup_order` y `process_refund` hasta que `get_customer` devuelva un identificador de cliente verificado.", "correct": true, "explanation": "Una precondición programática proporciona una garantía determinista de que se sigue la secuenciación requerida. Es el enfoque más efectivo porque elimina la posibilidad de saltarse la verificación, independientemente del comportamiento del LLM."}, {"letter": "D", "text": "Fortalecer el prompt del sistema indicando que la verificación del cliente vía `get_customer` es obligatoria antes de cualquier operación de pedido.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g55", "source": "guide", "domain": 2, "scenario": "Agente de soporte al cliente", "situation": "Tu herramienta `get_customer` devuelve todas las coincidencias al buscar por nombre. Actualmente, cuando hay múltiples resultados, Claude elige al cliente con el pedido más reciente, pero los datos de producción muestran que esto selecciona la cuenta equivocada el 15% del tiempo para coincidencias ambiguas. ¿Cómo deberías abordar esto?", "question": "¿Cómo deberías abordar esto?", "options": [{"letter": "A", "text": "Implementar un sistema de puntuación de confianza que actúe autónomamente por encima del 85% de confianza y solicite aclaración por debajo del umbral.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Instruir a Claude para solicitar un identificador adicional (email, teléfono o número de pedido) cuando `get_customer` devuelva múltiples coincidencias antes de tomar cualquier acción específica del cliente.", "correct": true, "explanation": "Pedir al usuario un identificador adicional es la forma más confiable de resolver ambigüedad porque el usuario tiene conocimiento definitivo de su identidad. Un turno conversacional extra es un precio pequeño a pagar para eliminar una tasa de error del 15% causada por elegir la cuenta equivocada."}, {"letter": "C", "text": "Modificar `get_customer` para devolver solo una sola coincidencia más probable basada en un algoritmo de ranking, eliminando la ambigüedad.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Agregar ejemplos few-shot al prompt demostrando razonamiento correcto y secuenciación de herramientas para coincidencias ambiguas.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g57", "source": "guide", "domain": 2, "scenario": "Agente de soporte al cliente", "situation": "Los registros de producción muestran que el agente a menudo llama a `get_customer` cuando los usuarios preguntan sobre pedidos (por ejemplo, \"verifica mi pedido #12345\") en lugar de llamar a `lookup_order`. Ambas herramientas tienen descripciones mínimas (\"Obtiene información del cliente\" / \"Obtiene detalles del pedido\") y aceptan formatos de identificadores de aspecto similar. ¿Cuál es el primer paso más efectivo para mejorar la confiabilidad de selección de herramientas?", "question": "¿Cuál es el primer paso más efectivo?", "options": [{"letter": "A", "text": "Implementar una capa de enrutamiento que analice la entrada del usuario antes de cada turno y preseleccione la herramienta correcta basada en palabras clave detectadas y patrones de ID.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Combinar ambas herramientas en una sola `lookup_entity` que acepte cualquier identificador y decida internamente qué backend consultar.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Agregar ejemplos few-shot al prompt del sistema demostrando patrones correctos de selección de herramientas, con 5–8 ejemplos enrutando consultas relacionadas con pedidos a `lookup_order`.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Expandir la descripción de cada herramienta para incluir formatos de entrada, consultas de ejemplo, casos límite y límites explicando cuándo usarla versus herramientas similares.", "correct": true, "explanation": "Expandir las descripciones de herramientas con formatos de entrada, consultas de ejemplo, casos límite y límites claros corrige directamente la causa raíz—descripciones mínimas que no dan al LLM suficiente información para distinguir herramientas similares. Es un primer paso de bajo esfuerzo y alto impacto que mejora el mecanismo principal que el LLM usa para selección de herramientas."}], "correct": "D"}, {"id": "g59", "source": "guide", "domain": 2, "scenario": "Agente de soporte al cliente", "situation": "Los registros de producción muestran que el agente malinterpreta salidas de tus herramientas MCP: marcas de tiempo Unix de `get_customer`, fechas ISO 8601 de `lookup_order` y códigos de estado numéricos (1=pendiente, 2=enviado). Algunas herramientas son servidores MCP de terceros que no puedes modificar. ¿Qué enfoque para normalización de formato de datos es más mantenible?", "question": "¿Qué enfoque es más mantenible?", "options": [{"letter": "A", "text": "Usar un hook PostToolUse para interceptar las salidas de herramientas y aplicar transformaciones de formato antes de que el agente las procese.", "correct": true, "explanation": "Un hook PostToolUse proporciona un punto centralizado y determinista para interceptar y normalizar todas las salidas de herramientas—incluyendo datos de servidores MCP de terceros—antes de que el agente las procese. Es más mantenible porque las transformaciones viven en el código y aplican uniformemente, en lugar de depender de la interpretación del LLM."}, {"letter": "B", "text": "Modificar las herramientas que controlas para que devuelvan formatos legibles por humanos y crear wrappers para las herramientas de terceros.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Crear una herramienta `normalize_data` que el agente llame después de cada recuperación de datos para transformar valores.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Agregar documentación detallada de formato al prompt del sistema explicando las convenciones de datos de cada herramienta.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g61", "source": "guide", "domain": 2, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "Tu herramienta `remove_team_member` usa un parámetro `dry_run: boolean` para previsualizar impactos antes de ejecutar. El monitoreo de producción muestra que el agente omite el paso de previsualización y llama directamente con `dry_run=false`. Necesitas garantizar que cada eliminación esté precedida por una previsualización que el usuario confirme explícitamente.", "question": "¿Cuál es el enfoque más confiable?", "options": [{"letter": "A", "text": "Agregar validación en el servidor que permita `dry_run=false` solo cuando una llamada con `dry_run=true` con parámetros idénticos ocurrió en los últimos 60 segundos.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Anotar la herramienta como que requiere confirmación y configurar la capa de orquestación para solicitar aprobación del usuario antes de reenviar llamadas a herramientas anotadas.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Agregar instrucciones detalladas y ejemplos few-shot en la descripción de la herramienta exigiendo que el agente siempre llame primero con `dry_run=true` y espere la confirmación del usuario.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Reemplazar con dos herramientas: `preview_remove_member` devuelve detalles del impacto y un token de confirmación de uso único; `execute_remove_member` requiere ese token, vinculando la ejecución a la previsualización.", "correct": true, "explanation": "El enfoque de vinculación por token hace arquitectónicamente imposible ejecutar sin una previsualización previa. La herramienta de ejecución literalmente requiere un token que solo la herramienta de previsualización puede generar. Es el único enfoque que aplica la restricción a nivel de código, no dependiendo del cumplimiento de instrucciones por el LLM (C), heurísticas de tiempo (A) o infraestructura de orquestación (B)."}], "correct": "D"}, {"id": "g62", "source": "guide", "domain": 2, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "El monitoreo de producción muestra que tu herramienta `search_catalog` falla el 12% del tiempo: el 8% son tiempos de espera de red que tienen éxito al reintentarse, y el 4% son errores de sintaxis de consulta que nunca tienen éxito. Actualmente ambos tipos de error se devuelven de forma idéntica, causando reintentos desperdiciados.", "question": "¿Cómo deberías modificar el manejo de errores de la herramienta?", "options": [{"letter": "A", "text": "Agregar ejemplos few-shot al prompt del sistema demostrando cómo distinguir errores de red de errores de sintaxis.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Aplicar lógica de reintento con retroceso exponencial uniformemente a todos los errores.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Implementar reintento automático con retroceso para tiempos de espera de red dentro de la herramienta; devolver errores de sintaxis inmediatamente con detalles de validación de parámetros.", "correct": true, "explanation": "Manejar reintentos a nivel de la herramienta para errores transitorios es la abstracción correcta—la herramienta tiene conocimiento definitivo del tipo de error y puede implementar lógica de reintento determinista sin depender del agente para interpretar un indicador (D) o seguir instrucciones del prompt (A). El retroceso uniforme (B) desperdicia tiempo en errores de sintaxis que nunca tendrán éxito."}, {"letter": "D", "text": "Devolver todos los errores con un indicador booleano `retryable` y detalles del tipo de error.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "m3", "source": "mock", "domain": 2, "scenario": null, "situation": "El agente de análisis de documentos tiene una única herramienta `analyze_document` que recibe un documento y un parámetro de instrucción en texto libre. Durante la evaluación, solicitudes como \"extrae las métricas financieras clave\" suelen devolver resúmenes narrativos, mientras que \"resume la metodología\" a veces devuelve tablas de datos en bruto. El agente de síntesis reporta que el 35% de los resultados de análisis requieren nuevas solicitudes con instrucciones aclaradas.", "question": "¿Cuál es la forma más eficaz de mejorar la fiabilidad?", "options": [{"letter": "A", "text": "Dividir la herramienta genérica en herramientas con propósito específico —`extract_data_points`, `summarize_content`, `verify_claim_against_source`— cada una con contratos de entrada/salida definidos.", "correct": true, "explanation": "Correcto. Las instrucciones en texto libre dejan la semántica en la prosa, que el modelo interpreta de forma inconsistente. Las herramientas con propósito específico le dan al modelo un contrato explícito y bien tipado entre el cual elegir."}, {"letter": "B", "text": "Mantener la herramienta única pero añadir un parámetro de enumeración `analysis_type` que exija elegir explícitamente entre los modos de extracción, resumen y verificación.", "correct": false, "explanation": "Mejor que el texto libre, pero sigue siendo una única herramienta con una única forma de salida. La salida aún tiene que ser una cadena genérica, y el modelo puede equivocarse de modo. Las herramientas separadas imponen contratos de entrada/salida distintos."}, {"letter": "C", "text": "Que el coordinador preclasifique cada solicitud de análisis antes de pasar las instrucciones al agente de análisis de documentos.", "correct": false, "explanation": "Traslada la ambigüedad aguas arriba sin resolverla. El contrato de la herramienta sigue siendo difuso; la clasificación del coordinador es una superficie de error más."}, {"letter": "D", "text": "Mejorar la descripción de la herramienta con ejemplos detallados que muestren cómo distintas formulaciones de las instrucciones deberían mapearse a distintos formatos de salida.", "correct": false, "explanation": "Los ejemplos ayudan, pero la fiabilidad en el uso de herramientas viene primero de límites claros y esquemas de salida, no de una ingeniería de prompts heroica sobre una herramienta genérica. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m16", "source": "mock", "domain": 2, "scenario": null, "situation": "Después de integrar un servidor MCP local que provee herramientas de análisis de código (`analyze_dependencies`, `find_dead_code`, `calculate_complexity`), verificas que el servidor está saludable y que las herramientas aparecen en la respuesta de tools/list. Sin embargo, observas que el agente usa consistentemente Grep para buscar sentencias de importación en lugar de llamar a `analyze_dependencies`, incluso cuando los usuarios preguntan explícitamente por \"dependencias de código\". Al examinar las definiciones de las herramientas se observa: MCP: `analyze_dependencies` - \"Analiza el grafo de dependencias\" Integrada: Grep - \"Busca contenido de archivos según un patrón usando expresiones regulares. Devuelve las líneas coincidentes con números de línea y contexto circundante.\"", "question": "¿Cuál es el enfoque más efectivo para mejorar la selección de herramientas MCP por parte del agente?", "options": [{"letter": "A", "text": "Eliminar Grep de las herramientas disponibles cuando el servidor MCP está conectado, para eliminar el solapamiento funcional.", "correct": false, "explanation": "Mutilar una herramienta general para forzar la adopción de una especializada perjudica otros casos de uso legítimos de Grep."}, {"letter": "B", "text": "Agregar instrucciones de enrutamiento al prompt del sistema que indiquen que las preguntas relacionadas con dependencias deben usar herramientas MCP en lugar de Grep.", "correct": false, "explanation": "El enrutamiento a nivel de prompt puede ayudar, pero la causa raíz es que la descripción de la herramienta MCP es más pobre que la de Grep. Corrige primero las descripciones de las herramientas."}, {"letter": "C", "text": "Dividir `analyze_dependencies` en herramientas granulares (`list_imports`, `resolve_transitive_deps`, `detect_circular_deps`) para que cada una tenga un propósito enfocado y menos propenso a solaparse con Grep.", "correct": false, "explanation": "Dividir a veces es lo correcto, pero aquí las herramientas hermanas seguirían teniendo descripciones débiles. El mismo error de selección reaparecería."}, {"letter": "D", "text": "Ampliar las descripciones de las herramientas MCP para detallar sus capacidades y resultados; por ejemplo, \"Construye un grafo de dependencias que muestra importaciones directas, dependencias transitivas y ciclos.\"", "correct": true, "explanation": "Correcto. La selección de herramientas se guía por las descripciones que ve el modelo. Una descripción de una línea como 'Analiza el grafo de dependencias' pierde frente a la descripción rica de Grep. Refuerza la descripción de la herramienta MCP. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m17", "source": "mock", "domain": 2, "scenario": null, "situation": "Un ingeniero le pide al agente que encuentre a todos los llamadores de una función antes de eliminarla. La función está definida en una biblioteca central, pero también se expone a través de módulos envoltorio que la renombran para usos específicos del dominio (por ejemplo, calculateTax en la biblioteca se convierte en computeOrderTax en el módulo de pedidos).", "question": "¿Qué estrategia de exploración identificará de forma más confiable a todos los llamadores?", "options": [{"letter": "A", "text": "Leer la biblioteca y los módulos envoltorio para identificar todos los nombres expuestos de la función, y luego hacer Grep de cada nombre en todo el código base.", "correct": true, "explanation": "Correcto. Hay que enumerar todos los nombres bajo los que se expone la función; de lo contrario, los envoltorios renombrados ocultan llamadores. Lee los módulos relevantes, reúne todos los alias y luego haz grep de cada uno."}, {"letter": "B", "text": "Usar Grep para encontrar todos los archivos que importan de la biblioteca o de los módulos envoltorio, y luego leer cada archivo para comprobar si usa la función.", "correct": false, "explanation": "Omite importaciones dinámicas, reexportaciones y cadenas de llamadas indirectas. Además, escala mal."}, {"letter": "C", "text": "Usar Grep para buscar el nombre original de la función en todo el código base.", "correct": false, "explanation": "El nombre original no aparecerá en ningún lugar donde un envoltorio lo haya renombrado; te perderías una clase importante de llamadores."}, {"letter": "D", "text": "Buscar el nombre de la función en la documentación del proyecto para entender los patrones de uso previstos y navegar a los puntos de integración documentados.", "correct": false, "explanation": "La documentación es incompleta y a menudo está desactualizada. No puedes eliminar una función de forma segura basándote en evidencia a nivel de documentación. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m27", "source": "mock", "domain": 2, "scenario": null, "situation": "Después de agregar un servidor MCP con herramientas especializadas de refactorización de código (`extract_function`, `rename_variable`, `inline_function`), notas que el agente sigue usando manipulación básica de texto mediante comandos Write y sed de Bash para las tareas de refactorización. El servidor MCP está conectado y saludable. Al examinar la configuración, encuentras que cada herramienta MCP tiene una descripción mínima como \"`extract_function`: extrae una función del código.\"", "question": "¿Cuál es la forma más efectiva de mejorar la adopción de las herramientas de refactorización MCP?", "options": [{"letter": "A", "text": "Implementar un clasificador de solicitudes que detecte la intención de refactorizar y enrute automáticamente esas solicitudes al servidor MCP antes de que el agente las procese.", "correct": false, "explanation": "Un preclasificador es un sistema aparte que mantener y puede enrutar mal. El arreglo más barato es hacer que las descripciones de las herramientas sean lo bastante sólidas para que el agente las elija por su cuenta."}, {"letter": "B", "text": "Eliminar la herramienta Write de la configuración del agente durante las sesiones de refactorización para que deba usar las herramientas MCP para las modificaciones de código.", "correct": false, "explanation": "Despojar herramientas generales fuerza la adopción por sustracción y rompe casos de uso legítimos de Write."}, {"letter": "C", "text": "Aceptar esto como comportamiento esperado, dado que herramientas más simples como sed son más predecibles que las herramientas de refactorización especializadas.", "correct": false, "explanation": "Capitular anula el propósito de integrar las herramientas de refactorización. La integración está bien; el problema son las descripciones."}, {"letter": "D", "text": "Mejorar las descripciones de las herramientas MCP para explicar cuándo es preferible cada herramienta frente a la manipulación de texto y aclarar las entradas y salidas esperadas.", "correct": true, "explanation": "Correcto. La selección de herramientas se guía por las descripciones que ve Claude. Cuando las herramientas MCP dicen 'extrae una función del código' y Write/sed vienen con documentación rica, Claude elige Write/sed. Refuerza las descripciones. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m29", "source": "mock", "domain": 2, "scenario": null, "situation": "Tu agente necesita insertar una nueva función auxiliar en medio de un módulo de utilidades de 150 líneas, entre dos funciones existentes. La herramienta Edit falla porque su parámetro `old_string` no puede encontrar texto único con el cual coincidir: el archivo tiene docstrings, nombres de variables y patrones estructurales repetitivos.", "question": "¿Cuál es la forma más confiable de completar esta inserción?", "options": [{"letter": "A", "text": "Usar Edit con un `old_string` extremadamente largo que capture más de 30 líneas de contexto para garantizar la unicidad", "correct": false, "explanation": "Las cadenas de coincidencia largas y frágiles fallan con frecuencia debido a espacios en blanco o ediciones menores y producen errores confusos."}, {"letter": "B", "text": "Usar el parámetro `replace_all` de Edit para apuntar a un patrón común e incrustar la nueva función en el texto de reemplazo", "correct": false, "explanation": "`replace_all` mutaría todas las ocurrencias del patrón, corrompiendo todo el archivo."}, {"letter": "C", "text": "Usar Bash para agregar la definición de la función al final del archivo usando sintaxis heredoc", "correct": false, "explanation": "Agregar al final coloca la función en el lugar equivocado. El requisito es insertarla entre dos funciones existentes."}, {"letter": "D", "text": "Usar Read para cargar el archivo, agregar la función en la ubicación apropiada y luego usar Write para escribir el archivo actualizado", "correct": true, "explanation": "Correcto. Cuando el contrato de coincidencia única de Edit no puede satisfacerse en un archivo repetitivo, recurre a Read → modificar en memoria en la línea prevista → escribir el archivo completo de vuelta con Write. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m38", "source": "mock", "domain": 2, "scenario": null, "situation": "Los registros de producción revelan un manejo de errores inconsistente: cuando `lookup_order` falla, el agente a veces reintenta más de 5 veces (un desperdicio cuando el ID del pedido no existe), a veces escala de inmediato (prematuro ante problemas temporales de red) y a veces pide aclaraciones a los usuarios (inapropiado cuando el problema es un error de permisos del backend). La investigación muestra que tu herramienta MCP devuelve respuestas de error uniformes: {\"isError\": true, \"content\": [{\"type\": \"text\", \"text\": \"Operation failed\"}]}. El agente no puede distinguir entre los tipos de error.", "question": "¿Cuál es la mejora más efectiva?", "options": [{"letter": "A", "text": "Enriquecer las respuestas de error con metadatos estructurados: incluir errorCategory (transient/validation/permission), un booleano isRetryable y una descripción de qué causó la falla.", "correct": true, "explanation": "Correcto. Dale al agente la información que necesita para tomar la decisión correcta: categoría, capacidad de reintento y una causa legible. Eso reemplaza la adivinanza por una política determinista."}, {"letter": "B", "text": "Crear una herramienta MCP `analyze_error` que el agente llame tras cualquier falla para determinar la categoría del error y la acción recomendada.", "correct": false, "explanation": "Añade un viaje de ida y vuelta adicional para algo que la herramienta original ya sabe. Pon los metadatos en la respuesta original."}, {"letter": "C", "text": "Implementar lógica de reintento con retroceso exponencial en tu servidor MCP para todos los errores, devolviendo al agente solo después de agotar los reintentos.", "correct": false, "explanation": "Los reintentos indiscriminados perjudican ante errores permanentes (pedido no encontrado) y ocultan distinciones útiles al agente."}, {"letter": "D", "text": "Agregar ejemplos few-shot al prompt del sistema que demuestren cómo interpretar los patrones de los mensajes de error y seleccionar respuestas apropiadas para cada uno.", "correct": false, "explanation": "Si la herramienta devuelve \"Operation failed\" ante cada falla, ningún número de few-shots puede extraer información de categoría que no está ahí. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m43", "source": "mock", "domain": 2, "scenario": null, "situation": "Al implementar tu herramienta MCP `lookup_order`, el backend a veces devuelve errores (por ejemplo, \"Order not found\" o fallas temporales de la base de datos).", "question": "¿Cuál es el patrón correcto para comunicar estos errores de vuelta al agente?", "options": [{"letter": "A", "text": "Registrar el error del lado del servidor y devolver un resultado vacío para evitar confundir al modelo.", "correct": false, "explanation": "Devolver éxitos vacíos hace que el agente piense que no existen datos, en lugar de que algo salió mal: una confusión distinta y peor."}, {"letter": "B", "text": "Devolver el mensaje de error en el contenido del resultado de la herramienta con la bandera isError establecida en true.", "correct": true, "explanation": "Correcto. El patrón diseñado de MCP: pon el texto del error en el campo de contenido y marca isError=true. Claude ve tanto la bandera de falla como un mensaje legible sobre el cual razonar."}, {"letter": "C", "text": "Lanzar una excepción desde el manejador de la herramienta para que el framework del agente pueda capturarla y registrarla.", "correct": false, "explanation": "Las excepciones no capturadas rompen el protocolo de la herramienta y no le dan al modelo nada con qué razonar."}, {"letter": "D", "text": "Devolver una respuesta exitosa con un campo \"status\" que indique el tipo de error.", "correct": false, "explanation": "Los campos \"status\" ad hoc varían entre herramientas y el modelo no tiene una forma estándar de interpretarlos. isError es el estándar. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m44", "source": "mock", "domain": 2, "scenario": null, "situation": "Tu herramienta `process_refund` devuelve dos tipos de errores: errores técnicos (\"503 Service Unavailable\", \"Connection timeout\") que son transitorios (5% de las llamadas), y errores de negocio (\"Order exceeds 30-day return window\", \"Item already refunded\") que son permanentes (12% de las llamadas). El monitoreo muestra que el agente desperdicia entre 3 y 4 turnos reintentando errores de negocio que nunca pueden tener éxito. Actualmente, ambos tipos de error solo devuelven un mensaje de texto plano a Claude.", "question": "¿Cuál es la forma más efectiva de reducir los reintentos desperdiciados y a la vez mejorar la calidad de la respuesta hacia el cliente?", "options": [{"letter": "A", "text": "Devolver respuestas de error estructuradas con retryable: false para los errores de negocio y una explicación amigable para el cliente que Claude pueda usar.", "correct": true, "explanation": "Correcto. Una bandera retryable le dice a Claude de forma determinista \"no reintentar\", y un mensaje listo y amigable para el cliente mejora la respuesta saliente. Resuelve ambos problemas a la vez."}, {"letter": "B", "text": "Agregar ejemplos few-shot que muestren cómo distinguir errores reintentables de no reintentables analizando el texto del mensaje de error.", "correct": false, "explanation": "Depender de que el modelo analice cadenas de error como texto es frágil, y es exactamente la inestabilidad que ves hoy."}, {"letter": "C", "text": "Agregar una herramienta `check_refund_eligibility` que deba llamarse antes de `process_refund` para prevenir violaciones de reglas de negocio.", "correct": false, "explanation": "Útil en principio, pero añade un viaje de ida y vuelta a cada reembolso para protegerse del 12% de los casos, y no ayuda cuando `process_refund` aún falla por otras razones de negocio."}, {"letter": "D", "text": "Implementar lógica de reintento automático a nivel de la herramienta solo para los errores técnicos, pasando los errores de negocio a Claude sin reintentos.", "correct": false, "explanation": "Ocultar los reintentos transitorios dentro de la herramienta puede enmascarar la latencia y saca al modelo del circuito en las decisiones de recuperación. Los errores de negocio también siguen llegando como una cadena plana, por lo que la respuesta hacia el cliente no mejora. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m55", "source": "mock", "domain": 2, "scenario": null, "situation": "Tu pipeline usa una herramienta llamada `extract_metadata` con un esquema JSON para los detalles de los artículos. También has definido herramientas `lookup_citations` y `verify_doi` para enriquecimiento. Durante las pruebas, notas que cuando los usuarios incluyen solicitudes como \"extract the metadata and tell me how cited it is\", Claude a veces llama primero a `lookup_citations`, que falla porque necesita el DOI que `extract_metadata` proporcionaría.", "question": "¿Cuál es la forma más efectiva de asegurar que la extracción de metadatos estructurados ocurra primero?", "options": [{"letter": "A", "text": "Configurar `tool_choice` en \"any\" para que Claude deba usar una herramienta, combinado con instrucciones en el prompt del sistema que prioricen `extract_metadata`.", "correct": false, "explanation": "'any' fuerza una llamada a herramienta pero no fuerza la correcta. Aun verías a `lookup_citations` elegida primero."}, {"letter": "B", "text": "Configurar `tool_choice` en \"auto\" y reordenar las definiciones de herramientas para que `extract_metadata` aparezca primera en el array de herramientas, ya que Claude prioriza las herramientas listadas antes.", "correct": false, "explanation": "No hay una preferencia de orden documentada en la que confiar; esto asume un comportamiento que no es contractual."}, {"letter": "C", "text": "Configurar `tool_choice` en {\"type\": \"tool\", \"name\": \"`extract_metadata`\"} y procesar las solicitudes de enriquecimiento en turnos posteriores tras recibir los metadatos extraídos.", "correct": true, "explanation": "Correcto. `tool_choice`=herramienta-específica fuerza de forma determinista a `extract_metadata` en el primer turno. Luego devuelves el control a 'auto' para que el modelo use el enriquecimiento de citas/DOI con los metadatos en contexto."}, {"letter": "D", "text": "Configurar `tool_choice` en {\"type\": \"tool\", \"name\": \"`extract_metadata`\"} para cada llamada a la API en el pipeline, asegurando que Claude siempre extraiga metadatos antes de que pueda ocurrir cualquier enriquecimiento.", "correct": false, "explanation": "Fijar `extract_metadata` en cada llamada impide que las herramientas de enriquecimiento se usen alguna vez. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "g16", "source": "guide", "domain": 3, "scenario": "Claude Code para Integración Continua", "situation": "Tu pipeline de CI ejecuta el CLI de Claude Code (en modo `--print`) usando CLAUDE.md para proporcionar contexto del proyecto a la revisión de código, y los desarrolladores generalmente encuentran las revisiones sustantivas. Sin embargo, reportan que integrar los hallazgos al flujo es difícil—Claude produce párrafos narrativos que deben copiarse manualmente a los comentarios del PR. El equipo quiere publicar automáticamente cada hallazgo como un comentario inline separado del PR en el lugar relevante del código, lo que requiere datos estructurados con ruta de archivo, número de línea, nivel de severidad y corrección sugerida. ¿Qué enfoque es más efectivo?", "question": "¿Cuál es el enfoque más efectivo?", "options": [{"letter": "A", "text": "Agregar una sección \"Output Format for Review\" a CLAUDE.md con ejemplos de hallazgos estructurados para que Claude aprenda el formato esperado del contexto del proyecto.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Usar las flags del CLI `--output-format json` y `--json-schema` para imponer hallazgos estructurados, luego parsear la salida para publicar comentarios inline a través de la API de GitHub.", "correct": true, "explanation": "Usar `--output-format json` con `--json-schema` impone salida estructurada a nivel del CLI, garantizando JSON bien formado con los campos requeridos (ruta de archivo, número de línea, severidad, corrección sugerida) que pueden parsearse y publicarse confiablemente como comentarios inline del PR a través de la API de GitHub. Aprovecha capacidades incorporadas del CLI diseñadas específicamente para salida estructurada."}, {"letter": "C", "text": "Incluir instrucciones de formato explícitas en el prompt de revisión que requieran que cada hallazgo siga una plantilla parseable como `[FILE:ruta] [LINE:n] [SEVERITY:nivel] ...`.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Mantener el formato de revisión narrativo pero agregar un paso de resumición que use Claude para generar un resumen JSON estructurado de los hallazgos.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g26", "source": "guide", "domain": 3, "scenario": "Claude Code para Integración Continua", "situation": "Tu script de pipeline ejecuta `claude \"Analyze this pull request for security issues\"`, pero el job se cuelga indefinidamente. Los registros muestran que Claude Code está esperando entrada interactiva. ¿Cuál es el enfoque correcto para ejecutar Claude Code en un pipeline automatizado?", "question": "¿Cuál es el enfoque correcto?", "options": [{"letter": "A", "text": "Agregar una flag `--batch`: `claude --batch \"Analyze this pull request for security issues\"`.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Agregar la flag `-p`: `claude -p \"Analyze this pull request for security issues\"`.", "correct": true, "explanation": "La flag `-p` (o `--print`) es la forma documentada de ejecutar Claude Code de forma no interactiva. Procesa el prompt, imprime el resultado a stdout y sale sin esperar entrada del usuario—ideal para pipelines de CI/CD."}, {"letter": "C", "text": "Redirigir stdin desde `/dev/null`: `claude \"Analyze this pull request for security issues\" \u003c /dev/null`.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Establecer la variable de entorno `CLAUDE_HEADLESS=true` antes de ejecutar el comando.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g32", "source": "guide", "domain": 3, "scenario": "Generación de código con Claude Code", "situation": "Necesitas agregar Slack como un nuevo canal de notificación. La base de código existente tiene patrones claros y establecidos para canales de email, SMS y push. Sin embargo, la API de Slack ofrece enfoques de integración fundamentalmente diferentes—webhooks entrantes (simple, unidireccional), bot tokens (soportan confirmación de entrega y control programático) o Slack Apps (eventos bidireccionales, requiere aprobación del workspace). Tu tarea dice \"agregar soporte para Slack\" sin especificar el método de integración ni requerir características avanzadas como seguimiento de entrega.", "question": "¿Cómo deberías abordar esta tarea?", "options": [{"letter": "A", "text": "Comenzar en modo de ejecución directa usando webhooks entrantes para coincidir con el patrón existente de notificación unidireccional.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Cambiar a modo de planificación para explorar opciones de integración e implicaciones arquitectónicas, luego presentar una recomendación antes de implementar.", "correct": true, "explanation": "La integración con Slack tiene múltiples enfoques válidos con implicaciones arquitectónicas significativamente diferentes, y los requisitos son ambiguos. El modo de planificación te permite evaluar trade-offs entre webhooks, bot tokens y Slack Apps y alinearte sobre un enfoque antes de la implementación."}, {"letter": "C", "text": "Comenzar en modo de ejecución directa esbozando una clase de canal Slack usando los patrones existentes, posponiendo la decisión del método de integración.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Comenzar en modo de ejecución directa usando un enfoque de bot token para asegurar que sea posible la confirmación de entrega.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g33", "source": "guide", "domain": 3, "scenario": "Generación de código con Claude Code", "situation": "Tu archivo CLAUDE.md ha crecido a más de 400 líneas conteniendo estándares de codificación, convenciones de pruebas, una checklist detallada de revisión de PRs, instrucciones de despliegue y procedimientos de migración de base de datos. Quieres que Claude siga siempre los estándares de codificación y convenciones de pruebas, pero que aplique la guía de revisión de PR, despliegue y migración solo cuando esté haciendo esas tareas.", "question": "¿Qué enfoque de reestructuración es más efectivo?", "options": [{"letter": "A", "text": "Mover toda la guía a archivos Skills separados organizados por tipo de flujo, dejando solo una breve descripción del proyecto en CLAUDE.md.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Mantener todo en CLAUDE.md pero usar sintaxis `@import` para organizar en archivos mantenidos por separado por categoría.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Dividir CLAUDE.md en archivos bajo `.claude/rules/` con patrones glob ligados a rutas para que cada regla cargue solo para los tipos de archivo relevantes.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Mantener los estándares universales en CLAUDE.md y crear Skills para guía específica de flujo (revisión de PR, despliegue, migraciones) con palabras clave de activación.", "correct": true, "explanation": "El contenido de CLAUDE.md se carga en cada sesión, asegurando que los estándares de codificación y las convenciones de pruebas siempre apliquen, mientras que las Skills se invocan bajo demanda cuando Claude detecta palabras clave de activación—ideal para guía específica de flujo como revisión de PR, despliegue y migraciones."}], "correct": "D"}, {"id": "g34", "source": "guide", "domain": 3, "scenario": "Generación de código con Claude Code", "situation": "Estás encargado de reestructurar la aplicación monolítica de tu equipo en microservicios. Esto impacta cambios en docenas de archivos y requiere decisiones sobre límites de servicio y dependencias entre módulos.", "question": "¿Qué enfoque deberías elegir?", "options": [{"letter": "A", "text": "Cambiar a modo de planificación para explorar la base de código, entender dependencias y diseñar el enfoque de implementación antes de hacer cambios.", "correct": true, "explanation": "El modo de planificación es la estrategia correcta para reestructuración arquitectónica compleja como dividir un monolito: permite exploración segura y decisiones informadas sobre límites antes de comprometerse a cambios potencialmente costosos en muchos archivos."}, {"letter": "B", "text": "Comenzar en modo de ejecución directa y cambiar a planificación solo después de encontrar complejidad inesperada durante la implementación.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Comenzar en modo de ejecución directa y hacer cambios incrementales, dejando que la implementación revele los límites naturales de servicio.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Usar ejecución directa con instrucciones detalladas previas que especifiquen la estructura de cada servicio.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g35", "source": "guide", "domain": 3, "scenario": "Generación de código con Claude Code", "situation": "Tu equipo creó un skill `/analyze-codebase` que realiza análisis profundo de código—escaneo de dependencias, conteos de cobertura de pruebas y métricas de calidad de código. Después de ejecutar el comando, los miembros del equipo reportan que Claude se vuelve menos receptivo en la sesión y pierde el contexto de la tarea original.", "question": "¿Cómo lo corriges más efectivamente manteniendo capacidades completas de análisis?", "options": [{"letter": "A", "text": "Agregar `context: fork` en el frontmatter del skill para ejecutar el análisis en un contexto de subagente aislado.", "correct": true, "explanation": "`context: fork` ejecuta el análisis en un contexto de subagente aislado para que la salida grande no contamine la ventana de contexto de la sesión principal y Claude no pierda el rastro de la tarea original. Preserva la capacidad completa de análisis manteniendo la sesión principal receptiva."}, {"letter": "B", "text": "Agregar `model: haiku` en el frontmatter para usar un modelo más rápido y económico para el análisis.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Dividir el skill en tres skills más pequeños, cada uno produciendo menos salida.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Agregar instrucciones al skill para comprimir todos los resultados en un resumen corto antes de mostrarlos.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g36", "source": "guide", "domain": 3, "scenario": "Generación de código con Claude Code", "situation": "Tu equipo usa un skill `/commit` en `.claude/skills/commit/SKILL.md`. Un desarrollador quiere personalizarlo para su flujo personal (formato de mensaje de commit diferente, verificaciones extra) sin afectar a sus compañeros.", "question": "¿Qué recomiendas?", "options": [{"letter": "A", "text": "Crear una versión personal bajo `~/.claude/skills/` con un nombre diferente, por ejemplo `/my-commit`.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Agregar lógica condicional basada en nombre de usuario en el frontmatter del skill del proyecto.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Crear una versión personal en `~/.claude/skills/commit/SKILL.md` con el mismo nombre.", "correct": true, "explanation": "Los skills personales tienen precedencia sobre los skills del proyecto con el mismo nombre. Un skill personal en `~/.claude/skills/commit/SKILL.md` sobreescribirá el skill del proyecto, permitiendo al desarrollador personalizar su flujo mientras mantiene el nombre familiar `/commit` para uso personal. Este enfoque es mejor que la opción A porque preserva el nombre del comando original, mejorando el flujo del desarrollador sin afectar a los compañeros."}, {"letter": "D", "text": "Establecer `override: true` en el frontmatter del skill personal para priorizarlo sobre la versión del proyecto.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g37", "source": "guide", "domain": 3, "scenario": "Generación de código con Claude Code", "situation": "Tu equipo ha usado Claude Code durante meses. Recientemente, tres desarrolladores reportan que Claude sigue la guía \"siempre incluir manejo de errores exhaustivo\", pero un cuarto desarrollador que acaba de unirse dice que Claude no la sigue. Los cuatro trabajan en el mismo repo y tienen código actualizado.", "question": "¿Cuál es la causa más probable y la corrección?", "options": [{"letter": "A", "text": "La guía vive en los archivos `~/.claude/CLAUDE.md` a nivel de usuario de los desarrolladores originales, no en el `.claude/CLAUDE.md` del proyecto. Mover la instrucción al archivo a nivel de proyecto para que todos los miembros del equipo la reciban.", "correct": true, "explanation": "Si la guía se agregó solo a las configuraciones a nivel de usuario de los desarrolladores originales y no al `.claude/CLAUDE.md` a nivel de proyecto, los nuevos miembros del equipo no la recibirán. Moverla a la configuración a nivel de proyecto asegura que todos los miembros del equipo actuales y futuros reciban automáticamente la guía."}, {"letter": "B", "text": "El `~/.claude/CLAUDE.md` del nuevo desarrollador contiene instrucciones conflictivas que sobrescriben la configuración del proyecto; debería eliminar la sección conflictiva.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Claude Code aprende preferencias por usuario con el tiempo; el nuevo desarrollador debe repetir el requisito hasta que Claude lo \"recuerde\".", "correct": false, "explanation": ""}, {"letter": "D", "text": "Claude Code cachea CLAUDE.md después de la primera lectura; los desarrolladores originales usan versiones cacheadas. Todos deberían limpiar el caché de Claude Code.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g38", "source": "guide", "domain": 3, "scenario": "Generación de código con Claude Code", "situation": "Encuentras que incluir 2–3 ejemplos completos de implementación de endpoints como contexto mejora significativamente la consistencia al generar nuevos endpoints de API. Sin embargo, este contexto solo es útil al crear nuevos endpoints—no al depurar, revisar código u otros trabajos en el directorio API.", "question": "¿Qué enfoque de configuración es más efectivo?", "options": [{"letter": "A", "text": "Agregar ejemplos de endpoints y documentación de patrones al CLAUDE.md del proyecto para que estén siempre disponibles.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Referenciar manualmente los ejemplos de endpoints en cada solicitud de generación copiando el código al prompt.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Configurar reglas específicas por ruta en `.claude/rules/api/` que incluyan ejemplos de endpoints y se activen al trabajar en el directorio API.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Crear un skill que referencie los ejemplos de endpoints y contenga instrucciones de seguimiento de patrones, invocado bajo demanda mediante un comando slash.", "correct": true, "explanation": "Un skill invocado bajo demanda carga el contexto de ejemplos solo al generar nuevos endpoints, no durante tareas no relacionadas como depuración o revisión. Esto mantiene el contexto principal limpio mientras preserva la generación de alta calidad cuando se necesita."}
