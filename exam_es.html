horas que contengan los documentos de esa ventana", "correct": false, "explanation": "En el peor caso un documento espera 6 horas para ser agrupado y luego hasta 24 horas para procesarse = 30 horas exactas. Sin margen de seguridad para un objetivo de confiabilidad del 99.9%."}, {"letter": "B", "text": "Enviar un único lote al final del día que contenga todos los documentos de ese día", "correct": false, "explanation": "Un documento que llega justo después del inicio de la mañana espera todo el día para ser agrupado más hasta 24 horas para procesarse: muy por encima de 30 horas."}, {"letter": "C", "text": "Enviar lotes cada 4 horas que contengan los documentos de esa ventana", "correct": true, "explanation": "Correcto. Espera máxima de 4 horas + SLO de batch de hasta 24 horas = 28 horas en el peor caso, dejando un colchón de 2 horas bajo el SLA de 30 horas para absorber la variabilidad del batch y alcanzar el 99.9%."}, {"letter": "D", "text": "Usar la API en tiempo real para todos los documentos en lugar del procesamiento por lotes", "correct": false, "explanation": "Cumple el SLA trivialmente pero descarta el ahorro de costos del 50% que la pregunta te pide capturar. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m59", "source": "mock", "domain": 4, "scenario": null, "situation": "Tras el despliegue, descubres que el 12% de las extracciones contiene errores semánticos que pasan la validación del esquema JSON (por ejemplo, una duración como \"30 minutes\" colocada incorrectamente en un campo de cantidad de ingrediente). Los revisores humanos tienen capacidad para revisar solo el 20% de las extracciones.", "question": "¿Qué enfoque asigna de forma más efectiva la atención de los revisores?", "options": [{"letter": "A", "text": "Hacer que el modelo produzca puntajes de confianza a nivel de campo, y luego calibrar los umbrales de revisión usando un conjunto de validación etiquetado.", "correct": true, "explanation": "Correcto. La confianza a nivel de campo te permite enrutar a humanos el 20% de baja confianza, que es donde se concentra el 12% de errores semánticos. La calibración hace que la elección del umbral se base en datos."}, {"letter": "B", "text": "Muestrear aleatoriamente el 20% de las extracciones para revisión, usando las correcciones para rastrear la precisión e identificar patrones de error.", "correct": false, "explanation": "Excelente para medición, pobre para cobertura: el muestreo aleatorio solo atrapa el 20% del 12% de errores (~2.4% del total). El enrutamiento basado en confianza encuentra muchos más."}, {"letter": "C", "text": "Priorizar la revisión de todas las extracciones donde los campos obligatorios estén vacíos o explícitamente marcados como no encontrados.", "correct": false, "explanation": "Los campos vacíos son un modo de error estrecho. El problema del 12% son valores erróneos en campos poblados, que este filtro pasa por alto."}, {"letter": "D", "text": "Revisar todas las extracciones de documentos con anomalías de formato, como diseños inusuales o tipos de contenido mixtos.", "correct": false, "explanation": "Una heurística útil, pero la anomalía de formato no predice de forma confiable dónde se confundieron los campos entre sí. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "g13", "source": "guide", "domain": 5, "scenario": "Sistema de investigación multiagente", "situation": "El monitoreo de producción muestra calidad de síntesis inconsistente. Cuando los resultados agregados son ~75K tokens, el agente de síntesis cita confiablemente información de los primeros 15K tokens (titulares/fragmentos de búsqueda web) y los últimos 10K tokens (conclusiones del análisis de documentos), pero a menudo se pierde hallazgos críticos en los 50K tokens del medio—incluso cuando responden directamente a la pregunta de investigación. ¿Cómo deberías reestructurar la entrada agregada?", "question": "¿Cómo deberías reestructurar la entrada agregada?", "options": [{"letter": "A", "text": "Resumir todas las salidas de los subagentes a menos de 20K tokens antes de la agregación para mantener el contenido dentro del rango confiable de procesamiento del modelo.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Transmitir los resultados de los subagentes al agente de síntesis incrementalmente, procesando primero los resultados de búsqueda web por completo, luego agregando los resultados del análisis de documentos.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Colocar un resumen de hallazgos clave al inicio de la entrada agregada y organizar los resultados detallados con encabezados de sección explícitos para una navegación más fácil.", "correct": true, "explanation": "Poner un resumen de hallazgos clave al inicio aprovecha los efectos de primacía para que la información crítica esté en la posición procesada más confiablemente. Agregar encabezados de sección explícitos en todo el documento ayuda al modelo a navegar y atender el contenido del medio, mitigando directamente el fenómeno \"perdido en el medio\"."}, {"letter": "D", "text": "Implementar rotación que alterne qué resultados de subagente aparecen primero en distintas tareas de investigación para asegurar que ambas fuentes obtengan posicionamiento superior equitativo con el tiempo.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g14", "source": "guide", "domain": 5, "scenario": "Sistema de investigación multiagente", "situation": "En pruebas, la salida combinada del agente de búsqueda web (85K tokens incluyendo contenido de página) y del agente de análisis de documentos (70K tokens incluyendo cadenas de pensamiento) totaliza 155K tokens, pero el agente de síntesis funciona mejor con entradas por debajo de 50K tokens. ¿Qué solución es más efectiva?", "question": "¿Qué solución es más efectiva?", "options": [{"letter": "A", "text": "Modificar los agentes previos para que devuelvan datos estructurados (hechos clave, citas, puntuaciones de relevancia) en lugar de contenido y razonamiento verbosos.", "correct": true, "explanation": "Modificar los agentes previos para que devuelvan datos estructurados corrige la causa raíz reduciendo el volumen de tokens en la fuente mientras preserva la información esencial. Evita pasar contenido de página voluminoso y trazas de razonamiento que inflan tokens sin mejorar el paso de síntesis."}, {"letter": "B", "text": "Agregar un agente intermedio de resumición que condense los hallazgos antes de pasarlos a la síntesis.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Hacer que el agente de síntesis procese los hallazgos en lotes secuenciales, manteniendo el estado entre llamadas.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Almacenar los hallazgos en una base de datos vectorial y dar al agente de síntesis herramientas de búsqueda para consultar durante su trabajo.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g45", "source": "guide", "domain": 5, "scenario": "Generación de código con Claude Code", "situation": "Estás agregando wrappers de manejo de errores alrededor de llamadas a APIs externas en una base de código de 120 archivos. El trabajo tiene tres fases: (1) descubrir todos los sitios de llamada y patrones, (2) diseñar colaborativamente el enfoque de manejo de errores, y (3) implementar wrappers de forma consistente. En la Fase 1, Claude genera salida grande listando cientos de sitios de llamada con contexto, llenando rápidamente la ventana de contexto antes de que termine el descubrimiento.", "question": "¿Qué enfoque es más efectivo para completar la tarea manteniendo la consistencia de implementación?", "options": [{"letter": "A", "text": "Usar un subagente Explore para la Fase 1 para aislar la salida verbosa de descubrimiento y devolver un resumen, luego continuar las Fases 2–3 en la conversación principal.", "correct": true, "explanation": "Un subagente Explore aísla la salida verbosa de descubrimiento en un contexto separado y devuelve solo un resumen conciso a la conversación principal. Esto preserva la ventana de contexto principal para las fases de diseño colaborativo e implementación consistente donde el contexto retenido es más valioso."}, {"letter": "B", "text": "Hacer todas las fases en la conversación principal, usando periódicamente `/compact` para reducir el uso de contexto mientras se avanza por los archivos.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Cambiar a modo headless con `--continue`, pasando resúmenes de contexto explícitos entre llamadas en lote para mantener la continuidad.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Definir el patrón de manejo de errores en CLAUDE.md, luego procesar archivos en lotes a través de múltiples sesiones confiando en el archivo de memoria compartida para la consistencia.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g54", "source": "guide", "domain": 5, "scenario": "Agente de soporte al cliente", "situation": "Los registros de producción muestran un patrón: los clientes referencian montos específicos (por ejemplo, \"el descuento del 15% que mencioné\"), pero el agente responde con valores incorrectos. La investigación muestra que estos detalles fueron mencionados 20+ turnos atrás y condensados en resúmenes vagos como \"se discutieron precios promocionales\". ¿Qué corrección es más efectiva?", "question": "¿Qué corrección es más efectiva?", "options": [{"letter": "A", "text": "Aumentar el umbral de resumición del 70% al 85% para que las conversaciones tengan más espacio antes de que se dispare la resumición.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Almacenar el historial completo de conversación en almacenamiento externo e implementar recuperación cuando el agente detecta referencias como \"como mencioné\".", "correct": false, "explanation": ""}, {"letter": "C", "text": "Extraer hechos transaccionales (montos, fechas, números de pedido) en un bloque persistente de \"hechos del caso\" incluido en cada prompt fuera del historial resumido.", "correct": true, "explanation": "La resumición pierde inherentemente detalles precisos. Extraer hechos transaccionales en un bloque estructurado de \"hechos del caso\" fuera del historial resumido preserva información crítica para que esté disponible confiablemente en cada prompt independientemente de cuántos turnos hayan sido resumidos."}, {"letter": "D", "text": "Revisar el prompt de resumición para preservar explícitamente todos los números, porcentajes, fechas y expectativas declaradas por el cliente literalmente.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g63", "source": "guide", "domain": 5, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "En varios turnos discutiendo estrategia de inversión, un usuario declaró \"Tengo una tolerancia al riesgo muy baja\" y luego \"Quiero maximizar mis retornos.\" Ahora pregunta: \"¿En qué debería invertir?\"", "question": "¿Qué enfoque garantiza mejor que la recomendación se alinee con la prioridad real del usuario?", "options": [{"letter": "A", "text": "Sacar a la luz la contradicción y pedir al usuario que aclare qué importa más.", "correct": true, "explanation": "Cuando las preferencias del usuario se contradicen directamente, sacar a la luz el conflicto y pedir aclaración es la única forma de garantizar que la recomendación se alinee con la verdadera intención del usuario. Maximizar retornos y tolerancia al riesgo baja son objetivos fundamentalmente incompatibles que requieren una decisión humana."}, {"letter": "B", "text": "Proporcionar recomendaciones separadas para ambos escenarios.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Proceder con la preferencia declarada más recientemente.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Recomendar una cartera equilibrada sin abordar el conflicto.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g64", "source": "guide", "domain": 5, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "Los usuarios refinan preferencias de playlist a lo largo de múltiples turnos. Dos mensajes después de que un usuario dijo \"Me encanta el jazz,\" Claude pregunta \"¿Qué géneros disfrutas?\"", "question": "¿Cuál es la causa más probable?", "options": [{"letter": "A", "text": "Claude requiere una conexión a base de datos vectorial para mantener memoria de conversación.", "correct": false, "explanation": ""}, {"letter": "B", "text": "La ventana de contexto del modelo ha sido excedida.", "correct": false, "explanation": ""}, {"letter": "C", "text": "La API de Claude requiere un parámetro `session_id`.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Tu aplicación no está incluyendo mensajes anteriores en el array `messages`.", "correct": true, "explanation": "Claude no tiene memoria del lado del servidor—cada llamada a la API es sin estado. Sin incluir el historial completo de conversación en el array `messages` de cada solicitud, Claude no tiene conocimiento de turnos anteriores. Las bases de datos vectoriales (A) y `session_id` (C) no son parte de la arquitectura de Claude; el desbordamiento de ventana de contexto (B) es imposible para intercambios de dos mensajes."}], "correct": "D"}, {"id": "g65", "source": "guide", "domain": 5, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "Después de una sesión de cocina de 40 minutos, la conversación alcanza 78,000 tokens. El historial incluye alergias, escalado de recetas, términos de cocina aclarados y discusión general. Debes reducir tokens preservando información importante.", "question": "¿Qué enfoque equilibra mejor la preservación con la reducción de tokens?", "options": [{"letter": "A", "text": "Resumir todo el historial de conversación.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Conservar solo los 20,000 tokens más recientes.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Extraer datos estructurados críticos (alergias, cantidades, preferencias), resumir la discusión general y mantener los intercambios recientes literalmente.", "correct": true, "explanation": "El enfoque híbrido preserva la información de mayor valor al menor costo. Los hechos críticos como alergias y cantidades de recetas se extraen en un bloque estructurado compacto (previniendo la pérdida de precisión que ocurre durante la resumición), la discusión general se resume, y los intercambios recientes se mantienen literalmente para la coherencia conversacional. Las opciones A y B arriesgan perder información dietética crítica; D es excesiva para una sola sesión de cocina."}, {"letter": "D", "text": "Almacenar la conversación completa externamente y recuperar partes relevantes mediante búsqueda semántica.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g66", "source": "guide", "domain": 5, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "Los usuarios reportan que durante conversaciones extendidas el asistente pierde el rastro de temas y preferencias anteriores. Tu implementación actual conserva solo los últimos 25 pares de mensajes.", "question": "¿Cuál es la solución más efectiva?", "options": [{"letter": "A", "text": "Enfoque híbrido: resumir mensajes más antiguos mientras se mantienen los recientes literalmente.", "correct": true, "explanation": "El enfoque híbrido aborda ambas dimensiones del problema: retener contexto reciente exacto (crítico para la coherencia conversacional) mientras se mantiene una representación comprimida de preferencias anteriores. Aumentar la ventana (C) simplemente retrasa el mismo problema. La búsqueda vectorial (B) puede perder contexto importante que no es semánticamente similar a la consulta actual."}, {"letter": "B", "text": "Búsqueda de similitud vectorial sobre el historial completo de conversación.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Aumentar la ventana a 50 pares de mensajes.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Resumir mensajes eliminados en cada turno y anteponer el resumen acumulado.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g67", "source": "guide", "domain": 5, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "Los usuarios reportan que la latencia aumenta y los costos suben cuando las conversaciones superan los 50 turnos.", "question": "¿Cuál es la causa principal?", "options": [{"letter": "A", "text": "Todo el historial de conversación se incluye con cada solicitud a la API.", "correct": true, "explanation": "La API de Claude es completamente sin estado—cada solicitud debe incluir el historial completo de conversación en el array `messages`. A medida que las conversaciones crecen, cada solicitud lleva más tokens, lo que aumenta directamente tanto la latencia de procesamiento como el costo. El modelo no mantiene ningún estado interno entre llamadas (D es falso)."}, {"letter": "B", "text": "El modelo genera respuestas progresivamente más largas.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Las operaciones de base de datos se ralentizan a medida que crece el historial.", "correct": false, "explanation": ""}, {"letter": "D", "text": "El modelo construye un perfil de usuario interno que requiere más procesamiento.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g68", "source": "guide", "domain": 5, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "Después de tres meses de sesiones semanales, el historial de conversación crece a 85,000 tokens. Cuando un usuario pregunta \"¿Qué concluimos sobre el tema del aislamiento?\", el asistente da respuestas genéricas en lugar de referenciar discusiones anteriores.", "question": "¿Cuál es el enfoque más efectivo?", "options": [{"letter": "A", "text": "Truncamiento de ventana deslizante.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Resumición progresiva capturando conclusiones clave.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Embeddings semánticos con recuperación de intercambios relevantes.", "correct": true, "explanation": "La búsqueda semántica sobre el historial de conversación es el único enfoque que escala a tres meses de discusión mientras puede sacar a la luz intercambios relevantes específicos a demanda. El truncamiento deslizante (A) descartaría la mayoría del historial. La resumición progresiva (B) comprime las discusiones en abstracciones que pierden las conclusiones específicas que los usuarios buscan."}, {"letter": "D", "text": "Agregar etiquetas XML estructuradas marcando conclusiones de discusión.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g70", "source": "guide", "domain": 5, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "Tu tutor de IA tiene un prompt del sistema de 2,800 tokens que define metodología de enseñanza y reglas de adaptación. Después de 12 turnos, el asistente comienza a ignorar los niveles de competencia.", "question": "¿Cuál es la corrección más efectiva?", "options": [{"letter": "A", "text": "Inyectar recordatorios cada 4–5 turnos.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Reemplazar reglas verbosas con ejemplos few-shot que demuestren adaptación por nivel de competencia.", "correct": true, "explanation": "Un prompt del sistema de 2,800 tokens con reglas declarativas es vulnerable a la deriva porque las reglas abstractas requieren que el modelo razone sobre ellas en cada turno. Reemplazar reglas verbosas con ejemplos few-shot concretos que demuestran la adaptación correcta por nivel de competencia da al modelo patrones de comportamiento claros para seguir—esto se cumple más confiablemente a lo largo de muchos turnos que las instrucciones abstractas sobre módulos que ya habían explorado.", "question": "¿Cuál es el enfoque más efectivo para abordar esto?", "options": [{"letter": "A", "text": "Hacer que el agente mantenga un archivo de notas (scratchpad) que registre los hallazgos clave, y consultarlo para las preguntas posteriores.", "correct": true, "explanation": "Correcto. Un scratchpad traslada los hallazgos a un almacenamiento duradero que el agente puede releer cuando lo necesite, dándole una 'memoria' estable independiente de qué tan saturada esté la ventana de contexto."}, {"letter": "B", "text": "Cambiar a un nivel de modelo de mayor capacidad para brindar más espacio de ventana de contexto para los datos de exploración acumulados.", "correct": false, "explanation": "Una ventana más grande retrasa el problema, pero no resuelve la degradación de la atención sobre contextos largos y ruidosos."}, {"letter": "C", "text": "Implementar un borrado automático del contexto cada 15 minutos para garantizar que el agente comience con un contexto fresco y no contaminado.", "correct": false, "explanation": "El borrado total descarta hallazgos válidos: exactamente el estado que los ingenieros se quejan de tener que reconstruir."}, {"letter": "D", "text": "Crear resúmenes de todos los archivos fuente antes de comenzar la exploración, cargando en el contexto solo estas representaciones comprimidas.", "correct": false, "explanation": "Los resúmenes previos pierden el detalle que hace útil la exploración de código y a menudo tergiversan los archivos que más le importan al ingeniero. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m20", "source": "mock", "domain": 5, "scenario": null, "situation": "Tu agente ha dedicado 25 minutos a explorar el subsistema de renderizado de un motor de juego: leyendo código de shaders, gestión de búferes y lógica de sincronización de fotogramas. Un ingeniero ahora le pide que entienda cómo se integra el motor de física con el renderizado para las superposiciones de depuración de colisiones. Notas que las respuestas recientes hacen referencia a \"patrones de renderizado típicos\" en lugar de las clases específicas VulkanPipeline y FrameGraph que descubrió antes.", "question": "¿Cuál es el enfoque más efectivo?", "options": [{"letter": "A", "text": "Generar un subagente que explore la física de forma independiente y luego sintetizar manualmente sus hallazgos con el conocimiento de renderizado acumulado en la conversación principal.", "correct": false, "explanation": "La síntesis manual en la conversación principal mete aún más cosas en un contexto que ya se está degradando."}, {"letter": "B", "text": "Continuar en el contexto actual con prompts más dirigidos que hagan referencia a las clases específicas por su nombre.", "correct": false, "explanation": "El agente ya está perdiendo especificidad ('patrones típicos' en lugar de VulkanPipeline). Insistir más sobre el mismo contexto degradado no lo restaura."}, {"letter": "C", "text": "Resumir los hallazgos clave del renderizado y luego generar un subagente para la exploración de la física con ese resumen en su contexto inicial.", "correct": true, "explanation": "Correcto. Condensa lo que has aprendido sobre el renderizado en un resumen compacto, y luego dale a un subagente nuevo ese resumen más la tarea de física: preservas la señal importante y escapas del contexto degradado."}, {"letter": "D", "text": "Usar /clear para reiniciar por completo el contexto y luego empezar de cero la exploración de la física usando las rutas de archivo del CLAUDE.md del proyecto.", "correct": false, "explanation": "/clear borra los hallazgos de renderizado que en realidad necesitas para la pregunta transversal sobre las superposiciones de depuración de colisiones. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m23", "source": "mock", "domain": 5, "scenario": null, "situation": "Un ingeniero le pide al agente que entienda cómo funciona la capa de caché antes de agregar un nuevo disparador de invalidación de caché. Tras las búsquedas iniciales con Grep, el agente ha identificado que la lógica de caché abarca 15 archivos, incluyendo decoradores, middleware y clases de servicio (~8000 líneas en total).", "question": "¿Cuál es el siguiente paso más efectivo para construir comprensión a la vez que se gestionan las restricciones de contexto?", "options": [{"letter": "A", "text": "Usar la herramienta Read para cargar secuencialmente los 15 archivos, construyendo una comprensión completa de toda la implementación de caché.", "correct": false, "explanation": "Cargar 8000 líneas sin estructura inunda el contexto y entierra la lógica de invalidación en código no relacionado."}, {"letter": "B", "text": "Analizar las importaciones y jerarquías de clases para identificar la clase base de caché, leer ese archivo para entender la interfaz y luego rastrear las implementaciones específicas de invalidación.", "correct": true, "explanation": "Correcto. Empieza desde la raíz arquitectónica (la interfaz) y luego navega solo las implementaciones específicas que importan para la invalidación: lectura enfocada, bajo costo de contexto."}, {"letter": "C", "text": "Usar Grep para buscar los patrones \"invalidate\" y \"expire\" en todos los archivos y luego leer únicamente esos rangos de líneas específicos con un contexto circundante mínimo.", "correct": false, "explanation": "La lectura basada solo en palabras clave despoja el contexto de clase/método que te dice qué protege realmente la invalidación."}, {"letter": "D", "text": "Usar Glob para encontrar archivos que coincidan con patrones comunes de caché (cache.py, caching/), priorizar los archivos más grandes leyéndolos primero y luego revisar los archivos más pequeños en busca de vacíos.", "correct": false, "explanation": "El tamaño es un mal indicador de importancia. Desperdiciarías contexto en grandes archivos de utilidades y te perderías los pequeños archivos estratégicos. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m37", "source": "mock", "domain": 5, "scenario": null, "situation": "El agente verifica la identidad del cliente mediante un proceso de varios pasos antes de restablecer contraseñas. Durante las pruebas, notas que después de que el cliente responde la tercera pregunta de verificación, el agente le vuelve a pedir su nombre, como si el intercambio anterior nunca hubiera ocurrido.", "question": "¿Cuál es la causa más probable de este comportamiento?", "options": [{"letter": "A", "text": "La herramienta de verificación está borrando el estado interno del agente después de cada paso de validación exitoso.", "correct": false, "explanation": "Las herramientas no borran el estado del agente; el estado de la conversación vive en el arreglo de mensajes que envías."}, {"letter": "B", "text": "Al prompt le faltan instrucciones que le digan a Claude que recuerde la información a lo largo de múltiples intercambios.", "correct": false, "explanation": "La memoria entre turnos no se logra con una instrucción; proviene de pasar los turnos anteriores en la siguiente solicitud."}, {"letter": "C", "text": "El historial de la conversación no se está pasando en las solicitudes subsecuentes a la API.", "correct": true, "explanation": "Correcto. La API es sin estado. Cada solicitud debe incluir el arreglo completo de mensajes. Si solo envías el último turno, el modelo no tiene memoria de los anteriores: exactamente el síntoma de \"volver a pedir el nombre\"."}, {"letter": "D", "text": "La retención de memoria de Claude está limitada por defecto a dos turnos de conversación, y se requiere configuración explícita para extenderla.", "correct": false, "explanation": "No existe tal límite por defecto. El contexto está acotado por la ventana, y la longitud del historial está bajo tu control. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m42", "source": "mock", "domain": 5, "scenario": null, "situation": "Un cliente plantea tres problemas separados durante una sesión: una consulta de reembolso (turnos 1-15), una pregunta sobre suscripción (turnos 16-30) y una actualización del método de pago (turnos 31-45). En el turno 48, el cliente pregunta \"¿Qué pasó con mi reembolso?\" La conversación se está acercando a los límites de contexto.", "question": "¿Qué estrategia mantiene mejor la capacidad del agente para atender todos los problemas a lo largo de la sesión?", "options": [{"letter": "A", "text": "Extraer y persistir datos estructurados de los problemas (IDs de pedido, montos, estados) en una capa de contexto separada.", "correct": false, "explanation": "Una capa de contexto paralela añade ingeniería y no preserva de forma natural la narrativa conversacional que el cliente espera."}, {"letter": "B", "text": "Confiar en las herramientas MCP para volver a obtener la información relevante bajo demanda cuando el cliente haga referencia a problemas anteriores.", "correct": false, "explanation": "Volver a obtener datos está bien para la frescura, pero no resuelve el problema de la longitud del contexto, y pierdes lo que se dijo entre el cliente y el agente."}, {"letter": "C", "text": "Resumir los turnos anteriores en una descripción narrativa, preservando el historial completo de mensajes solo para el problema activo.", "correct": true, "explanation": "Correcto. El resumen progresivo comprime los temas resueltos y estables mientras mantiene el hilo activo textualmente: el patrón clásico para conversaciones largas con múltiples problemas cerca del límite de contexto."}, {"letter": "D", "text": "Implementar un contexto de ventana deslizante que retenga los 30 turnos más recientes.", "correct": false, "explanation": "Una ventana deslizante pura descarta silenciosamente el problema del reembolso (turnos 1-15) del contexto, que es exactamente lo que el cliente está preguntando. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m45", "source": "mock", "domain": 5, "scenario": null, "situation": "Tu agente ha llamado a `lookup_order` varias veces mientras investiga las solicitudes de devolución de un cliente. Cada respuesta incluye más de 40 campos (artículos, detalles de envío, información de pago, historial de estado). Las salidas de las herramientas ahora representan la mayor parte del contexto de la conversación. El cliente menciona dos pedidos más que quiere discutir.", "question": "¿Cuál es el enfoque más efectivo antes de hacer búsquedas adicionales?", "options": [{"letter": "A", "text": "Extraer solo los campos relevantes para la devolución (artículos, fecha de compra, ventana de devolución, estado) de cada respuesta de pedido existente, eliminando los detalles verbosos.", "correct": true, "explanation": "Correcto. Conserva los campos que importan para la tarea y descarta el resto. Esto aborda directamente el problema de saturación del contexto antes de agregar dos búsquedas más."}, {"letter": "B", "text": "Hacer que el modelo genere un resumen en lenguaje natural de los detalles clave de cada pedido, reemplazando las respuestas estructuradas con descripciones en prosa.", "correct": false, "explanation": "Los resúmenes en prosa pierden precisión para campos que el modelo puede necesitar después (fechas exactas, montos). El recorte estructurado es mejor que la paráfrasis."}, {"letter": "C", "text": "Mover todas las respuestas de las herramientas a una base de datos vectorial con indexación semántica, recuperando las porciones relevantes a medida que la conversación continúa.", "correct": false, "explanation": "Una base de datos vectorial es infraestructura pesada para lo que es en esencia un problema de recorte."}, {"letter": "D", "text": "Proceder con búsquedas adicionales sin modificar el contexto existente de salidas de las herramientas.", "correct": false, "explanation": "No hace nada respecto a la saturación: te diriges al agotamiento del contexto. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m60", "source": "mock", "domain": 5, "scenario": null, "situation": "Tras completarse tu lote diario de 10,000 documentos, 300 documentos (3%) fallaron con errores \"`context_length_exceeded`\". El archivo de resultados identifica cada fallo por `custom_id`.", "question": "¿Cuál es el enfoque más rentable para procesar estos fallos?", "options": [{"letter": "A", "text": "Reprocesar el lote completo con prompt caching habilitado para reducir el costo de reintentar las solicitudes con prompts de sistema idénticos", "correct": false, "explanation": "Volver a ejecutar 10,000 documentos exitosos para resolver 300 fallos es un derroche sin importar el ahorro del caching. Y el caching no arregla el error de longitud excedida."}, {"letter": "B", "text": "Reenviar solo los 300 documentos fallidos tras dividirlos en piezas más pequeñas, y luego combinar las extracciones parciales", "correct": true, "explanation": "Correcto. Es focalizado, y aborda la causa real (entrada demasiado larga). Divide los documentos sobredimensionados, extrae por fragmento y luego fusiona: mínimo de tokens, arregla el modo de fallo específico."}, {"letter": "C", "text": "Reenviar el lote completo de 10,000 documentos usando un nivel de modelo con una ventana de contexto más grande", "correct": false, "explanation": "Costoso (reprocesar 9,700 éxitos) y aun así puede fallar con documentos verdaderamente sobredimensionados."}, {"letter": "D", "text": "Aumentar el parámetro `max_tokens` para los 300 documentos fallidos y reenviarlos en un nuevo lote", "correct": false, "explanation": "`max_tokens` controla la longitud de salida, no la de entrada. No resuelve `context_length_exceeded`, que tiene que ver con el presupuesto combinado de entrada más salida. ════════════════════════════════════════════════════════════ Total de preguntas: 60 Generado: 8 de junio de 2026"}], "correct": "B"}];
const DOMAINS = {"1": {"name": "Arquitectura y Orquestación de Agentes", "weight": 27}, "2": {"name": "Diseño de Herramientas e Integración MCP", "weight": 18}, "3": {"name": "Configuración y Flujos de Claude Code", "weight": 20}, "4": {"name": "Ingeniería de Prompts y Salida Estructurada", "weight": 20}, "5": {"name": "Gestión de Contexto y Confiabilidad", "weight": 15}};
const T = {"questions": "Preguntas", "answered": "Respondidas", "mode_study": "Estudio", "mode_exam": "Examen", "mode_hint_study": "Las respuestas se revelan al instante", "mode_hint_exam": "Las respuestas se revelan al final", "prev": "← Anterior", "next": "Siguiente →", "finish": "Finalizar y revisar", "question": "Pregunta", "your_answer": "Tu respuesta", "correct": "Correcta", "why": "Por qué", "complete": "Examen completado", "answered_of": "Respondiste {a} de {t} preguntas.", "unanswered": "&#9888; {n} pregunta(s) sin responder (cuentan como incorrectas).", "score": "Puntaje", "pass": "APROBADO", "fail": "REPROBADO", "by_domain": "Puntaje por dominio", "review_wrong": "Revisar respuestas incorrectas", "all_correct": "¡Todas correctas — excelente!", "restart": "Nuevo intento — nuevo sorteo aleatorio", "weight": "peso", "threshold_note": "Aprobación fijada en {p}/1000. Cada intento sortea 12 preguntas aleatorias por dominio (60 en total); el puntaje se escala sobre 1000 como aproximación de estudio de la escala real de 100–1000.", "incorrect": "incorrectas", "domain": "Dominio", "select_n": "Selecciona {n} respuestas.", "select_full": "Ya elegiste las {n} respuestas. Deselecciona una para cambiar tu respuesta.", "not_answered": "Sin responder", "incomplete_answer": "respuesta incompleta", "length_full": "Completo · {n}", "length_quick": "Rápido · {n}", "length_aria": "Duración del intento", "new_set": "Nuevo sorteo", "new_draw_confirm": "¿Iniciar un nuevo intento con un nuevo sorteo aleatorio? Tus respuestas actuales se borrarán.", "draw_note_full": "Cada intento sortea un conjunto aleatorio nuevo: esta vez, {n} de las {bank} preguntas del banco. La duración completa refleja el examen real: 60 preguntas en 120 minutos.", "draw_note_quick": "Práctica rápida: {n} preguntas sorteadas al azar, ponderadas entre dominios — un conjunto nuevo en cada intento.", "summary_rotate": "Este intento fue un sorteo aleatorio de {n} preguntas de un banco de {bank}. Inicia un nuevo intento para recibir un conjunto distinto: las preguntas rotan cada vez.", "threshold_note_quick": "Aprobación fijada en {p}/1000. La práctica rápida sortea un conjunto aleatorio más corto ponderado entre dominios y escala el puntaje a 1000 de la misma forma; usa la duración completa para un ensayo realista."};
const PASS_PCT = 72;          // per-domain bar coloring threshold (%)
const PASS_SCORE = 720;  // overall cut score on the 100–1000 scale
// Questions drawn per domain each attempt. Either a single number applied to
// every domain (Foundations: 12 across 5 domains) or a { domain: count } map
// when the draw is weighted (Professional: 11/8/12/10/9/9/4 across 7 domains).
const PER_DOMAIN = 12;
// A quick drill draws about a third of the full attempt: per domain, the full
// count over QUICK_DIVISOR, rounded, floored at one item so every domain the
// full draw covers stays present. Deriving it from PER_DOMAIN keeps the full
// draw the single source of the weighting.
const QUICK_DIVISOR = 3;
const STORE_KEY = "ccaf-exam-es";
// Bumped when a saved attempt stops being valid — a blueprint revision that
// changes the per-domain draw, or a change to the shape of a stored answer.
// An older payload is dropped, which resets an attempt in progress once.
const STORE_VERSION = 2;

// `length` ("full" | "quick") defaults to the attempt in progress. load()
// passes it explicitly: a saved payload must be checked against its own
// length, never against whatever the live state happens to be.
function drawCount(domain, length) {
  const full = (typeof PER_DOMAIN === "number") ? PER_DOMAIN : (PER_DOMAIN[domain] ?? 0);
  if ((length || state.length) !== "quick") return full;
  return full > 0 ? Math.max(1, Math.round(full / QUICK_DIVISOR)) : 0;
}

// The draw actually achievable per domain: the requested count, capped by how
// many questions that domain holds (so it never over-draws a small domain).
function drawPerDomain(length) {
  const byDomain = {};
  QUESTIONS.forEach(q => { byDomain[q.domain] = (byDomain[q.domain] || 0) + 1; });
  const out = {};
  Object.keys(byDomain).forEach(d => { out[d] = Math.min(byDomain[d], drawCount(d, length)); });
  return out;
}

// Number of questions in one attempt.
function examSize(length) {
  return Object.values(drawPerDomain(length)).reduce((s, c) => s + c, 0);
}

// ---- answer shape --------------------------------------------------------
// Single-response items store a letter ("B"); multiple-response items store an
// array of letters (["A","C"]) and carry an array `correct`. Everything below
// branches on that so both shapes share one engine.
function isMulti(q) { return Array.isArray(q.correct); }
function selectCount(q) { return isMulti(q) ? q.correct.length : 1; }

function asLetters(v) {
  if (v === undefined || v === null) return [];
  return (Array.isArray(v) ? v.slice() : [v]).sort();
}

// "Answered" means a *complete* answer of the shape this item expects: one
// letter, or exactly the required number of letters. A partly-filled multi item
// does not count as answered, and neither does a stored value of the wrong
// shape — that is stale state from an item that changed response type.
function hasAnswer(q, ans) {
  if (ans === undefined || ans === null) return false;
  if (Array.isArray(ans) !== isMulti(q)) return false;
  return Array.isArray(ans) ? ans.length === selectCount(q) : true;
}

// Multiple-response items are scored all-or-nothing, like the real exam.
function isCorrect(q, ans) {
  if (!hasAnswer(q, ans)) return false;
  const a = asLetters(ans), c = asLetters(q.correct);
  return a.length === c.length && a.every((v, i) => v === c[i]);
}

function isChosenLetter(ans, letter) {
  if (ans === undefined || ans === null) return false;
  return Array.isArray(ans) ? ans.indexOf(letter) >= 0 : ans === letter;
}

function letterLabel(v) { return asLetters(v).join(", "); }

// ---- grading -------------------------------------------------------------
// "incomplete" is a multiple-response item with some but not all of its letters
// picked. It is not an answer, so it scores as incorrect — and it must still
// reach the review pane, or the candidate never sees the rationale.
function classify(q, ans) {
  if (!hasAnswer(q, ans)) return "incomplete";
  return isCorrect(q, ans) ? "correct" : "incorrect";
}

// Tally one attempt. Pure on purpose: the summary screen below only renders
// what this returns, so the regression harness can check the bucketing.
function tallyAttempt(active, answers) {
  const domStat = {}, wrongByDomain = {};
  let answered = 0, correct = 0;
  active.forEach(q => {
    domStat[q.domain] = domStat[q.domain] || { correct: 0, total: 0 };
    domStat[q.domain].total++;
    const ans = answers[q.id];
    const verdict = classify(q, ans);
    if (verdict !== "incomplete") answered++;
    if (verdict === "correct") { correct++; domStat[q.domain].correct++; return; }
    (wrongByDomain[q.domain] = wrongByDomain[q.domain] || [])
      .push({ q: q, chosen: ans, verdict: verdict });
  });
  const total = active.length;
  return { total: total, answered: answered, correct: correct,
           wrong: answered - correct, unanswered: total - answered,
           domStat: domStat, wrongByDomain: wrongByDomain };
}

const state = { current: 0, answers: {}, order: [], mode: "study", length: "full" };

// ---- persistence ---------------------------------------------------------
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(
    { v: STORE_VERSION, answers: state.answers, order: state.order,
      mode: state.mode, length: state.length, current: state.current })); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    // A payload from a different version is discarded, not migrated. A payload
    // written before versioning existed carries no stamp: it is still accepted,
    // because nothing about it is known to be stale and the checks below
    // validate it on its own terms. That keeps attempts in progress alive.
    if (d.v !== undefined && d.v !== STORE_VERSION) return null;
    // The payload's own length decides which draw the order must match, so a
    // saved attempt of one length can never be misread as the other. A payload
    // from before the quick drill existed carries no length: it is a full
    // attempt, the only length that engine could draw.
    const length = d.length === "quick" ? "quick" : "full";
    // Order is valid only if it still matches that length's attempt size.
    if (!Array.isArray(d.order) || d.order.length !== examSize(length)) return null;
    const ids = new Set(QUESTIONS.map(q => q.id));
    if (!d.order.every(id => ids.has(id))) return null;
    // The total survives a blueprint revision that only moves items between
    // domains, so check the per-domain mix too. Without this a returning
    // candidate keeps the old weighting under a note that claims the new one.
    const want = drawPerDomain(length), got = {};
    d.order.forEach(id => { const q = qById(id); if (q) got[q.domain] = (got[q.domain] || 0) + 1; });
    if (Object.keys(want).some(d2 => (got[d2] || 0) !== want[d2])) return null;
    d.length = length;
    return d;
  } catch (e) { return null; }
}

// ---- order ---------------------------------------------------------------
// Draw PER_DOMAIN random questions from each domain (the "question bank"
// behavior), keeping domains in order. Within a domain the drawn questions are
// already in random order from the shuffle. Option order is never shuffled (the
// answer key is by letter).
function shuffleOrder() {
  const byDomain = {};
  QUESTIONS.forEach(q => { (byDomain[q.domain] = byDomain[q.domain] || []).push(q.id); });
  const order = [];
  Object.keys(byDomain).sort((a, b) => a - b).forEach(d => {
    const ids = byDomain[d].slice();
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    order.push(...ids.slice(0, drawCount(d)));
  });
  return order;
}
function qById(id) { return QUESTIONS.find(q => q.id === id); }
function orderedQuestions() { return state.order.map(qById); }

// Everything below writes into innerHTML, and every string it writes is
// authored data. esc() runs first so a raw "<" in an item ("latency < 500 ms")
// stays text instead of becoming markup.
function esc(text) {
  if (text === undefined || text === null) return "";
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function md(text) {
  if (!text) return "";
  return esc(text).replace(/`([^`]+)`/g, "<code>$1</code>")
                  .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
                  .replace(/\n/g, " ");
}

// ---- sidebar -------------------------------------------------------------
function buildSidebar() {
  const list = document.getElementById("sidebarList");
  list.innerHTML = "";
  document.getElementById("totalCount").textContent = state.order.length;
  const qs = orderedQuestions();
  let curDomain = null, groupEl = null;
  qs.forEach((q, idx) => {
    if (q.domain !== curDomain) {
      curDomain = q.domain;
      const sg = document.createElement("div");
      sg.className = "domain-group";
      const lbl = document.createElement("div");
      lbl.className = "domain-label";
      const dm = DOMAINS[q.domain];
      lbl.innerHTML = "<span>" + T.domain + " " + q.domain + " · " + esc(dm.name) +
        "</span><span class='dl-weight'>" + dm.weight + "%</span>";
      sg.appendChild(lbl);
      groupEl = sg;
      list.appendChild(sg);
    }
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "q-btn";
    btn.id = "sb-" + idx;
    btn.onclick = () => goto(idx);
    btn.innerHTML = "<span class='q-dot'></span> " + (idx + 1);
    groupEl.appendChild(btn);
  });
}

function updateSidebar() {
  const qs = orderedQuestions();
  let answeredCount = 0;
  qs.forEach((q, idx) => {
    const btn = document.getElementById("sb-" + idx);
    if (!btn) return;
    btn.className = "q-btn";
    if (idx === state.current) btn.classList.add("active");
    const ans = state.answers[q.id];
    if (hasAnswer(q, ans)) {
      answeredCount++;
      if (state.mode === "exam") btn.classList.add("answered");
      else btn.classList.add(isCorrect(q, ans) ? "answered-correct" : "answered-wrong");
    }
  });
  document.getElementById("answeredCount").textContent = answeredCount;
}

// ---- question render -----------------------------------------------------
function renderQuestion(idx) {
  const qs = orderedQuestions();
  const q = qs[idx];
  const chosen = state.answers[q.id];
  // Study mode reveals only once the answer is complete — for a multi item that
  // means all N letters are selected, so partial picks stay editable.
  const reveal = hasAnswer(q, chosen) && state.mode === "study";

  document.getElementById("qCounter").textContent = (idx + 1) + " / " + qs.length;
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === qs.length - 1;

  const dm = DOMAINS[q.domain];
  const scenarioTag = q.scenario ? "<span class='q-scenario'>" + esc(q.scenario) + "</span>" : "";
  const situation = q.situation ? "<div class='q-situation'>" + md(q.situation) + "</div>" : "";

  // A multi item with all N picks in place: the remaining options are dimmed
  // and inert, so it reads as "deselect one first" instead of a dead click.
  const atCapacity = !reveal && isMulti(q) && hasAnswer(q, chosen);

  const optionsHtml = q.options.map(opt => {
    let cls = "option";
    const isChosen = isChosenLetter(chosen, opt.letter);
    if (reveal) {
      cls += " locked";
      if (opt.correct) cls += " correct";
      else if (isChosen) cls += " wrong";
      else cls += " dimmed";
    } else if (isChosen) {
      cls += " selected";
    } else if (atCapacity) {
      cls += " dimmed";
    }
    // In study mode after answering, show explanation for the correct option
    // and for the (wrong) one the user picked.
    const showExpl = reveal && opt.explanation && (opt.correct || isChosen);
    // A revealed option is inert for good, so `disabled` fits. An at-capacity
    // option is not: it becomes selectable again as soon as the candidate
    // deselects a letter, so it stays in the tab order and only reports itself
    // as unavailable. `disabled` here would hide it from keyboard and screen
    // reader users, and the visible hint below explains the state.
    const disabled = reveal ? " disabled"
                   : ((atCapacity && !isChosen) ? " aria-disabled='true'" : "");
    const expl = opt.explanation
      ? "<div class='opt-expl" + (showExpl ? " show" : "") + "'>" + md(opt.explanation) + "</div>"
      : "";
    return "<div class='" + cls + "' data-letter='" + opt.letter + "'>" +
      "<button type='button' class='option-head' aria-pressed='" + String(isChosen) + "'" + disabled +
        " onclick=\"answer('" + q.id + "','" + opt.letter + "')\">" +
        "<span class='opt-letter'>" + opt.letter + "</span>" +
        "<span class='opt-text'>" + md(opt.text) + "</span>" +
      "</button>" + expl + "</div>";
  }).join("");

  document.getElementById("qCard").innerHTML =
    "<div class='q-number'>" + T.question + " " + (idx + 1) + "</div>" +
    "<div><span class='q-domain'>" + T.domain + " " + q.domain + " · " + esc(dm.name) + "</span>" +
    scenarioTag + "</div>" +
    situation +
    "<div class='q-prompt'>" + md(q.question) + "</div>" +
    (isMulti(q)
      ? "<div class='q-select'>" + T.select_n.replace("{n}", selectCount(q)) + "</div>" +
        (atCapacity
          ? "<div class='q-select-hint'>" + T.select_full.replace("{n}", selectCount(q)) + "</div>"
          : "")
      : "") +
    "<div class='options'>" + optionsHtml + "</div>";
}

function answer(id, letter) {
  const q = qById(id);
  const n = selectCount(q);
  const locked = state.mode === "study" && hasAnswer(q, state.answers[id]);
  if (locked) return;

  if (n === 1) {
    state.answers[id] = letter;
  } else {
    // Toggle within the allowed number of selections. Re-clicking a chosen
    // letter removes it, so a candidate can correct a pick before completing.
    const cur = Array.isArray(state.answers[id]) ? state.answers[id].slice() : [];
    const at = cur.indexOf(letter);
    if (at >= 0) cur.splice(at, 1);
    else if (cur.length < n) cur.push(letter);
    // At capacity on an unpicked letter: nothing changes, so return before the
    // re-render. Repainting the card would throw away the keyboard focus.
    else return;
    state.answers[id] = cur;
  }
  save();
  renderQuestion(state.current);
  updateSidebar();
}

function navigate(dir) { goto(state.current + dir); }
function goto(idx) {
  const qs = orderedQuestions();
  if (idx < 0 || idx >= qs.length) return;
  document.getElementById("questionScreen").classList.add("active");
  document.getElementById("summaryScreen").classList.remove("active");
  state.current = idx;
  save();
  renderQuestion(idx);
  updateSidebar();
}

function setMode(mode) {
  state.mode = mode;
  document.getElementById("modeStudy").classList.toggle("active", mode === "study");
  document.getElementById("modeExam").classList.toggle("active", mode === "exam");
  document.getElementById("modeStudy").setAttribute("aria-pressed", String(mode === "study"));
  document.getElementById("modeExam").setAttribute("aria-pressed", String(mode === "exam"));
  document.getElementById("modeHint").textContent =
    mode === "study" ? T.mode_hint_study : T.mode_hint_exam;
  save();
  renderQuestion(state.current);
  updateSidebar();
}

// ---- new draw ------------------------------------------------------------
// Drawing a different set is available at all times: the header button, the
// length toggle, and the summary's restart all end in restart(). The first
// two run while an attempt may be in progress, so they share one guard that
// asks before discarding it. The summary's button stays unguarded, as it
// always was: that attempt is already finished and scored.
function confirmDiscard() {
  return Object.keys(state.answers).length === 0 ||
    typeof confirm !== "function" || confirm(T.new_draw_confirm);
}

function newDraw() {
  if (confirmDiscard()) restart();
}

// ---- attempt length ------------------------------------------------------
// "full" mirrors the real exam's draw; "quick" is a short drill for a spare
// twenty minutes. Switching lengths redraws, so a started attempt asks first.
function setLength(length) {
  if (length === state.length) return;
  if (!confirmDiscard()) return;
  state.length = length;
  restart();
}

function updateLengthUI() {
  [["lengthFull", "full", T.length_full], ["lengthQuick", "quick", T.length_quick]]
    .forEach(([id, len, label]) => {
      const btn = document.getElementById(id);
      btn.textContent = label.replace("{n}", examSize(len));
      btn.classList.toggle("active", state.length === len);
      btn.setAttribute("aria-pressed", String(state.length === len));
    });
  document.getElementById("drawNote").innerHTML =
    "<span class='dn-icon'>&#10227;</span>" +
    (state.length === "quick" ? T.draw_note_quick : T.draw_note_full)
      .replace("{n}", examSize())
      .replace("{bank}", QUESTIONS.length);
}

// ---- summary -------------------------------------------------------------
function showSummary() {
  document.getElementById("questionScreen").classList.remove("active");
  document.getElementById("summaryScreen").classList.add("active");

  // Only the questions in this attempt (PER_DOMAIN per domain) count. The
  // review pane lists every item that did not score, including the ones left
  // blank or half-picked: those count as incorrect, so they need a rationale.
  const active = orderedQuestions();
  const tally = tallyAttempt(active, state.answers);
  const total = tally.total, answered = tally.answered, correct = tally.correct;
  const wrong = tally.wrong, unanswered = tally.unanswered;
  const domStat = tally.domStat, wrongByDomain = tally.wrongByDomain;

  const pct = total ? Math.round(correct / total * 100) : 0;
  const score = total ? Math.round(correct / total * 1000) : 0; // scaled to 1000
  const passed = score >= PASS_SCORE;

  let domainScoresHtml = "";
  Object.keys(domStat).sort((a, b) => a - b).forEach(d => {
    const s = domStat[d], dm = DOMAINS[d];
    const dpct = s.total ? Math.round(s.correct / s.total * 100) : 0;
    const barCls = dpct >= PASS_PCT ? "" : (dpct >= 50 ? "low" : "bad");
    domainScoresHtml +=
      "<div class='ds-row'>" +
        "<div class='ds-name'>" + T.domain + " " + d + " · " + esc(dm.name) +
          " <small>(" + dm.weight + "% " + T.weight + ")</small></div>" +
        "<div class='ds-bar'><div class='" + barCls + "' style='width:" + dpct + "%'></div></div>" +
        "<div class='ds-pct'>" + s.correct + "/" + s.total + " · " + dpct + "%</div>" +
      "</div>";
  });

  let wrongGroupsHtml = "";
  Object.keys(wrongByDomain).sort((a, b) => a - b).forEach(d => {
    const items = wrongByDomain[d], dm = DOMAINS[d];
    const rows = items.map(item => {
      // Both shapes resolve to a list of letters, so a multi item shows every
      // letter it needed and every letter the candidate actually picked.
      const optText = letters => letters
        .map(L => { const o = item.q.options.find(x => x.letter === L); return o ? md(o.text) : ""; })
        .filter(Boolean).join("<br>");
      const chosenLetters = asLetters(item.chosen);
      const correctLetters = asLetters(item.q.correct);
      // One block per correct letter. Joining them into a single paragraph left
      // the reader unable to tell which rationale explained which letter.
      const expl = correctLetters.map(L => {
        const o = item.q.options.find(x => x.letter === L);
        return (o && o.explanation)
          ? "<div class='wi-expl'><strong>" + T.why + " " + L + ":</strong> " + md(o.explanation) + "</div>"
          : "";
      }).join("");
      // Nothing picked reads as "Not answered" rather than an empty dash; a
      // half-picked multi item shows its letters and says it is incomplete.
      const yours = chosenLetters.length
        ? "<span class='wi-wrong-tag'>" + letterLabel(chosenLetters) + "</span>" +
          (item.verdict === "incomplete"
            ? " <span class='wi-wrong-tag'>(" + T.incomplete_answer + ")</span>" : "") +
          " — " + optText(chosenLetters)
        : "<span class='wi-wrong-tag'>" + T.not_answered + "</span>";
      return "<div class='wrong-item'>" +
        "<div class='wi-n'>" + esc(item.q.id).toUpperCase() + "</div>" +
        "<div class='wi-q'>" +
          (item.q.situation ? "<div class='wi-situation'>" + md(item.q.situation) + "</div>" : "") +
          "<div class='wi-prompt'>" + md(item.q.question) + "</div>" +
          "<div class='wi-ans'>" + T.your_answer + ": " + yours + "<br>" +
            T.correct + ": <span class='wi-correct-tag'>" + letterLabel(correctLetters) + "</span> — " +
            optText(correctLetters) + "</div>" + expl +
        "</div></div>";
    }).join("");
    wrongGroupsHtml += "<div class='group-block'><div class='group-title'>" +
      T.domain + " " + d + " · " + esc(dm.name) +
      "<span class='group-badge'>" + items.length + " " + T.incorrect + "</span></div>" + rows + "</div>";
  });

  const unansweredNote = unanswered > 0
    ? "<p style='color:#e53e3e;font-size:14px;margin-bottom:18px;font-weight:600;'>" +
      T.unanswered.replace("{n}", unanswered) + "</p>" : "";

  document.getElementById("summaryContent").innerHTML =
    "<h1>" + T.complete + "</h1>" +
    "<p class='summary-subtitle'>" + T.answered_of.replace("{a}", answered).replace("{t}", total) + "</p>" +
    "<div class='verdict " + (passed ? "pass" : "fail") + "'>" + (passed ? T.pass : T.fail) + "</div>" +
    unansweredNote +
    "<div class='score-grid'>" +
      "<div class='score-card total'><div class='big'>" + score +
        "<span style='font-size:18px;color:#a0aec0;font-weight:700;'>/1000</span></div>" +
        "<div class='label'>" + T.score + "</div></div>" +
      "<div class='score-card correct-c'><div class='big'>" + correct + "</div><div class='label'>" + T.correct + "</div></div>" +
      "<div class='score-card wrong-c'><div class='big'>" + (wrong + unanswered) + "</div><div class='label'>" + T.incorrect + "</div></div>" +
    "</div>" +
    "<p class='threshold-note'>" +
      (state.length === "quick" ? T.threshold_note_quick : T.threshold_note)
        .replace("{p}", PASS_SCORE) + "</p>" +
    "<div class='section-title'>" + T.by_domain + "</div>" +
    "<div class='domain-scores'>" + domainScoresHtml + "</div>" +
    ((wrong + unanswered) > 0
      ? "<div class='section-title'>" + T.review_wrong + "</div>" + wrongGroupsHtml
      : "<p style='color:#38a169;font-weight:700;font-size:17px;'>" + T.all_correct + "</p>") +
    "<div class='rotate-note'><span class='dn-icon'>&#10227;</span>" +
      T.summary_rotate.replace("{n}", total).replace("{bank}", QUESTIONS.length) + "</div>" +
    "<button type='button' class='restart-btn' onclick='restart()'>" + T.restart + "</button>";
}

function restart() {
  state.answers = {};
  state.current = 0;
  state.order = shuffleOrder();
  save();
  updateLengthUI();
  buildSidebar();
  document.getElementById("questionScreen").classList.add("active");
  document.getElementById("summaryScreen").classList.remove("active");
  renderQuestion(0);
  updateSidebar();
}

// ---- init ----------------------------------------------------------------
(function init() {
  const saved = load();
  if (saved) {
    state.answers = saved.answers || {};
    state.order = saved.order;
    state.mode = saved.mode || "study";
    // load() normalized the length, so a pre-quick payload restores as "full".
    state.length = saved.length;
    state.current = Math.min(saved.current || 0, state.order.length - 1);
  } else {
    state.order = shuffleOrder();
  }
  setMode(state.mode);
  updateLengthUI();
  buildSidebar();
  renderQuestion(state.current);
  updateSidebar();
})();
</script>
</body>
