], "correct": "D"}, {"id": "g39", "source": "guide", "domain": 3, "scenario": "Generación de código con Claude Code", "situation": "Tu equipo creó un skill `/migration` que genera archivos de migración de base de datos. Toma el nombre de la migración vía `$ARGUMENTS`. En producción observas tres problemas: (1) los desarrolladores a menudo ejecutan el skill sin argumentos, causando archivos mal nombrados, (2) el skill a veces usa detalles de esquema de base de datos de conversaciones previas no relacionadas, y (3) un desarrollador ejecutó accidentalmente limpieza de pruebas destructiva cuando el skill tenía amplio acceso a herramientas.", "question": "¿Qué enfoque de configuración corrige los tres problemas?", "options": [{"letter": "A", "text": "Usar parámetros posicionales `$1` y `$2` en lugar de `$ARGUMENTS` para imponer entradas específicas, incluir referencias explícitas al archivo de esquema vía sintaxis `@` para control de contexto, y agregar una descripción en frontmatter advirtiendo sobre operaciones destructivas.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Agregar `argument-hint` en el frontmatter para solicitar parámetros requeridos, usar `context: fork` para aislar la ejecución y restringir `allowed-tools` a operaciones de escritura de archivos.", "correct": true, "explanation": "Esto usa tres características de configuración separadas para abordar cada problema: `argument-hint` mejora la entrada de argumentos y reduce los argumentos faltantes, `context: fork` previene fugas de contexto de conversaciones previas, y `allowed-tools` limita el skill a operaciones seguras de escritura de archivos, previniendo acciones destructivas."}, {"letter": "C", "text": "Dividir en skills `/migration-create` y `/migration-apply`, agregar instrucciones de validación para solicitar el nombre de migración si falta, y usar diferentes alcances de `allowed-tools` para cada uno.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Agregar instrucciones de validación en el SKILL.md del skill para asegurar que `$ARGUMENTS` sea un nombre válido, agregar prompts para ignorar el contexto de conversación previa, y listar operaciones prohibidas a evitar.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g40", "source": "guide", "domain": 3, "scenario": "Generación de código con Claude Code", "situation": "Tu base de código contiene áreas con diferentes convenciones de codificación: los componentes React usan estilo funcional con hooks, los manejadores de API usan async/await con manejo específico de errores, y los modelos de base de datos siguen el patrón repository. Los archivos de prueba están distribuidos por la base de código junto al código bajo prueba (por ejemplo, `Button.test.tsx` junto a `Button.tsx`), y quieres que todas las pruebas sigan las mismas convenciones independientemente de la ubicación.", "question": "¿Cuál es la forma más soportada de asegurar que Claude aplique automáticamente las convenciones correctas al generar código?", "options": [{"letter": "A", "text": "Poner todas las convenciones en el CLAUDE.md raíz bajo encabezados para cada área y confiar en que Claude infiera qué sección aplica.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Crear skills en `.claude/skills/` para cada tipo de código, incrustando convenciones en cada SKILL.md.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Colocar un archivo CLAUDE.md separado en cada subdirectorio que contenga las convenciones para esa área.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Crear archivos de regla bajo `.claude/rules/` con frontmatter YAML especificando patrones glob para aplicar convenciones condicionalmente según rutas de archivo.", "correct": true, "explanation": "Los archivos `.claude/rules/` con frontmatter YAML y patrones glob (por ejemplo, `**/*.test.tsx`, `src/api/**/*.ts`) habilitan aplicación de convenciones determinista basada en rutas independiente de la estructura de directorios. Este es el enfoque más soportado para patrones transversales como archivos de prueba distribuidos."}], "correct": "D"}, {"id": "g41", "source": "guide", "domain": 3, "scenario": "Generación de código con Claude Code", "situation": "Quieres crear un comando slash personalizado `/review` que ejecute la checklist estándar de revisión de código de tu equipo. Debe estar disponible para cada desarrollador cuando clone o actualice el repositorio.", "question": "¿Dónde deberías crear el archivo del comando?", "options": [{"letter": "A", "text": "En `~/.claude/commands/` en el directorio home de cada desarrollador.", "correct": false, "explanation": ""}, {"letter": "B", "text": "En el repositorio del proyecto bajo `.claude/commands/`.", "correct": true, "explanation": "Poner los comandos slash personalizados bajo `.claude/commands/` dentro del repositorio del proyecto asegura que estén versionados y automáticamente disponibles para cada desarrollador que clone o actualice el repo. Esta es la ubicación prevista para comandos personalizados a nivel de proyecto en Claude Code."}, {"letter": "C", "text": "En `.claude/config.json` como un array de comandos.", "correct": false, "explanation": ""}, {"letter": "D", "text": "En el CLAUDE.md raíz del proyecto.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g42", "source": "guide", "domain": 3, "scenario": "Generación de código con Claude Code", "situation": "El CLAUDE.md de tu equipo creció más allá de 500 líneas mezclando convenciones de TypeScript, guía de pruebas, patrones de API y procedimientos de despliegue. Los desarrolladores encuentran difícil ubicar y actualizar las secciones correctas.", "question": "¿Qué enfoque soporta Claude Code para organizar las instrucciones a nivel de proyecto en módulos temáticos enfocados?", "options": [{"letter": "A", "text": "Definir un archivo `.claude/config.yaml` mapeando patrones de archivo a secciones específicas dentro de CLAUDE.md.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Crear archivos Markdown separados en `.claude/rules/`, cada uno cubriendo un tema (por ejemplo, `testing.md`, `api-conventions.md`).", "correct": true, "explanation": "Claude Code soporta un directorio `.claude/rules/` donde puedes crear archivos Markdown separados para guía temática (por ejemplo, `testing.md`, `api-conventions.md`), permitiendo a los equipos organizar grandes conjuntos de instrucciones en módulos enfocados y mantenibles."}, {"letter": "C", "text": "Dividir las instrucciones en archivos README.md en subdirectorios relevantes que Claude carga automáticamente como instrucciones.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Crear múltiples archivos llamados CLAUDE.md en diferentes niveles del árbol de directorios, cada uno sobrescribiendo las instrucciones del padre.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g43", "source": "guide", "domain": 3, "scenario": "Generación de código con Claude Code", "situation": "Creas un skill personalizado `/explore-alternatives` que tu equipo usa para hacer brainstorming y evaluar enfoques de implementación antes de elegir uno. Los desarrolladores reportan que después de ejecutar el skill, las respuestas posteriores de Claude son influenciadas por la discusión de alternativas—a veces referenciando enfoques rechazados o reteniendo contexto de exploración que interfiere con la implementación real.", "question": "¿Cómo deberías configurar este skill más efectivamente?", "options": [{"letter": "A", "text": "Usar el prefijo `!` en el skill para ejecutar la lógica de exploración como un subproceso bash.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Agregar `context: fork` en el frontmatter del skill.", "correct": true, "explanation": "`context: fork` ejecuta el skill en un contexto de subagente aislado para que las discusiones de exploración no contaminen el historial de conversación principal. Esto previene que enfoques rechazados y el contexto de brainstorming influyan en el trabajo de implementación posterior."}, {"letter": "C", "text": "Dividir en dos skills—`/explore-start` y `/explore-end`—para marcar límites cuando el contexto de exploración debe ser descartado.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Crear el skill en `~/.claude/skills/` en lugar de `.claude/skills/`.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g44", "source": "guide", "domain": 3, "scenario": "Generación de código con Claude Code", "situation": "Tu equipo quiere agregar un servidor MCP de GitHub para buscar PRs y verificar el estado de CI vía Claude Code. Cada uno de los seis desarrolladores tiene su propio token de acceso personal de GitHub. Quieres herramientas consistentes en el equipo sin commitear credenciales al control de versiones.", "question": "¿Qué enfoque de configuración es más efectivo?", "options": [{"letter": "A", "text": "Hacer que cada desarrollador agregue el servidor en alcance de usuario vía `claude mcp add --scope user`.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Crear un wrapper de servidor MCP que lea tokens de un archivo `.env` y haga proxy de las llamadas a la API de GitHub, luego agregar el wrapper al `.mcp.json` del proyecto.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Agregar el servidor al `.mcp.json` del proyecto usando sustitución de variables de entorno (`${GITHUB_TOKEN}`) para autenticación y documentar la variable de entorno requerida en el README del proyecto.", "correct": true, "explanation": "Un `.mcp.json` de proyecto con sustitución de variables de entorno es idiomático: proporciona una única fuente de verdad versionada para la configuración MCP mientras permite a cada desarrollador suministrar credenciales vía variables de entorno. Documentar la variable hace fácil el onboarding sin commitear secretos."}, {"letter": "D", "text": "Configurar el servidor en alcance de proyecto con un token marcador de posición, luego decir a los desarrolladores que lo sobrescriban en su configuración local.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "m19", "source": "mock", "domain": 3, "scenario": null, "situation": "Una ingeniera usó `Claude Code` ayer para investigar los flujos de autenticación en un monolito heredado, acumulando un contexto considerable a lo largo de una sesión de 2 horas. Hoy quiere continuar esa investigación específica. Desde entonces ha trabajado en otros tres códigos base y sabe que la sesión se llamaba \"auth-deep-dive\".", "question": "¿Cómo debería retomarla?", "options": [{"letter": "A", "text": "Empezar de cero y releer los mismos archivos", "correct": false, "explanation": "Desperdicia las dos horas de contexto acumulado de ayer."}, {"letter": "B", "text": "Usar `--session-id` con el UUID del archivo de transcripción de la sesión de ayer", "correct": false, "explanation": "Es posible pero engorroso: tendría que buscar el UUID cuando ya tiene el nombre de la sesión."}, {"letter": "C", "text": "Usar `--continue` para retomar donde quedó la conversación más reciente", "correct": false, "explanation": "`--continue` reanuda la sesión más reciente en este repositorio. Desde entonces ha trabajado en otros tres códigos base, así que la más reciente no es auth-deep-dive."}, {"letter": "D", "text": "Usar `--resume` auth-deep-dive para cargar esa sesión específica por nombre", "correct": true, "explanation": "Correcto. `--resume` con el nombre de la sesión está diseñado exactamente para esto: elegir una sesión previa específica entre muchas, por el nombre que le diste. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "g17", "source": "guide", "domain": 4, "scenario": "Claude Code para Integración Continua", "situation": "Tu equipo usa Claude Code para generar sugerencias de código, pero notas un patrón: problemas no obvios—optimizaciones de rendimiento que rompen casos límite, limpiezas que cambian inesperadamente el comportamiento—solo se detectan cuando otro miembro del equipo revisa el PR. El razonamiento de Claude durante la generación muestra que consideró estos casos pero concluyó que su enfoque era correcto. ¿Qué enfoque aborda directamente la causa raíz de esta limitación de auto-revisión?", "question": "¿Qué enfoque aborda directamente la causa raíz?", "options": [{"letter": "A", "text": "Ejecutar una segunda instancia independiente de Claude Code para revisar los cambios sin acceso al razonamiento del generador.", "correct": true, "explanation": "Una segunda instancia independiente de Claude Code sin acceso al razonamiento del generador aborda directamente la causa raíz al evitar el sesgo de confirmación. Esta perspectiva de \"ojos frescos\" refleja la revisión por pares humana, donde otro revisor detecta problemas que el autor racionalizó."}, {"letter": "B", "text": "Habilitar el modo de pensamiento extendido para la etapa de generación para permitir una deliberación más exhaustiva antes de producir sugerencias.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Agregar instrucciones explícitas de auto-revisión al prompt de generación pidiendo a Claude que critique sus propias sugerencias antes de finalizar la salida.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Incluir archivos de prueba completos y documentación en el contexto del prompt para que Claude entienda mejor el comportamiento esperado durante la generación.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g19", "source": "guide", "domain": 4, "scenario": "Claude Code para Integración Continua", "situation": "Tu sistema CI/CD ejecuta tres análisis basados en Claude: (1) verificaciones rápidas de estilo en cada PR que bloquean el merge hasta completarse, (2) auditorías exhaustivas de seguridad semanales de toda la base de código, y (3) generación nocturna de casos de prueba para módulos cambiados recientemente. La Message Batches API ofrece 50% de ahorro pero el procesamiento puede tardar hasta 24 horas. Quieres optimizar el costo de la API manteniendo una experiencia de desarrollador aceptable. ¿Qué combinación empareja correctamente cada tarea con un enfoque de API?", "question": "¿Qué combinación es correcta?", "options": [{"letter": "A", "text": "Usar la Message Batches API para las tres tareas para maximizar el 50% de ahorro, configurando el pipeline para sondear la finalización del lote.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Usar llamadas síncronas para verificaciones de estilo del PR; usar la Message Batches API para auditorías de seguridad semanales y generación nocturna de pruebas.", "correct": true, "explanation": "Las verificaciones de estilo del PR bloquean a los desarrolladores y requieren respuestas inmediatas vía llamadas síncronas, mientras que las auditorías de seguridad semanales y la generación nocturna de pruebas son tareas programadas con plazos flexibles que pueden tolerar hasta una ventana de lote de 24 horas—capturando 50% de ahorro para ambas."}, {"letter": "C", "text": "Usar llamadas síncronas para las tres tareas para tiempos de respuesta consistentes, confiando en el caching de prompts para reducir costos en todas las cargas de trabajo.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Usar llamadas síncronas para verificaciones de estilo del PR y generación nocturna de pruebas; usar la Message Batches API solo para auditorías de seguridad semanales.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g20", "source": "guide", "domain": 4, "scenario": "Claude Code para Integración Continua", "situation": "Tus revisiones automatizadas encuentran problemas reales, pero los desarrolladores reportan que la retroalimentación no es accionable. Los hallazgos incluyen frases como \"lógica de enrutamiento de tickets compleja\" o \"potencial puntero nulo\" sin especificar qué cambiar exactamente. Cuando agregas instrucciones detalladas como \"siempre incluir sugerencias de corrección concretas\", el modelo aún produce salida inconsistente—a veces detallada, a veces vaga. ¿Qué técnica de prompting produce más confiablemente retroalimentación consistentemente accionable?", "question": "¿Qué técnica de prompting es más confiable?", "options": [{"letter": "A", "text": "Refinar más las instrucciones con requisitos más explícitos para cada parte del formato de retroalimentación (ubicación, problema, severidad, corrección propuesta).", "correct": false, "explanation": ""}, {"letter": "B", "text": "Expandir la ventana de contexto para incluir más código circundante para que el modelo tenga suficiente información para proponer correcciones concretas.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Implementar un enfoque de dos pasadas donde un prompt identifica problemas y un segundo genera correcciones, permitiendo especialización.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Agregar 3–4 ejemplos few-shot que muestren el formato exacto requerido: problema identificado, ubicación en el código, sugerencia de corrección concreta.", "correct": true, "explanation": "Los ejemplos few-shot son la técnica más efectiva para lograr formato de salida consistente cuando las instrucciones por sí solas producen resultados variables. Proporcionar 3–4 ejemplos que muestran la estructura exacta deseada (problema, ubicación, corrección concreta) le da al modelo un patrón concreto a seguir, lo cual es más confiable que instrucciones abstractas."}], "correct": "D"}, {"id": "g21", "source": "guide", "domain": 4, "scenario": "Claude Code para Integración Continua", "situation": "Tu pipeline de CI incluye dos modos de revisión de código basados en Claude: un hook de pre-merge-commit que bloquea el merge del PR hasta completarse, y un \"análisis profundo\" que se ejecuta de noche, sondea la finalización del lote y publica sugerencias detalladas en el PR. Quieres reducir el costo de la API usando la Message Batches API, que ofrece 50% de ahorro pero requiere sondeo y puede tardar hasta 24 horas. ¿Qué modo debería usar procesamiento en lote?", "question": "¿Qué modo debería usar procesamiento en lote?", "options": [{"letter": "A", "text": "Solo el hook de pre-merge-commit.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Solo el análisis profundo.", "correct": true, "explanation": "El análisis profundo es un candidato ideal para procesamiento en lote porque ya se ejecuta de noche, tolera retraso y usa un modelo de sondeo antes de publicar resultados—coincidiendo con la arquitectura asíncrona basada en sondeo de la Message Batches API mientras captura 50% de ahorro."}, {"letter": "C", "text": "Ambos modos.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Ninguno de los modos.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g22", "source": "guide", "domain": 4, "scenario": "Claude Code para Integración Continua", "situation": "Tu revisión automatizada analiza comentarios y docstrings. El prompt actual instruye a Claude a \"verificar que los comentarios sean precisos y estén actualizados\". Los hallazgos a menudo señalan patrones aceptables (marcadores TODO, descripciones simples) mientras se pierden comentarios que describen comportamiento que el código ya no implementa. ¿Qué cambio aborda la causa raíz de este análisis inconsistente?", "question": "¿Qué cambio aborda la causa raíz?", "options": [{"letter": "A", "text": "Incluir datos de `git blame` para que Claude pueda identificar comentarios que preceden cambios de código recientes.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Agregar ejemplos few-shot de comentarios engañosos para ayudar al modelo a reconocer patrones similares en la base de código.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Filtrar patrones de comentarios TODO, FIXME y descriptivos antes del análisis para reducir el ruido.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Especificar criterios explícitos: marcar comentarios solo cuando el comportamiento que afirman contradice el comportamiento real del código.", "correct": true, "explanation": "Los criterios explícitos—marcar comentarios solo cuando el comportamiento afirmado contradice el comportamiento real del código—abordan directamente la causa raíz reemplazando una instrucción vaga con una definición precisa de qué constituye un problema. Esto reduce los falsos positivos sobre patrones aceptables y los descuidos de comentarios verdaderamente engañosos."}], "correct": "D"}, {"id": "g23", "source": "guide", "domain": 4, "scenario": "Claude Code para Integración Continua", "situation": "Tu sistema automatizado de revisión de código muestra calificaciones de severidad inconsistentes—problemas similares como riesgos de puntero nulo se califican como \"críticos\" en algunos PRs pero solo \"medio\" en otros. Las encuestas a desarrolladores muestran creciente desconfianza—muchos comienzan a descartar hallazgos sin leer porque \"la mitad están mal\". Las categorías con altos falsos positivos erosionan la confianza en categorías precisas. ¿Qué enfoque restaura mejor la confianza del desarrollador mientras mejora el sistema?", "question": "¿Qué enfoque restaura mejor la confianza del desarrollador?", "options": [{"letter": "A", "text": "Deshabilitar temporalmente categorías con altos falsos positivos (estilo, nomenclatura, documentación) y mantener solo categorías de alta precisión mientras se mejoran los prompts.", "correct": true, "explanation": "Deshabilitar temporalmente las categorías con altos falsos positivos detiene inmediatamente la erosión de confianza al eliminar hallazgos ruidosos que hacen que los desarrolladores descarten todo, mientras se preserva el valor de las categorías de alta precisión como seguridad y corrección. También crea espacio para mejorar los prompts de las categorías problemáticas antes de rehabilitarlas."}, {"letter": "B", "text": "Mantener todas las categorías habilitadas pero mostrar puntuaciones de confianza con cada hallazgo para que los desarrolladores decidan qué investigar.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Mantener todas las categorías habilitadas y agregar ejemplos few-shot para mejorar la precisión de cada categoría durante las próximas semanas.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Aplicar una reducción uniforme de estrictez a todas las categorías para bajar la tasa general de falsos positivos.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g24", "source": "guide", "domain": 4, "scenario": "Claude Code para Integración Continua", "situation": "Tu revisión automatizada genera sugerencias de casos de prueba para cada PR. Revisando un PR que agrega seguimiento de finalización de cursos, Claude sugiere 10 casos de prueba, pero la retroalimentación del desarrollador muestra que 6 duplican escenarios ya cubiertos por la suite de pruebas existente. ¿Qué cambio reduce más efectivamente las sugerencias duplicadas?", "question": "¿Qué cambio es más efectivo?", "options": [{"letter": "A", "text": "Incluir el archivo de pruebas existente en el contexto para que Claude pueda determinar qué escenarios ya están cubiertos.", "correct": true, "explanation": "Incluir el archivo de pruebas existente corrige la causa raíz de la duplicación: Claude solo puede evitar sugerir escenarios ya cubiertos si sabe qué pruebas ya existen. Esto le da a Claude la información necesaria para proponer pruebas genuinamente nuevas y valiosas."}, {"letter": "B", "text": "Reducir el número solicitado de sugerencias de 10 a 5, asumiendo que Claude prioriza primero los casos más valiosos.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Agregar instrucciones dirigiendo a Claude a enfocarse exclusivamente en casos límite y condiciones de error en lugar de rutas de éxito.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Implementar post-procesamiento que filtre sugerencias cuyas descripciones coincidan con nombres de pruebas existentes mediante solapamiento de palabras clave.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g25", "source": "guide", "domain": 4, "scenario": "Claude Code para Integración Continua", "situation": "Después de que una revisión automatizada inicial identifica 12 hallazgos, un desarrollador hace commits nuevos para abordar problemas. Al volver a ejecutar la revisión se producen 8 hallazgos, pero los desarrolladores reportan que 5 duplican comentarios anteriores sobre código que ya fue corregido en los nuevos commits. ¿Cuál es la forma más efectiva de eliminar esta retroalimentación redundante manteniendo la exhaustividad?", "question": "¿Cuál es la forma más efectiva de eliminar la retroalimentación redundante?", "options": [{"letter": "A", "text": "Ejecutar la revisión solo cuando se crea el PR y en el estado final pre-merge, omitiendo commits intermedios.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Agregar un filtro de post-procesamiento que elimine hallazgos que coincidan con anteriores por rutas de archivo y descripciones de problemas antes de publicar comentarios.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Restringir el alcance de la revisión a archivos cambiados en el push más reciente, excluyendo archivos de commits anteriores.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Incluir los hallazgos de revisión anteriores en el contexto e instruir a Claude para reportar solo problemas nuevos o aún sin resolver.", "correct": true, "explanation": "Incluir los hallazgos de revisión previos en el contexto permite a Claude distinguir problemas nuevos de los ya abordados en commits recientes. Esto preserva la exhaustividad de la revisión mientras usa el razonamiento de Claude para evitar retroalimentación redundante sobre código corregido."}], "correct": "D"}, {"id": "g27", "source": "guide", "domain": 4, "scenario": "Claude Code para Integración Continua", "situation": "Un pull request cambia 14 archivos en un módulo de seguimiento de inventario. Una revisión de una sola pasada que analiza todos los archivos juntos produce resultados inconsistentes: retroalimentación detallada en algunos archivos pero comentarios superficiales en otros, errores obvios omitidos y retroalimentación contradictoria (un patrón se marca en un archivo pero código idéntico se aprueba en otro archivo del mismo PR). ¿Cómo deberías reestructurar la revisión?", "question": "¿Cómo deberías reestructurar la revisión?", "options": [{"letter": "A", "text": "Ejecutar tres pasadas independientes de revisión completa del PR y marcar solo problemas que aparezcan en al menos dos de las tres ejecuciones.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Dividir en pasadas enfocadas: revisar cada archivo individualmente para problemas locales, luego ejecutar una pasada separada orientada a la integración para examinar flujos de datos entre archivos.", "correct": true, "explanation": "Las pasadas enfocadas por archivo abordan la causa raíz—dilución de atención—asegurando profundidad consistente y detección confiable de problemas locales. Una pasada separada orientada a la integración cubre luego preocupaciones entre archivos como dependencias e interacciones de flujo de datos."}, {"letter": "C", "text": "Requerir que los desarrolladores dividan PRs grandes en envíos más pequeños de 3–4 archivos antes de ejecutar la revisión automatizada.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Cambiar a un modelo más grande con una ventana de contexto mayor para que pueda prestar atención suficiente a los 14 archivos en una sola pasada.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g28", "source": "guide", "domain": 4, "scenario": "Claude Code para Integración Continua", "situation": "Tu revisión automatizada de código promedia 15 hallazgos por pull request, y los desarrolladores reportan una tasa de falsos positivos del 40%. El cuello de botella es el tiempo de investigación: los desarrolladores deben hacer clic en cada hallazgo para leer la justificación de Claude antes de decidir si corregir o descartar. Tu CLAUDE.md ya contiene reglas exhaustivas para patrones aceptables, y los stakeholders rechazaron cualquier enfoque que filtre hallazgos antes de que los vean los desarrolladores. ¿Qué cambio aborda mejor el tiempo de investigación?", "question": "¿Qué cambio aborda mejor el tiempo de investigación?", "options": [{"letter": "A", "text": "Requerir que Claude incluya su justificación y estimación de confianza directamente en cada hallazgo.", "correct": true, "explanation": "Incluir la justificación y la confianza directamente en cada hallazgo reduce el tiempo de investigación al permitir que los desarrolladores triien rápidamente sin abrir cada hallazgo. Satisface la restricción de \"no filtrar\" porque todos los hallazgos permanecen visibles mientras se acelera la toma de decisiones del desarrollador."}, {"letter": "B", "text": "Agregar un post-procesador que analice patrones de hallazgos y suprima automáticamente aquellos que coincidan con firmas históricas de falsos positivos.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Categorizar los hallazgos como \"problemas bloqueantes\" vs \"sugerencias\", con diferentes requisitos de revisión por nivel.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Configurar Claude para mostrar solo hallazgos de alta confianza, filtrando marcadores inciertos antes de que los vean los desarrolladores.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g29", "source": "guide", "domain": 4, "scenario": "Claude Code para Integración Continua", "situation": "El análisis de tu revisión automatizada de código muestra grandes diferencias en las tasas de falsos positivos por categoría de hallazgo: hallazgos de seguridad/corrección tienen 8% de falsos positivos, hallazgos de rendimiento 18%, hallazgos de estilo/nomenclatura 52% y hallazgos de documentación 48%. Las encuestas a desarrolladores muestran creciente desconfianza—muchos comienzan a descartar hallazgos sin leer porque \"la mitad están mal\". Las categorías con altos falsos positivos erosionan la confianza en categorías precisas. ¿Qué enfoque restaura mejor la confianza del desarrollador mientras mejora el sistema?", "question": "¿Qué enfoque restaura mejor la confianza del desarrollador?", "options": [{"letter": "A", "text": "Deshabilitar temporalmente categorías con altos falsos positivos (estilo, nomenclatura, documentación) y mantener solo categorías de alta precisión mientras se mejoran los prompts.", "correct": true, "explanation": "Deshabilitar temporalmente las categorías con altos falsos positivos detiene inmediatamente la erosión de confianza al eliminar hallazgos ruidosos que hacen que los desarrolladores descarten todo, mientras se preserva el valor de las categorías de alta precisión como seguridad y corrección. También crea espacio para mejorar los prompts de las categorías problemáticas antes de rehabilitarlas."}, {"letter": "B", "text": "Mantener todas las categorías habilitadas pero mostrar puntuaciones de confianza con cada hallazgo para que los desarrolladores decidan qué investigar.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Mantener todas las categorías habilitadas y agregar ejemplos few-shot para mejorar la precisión de cada categoría durante las próximas semanas.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Aplicar una reducción uniforme de estrictez a todas las categorías para bajar la tasa general de falsos positivos.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g30", "source": "guide", "domain": 4, "scenario": "Claude Code para Integración Continua", "situation": "Tu equipo quiere reducir los costos de API para análisis automatizado. Actualmente, las llamadas síncronas a Claude soportan dos flujos: (1) una verificación pre-merge bloqueante que debe completarse antes de que los desarrolladores puedan hacer merge, y (2) un informe de deuda técnica generado durante la noche para revisión a la mañana siguiente. Tu gerente propone mover ambos a la Message Batches API para ahorrar 50%. ¿Cómo deberías evaluar esta propuesta?", "question": "¿Cómo deberías evaluar esta propuesta?", "options": [{"letter": "A", "text": "Mover ambos a procesamiento en lote con respaldo a llamadas síncronas si los lotes tardan demasiado.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Mover ambos flujos a procesamiento en lote con sondeo de estado para verificar la finalización.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Usar procesamiento en lote solo para los informes de deuda técnica; mantener las llamadas síncronas para las verificaciones pre-merge.", "correct": true, "explanation": "El procesamiento de la Message Batches API puede tardar hasta 24 horas sin SLA de latencia, lo cual es aceptable para informes nocturnos de deuda técnica pero inaceptable para verificaciones pre-merge bloqueantes donde los desarrolladores esperan. Esto empareja cada flujo con la API correcta según los requisitos de latencia."}, {"letter": "D", "text": "Mantener llamadas síncronas para ambos flujos para evitar problemas con el ordenamiento de resultados de lotes.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g31", "source": "guide", "domain": 4, "scenario": "Generación de código con Claude Code", "situation": "Le pediste a Claude Code que implementara una función que transforme respuestas de API a un formato interno normalizado. Después de dos iteraciones, la estructura de salida aún no coincide con las expectativas—algunos campos están anidados de forma diferente y las marcas de tiempo están formateadas incorrectamente. Describiste los requisitos en prosa, pero Claude los interpreta de forma diferente cada vez.", "question": "¿Qué enfoque es más efectivo para la siguiente iteración?", "options": [{"letter": "A", "text": "Escribir un esquema JSON que describa la estructura de salida esperada y validar la salida de Claude contra él después de cada iteración.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Proporcionar 2–3 ejemplos concretos de entrada-salida que muestren la transformación esperada para respuestas de API representativas.", "correct": true, "explanation": "Los ejemplos concretos de entrada-salida eliminan la ambigüedad inherente a las descripciones en prosa al mostrar a Claude los resultados exactos de transformación esperados. Esto aborda directamente la causa raíz—mala interpretación de requisitos textuales—proporcionando patrones inequívocos para anidamiento de campos y formato de marcas de tiempo."}, {"letter": "C", "text": "Reescribir los requisitos con mayor precisión técnica, especificando mapeos exactos de campos, reglas de anidamiento y cadenas de formato de marca de tiempo.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Pedir a Claude que explique su comprensión actual de los requisitos para identificar dónde divergen las interpretaciones.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g49", "source": "guide", "domain": 4, "scenario": "Agente de soporte al cliente", "situation": "Tu agente logra 55% de resolución en primer contacto, muy por debajo del objetivo del 80%. Los registros muestran que escala casos simples (reemplazos estándar para mercancía dañada con prueba fotográfica) mientras intenta manejar autónomamente situaciones complejas que requieren excepciones de política. ¿Cuál es la forma más efectiva de mejorar la calibración de escalación?", "question": "¿Cuál es la forma más efectiva de mejorar la calibración de escalación?", "options": [{"letter": "A", "text": "Requerir que el agente se autocalifique en confianza en una escala de 1–10 antes de cada respuesta y enrute automáticamente a humanos cuando la confianza caiga por debajo de un umbral.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Desplegar un modelo clasificador separado entrenado en tickets históricos para predecir qué solicitudes necesitan escalación antes de que el agente principal comience a procesarlas.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Agregar criterios de escalación explícitos al prompt del sistema con ejemplos few-shot que muestren cuándo escalar versus resolver autónomamente.", "correct": true, "explanation": "Los criterios de escalación explícitos con ejemplos few-shot abordan directamente la causa raíz—límites de decisión poco claros entre casos simples y complejos. Es la primera intervención más proporcional y efectiva que enseña al agente cuándo escalar y cuándo resolver autónomamente sin infraestructura adicional."}, {"letter": "D", "text": "Implementar análisis de sentimiento para determinar el nivel de frustración del cliente y escalar automáticamente más allá de un umbral de sentimiento negativo.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g52", "source": "guide", "domain": 4, "scenario": "Agente de soporte al cliente", "situation": "Las métricas de producción muestran que al resolver disputas complejas de facturación o devoluciones de múltiples pedidos, los puntajes de satisfacción del cliente son 15% más bajos que para casos simples—incluso cuando la resolución es técnicamente correcta. El análisis de causa raíz muestra que el agente proporciona soluciones precisas pero explica la justificación de forma inconsistente: a veces omitiendo detalles de política relevantes, a veces perdiendo información de cronograma o próximos pasos. Las brechas de contexto específicas varían caso por caso. Quieres mejorar la calidad de las soluciones sin agregar supervisión humana. ¿Qué enfoque es más efectivo?", "question": "¿Qué enfoque es más efectivo?", "options": [{"letter": "A", "text": "Agregar una etapa de autocrítica donde el agente evalúe un borrador de respuesta para completitud—asegurando que resuelva el problema del cliente, incluya contexto relevante y anticipe preguntas de seguimiento.", "correct": true, "explanation": "Una etapa de autocrítica (el patrón evaluador-optimizador) aborda directamente la inconsistencia en completitud de explicación al forzar al agente a evaluar su propio borrador contra criterios concretos—como contexto de política, cronogramas y próximos pasos—antes de presentarlo. Esto detecta brechas específicas de caso sin supervisión humana."}, {"letter": "B", "text": "Agregar una etapa de confirmación donde el agente pregunte \"¿Esto resuelve completamente tu problema?\" antes de cerrar, permitiendo a los clientes solicitar información adicional si la necesitan.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Actualizar el modelo de Haiku a Sonnet para casos complejos, enrutando según una métrica de complejidad definida.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Implementar ejemplos few-shot en el prompt del sistema que muestren explicaciones completas para cinco tipos comunes de casos complejos, demostrando cómo incluir contexto de política, cronogramas y próximos pasos.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g56", "source": "guide", "domain": 4, "scenario": "Agente de soporte al cliente", "situation": "Los registros de producción muestran un patrón consistente: cuando los clientes incluyen la palabra \"cuenta\" en su mensaje (por ejemplo, \"Quiero verificar mi cuenta por un pedido que hice ayer\"), el agente llama a `get_customer` primero el 78% del tiempo. Cuando los clientes formulan solicitudes similares sin \"cuenta\" (por ejemplo, \"Quiero verificar un pedido que hice ayer\"), llama a `lookup_order` primero el 93% del tiempo. Las descripciones de herramientas son claras e inequívocas. ¿Cuál es la causa raíz más probable de esta discrepancia?", "question": "¿Cuál es la causa raíz más probable?", "options": [{"letter": "A", "text": "El prompt del sistema contiene instrucciones sensibles a palabras clave que dirigen el comportamiento basadas en términos como \"cuenta\", creando patrones no intencionados de selección de herramientas.", "correct": true, "explanation": "El patrón sistemático impulsado por palabras clave (78% vs 93%) indica fuertemente lógica de enrutamiento explícita en el prompt del sistema reaccionando a la palabra \"cuenta\" y dirigiendo al agente hacia herramientas relacionadas con clientes. Como las descripciones de herramientas ya son claras, la discrepancia apunta a instrucciones a nivel de prompt creando dirección de comportamiento no intencionada."}, {"letter": "B", "text": "El entrenamiento base del modelo crea asociaciones entre la terminología \"cuenta\" y operaciones relacionadas con clientes que sobrescriben las descripciones de herramientas.", "correct": false, "explanation": ""}, {"letter": "C", "text": "El modelo necesita más datos de entrenamiento sobre mensajes multi-concepto y debería ser ajustado en ejemplos que contengan terminología de cuenta y pedido.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Las descripciones de herramientas necesitan ejemplos negativos adicionales que especifiquen cuándo NO usar cada herramienta para prevenir esta confusión inducida por palabras clave.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g60", "source": "guide", "domain": 4, "scenario": "Agente de soporte al cliente", "situation": "Los registros de producción muestran que el agente a veces elige `get_customer` cuando `lookup_order` sería más apropiado, especialmente para consultas ambiguas como \"Necesito ayuda con mi compra reciente\". Decides agregar ejemplos few-shot al prompt del sistema para mejorar la selección de herramientas. ¿Qué enfoque aborda más efectivamente el problema?", "question": "¿Qué enfoque es más efectivo?", "options": [{"letter": "A", "text": "Agregar guía explícita de \"usar cuando\" y \"no usar cuando\" en cada descripción de herramienta cubriendo casos ambiguos.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Agregar ejemplos agrupados por herramienta—todos los escenarios de `get_customer` juntos, luego todos los escenarios de `lookup_order`.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Agregar 4–6 ejemplos dirigidos a escenarios ambiguos, cada uno con justificación de por qué se eligió una herramienta sobre alternativas plausibles.", "correct": true, "explanation": "Dirigir los ejemplos few-shot a los escenarios ambiguos específicos donde ocurren los errores, con justificación explícita de por qué una herramienta es preferible a las alternativas, enseña al modelo el proceso comparativo de decisión necesario para casos límite. Esto es más efectivo que ejemplos genéricos o reglas declarativas."}, {"letter": "D", "text": "Agregar 10–15 ejemplos de solicitudes claras e inequívocas demostrando la elección correcta de herramienta para escenarios típicos para cada herramienta.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g69", "source": "guide", "domain": 4, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "Durante las pruebas de QA, Claude sigue las pautas del prompt del sistema durante los primeros 10–15 turnos, pero las respuestas posteriores se desvían. La conversación sigue dentro de los límites de tokens.", "question": "¿Cuál es la mejor solución?", "options": [{"letter": "A", "text": "Mover las pautas de comportamiento al primer mensaje del usuario.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Iniciar una nueva conversación después de 20 turnos.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Insertar mensajes de rol de usuario reforzando las pautas en puntos de interrupción de la conversación.", "correct": true, "explanation": "La inyección periódica de recordatorios de comportamiento combate directamente la deriva de instrucciones reestableciendo restricciones a intervalos regulares a medida que se acumula el historial. Mover las pautas al primer mensaje del usuario (A) reduce su autoridad. La validación post-respuesta (D) es correctiva en lugar de preventiva y añade latencia significativa."}, {"letter": "D", "text": "Usar validación post-respuesta para regenerar respuestas no conformes.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g71", "source": "guide", "domain": 4, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "Tu asistente debe mantener un tono entusiasta, explicar su razonamiento y hacer preguntas aclaratorias. ¿Dónde deben definirse estas pautas de comportamiento?", "question": "¿Dónde deben definirse estas pautas de comportamiento?", "options": [{"letter": "A", "text": "Antepuestas a cada mensaje del usuario.", "correct": false, "explanation": ""}, {"letter": "B", "text": "En el prompt del sistema.", "correct": true, "explanation": "El prompt del sistema está específicamente diseñado para restricciones y pautas de comportamiento persistentes que aplican a lo largo de toda la conversación. Anteponer a cada mensaje del usuario (A) es sobrecarga redundante. El primer mensaje del asistente (C) es poco confiable porque el modelo puede desviarse de sus propias declaraciones anteriores. Las variables de entorno (D) no tienen efecto en el comportamiento del modelo."}, {"letter": "C", "text": "En el primer mensaje del asistente.", "correct": false, "explanation": ""}, {"letter": "D", "text": "En variables de entorno.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g72", "source": "guide", "domain": 4, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "Los usuarios reportan aperturas de respuesta repetitivas como \"¡Claro!\" y \"¡Con gusto te ayudo!\"", "question": "¿Cuál es el enfoque más efectivo?", "options": [{"letter": "A", "text": "Anteponer un mensaje de asistente parcial con una apertura de respuesta directa.", "correct": true, "explanation": "Prellenar la respuesta del asistente con el inicio de una respuesta directa previene los patrones de saludo a nivel de generación—el modelo continúa desde el prellenado en lugar de generar nuevas frases de apertura. Las instrucciones del prompt del sistema (D) pueden ayudar pero son menos confiables. El post-procesamiento (C) es una solución frágil. La temperatura (B) controla la aleatoriedad, no patrones de frases específicos."}, {"letter": "B", "text": "Reducir la configuración de temperatura.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Post-procesar respuestas para eliminar saludos.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Agregar instrucciones al prompt del sistema para evitar esas frases.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g73", "source": "guide", "domain": 4, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "Un webhook notifica a tu sistema que el paquete de un usuario ha sido enviado mientras el usuario está chateando activamente. Quieres que el asistente incorpore esto naturalmente en la siguiente respuesta.", "question": "¿Cuál es el mejor enfoque?", "options": [{"letter": "A", "text": "Agregar el estado de envío al prompt del sistema.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Enviar un mensaje sintético de usuario inmediato.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Forzar al asistente a llamar a una herramienta de estado en cada turno.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Anteponer la actualización de estado como prefijo al siguiente mensaje del usuario.", "correct": true, "explanation": "Prefijar la actualización de estado al siguiente mensaje del usuario inyecta contexto en tiempo real en un límite de conversación natural sin interrumpir el flujo. Modificar el prompt del sistema (A) requiere reconstruir la sesión. Un mensaje sintético de usuario (B) puede romper el flujo natural del diálogo. Forzar una llamada de herramienta en cada turno (C) es costoso cuando los eventos son raros."}], "correct": "D"}, {"id": "g74", "source": "guide", "domain": 4, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "Los usuarios frecuentemente envían solicitudes como \"Reserva un lugar para la fiesta.\" El asistente hace 4+ preguntas aclaratorias, causando un 35% de abandono.", "question": "¿Qué enfoque mejora mejor el equilibrio?", "options": [{"letter": "A", "text": "Proceder con valores predeterminados ocultos.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Hacer todas las preguntas aclaratorias en un mensaje compuesto.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Declarar suposiciones explícitamente y proceder invitando correcciones.", "correct": true, "explanation": "Declarar suposiciones explícitamente y proceder le da al usuario una respuesta inmediata y útil mientras preserva su capacidad de corregir suposiciones incorrectas. Los valores predeterminados ocultos (A) dejan al usuario sin saber qué se asumió. Una lista de preguntas compuesta (B) sigue demandando esfuerzo inicial del usuario. Un formulario estructurado (D) agrega más fricción, no menos."}, {"letter": "D", "text": "Usar un formulario de admisión estructurado.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g76", "source": "guide", "domain": 4, "scenario": "Patrones de arquitectura de IA conversacional", "situation": "Los usuarios hacen solicitudes vagas como \"¿Puedes ayudar con el informe?\" El asistente responde preguntando múltiples preguntas (¿qué informe? ¿qué ayuda? ¿cuál es el plazo?), causando un 40% de abandono.", "question": "¿Cuál es la mejor solución?", "options": [{"letter": "A", "text": "Hacer suposiciones razonables, declararlas explícitamente y ofrecer ajustes.", "correct": true, "explanation": "Proceder con suposiciones declaradas razonables elimina el intercambio de ida y vuelta por completo mientras mantiene al usuario informado y en control. Las interpretaciones silenciosas predefinidas (C) confunden a los usuarios cuando la respuesta no coincide con su intención. Un límite de una pregunta (D) sigue requiriendo turnos de ida y vuelta. Un modelo de clasificación más pequeño (B) agrega latencia y complejidad de infraestructura sin resolver el problema central de UX."}, {"letter": "B", "text": "Clasificar la ambigüedad con un modelo más pequeño antes de responder.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Usar interpretaciones predefinidas sin declarar suposiciones.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Limitar al asistente a una pregunta aclaratoria por turno.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "m8", "source": "mock", "domain": 4, "scenario": null, "situation": "Las revisiones en producción revelan un manejo inconsistente de la incertidumbre en los reportes finales. A veces los hallazgos contradictorios de los subagentes se sintetizan en una única afirmación contundente (perdiendo matices), mientras que otras veces los reportes se exceden en salvedades con calificativos excesivos (volviéndose poco útiles). Cuando el agente de búsqueda web devuelve \"los analistas de la industria estiman un tamaño de mercado de $50B (la metodología varía)\" y el agente de análisis de documentos devuelve \"un estudio revisado por pares estima 35B (±7B, IC del 95%)\", el coordinador o elige uno arbitrariamente o produce afirmaciones vagas como \"el mercado podría ser de 35B−50B según diversos factores\".", "question": "¿Qué enfoque sistemático aborda mejor esto?", "options": [{"letter": "A", "text": "Configurar los subagentes para que solo reporten hallazgos que superen un umbral de alta confianza, filtrando la información incierta antes de que llegue al coordinador.", "correct": false, "explanation": "Filtrar descarta evidencia útil pero incierta. No ayuda al agente de síntesis a razonar sobre los conflictos: simplemente los esconde."}, {"letter": "B", "text": "Implementar una capa de calibración de confianza que normalice las expresiones de incertidumbre de los subagentes a puntajes de probabilidad estandarizados (0.0-1.0), y luego promediar los hallazgos ponderados por su confianza calibrada.", "correct": false, "explanation": "Colapsar los IC revisados por pares y las estimaciones de analistas en un único número promediado destruye la diferencia metodológica, que es justamente el punto clave."}, {"letter": "C", "text": "Instruir al agente de síntesis para que estructure los reportes con secciones explícitas que distingan los hallazgos bien establecidos de los controvertidos, preservando las caracterizaciones originales de las fuentes y el contexto metodológico.", "correct": true, "explanation": "Correcto. Una estructura de reporte que conserva el contexto metodológico y separa las afirmaciones consolidadas de las controvertidas es la forma de lograr matices sin excederse en salvedades."}, {"letter": "D", "text": "Añadir un subagente de verificación que cruce los hallazgos entre fuentes, pasando a la síntesis solo las afirmaciones corroboradas por al menos dos fuentes independientes.", "correct": false, "explanation": "El mínimo de dos fuentes descarta hallazgos legítimos de una sola fuente y no resuelve estimaciones genuinamente conflictivas con metodologías distintas. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m11", "source": "mock", "domain": 4, "scenario": null, "situation": "Un usuario está ampliando el sistema de investigación más allá de su único agente de búsqueda web añadiendo fuentes de datos especializadas. Agrega un agente de API financiera que devuelve JSON estructurado con ingresos, márgenes y tasas de crecimiento; un agente de monitoreo de noticias que devuelve resúmenes en prosa de desarrollos recientes; y un agente de análisis de patentes que devuelve listas estructuradas de áreas tecnológicas. El agente de síntesis combina todo esto en informes ejecutivos. Actualmente, convierte todo en viñetas, lo que hace que las comparaciones financieras pierdan claridad tabular y que los resúmenes de noticias pierdan su fluidez narrativa.", "question": "¿Qué cambio mejoraría más la calidad de los informes?", "options": [{"letter": "A", "text": "Estandarizar todas las salidas de los subagentes a resúmenes en prosa con citas en línea.", "correct": false, "explanation": "Aplanar los datos financieros estructurados a prosa pierde la comparabilidad que quieres en un informe ejecutivo."}, {"letter": "B", "text": "Añadir una capa de conversión de formato entre los subagentes y la síntesis que transforme todas las salidas a una representación intermedia común.", "correct": false, "explanation": "Una única representación intermedia suele resultar demasiado con pérdidas: o conserva la estructura (las noticias sufren) o conserva la prosa (las tablas sufren). La solución es un renderizado según el tipo, no la uniformidad."}, {"letter": "C", "text": "Actualizar el agente de síntesis para que renderice cada tipo de contenido de forma apropiada: los datos financieros como tablas, las noticias como prosa.", "correct": true, "explanation": "Correcto. Los informes ejecutivos necesitan un renderizado mixto: tablas para los números, prosa para la narrativa. Pedirle a la síntesis que preserve el formato nativo de cada entrada es la abstracción correcta."}, {"letter": "D", "text": "Estandarizar todas las salidas de los subagentes a JSON con campos para afirmación, evidencia, fuente y confianza.", "correct": false, "explanation": "Forzar las noticias, cargadas de prosa, a un esquema de afirmación/evidencia despoja la fluidez narrativa que los ejecutivos realmente leen. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m46", "source": "mock", "domain": 4, "scenario": null, "situation": "Tu sistema de extracción procesa dos tipos de documentos: reportes mensuales estándar (que se archivan tras procesarse) y reportes de excepciones urgentes (que deben disparar alertas de negocio dentro de los 30 minutos de su recepción). Ambos usan el mismo esquema JSON. Quieres minimizar los costos de API cumpliendo a la vez los requisitos de latencia.", "question": "¿Cómo deberías diseñar la arquitectura del pipeline de procesamiento?", "options": [{"letter": "A", "text": "Enviar todos los documentos a la Messages API en tiempo real para garantizar una latencia de procesamiento consistente entre los tipos de documentos.", "correct": false, "explanation": "Consistente pero costoso. Los reportes mensuales estándar no necesitan latencia en tiempo real y no deberían pagar por ella."}, {"letter": "B", "text": "Enviar todos los documentos a la `Batch API` con `custom_ids` para su seguimiento. Cuando lleguen los resultados, procesar de inmediato los documentos urgentes y disparar alertas con retraso para las excepciones.", "correct": false, "explanation": "El batch tiene una ventana de hasta 24 horas: los SLA de alerta de 30 minutos sobre los reportes de excepciones no pueden cumplirse enrutándolos por batch."}, {"letter": "C", "text": "Encolar todos los documentos y enviar lotes cada hora, marcando los documentos urgentes para un manejo acelerado cuando regresen los resultados del lote.", "correct": false, "explanation": "Los lotes por hora siguen sujetos al SLO del batch y no garantizan la ventana de alerta de 30 minutos para las excepciones."}, {"letter": "D", "text": "Enrutar los reportes estándar a la `Batch API` para ahorrar 50% en costos, y enrutar los reportes de excepciones urgentes a la Messages API en tiempo real.", "correct": true, "explanation": "Correcto. Ajusta el perfil de latencia a la urgencia del documento: batch para el grueso (barato), tiempo real para las excepciones sensibles a la latencia (rápido). Minimiza el costo cumpliendo el SLA. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m47", "source": "mock", "domain": 4, "scenario": null, "situation": "Tu esquema incluye un campo skills: string[]. El monitoreo en producción revela tres problemas de consistencia: (1) frases compuestas como \"Python and SQL\" a veces se mantienen como una sola entrada y a veces se dividen; (2) ocasionalmente aparecen en las extracciones habilidades implícitas pero no declaradas; (3) documentos similares producen longitudes de array muy dispares (5-10 vs 40+ entradas). Tu prompt actualmente dice \"Extract all skills mentioned.\"", "question": "¿Cuál es la mejora más efectiva?", "options": [{"letter": "A", "text": "Agregar ejemplos few-shot que demuestren el manejo de frases compuestas, criterios explícitos de mención y la granularidad apropiada de las entradas.", "correct": true, "explanation": "Correcto. Los tres problemas tienen que ver con cómo interpreta el modelo qué cuenta como 'una habilidad'. Los ejemplos few-shot enseñan el patrón de forma concreta: dividir o no, mencionado o inferido, granularidad apropiada."}, {"letter": "B", "text": "Agregar restricciones: \"Extract 10-20 skills maximum, one skill per entry, only explicitly named skills.\"", "correct": false, "explanation": "Los topes de conteo rígidos son arbitrarios y pueden forzar al modelo a descartar habilidades reales o inventar relleno para alcanzar el rango."}, {"letter": "C", "text": "Agregar una normalización posterior a la extracción que mapee las habilidades a una taxonomía canónica y deduplique entradas similares.", "correct": false, "explanation": "El postprocesamiento no puede arreglar las habilidades inferidas-pero-no-mencionadas ni elegir la división correcta para 'Python and SQL': esa decisión debe tomarse en el momento de la extracción."}, {"letter": "D", "text": "Enriquecer el esquema a {skill: string, confidence: float, `source_quote`: string}[] para capturar metadatos de la extracción.", "correct": false, "explanation": "Es una señal útil, pero no aborda la inconsistencia subyacente en cómo se interpretan las habilidades en primer lugar. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m48", "source": "mock", "domain": 4, "scenario": null, "situation": null, "question": "Tu sistema ha operado con revisión humana del 100% durante 3 meses. El análisis muestra que las extracciones con confianza del modelo >90% tienen un 97% de precisión en general. Para reducir la carga de trabajo de los revisores, planeas automatizar las extracciones de alta confianza. Antes de desplegar, ¿qué paso de validación es el más crítico?", "options": [{"letter": "A", "text": "Analizar la precisión por tipo de documento y por campo para verificar que las extracciones de alta confianza se desempeñan de forma consistente en todos los segmentos, no solo en el agregado.", "correct": true, "explanation": "Correcto. La precisión agregada oculta fallos por segmento: un tipo de documento podría estar en 70% mientras otros están en 99%. Enrutar automáticamente solo por el número global arriesga errores sistémicos en los segmentos débiles."}, {"letter": "B", "text": "Comparar la precisión en distintos umbrales de confianza (85%, 90%, 95%) para encontrar el corte óptimo que maximice la automatización minimizando los errores.", "correct": false, "explanation": "Ajustar el umbral vale la pena, pero solo después de saber que la precisión se mantiene de manera uniforme entre los segmentos; de lo contrario estás optimizando un número que miente."}, {"letter": "C", "text": "Ejecutar un piloto de dos semanas enrutando el 25% de las extracciones de alta confianza directamente a los sistemas posteriores y monitorear los reportes de errores.", "correct": false, "explanation": "Un piloto es buena práctica, pero va después del análisis por segmento: si un segmento está sistemáticamente equivocado, lo descubrirás perjudicando a los usuarios."}, {"letter": "D", "text": "Verificar que el 97% de precisión cumple los requisitos de todos los sistemas posteriores que consumen los datos extraídos.", "correct": false, "explanation": "Es una pregunta importante de producto, pero asume que el 97% se mantiene en todas partes; de nuevo, eso es lo que verifica primero el análisis por segmento. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m49", "source": "mock", "domain": 4, "scenario": null, "situation": "Tu pipeline de extracción procesa contratos que con frecuencia incluyen enmiendas. Cuando un contrato contiene tanto los términos originales como enmiendas posteriores (por ejemplo, la cláusula original especifica \"30-day payment terms\" mientras que la Enmienda 1 lo cambia a \"45 days\"), el modelo extrae de forma inconsistente uno u otro valor sin indicar cuál aplica.", "question": "¿Cuál es el enfoque más efectivo para mejorar la precisión de extracción en documentos con enmiendas?", "options": [{"letter": "A", "text": "Rediseñar el esquema para que los campos enmendados capturen múltiples valores, cada uno con su ubicación de origen y fecha de entrada en vigor.", "correct": true, "explanation": "Correcto. Las enmiendas son estructuralmente valores versionados. Un esquema con valor + ubicación de origen + fecha de entrada en vigor modela el dominio correctamente y deja de forzar al modelo a elegir uno."}, {"letter": "B", "text": "Agregar instrucciones al prompt para que siempre extraiga el valor de la enmienda más reciente e ignore los términos originales que fueron reemplazados.", "correct": false, "explanation": "Los consumidores posteriores a veces también necesitan el original (por ejemplo, para resolución de disputas). Codificar 'gana el más reciente' descarta eso."}, {"letter": "C", "text": "Preprocesar los documentos con un clasificador que identifique y elimine las secciones reemplazadas antes del paso principal de extracción.", "correct": false, "explanation": "Borrar secciones con un clasificador puede eliminar accidentalmente contenido que sigue teniendo vigencia legal: las enmiendas a menudo modifican subconjuntos de cláusulas."}, {"letter": "D", "text": "Implementar una validación posterior a la extracción que use coincidencia de patrones para detectar enmiendas y marcar esas extracciones para revisión manual.", "correct": false, "explanation": "Enruta cada contrato enmendado a un humano: es costoso, y aun así no le da a los sistemas posteriores una respuesta estructurada. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m50", "source": "mock", "domain": 4, "scenario": null, "situation": "Tu sistema de extracción implementa reintentos automáticos cuando falla la validación. En cada reintento, el error de validación específico se anexa al prompt. Este enfoque de reintento con retroalimentación de error resuelve la mayoría de los fallos en 2-3 intentos.", "question": "¿Para qué patrón de fallo serían MENOS efectivos los reintentos adicionales?", "options": [{"letter": "A", "text": "El modelo extrae las palabras clave como un objeto anidado organizado por categoría cuando el esquema requiere un array plano de strings", "correct": false, "explanation": "Un desajuste estructural que el modelo definitivamente puede corregir dada la retroalimentación sobre la forma esperada."}, {"letter": "B", "text": "El modelo extrae los conteos de citas como strings con formato de localización (\"1,234\") cuando el esquema requiere enteros", "correct": false, "explanation": "El número requerido está presente en el documento: el modelo solo necesita dejar de formatearlo. Fácil de arreglar con reintento por retroalimentación."}, {"letter": "C", "text": "El modelo extrae las fechas como strings de fecha y hora ISO 8601 (\"2023-03-15T00:00:00Z\") cuando el esquema requiere solo la porción de fecha (YYYY-MM-DD)", "correct": false, "explanation": "Un arreglo puramente de formato: el valor subyacente es correcto y el modelo puede recortar la porción de hora en el reintento."}, {"letter": "D", "text": "El modelo extrae \"et al.\" para los coautores cuando la lista completa solo existe en un documento externo que no está en la entrada", "correct": true, "explanation": "Correcto. Ninguna cantidad de reintentos le enseña al modelo información que no está en la entrada. El reintento con retroalimentación de error solo corrige errores que el modelo podría haber resuelto a partir de la fuente. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m51", "source": "mock", "domain": 4, "scenario": null, "situation": "Tu pipeline de extracción procesa menús de restaurantes y debe producir un JSON estructurado con campos para nombres de platos, descripciones, precios y etiquetas dietéticas. Algunos menús usan formatos inconsistentes: precios como \"$12\" vs \"12.00\", información dietética como íconos vs texto.", "question": "¿Cuál es el enfoque más confiable?", "options": [{"letter": "A", "text": "Usar llamadas de extracción separadas para cada campo para garantizar un manejo consistente de cada tipo.", "correct": false, "explanation": "Múltiples llamadas por menú multiplican el costo y la latencia, y pierden el contexto entre campos (por ejemplo, qué íconos dietéticos están junto a qué plato)."}, {"letter": "B", "text": "Extraer los datos tal cual y normalizar los formatos en código de postprocesamiento después de que Claude responda.", "correct": false, "explanation": "Postprocesar un blob crudo es frágil: el código determinista tiene que manejar cada permutación de formato. Es mejor dejar que el modelo normalice en el momento de la extracción."}, {"letter": "C", "text": "Solicitar múltiples intentos de extracción por documento y seleccionar el formato más común.", "correct": false, "explanation": "La votación por ensamblado es costosa y aun así puede elegir una mayoría con formato incorrecto."}, {"letter": "D", "text": "Definir un esquema de salida estricto e incluir reglas de normalización de formato en tu prompt.", "correct": true, "explanation": "Correcto. Un esquema estricto + reglas de normalización explícitas ('precios como decimal con dos posiciones', 'dietético como etiquetas enumeradas') permite al modelo extraer y normalizar en una sola pasada. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m52", "source": "mock", "domain": 4, "scenario": null, "situation": "Tu sistema extrae metadatos de eventos (fecha, ubicación, organizador, `attendee_count`) de artículos de noticias usando un esquema JSON con todos los campos anulables. Durante la evaluación, observas que el modelo genera con frecuencia valores plausibles pero incorrectos para campos no mencionados en el artículo; por ejemplo, produciendo \"500\" para `attendee_count` cuando la fuente no contiene información de asistencia.", "question": "¿Cuál es la forma más efectiva de reducir estas extracciones falsas?", "options": [{"letter": "A", "text": "Agregar un paso de postprocesamiento que use una segunda llamada al LLM para verificar que cada valor extraído existe en el documento fuente.", "correct": false, "explanation": "Una segunda pasada costosa para un comportamiento que puedes corregir en el origen: indícale al modelo que devuelva null cuando el campo no esté declarado."}, {"letter": "B", "text": "Agregar instrucciones al prompt para devolver null en cualquier campo cuya información no esté directamente declarada en la fuente.", "correct": true, "explanation": "Correcto. Los campos ya son anulables; el modelo solo necesita una instrucción explícita de preferir null sobre una conjetura plausible. Este es el arreglo estándar para la alucinación consciente del esquema."}, {"letter": "C", "text": "Hacer que todos los campos del esquema sean obligatorios (no anulables) con reglas de validación estrictas para asegurar que el modelo solo produzca datos verificables.", "correct": false, "explanation": "Los campos obligatorios fuerzan al modelo a inventar valores cuando falta información: lo opuesto a lo que quieres."}, {"letter": "D", "text": "Actualizar a un nivel de modelo más capaz con mejor seguimiento de instrucciones para reducir las tendencias de alucinación.", "correct": false, "explanation": "Agrega costo y aun así no le comunica al modelo tu política: devolver null en lugar de inventar. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m53", "source": "mock", "domain": 4, "scenario": null, "situation": "Tras implementar el uso de herramientas con definiciones de esquema estrictas, se eliminan los errores de sintaxis JSON, pero el 5% de las extracciones aún tienen JSON válido con arrays vacíos o valores null en campos obligatorios como citations y methodology. Una revisión puntual revela que los documentos fuente contienen esta información, pero en formatos variados: citas en línea vs. bibliografías, secciones de metodología vs. detalles incrustados en las introducciones.", "question": "¿Cuál es la forma más efectiva de abordar estos fallos?", "options": [{"letter": "A", "text": "Implementar lógica de reintento que reenvíe las solicitudes cuando la validación detecte campos obligatorios vacíos.", "correct": false, "explanation": "Reintentar con el mismo prompt no le enseñará de repente al modelo a reconocer una metodología incrustada en una introducción. La capacidad de extracción es la brecha."}, {"letter": "B", "text": "Construir una capa de postprocesamiento basada en regex que escanee los documentos fuente buscando patrones de citas y palabras clave de metodología, poblando los campos vacíos cuando el modelo falle en extraer.", "correct": false, "explanation": "Regex sobre prosa es frágil, omite los casos sutiles (metodología incrustada en la introducción) y entrega datos silenciosamente erróneos."}, {"letter": "C", "text": "Modificar tu esquema para hacer citations y methodology opcionales, y marcar los registros incompletos para revisión manual en lugar de fallar la validación.", "correct": false, "explanation": "Tapa el síntoma. Los campos realmente son obligatorios más adelante: enrutarlos a humanos cambia un problema por carga de trabajo de los revisores."}, {"letter": "D", "text": "Agregar ejemplos few-shot que demuestren extracciones de documentos con estructuras variadas, mostrando cómo identificar citas en distintos formatos y localizar detalles de metodología a través de distintos tipos de secciones.", "correct": true, "explanation": "Correcto. El modo de fallo es que el modelo no reconoce los formatos variados. Ejemplos concretos a lo largo de la distribución de formatos elevan directamente el recall sobre ese 5%. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m54", "source": "mock", "domain": 4, "scenario": null, "situation": "Tu pipeline de extracción procesa facturas y extrae líneas de detalle, subtotales, montos de impuestos y totales generales. Durante la evaluación, descubres que en el 18% de las extracciones la suma de los montos de las líneas extraídas no coincide con el total general extraído, a veces por errores de OCR en el documento fuente, a veces por errores de extracción del modelo. Los sistemas contables posteriores rechazan los registros con totales no coincidentes.", "question": "¿Cuál es el enfoque más efectivo para mejorar la confiabilidad de la extracción?", "options": [{"letter": "A", "text": "Agregar un campo \"`calculated_total`\" donde el modelo sume las líneas extraídas, junto con un campo \"`stated_total`\". Marcar los registros para revisión humana cuando los valores difieran.", "correct": true, "explanation": "Correcto. Capturar ambos valores convierte la discrepancia en una señal de primera clase: detectas los errores de OCR y los de extracción de manera uniforme, y puedes enrutar solo el 18% no coincidente a humanos."}, {"letter": "B", "text": "Extraer las líneas de detalle y los totales de forma independiente, y luego usar un modelo de validación separado para reconciliar las discrepancias determinando qué valores extraídos son más probablemente correctos.", "correct": false, "explanation": "Un modelo de reconciliación puede enmascarar los errores de OCR al elegir silenciosamente un número sobre otro: el sistema contable sigue recibiendo datos erróneos sin marcar."}, {"letter": "C", "text": "Agregar ejemplos few-shot que demuestren facturas donde las líneas extraídas suman correctamente al total declarado, animando al modelo a producir extracciones matemáticamente consistentes.", "correct": false, "explanation": "Puede empujar al modelo hacia la consistencia, pero cuando la fuente en sí es internamente inconsistente (errores de OCR), el modelo tiene que elegir un valor 'erróneo'."}, {"letter": "D", "text": "Implementar un postprocesamiento que ajuste automáticamente los montos de las líneas de detalle de forma proporcional cuando su suma no coincida con el total declarado.", "correct": false, "explanation": "Las reescrituras silenciosas de datos financieros son peligrosas: estarías fabricando líneas de detalle para un sistema contable posterior. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m56", "source": "mock", "domain": 4, "scenario": null, "situation": "Tu extracción usa el uso de herramientas con un esquema JSON donde `property_type` se define como un enum: ['house', 'apartment', 'condo', 'townhouse']. Tras el despliegue, el 8% de las extracciones falla la validación del esquema. La investigación revela que los listados mencionan muchos tipos de propiedad poco comunes —\"studio\", \"loft\", \"duplex\", \"mobile home\", \"tiny house\", \"converted warehouse\"— y siguen apareciendo nuevos tipos con regularidad.", "question": "¿Cuál es la solución más efectiva a largo plazo?", "options": [{"letter": "A", "text": "Expandir continuamente el enum para incluir los tipos de propiedad recién observados y agregar monitoreo para casos límite adicionales.", "correct": false, "explanation": "Mantenimiento del enum a lo 'topo': cada nuevo estilo de listado arriesga otro fallo de validación."}, {"letter": "B", "text": "Agregar un valor \"other\" a tu enum con un campo string `property_type_detail` separado para las especificaciones cuando se selecciona \"other\".", "correct": true, "explanation": "Correcto. Mantiene el enum sólido para los casos comunes (joins posteriores limpios) a la vez que ofrece una válvula de escape bien tipada que preserva el detalle. Estable a largo plazo."}, {"letter": "C", "text": "Cambiar `property_type` de un enum a un string de forma libre e implementar un paso de normalización en el postprocesamiento.", "correct": false, "explanation": "Pierde por completo la garantía de validación y empuja el problema de normalización hacia adelante sin un vocabulario canónico."}, {"letter": "D", "text": "Agregar ejemplos few-shot a tu prompt que demuestren cómo mapear los tipos de propiedad inesperados al valor de enum existente más cercano.", "correct": false, "explanation": "Forzar 'tiny house' a 'house' descarta distinciones reales más adelante: estás perdiendo información de forma silenciosa. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m57", "source": "mock", "domain": 4, "scenario": null, "situation": "Tu sistema de extracción analiza descripciones de productos de e-commerce para extraer especificaciones como dimensiones, peso y materiales en JSON. A pesar de tener un esquema bien definido, el modelo extrae de forma inconsistente el campo \"materials\": a veces devuelve \"cotton blend\", otras veces \"Cotton/Polyester mix\", y ocasionalmente omite el campo cuando la información del material está claramente presente en la fuente.", "question": "¿Cuál es la forma más efectiva de mejorar la consistencia de la extracción?", "options": [{"letter": "A", "text": "Hacer que el campo \"materials\" sea obligatorio en lugar de opcional en el esquema para forzar al modelo a extraer siempre un valor", "correct": false, "explanation": "La obligatoriedad no resuelve la inconsistencia de formato, y puede forzar valores inventados cuando la información del material falta genuinamente."}, {"letter": "B", "text": "Cambiar a un nivel de modelo más capaz, ya que la extracción inconsistente indica una capacidad insuficiente del modelo", "correct": false, "explanation": "Costoso, y no aborda la causa real: el modelo no conoce el formato de salida canónico que quieres."}, {"letter": "C", "text": "Establecer la temperatura en 0 para eliminar la aleatoriedad y garantizar salidas deterministas", "correct": false, "explanation": "El determinismo no define el formato correcto; solo hace que las respuestas con formato incorrecto sean consistentes."}, {"letter": "D", "text": "Agregar ejemplos few-shot que muestren 2-3 pares completos de entrada-salida con formatos estandarizados de descripción de materiales", "correct": true, "explanation": "Correcto. Los ejemplos few-shot demuestran el formato canónico exacto que quieres ('cotton/polyester' como lista normalizada), y también elevan el recall sobre la información de material que se estaba omitiendo. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m58", "source": "mock", "domain": 4, "scenario": null, "situation": "Los documentos llegan de forma continua a lo largo del horario laboral y requieren que se extraigan datos estructurados. Para reducir costos, quieres usar la `Message Batches API` (50% de descuento, ventana de procesamiento de hasta 24 horas). Tu SLA especifica que los resultados de extracción deben estar disponibles dentro de las 30 horas de la llegada del documento con una confiabilidad del 99.9%.", "question": "¿Qué estrategia de lotes es la más apropiada?", "options": [{"letter": "A", "text": "Enviar lotes cada 6
