ngineering/4-2-few-shot-prompting#build-exercise", "steps": [{"text": "Create a base extraction prompt with detailed instructions but no examples and test it against 10 documents with varied structures: tables, narrative paragraphs, mixed formats", "why": "Establishing a baseline without examples demonstrates the consistency problem the exam tests. Detailed instructions alone produce inconsistent output across varied document structures, which is the exact trigger for deploying few-shot examples.", "see": "Inconsistent extraction results across the 10 documents: fields extracted correctly from tables but empty or wrong from narrative paragraphs, different output formats across runs, and inconsistent handling of edge cases."}, {"text": "Record which fields are consistently empty or inconsistent across document structures", "why": "Identifying the specific failure patterns tells you exactly what your few-shot examples need to demonstrate. The exam tests whether you can diagnose the problem before prescribing the solution.", "see": "A table or log showing which fields fail on which document types. Typical pattern: dates extracted correctly from tables but missed in narrative text, amounts inconsistent when written in words rather than digits, line items empty when embedded in paragraphs."}, {"text": "Create 3 few-shot examples targeting the failing patterns — each must include reasoning explaining why the extraction was done that way", "why": "Examples with reasoning teach the model to generalise to novel patterns, not just match specific cases. Without reasoning, the model learns only surface-level pattern matching. The exam specifically tests that reasoning-included examples outperform input-output pairs.", "see": "Three examples, each showing a different document structure (table, narrative, mixed), with the correct extraction AND a reasoning section explaining how the data was located and why the extraction decisions were made."}, {"text": "Re-run the same 10 documents with the few-shot enhanced prompt and compare: empty field rate, format consistency, and extraction accuracy", "why": "Quantifying the improvement demonstrates the effectiveness of few-shot examples as the first-choice technique for consistency problems. The exam expects you to know that few-shot examples outperform additional instructions for this class of problem.", "see": "A measurable reduction in empty fields (especially on narrative documents), improved format consistency across document types, and higher overall extraction accuracy. The improvement should be most dramatic on the document types that previously failed."}, {"text": "Document which structural patterns benefit most from few-shot examples and which require different techniques like schema changes", "why": "The exam tests whether you can match the right technique to the right problem. Few-shot examples fix consistency and structural variety issues, but malformed JSON needs tool_use, fabricated values need nullable schemas, and sum discrepancies need validation loops.", "see": "A decision matrix showing which problem types improved with few-shot examples and which still need other interventions. Narrative extraction and format consistency should improve. Fabrication of missing data should not improve and needs schema changes instead."}], "file": "exercise-4-2.md", "starter": null}, {"id": "4.3", "title": "Build a Structured Extraction Tool with JSON Schema", "domain": 4, "difficulty": "Intermediate", "estimate": "45 minutes", "source": "https://claudecertificationguide.com/learn/4-prompt-engineering/4-3-structured-output#build-exercise", "steps": [{"text": "Define an extraction tool with a JSON schema: 3 required fields, 3 optional/nullable fields, an enum with unclear and other options, and a detail string field for the other category", "why": "Schema design directly prevents fabrication. Required fields pressure the model to invent values when information is absent. Optional/nullable fields allow honest null responses. This is the root cause fix for hallucinated extraction data.", "see": "A valid JSON schema with required array containing only the 3 always-present fields, nullable type definitions for optional fields, and an enum array including unclear and other alongside the standard categories."}, {"text": "Test with tool_choice auto and observe cases where the model returns text instead of calling the tool", "why": "The exam tests the distinction between auto, any, and forced tool_choice. Auto allows the model to respond conversationally instead of calling a tool, which means no guaranteed structured output. You need to see this failure mode firsthand.", "see": "At least one response where the model returns a text message describing the document contents instead of calling the extraction tool. This demonstrates why auto is unsuitable when you need guaranteed structured output."}, {"text": "Switch to tool_choice any and verify the model always returns structured output via a tool call", "why": "tool_choice any guarantees a tool call while letting the model choose which tool. This is the correct setting for guaranteed structured output when the document type is unknown, a key exam distinction from auto.", "see": "Every response has stop_reason of tool_use and contains a valid tool call with structured output conforming to your schema. No text-only responses."}, {"text": "Force a specific tool with tool_choice {type: tool, name: extract_metadata} and verify the mandatory extraction step runs", "why": "Forced tool selection ensures a mandatory first step executes regardless of the model decision. The exam tests this for scenarios like metadata extraction that must run before enrichment steps.", "see": "The response always calls the exact tool you specified, even when the document content might suggest a different tool would be more appropriate. The model has no flexibility in tool selection."}, {"text": "Process 5 documents — 3 with complete data and 2 with missing fields — and verify nullable fields return null rather than fabricated values", "why": "This validates the most important schema design principle: optional/nullable fields prevent fabrication. The exam specifically tests the scenario where required fields pressure the model to invent plausible-looking data for absent information.", "see": "For the 3 complete documents, all fields populated with correct values. For the 2 documents missing information, the nullable fields return null instead of fabricated values. No invented dates, amounts, or identifiers."}], "file": "exercise-4-3.md", "starter": ["extraction_tool.json", "{\n  \"name\": \"extract_document\",\n  \"description\": \"Extract structured data from an invoice-like document.\",\n  \"input_schema\": {\n    \"type\": \"object\",\n    \"properties\": {\n      \"vendor\":  {\"type\": \"string\"},\n      \"total\":   {\"type\": \"number\"},\n      \"currency\": {\"type\": \"string\", \"enum\": [\"USD\", \"EUR\", \"GBP\", \"other\", \"unclear\"]},\n      \"category_detail\": {\"type\": [\"string\", \"null\"],\n                          \"description\": \"Details when category is other/unclear\"},\n      \"due_date\": {\"type\": [\"string\", \"null\"],\n                   \"description\": \"ISO 8601 date, or null if absent — do not invent\"},\n      \"po_number\": {\"type\": [\"string\", \"null\"],\n                    \"description\": \"Null if not present in the document\"}\n    },\n    \"required\": [\"vendor\", \"total\", \"currency\"]\n  }\n}\n"]}, {"id": "4.4", "title": "Build a Validation-Retry Loop for Document Extraction", "domain": 4, "difficulty": "Advanced", "estimate": "60 minutes", "source": "https://claudecertificationguide.com/learn/4-prompt-engineering/4-4-validation-retry-loops#build-exercise", "steps": [{"text": "Define an extraction tool with calculated_total and stated_total fields, a conflict_detected boolean, and detected_pattern fields for tracking which constructs trigger findings", "why": "Self-correction fields like calculated_total vs stated_total enable automatic discrepancy detection without external logic. conflict_detected booleans and detected_pattern fields create the data foundation for systematic prompt improvement.", "see": "A JSON schema with separate calculated_total and stated_total number fields, a total_discrepancy boolean, a conflict_detected boolean, and a detected_pattern string field on each finding in the line_items array."}, {"text": "Implement validation logic that checks: field completeness, numerical consistency (calculated sum matches stated total), enum validity, and date ordering", "why": "Semantic validation catches errors that tool_use cannot. The exam distinguishes schema syntax errors (eliminated by tool_use) from semantic errors (wrong sums, misplaced values) that require validation logic and retry loops.", "see": "A validation function that returns an array of specific, actionable error messages. Each error should state what was expected versus what was found, not just that validation failed."}, {"text": "Build the retry loop: on validation failure, construct a follow-up message containing the original document, the failed extraction, and the specific validation error", "why": "Retry-with-error-feedback is dramatically more effective than naive retries. Without the specific error, the model has no guidance and typically reproduces the same mistake. With the error, the model can target its self-correction.", "see": "A retry message that includes all three elements: the original document text, the JSON of the failed extraction, and the specific validation error string. The model should produce a corrected extraction on retry."}, {"text": "Test with 5 documents: 2 with fixable errors (misplaced values, wrong totals) and 3 with unfixable errors (absent information) — verify the loop retries only fixable cases", "why": "The retry effectiveness boundary is the most aggressively tested concept in this task statement. Retries fix format mismatches and structural errors but cannot create information absent from the source. The exam presents both scenarios and expects you to identify which is fixable.", "see": "The 2 fixable documents succeed after 1-2 retries with corrected totals or field placements. The 3 unfixable documents are correctly identified as having absent information and flagged for human review rather than retried."}, {"text": "Log detected_pattern data for each finding and analyse which patterns are most frequently dismissed to identify prompt refinement priorities", "why": "detected_pattern fields create a systematic improvement loop. When developers consistently dismiss findings triggered by a specific pattern, that pattern likely needs prompt refinement. This turns dismissal data into actionable prompt improvement priorities.", "see": "A log or table showing each detected_pattern, its frequency, its dismissal rate, and a prioritised list of patterns needing prompt refinement. Patterns with high dismissal rates should be at the top."}], "file": "exercise-4-4.md", "starter": null}, {"id": "4.5", "title": "Design a Batch Processing Strategy", "domain": 4, "difficulty": "Intermediate", "estimate": "45 minutes", "source": "https://claudecertificationguide.com/learn/4-prompt-engineering/4-5-batch-processing#build-exercise", "steps": [{"text": "List 5 workflows in a hypothetical organisation and categorise each as blocking (synchronous) or latency-tolerant (batch-eligible) with justification", "why": "The matching rule between synchronous and batch API is the most tested concept in this task statement. The exam presents a scenario where a manager proposes switching everything to batch for cost savings, and you must identify which workflows cannot tolerate the 24-hour processing window.", "see": "A table with 5 workflows, each clearly categorised with justification. Blocking workflows have someone or something waiting for the result. Batch-eligible workflows consume results later with no real-time dependency."}, {"text": "Define a batch submission for 20 documents using the Message Batches API format with unique custom_id fields for each document", "why": "custom_id fields are the mechanism for correlating request-response pairs in batch results. Without unique identifiers, you cannot determine which documents succeeded or failed, making failure handling impossible.", "see": "A valid batch request object with 20 entries, each containing a unique custom_id, model specification, max_tokens, and a messages array with the document content."}, {"text": "Implement failure handling: parse batch results, identify failures by custom_id, and construct a retry batch containing only failed documents with increased max_tokens", "why": "Resubmitting only failures with targeted modifications is the correct batch failure pattern. Resubmitting the entire batch wastes cost on already-successful documents. The exam tests that you understand custom_id correlation and targeted retry.", "see": "A failure handler that filters results by error status, extracts the custom_id values of failures, looks up the original documents, and creates a retry batch with modifications like increased max_tokens or chunked content."}, {"text": "Calculate the batch submission frequency needed to guarantee a 30-hour SLA given the 24-hour maximum processing window", "why": "SLA calculation with the 24-hour batch processing window is a direct exam test point. You must work backwards from the SLA deadline to determine when to submit, accounting for the maximum processing time plus a safety margin.", "see": "A calculation showing: 30-hour SLA minus 24-hour maximum processing window equals 6 hours of buffer. Submission must occur at least 30 hours before the deadline, with batches submitted every 4-6 hours to guarantee the SLA with margin."}, {"text": "Create a 5-document sample set and refine extraction prompts iteratively before submitting the full batch of 20 documents", "why": "Prompt refinement on a sample set before batch submission is the most cost-effective batch processing strategy. A 90% first-pass success rate means 2 retries on 20 documents. A 60% first-pass rate means 8 retries, four times the resubmission cost.", "see": "A sample set covering the range of document types and edge cases, 2-3 prompt iterations improving accuracy on the sample, and then the full batch submission achieving a high first-pass success rate."}], "file": "exercise-4-5.md", "starter": null}, {"id": "4.6", "title": "Build a Multi-Pass Code Review System", "domain": 4, "difficulty": "Advanced", "estimate": "60 minutes", "source": "https://claudecertificationguide.com/learn/4-prompt-engineering/4-6-multi-pass-review#build-exercise", "steps": [{"text": "Create a single-pass review prompt and run it against a 10-file mock PR — document instances of inconsistent depth, missed issues, and contradictory findings", "why": "Establishing the single-pass baseline demonstrates the three symptoms of attention dilution: inconsistent depth across files, missed bugs in the middle of the review, and contradictory findings flagging the same pattern differently in different files.", "see": "Detailed feedback on some files (typically first and last) but superficial comments on others, at least one obvious bug missed in a middle file, and at least one contradictory finding where the same code pattern is flagged as problematic in one file but approved in another."}, {"text": "Implement per-file local analysis: iterate over each file with a focused review prompt that examines only that file for bugs, security issues, and logic errors", "why": "Per-file analysis ensures every file receives consistent, focused attention. Each invocation examines only one file, eliminating the attention dilution that causes inconsistent depth and missed bugs in single-pass reviews.", "see": "Consistent review depth across all 10 files. Bugs that were missed in the single-pass review should now be caught, especially those in the middle files. Each review should be focused and thorough."}, {"text": "Implement a cross-file integration pass: feed all per-file findings into a separate prompt that checks for data flow inconsistencies, contradictory findings across files, and API contract violations", "why": "Per-file analysis catches local issues but misses cross-file concerns: data flow between modules, consistent API usage, and contradictions in per-file findings. The integration pass is a separate invocation that receives all findings and checks for systemic issues.", "see": "A synthesis output identifying cross-file issues that no single-file review could catch: data passed between modules in incompatible formats, contradictory findings from per-file reviews, and API contracts violated across service boundaries."}, {"text": "Add confidence scoring to each finding (0.0-1.0) and implement routing: high confidence findings go directly to the developer, low confidence findings go to a human review queue", "why": "Confidence-based routing directs limited human reviewer attention to the findings that need it most. The exam distinguishes raw uncalibrated confidence from calibrated thresholds validated against labelled sets.", "see": "Each finding annotated with a confidence score, reasoning for the score, and a routing decision (direct_report or human_review). The routing threshold should separate clear-cut findings from uncertain ones."}, {"text": "Use a separate Claude instance (fresh session, no prior context) to review a subset of the generated findings and compare its assessment to the original confidence scores for calibration", "why": "Independent review instances approach output fresh without the bias of I chose this because reasoning. This step calibrates confidence thresholds by comparing self-reported confidence against independent assessment, the method the exam identifies as the correct approach.", "see": "A calibration dataset showing the relationship between reported confidence scores and independent verification results. Some high-confidence findings may be overturned, revealing calibration gaps that adjust your routing thresholds."}], "file": "exercise-4-6.md", "starter": null}, {"id": "5.1", "title": "Build a Persistent Case Facts Context Manager", "domain": 5, "difficulty": "Intermediate", "estimate": "45 minutes", "source": "https://claudecertificationguide.com/learn/5-context-management/5-1-context-window-management#build-exercise", "steps": [{"text": "Create a case facts extractor that identifies transactional data (amounts, dates, order numbers, statuses) from tool results", "why": "The persistent case facts block is the single most important pattern in context window management. Extracting transactional facts into a structured block that is never summarised prevents the progressive summarisation trap from destroying critical numerical values and identifiers.", "see": "A function that takes raw tool output and returns a structured object containing only the transactional facts: customer ID, order numbers, amounts, dates, and statuses. Non-transactional narrative content should be excluded."}, {"text": "Implement a persistent case facts block that is prepended to every prompt, outside summarised history", "why": "The case facts block must persist across every turn regardless of what happens to the conversation history. It sits outside the summarised portion of the context, ensuring amounts, dates, and order numbers survive even when earlier conversation turns are compressed.", "see": "A prompt construction function that always includes the case facts block at the top of every message, followed by any summarised history, followed by the current turn. The case facts block should be clearly delimited with a section header."}, {"text": "Build a tool result trimmer that filters order lookup responses from 40+ fields to only the 5 relevant return-related fields", "why": "Untrimmed tool results are a silent context budget killer. An order lookup returning 40+ fields consumes tokens in every subsequent turn as conversation history grows. Trimming to relevant fields before results enter context is essential, not optional.", "see": "A trimming function that takes a raw tool result object and returns only the fields needed for the current task. The trimmed result should be 80-90% smaller than the original."}, {"text": "Test with a multi-turn conversation where summarisation occurs and verify that transactional facts survive intact across all turns", "why": "This validates that the persistent case facts pattern actually works. The exam tests whether you understand that progressive summarisation destroys specific amounts and dates, and the case facts block is the fix. You need to verify this empirically.", "see": "A 6-8 turn conversation where summarisation occurs after turn 4. After summarisation, the agent should still reference the exact refund amount ($247.83), order number (#8891), and date (March 3rd) from the case facts block. Without the block, these values would be lost to summarisation."}, {"text": "Add key findings placement logic that positions summaries at the beginning of aggregated inputs to mitigate the lost-in-the-middle effect", "why": "Models process information at the beginning and end of long inputs reliably, but findings buried in the middle may be missed. Placing key findings summaries at the start of aggregated inputs is a structural fix for this well-documented phenomenon.", "see": "An aggregation function that places a Key Findings Summary section at the top of combined inputs, followed by detailed results with explicit section headers. The key findings should be concise bullet points drawn from the detailed content."}], "file": "exercise-5-1.md", "starter": ["case_facts_block.txt", "=== CASE FACTS (updated whenever a new fact appears) ===\nCustomer ID: CUST-12345\nOrder ID:    ORD-67890\nOrder Date:  2025-01-15\nAmount:      $89.99\nIssue:       Damaged item on delivery\nRequest:     Full refund\nStatus:      Pending manager approval\n===\n"]}, {"id": "5.2", "title": "Build an Escalation Decision Engine", "domain": 5, "difficulty": "Intermediate", "estimate": "40 minutes", "source": "https://claudecertificationguide.com/learn/5-context-management/5-2-escalation-ambiguity#build-exercise", "steps": [{"text": "Create a system prompt with explicit escalation criteria covering all three valid triggers: explicit human request, policy exceptions/gaps, and inability to make progress", "why": "Explicit escalation criteria in the system prompt are the proportionate first response before adding infrastructure like classifier models or sentiment analysis. The exam tests that prompt optimisation should always precede architectural changes for escalation calibration.", "see": "A system prompt with three clearly defined escalation triggers, each with a description and decision rule. The prompt should also explicitly list the two anti-patterns (sentiment-based and confidence-based escalation) as things to avoid."}, {"text": "Add few-shot examples showing: immediate escalation for explicit human request, autonomous resolution for a frustrated customer with a straightforward issue, and escalation for a policy gap", "why": "Few-shot examples demonstrating when to escalate versus when to resolve autonomously directly address unclear decision boundaries. This is the exact technique the exam identifies as the correct improvement for a support agent with poor first-contact resolution rates.", "see": "Three examples in the system prompt, each showing a different scenario with the correct decision and reasoning. The frustrated-but-resolvable example should show the agent acknowledging frustration and offering the resolution directly."}, {"text": "Implement ambiguous customer matching logic that requests additional identifiers (email, phone, order number) instead of selecting heuristically", "why": "Selecting from ambiguous matches using heuristics (most recent, most active) risks privacy violations and incorrect actions. The exam tests that the only safe response to multiple customer matches is to ask for additional identifiers to disambiguate.", "see": "A matching function that detects when multiple records are returned and immediately asks for disambiguation rather than applying any selection heuristic. The disambiguation request should suggest specific identifier types."}, {"text": "Test with four scenarios: frustrated customer with simple issue, calm customer requesting policy exception, customer explicitly requesting a human, and ambiguous customer match", "why": "These four scenarios cover all critical decision boundaries the exam tests: the frustration nuance, policy gap versus violation distinction, absolute rule for explicit human requests, and privacy-safe disambiguation.", "see": "Correct handling of all four scenarios: resolution offered for the frustrated customer, escalation for the policy gap, immediate escalation for the explicit human request (no investigation first), and disambiguation request for the ambiguous match."}, {"text": "Verify the agent never attempts investigation before honouring an explicit human request and never selects from ambiguous matches using heuristics", "why": "These are the two absolute rules the exam tests with no exceptions. Any attempt to investigate before escalating on an explicit human request, or any heuristic selection from ambiguous matches, is a critical failure that would cost marks on the exam.", "see": "For explicit human requests: the escalation happens in the very first response with zero investigation steps. For ambiguous matches: the response always asks for additional identifiers, never selects a record. Both rules should hold across multiple phrasings and edge cases."}], "file": "exercise-5-2.md", "starter": null}, {"id": "5.3", "title": "Build a Structured Error Propagation System", "domain": 5, "difficulty": "Advanced", "estimate": "50 minutes", "source": "https://claudecertificationguide.com/learn/5-context-management/5-3-error-propagation#build-exercise", "steps": [{"text": "Define a structured error schema with fields: failureType (transient/validation/business/permission), attemptedAction (tool, query, parameters), partialResults (array of any retrieved data), and alternativeApproaches (suggested recovery strategies)", "why": "Structured error context enables intelligent coordinator recovery. The four elements give the coordinator everything it needs to decide: retry, try an alternative, proceed with partial results, or escalate. Generic error messages like search unavailable prevent all informed recovery.", "see": "A TypeScript interface or JSON schema with failureType as an enum of the four categories, attemptedAction as an object with tool/query/parameters, partialResults as an array, and alternativeApproaches as a string array. Each field should have a description explaining its purpose."}, {"text": "Implement a subagent that distinguishes access failures (timeout, connection error) from valid empty results (successful query, no matches) in its error reporting", "why": "Conflating access failures with valid empty results is a critical error the exam tests directly. Access failures mean the query did not execute and should be retried. Valid empty results mean the query succeeded and found nothing, which IS the answer. Treating them the same leads to either never retrying when you should or wasting time retrying queries that will always return nothing.", "see": "A subagent function that catches exceptions (timeouts, connection errors) and reports them as access failures with shouldRetry: true, while successful queries returning no results are reported as success with an empty results array and shouldRetry: false."}, {"text": "Build local retry logic for transient failures within the subagent (3 retries with exponential backoff) before propagating to the coordinator", "why": "Subagents should handle their own transient failures locally before escalating. This reduces coordinator complexity as the coordinator does not need to manage retry logic for every possible transient failure across every subagent. Only persistent failures that survive local retry should propagate.", "see": "A retry wrapper with exponential backoff (e.g., 1s, 2s, 4s) that attempts the operation up to 3 times before propagating the structured error to the coordinator. Partial results gathered before failure should be preserved across retries."}, {"text": "Create a coordinator that receives structured errors and decides between retry with modified query, alternative approach, or proceed with partial results", "why": "The coordinator is the intelligent recovery decision-maker. With structured error context, it can make informed choices rather than applying blanket policies. This is the correct middle ground between silent suppression (ignoring failures) and workflow termination (killing the pipeline on one failure).", "see": "A coordinator function that examines the failure type, checks partial results, evaluates alternative approaches, and selects the appropriate recovery strategy. It should handle all four failure types differently and never silently suppress errors."}, {"text": "Add coverage annotations to synthesis output noting which findings are well-supported versus which topic areas have gaps due to unavailable sources", "why": "Coverage annotations let the consumer know what the report covers fully and where there are known limitations. Without them, a gap looks like the topic was not relevant rather than the source being unavailable. This transparency is far better than silently omitting topics.", "see": "A synthesis output that includes a coverage section listing each topic area with its data quality status: well-supported, limited (with reason), or unavailable (with reason). Failed subagent topics should be explicitly noted, not silently omitted."}], "file": "exercise-5-3.md", "starter": null}, {"id": "5.4", "title": "Build a Context-Resilient Codebase Explorer", "domain": 5, "difficulty": "Advanced", "estimate": "60 minutes", "source": "https://claudecertificationguide.com/learn/5-context-management/5-4-codebase-exploration#build-exercise", "steps": [{"text": "Create a coordinator agent that delegates specific codebase exploration tasks to subagents (e.g., find test files, trace dependency chains, identify external integrations)", "why": "Subagent delegation is primarily about context isolation, not parallelisation. The main agent context stays clean for high-level coordination while subagents handle verbose exploration. This directly prevents context degradation by keeping verbose file contents and search results out of the coordinator context.", "see": "A coordinator function that spawns subagents with specific, focused investigation prompts. Each subagent returns a structured summary (key findings, file paths, class names) rather than raw verbose output. The coordinator context should remain clean."}, {"text": "Implement scratchpad file management: agents write key findings (class names, file paths, dependency chains) to a known file and read it before subsequent exploration steps", "why": "Scratchpad files are the primary mitigation for context degradation. They persist knowledge outside the conversation context, making it immune to the attention shift that causes the model to reference typical patterns instead of specific class names and file paths it discovered earlier.", "see": "An agent that writes structured findings to a scratchpad file after each exploration step and reads the scratchpad at the start of each subsequent step. The scratchpad should contain specific class names, file paths, and dependency chains, not summaries."}, {"text": "Build summary injection logic: after Phase 1 exploration, summarise findings and inject the summary into Phase 2 subagent prompts", "why": "Summary injection prevents the cold start problem where Phase 2 subagents duplicate Phase 1 exploration because they were not given previous findings. It ensures Phase 2 agents have the architectural understanding needed to ask the right questions without rediscovering the system structure.", "see": "A Phase 1 summary document that captures the high-level architecture, key concerns, and specific investigation targets for Phase 2. This summary is injected into the initial prompt of every Phase 2 subagent."}, {"text": "Implement crash recovery: each agent exports structured state (explored paths, key findings, next steps) to a manifest file that the coordinator loads on resume", "why": "Extended exploration sessions can fail from crashes, network interruptions, or context exhaustion. Without recovery mechanisms, all progress is lost. Structured state manifests enable the coordinator to resume from the last checkpoint rather than restarting from scratch.", "see": "A manifest file in JSON format containing the session ID, current phase, explored paths, key findings, and next steps. On resume, the coordinator loads this manifest and injects it into agent prompts so exploration continues from where it left off."}, {"text": "Test context degradation by running an extended exploration session across multiple modules and verify that scratchpad files preserve specific class names and file paths that would otherwise degrade to generic descriptions", "why": "This validates that the scratchpad mitigation actually works against context degradation. The observable symptom is the model referencing typical patterns instead of specific classes and paths. You need to confirm that scratchpad files prevent this degradation.", "see": "Two comparison runs: one without scratchpad files where the agent degrades to generic references after exploring 4-5 modules, and one with scratchpad files where the agent maintains specific class names and file paths throughout the entire session."}], "file": "exercise-5-4.md", "starter": null}, {"id": "5.5", "title": "Build a Confidence-Calibrated Review Router", "domain": 5, "difficulty": "Advanced", "estimate": "50 minutes", "source": "https://claudecertificationguide.com/learn/5-context-management/5-5-human-review-calibration#build-exercise", "steps": [{"text": "Create a mock extraction system that outputs field-level confidence scores for different document types (invoices, receipts, scanned PDFs, international documents)", "why": "Field-level confidence scores are the foundation of intelligent review routing. The exam tests that raw model confidence is not calibrated and must be validated against ground truth before use. Building the mock system gives you data to calibrate against.", "see": "An extraction function that returns each field with its value and a confidence score between 0.0 and 1.0. The system should process at least 4 document types with noticeably different confidence distributions per type."}, {"text": "Implement accuracy tracking broken down by document type and field segment — not just aggregate metrics", "why": "The aggregate metrics trap is the most dangerous misconception in production extraction systems. 97% overall accuracy can hide catastrophic failure rates on specific document types because standard invoices dominate the volume. The exam tests that you must validate by document type AND field segment before automating.", "see": "An accuracy table showing each document type and field combination separately. Standard invoices should show 95%+ accuracy while handwritten receipts and international documents show 40-70%. The aggregate should look excellent (90%+) despite the poor per-type numbers."}, {"text": "Build a calibration module that takes a labelled validation set (ground truth) and produces calibrated confidence thresholds per field type per document type", "why": "Raw model confidence scores are not calibrated. A model reporting 0.90 confidence might actually be correct 94% of the time on date fields but only 82% on amount fields. Calibration using labelled validation sets is required before confidence scores can drive automated routing decisions.", "see": "A calibration curve for each field type per document type, mapping reported confidence ranges to actual accuracy percentages. The curve should reveal that the same confidence score means different things for different field-document combinations."}, {"text": "Implement stratified random sampling that selects high-confidence extractions for ongoing verification, sampling proportionally across all document types", "why": "High-confidence extractions are automated and not reviewed. If the model develops a novel error pattern affecting high-confidence items, only stratified sampling will catch it. Sampling only low-confidence items leaves you blind to systematic errors in automated extractions.", "see": "A sampling function that selects a representative subset from each stratum (document type and confidence band), including samples from the high-confidence automated extractions. The sample should be proportional to the volume in each stratum."}, {"text": "Build a review router that prioritises limited reviewer capacity on the highest-uncertainty items, dynamically reordering the review queue as new extractions arrive", "why": "Human reviewers are expensive and limited. Spreading capacity evenly across all extractions wastes time on high-confidence items while leaving insufficient capacity for uncertain items that need human judgement. Dynamic priority ordering ensures the most uncertain items are always reviewed first.", "see": "A priority queue that orders items by uncertainty (lowest confidence first), dynamically reorders as new extractions arrive, and serves the next-highest-uncertainty item to each available reviewer. The queue should never serve items in chronological order."}], "file": "exercise-5-5.md", "starter": null}, {"id": "5.6", "title": "Build a Provenance-Preserving Synthesis Pipeline", "domain": 5, "difficulty": "Advanced", "estimate": "60 minutes", "source": "https://claudecertificationguide.com/learn/5-context-management/5-6-information-provenance#build-exercise", "steps": [{"text": "Define a structured claim-source mapping schema with fields: claim, sourceUrl, documentName, relevantExcerpt, publicationDate", "why": "Every finding in a multi-agent research system must carry its provenance. Without structured claim-source mappings, attribution dies during summarisation and the final output becomes untraceable plausible-sounding text with no verifiable sources.", "see": "A TypeScript interface or JSON schema with all five required fields: claim (the assertion), sourceUrl (where found), documentName (title), relevantExcerpt (supporting passage), and publicationDate (when published or data collected). Each field should be required, not optional."}, {"text": "Implement two research subagents that output findings using the claim-source mapping schema, including publication dates", "why": "Subagents must output in the structured format from the start. If subagents return unstructured prose, attribution is already lost before synthesis begins. Requiring structured output at the subagent level is the foundation of end-to-end provenance.", "see": "Two subagent functions that each return an array of ClaimSourceMapping objects with all fields populated, including publication dates. Each subagent should research a different aspect of the same topic."}, {"text": "Build a synthesis agent that merges findings from both subagents while explicitly preserving all claim-source mappings through the merge process", "why": "Step 3 (synthesis) is the most common failure point for attribution. The synthesis agent naturally compresses and paraphrases, destroying claim-source mappings unless explicitly instructed to preserve them. The exam tests whether you understand that attribution must be explicitly maintained through every synthesis step.", "see": "A synthesis output where every claim is traceable to its source. The synthesis should combine related findings but maintain inline citations or a reference section linking each claim to its original source URL, document name, and publication date."}, {"text": "Handle conflicting sources by annotating both values with full attribution and possible explanations, without arbitrarily selecting one value", "why": "When two credible sources report different statistics, arbitrarily selecting one destroys information and presents false certainty. The exam tests that the correct approach is to annotate both values with source attribution and let the consumer decide. Different publication dates often explain different numbers as trends, not contradictions.", "see": "A conflict handling function that detects overlapping claims with different values, preserves both with full attribution, and adds a possible explanation noting temporal or methodological differences. The output should never silently pick one value."}, {"text": "Implement content-appropriate rendering in the final output: format financial data as tables, news findings as prose, and technical findings as structured lists", "why": "The exam tests that synthesis should not flatten everything into a uniform format. Financial data is most readable as tables, news context reads naturally as prose, and technical findings are clearest as structured lists. Forcing all content into one format degrades readability.", "see": "A rendering function that detects the content type of each section and applies the appropriate format. Financial data should appear in tables with columns for year, value, and source. News should be prose paragraphs. Technical findings should be bulleted lists."}], "file": "exercise-5-6.md", "starter": null}, {"id": "F1", "title": "Compare Approaches in Parallel with fork_session", "domain": 1, "difficulty": "Intermediate", "estimate": "40 minutes", "source": "Ravn Study Guide §5.10, Domain 1.3 / 1.7 — https://ravnhq.github.io/claude-certified-architect/guides/en.html", "steps": [{"text": "Start a Claude Code session that investigates a shared problem, for example: \"This React app re-renders too often. Map the component tree and identify where state lives.\"", "why": "fork_session branches from *shared* context. You need a completed investigation phase first so both forks inherit the same discoveries. Without shared groundwork, you are not forking — you are just starting two independent sessions.", "see": "A session that has mapped the component tree and located the state-holding components, with the findings present in context. No new code written yet."}, {"text": "Fork the session twice: fork A gets the prompt \"Implement a fix using Redux\", fork B gets \"Implement a fix using Context API\".", "why": "Both forks inherit everything up to the branch point and then diverge independently. This is the exact exam use case: comparing viable implementation approaches from a common understanding without re-explaining the investigation to either branch.", "see": "Two independent sessions whose contexts both contain the original investigation. Neither fork sees the other's work. Each pursues only its assigned approach."}, {"text": "Let each fork complete a minimal implementation and record the results: lines changed, new dependencies, and any trade-offs each fork surfaced.", "why": "The value of forking is a like-for-like comparison. Because both branches started from identical context, differences in the outcome are attributable to the approach, not to uneven information.", "see": "Two implementations you can compare directly: same investigation baseline, different solutions. Each fork's summary lists files touched, new dependencies (Redux adds one; Context API adds none), and discovered trade-offs."}, {"text": "Decide which approach to keep and discard the losing branch.", "why": "Forking is explicitly for exploring alternatives in parallel — the losing branch costs nothing and leaves no trace in the winning session. The exam contrasts this with the alternative: serially trying approach A, then reverting and trying B, which pollutes one session's context with a dead end.", "see": "One surviving session with the chosen implementation. The abandoned approach's context is gone — no dead-code exploration lingering in the session you continue in."}, {"text": "Write down when you would fork versus when you would start a fresh session or use --resume, in three rules.", "why": "The exam tests the boundary between the three session strategies. fork_session is for branching alternatives from shared context; --resume is for continuing work when files are unchanged; fresh-start-with-summary is for when prior tool results have gone stale.", "see": "Three written rules. Example: fork when comparing approaches from a shared investigation; resume when continuing unchanged work; fresh-start when files changed since the last session. Each rule names the trap it avoids."}], "file": "exercise-fill-in-1.md", "starter": null}, {"id": "F2", "title": "Isolate Verbose Discovery with an Explore Subagent", "domain": 3, "difficulty": "Intermediate", "estimate": "40 minutes", "source": "Ravn Study Guide §5.6, Domain 3.4 / 5.4 — https://ravnhq.github.io/claude-certified-architect/guides/en.html", "steps": [{"text": "Pick a verbose codebase discovery task, for example: \"Trace every import chain that reaches the payments module.\" Estimate its raw output size before running it.", "why": "The Explore subagent exists for one reason: verbose discovery output exhausts the main context window and degrades every later response in the session. You need a task chatty enough that running it inline would visibly pollute context — file listings, import chains, code excerpts across a dozen files.", "see": "A task whose full raw output would span dozens of files and thousands of tokens, and a rough token estimate of that output written down before you run anything."}, {"text": "Run the task inline in the main session and note the effect on the conversation.", "why": "You need the baseline failure mode firsthand. Inline discovery dumps every intermediate file and search result into the main context, where it stays for the rest of the session. The exam treats \"main agent reads 15 files directly\" as the anti-pattern this exercise replaces.", "see": "The main conversation context filled with file contents and search results. Ask a follow-up question afterwards and note that the model's answers now compete with a large volume of discovery noise."}, {"text": "Repeat the same task delegated to an Explore subagent and compare what enters the main context.", "why": "The Explore subagent isolates verbose output and returns only a summary. The main agent keeps one line — \"Payments depends on AuthService, OrderModel, and the external PaymentGateway API\" — instead of 15 files. The exam names this as the correct defence against context-window exhaustion in multi-phase tasks.", "see": "The main conversation receives a concise structured summary: key findings, file paths, class names. The raw listings and excerpts never appear in the main context. A follow-up question is answered without degradation."}, {"text": "Check the context budget difference between the two runs.", "why": "Quantifying it proves the mechanism. The exam expects you to know *why* delegation works, not just that it works: subagents operate in their own context budget, and only their return value costs tokens in the coordinator session.", "see": "A measurable difference in context usage between the inline run and the delegated run, roughly matching the size of the raw output you estimated in step 1. The delegated run's main-context cost is the summary only."}, {"text": "Add the pattern as a standing rule: in your CLAUDE.md or a skill with context: fork, require verbose discovery to run in an isolated subagent that returns a summary.", "why": "One-off discipline does not survive long sessions. The guide's standard mechanism is a skill with `context: fork` frontmatter (exercise 3.2) or an explicit team convention, so every discovery task gets isolation by default rather than by remembering.", "see": "A written rule or skill frontmatter entry that routes verbose exploration through an isolated context. The rule states what the subagent must return: a structured summary, not raw output."}], "file": "exercise-fill-in-2.md", "starter": null}, {"id": "F3", "title": "Modular CLAUDE.md with @path Imports and the Depth-5 Limit", "domain": 3, "difficulty": "Beginner", "estimate": "30 minutes", "source": "Ravn Study Guide §5.2, Domain 3.1 — https://ravnhq.github.io/claude-certified-architect/guides/en.html", "steps": [{"text": "Split a monolithic CLAUDE.md into topic files and import them with @path: coding standards in @./standards/coding-style.md, test requirements in @./standards/testing-requirements.md, project overview in @README.md.", "why": "The @path syntax is what makes CLAUDE.md modular. Each topic lives in one file, edited once, imported wherever relevant — avoiding the duplication-and-drift problem of copying conventions into multiple files. The exam tests the exact syntax: `@` immediately before the path, on its own line, no `@import` keyword.", "see": "A short CLAUDE.md whose imports resolve inline — run /context and confirm the imported file contents appear as part of the loaded configuration. A standards/ directory containing the split-out files."}, {"text": "Verify that a relative @path resolves relative to the file containing the import, not the project root.", "why": "Resolution-relative-to-importer is the detail that breaks nested configurations. A CLAUDE.md in packages/api/ that writes @standards/api.md resolves against packages/api/, not the repo root. The exam tests whether you place imports correctly in multi-level setups.", "see": "An import inside a directory-level CLAUDE.md that resolves correctly relative to that file's location. Moving the referenced file without updating the path breaks the import, confirming the resolution root."}, {"text": "Build an import chain five levels deep: CLAUDE.md imports A.md, A.md imports B.md, and so on to E.md. Confirm the chain loads.", "why": "The maximum import nesting depth is 5 — an explicit exam fact. You need a working depth-5 chain as the boundary case before you can demonstrate the failure at depth 6.", "see": "Five levels of nesting resolving: content from E.md (the fifth hop) appears in the loaded configuration when you run /context."}, {"text": "Add a sixth level (E.md imports F.md) and observe what happens.", "why": "Knowing the limit exists is different from seeing the boundary behaviour. The exam tests the number 5 because it is an easy detail to get wrong — candidates who guess \"unlimited\" or \"3\" lose the point.", "see": "The depth-6 import not resolved: F.md content does not appear in the loaded configuration. The chain silently stops at the depth limit rather than recursing further."}, {"text": "Refactor the over-deep chain: hoist the deepest shared files so no import chain exceeds the limit, and re-verify all content loads.", "why": "The practical skill is designing a modular layout that stays inside the constraint: keep shared standards near the top of the import graph and let leaf files import them, rather than chaining imports through intermediate files.", "see": "A restructured layout where every file's content loads under /context, with the longest chain at 5 levels or fewer. Shared files are imported directly by the files that need them instead of being relayed through multiple hops."}], "file": "exercise-fill-in-3.md", "starter": ["CLAUDE.md", "Coding style: @./standards/coding-style.md\nTesting: @./standards/testing.md\nOverview: @README.md\n"]}, {"id": "F4", "title": "Use /compact and /memory Without Losing Critical Facts", "domain": 5, "difficulty": "Beginner", "estimate": "30 minutes", "source": "Ravn Study Guide §5.7–5.8, Domain 5.1 / 5.4 — https://ravnhq.github.io/claude-certified-architect/guides/en.html", "steps": [{"text": "Run a long investigation session (10+ turns of file reads and searches) until the context window is heavily used, with specific facts discovered along the way: exact line numbers, amounts, dates, identifiers.", "why": "You need real context pressure to see what /compact actually does. The exam tests the risk, not just the command: summarisation compresses prior history, and exact numeric values, dates, and specific details can be lost in the process.", "see": "A session with concrete discovered facts recorded somewhere you can check later — for example \"refund amount $247.83, order #8891, March 3rd, bug at auth.ts:42\". Several of these facts should live only in the conversation so far."}, {"text": "Before compacting, extract the critical facts into a persistent location: a case-facts block in your prompt, a scratchpad file, or CLAUDE.md via /memory.", "why": "This is the exam's required pairing: /compact frees the context window, but you must first protect transactional facts outside the summarised history. Compacting without extraction is the progressive-summarisation trap; compacting after extraction is the intended workflow.", "see": "The key facts now exist outside raw conversation history — in a delimited facts block, a scratchpad file, or a CLAUDE.md entry. Each fact is specific (exact values), not a summary (\"a refund of some amount\")."}, {"text": "Run /compact, then ask the agent questions that require the protected facts.", "why": "This is the verification that the pattern works. After summarisation, the conversation history no longer contains the original turns verbatim — only the facts you protected survive intact. The exam tests that lossy summarisation is acceptable *because* critical facts were extracted first.", "see": "Correct, specific answers post-compact: the exact amount, order number, date, and line number come back. Try the same questions on a control run where you compacted *without* step 2 and observe degraded answers (\"around $250\", \"early March\")."}, {"text": "Use /memory to persist a project convention or preference you want available next session, then confirm it loads in a fresh session.", "why": "/memory is the guide's designated command for cross-session persistence: it opens the CLAUDE.md file for editing, and the saved information loads automatically on startup. The exam contrasts this with re-explaining the same instructions every session.", "see": "An entry added to CLAUDE.md through /memory (for example a testing convention or a frequently used command). A new session in the same project has that entry in its loaded configuration under /context, with zero re-explanation."}, {"text": "Write a two-line rule for your team: when to /compact, and what must be true before you do it.", "why": "The exam rewards knowing the conditions, not the keystroke. The rule should bind the two commands together: /compact is for long sessions filling with verbose tool output; before running it, critical facts must live in a persistent block, scratchpad, or memory.", "see": "A written rule a teammate could apply without asking you. Example: \"Long investigation filling context? Extract facts to scratchpad or /memory first, then /compact. Never compact with unprotected specifics in history.\""}], "file": "exercise-fill-in-4.md", "starter": null}]}</script>
<script>
const {domains, exercises} = JSON.parse(document.getElementById('data').textContent);
const KEY='cca-lab-v1';
const store=JSON.parse(localStorage.getItem(KEY)||'{}');
const save=()=>localStorage.setItem(KEY,JSON.stringify(store));
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(){const t=$('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}
async function copy(txt,btn){try{await navigator.clipboard.writeText(txt)}catch(e){
  const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
  ta.select();document.execCommand('copy');ta.remove()}
  toast();if(btn){const o=btn.textContent;btn.textContent='✓';setTimeout(()=>btn.textContent=o,1000)}}

function buildPrompt(ex){
  const lines=[`I'm working through a Claude Certified Architect build exercise: "${ex.title}" (Domain ${ex.domain}: ${domains[ex.domain]}).`,
  '', 'Build it with me step by step. For each step: implement it, then check the result against the acceptance criteria before moving on.',
  '', 'Steps:'];
  ex.steps.forEach((s,i)=>lines.push(`${i+1}. ${s.text}`));
  lines.push('', 'Acceptance criteria (verify after each step):');
  ex.steps.forEach((s,i)=>{if(s.see)lines.push(`${i+1}. ${s.see}`)});
  return lines.join('\n');}

function stepPrompt(ex,i){
  const s=ex.steps[i];
  return `Working on exercise ${ex.id} "${ex.title}". Current step (${i+1}/${ex.steps.length}): ${s.text}` +
    (s.see?`\n\nIt is done when: ${s.see}`:'');}

function progressOf(ex){let done=0;ex.steps.forEach((_,i)=>{if(store[ex.id]?.[i])done++});
  return [done,ex.steps.length];}
function renderBar(){let d=0,t=0;exercises.forEach(ex=>{const[a,b]=progressOf(ex);d+=a;t+=b});
  $('#pbar').style.width=(t?100*d/t:0)+'%';
  document.title=`CCA Practice Lab — ${d}/${t} steps`;}

function renderTOC(){
  let h='';const q=$('#q').value.toLowerCase();const dom=$('#dom').value;
  const byDom={};exercises.forEach(ex=>{(byDom[ex.domain]=byDom[ex.domain]||[]).push(ex)});
  const visible=new Set(filtered().map(e=>e.id));
  Object.keys(byDom).sort().forEach(d=>{
    const list=byDom[d].filter(e=>visible.has(e.id));if(!list.length)return;
    h+=`<div class="dom">Domain ${d} · ${esc(domains[d])}</div>`;
    list.forEach(ex=>{const[a,b]=progressOf(ex);
      h+=`<a href="#ex-${ex.id}" class="${a===b?'done':''}"><span>${ex.id} ${esc(ex.title)}</span><span class="cnt">${a}/${b}</span></a>`});});
  $('#toc').innerHTML=h;}

function filtered(){
  const q=$('#q').value.toLowerCase(),dom=$('#dom').value;
  return exercises.filter(ex=>(!dom||String(ex.domain)===dom)&&
    (!q||ex.title.toLowerCase().includes(q)||ex.steps.some(s=>s.text.toLowerCase().includes(q))));}

function render(){
  let h='';
  filtered().forEach(ex=>{
    const[a,b]=progressOf(ex);
    h+=`<section class="ex" id="ex-${ex.id}">
<h2>${ex.id}. ${esc(ex.title)}</h2>
<div class="meta">
<span class="chip">${esc(ex.difficulty)}</span><span class="chip">${esc(ex.estimate)}</span>
<span class="chip">Domain ${ex.domain}</span>
<span class="chip"><a href="${esc(ex.source)}" target="_blank" rel="noopener">source ↗</a></span>
<span class="chip"><a href="${esc(ex.file)}" target="_blank">md</a></span>
</div>
<div class="bar"><span class="pct">${a}/${b} steps</span>
<button class="copybtn" data-copy-prompt="${ex.id}">⧉ Copy build prompt</button></div>`;
    if(ex.starter){h+=`<div class="starter"><div class="fname">Starter · ${esc(ex.starter[0])}
<button class="copybtn" data-copy-starter="${ex.id}">⧉ copy</button></div>
<pre><code>${esc(ex.starter[1])}</code></pre></div>`;}
    ex.steps.forEach((s,i)=>{
      const done=!!store[ex.id]?.[i];
      h+=`<div class="step${done?' done':''}"><span class="n">${i+1}.</span>
<input type="checkbox" data-ex="${ex.id}" data-i="${i}"${done?' checked':''}>
<div class="body"><div class="txt">${esc(s.text)}</div>`;
      if(s.why)h+=`<div class="why"><em>Why:</em> ${esc(s.why)}</div>`;
      h+=`<div style="margin-top:.3rem"><button class="copybtn" data-copy-step="${ex.id}:${i}">⧉ step prompt</button></div>`;
      if(s.see)h+=`<details><summary>Answer key — when is this step done?</summary>
<div class="ans"><strong>You should see:</strong> ${esc(s.see)}</div></details>`;
      h+=`</div></div>`;});
    h+=`</section>`;});
  $('#content').innerHTML=h;renderTOC();renderBar();applySelftest();}

let selftest=false;
function applySelftest(){document.querySelectorAll('details').forEach(d=>{
  if(selftest)d.removeAttribute('open')});
  $('#selftest').textContent=selftest?'🙉 Self-test: on':'🙈 Self-test: off';}

// events
document.addEventListener('change',e=>{
  if(e.target.matches('input[type=checkbox][data-ex]')){
    const ex=e.target.dataset.ex,i=e.target.dataset.i;
    (store[ex]=store[ex]||{})[i]=e.target.checked;if(!e.target.checked)delete store[ex][i];
    save();e.target.closest('.step').classList.toggle('done',e.target.checked);
    renderBar();renderTOC();
    const sect=e.target.closest('.ex');const[a,b]=progressOf(exercises.find(x=>x.id===ex));
    sect.querySelector('.pct').textContent=`${a}/${b} steps`;}});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.copyPrompt){copy(buildPrompt(exercises.find(x=>x.id===b.dataset.copyPrompt)),b)}
  if(b.dataset.copyStep){const[id,i]=b.dataset.copyStep.split(':');
    copy(stepPrompt(exercises.find(x=>x.id===id),+i),b)}
  if(b.dataset.copyStarter){copy(exercises.find(x=>x.id===b.dataset.copyStarter).starter[1],b)}
  if(b.id==='selftest'){selftest=!selftest;applySelftest()}
  if(b.id==='theme'){const h=document.documentElement;
    h.dataset.theme=h.dataset.theme==='dark'?'':'dark';
    localStorage.setItem(KEY+'-theme',h.dataset.theme)}
  if(b.id==='reset'){if(confirm('Clear all progress?')){localStorage.removeItem(KEY);
    Object.keys(store).forEach(k=>delete store[k]);render()}}});
$('#q').addEventListener('input',render);
$('#dom').addEventListener('change',render);

// init
Object.entries(domains).forEach(([k,v])=>{
  const o=document.createElement('option');o.value=k;o.textContent=`Domain ${k} · ${v}`;$('#dom').appendChild(o);});
document.documentElement.dataset.theme=localStorage.getItem(KEY+'-theme')||'';
render();
</script></body></html>
