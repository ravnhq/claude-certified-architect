<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Certified Architect — Practice Lab</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#6b7280;--line:#e5e7eb;--chip:#f3f4f6;
--acc:#7c5cfc;--ok:#16a34a;--code:#f6f6f7}
html[data-theme=dark]{--bg:#131316;--fg:#e8e8ea;--mut:#9aa0a6;--line:#2c2c31;
--chip:#1e1e23;--acc:#a58bff;--ok:#4ade80;--code:#1c1c21}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:10;background:var(--bg);
border-bottom:1px solid var(--line);padding:.6rem 1rem}
.hrow{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;max-width:1400px;margin:0 auto}
.hrow h1{font-size:1rem;margin:0;white-space:nowrap}
input[type=search]{flex:1;min-width:160px;padding:.4rem .6rem;border:1px solid var(--line);
border-radius:8px;background:var(--chip);color:var(--fg);font-size:.85rem}
select{padding:.4rem;border:1px solid var(--line);border-radius:8px;background:var(--chip);color:var(--fg);font-size:.85rem}
button{cursor:pointer;border:1px solid var(--line);background:var(--chip);color:var(--fg);
border-radius:8px;padding:.35rem .6rem;font-size:.8rem}
button:hover{border-color:var(--acc)}
.progress{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;max-width:1400px;margin:.5rem auto 0}
.progress>div{height:100%;background:var(--acc);width:0%;transition:width .3s}
main{display:grid;grid-template-columns:280px 1fr;max-width:1400px;margin:0 auto;gap:1rem;padding:1rem}
aside{border-right:1px solid var(--line);padding-right:1rem;font-size:.85rem;
position:sticky;top:88px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
aside .dom{font-weight:600;margin:1rem 0 .3rem;color:var(--mut);text-transform:uppercase;
font-size:.7rem;letter-spacing:.05em}
aside a{display:flex;justify-content:space-between;gap:.4rem;color:var(--fg);
text-decoration:none;padding:.3rem .4rem;border-radius:6px;line-height:1.3}
aside a:hover{background:var(--chip)}
aside a .cnt{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
aside a.done{color:var(--ok)}
#content{min-width:0}
.ex{border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.2rem;margin-bottom:1.3rem}
.ex h2{font-size:1.05rem;margin:0 0 .4rem}
.meta{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.chip{background:var(--chip);border-radius:20px;padding:.15rem .6rem;font-size:.75rem;color:var(--mut)}
.chip a{color:var(--acc);text-decoration:none}
.step{display:flex;gap:.6rem;padding:.55rem 0;border-top:1px solid var(--line)}
.step input[type=checkbox]{margin-top:.2rem;width:1.05rem;height:1.05rem;accent-color:var(--acc);flex:none}
.step .n{color:var(--mut);font-variant-numeric:tabular-nums;font-size:.8rem;margin-top:.15rem;flex:none;width:1.4rem}
.step:nth-child(odd) .body{ }
.body{flex:1;min-width:0}
.body .txt{line-height:1.5}
.body .why{color:var(--mut);font-size:.82rem;margin-top:.3rem}
.body .why em{color:var(--acc)}
details{margin-top:.35rem}
summary{font-size:.8rem;color:var(--mut);cursor:pointer;user-select:none;list-style:none}
summary::before{content:"▸ ";color:var(--acc)}
details[open] summary::before{content:"▾ "}
.ans{background:var(--chip);border-left:3px solid var(--ok);border-radius:0 8px 8px 0;
padding:.5rem .7rem;font-size:.85rem;margin-top:.35rem;line-height:1.45}
.step.done .txt{text-decoration:line-through;color:var(--mut)}
.copybtn{font-size:.72rem;padding:.2rem .5rem;white-space:nowrap;align-self:flex-start}
pre{background:var(--code);border:1px solid var(--line);border-radius:8px;
padding:.7rem .8rem;overflow:auto;font-size:.8rem;margin:.5rem 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.starter{margin:.8rem 0}
.starter .fname{font-size:.78rem;color:var(--mut);font-family:ui-monospace,monospace}
.bar{display:flex;gap:.5rem;align-items:center;margin-bottom:.6rem;flex-wrap:wrap}
.bar .pct{font-size:.8rem;color:var(--mut)}
.toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);
background:var(--fg);color:var(--bg);padding:.4rem .9rem;border-radius:20px;
font-size:.8rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:.9}
@media(max-width:860px){main{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body>

<script id="data" type="application/json">{"domains": {"1": "Agentic Architecture & Orchestration", "2": "Tool Design & MCP Integration", "3": "Claude Code Configuration & Workflows", "4": "Prompt Engineering & Structured Output", "5": "Context Management & Reliability"}, "exercises": [{"id": "1.1", "title": "Build a Multi-Tool Agent Loop", "domain": 1, "difficulty": "Intermediate", "estimate": "45 minutes", "source": "https://claudecertificationguide.com/learn/1-agentic-architecture/1-1-agentic-loops#build-exercise", "steps": [{"text": "Set up a Claude API client with two tools: a calculator tool (accepts expression, returns result) and a web search stub (accepts query, returns mock results)", "why": "Multi-tool setups expose model-driven decision-making — Claude must select the right tool based on context, which is core to agentic architecture.", "see": "Two tool definitions registered with proper JSON Schema input_schema, each with name, description, and parameters."}, {"text": "Implement the agentic loop that sends requests to Claude and inspects stop_reason after each response", "why": "The agentic loop is the core execution pattern — the exam tests whether you use stop_reason (deterministic) versus content-type checks or natural language parsing (unreliable).", "see": "A while loop that calls client.messages.create() and checks response.stop_reason after each iteration."}, {"text": "Handle the tool_use stop_reason by executing the requested tool, creating a tool result message, and appending it to conversation history", "why": "This is the critical handoff in the loop — the exam specifically tests whether you correctly extract tool calls, execute them, and return results in the right message format.", "see": "When Claude requests a tool, your code extracts the tool_use block, runs the corresponding function, and appends both the assistant response and a user message with tool_result to the conversation."}, {"text": "Handle the end_turn stop_reason by extracting and returning the final response", "why": "end_turn is Claude signal that it has completed the task — extracting the final text response correctly closes the loop and returns the result to the user.", "see": "When stop_reason is end_turn, your loop exits and returns the text content from the final response."}, {"text": "Test with a prompt that requires multiple sequential tool calls (e.g., search for a value then calculate something with it) and verify the loop continues correctly through all iterations", "why": "Sequential tool calls test the full loop lifecycle — the agent must complete one tool call, receive the result, reason about it, and decide to call another tool before finally returning.", "see": "At least two tool call iterations before end_turn. The agent searches first, uses the search result in a calculation, then returns the combined answer."}, {"text": "Add a safety iteration cap of 20 as a maximum bound (not the primary stopping mechanism) and log a warning if it triggers", "why": "The exam distinguishes safety caps (acceptable as a fallback) from using caps as the primary stopping mechanism (an anti-pattern). Your cap should never trigger in normal operation.", "see": "A MAX_ITERATIONS constant, a counter that increments each loop, and a warning log if the cap is hit. Normal queries should terminate via stop_reason well before reaching 20."}], "file": "exercise-1-1.md", "starter": ["agent_loop.py", "import anthropic\n\nclient = anthropic.Anthropic()\nMAX_ITERATIONS = 20  # safety cap only — stop_reason is the real signal\n\ntools = [\n    {\"name\": \"calculator\",\n     \"description\": \"Evaluate a math expression. Input: an arithmetic \"\n                    \"expression string like '42 * 1.5'. Returns the numeric result.\",\n     \"input_schema\": {\"type\": \"object\",\n                      \"properties\": {\"expression\": {\"type\": \"string\"}},\n                      \"required\": [\"expression\"]}},\n    {\"name\": \"web_search\",\n     \"description\": \"Search the web for a fact. Input: a query string. \"\n                    \"Returns a list of result snippets (mock).\",\n     \"input_schema\": {\"type\": \"object\",\n                      \"properties\": {\"query\": {\"type\": \"string\"}},\n                      \"required\": [\"query\"]}},\n]\n\ndef run_tool(name, args):\n    if name == \"calculator\":\n        return str(eval(args[\"expression\"], {\"__builtins__\": {}}))\n    if name == \"web_search\":\n        return f\"[mock results for: {args['query']}]\"\n    raise ValueError(name)\n\nmessages = [{\"role\": \"user\", \"content\": \"YOUR QUERY HERE\"}]\nfor i in range(MAX_ITERATIONS):\n    resp = client.messages.create(model=\"claude-sonnet-4-6\", max_tokens=1024,\n                                  tools=tools, messages=messages)\n    # TODO step 2: check resp.stop_reason\n    # TODO step 3: if \"tool_use\", run tool, append assistant turn + tool_result\n    # TODO step 4: if \"end_turn\", extract text and return\n    break\n"]}, {"id": "1.2", "title": "Build a Hub-and-Spoke Research Coordinator", "domain": 1, "difficulty": "Intermediate", "estimate": "60 minutes", "source": "https://claudecertificationguide.com/learn/1-agentic-architecture/1-2-orchestration-patterns#build-exercise", "steps": [{"text": "Create a coordinator agent that accepts a broad research topic as input", "why": "The coordinator is the central hub in hub-and-spoke architecture. The exam tests whether you understand that the coordinator owns task decomposition, subagent selection, and result aggregation — not the subagents.", "see": "A coordinator function that accepts a topic string and returns a structured research report. It should have a system prompt defining its role as the orchestrating hub."}, {"text": "Implement task decomposition logic that breaks the topic into at least 5 distinct subtopics covering the full breadth of the subject", "why": "Narrow decomposition is a specific exam failure pattern. The coordinator that only assigns solar and wind for renewable energy misses entire categories. The exam expects you to recognise that incomplete output traces back to the coordinator decomposition.", "see": "A decomposition function that produces 5 or more subtopics for any broad topic. For renewable energy, it should cover solar, wind, geothermal, tidal, biomass, and fusion at minimum."}, {"text": "Spawn two subagents (web search and document analysis) with explicit context passing — include all relevant information in each subagent prompt", "why": "Subagent isolation means no shared memory and no inherited context. The exam heavily tests this: if a subagent produces poor results, check whether the coordinator gave it sufficient context, not whether the subagent itself is flawed.", "see": "Two subagent invocations where each receives the full assigned subtopic, the research goal, and any relevant context from prior agents — all explicitly included in the prompt."}, {"text": "Aggregate results from both subagents and evaluate coverage completeness", "why": "The coordinator must evaluate whether the combined results cover the full breadth of the original topic. This is where iterative refinement starts — gaps detected here trigger re-delegation.", "see": "An aggregation function that combines results from both subagents and produces a coverage assessment listing which subtopics are well-covered, partially covered, or missing."}, {"text": "Implement an iterative refinement loop: if the coordinator identifies coverage gaps, re-delegate to subagents with targeted queries and re-invoke until coverage is sufficient", "why": "Iterative refinement is a core coordinator responsibility the exam tests. A single-shot delegation is not enough — the coordinator must evaluate output and re-delegate for gaps. This distinguishes a coordinator from a simple dispatcher.", "see": "A loop that checks coverage, identifies gaps, sends targeted follow-up queries to subagents for the missing subtopics, and re-evaluates until a coverage threshold is met or a maximum iteration count is reached."}, {"text": "Test with the topic renewable energy technologies and verify that the final output covers solar, wind, geothermal, tidal, biomass, and fusion", "why": "This specific test case maps to the exam narrow decomposition failure pattern. If your output only covers solar and wind, the root cause is the coordinator decomposition — the exact diagnostic the exam expects you to make.", "see": "A final research report with substantive sections on all six energy types: solar, wind, geothermal, tidal, biomass, and fusion. The coverage evaluation should show 100% completeness."}], "file": "exercise-1-2.md", "starter": null}, {"id": "1.3", "title": "Implement Context Passing with Structured Metadata", "domain": 1, "difficulty": "Intermediate", "estimate": "50 minutes", "source": "https://claudecertificationguide.com/learn/1-agentic-architecture/1-3-subagent-invocation-context#build-exercise", "steps": [{"text": "Create a coordinator agent with Task (or Agent) in its allowedTools", "why": "Task is the hard gate for subagent spawning (renamed Agent in current Claude Code v2.1.63; Task still works as an alias). Without it in allowedTools, the coordinator cannot invoke any subagent. The exam tests this as a binary requirement — it is not optional or configurable at runtime.", "see": "A query() call whose options include allowedTools explicitly containing Agent (or Task) alongside any other tools the coordinator needs directly, plus the subagent definitions under options.agents."}, {"text": "Define two subagents: a web search agent that returns results with source URLs and titles, and a document analysis agent that returns analysis with page references", "why": "Each subagent needs scoped tool access matching its role. The exam tests whether you define subagents with proper AgentDefinition fields: description, system prompt, and tool restrictions.", "see": "Two AgentDefinition objects, each with a description, system prompt, and restricted tool set. The web search agent has search tools only; the document analysis agent has file reading tools only."}, {"text": "Design a structured output format that separates content from metadata: each finding includes claim, source_url, document_name, page_number, and confidence", "why": "The exam specifically tests the attribution failure pattern: when a synthesis agent produces unsourced claims, the root cause is that the coordinator passed content without structured metadata. Separating content from metadata is the fix.", "see": "A TypeScript interface or JSON schema defining the Finding type with both content fields (claim, analysis) and metadata fields (source_url, document_name, page_number, confidence, retrieved_by)."}, {"text": "Pass complete structured results from both subagents to a synthesis subagent, preserving all metadata", "why": "This is the critical step the exam targets. Stripping metadata before passing to the synthesis agent is the root cause of attribution failures. The coordinator must pass the full structured output, not just the claim text.", "see": "The coordinator passes the complete findings array (with all metadata intact) to the synthesis agent prompt. No metadata fields are stripped or summarised away."}, {"text": "Verify that the synthesis agent can attribute every claim in its output to a specific source with URL and page number", "why": "This verification step confirms the context passing worked. If any claim lacks attribution, trace back to whether the metadata was actually passed — do not blame the synthesis agent prompt.", "see": "A synthesis report where every factual claim includes a citation with source URL and page number. No orphaned claims without attribution."}, {"text": "Refactor the coordinator to spawn both research subagents in parallel using multiple Task tool calls in a single response", "why": "The exam tests latency awareness. Sequential spawning of independent subagents wastes time. Parallel spawning via multiple Task tool calls in a single coordinator response is the correct pattern for independent tasks.", "see": "Both the web search and document analysis subagents invoked simultaneously via parallel Task tool calls, with the coordinator waiting for both to complete before proceeding to synthesis."}], "file": "exercise-1-3.md", "starter": null}, {"id": "1.4", "title": "Build a Prerequisite Gate for Financial Operations", "domain": 1, "difficulty": "Advanced", "estimate": "60 minutes", "source": "https://claudecertificationguide.com/learn/1-agentic-architecture/1-4-workflow-enforcement-handoff#build-exercise", "steps": [{"text": "Create a customer support agent with three tools: get_customer (returns customer ID and verification status), lookup_order (returns order details), and process_refund (processes a refund for a given amount)", "why": "These three tools create the exact scenario the exam uses for the 8% failure rate question. The workflow dependency between get_customer and process_refund is where programmatic enforcement becomes essential.", "see": "Three tool definitions with proper JSON Schema input_schema. get_customer accepts a name or email, lookup_order accepts an order ID, and process_refund accepts a customer ID and amount."}, {"text": "Implement a programmatic prerequisite gate that blocks process_refund from executing until get_customer has returned a verified customer ID in the current session", "why": "This is the core exam concept: prompt instructions work 92% of the time but fail 8%. A prerequisite gate provides 100% deterministic enforcement. The exam always rejects prompt-based solutions for financial operations.", "see": "A session-level state tracker that records whether get_customer has returned a verified customer. The process_refund handler checks this state before executing and returns an error if verification has not occurred."}, {"text": "Test that the gate works by prompting the agent to skip verification and process a refund directly — verify the gate blocks the attempt", "why": "Testing the bypass attempt demonstrates the difference between prompt-based and programmatic enforcement. Even when the model decides to skip verification, the gate blocks the action — which is the entire point of deterministic enforcement.", "see": "The agent attempts to call process_refund without prior verification. The gate returns a blocked error message. The agent then calls get_customer before retrying the refund successfully."}, {"text": "Implement a structured handoff protocol: when the agent cannot resolve an issue, it compiles a self-contained summary with customer ID, conversation summary, root cause analysis, refund amount, and recommended action", "why": "Human agents do NOT have access to the conversation transcript. The handoff summary is the only information they receive. The exam tests whether you include all five required fields: customer ID, summary, root cause, amount, and recommended action.", "see": "A handoff function that produces a structured object with all five fields populated. No field should be empty or contain placeholder text."}, {"text": "Test the handoff with a multi-concern request (return plus billing dispute plus account update) and verify the handoff summary is complete and self-contained", "why": "Multi-concern requests test whether the agent decomposes the request into distinct items and addresses all of them. The exam expects decomposition, parallel investigation, and unified resolution — not sequential handling or forgetting items.", "see": "The agent identifies all three concerns, investigates each one, and produces a handoff summary that covers all three issues with specific details for each. No concern is omitted."}], "file": "exercise-1-4.md", "starter": ["prerequisite_gate.py", "# Session-level prerequisite gate for financial operations\nclass Session:\n    def __init__(self):\n        self.verified_customer_id = None\n\n    def get_customer(self, name_or_email):\n        # ... lookup ...\n        customer = {\"id\": \"CUST-123\", \"verified\": True}\n        if customer[\"verified\"]:\n            self.verified_customer_id = customer[\"id\"]\n        return customer\n\n    def process_refund(self, customer_id, amount):\n        if self.verified_customer_id is None:\n            return {\"error\": \"BLOCKED: get_customer must return a verified \"\n                             \"customer before process_refund can execute.\"}\n        # ... process ...\n        return {\"status\": \"refunded\", \"amount\": amount}\n"]}, {"id": "1.5", "title": "Implement Agent SDK Hooks for Normalisation and Policy Enforcement", "domain": 1, "difficulty": "Advanced", "estimate": "60 minutes", "source": "https://claudecertificationguide.com/learn/1-agentic-architecture/1-5-agent-sdk-hooks#build-exercise", "steps": [{"text": "Create an agent with three MCP tools that return data in different formats: Tool A returns Unix timestamps and numeric status codes, Tool B returns ISO 8601 dates and string statuses, Tool C returns DD/MM/YYYY dates and single-character status codes", "why": "This recreates the data format chaos example from the exam. Without normalisation, the model must interpret three different date formats and three different status representations, leading to inconsistent parsing across iterations.", "see": "Three tool implementations that each return data with distinct date and status formats. Tool A uses epoch seconds and numeric codes, Tool B uses ISO strings and English statuses, Tool C uses DD/MM/YYYY and single characters."}, {"text": "Implement a PostToolUse hook that intercepts all tool results and normalises dates to ISO 8601 format and status codes to human-readable English strings", "why": "PostToolUse hooks run after execution but before the model processes the result. This is the correct hook direction for data normalisation — the exam tests whether you know that PostToolUse transforms data after execution, not before.", "see": "A hook function that detects the format of each field and converts it: Unix timestamps to ISO 8601, DD/MM/YYYY to ISO 8601, numeric status codes to English strings, and single-character codes to full words."}, {"text": "Verify the model receives consistent data by testing with queries that require results from all three tools", "why": "Consistent data eliminates interpretation errors. Without normalisation, the model might confuse day/month order in DD/MM/YYYY or misinterpret status code P as processed instead of pending. Verification proves the hook works across all tool outputs.", "see": "Three tool results that all use ISO 8601 dates and English status strings, regardless of which tool produced them. The model response should reference dates and statuses consistently without confusion."}, {"text": "Add a PreToolUse hook that blocks process_refund when the amount exceeds $500 and redirects to a human escalation workflow", "why": "A PreToolUse hook runs before execution — the refund never processes. The exam specifically warns against using PostToolUse for blocking, because by that point the action has already occurred. Pre-execution interception is the only correct hook direction for policy enforcement.", "see": "A pre-execution hook that inspects process_refund calls, checks the amount parameter, and blocks the call with a redirect message if the amount exceeds 500. The refund tool never executes for blocked calls."}, {"text": "Add a second PreToolUse hook that blocks transfer_funds until aml_check has returned a pass result in the current session", "why": "This is the AML compliance scenario from the exam. Prompt instructions achieve 95% compliance, but regulatory requirements demand 100%. The hook provides deterministic enforcement that no prompt can match — a single missed AML check can result in legal penalties.", "see": "A pre-execution hook that checks session state for a completed AML check before allowing transfer_funds to execute. Without a prior passing aml_check, the transfer is blocked with a descriptive error."}, {"text": "Test both hooks by attempting to trigger the blocked operations and verify they are prevented before execution", "why": "Testing confirms that the hooks provide deterministic enforcement. The key verification is that blocked tools never execute — the hook prevents the call, not just logs a warning after the fact.", "see": "Both blocked operations return interception messages without the underlying tool executing. After satisfying prerequisites (completing AML check, reducing refund amount), the operations succeed."}], "file": "exercise-1-5.md", "starter": null}, {"id": "1.6", "title": "Build a Multi-Pass Code Review Pipeline", "domain": 1, "difficulty": "Advanced", "estimate": "60 minutes", "source": "https://claudecertificationguide.com/learn/1-agentic-architecture/1-6-task-decomposition#build-exercise", "steps": [{"text": "Create a code review agent that accepts a directory path containing at least 10 source files", "why": "The 10+ file threshold is where attention dilution becomes observable. The exam uses a 14-file example where detailed feedback for early files degrades to superficial analysis for later files. Your setup must replicate this scale.", "see": "A code review function that reads all files in a directory and prepares them for analysis. It should handle at least 10 TypeScript or JavaScript source files."}, {"text": "Implement a single-pass review that processes all files at once and record the results", "why": "The single-pass approach is the baseline that demonstrates attention dilution. The exam expects you to recognise the symptoms: thorough analysis for early files, shallow analysis for later files, and contradictory pattern evaluation.", "see": "A review result where early files receive detailed feedback with specific line references and bug identification, while later files receive increasingly brief or missing feedback. This is the attention dilution pattern."}, {"text": "Implement per-file local analysis passes that produce structured feedback for each file individually (bug count, severity, specific line references)", "why": "Per-file passes give each file the full attention budget. This is the first layer of multi-pass architecture. The exam contrasts this with single-pass to show that structural decomposition solves attention dilution, not better prompts or larger context windows.", "see": "Consistent analysis depth across all files. The last file receives the same level of detail as the first. Each review includes bug count, severity ratings, and specific line references in a structured format."}, {"text": "Implement a cross-file integration pass that checks for data flow issues, API consistency, and pattern usage consistency across all files", "why": "Per-file passes catch local issues but miss cross-cutting concerns. The exam tests whether you include a cross-file integration pass — batching without it still misses data flow issues and pattern inconsistencies across files.", "see": "A separate analysis that takes the per-file summaries and checks for cross-file issues: inconsistent API usage, data flow problems between modules, and patterns used differently across files."}, {"text": "Compare results: document which issues the single-pass review caught versus the multi-pass approach, paying special attention to consistency of analysis depth across all files", "why": "This comparison demonstrates the exam argument quantitatively. Attention dilution is not a model capability problem — it is an architectural problem. The same model produces better results with multi-pass architecture, proving the fix is structural.", "see": "A comparison table showing: more total issues found by multi-pass, consistent issue counts across files (no drop-off for later files), and cross-file issues caught only by the integration pass."}, {"text": "Record any cases where the single-pass review flagged a pattern in one file but approved identical code in another — these are attention dilution artefacts", "why": "Contradictory pattern evaluation is the clearest symptom of attention dilution. The exam uses the forEach example: flagged as inefficient in File 3, approved without comment in File 11. Documenting these artefacts proves the structural nature of the problem.", "see": "At least one case where the single-pass review treated identical code patterns differently across files. The multi-pass review should treat the same pattern consistently."}], "file": "exercise-1-6.md", "starter": null}, {"id": "1.7", "title": "Implement Session Management Strategies", "domain": 1, "difficulty": "Intermediate", "estimate": "45 minutes", "source": "https://claudecertificationguide.com/learn/1-agentic-architecture/1-7-session-state-resumption#build-exercise", "steps": [{"text": "Create a Claude Code session that analyses a 10-file codebase and name it with --name for later resumption", "why": "Named sessions resumed with --resume enable continuation of work across breaks. The exam tests when resume is appropriate (no files changed) versus when it creates the stale context problem (files have been modified since the last session).", "see": "A named Claude Code session that reads and analyses 10 source files. The session name should be memorable for later resumption. The agent should produce findings about each file."}, {"text": "Record the key findings from the initial analysis as a structured summary (file names, issues found, recommendations)", "why": "This structured summary is the knowledge you will inject into the fresh session later. The exam tests whether you preserve prior findings without carrying stale tool results. A good summary captures conclusions without raw tool output.", "see": "A structured document listing each file name, the issues found in it, severity ratings, and specific recommendations. This should be concise enough to inject into a prompt but complete enough to preserve all key findings."}, {"text": "Modify 3 files in the codebase to fix some of the identified issues", "why": "Modifying files after a session creates the conditions for stale context. The old file contents remain as tool results in the session history while the actual files now contain different code. This is the exact scenario that triggers the contradictory advice bug.", "see": "Three files modified with fixes for the issues identified in the initial analysis. The changes should be substantive enough that the old and new versions would produce different analysis results."}, {"text": "Attempt to resume the session with --resume and observe any stale context issues (contradictory advice, references to old code)", "why": "This demonstrates the stale context problem. The resumed session contains old tool results showing the unfixed code. The agent may recommend fixing issues that are already fixed, or give contradictory advice by referencing both old and new file contents.", "see": "The agent giving contradictory advice: recommending fixes for issues already resolved, referencing code that no longer exists, or providing inconsistent guidance about the modified files. These are the hallmarks of stale context."}, {"text": "Start a fresh session with the structured summary injected into the initial prompt, specifying the 3 changed files for targeted re-analysis", "why": "Fresh start with summary injection is the correct approach when files have changed. The exam specifically tests this: no stale tool results, preserved knowledge from the prior session, and targeted re-analysis of only the changed files instead of wasteful full re-exploration.", "see": "A clean session that knows about the prior findings (from the injected summary), targets only the 3 changed files for re-analysis, and produces consistent advice without contradictions."}, {"text": "Compare the quality and consistency of advice between the stale resume and the fresh start with targeted re-analysis", "why": "This comparison demonstrates why the exam favours fresh start with summary injection over naive resume after file changes. The fresh start produces consistent, accurate advice while the resume produces contradictions from stale context.", "see": "A clear quality difference: the resume session gives contradictory or outdated advice about the modified files, while the fresh session gives accurate, consistent analysis based on the current file contents."}], "file": "exercise-1-7.md", "starter": null}, {"id": "2.1", "title": "Design Tool Descriptions That Eliminate Misrouting", "domain": 2, "difficulty": "Beginner", "estimate": "30 minutes", "source": "https://claudecertificationguide.com/learn/2-tool-design-mcp/2-1-tool-schema-design#build-exercise", "steps": [{"text": "Create two MCP tools with intentionally ambiguous descriptions (e.g. get_customer: Retrieves customer information and lookup_order: Retrieves order details)", "why": "Reproducing a misrouting scenario first-hand builds intuition for why minimal descriptions fail. The exam tests your ability to identify ambiguous descriptions as the root cause of tool selection errors.", "see": "Two tool definitions registered with your MCP server, each having a single-sentence description that does not mention input formats, example queries, or boundaries."}, {"text": "Test with 10 queries covering different user intents and log which tool the model selects for each", "why": "Quantifying selection accuracy before and after description changes gives you concrete evidence of the impact. The exam expects you to know that description quality directly affects selection reliability.", "see": "A log showing at least 2-3 misrouted queries where the model selected get_customer for order-related queries or vice versa, demonstrating the ambiguity problem."}, {"text": "Rewrite both descriptions to include: purpose, expected inputs with formats, example queries, edge cases, and explicit boundaries against the other tool", "why": "This is the core exam skill — the lowest-effort, highest-leverage fix for misrouting. Production-grade descriptions include all five elements: purpose, inputs, examples, edge cases, and boundaries.", "see": "Each tool description is 3-5 sentences long, explicitly states accepted identifier formats, gives example queries, and includes a boundary statement like \"Do NOT use for order-specific queries — use lookup_order for those.\""}, {"text": "Re-run the same 10 queries and compare selection accuracy before and after", "why": "Measuring improvement validates that description quality is the root cause. The exam expects you to understand that better descriptions produce measurably better selection without any architectural changes.", "see": "Selection accuracy improves to 9/10 or 10/10 correct, with previously misrouted queries now hitting the correct tool. A clear before/after comparison showing the improvement."}, {"text": "Review your system prompt for keyword-sensitive instructions that could override the improved descriptions", "why": "System prompt conflicts are a subtle failure mode the exam tests. Keywords like \"always check customer details\" can create unintended tool associations that override even well-written descriptions.", "see": "A list of any keyword-sensitive phrases in your system prompt that could trigger incorrect tool associations, along with rewritten versions that avoid the conflict."}], "file": "exercise-2-1.md", "starter": null}, {"id": "2.2", "title": "Build Structured Error Responses for All Four Categories", "domain": 2, "difficulty": "Intermediate", "estimate": "45 minutes", "source": "https://claudecertificationguide.com/learn/2-tool-design-mcp/2-2-structured-error-responses#build-exercise", "steps": [{"text": "Create an MCP tool that queries a mock customer database with simulated failure modes", "why": "Simulating failure modes in a controlled environment lets you observe how agents behave when errors lack structure. The exam tests your understanding of how poor error responses cause wasted retries and incorrect escalations.", "see": "An MCP server running with a customer_lookup tool that accepts a customer identifier and a failure_mode parameter to trigger specific error conditions on demand."}, {"text": "Implement four error response types: transient (simulated timeout), validation (invalid input format), business (refund exceeds policy limit), and permission (access denied)", "why": "Each error category demands a different recovery strategy. The exam tests whether you can identify which category an error belongs to and what recovery action is appropriate. Transient errors are retryable; business errors never are.", "see": "Four distinct error responses, each with isError: true, a specific errorCategory value, the correct isRetryable boolean, and a descriptive message explaining what went wrong and what to do next."}, {"text": "Include structured metadata in each error: errorCategory, isRetryable boolean, and a human-readable description", "why": "Structured metadata is what enables intelligent recovery. Without these fields, the agent cannot distinguish a transient timeout from a permanent policy violation. The exam specifically tests whether you know that isRetryable: false means the agent must take an alternative path, not retry.", "see": "Each error response parses to a JSON object containing exactly three fields: errorCategory (one of transient, validation, business, permission), isRetryable (boolean), and description (a sentence explaining the error and suggesting recovery)."}, {"text": "Implement a valid empty result response (isError: false, resultCount: 0) clearly distinguished from an access failure", "why": "This is one of the most critical distinctions in Domain 2. Confusing access failures with valid empty results causes wasted retries and incorrect escalations. The exam tests this directly — an agent retrying a successful empty query is the canonical anti-pattern.", "see": "Two structurally different responses: a valid empty result with isError: false and resultCount: 0 (indicating the query ran successfully but found nothing), and an access failure with isError: true, errorCategory: transient, and isRetryable: true."}, {"text": "Write an agent loop that reads the error metadata and takes appropriate action: retry for transient, fix input for validation, escalate for business, and request credentials for permission", "why": "The agent loop demonstrates the practical outcome of structured error metadata. Each error category maps to a specific recovery action, and the loop must branch correctly. This is exactly the kind of decision logic the exam expects you to design.", "see": "An agent loop that parses the error metadata, branches on errorCategory, retries transient errors up to 3 times with backoff, reformats input for validation errors, escalates business errors to a human, and requests elevated credentials for permission errors."}], "file": "exercise-2-2.md", "starter": null}, {"id": "2.3", "title": "Configure Tool Distribution Across a Multi-Agent System", "domain": 2, "difficulty": "Intermediate", "estimate": "45 minutes", "source": "https://claudecertificationguide.com/learn/2-tool-design-mcp/2-3-tool-distribution-choice#build-exercise", "steps": [{"text": "Design three agent roles (web search, document analysis, synthesis) and assign 4-5 tools to each, scoped to its role", "why": "Tool overload degrades selection reliability. The exam tests the principle that each agent should have 4-5 tools scoped to its specific role. Giving a single agent 18 tools is a known anti-pattern that causes misrouting.", "see": "A configuration object or table listing three agents, each with exactly 4-5 tools. No tool appears in more than one agent role (except scoped cross-role tools added later). Tool names clearly indicate their purpose and scope."}, {"text": "Add a scoped verify_fact tool to the synthesis agent that handles simple lookups directly", "why": "Routing every fact verification through the coordinator adds 2-3 round trips and up to 40% latency. The exam tests the scoped cross-role tool pattern — give the agent a constrained version of a capability for the 85% simple case, routing only complex cases to the coordinator.", "see": "A verify_fact tool added to the synthesis agent toolset with a description that explicitly limits it to simple single-source lookups and states that complex multi-source verifications should be escalated to the coordinator."}, {"text": "Configure tool_choice forced selection on the document analysis agent to ensure extract_metadata runs as the mandatory first step", "why": "Forced selection enforces workflow ordering. The exam tests your knowledge of all three tool_choice modes: auto lets the model choose freely, any guarantees a tool call, and forced selection guarantees a specific tool call. This prevents the model from skipping mandatory steps.", "see": "A document analysis agent configuration where the first API call uses tool_choice with type: tool and name: extract_metadata, and subsequent calls switch to tool_choice: auto for the remaining analysis steps."}, {"text": "Replace a generic fetch_url tool with a constrained load_document that validates document URLs only", "why": "This applies the principle of least privilege to tool design. A generic fetch_url tool can fetch anything from anywhere, enabling misuse. A constrained load_document that validates URLs prevents the agent from fetching arbitrary resources. The exam tests this pattern directly.", "see": "A load_document tool definition that includes URL validation logic (checking for document file extensions or trusted domains) and rejects non-document URLs with a clear error message."}, {"text": "Test with a query that requires all three agents and verify that no cross-role tool misuse occurs", "why": "End-to-end testing validates that your tool distribution works in practice. Cross-role misuse — such as a synthesis agent running its own web searches instead of using provided results — is a common failure the exam expects you to prevent through proper scoping.", "see": "A test run log showing: the web search agent using only its tools, the document analysis agent starting with extract_metadata (forced), and the synthesis agent using compile_report plus verify_fact for simple checks. No agent calls a tool outside its assigned set."}], "file": "exercise-2-3.md", "starter": null}, {"id": "2.4", "title": "Configure MCP Servers with Scoping and Environment Variables", "domain": 2, "difficulty": "Beginner", "estimate": "30 minutes", "source": "https://claudecertificationguide.com/learn/2-tool-design-mcp/2-4-mcp-server-integration#build-exercise", "steps": [{"text": "Create a .mcp.json file in your project root configuring a community MCP server (e.g. GitHub) with command and args", "why": "Project-level .mcp.json is version-controlled and shared with every team member who clones the repository. The exam tests whether you know that team-wide servers belong here, not in ~/.claude.json. Using community servers for standard integrations is always the correct first choice.", "see": "A .mcp.json file at the project root containing an mcpServers object with at least one server entry specifying command (e.g. npx) and args (e.g. -y @modelcontextprotocol/server-github)."}, {"text": "Use ${GITHUB_TOKEN} environment variable expansion for authentication credentials", "why": "Committing credentials directly in .mcp.json is a security risk the exam penalises. The ${VARIABLE_NAME} syntax lets the configuration file reference environment variables without containing the actual values, keeping secrets out of repository history.", "see": "The env section of your server configuration contains ${GITHUB_TOKEN} (not an actual token value). Running git diff confirms no secrets are staged for commit. Each developer sets their own token locally."}, {"text": "Add a personal or experimental MCP server to ~/.claude.json for user-level configuration", "why": "User-level configuration in ~/.claude.json is personal, not version-controlled, and not shared with teammates. The exam tests whether you know the scoping hierarchy: .mcp.json for team servers, ~/.claude.json for personal or experimental servers.", "see": "A ~/.claude.json file with an mcpServers entry for a personal server (e.g. an experimental integration you are testing). This file is NOT in your project repository and NOT in version control."}, {"text": "Expose a content catalogue (e.g. a documentation hierarchy or database schema) as an MCP resource", "why": "MCP resources give agents visibility into available data without requiring exploratory tool calls. Without resources, an agent might call list_tables then describe_table for every table, wasting multiple tool calls. A schema resource makes that information available immediately.", "see": "An MCP resource definition that exposes structured data (e.g. a list of database tables with column types, or a documentation table of contents) accessible at a URI like db://schema/main. The resource should have a name, description, and mimeType."}, {"text": "Enhance the tool descriptions for your configured MCP server to explain capabilities and outputs in detail, preventing the agent from preferring built-in tools", "why": "When an MCP tool has a sparse description, the agent prefers built-in tools like Grep because their descriptions are richer and more detailed. The exam tests whether you know that enhanced MCP descriptions are required to compete with built-in tools for selection priority.", "see": "Tool descriptions that are 3-5 sentences long, explaining what the tool does, what it returns, when to use it, and how it compares to built-in alternatives. For example, a search_codebase tool description that explicitly states it is more accurate than Grep for semantic searches."}], "file": "exercise-2-4.md", "starter": [".mcp.json", "{\n  \"mcpServers\": {\n    \"github\": {\n      \"command\": \"npx\",\n      \"args\": [\"-y\", \"@modelcontextprotocol/server-github\"],\n      \"env\": {\n        \"GITHUB_TOKEN\": \"${GITHUB_TOKEN}\"\n      }\n    }\n  }\n}\n"]}, {"id": "2.5", "title": "Trace and Refactor a Deprecated Function Using Built-in Tools", "domain": 2, "difficulty": "Intermediate", "estimate": "30 minutes", "source": "https://claudecertificationguide.com/learn/2-tool-design-mcp/2-5-built-in-tools#build-exercise", "steps": [{"text": "Use Grep to search for all callers of a target function (e.g. processLegacyOrder) across the codebase", "why": "Grep searches file contents — it is the correct tool for finding function callers. Using Glob here would fail because Glob matches file paths, not contents. The exam tests this distinction directly and penalises candidates who confuse the two.", "see": "A list of file paths containing calls to processLegacyOrder, with line numbers and matching lines showing the exact call sites. For example: src/OrderProcessor.ts:42: await processLegacyOrder(orderId)."}, {"text": "Use Glob to find test files matching the caller filenames (e.g. `**/*.test.tsx`)", "why": "Glob matches file paths by naming pattern — it is the correct tool for finding test files by extension or naming convention. This completes the Grep-then-Glob pattern: content search to find callers, then path matching to find their tests.", "see": "A list of test file paths matching the pattern, such as src/OrderProcessor.test.tsx and src/RefundHandler.test.tsx. These correspond to the caller files found by Grep in the previous step."}, {"text": "Use Read to examine each caller file and understand the usage pattern and context", "why": "Reading files incrementally — only after Grep identifies which files matter — is the correct approach. Reading all source files upfront is a context-budget killer that the exam explicitly penalises. Each Read should be justified by what you discovered in the previous step.", "see": "The full contents of each caller file, showing how processLegacyOrder is called, what parameters are passed, how the return value is used, and whether the function is imported directly or through a wrapper module."}, {"text": "Use Edit to replace the deprecated function call with the new API in each caller file", "why": "Edit is the preferred modification tool because it targets specific text and uses less context than Read + Write. The exam penalises defaulting to Read + Write for every modification. Always try Edit first — it is faster and more precise.", "see": "Each caller file updated with the new API call replacing the deprecated one. For example, processLegacyOrder(orderId) replaced with processOrder(orderId, { validate: true }). The Edit tool confirms the replacement was made successfully."}, {"text": "When Edit fails with a non-unique match, widen old_string with more surrounding lines until it pins down one location (or set replace_all: true if you actually want every occurrence updated). Only fall back to Read + Write if neither option can disambiguate the target", "why": "Edit fails when the target text appears multiple times in the file — this is a safety mechanism, not a bug. Per the Edit tool documentation, the documented recovery is to expand the anchor with more surrounding context until it matches one place, or to use replace_all for global replacements. Both keep you on Edit and cost almost nothing in context. Read + Write loads the entire file for what is usually a single-line change — keep it as a last resort.", "see": "On the first try, Edit fails with an error like: old_string matches 3 locations. On the retry with a wider old_string that includes the surrounding function name or unique adjacent line, Edit succeeds and changes exactly one occurrence. If replace_all: true was the right call, every occurrence is updated atomically."}], "file": "exercise-2-5.md", "starter": null}, {"id": "3.1", "title": "Build a Multi-Level CLAUDE.md Configuration", "domain": 3, "difficulty": "Beginner", "estimate": "30 minutes", "source": "https://claudecertificationguide.com/learn/3-claude-code-config/3-1-claude-md-hierarchy#build-exercise", "steps": [{"text": "Create a project-level .claude/CLAUDE.md with universal coding standards: naming conventions, error handling patterns, and a code review checklist", "why": "Project-level configuration is the foundation of team-wide standards. The exam tests whether you place shared conventions here rather than in user-level config, which is the most common misconfiguration scenario.", "see": "A .claude/CLAUDE.md file at the repository root containing at least three sections: naming conventions, error handling patterns, and a code review checklist. Running /context in the project root lists this file under Memory files."}, {"text": "Create a directory-level CLAUDE.md in a /packages/api/ subdirectory with API-specific conventions (REST endpoint naming, request/response schema requirements)", "why": "Directory-level configuration scopes conventions to a specific package. The exam tests whether you know that directory-level CLAUDE.md applies only within that directory, not across the entire project.", "see": "A CLAUDE.md file inside /packages/api/ containing REST-specific conventions. When you run /context while working in /packages/api/, both the project-level and directory-level files appear under Memory files."}, {"text": "Create .claude/rules/testing.md with test-specific conventions (test naming pattern, assertion style, fixture usage)", "why": "The .claude/rules/ directory holds topic-specific rule files that can optionally include YAML frontmatter for path scoping. Understanding this mechanism is tested alongside path-specific rules in Task Statement 3.3.", "see": "A testing.md file inside .claude/rules/ containing at least three test conventions. Running /context lists this rules file under Memory files."}, {"text": "Use an @ path import in the project-level CLAUDE.md to reference a shared standards file at ./standards/naming.md", "why": "The @ import syntax enables modular organisation of conventions. There is no @import keyword — a path prefixed with @ on its own line is the import. Each package can import only relevant standards, reducing duplication and drift in the source files. The exam tests whether you know the mechanism exists and how the syntax actually looks.", "see": "The project-level .claude/CLAUDE.md contains a line beginning with @ pointing to ./standards/naming.md. A separate file at .claude/standards/naming.md (or standards/naming.md relative to the CLAUDE.md) exists with naming conventions. Running /context confirms the imported content is loaded inline."}, {"text": "Run /context in different directories to verify the correct files are loaded in each context", "why": "The exam tests that the diagnostic command reveals loaded files but does not trigger loading — configuration loads automatically based on location. The guide names /memory for this; current Claude Code reports the loaded set under /context, so that is what you run here.", "see": "In the project root, /context shows the project-level CLAUDE.md and rules files under Memory files. In /packages/api/, it additionally shows the directory-level CLAUDE.md. The imported standards file content appears as part of the project-level configuration."}, {"text": "Move one convention from project-level to user-level (~/.claude/CLAUDE.md) and verify that a different user session does NOT pick it up — confirming the scoping boundary", "why": "This is the exam favourite trap scenario. When conventions live in user-level config, new team members who clone the repo do not receive them. Proving this boundary experimentally cements the concept.", "see": "After moving a convention to ~/.claude/CLAUDE.md, your own /context shows it loaded. A simulated second user session (or a fresh clone without your home directory config) does NOT show that convention. This confirms the scoping boundary."}], "file": "exercise-3-1.md", "starter": [".claude/CLAUDE.md", "# Project standards\n\nCoding style: @./standards/naming.md\nTesting rules: @./standards/testing-requirements.md\n\n## Error handling\n- All API handlers must return a standard error envelope.\n\n## Code review checklist\n- [ ] No secrets in code\n- [ ] Tests cover the change\n"]}, {"id": "3.2", "title": "Create Custom Commands and Skills", "domain": 3, "difficulty": "Intermediate", "estimate": "30 minutes", "source": "https://claudecertificationguide.com/learn/3-claude-code-config/3-2-slash-commands-skills#build-exercise", "steps": [{"text": "Create a project-scoped /review command in .claude/commands/review.md containing a team code review checklist", "why": "Project-scoped commands are shared via git so every developer gets them on clone. The exam tests whether you place team commands in .claude/commands/ (project) vs ~/.claude/commands/ (personal).", "see": "A file at .claude/commands/review.md in the repository. Running /review in Claude Code triggers the code review checklist. The command appears when any developer clones the repository."}, {"text": "Create a personal /brainstorm skill in ~/.claude/skills/brainstorm/SKILL.md with context: fork in the frontmatter", "why": "The context: fork frontmatter option isolates verbose skill output from the main conversation. Without it, codebase analysis output fills the context window and degrades subsequent responses. The exam directly tests this concept.", "see": "A SKILL.md file at ~/.claude/skills/brainstorm/SKILL.md with YAML frontmatter containing context: fork. The skill is available only in your sessions, not shared with teammates."}, {"text": "Add allowed-tools to the brainstorm skill, restricting it to Read, Grep, and Glob (read-only operations)", "why": "The exam guide describes allowed-tools as restricting which tools a skill can access, and that is the expected exam answer. In current Claude Code it pre-approves the listed tools so they run without a permission prompt (disallowed-tools is the actual boundary), but the intent is the same: a read-only analysis skill should never be using Write or Bash.", "see": "The SKILL.md frontmatter now includes an allowed-tools list with exactly Read, Grep, and Glob. Under the exam-guide model the skill cannot use Write or Bash; in current Claude Code the list pre-approves those three tools for promptless use."}, {"text": "Add argument-hint to the brainstorm skill: \"Provide a feature description or codebase area to explore\"", "why": "The argument-hint prompts developers for required parameters when invoking the skill without arguments. This improves developer experience and is one of the three SKILL.md frontmatter options tested on the exam.", "see": "The SKILL.md frontmatter now includes argument-hint. When a developer invokes /brainstorm without arguments, they see a prompt asking for a feature description or codebase area."}, {"text": "Test that /review appears for all project users (shared via git) and /brainstorm only for you", "why": "This verifies the scoping boundary that the exam repeatedly tests: .claude/ is project-scoped and shared via git, while ~/.claude/ is user-scoped and personal. Confirming this experimentally solidifies the concept.", "see": "Running /review works in any clone of the repository. Running /brainstorm works only in your session. A colleague or fresh clone without your home directory config does not see /brainstorm as an available command."}, {"text": "Invoke the brainstorm skill and verify that its verbose output does not appear in the main conversation context", "why": "The context: fork option runs the skill in an isolated sub-agent. The main conversation receives only the summary, not the full verbose output. This is critical for preserving context window tokens during exploratory tasks.", "see": "After invoking /brainstorm with a codebase area, the main conversation shows a concise summary of findings. The verbose file listings, code excerpts, and analysis notes are not visible in the main conversation history. Subsequent responses remain high quality because the context window is not filled with exploration output."}], "file": "exercise-3-2.md", "starter": [".claude/skills/brainstorm/SKILL.md", "---\ncontext: fork\nallowed-tools: [\"Read\", \"Grep\", \"Glob\"]\nargument-hint: \"Provide a feature description or codebase area to explore\"\n---\nExplore the specified area of the codebase.\nReturn a concise summary of structure, key files, and entry points —\nnot raw file listings.\n"]}, {"id": "3.3", "title": "Configure Path-Specific Rules with Glob Patterns", "domain": 3, "difficulty": "Intermediate", "estimate": "30 minutes", "source": "https://claudecertificationguide.com/learn/3-claude-code-config/3-3-path-specific-rules#build-exercise", "steps": [{"text": "Create .claude/rules/testing.md with YAML frontmatter paths: [`\"**/*.test.ts\"`, `\"**/*.test.tsx\"`, `\"**/*.spec.ts\"`] and test conventions (naming, assertions, mocking patterns)", "why": "Path-specific rules with glob patterns are the correct solution for conventions that apply to a file type spread across many directories. The exam favourite scenario is test files co-located with source files across 50+ directories.", "see": "A file at .claude/rules/testing.md with YAML frontmatter containing a paths array with glob patterns. The body contains at least three test conventions covering naming, assertions, and mocking."}, {"text": "Create .claude/rules/api-conventions.md with paths: [`\"src/api/**/*\"`, `\"**/routes/**/*\"`] and API conventions (response shape, validation, error handling)", "why": "Separating API conventions into their own path-scoped rule means they only load when editing API files. This avoids consuming tokens with irrelevant context when working on frontend or infrastructure code.", "see": "A file at .claude/rules/api-conventions.md with YAML frontmatter paths targeting API directories. The body contains at least three API conventions."}, {"text": "Create .claude/rules/terraform.md with paths: [`\"terraform/**/*\"`, `\"**/*.tf\"`] and infrastructure conventions", "why": "Infrastructure conventions are completely irrelevant when editing application code. Path-scoped rules ensure Terraform rules never consume tokens during React or API development sessions.", "see": "A file at .claude/rules/terraform.md with YAML frontmatter paths matching Terraform files. The body contains infrastructure-specific conventions."}, {"text": "Edit a test file and use /memory to verify that testing rules are loaded but API and Terraform rules are not", "why": "This proves the conditional loading mechanism works. The exam tests whether you understand that path-specific rules load only for matching files, and /memory is the diagnostic tool to verify this.", "see": "When editing a .test.ts file, /memory output lists .claude/rules/testing.md as loaded. The .claude/rules/api-conventions.md and .claude/rules/terraform.md files do NOT appear in the /memory output."}, {"text": "Edit an API handler and verify that API rules load while testing and Terraform rules do not", "why": "This is the complementary verification. Switching contexts should swap which rules are loaded, confirming that the glob patterns correctly scope each rule file.", "see": "When editing a file in src/api/, /memory output lists .claude/rules/api-conventions.md as loaded. The testing and Terraform rule files do NOT appear."}, {"text": "Compare the token footprint when all conventions are in root CLAUDE.md versus split into path-specific rules", "why": "Token efficiency is a key exam concept. Root CLAUDE.md loads all conventions for every session regardless of relevance. Path-specific rules load only matching conventions, reducing irrelevant context and preserving token budget for actual work.", "see": "With all conventions in root CLAUDE.md, /memory shows the full set of conventions loaded even when editing a simple utility file. With path-specific rules, /memory shows only the relevant subset. The token count for loaded configuration is measurably smaller when using path-specific rules for targeted editing sessions."}], "file": "exercise-3-3.md", "starter": [".claude/rules/testing.md", "---\npaths: [\"**/*.test.ts\", \"**/*.test.tsx\", \"**/*.spec.ts\"]\n---\n- Tests must use describe/it blocks.\n- Use data factories instead of hardcoded fixtures.\n- Do not mock the database — use a test database.\n"]}, {"id": "3.4", "title": "Practice Plan Mode vs Direct Execution Decision-Making", "domain": 3, "difficulty": "Intermediate", "estimate": "45 minutes", "source": "https://claudecertificationguide.com/learn/3-claude-code-config/3-4-plan-mode-execution#build-exercise", "steps": [{"text": "Identify a complex multi-file task in a codebase (refactoring, migration, or restructuring) and use plan mode to explore dependencies and design an approach", "why": "Plan mode is for tasks with multiple valid approaches, architectural decisions, or multi-file modifications. The exam tests whether you choose plan mode upfront when complexity is stated in the requirements rather than waiting for surprises.", "see": "Claude Code explores the codebase without modifying any files. The output includes: identified dependencies between modules, multiple possible approaches with tradeoffs, and a recommended implementation strategy. No files are changed during the planning phase."}, {"text": "Identify a simple single-file bug and use direct execution to fix it — observe the efficiency gain over planning", "why": "Direct execution is correct when the problem, location, and solution are all clear. The exam tests that you do not over-plan well-understood changes. The decision is about ambiguity, not difficulty.", "see": "Claude Code makes the fix immediately without a planning phase. The change is confined to a single file or function. The total time from prompt to fix is noticeably shorter than the plan mode task above."}, {"text": "Use the hybrid approach: plan mode to design a migration strategy for a library change across multiple files, then switch to direct execution to implement the plan", "why": "The plan-then-execute hybrid is a specific pattern tested on the exam. Plan mode designs the strategy; direct execution applies it consistently. This is the correct approach for tasks like library migrations affecting many files.", "see": "Phase 1 (plan): Claude identifies all files importing the old library, maps API differences, and produces a migration pattern. Phase 2 (execute): Claude applies the migration pattern file by file using the planned approach. The implementation is consistent across all files."}, {"text": "Use the Explore subagent for a verbose codebase discovery task and observe how it keeps the main conversation context clean", "why": "The Explore subagent isolates verbose discovery output so the main conversation context stays focused. Without isolation, extensive file listings and analysis fill the context window and degrade subsequent responses.", "see": "The Explore subagent runs the discovery task and returns a concise summary to the main conversation. The full verbose output (file listings, dependency graphs, code excerpts) is not visible in the main conversation. Subsequent responses in the main conversation remain high quality."}, {"text": "Create a written decision framework: list your criteria for choosing plan mode vs direct execution, with examples for each", "why": "Internalising the decision criteria is essential for the exam. The framework should cover the key distinction: ambiguity determines the mode, not difficulty. A difficult but well-defined fix is direct execution; a simple-sounding feature with multiple approaches is plan mode.", "see": "A clear decision framework with at least four criteria for plan mode and three for direct execution. Each criterion has a concrete example. The framework explicitly addresses the ambiguity-vs-difficulty distinction."}], "file": "exercise-3-4.md", "starter": null}, {"id": "3.5", "title": "Practice Iterative Refinement Techniques", "domain": 3, "difficulty": "Beginner", "estimate": "30 minutes", "source": "https://claudecertificationguide.com/learn/3-claude-code-config/3-5-iterative-refinement#build-exercise", "steps": [{"text": "Describe a code transformation in prose and run it three times, noting how interpretation varies across runs", "why": "This demonstrates the core problem that concrete examples solve. Prose descriptions rely on interpretation, and interpretation varies across runs. Observing this inconsistency firsthand makes the case for switching to examples.", "see": "Three different outputs from the same prose description. The variations may be subtle (different naming choices, different edge case handling) or significant (different structural approaches). This proves that prose alone produces inconsistent results."}, {"text": "Provide 2-3 concrete input/output examples of the same transformation and run it three times — compare the consistency", "why": "Concrete examples are the documented first-line technique for inconsistent interpretation. The model generalises from examples more reliably than from prose. This step proves the effectiveness difference experimentally.", "see": "Three outputs that are consistent with each other and match the pattern established by the examples. The variation observed in the prose-only step is eliminated or drastically reduced."}, {"text": "Write a test suite for a function with happy path, edge cases, and error cases, then iterate by sharing test failures with Claude Code", "why": "Test-driven iteration is the most effective technique for complex transformations. Test failures provide unambiguous feedback — \"Expected X, got Y\" leaves no room for interpretation. This technique complements examples for more complex scenarios.", "see": "After sharing test failures, Claude Code makes targeted fixes that address the specific failing assertions. Each iteration reduces the number of failing tests. The feedback loop is faster and more precise than prose-based corrections."}, {"text": "Use the interview pattern for a task outside your expertise — ask Claude to pose questions before implementing and note what considerations surface", "why": "The interview pattern is for unfamiliar domains where you might miss important requirements. It surfaces considerations an expert would know to address. The exam tests whether you can distinguish this from the examples technique — they solve different problems.", "see": "Claude asks 5-10 targeted questions about requirements, edge cases, and constraints you had not considered. The questions reveal considerations like cache invalidation strategies, consistency requirements, failure modes, or security implications that would have been missed."}, {"text": "Practice batching: give Claude three interdependent issues in one message and observe whether the fix is coherent across all three", "why": "When issues interact, batching them in one message lets the model see all constraints simultaneously. Sequential fixing of interdependent issues causes the model to fix one issue in a way that conflicts with the others. The exam tests this distinction.", "see": "A single coherent fix that addresses all three interdependent issues consistently. The error response shape, the logging format, and the type definitions all align with each other. Compare this to fixing them sequentially, where each fix might conflict with the next."}], "file": "exercise-3-5.md", "starter": null}, {"id": "3.6", "title": "Set Up a CI/CD Pipeline with Claude Code", "domain": 3, "difficulty": "Advanced", "estimate": "45 minutes", "source": "https://claudecertificationguide.com/learn/3-claude-code-config/3-6-cicd-integration#build-exercise", "steps": [{"text": "Write a CI script that runs Claude Code with the -p flag for non-interactive PR analysis", "why": "The -p flag is the single most directly testable fact in Domain 3. Without it, the CI job hangs indefinitely waiting for interactive input. This is Question 10 in the official sample questions.", "see": "A CI script (GitHub Actions YAML, GitLab CI, or similar) that invokes claude -p with a review prompt. The job completes successfully without hanging. The output is printed to stdout and captured by the CI system."}, {"text": "Add --output-format json and --json-schema to produce structured findings with file, line, severity, and message fields", "why": "CI output must be machine-parseable. Automated systems need structured JSON to post inline PR comments, filter by severity, and track findings across runs. Human-readable text output cannot be reliably parsed by downstream tools.", "see": "The Claude Code output is a JSON envelope whose structured_output field conforms to the specified schema. Each finding has file, line, severity, and message fields. Piping the output to jq .structured_output extracts the validated data without errors."}, {"text": "Configure the pipeline to parse the JSON output and post findings as inline PR comments", "why": "Inline PR comments at exact file and line numbers provide actionable feedback. Generic PR-level comments are ignored. Structured JSON output makes precise inline commenting possible.", "see": "Each finding from the JSON output appears as an inline comment on the PR at the exact file and line number. Severity levels are visible. Developers can see the finding in context alongside the code it references."}, {"text": "Add a section to CLAUDE.md documenting testing standards, available fixtures, and review criteria for CI-invoked Claude Code", "why": "Claude Code reads CLAUDE.md in CI just as in interactive mode. Without project context, CI-invoked test generation produces low-value boilerplate. With testing standards and fixture documentation, generated tests follow team patterns.", "see": "The CLAUDE.md file contains a clearly marked CI-relevant section with testing standards, available fixture paths, and review severity criteria. CI-invoked Claude Code produces tests using the documented factories and fixtures rather than generic boilerplate."}, {"text": "Set up two separate Claude Code invocations: one for code generation and an independent one for review (no shared session context)", "why": "The same session that generated code is less effective at reviewing it because it retains reasoning context that biases it toward its own decisions. Independent review instances evaluate code on its own merits without prior justification bias.", "see": "Two distinct claude -p invocations in the CI script: one for generation and one for review. They share no session context. The review invocation analyses the generated code independently. The review findings are more thorough than self-review in the same session."}, {"text": "Implement incremental review: store previous findings, include them in the next review run, and instruct Claude to report only new or still-unaddressed issues", "why": "Without incremental context, each review run analyses the entire PR from scratch and produces duplicate comments. Duplicate comments erode developer trust — when the same five issues appear on every push regardless of fixes, developers stop reading them.", "see": "The first review run produces findings and stores them (as a JSON artifact or file). Subsequent runs include the previous findings in context. The output contains only new issues or issues that remain unaddressed. Previously fixed issues do not reappear as comments."}], "file": "exercise-3-6.md", "starter": [".github/workflows/claude-review.yml", "name: Claude PR Review\non: [pull_request]\n\njobs:\n  review:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Review PR with Claude Code\n        env:\n          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}\n        run: |\n          claude -p \"Review this PR for security issues and bugs\" \\\n            --output-format json \\\n            --json-schema '{\"type\":\"object\",\"properties\":{\"findings\":{\n              \"type\":\"array\",\"items\":{\"type\":\"object\",\n              \"properties\":{\"file\":{\"type\":\"string\"},\n                            \"line\":{\"type\":\"integer\"},\n                            \"severity\":{\"type\":\"string\"},\n                            \"message\":{\"type\":\"string\"}}}}}}'\n"]}, {"id": "4.1", "title": "Build an Explicit Criteria Code Review Prompt", "domain": 4, "difficulty": "Intermediate", "estimate": "45 minutes", "source": "https://claudecertificationguide.com/learn/4-prompt-engineering/4-1-system-prompts#build-exercise", "steps": [{"text": "Write a system prompt with vague instructions (be conservative, only flag important issues) and test it against 5 code snippets containing known bugs, security issues, and style nitpicks", "why": "Establishing a baseline with vague instructions demonstrates the false positive problem the exam tests. You need empirical evidence that phrases like be conservative give the model no actionable decision boundary.", "see": "Inconsistent classification across the 5 snippets: some style nitpicks flagged as critical, some genuine bugs missed or marked minor, and different results if you run the same snippets twice."}, {"text": "Rewrite the prompt with explicit categorical criteria: define exactly which issues to report (bugs, security vulnerabilities) and which to skip (style preferences, local patterns)", "why": "Explicit categorical criteria are the correct approach tested on the exam. This step demonstrates that concrete categories eliminate the ambiguity that causes false positives.", "see": "The rewritten prompt has clear categories: report bugs and security vulnerabilities, skip style preferences and local patterns, flag comments only when claimed behaviour contradicts actual code behaviour."}, {"text": "Add concrete code examples for each severity level — critical, major, minor — showing actual code patterns, not prose descriptions", "why": "The exam specifically tests that code examples outperform prose descriptions for severity calibration. Prose like issues that could cause system failures forces the model to interpret, while code examples remove ambiguity entirely.", "see": "Your prompt now contains at least one code snippet per severity level, each showing the actual pattern that defines that severity, not a prose description of what that severity means."}, {"text": "Compare false positive rates between the two versions on the same test set and document which approach produces more consistent classification", "why": "Quantifying the improvement validates the explicit criteria approach and builds the evaluation skill the exam expects. You should be able to articulate why one approach outperforms the other with data, not intuition.", "see": "A clear reduction in false positives with the explicit criteria version. The vague prompt should produce 30-50% inconsistency while the explicit criteria version should be below 15%. Classification should be stable across repeated runs."}, {"text": "Temporarily disable any category with above 25% false positive rate and document the criteria refinements needed before re-enabling", "why": "The trust recovery strategy is a key exam concept: high false positive rates in one category destroy developer trust in ALL categories. Disabling problematic categories restores system-wide trust while you iterate on their criteria.", "see": "A document listing which categories exceed the 25% threshold, what specific criteria refinements are needed (e.g., add code examples for edge cases), and a re-enablement plan with target false positive rates."}], "file": "exercise-4-1.md", "starter": null}, {"id": "4.2", "title": "Build a Few-Shot Enhanced Extraction Prompt", "domain": 4, "difficulty": "Intermediate", "estimate": "45 minutes", "source": "https://claudecertificationguide.com/learn/4-prompt-e
