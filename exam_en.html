e model. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m32", "source": "mock", "domain": 1, "scenario": null, "situation": "You're implementing the escalation logic for when the agent should call `escalate_to_human`. Your team proposes four different approaches for triggering escalation.", "question": "Which approach will most reliably identify cases that genuinely require human intervention?", "options": [{"letter": "A", "text": "Instruct the agent to escalate when the customer requests a human, when the issue requires policy exceptions, or when the agent cannot make meaningful progress.", "correct": true, "explanation": "Correct. Escalation decisions are judgment calls about intent and progress — exactly what LLMs are good at. Clear criteria in natural language outperform rigid rules for the long tail."}, {"letter": "B", "text": "Configure the agent to escalate after three consecutive tool calls that fail to resolve the customer's stated issue, ensuring a reasonable attempt before involving a human.", "correct": false, "explanation": "A hard retry count fires both too early (legitimate retries) and too late (obvious policy issues on the first call)."}, {"letter": "C", "text": "Implement sentiment analysis that monitors for frustration indicators (negative language, repeated questions, exclamation marks) and trigger escalation when the frustration score exceeds a configured threshold.", "correct": false, "explanation": "Sentiment can catch frustration but misses calm customers who simply need a human for a policy exception, and over-escalates on stylistic language."}, {"letter": "D", "text": "Build a rules engine that maps specific issue types, customer segments, and product categories to escalation decisions, removing the need for model judgment calls.", "correct": false, "explanation": "Rules engines break on the cases they weren't designed for — and customer support is full of those. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m33", "source": "mock", "domain": 1, "scenario": null, "situation": "After investigating a billing dispute over 25+ turns, you've identified that duplicate charges occurred due to a payment gateway timeout triggering retry logic. The required refund ($847) exceeds your $500 authorization limit. You need to call `escalate_to_human`, and the human agent won't have access to your conversation transcript.", "question": "What context should you pass to enable effective resolution?", "options": [{"letter": "A", "text": "The customer's original complaint verbatim plus the tool result excerpts showing duplicate transactions.", "correct": false, "explanation": "Raw artifacts without synthesis force the human to re-do the 25 turns of investigation you just finished."}, {"letter": "B", "text": "A structured summary: customer ID, root cause, refund amount, and recommended action.", "correct": true, "explanation": "Correct. A structured handoff with identifiers, cause, amount, and recommended action is what a human agent needs to pick up the case instantly without re-investigating."}, {"letter": "C", "text": "The complete conversation transcript with all tool results.", "correct": false, "explanation": "Dumping the whole transcript forces the human to wade through 25 turns instead of reading a one-screen brief."}, {"letter": "D", "text": "Your diagnosis and the refund amount only.", "correct": false, "explanation": "Missing customer identifiers and recommended action — the human can't act without them. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m34", "source": "mock", "domain": 1, "scenario": null, "situation": "Compliance requires that refunds exceeding $500 must automatically escalate to a human agent—this rule cannot be left to model discretion. Despite clear system prompt instructions, production logs show the agent occasionally processes high-value refunds directly (3% failure rate).", "question": "How should you achieve guaranteed compliance?", "options": [{"letter": "A", "text": "Modify the refund tool to return an error with message \"Amount exceeds policy limit—please escalate\" when threshold is exceeded.", "correct": false, "explanation": "This helps, but depends on the agent interpreting the error correctly and escalating — still model discretion at the decision point."}, {"letter": "B", "text": "Add few-shot examples to the prompt showing correct escalation behavior at various refund amounts ($400, $500, $600).", "correct": false, "explanation": "Few-shots shift the distribution but don't remove the 3% failure. Compliance says the rule can't be left to model discretion."}, {"letter": "C", "text": "Implement a hook to intercept tool calls; when the refund process amount exceeds $500, block it and invoke human escalation.", "correct": true, "explanation": "Correct. Compliance-grade rules belong outside the model — a deterministic hook on the tool call is guaranteed to fire every time, independent of model behavior."}, {"letter": "D", "text": "Strengthen the system prompt with emphatic language: \"CRITICAL POLICY: Refunds over $500 MUST trigger human escalation. NEVER process these directly.\"", "correct": false, "explanation": "Emphatic prompts reduce but don't eliminate misuse. 'Cannot be left to model discretion' rules out any prompt-only solution. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m35", "source": "mock", "domain": 1, "scenario": null, "situation": "During a billing dispute resolution, your agent successfully retrieves customer info via `get_customer` and order details via `lookup_order`, but when attempting to call `process_refund`, the tool returns a timeout error. The agent has enough information to explain the charges and verify refund eligibility, but cannot actually process the refund due to the backend failure.", "question": "What approach best balances first-contact resolution with appropriate error handling?", "options": [{"letter": "A", "text": "Escalate immediately to a human agent since the refund action cannot be completed", "correct": false, "explanation": "Punts a transient backend issue to a human when the agent could still explain the situation and offer options."}, {"letter": "B", "text": "Implement automatic retries with exponential backoff for `process_refund`, keeping the conversation open until the refund is successfully processed", "correct": false, "explanation": "Forcing the customer to wait on indefinite retries is poor UX and may never succeed if the outage is long-lived."}, {"letter": "C", "text": "Explain the billing, confirm refund eligibility, acknowledge the system issue preventing immediate processing, and offer escalation or retry later", "correct": true, "explanation": "Correct. Deliver the partial value you can (explanation + eligibility), be honest about the failure, and let the customer choose between human escalation or a retry. Classic graceful degradation."}, {"letter": "D", "text": "Confirm the refund will be processed and close the conversation, since the system has all necessary information to complete it automatically", "correct": false, "explanation": "Committing to an outcome that didn't happen is misleading the customer — a bigger failure than the timeout. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m36", "source": "mock", "domain": 1, "scenario": null, "situation": "A customer writes: \"I've been going back and forth on this return for days. I just want to speak to someone who can actually help me.\" The agent has confirmed via `lookup_order` that the return is straightforward—within policy and eligible for immediate processing.", "question": "What should the agent do?", "options": [{"letter": "A", "text": "Acknowledge frustration, inform them this is resolvable now, and offer to complete it or escalate", "correct": true, "explanation": "Correct. Honor the feeling, give them the fast resolution path in writing, and preserve their choice. That's the customer-respect move that still leverages the agent's capability."}, {"letter": "B", "text": "Call `escalate_to_human` immediately to honor the customer's request", "correct": false, "explanation": "Unnecessary queueing when the issue is one tool call away. Frustrates the customer further by adding waiting to an already-simple case."}, {"letter": "C", "text": "Process the refund via `process_refund` to resolve the underlying issue, then inform them it's complete", "correct": false, "explanation": "Takes unilateral action after the customer explicitly asked to speak to someone — overrides their stated preference."}, {"letter": "D", "text": "Ask what specifically hasn't worked in previous attempts before deciding whether to escalate or resolve automatically", "correct": false, "explanation": "Interrogating a frustrated customer about past failures is the opposite of what they asked for. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m39", "source": "mock", "domain": 1, "scenario": null, "situation": null, "question": "When the agent calls `lookup_order` and receives order details showing the item was purchased 45 days ago, how does the agentic loop determine whether to call `process_refund` or `escalate_to_human` next?", "options": [{"letter": "A", "text": "The orchestration layer automatically routes to the next tool based on the order's status field.", "correct": false, "explanation": "There's no implicit orchestration layer picking tools from a field. The model drives tool selection."}, {"letter": "B", "text": "The agent follows a pre-configured decision tree mapping order attributes to specific tool calls.", "correct": false, "explanation": "Agentic loops are model-driven, not decision-tree-driven. Hardcoded trees are the opposite of what the agent pattern is for."}, {"letter": "C", "text": "The order details are added to the conversation and the model reasons about which action to take.", "correct": true, "explanation": "Correct. The agentic loop works by appending `tool_result` messages to the conversation and letting the model decide the next step on each turn. That's how 45 days → refund vs. escalate gets resolved."}, {"letter": "D", "text": "The agent executes the remaining steps in a tool sequence planned at the start of the request.", "correct": false, "explanation": "There's no upfront, committed plan — the agent chooses each next step based on the latest context. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m40", "source": "mock", "domain": 1, "scenario": null, "situation": "A customer sends: \"This is frustrating. I've explained my issue twice and nothing is being resolved. I want to talk to a real person NOW.\" The agent has not yet called any tools to investigate their account.", "question": "What should the agent do?", "options": [{"letter": "A", "text": "Acknowledge the frustration and ask one targeted question to understand the specific issue before escalating.", "correct": true, "explanation": "Correct. The customer has said 'twice' but you have no context yet. One acknowledging, focused question gives you a shot at first-contact resolution without dismissing the frustration or delaying a potential handoff."}, {"letter": "B", "text": "Briefly explain what the agent can help with and offer to resolve the issue quickly, escalating only if the customer repeats their request.", "correct": false, "explanation": "Launching into capability-listing at a frustrated customer who asked for a human reads as dismissive."}, {"letter": "C", "text": "Immediately call `escalate_to_human` with the conversation history.", "correct": false, "explanation": "Escalating with zero tool context creates a cold handoff where the human also starts from scratch."}, {"letter": "D", "text": "First call `get_customer` and `lookup_order` to gather account context, then escalate to a human agent.", "correct": false, "explanation": "Investigating without asking adds latency and doesn't respect the customer's request. A single acknowledging question is faster and more respectful. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m41", "source": "mock", "domain": 1, "scenario": null, "situation": "Your agent is handling a billing dispute. After calling `get_customer` and `lookup_order`, it identifies that the dispute involves a promotional pricing error requiring manager approval—beyond the agent's authorization level.", "question": "How should the workflow handle this mid-process escalation?", "options": [{"letter": "A", "text": "Call `escalate_to_human` passing only the customer's original message.", "correct": false, "explanation": "Drops the tool-derived context the agent just gathered, forcing the human to re-do the investigation."}, {"letter": "B", "text": "Compile a structured handoff with customer details, order info, and the identified issue before calling `escalate_to_human`.", "correct": true, "explanation": "Correct. A structured brief (who, what order, what issue, why it exceeds auth) lets the human agent pick up instantly. That's the mid-process escalation pattern."}, {"letter": "C", "text": "Attempt the refund with `process_refund` anyway, escalating only if the system rejects the transaction.", "correct": false, "explanation": "Knowingly exceeding authorization is a policy violation — not something to try and hope the system catches."}, {"letter": "D", "text": "Persist the complete conversation and tool response history to a database, then call `escalate_to_human` with a reference ID.", "correct": false, "explanation": "Adds infrastructure and an extra lookup step when an inline structured brief is simpler and faster. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "g7", "source": "guide", "domain": 2, "scenario": "Multi-agent Research System", "situation": "Production logs show a persistent pattern: requests like “analyze the uploaded quarterly report” are routed to the web-search agent 45% of the time instead of the document analysis agent. Reviewing tool definitions, you find that the web-search agent has a tool `analyze_content` described as “analyzes content and extracts key information,” while the document analysis agent has a tool `analyze_document` described as “analyzes documents and extracts key information.” How should you fix the misrouting problem?", "question": "How should you fix the misrouting problem?", "options": [{"letter": "A", "text": "Add a pre-routing classifier that detects whether the user refers to uploaded files or web content before the coordinator decides on delegation.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Rename the web-search tool to `extract_web_results` and update its description to “processes and returns information retrieved from web search and URLs.”", "correct": true, "explanation": "Renaming the web-search tool to `extract_web_results` and updating its description to explicitly reference web search and URLs directly removes the root cause by eliminating semantic overlap between the two tool names and descriptions. This makes each tool’s purpose unambiguous, enabling the coordinator to reliably distinguish document analysis from web search."}, {"letter": "C", "text": "Add few-shot examples to the coordinator prompt showing correct routing: “User uploads a quarterly report → document analysis agent” and “User asks about a web page → web-search agent.”", "correct": false, "explanation": ""}, {"letter": "D", "text": "Expand the document analysis tool description with usage examples like “Use for uploaded PDFs, Word docs, and spreadsheets,” leaving the web-search tool unchanged.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g10", "source": "guide", "domain": 2, "scenario": "Multi-agent Research System", "situation": "In your system design, you gave the document analysis agent access to a general-purpose tool `fetch_url` so it could download documents by URL. Production logs show this agent now frequently downloads search engine results pages to perform ad hoc web search—behavior that should be routed through the web-search agent—causing inconsistent results. Which fix is most effective?", "question": "Which fix is most effective?", "options": [{"letter": "A", "text": "Replace `fetch_url` with a `load_document` tool that validates that URLs point to document formats.", "correct": true, "explanation": "Replacing a general-purpose tool with a document-specific tool that validates URLs against document formats fixes the root cause by constraining capability at the interface level. This follows the principle of least privilege, making undesired search behavior impossible rather than merely discouraged."}, {"letter": "B", "text": "Remove `fetch_url` from the document analysis agent and route all URL fetching through the coordinator to the web-search agent.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Implement filtering that blocks `fetch_url` calls to known search engine domains while allowing other URLs.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Add instructions to the document analysis agent prompt that `fetch_url` should only be used to download document URLs, not to search.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g15", "source": "guide", "domain": 2, "scenario": "Multi-agent Research System", "situation": "In testing, you observe that the synthesis agent often needs to verify specific claims while merging results. Currently, when verification is needed, the synthesis agent returns control to the coordinator, which calls the web-search agent and then re-invokes synthesis with the results. This adds 2–3 extra loops per task and increases latency by 40%. Your assessment shows 85% of these verifications are simple fact checks (dates, names, stats) and 15% require deeper research. Which approach most effectively reduces overhead while preserving system reliability?", "question": "Which approach is most effective?", "options": [{"letter": "A", "text": "Give the synthesis agent access to all web-search tools so it can handle any verification need directly without coordinator loops.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end, which then sends them all to the web-search agent at once.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Have the web-search agent proactively cache extra context around each source during initial research in anticipation of synthesis needing verification.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Give the synthesis agent a limited-scope `verify_fact` tool for simple checks, while routing complex verifications through the coordinator to the web-search agent.", "correct": true, "explanation": "A limited-scope fact-verification tool lets the synthesis agent handle 85% of simple checks directly, eliminating most loops, while preserving the coordinator delegation path for the 15% of complex verifications. This applies least privilege while significantly reducing latency."}], "correct": "D"}, {"id": "g18", "source": "guide", "domain": 2, "scenario": "Claude Code for Continuous Integration", "situation": "Your code review component is iterative: Claude analyzes the changed file, then may request related files (imports, base classes, tests) via tool calls to understand context before providing final feedback. Your application defines a tool that lets Claude request file contents; Claude calls the tool, gets results, and continues analysis. You’re evaluating batch processing to reduce API cost. What is the primary technical limitation when considering batch processing for this workflow?", "question": "What is the primary technical limitation?", "options": [{"letter": "A", "text": "Batch processing does not include correlation IDs to map outputs back to input requests.", "correct": false, "explanation": ""}, {"letter": "B", "text": "The asynchronous model cannot execute tools mid-request and return results for Claude to continue analysis.", "correct": true, "explanation": "A “fire-and-forget” asynchronous Batch API model has no mechanism to intercept a tool call during a request, execute the tool, and return results for Claude to continue analysis. This is fundamentally incompatible with iterative tool-calling workflows that require multiple tool request/response rounds within a single logical interaction."}, {"letter": "C", "text": "The Batch API does not support tool definitions in request parameters.", "correct": false, "explanation": ""}, {"letter": "D", "text": "The batch processing latency of up to 24 hours is too slow for pull request feedback, although the workflow would otherwise function.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g46", "source": "guide", "domain": 2, "scenario": "Customer Support Agent", "situation": "While testing, you notice the agent often calls `get_customer` when users ask about order status, even though `lookup_order` would be more appropriate. What should you check first to address this problem?", "question": "What should you check first?", "options": [{"letter": "A", "text": "Implement a preprocessing classifier to detect order-related requests and route them directly to `lookup_order`.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Reduce the number of tools available to the agent to simplify choice.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Add few-shot examples to the system prompt covering all possible order request patterns to improve tool selection.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Check the tool descriptions to ensure they clearly differentiate each tool’s purpose.", "correct": true, "explanation": "Tool descriptions are the primary input the model uses to decide which tool to call. When an agent consistently picks the wrong tool, the first diagnostic step is to verify that tool descriptions clearly separate each tool’s purpose and usage boundaries."}], "correct": "D"}, {"id": "g51", "source": "guide", "domain": 2, "scenario": "Customer Support Agent", "situation": "Production logs show that in 12% of cases your agent skips `get_customer` and calls `lookup_order` directly using only the customer-provided name, sometimes leading to misidentified accounts and incorrect refunds. What change most effectively fixes this reliability problem?", "question": "What change is most effective?", "options": [{"letter": "A", "text": "Add few-shot examples showing that the agent always calls `get_customer` first, even when customers voluntarily provide order details.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Implement a routing classifier that analyzes each request and enables only a subset of tools appropriate for that request type.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Add a programmatic precondition that blocks `lookup_order` and `process_refund` until `get_customer` returns a verified customer identifier.", "correct": true, "explanation": "A programmatic precondition provides a deterministic guarantee that required sequencing is followed. It’s the most effective approach because it eliminates the possibility of skipping verification, regardless of LLM behavior."}, {"letter": "D", "text": "Strengthen the system prompt stating that customer verification via `get_customer` is mandatory before any order operations.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g55", "source": "guide", "domain": 2, "scenario": "Customer Support Agent", "situation": "Your `get_customer` tool returns all matches when searching by name. Currently, when there are multiple results, Claude picks the customer with the most recent order, but production data shows this selects the wrong account 15% of the time for ambiguous matches. How should you address this?", "question": "How should you address this?", "options": [{"letter": "A", "text": "Implement a confidence scoring system that acts autonomously above 85% confidence and requests clarification below the threshold.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Instruct Claude to request an additional identifier (email, phone, or order number) when `get_customer` returns multiple matches before taking any customer-specific action.", "correct": true, "explanation": "Asking the user for an additional identifier is the most reliable way to resolve ambiguity because the user has definitive knowledge of their identity. One extra conversational turn is a small price to pay to eliminate a 15% error rate caused by choosing the wrong account."}, {"letter": "C", "text": "Modify `get_customer` to return only a single most-likely match based on a ranking algorithm, eliminating ambiguity.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Add few-shot examples to the prompt demonstrating correct reasoning and tool sequencing for ambiguous matches.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g57", "source": "guide", "domain": 2, "scenario": "Customer Support Agent", "situation": "Production logs show the agent often calls `get_customer` when users ask about orders (e.g., “check my order #12345”) instead of calling `lookup_order`. Both tools have minimal descriptions (“Gets customer information” / “Gets order details”) and accept similar-looking identifier formats. What is the most effective first step to improve tool selection reliability?", "question": "What is the most effective first step?", "options": [{"letter": "A", "text": "Implement a routing layer that analyzes user input before each turn and preselects the correct tool based on detected keywords and ID patterns.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Combine both tools into a single `lookup_entity` that accepts any identifier and internally decides which backend to query.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Add few-shot examples to the system prompt demonstrating correct tool selection patterns, with 5–8 examples routing order-related queries to `lookup_order`.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Expand each tool’s description to include input formats, example queries, edge cases, and boundaries explaining when to use it versus similar tools.", "correct": true, "explanation": "Expanding tool descriptions with input formats, example queries, edge cases, and clear boundaries directly fixes the root cause—minimal descriptions that don’t give the LLM enough information to distinguish similar tools. It’s a low-effort, high-impact first step that improves the primary mechanism the LLM uses for tool selection."}], "correct": "D"}, {"id": "g59", "source": "guide", "domain": 2, "scenario": "Customer Support Agent", "situation": "Production logs show the agent misinterprets outputs from your MCP tools: Unix timestamps from `get_customer`, ISO 8601 dates from `lookup_order`, and numeric status codes (1=pending, 2=shipped). Some tools are third-party MCP servers you cannot modify. Which approach to data format normalization is most maintainable?", "question": "Which approach is most maintainable?", "options": [{"letter": "A", "text": "Use a PostToolUse hook to intercept tool outputs and apply formatting transformations before the agent processes them.", "correct": true, "explanation": "A PostToolUse hook provides a centralized, deterministic point to intercept and normalize all tool outputs—including third-party MCP server data—before the agent processes them. It’s more maintainable because transformations live in code and apply uniformly, rather than relying on LLM interpretation."}, {"letter": "B", "text": "Modify tools you control to return human-readable formats and create wrappers for third-party tools.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Create a `normalize_data` tool that the agent calls after every data retrieval to transform values.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Add detailed format documentation to the system prompt explaining each tool’s data conventions.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g61", "source": "guide", "domain": 2, "scenario": "Conversational AI Architecture Patterns", "situation": "Your `remove_team_member` tool uses a `dry_run: boolean` parameter for previewing impacts before execution. Production monitoring shows the agent bypasses the preview step by calling with `dry_run=false` directly. You need to ensure every removal is preceded by a preview that the user explicitly confirms.", "question": "What is the most reliable approach?", "options": [{"letter": "A", "text": "Add server-side validation that permits `dry_run=false` only when a `dry_run=true` call with identical parameters occurred within the past 60 seconds.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Annotate the tool as requiring confirmation and configure the orchestration layer to prompt the user for approval before forwarding any calls to annotated tools.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Add detailed instructions and few-shot examples to the tool description requiring the agent to always call with `dry_run=true` first and wait for user confirmation before calling again.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Replace with two tools: `preview_remove_member` returns impact details and a single-use confirmation token; `execute_remove_member` requires that token, binding execution to the preview.", "correct": true, "explanation": "The two-tool token-binding approach makes it architecturally impossible to execute without a prior preview—the execute tool literally requires a token that only the preview tool can generate. This is the only approach that enforces the constraint at the code level rather than relying on LLM compliance with instructions (C), timing heuristics (A), or orchestration infrastructure (B)."}], "correct": "D"}, {"id": "g62", "source": "guide", "domain": 2, "scenario": "Conversational AI Architecture Patterns", "situation": "Production monitoring shows your `search_catalog` tool fails 12% of the time: 8% are network timeouts that succeed when retried, and 4% are query syntax errors that never succeed regardless of retries. Currently both error types are returned identically, causing wasted retries.", "question": "How should you modify the tool's error handling?", "options": [{"letter": "A", "text": "Add few-shot examples to your system prompt demonstrating how to distinguish network errors from syntax errors.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Apply exponential backoff retry logic to all errors uniformly.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Implement automatic retry with backoff for network timeouts inside the tool; return syntax errors immediately with parameter validation details.", "correct": true, "explanation": "Handling retries at the tool level for transient errors is the correct abstraction boundary—the tool has definitive knowledge of the error type and can implement deterministic retry logic without relying on the agent to interpret a flag (D) or follow prompt-level instructions (A). Uniform backoff (B) wastes time on syntax errors that will never succeed."}, {"letter": "D", "text": "Return all errors with a `retryable` boolean flag and error type details.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "m3", "source": "mock", "domain": 2, "scenario": null, "situation": "The document analysis agent has a single `analyze_document` tool that takes a document and a free-text instruction parameter. During evaluation, requests like \"extract the key financial metrics\" often return narrative summaries, while \"summarize the methodology\" sometimes returns raw data tables. The synthesis agent reports that 35% of analysis results require re-requests with clarified instructions.", "question": "What's the most effective way to improve reliability?", "options": [{"letter": "A", "text": "Split the generic tool into purpose-specific tools—`extract_data_points`, `summarize_content`, `verify_claim_against_source`—each with defined input/output contracts.", "correct": true, "explanation": "Correct. Free-text instructions put the semantics in prose, which the model interprets inconsistently. Purpose-specific tools give the model an explicit, well-typed contract to pick between."}, {"letter": "B", "text": "Keep the single tool but add an `analysis_type` enum parameter requiring explicit selection between extraction, summarization, and verification modes.", "correct": false, "explanation": "Better than free text, but still a single tool with a single output shape. Output still has to be a generic string, and the model can mode-mismatch. Separate tools enforce distinct I/O contracts."}, {"letter": "C", "text": "Have the coordinator pre-classify each analysis request before passing instructions to the document analysis agent.", "correct": false, "explanation": "Moves the ambiguity upstream without fixing it. The tool contract is still fuzzy; the coordinator's classification is one more error surface."}, {"letter": "D", "text": "Enhance the tool description with detailed examples showing how different instruction phrasings should map to different output formats.", "correct": false, "explanation": "Examples help, but tool-use reliability comes first from clear tool boundaries and output schemas, not from heroic prompt engineering on one generic tool. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m16", "source": "mock", "domain": 2, "scenario": null, "situation": "After integrating a local MCP server providing code analysis tools (`analyze_dependencies`, `find_dead_code`, `calculate_complexity`), you verify the server is healthy and tools appear in the tools/list response. However, you observe that the agent consistently uses Grep to search for import statements instead of calling `analyze_dependencies`—even when users explicitly ask about \"code dependencies.\" Examining tool definitions reveals: MCP: `analyze_dependencies` - \"Analyzes dependency graph\" Built-in: Grep - \"Search file contents for a pattern using regular expressions. Returns matching lines with line numbers and surrounding context.\"", "question": "What's the most effective approach to improve the agent's selection of MCP tools?", "options": [{"letter": "A", "text": "Remove Grep from available tools when the MCP server is connected to eliminate functional overlap.", "correct": false, "explanation": "Crippling a general tool to force adoption of a specialized one punishes other legitimate Grep use cases."}, {"letter": "B", "text": "Add routing instructions to the system prompt specifying that dependency-related questions should use MCP tools rather than Grep.", "correct": false, "explanation": "Prompt-level routing can help, but the root cause is that the MCP tool's description is thinner than Grep's. Fix the tool descriptions first."}, {"letter": "C", "text": "Split `analyze_dependencies` into granular tools (`list_imports`, `resolve_transitive_deps`, `detect_circular_deps`) so each has a focused purpose less likely to overlap with Grep.", "correct": false, "explanation": "Splitting is sometimes right, but here the sibling tools would still have weak descriptions. The same selection bug would reappear."}, {"letter": "D", "text": "Expand MCP tool descriptions to detail capabilities and outputs—e.g., \"Builds dependency graph showing direct imports, transitive dependencies, and cycles.\"", "correct": true, "explanation": "Correct. Tool selection is driven by the descriptions the model sees. A one-line description like 'Analyzes dependency graph' loses against Grep's rich description. Beef up the MCP tool's description. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m17", "source": "mock", "domain": 2, "scenario": null, "situation": "An engineer asks the agent to find all callers of a function before removing it. The function is defined in a core library but is also exposed through wrapper modules that rename the function for domain-specific use (e.g., calculateTax in the library becomes computeOrderTax in the orders module).", "question": "What exploration strategy will most reliably identify all callers?", "options": [{"letter": "A", "text": "Read the library and wrapper modules to identify all exposed names for the function, then Grep for each name across the codebase.", "correct": true, "explanation": "Correct. You have to enumerate every name the function is exposed under — otherwise renamed wrappers hide callers. Read the relevant modules, gather all aliases, then grep for each."}, {"letter": "B", "text": "Use Grep to find all files that import from the library or wrapper modules, then read each file to check whether it uses the function.", "correct": false, "explanation": "Misses dynamic imports, re-exports, and indirect call chains. Also scales poorly."}, {"letter": "C", "text": "Use Grep to search for the function's original name across the codebase.", "correct": false, "explanation": "The original name won't appear anywhere a wrapper has renamed it — you'd miss a significant class of callers."}, {"letter": "D", "text": "Search for the function name in project documentation to understand intended usage patterns and navigate to documented integration points.", "correct": false, "explanation": "Docs are incomplete and often stale. You can't safely remove a function based on documentation-level evidence. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m27", "source": "mock", "domain": 2, "scenario": null, "situation": "After adding an MCP server with specialized code refactoring tools (`extract_function`, `rename_variable`, `inline_function`), you notice the agent still uses basic text manipulation via Write and Bash sed commands for refactoring tasks. The MCP server is connected and healthy. Examining the configuration, you find each MCP tool has a minimal description like \"`extract_function`: extracts a function from code.\"", "question": "What's the most effective way to improve adoption of the MCP refactoring tools?", "options": [{"letter": "A", "text": "Implement a request classifier that detects refactoring intent and automatically routes those requests to the MCP server before the agent processes them.", "correct": false, "explanation": "A pre-classifier is a separate system to maintain and can misroute. The cheaper fix is to make the tool descriptions strong enough that the agent picks them on its own."}, {"letter": "B", "text": "Remove the Write tool from the agent's configuration for refactoring sessions so it must use the MCP tools for code modifications.", "correct": false, "explanation": "Stripping general tools forces adoption by subtraction, and breaks legitimate Write use cases."}, {"letter": "C", "text": "Accept this as expected behavior since simpler tools like sed are more predictable than specialized refactoring tools.", "correct": false, "explanation": "Capitulating defeats the purpose of integrating refactoring tools. The integration is fine — the descriptions are the problem."}, {"letter": "D", "text": "Enhance the MCP tool descriptions to explain when each tool is preferable to text manipulation and clarify expected inputs and outputs.", "correct": true, "explanation": "Correct. Tool selection is driven by the descriptions Claude sees. When the MCP tools say 'extracts a function from code' and Write/sed come with rich documentation, Claude picks Write/sed. Beef up the descriptions. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m29", "source": "mock", "domain": 2, "scenario": null, "situation": "Your agent needs to insert a new helper function into the middle of a 150-line utility module, between two existing functions. The Edit tool fails because its `old_string` parameter cannot find unique text to match — the file has repetitive docstrings, variable names, and structural patterns.", "question": "What's the most reliable way to complete this insertion?", "options": [{"letter": "A", "text": "Use Edit with an extremely long `old_string` capturing 30+ lines of context to guarantee uniqueness", "correct": false, "explanation": "Long, brittle match strings frequently miss due to whitespace or minor edits and produce confusing failures."}, {"letter": "B", "text": "Use Edit's `replace_all` parameter to target a common pattern and embed the new function in the replacement text", "correct": false, "explanation": "`replace_all` would mutate every occurrence of the pattern — corrupting the whole file."}, {"letter": "C", "text": "Use Bash to append the function definition to the end of the file using heredoc syntax", "correct": false, "explanation": "Appending puts the function at the wrong location. The requirement is to insert between two existing functions."}, {"letter": "D", "text": "Use Read to load the file, add the function at the appropriate location, then Write the updated file", "correct": true, "explanation": "Correct. When Edit's unique-match contract can't be satisfied in a repetitive file, fall back to Read → modify in memory at the intended line → Write the full file back. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m38", "source": "mock", "domain": 2, "scenario": null, "situation": "Production logs reveal inconsistent error handling: when `lookup_order` fails, the agent sometimes retries 5+ times (wasteful when the order ID doesn't exist), sometimes escalates immediately (premature for temporary network issues), and sometimes asks users for clarification (inappropriate when the issue is a backend permission error). Investigation shows your MCP tool returns uniform error responses: {\"isError\": true, \"content\": [{\"type\": \"text\", \"text\": \"Operation failed\"}]}. The agent cannot distinguish between error types.", "question": "What's the most effective improvement?", "options": [{"letter": "A", "text": "Enhance error responses with structured metadata: include errorCategory (transient/validation/permission), isRetryable boolean, and a description of what caused the failure.", "correct": true, "explanation": "Correct. Give the agent the information it needs to make the right decision: category, retryability, and a human-readable cause. That replaces guessing with deterministic policy."}, {"letter": "B", "text": "Create an `analyze_error` MCP tool the agent calls after any failure to determine the error category and recommended action.", "correct": false, "explanation": "Adds an extra round-trip for something the original tool already knows. Put the metadata in the original response."}, {"letter": "C", "text": "Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only after retries are exhausted.", "correct": false, "explanation": "Blanket retries hurt on permanent errors (order not found) and hide useful distinctions from the agent."}, {"letter": "D", "text": "Add few-shot examples to the system prompt demonstrating how to interpret error message patterns and select appropriate responses for each.", "correct": false, "explanation": "If the tool returns 'Operation failed' for every failure, no amount of few-shots can extract category info that isn't there. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m43", "source": "mock", "domain": 2, "scenario": null, "situation": "When implementing your `lookup_order` MCP tool, the backend sometimes returns errors (e.g., \"Order not found\" or temporary database failures).", "question": "What is the correct pattern for communicating these errors back to the agent?", "options": [{"letter": "A", "text": "Log the error server-side and return an empty result to avoid confusing the model", "correct": false, "explanation": "Returning empty successes makes the agent think no data exists, rather than that something went wrong — a different and worse confusion."}, {"letter": "B", "text": "Return the error message in the tool result content with the isError flag set to true", "correct": true, "explanation": "Correct. MCP's designed pattern: put the error text in the content field and mark isError=true. Claude sees both the failure flag and a readable message to reason about."}, {"letter": "C", "text": "Throw an exception from the tool handler so the agent framework can catch and log it", "correct": false, "explanation": "Uncaught exceptions break the tool protocol and don't give the model anything to reason with."}, {"letter": "D", "text": "Return a success response with a \"status\" field indicating the error type", "correct": false, "explanation": "Ad-hoc 'status' fields vary across tools and the model has no standard way to interpret them. isError is the standard. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m44", "source": "mock", "domain": 2, "scenario": null, "situation": "Your `process_refund` tool returns two types of errors: technical errors (\"503 Service Unavailable\", \"Connection timeout\") that are transient (5% of calls), and business errors (\"Order exceeds 30-day return window\", \"Item already refunded\") that are permanent (12% of calls). Monitoring shows the agent wastes 3-4 turns retrying business errors that can never succeed. Currently, both error types return only a plain text message to Claude.", "question": "What's the most effective way to reduce wasted retries while improving customer-facing response quality?", "options": [{"letter": "A", "text": "Return structured error responses with retryable: false for business errors and a customer-friendly explanation for Claude to use.", "correct": true, "explanation": "Correct. A retryable flag tells Claude deterministically 'don't retry,' and a ready-made customer-friendly message improves the outgoing reply. Fixes both problems at once."}, {"letter": "B", "text": "Add few-shot examples showing how to distinguish retryable from non-retryable errors by parsing error message text.", "correct": false, "explanation": "Relying on the model to text-parse error strings is fragile and exactly the instability you see today."}, {"letter": "C", "text": "Add a `check_refund_eligibility` tool that must be called before `process_refund` to prevent business rule violations.", "correct": false, "explanation": "Useful in principle but adds a round-trip to every refund to guard against 12% of cases, and doesn't help when `process_refund` still fails for other business reasons."}, {"letter": "D", "text": "Implement automatic retry logic at the tool level for technical errors only, passing business errors to Claude without retries.", "correct": false, "explanation": "Hiding transient retries inside the tool can mask latency and takes the model out of the loop on recovery decisions. Business errors also still arrive as a plain string, so the customer-facing response doesn't improve. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m55", "source": "mock", "domain": 2, "scenario": null, "situation": "Your pipeline uses a tool called `extract_metadata` with a JSON schema for paper details. You've also defined `lookup_citations` and `verify_doi` tools for enrichment. During testing, you notice that when users include requests like \"extract the metadata and tell me how cited it is,\" Claude sometimes calls `lookup_citations` first, which fails because it needs the DOI that `extract_metadata` would provide.", "question": "What's the most effective way to ensure structured metadata extraction happens first?", "options": [{"letter": "A", "text": "Set `tool_choice` to \"any\" so Claude must use a tool, combined with system prompt instructions prioritizing `extract_metadata`.", "correct": false, "explanation": "'any' forces a tool call but doesn't force the right one. You'd still see `lookup_citations` picked first."}, {"letter": "B", "text": "Set `tool_choice` to \"auto\" and reorder the tool definitions so `extract_metadata` appears first in the tools array, since Claude prioritizes earlier-listed tools.", "correct": false, "explanation": "There's no documented ordering preference to rely on; this assumes behavior that isn't contractual."}, {"letter": "C", "text": "Set `tool_choice` to {\"type\": \"tool\", \"name\": \"`extract_metadata`\"} and process the enrichment requests in subsequent turns after receiving the extracted metadata.", "correct": true, "explanation": "Correct. `tool_choice`=specific-tool deterministically forces `extract_metadata` on the first turn. Then you hand control back to 'auto' to let the model use citations/DOI enrichment with the metadata in context."}, {"letter": "D", "text": "Set `tool_choice` to {\"type\": \"tool\", \"name\": \"`extract_metadata`\"} for every API call in the pipeline, ensuring Claude always extracts metadata before any enrichment can occur.", "correct": false, "explanation": "Pinning `extract_metadata` on every call prevents the enrichment tools from ever being used. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "g16", "source": "guide", "domain": 3, "scenario": "Claude Code for Continuous Integration", "situation": "Your CI pipeline runs the Claude Code CLI (in `--print` mode) using CLAUDE.md to provide project context for code review, and developers generally find the reviews substantive. However, they report that integrating findings into the workflow is difficult—Claude outputs narrative paragraphs that must be manually copied into PR comments. The team wants to automatically post each finding as a separate inline PR comment at the relevant place in code, which requires structured data with file path, line number, severity level, and suggested fix. Which approach is most effective?", "question": "Which approach is most effective?", "options": [{"letter": "A", "text": "Add an “Output Format for Review” section to CLAUDE.md with examples of structured findings so Claude learns the expected format from project context.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Use the CLI flags `--output-format json` and `--json-schema` to enforce structured findings, then parse the output to post inline comments via the GitHub API.", "correct": true, "explanation": "Using `--output-format json` with `--json-schema` enforces structured output at the CLI level, guaranteeing well-formed JSON with the required fields (file path, line number, severity, suggested fix) that can be reliably parsed and posted as inline PR comments via the GitHub API. It leverages built-in CLI capabilities designed specifically for structured output."}, {"letter": "C", "text": "Include explicit formatting instructions in the review prompt requiring each finding to follow a parseable template like `[FILE:path] [LINE:n] [SEVERITY:level] ...`.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Keep narrative review format but add a summarization step that uses Claude to generate a structured JSON summary of findings.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g26", "source": "guide", "domain": 3, "scenario": "Claude Code for Continuous Integration", "situation": "Your pipeline script runs `claude \"Analyze this pull request for security issues\"`, but the job hangs indefinitely. Logs show Claude Code is waiting for interactive input. What is the correct approach to run Claude Code in an automated pipeline?", "question": "What is the correct approach?", "options": [{"letter": "A", "text": "Add a `--batch` flag: `claude --batch \"Analyze this pull request for security issues\"`.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Add the `-p` flag: `claude -p \"Analyze this pull request for security issues\"`.", "correct": true, "explanation": "The `-p` (or `--print`) flag is the documented way to run Claude Code non-interactively. It processes the prompt, prints the result to stdout, and exits without waiting for user input—ideal for CI/CD pipelines."}, {"letter": "C", "text": "Redirect stdin from `/dev/null`: `claude \"Analyze this pull request for security issues\" \u003c /dev/null`.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Set the environment variable `CLAUDE_HEADLESS=true` before running the command.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g32", "source": "guide", "domain": 3, "scenario": "Code Generation with Claude Code", "situation": "You need to add Slack as a new notification channel. The existing codebase has clear, established patterns for email, SMS, and push channels. However, Slack’s API offers fundamentally different integration approaches—incoming webhooks (simple, one-way), bot tokens (support delivery confirmation and programmatic control), or Slack Apps (two-way events, requires workspace approval). Your task says “add Slack support” without specifying integration method or requiring advanced features like delivery tracking.", "question": "How should you approach this task?", "options": [{"letter": "A", "text": "Start in direct execution mode using incoming webhooks to match the existing one-way notification pattern.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Switch to planning mode to explore integration options and architectural implications, then present a recommendation before implementation.", "correct": true, "explanation": "Slack integration has multiple valid approaches with significantly different architectural implications, and requirements are ambiguous. Planning mode lets you evaluate trade-offs among webhooks, bot tokens, and Slack Apps and align on an approach before implementation."}, {"letter": "C", "text": "Start in direct execution mode by scaffolding a Slack channel class using existing patterns, deferring the integration method decision.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Start in direct execution mode using a bot-token approach to ensure delivery confirmation is possible.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g33", "source": "guide", "domain": 3, "scenario": "Code Generation with Claude Code", "situation": "Your CLAUDE.md file has grown to 400+ lines containing coding standards, testing conventions, a detailed PR review checklist, deployment instructions, and database migration procedures. You want Claude to always follow coding standards and testing conventions, but apply PR review, deploy, and migration guidance only when doing those tasks.", "question": "Which restructuring approach is most effective?", "options": [{"letter": "A", "text": "Move all guidance into separate Skills files organized by workflow type, leaving only a brief project description in CLAUDE.md.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Keep everything in CLAUDE.md but use `@import` syntax to organize into separately maintained files by category.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Split CLAUDE.md into files under `.claude/rules/` with path-bound glob patterns so each rule loads only for the relevant file types.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Keep universal standards in CLAUDE.md and create Skills for workflow-specific guidance (PR review, deploy, migrations) with trigger keywords.", "correct": true, "explanation": "CLAUDE.md content loads in every session, ensuring coding standards and testing conventions always apply, while Skills are invoked on demand when Claude detects trigger keywords—ideal for workflow-specific guidance like PR review, deployment, and migrations."}], "correct": "D"}, {"id": "g34", "source": "guide", "domain": 3, "scenario": "Code Generation with Claude Code", "situation": "You’re tasked with restructuring your team’s monolithic application into microservices. This impacts changes across dozens of files and requires decisions about service boundaries and module dependencies.", "question": "Which approach should you choose?", "options": [{"letter": "A", "text": "Switch to planning mode to explore the codebase, understand dependencies, and design the implementation approach before making changes.", "correct": true, "explanation": "Planning mode is the right strategy for complex architectural restructuring like splitting a monolith: it allows safe exploration and informed decisions about boundaries before committing to potentially expensive changes across many files."}, {"letter": "B", "text": "Start in direct execution mode and switch to planning only after encountering unexpected complexity during implementation.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Start in direct execution mode and make incremental changes, letting implementation reveal natural service boundaries.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Use direct execution with detailed upfront instructions that specify each service structure.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g35", "source": "guide", "domain": 3, "scenario": "Code Generation with Claude Code", "situation": "Your team created a `/analyze-codebase` skill that performs deep code analysis—dependency scanning, test coverage counts, and code quality metrics. After running the command, team members report Claude becomes less responsive in the session and loses the context of the original task.", "question": "How do you most effectively fix this while keeping full analysis capabilities?", "options": [{"letter": "A", "text": "Add `context: fork` in the skill frontmatter to run the analysis in an isolated subagent context.", "correct": true, "explanation": "`context: fork` runs the analysis in an isolated subagent context so the large output does not pollute the main session’s context window and Claude does not lose track of the original task. It preserves full analysis capability while keeping the main session responsive."}, {"letter": "B", "text": "Add `model: haiku` in frontmatter to use a faster, cheaper model for analysis.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Split the skill into three smaller skills, each producing less output.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Add instructions to the skill to compress all results into a short summary before displaying them.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g36", "source": "guide", "domain": 3, "scenario": "Code Generation with Claude Code", "situation": "Your team uses a `/commit` skill in `.claude/skills/commit/SKILL.md`. A developer wants to customize it for their personal workflow (different commit message format, extra checks) without affecting teammates.", "question": "What do you recommend?", "options": [{"letter": "A", "text": "Create a personal version under `~/.claude/skills/` with a different name, e.g., `/my-commit`.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Add conditional logic based on username in the project skill frontmatter.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Create a personal version at `~/.claude/skills/commit/SKILL.md` with the same name.", "correct": true, "explanation": "Personal skills take precedence over project skills with the same name. A personal skill at `~/.claude/skills/commit/SKILL.md` will override the team’s project skill, allowing the developer to customize their workflow while maintaining the familiar `/commit` command name for their personal use. This approach is better than option A because it preserves the original command name, improving the developer’s workflow without affecting teammates."}, {"letter": "D", "text": "Set `override: true` in the personal skill frontmatter to prioritize it over the project version.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g37", "source": "guide", "domain": 3, "scenario": "Code Generation with Claude Code", "situation": "Your team has used Claude Code for months. Recently, three developers report Claude follows the guidance “always include comprehensive error handling,” but a fourth developer who just joined says Claude does not follow it. All four work in the same repo and have up-to-date code.", "question": "What is the most likely cause and fix?", "options": [{"letter": "A", "text": "The guidance lives in the original developers’ user-level `~/.claude/CLAUDE.md` files, not in the project `.claude/CLAUDE.md`. Move the instruction to the project-level file so all team members receive it.", "correct": true, "explanation": "If the guidance was added only to the original developers’ user-level configs and not to the project-level `.claude/CLAUDE.md`, new team members won’t receive it. Moving it to the project-level configuration ensures all current and future team members automatically get the guidance."}, {"letter": "B", "text": "The new developer’s `~/.claude/CLAUDE.md` contains conflicting instructions overriding project settings; they should delete the conflicting section.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Claude Code learns per-user preferences over time; the new developer must repeat the requirement until Claude “remembers” it.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Claude Code caches CLAUDE.md after first read; original developers use cached versions. Everyone should clear the Claude Code cache.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g38", "source": "guide", "domain": 3, "scenario": "Code Generation with Claude Code", "situation": "You find that including 2–3 full endpoint implementation examples as context significantly improves consistency when generating new API endpoints. However, this context is useful only when creating new endpoints—not when debugging, reviewing code, or other work in the API directory.", "question": "Which configuration approach is most effective?", "options": [{"letter": "A", "text": "Add endpoint examples and pattern documentation to the project CLAUDE.md so they are always available.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Manually reference endpoint examples in every generation request by copying code into the prompt.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Configure path-specific rules in `.claude/rules/api/` that include endpoint examples and activate when working in the API directory.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Create a skill that references the endpoint examples and contains pattern-following instructions, invoked on demand via a slash command.", "correct": true, "explanation": "A skill invoked on demand loads the example context only when generating new endpoints, not during unrelated tasks like debugging or review. This keeps the main context clean while preserving high-quality generation when needed."}], "correct": "D"}, {"id": "g39", "source": "guide", "domain": 3, "scenario": "Code Generation with Claude Code", "situation": "Your team created a `/migration` skill that generates database migration files. It takes the migration name via `$ARGUMENTS`. In production you observe three issues: (1) developers often run the skill without arguments, causing poorly named files, (2) the skill sometimes uses database schema details from unrelated prior conversations, and (3) a developer accidentally ran destructive test cleanup when the skill had broad tool access.", "question": "Which configuration approach fixes all three problems?", "options": [{"letter": "A", "text": "Use positional parameters `$1` and `$2` instead of `$ARGUMENTS` to enforce specific inputs, include explicit schema file references via `@` syntax for context control, and add a frontmatter description warning about destructive operations.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Add `argument-hint` in frontmatter to request required parameters, use `context: fork` to isolate execution, and restrict `allowed-tools` to file-write operations.", "correct": true, "explanation": "This uses three separate configuration features to address each problem: `argument-hint` improves argument entry and reduces missing arguments, `context: fork` prevents context leakage from prior conversations, and `allowed-tools` constrains the skill to safe file-writing operations, preventing destructive actions."}, {"letter": "C", "text": "Split into `/migration-create` and `/migration-apply` skills, add validation instructions to request migration name if missing, and use different `allowed-tools` scopes for each.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Add validation instructions in the skill SKILL.md to ensure `$ARGUMENTS` is a valid name, add prompts to ignore prior conversation context, and list prohibited operations to avoid.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g40", "source": "guide", "domain": 3, "scenario": "Code Generation with Claude Code", "situation": "Your codebase contains areas with different coding conventions: React components use functional style with hooks, API handlers use async/await with specific error handling, and database models follow the repository pattern. Test files are distributed across the codebase next to the code under test (e.g., `Button.test.tsx` next to `Button.tsx`), and you want all tests to follow the same conventions regardless of location.", "question": "What is the most supported way to ensure Claude automatically applies the correct conventions when generating code?", "options": [{"letter": "A", "text": "Put all conventions in the root CLAUDE.md under headings for each area and rely on Claude to infer which section applies.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Create skills in `.claude/skills/` for each code type, embedding conventions in each SKILL.md.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Place a separate CLAUDE.md file in each subdirectory containing conventions for that area.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Create rule files under `.claude/rules/` with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths.", "correct": true, "explanation": "`.claude/rules/` files with YAML frontmatter and glob patterns (e.g., `**/*.test.tsx`, `src/api/**/*.ts`) enable deterministic, path-based convention application regardless of directory structure. This is the most supported approach for cross-cutting patterns like distributed test files."}], "correct": "D"}, {"id": "g41", "source": "guide", "domain": 3, "scenario": "Code Generation with Claude Code", "situation": "You want to create a custom slash command `/review` that runs your team’s standard code review checklist. It should be available to every developer when they clone or update the repository.", "question": "Where should you create the command file?", "options": [{"letter": "A", "text": "In `~/.claude/commands/` in each developer’s home directory.", "correct": false, "explanation": ""}, {"letter": "B", "text": "In the project repository under `.claude/commands/`.", "correct": true, "explanation": "Putting custom slash commands under `.claude/commands/` inside the project repository ensures they are version-controlled and automatically available to every developer who clones or updates the repo. This is the intended location for project-level custom commands in Claude Code."}, {"letter": "C", "text": "In `.claude/config.json` as an array of commands.", "correct": false, "explanation": ""}, {"letter": "D", "text": "In the root project CLAUDE.md.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g42", "source": "guide", "domain": 3, "scenario": "Code Generation with Claude Code", "situation": "Your team’s CLAUDE.md grew beyond 500 lines mixing TypeScript conventions, testing guidance, API patterns, and deployment procedures. Developers find it hard to locate and update the right sections.", "question": "What approach does Claude Code support to organize project-level instructions into focused topical modules?", "options": [{"letter": "A", "text": "Define a `.claude/config.yaml` mapping file patterns to specific sections inside CLAUDE.md.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Create separate Markdown files in `.claude/rules/`, each covering one topic (e.g., `testing.md`, `api-conventions.md`).", "correct": true, "explanation": "Claude Code supports a `.claude/rules/` directory where you can create separate Markdown files for topical guidance (e.g., `testing.md`, `api-conventions.md`), allowing teams to organize large instruction sets into focused, maintainable modules."}, {"letter": "C", "text": "Split instructions into README.md files in relevant subdirectories that Claude automatically loads as instructions.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Create multiple files named CLAUDE.md at different levels of the directory tree, each overriding parent instructions.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g43", "source": "guide", "domain": 3, "scenario": "Code Generation with Claude Code", "situation": "You create a custom skill `/explore-alternatives` that your team uses to brainstorm and evaluate implementation approaches before choosing one. Developers report that after running the skill, subsequent Claude responses are influenced by the alternatives discussion—sometimes referencing rejected approaches or retaining exploration context that interferes with actual implementation.", "question": "How should you most effectively configure this skill?", "options": [{"letter": "A", "text": "Use the `!` prefix in the skill to run exploration logic as a bash subprocess.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Add `context: fork` in the skill frontmatter.", "correct": true, "explanation": "`context: fork` runs the skill in an isolated subagent context so exploration discussions do not pollute the main conversation history. This prevents rejected approaches and brainstorming context from influencing subsequent implementation work."}, {"letter": "C", "text": "Split into two skills—`/explore-start` and `/explore-end`—to mark boundaries when exploration context should be discarded.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Create the skill in `~/.claude/skills/` instead of `.claude/skills/`.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g44", "source": "guide", "domain": 3, "scenario": "Code Generation with Claude Code", "situation": "Your team wants to add a GitHub MCP server for searching PRs and checking CI status via Claude Code. Each of six developers has their own personal GitHub access token. You want consistent tooling across the team without committing credentials to version control.", "question": "Which configuration approach is most effective?", "options": [{"letter": "A", "text": "Have each developer add the server in user scope via `claude mcp add --scope user`.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Create an MCP server wrapper that reads tokens from a `.env` file and proxies GitHub API calls, then add the wrapper to the project `.mcp.json`.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Add the server to the project `.mcp.json` using environment variable substitution (`${GITHUB_TOKEN}`) for auth and document the required environment variable in the project README.", "correct": true, "explanation": "A project `.mcp.json` with environment variable substitution is idiomatic: it provides a single version-controlled source of truth for MCP configuration while letting each developer supply credentials via environment variables. Documenting the variable makes onboarding easy without committing secrets."}, {"letter": "D", "text": "Configure the server in project scope with a placeholder token, then tell developers to override it in their local config.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "m19", "source": "mock", "domain": 3, "scenario": null, "situation": "An engineer used `Claude Code` yesterday to investigate authentication flows in a legacy monolith, building up significant context over a 2-hour session. Today she wants to continue that specific investigation. She's worked on three other codebases since then and knows the session was named \"auth-deep-dive\".", "question": "How should she resume?", "options": [{"letter": "A", "text": "Start fresh and re-read the same files", "correct": false, "explanation": "Wastes the two hours of accumulated context from yesterday."}, {"letter": "B", "text": "Use `--session-id` with the UUID from yesterday's session transcript file", "correct": false, "explanation": "Possible but cumbersome — she'd have to hunt for the UUID when she already has the session name."}, {"letter": "C", "text": "Use `--continue` to pick up where the most recent conversation left off", "correct": false, "explanation": "`--continue` resumes the most recent session in this repo. She's worked on three other codebases since then, so the most recent is not auth-deep-dive."}, {"letter": "D", "text": "Use `--resume` auth-deep-dive to load that specific session by name", "correct": true, "explanation": "Correct. `--resume` with the session name is designed for exactly this: pick a specific prior session out of many, by the name you gave it. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "g17", "source": "guide", "domain": 4, "scenario": "Claude Code for Continuous Integration", "situation": "Your team uses Claude Code for generating code suggestions, but you notice a pattern: non-obvious issues—performance optimizations that break edge cases, cleanups that unexpectedly change behavior—are only caught when another team member reviews the PR. Claude’s reasoning during generation shows it considered these cases but concluded its approach was correct. Which approach directly addresses the root cause of this self-check limitation?", "question": "Which approach directly addresses the root cause?", "options": [{"letter": "A", "text": "Run a second independent instance of Claude Code to review the changes without access to the generator’s reasoning.", "correct": true, "explanation": "A second independent Claude Code instance without access to the generator’s reasoning directly addresses the root cause by avoiding confirmation bias. This “fresh eyes” perspective mirrors human peer review, where another reviewer catches issues the author rationalized."}, {"letter": "B", "text": "Enable extended thinking mode for the generation stage to allow more thorough deliberation before producing suggestions.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Add explicit self-review instructions to the generation prompt asking Claude to critique its own suggestions before finalizing output.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Include full test files and documentation in prompt context so Claude better understands expected behavior during generation.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g19", "source": "guide", "domain": 4, "scenario": "Claude Code for Continuous Integration", "situation": "Your CI/CD system runs three Claude-based analyses: (1) fast style checks on every PR that block merging until completion, (2) comprehensive weekly security audits of the entire codebase, and (3) nightly test-case generation for recently changed modules. The Message Batches API offers 50% savings but processing can take up to 24 hours. You want to optimize API cost while maintaining an acceptable developer experience. Which combination correctly matches each task to an API approach?", "question": "Which combination is correct?", "options": [{"letter": "A", "text": "Use the Message Batches API for all three tasks to maximize 50% savings, configuring the pipeline to poll for batch completion.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Use synchronous calls for PR style checks; use the Message Batches API for weekly security audits and nightly test generation.", "correct": true, "explanation": "PR style checks block developers and require immediate responses via synchronous calls, while weekly security audits and nightly test generation are scheduled tasks with flexible deadlines that can tolerate up to a 24-hour batch window—capturing 50% savings for both."}, {"letter": "C", "text": "Use synchronous calls for all three tasks for consistent response times, relying on prompt caching to reduce costs across workloads.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Use synchronous calls for PR style checks and nightly test generation; use the Message Batches API only for weekly security audits.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g20", "source": "guide", "domain": 4, "scenario": "Claude Code for Continuous Integration", "situation": "Your automated reviews find real issues, but developers report the feedback is not actionable. Findings include phrases like “complex ticket routing logic” or “potential null pointer” without specifying what exactly to change. When you add detailed instructions like “always include concrete fix suggestions,” the model still produces inconsistent output—sometimes detailed, sometimes vague. Which prompting technique most reliably produces consistently actionable feedback?", "question": "Which prompting technique is most reliable?", "options": [{"letter": "A", "text": "Further refine instructions with more explicit requirements for each part of the feedback format (location, issue, severity, proposed fix).", "correct": false, "explanation": ""}, {"letter": "B", "text": "Expand the context window to include more surrounding codebase so the model has enough information to propose concrete fixes.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Implement a two-pass approach where one prompt identifies issues and a second generates fixes, allowing specialization.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Add 3–4 few-shot examples showing the exact required format: identified issue, location in code, concrete fix suggestion.", "correct": true, "explanation": "Few-shot examples are the most effective technique for achieving consistent output format when instructions alone produce variable results. Providing 3–4 examples that show the exact desired structure (issue, location, concrete fix) gives the model a concrete pattern to follow, which is more reliable than abstract instructions."}], "correct": "D"}, {"id": "g21", "source": "guide", "domain": 4, "scenario": "Claude Code for Continuous Integration", "situation": "Your CI pipeline includes two Claude-based code review modes: a pre-merge-commit hook that blocks PR merge until completion, and a “deep analysis” that runs overnight, polls for batch completion, and posts detailed suggestions to the PR. You want to reduce API cost using the Message Batches API, which offers 50% savings but requires polling and can take up to 24 hours. Which mode should use batch p
