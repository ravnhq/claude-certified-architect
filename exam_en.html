rocessing?", "question": "Which mode should use batch processing?", "options": [{"letter": "A", "text": "Only the pre-merge-commit hook.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Only the deep analysis.", "correct": true, "explanation": "Deep analysis is an ideal candidate for batch processing because it already runs overnight, tolerates delay, and uses a polling model before publishing results—matching the asynchronous, polling-based architecture of the Message Batches API while capturing 50% savings."}, {"letter": "C", "text": "Both modes.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Neither mode.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g22", "source": "guide", "domain": 4, "scenario": "Claude Code for Continuous Integration", "situation": "Your automated review analyzes comments and docstrings. The current prompt instructs Claude to “check that comments are accurate and up to date.” Findings often flag acceptable patterns (TODO markers, simple descriptions) while missing comments describing behavior the code no longer implements. What change addresses the root cause of this inconsistent analysis?", "question": "What change addresses the root cause?", "options": [{"letter": "A", "text": "Include `git blame` data so Claude can identify comments that predate recent code changes.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Add few-shot examples of misleading comments to help the model recognize similar patterns in the codebase.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Filter TODO, FIXME, and descriptive comment patterns before analysis to reduce noise.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Specify explicit criteria: flag comments only when the behavior they claim contradicts the code’s actual behavior.", "correct": true, "explanation": "Explicit criteria—flagging comments only when claimed behavior contradicts actual code behavior—directly addresses the root cause by replacing a vague instruction with a precise definition of what constitutes a problem. This reduces false positives on acceptable patterns and misses of truly misleading comments."}], "correct": "D"}, {"id": "g23", "source": "guide", "domain": 4, "scenario": "Claude Code for Continuous Integration", "situation": "Your automated code review system shows inconsistent severity ratings—similar issues like null pointer risks are rated “critical” in some PRs but only “medium” in others. Developer surveys show growing distrust—many start dismissing findings without reading because “half are wrong.” High-false-positive categories erode trust in accurate categories. Which approach best restores developer trust while improving the system?", "question": "Which approach best restores developer trust?", "options": [{"letter": "A", "text": "Temporarily disable high-false-positive categories (style, naming, documentation) and keep only high-precision categories while improving prompts.", "correct": true, "explanation": "Temporarily disabling high-false-positive categories immediately stops trust erosion by removing noisy findings that cause developers to dismiss everything, while preserving value from high-precision categories like security and correctness. It also creates space to improve prompts for problematic categories before re-enabling them."}, {"letter": "B", "text": "Keep all categories enabled but display confidence scores with each finding so developers can decide what to investigate.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Keep all categories enabled and add few-shot examples to improve accuracy for each category over the next few weeks.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Apply a uniform strictness reduction across all categories to bring the overall false-positive rate down.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g24", "source": "guide", "domain": 4, "scenario": "Claude Code for Continuous Integration", "situation": "Your automated review generates test-case suggestions for each PR. Reviewing a PR that adds course completion tracking, Claude suggests 10 test cases, but developer feedback shows that 6 duplicate scenarios already covered by the existing test suite. What change most effectively reduces duplicate suggestions?", "question": "What change is most effective?", "options": [{"letter": "A", "text": "Include the existing test file in context so Claude can determine what scenarios are already covered.", "correct": true, "explanation": "Including the existing test file fixes the root cause of duplication: Claude can only avoid suggesting already-covered scenarios if it knows what tests already exist. This gives Claude the information needed to propose genuinely new, valuable tests."}, {"letter": "B", "text": "Reduce the requested number of suggestions from 10 to 5, assuming Claude prioritizes the most valuable cases first.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Add instructions directing Claude to focus exclusively on edge cases and error conditions rather than success paths.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Implement post-processing that filters suggestions whose descriptions match existing test names via keyword overlap.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g25", "source": "guide", "domain": 4, "scenario": "Claude Code for Continuous Integration", "situation": "After an initial automated review identifies 12 findings, a developer pushes new commits to address issues. Re-running review produces 8 findings, but developers report that 5 duplicate previous comments on code that was already fixed in the new commits. What is the most effective way to eliminate this redundant feedback while maintaining thoroughness?", "question": "What is the most effective way to eliminate redundant feedback?", "options": [{"letter": "A", "text": "Run review only when the PR is created and in the final pre-merge state, skipping intermediate commits.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Add a post-processing filter that removes findings that match previous ones by file paths and issue descriptions before posting comments.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Restrict review scope to files changed in the most recent push, excluding files from earlier commits.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Include previous review findings in context and instruct Claude to report only new or still-unresolved issues.", "correct": true, "explanation": "Including prior review findings in context lets Claude distinguish new problems from those already addressed in recent commits. This preserves review thoroughness while using Claude’s reasoning to avoid redundant feedback on fixed code."}], "correct": "D"}, {"id": "g27", "source": "guide", "domain": 4, "scenario": "Claude Code for Continuous Integration", "situation": "A pull request changes 14 files in an inventory tracking module. A single-pass review that analyzes all files together produces inconsistent results: detailed feedback on some files but shallow comments on others, missed obvious bugs, and contradictory feedback (a pattern is flagged in one file but identical code is approved in another file in the same PR). How should you restructure the review?", "question": "How should you restructure the review?", "options": [{"letter": "A", "text": "Run three independent full-PR review passes and flag only issues that appear in at least two of the three runs.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Split into focused passes: review each file individually for local issues, then run a separate integration-oriented pass to examine cross-file data flows.", "correct": true, "explanation": "Focused per-file passes address the root cause—attention dilution—by ensuring consistent depth and reliable local issue detection. A separate integration-oriented pass then covers cross-file concerns such as dependency and data-flow interactions."}, {"letter": "C", "text": "Require developers to split large PRs into smaller submissions of 3–4 files before running automated review.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Switch to a larger model with a bigger context window so it can pay sufficient attention to all 14 files in one pass.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g28", "source": "guide", "domain": 4, "scenario": "Claude Code for Continuous Integration", "situation": "Your automated code review averages 15 findings per pull request, and developers report a 40% false-positive rate. The bottleneck is investigation time: developers must click into each finding to read Claude’s rationale before deciding whether to fix or dismiss it. Your CLAUDE.md already contains comprehensive rules for acceptable patterns, and stakeholders rejected any approach that filters findings before developers see them. What change best addresses investigation time?", "question": "What change best addresses investigation time?", "options": [{"letter": "A", "text": "Require Claude to include its rationale and confidence estimate directly in each finding.", "correct": true, "explanation": "Including rationale and confidence directly in each finding reduces investigation time by letting developers quickly triage without opening each finding. It satisfies the “no filtering” constraint because all findings remain visible while accelerating developer decision-making."}, {"letter": "B", "text": "Add a post-processor that analyzes finding patterns and automatically suppresses those that match historical false-positive signatures.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Categorize findings as “blocking issues” vs “suggestions,” with different review requirements by level.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Configure Claude to show only high-confidence findings, filtering uncertain flags before developers see them.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g29", "source": "guide", "domain": 4, "scenario": "Claude Code for Continuous Integration", "situation": "Analysis of your automated code review shows large differences in false-positive rates by finding category: security/correctness findings have 8% false positives, performance findings 18%, style/naming findings 52%, and documentation findings 48%. Developer surveys show growing distrust—many start dismissing findings without reading because “half are wrong.” High-false-positive categories erode trust in accurate categories. Which approach best restores developer trust while improving the system?", "question": "Which approach best restores developer trust?", "options": [{"letter": "A", "text": "Temporarily disable high-false-positive categories (style, naming, documentation) and keep only high-precision categories while improving prompts.", "correct": true, "explanation": "Temporarily disabling high-false-positive categories immediately stops trust erosion by removing noisy findings that cause developers to dismiss everything, while preserving value from high-precision categories like security and correctness. It also creates space to improve prompts for problematic categories before re-enabling them."}, {"letter": "B", "text": "Keep all categories enabled but display confidence scores with each finding so developers can decide what to investigate.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Keep all categories enabled and add few-shot examples to improve accuracy for each category over the next few weeks.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Apply a uniform strictness reduction across all categories to bring the overall false-positive rate down.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g30", "source": "guide", "domain": 4, "scenario": "Claude Code for Continuous Integration", "situation": "Your team wants to reduce API costs for automated analysis. Currently, synchronous Claude calls support two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes moving both to the Message Batches API to save 50%. How should you evaluate this proposal?", "question": "How should you evaluate this proposal?", "options": [{"letter": "A", "text": "Move both to batch processing with fallback to synchronous calls if batches take too long.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Move both workflows to batch processing with status polling to verify completion.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Use batch processing only for technical debt reports; keep synchronous calls for pre-merge checks.", "correct": true, "explanation": "Message Batches API processing can take up to 24 hours with no latency SLA, which is acceptable for overnight technical debt reports but unacceptable for blocking pre-merge checks where developers wait. This matches each workflow to the right API based on latency requirements."}, {"letter": "D", "text": "Keep synchronous calls for both workflows to avoid issues with batch result ordering.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g31", "source": "guide", "domain": 4, "scenario": "Code Generation with Claude Code", "situation": "You asked Claude Code to implement a function that transforms API responses into an internal normalized format. After two iterations, the output structure still doesn’t match expectations—some fields are nested differently and timestamps are formatted incorrectly. You described requirements in prose, but Claude interprets them differently each time.", "question": "Which approach is most effective for the next iteration?", "options": [{"letter": "A", "text": "Write a JSON schema describing the expected output structure and validate Claude’s output against it after each iteration.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Provide 2–3 concrete input-output examples showing the expected transformation for representative API responses.", "correct": true, "explanation": "Concrete input-output examples remove ambiguity inherent in prose descriptions by showing Claude the exact expected transformation results. This directly addresses the root cause—misinterpretation of textual requirements—by providing unambiguous patterns for field nesting and timestamp formatting."}, {"letter": "C", "text": "Rewrite requirements with more technical precision, specifying exact field mappings, nesting rules, and timestamp format strings.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Ask Claude to explain its current understanding of the requirements to identify where interpretations diverge.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g49", "source": "guide", "domain": 4, "scenario": "Customer Support Agent", "situation": "Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates simple cases (standard replacements for damaged goods with photo proof) while trying to handle complex situations requiring policy exceptions autonomously. What is the most effective way to improve escalation calibration?", "question": "What is the most effective way to improve escalation calibration?", "options": [{"letter": "A", "text": "Require the agent to self-rate confidence on a 1–10 scale before each response and automatically route to humans when confidence drops below a threshold.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Deploy a separate classifier model trained on historical tickets to predict which requests need escalation before the main agent starts processing.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Add explicit escalation criteria to the system prompt with few-shot examples showing when to escalate versus resolve autonomously.", "correct": true, "explanation": "Explicit escalation criteria with few-shot examples directly address the root cause—unclear decision boundaries between simple and complex cases. It’s the most proportional, effective first intervention that teaches the agent when to escalate and when to resolve autonomously without extra infrastructure."}, {"letter": "D", "text": "Implement sentiment analysis to determine customer frustration level and automatically escalate past a negative sentiment threshold.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g52", "source": "guide", "domain": 4, "scenario": "Customer Support Agent", "situation": "Production metrics show that when resolving complex billing disputes or multi-order returns, customer satisfaction scores are 15% lower than for simple cases—even when the resolution is technically correct. Root-cause analysis shows the agent provides accurate solutions but inconsistently explains rationale: sometimes omitting relevant policy details, sometimes missing timeline info or next steps. The specific context gaps vary case by case. You want to improve solution quality without adding human oversight. What approach is most effective?", "question": "What approach is most effective?", "options": [{"letter": "A", "text": "Add a self-critique stage where the agent evaluates a draft response for completeness—ensuring it resolves the customer’s issue, includes relevant context, and anticipates follow-up questions.", "correct": true, "explanation": "A self-critique stage (the evaluator-optimizer pattern) directly addresses inconsistent explanation completeness by forcing the agent to assess its own draft against concrete criteria—such as policy context, timelines, and next steps—before presenting it. This catches case-specific gaps without human oversight."}, {"letter": "B", "text": "Add a confirmation stage where the agent asks “Does this fully resolve your issue?” before closing, allowing customers to request additional information if needed.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Upgrade the model from Haiku to Sonnet for complex cases, routing based on a defined complexity metric.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Implement few-shot examples in the system prompt showing complete explanations for five common complex case types, demonstrating how to include policy context, timelines, and next steps.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g56", "source": "guide", "domain": 4, "scenario": "Customer Support Agent", "situation": "Production logs show a consistent pattern: when customers include the word “account” in their message (e.g., “I want to check my account for an order I made yesterday”), the agent calls `get_customer` first 78% of the time. When customers phrase similar requests without “account” (e.g., “I want to check an order I made yesterday”), it calls `lookup_order` first 93% of the time. Tool descriptions are clear and unambiguous. What is the most likely root cause of this discrepancy?", "question": "What is the most likely root cause?", "options": [{"letter": "A", "text": "The system prompt contains keyword-sensitive instructions that steer behavior based on terms like “account,” creating unintended tool-selection patterns.", "correct": true, "explanation": "The systematic keyword-driven pattern (78% vs 93%) strongly indicates explicit routing logic in the system prompt reacting to the word “account” and steering the agent toward customer-related tools. Since tool descriptions are already clear, the discrepancy points to prompt-level instructions creating unintended behavioral steering."}, {"letter": "B", "text": "The model’s base training creates associations between “account” terminology and customer-related operations that override tool descriptions.", "correct": false, "explanation": ""}, {"letter": "C", "text": "The model needs more training data on multi-concept messages and should be fine-tuned on examples containing both account and order terminology.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Tool descriptions need additional negative examples specifying when NOT to use each tool to prevent this keyword-induced confusion.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g60", "source": "guide", "domain": 4, "scenario": "Customer Support Agent", "situation": "Production logs show the agent sometimes chooses `get_customer` when `lookup_order` would be more appropriate, especially for ambiguous queries like “I need help with my recent purchase.” You decide to add few-shot examples to the system prompt to improve tool selection. Which approach most effectively addresses the problem?", "question": "Which approach is most effective?", "options": [{"letter": "A", "text": "Add explicit “use when” and “don’t use when” guidance in each tool description covering ambiguous cases.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Add examples grouped by tool—all `get_customer` scenarios together, then all `lookup_order` scenarios.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Add 4–6 examples targeted at ambiguous scenarios, each with rationale for why one tool was chosen over plausible alternatives.", "correct": true, "explanation": "Targeting few-shot examples at the specific ambiguous scenarios where errors occur, with explicit rationale for why one tool is preferable to alternatives, teaches the model the comparative decision process needed for edge cases. This is more effective than generic examples or declarative rules."}, {"letter": "D", "text": "Add 10–15 examples of clear, unambiguous requests demonstrating correct tool choice for typical scenarios for each tool.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g69", "source": "guide", "domain": 4, "scenario": "Conversational AI Architecture Patterns", "situation": "During QA testing, Claude follows system prompt guidelines for the first 10–15 turns, but later responses deviate. The conversation is still within token limits.", "question": "What is the best solution?", "options": [{"letter": "A", "text": "Move behavioral guidelines into the first user message.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Start a new conversation after 20 turns.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Insert user-role messages reinforcing guidelines at conversation breakpoints.", "correct": true, "explanation": "Periodic injection of behavioral reminders directly combats instruction drift by re-establishing constraints at regular intervals as conversation history accumulates. Moving guidelines to the first user message (A) reduces their authority. Starting a new conversation (B) destroys context. Post-response validation (D) is corrective rather than preventive and adds significant latency."}, {"letter": "D", "text": "Use post-response validation to regenerate non-compliant responses.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g71", "source": "guide", "domain": 4, "scenario": "Conversational AI Architecture Patterns", "situation": "Your assistant must maintain an enthusiastic tone, explain its reasoning, and ask clarifying questions. Where should these behavioral guidelines be defined?", "question": "Where should these behavioral guidelines be defined?", "options": [{"letter": "A", "text": "Prepended to each user message.", "correct": false, "explanation": ""}, {"letter": "B", "text": "In the system prompt.", "correct": true, "explanation": "The system prompt is specifically designed for persistent behavioral constraints and guidelines that apply throughout the entire conversation. Prepending to each user message (A) is redundant overhead. The first assistant message (C) is unreliable because the model can deviate from its own prior statements. Environment variables (D) have no effect on model behavior."}, {"letter": "C", "text": "In the first assistant message.", "correct": false, "explanation": ""}, {"letter": "D", "text": "In environment variables.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g72", "source": "guide", "domain": 4, "scenario": "Conversational AI Architecture Patterns", "situation": "Users report repetitive response openings like \"Certainly!\" and \"I'd be happy to help!\"", "question": "What is the most effective approach?", "options": [{"letter": "A", "text": "Append a partial assistant message with a direct response opening.", "correct": true, "explanation": "Prefilling the assistant's response with the beginning of a direct answer prevents greeting patterns at the generation level—the model continues from the prefill rather than generating new opening phrases. System prompt instructions (D) can help but are less reliable since the model may still produce variants. Post-processing (C) is a fragile workaround. Temperature (B) controls randomness, not specific phrase patterns."}, {"letter": "B", "text": "Lower the temperature setting.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Post-process responses to remove greetings.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Add system prompt instructions to avoid those phrases.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g73", "source": "guide", "domain": 4, "scenario": "Conversational AI Architecture Patterns", "situation": "A webhook notifies your system that a user's package has shipped while the user is actively chatting. You want the assistant to incorporate this naturally into the next response.", "question": "What is the best approach?", "options": [{"letter": "A", "text": "Add shipping status to the system prompt.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Send an immediate synthetic user message.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Force the assistant to call a status tool on each turn.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Append the status update as a prefix to the next user message.", "correct": true, "explanation": "Prefixing the status update to the next user message injects real-time context at a natural conversation boundary without disrupting the flow. Modifying the system prompt (A) requires rebuilding the session or is architecturally cumbersome. A synthetic user message (B) can break the natural dialogue flow and confuse attribution. Forcing a tool call each turn (C) is wasteful when events are rare."}], "correct": "D"}, {"id": "g74", "source": "guide", "domain": 4, "scenario": "Conversational AI Architecture Patterns", "situation": "Users frequently send requests like \"Book a venue for the party.\" The assistant asks 4+ clarifying questions, causing 35% abandonment.", "question": "What approach best improves the trade-off?", "options": [{"letter": "A", "text": "Proceed with hidden defaults.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Ask all clarifying questions in one compound message.", "correct": false, "explanation": ""}, {"letter": "C", "text": "State assumptions explicitly and proceed while inviting corrections.", "correct": true, "explanation": "Stating assumptions explicitly and proceeding gives the user an immediate, useful response while preserving their ability to correct wrong assumptions. Hidden defaults (A) leave the user unaware of what was assumed. A compound question list (B) still demands upfront effort from the user. A structured form (D) adds more friction, not less—contradicting the goal of reducing abandonment."}, {"letter": "D", "text": "Use a structured intake form.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g76", "source": "guide", "domain": 4, "scenario": "Conversational AI Architecture Patterns", "situation": "Users ask vague requests like \"Can you help with the report?\" The assistant responds by asking multiple questions (which report? what help? deadline?), causing 40% abandonment.", "question": "What is the best solution?", "options": [{"letter": "A", "text": "Make reasonable assumptions, state them explicitly, and offer to adjust.", "correct": true, "explanation": "Proceeding with reasonable stated assumptions eliminates the back-and-forth entirely while keeping the user informed and in control. Predefined silent interpretations (C) leave users confused when the response doesn't match their intent. A single-question limit (D) still requires turns of back-and-forth. A smaller classification model (B) adds latency and infrastructure complexity without solving the core UX problem."}, {"letter": "B", "text": "Classify ambiguity with a smaller model before responding.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Use predefined interpretations without stating assumptions.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Limit the assistant to one clarifying question per turn.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "m8", "source": "mock", "domain": 4, "scenario": null, "situation": "Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes conflicting subagent findings are synthesized into a single confident statement (losing nuance), while other times reports over-hedge with excessive qualifications (becoming unhelpful). When the web search agent returns \"industry analysts estimate $50B market size (methodology varies)\" and the document analysis agent returns \"peer-reviewed study estimates 35B(±7B, 95% CI),\" the coordinator either picks one arbitrarily or produces vague statements like \"the market may be 35B−50B depending on factors.\"", "question": "What systematic approach best addresses this?", "options": [{"letter": "A", "text": "Configure subagents to only report findings meeting a high-confidence threshold, filtering uncertain information before it reaches the coordinator.", "correct": false, "explanation": "Filtering throws away useful-but-uncertain evidence. It doesn't help the synthesis agent reason about conflicts — it just hides them."}, {"letter": "B", "text": "Implement a confidence calibration layer that normalizes subagent uncertainty expressions to standardized probability scores (0.0-1.0), then weight-average findings by their calibrated confidence.", "correct": false, "explanation": "Collapsing peer-reviewed CIs and analyst estimates into a single averaged number destroys the methodological difference that's the whole point."}, {"letter": "C", "text": "Instruct the synthesis agent to structure reports with explicit sections distinguishing well-established findings from contested ones, preserving original source characterizations and methodological context.", "correct": true, "explanation": "Correct. Report structure that keeps methodological context and separates settled vs. contested claims is how you get nuance without over-hedging."}, {"letter": "D", "text": "Add a verification subagent that cross-references findings across sources, only passing claims to synthesis that are corroborated by at least two independent sources.", "correct": false, "explanation": "Two-source minimums drop legitimate single-source findings and don't resolve genuinely conflicting estimates with different methodologies. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m11", "source": "mock", "domain": 4, "scenario": null, "situation": "A user is expanding the research system beyond its single web search agent by adding specialized data sources. They add a financial API agent that returns structured JSON with revenue, margins, and growth rates; a news monitoring agent that returns prose summaries of recent developments; and a patent analysis agent that returns structured lists of technology areas. The synthesis agent combines these into executive briefings. Currently, it converts everything to bullet points, causing financial comparisons to lose tabular clarity and news summaries to lose narrative flow.", "question": "What change would most improve briefing quality?", "options": [{"letter": "A", "text": "Standardize all subagent outputs to prose summaries with inline citations.", "correct": false, "explanation": "Flattening structured financial data into prose loses the comparability you want in an executive briefing."}, {"letter": "B", "text": "Add a format conversion layer between subagents and synthesis that transforms all outputs to a common intermediate representation.", "correct": false, "explanation": "A single IR usually ends up too lossy — either it keeps structure (news suffers) or it keeps prose (tables suffer). The fix is type-aware rendering, not uniformity."}, {"letter": "C", "text": "Update the synthesis agent to render each content type appropriately—financial data as tables, news as prose.", "correct": true, "explanation": "Correct. Executive briefings need mixed rendering: tables for numbers, prose for narrative. Asking synthesis to preserve the native format of each input is the right abstraction."}, {"letter": "D", "text": "Standardize all subagent outputs to JSON with fields for claim, evidence, source, and confidence.", "correct": false, "explanation": "Forcing prose-heavy news into a claim/evidence schema strips the narrative flow executives actually read. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m46", "source": "mock", "domain": 4, "scenario": null, "situation": "Your extraction system processes two document types: standard monthly reports (archived after processing) and urgent exception reports (must trigger business alerts within 30 minutes of receipt). Both use the same JSON schema. You want to minimize API costs while meeting latency requirements.", "question": "How should you architect the processing pipeline?", "options": [{"letter": "A", "text": "Submit all documents to the real-time Messages API to ensure consistent processing latency across document types.", "correct": false, "explanation": "Consistent but expensive. Standard monthly reports don't need real-time latency and shouldn't pay for it."}, {"letter": "B", "text": "Submit all documents to the `Batch API` with `custom_ids` for tracking. When results arrive, immediately process urgent documents and trigger delayed alerts for exceptions.", "correct": false, "explanation": "Batch has up to a 24-hour window — 30-minute alerting SLAs on exception reports can't be met by routing them through batch."}, {"letter": "C", "text": "Queue all documents and submit hourly batches, flagging urgent documents for expedited handling when batch results return.", "correct": false, "explanation": "Hourly batches still ride the batch SLO and don't guarantee the 30-minute alert window for exceptions."}, {"letter": "D", "text": "Route standard reports to the `Batch API` for 50% cost savings, and route urgent exception reports to the real-time Messages API.", "correct": true, "explanation": "Correct. Match latency profile to document urgency: batch for the bulk (cheap), real-time for the latency-sensitive exceptions (fast). Minimizes cost while meeting SLA. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m47", "source": "mock", "domain": 4, "scenario": null, "situation": "Your schema includes a skills: string[] field. Production monitoring reveals three consistency issues: (1) compound phrases like \"Python and SQL\" are sometimes kept as one entry, sometimes split; (2) implied but unstated skills occasionally appear in extractions; (3) similar documents produce wildly different array lengths (5-10 vs 40+ entries). Your prompt currently says \"Extract all skills mentioned.\"", "question": "What's the most effective improvement?", "options": [{"letter": "A", "text": "Add few-shot examples demonstrating compound phrase handling, explicit mention criteria, and appropriate entry granularity.", "correct": true, "explanation": "Correct. All three issues are about the model's interpretation of what counts as 'a skill.' Few-shot examples teach the pattern concretely — split vs. not-split, mentioned vs. inferred, appropriate granularity."}, {"letter": "B", "text": "Add constraints: \"Extract 10-20 skills maximum, one skill per entry, only explicitly named skills.\"", "correct": false, "explanation": "Hard count caps are arbitrary and can force the model to drop real skills or invent filler to hit the range."}, {"letter": "C", "text": "Add post-extraction normalization that maps skills to a canonical taxonomy and deduplicates similar entries.", "correct": false, "explanation": "Post-processing can't fix inferred-but-not-mentioned skills or choose the right split for 'Python and SQL' — that decision has to be made at extraction time."}, {"letter": "D", "text": "Enrich the schema to {skill: string, confidence: float, `source_quote`: string}[] to capture extraction metadata.", "correct": false, "explanation": "Useful signal, but doesn't address the underlying inconsistency in how skills are parsed in the first place. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m48", "source": "mock", "domain": 4, "scenario": null, "situation": null, "question": "Your system has been operating with 100% human review for 3 months. Analysis shows that extractions with model confidence >90% have 97% accuracy overall. To reduce reviewer workload, you plan to automate high-confidence extractions. Before deploying, what validation step is most critical?", "options": [{"letter": "A", "text": "Analyze accuracy by document type and field to verify high-confidence extractions perform consistently across all segments, not just in aggregate.", "correct": true, "explanation": "Correct. Aggregate accuracy hides segment failures — one document type could be 70% while others are 99%. Auto-routing by overall number alone risks systemic errors in the weak segments."}, {"letter": "B", "text": "Compare accuracy at different confidence thresholds (85%, 90%, 95%) to find the optimal cutoff that maximizes automation while minimizing errors.", "correct": false, "explanation": "Threshold tuning is worth doing, but only after you know the accuracy holds uniformly across segments — otherwise you're optimizing a number that lies."}, {"letter": "C", "text": "Run a two-week pilot routing 25% of high-confidence extractions directly to downstream systems and monitor error reports.", "correct": false, "explanation": "A pilot is good practice, but it's downstream of the segment analysis — if a segment is systematically wrong, you'll learn it by harming users."}, {"letter": "D", "text": "Verify that 97% accuracy meets requirements for all downstream systems that consume the extracted data.", "correct": false, "explanation": "An important product question, but it assumes the 97% holds everywhere — again, that's what segment analysis verifies first. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m49", "source": "mock", "domain": 4, "scenario": null, "situation": "Your extraction pipeline processes contracts that frequently include amendments. When a contract contains both original terms and later amendments (e.g., original clause specifies \"30-day payment terms\" while Amendment 1 changes this to \"45 days\"), the model inconsistently extracts one value or the other with no indication of which applies.", "question": "What's the most effective approach to improve extraction accuracy for documents with amendments?", "options": [{"letter": "A", "text": "Redesign the schema so amended fields capture multiple values, each with source location and effective date.", "correct": true, "explanation": "Correct. Amendments are structurally about versioned values. A schema with value + source location + effective date models the domain correctly and stops forcing the model to pick one."}, {"letter": "B", "text": "Add prompt instructions to always extract the most recent amendment value and ignore superseded original terms.", "correct": false, "explanation": "Downstream consumers sometimes need the original too (e.g., for dispute resolution). Hard-coding 'most recent wins' throws that away."}, {"letter": "C", "text": "Preprocess documents with a classifier that identifies and removes superseded sections before the main extraction step.", "correct": false, "explanation": "Deleting sections with a classifier can accidentally strip content that's still legally effective — amendments often modify subsets of clauses."}, {"letter": "D", "text": "Implement post-extraction validation using pattern matching to detect amendments and flag those extractions for manual review.", "correct": false, "explanation": "Routes every amended contract to a human — expensive, and still doesn't give downstream systems a structured answer. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m50", "source": "mock", "domain": 4, "scenario": null, "situation": "Your extraction system implements automatic retries when validation fails. On each retry, the specific validation error is appended to the prompt. This retry-with-error-feedback approach resolves most failures within 2-3 attempts.", "question": "For which failure pattern would additional retries be LEAST effective?", "options": [{"letter": "A", "text": "The model extracts keywords as a nested object organized by category when the schema requires a flat array of strings", "correct": false, "explanation": "A structural mismatch the model can definitely correct given feedback about the expected shape."}, {"letter": "B", "text": "The model extracts citation counts as locale-formatted strings (\"1,234\") when the schema requires integers", "correct": false, "explanation": "The required number is present in the document — the model just needs to stop formatting it. Easy for feedback-retry to fix."}, {"letter": "C", "text": "The model extracts dates as ISO 8601 datetime strings (\"2023-03-15T00:00:00Z\") when the schema requires only the date portion (YYYY-MM-DD)", "correct": false, "explanation": "Pure formatting fix — the underlying value is correct and the model can trim the time portion on retry."}, {"letter": "D", "text": "The model extracts \"et al.\" for co-authors when the full list exists only in an external document not in the input", "correct": true, "explanation": "Correct. No amount of retrying teaches the model information that isn't in the input. Retry-with-error-feedback only fixes mistakes the model could have gotten right from the source. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m51", "source": "mock", "domain": 4, "scenario": null, "situation": "Your extraction pipeline processes restaurant menus and must output structured JSON with fields for item names, descriptions, prices, and dietary tags. Some menus use inconsistent formatting—prices as \"$12\" vs \"12.00\", dietary info as icons vs text.", "question": "What's the most reliable approach?", "options": [{"letter": "A", "text": "Use separate extraction calls for each field to ensure consistent handling of each type.", "correct": false, "explanation": "Multiple calls per menu multiplies cost and latency and loses cross-field context (e.g., which dietary icons sit next to which item)."}, {"letter": "B", "text": "Extract data as-is and normalize formats in post-processing code after Claude returns.", "correct": false, "explanation": "Post-processing a raw blob is brittle — deterministic code has to handle every format permutation. Better to let the model normalize at extraction time."}, {"letter": "C", "text": "Request multiple extraction attempts per document and select the most common format.", "correct": false, "explanation": "Ensemble voting is expensive and can still pick a wrong-format majority."}, {"letter": "D", "text": "Define a strict output schema and include format normalization rules in your prompt.", "correct": true, "explanation": "Correct. Strict schema + explicit normalization rules ('prices as decimal with two places', 'dietary as enumerated tags') lets the model both extract and normalize in one pass. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m52", "source": "mock", "domain": 4, "scenario": null, "situation": "Your system extracts event metadata (date, location, organizer, `attendee_count`) from news articles using a JSON schema with all nullable fields. During evaluation, you observe the model frequently generates plausible but incorrect values for fields not mentioned in the article—for example, outputting \"500\" for `attendee_count` when the source contains no attendance information.", "question": "What's the most effective way to reduce these false extractions?", "options": [{"letter": "A", "text": "Add a post-processing step using a second LLM call to verify each extracted value exists in the source document.", "correct": false, "explanation": "Expensive second pass for a behavior you can correct at the source — tell the model to return null when the field isn't stated."}, {"letter": "B", "text": "Add prompt instructions to return null for any field where information is not directly stated in the source.", "correct": true, "explanation": "Correct. The fields are already nullable; the model just needs an explicit instruction to prefer null over a plausible guess. This is the standard fix for schema-aware hallucination."}, {"letter": "C", "text": "Make all schema fields required (non-nullable) with strict validation rules to ensure the model only outputs verifiable data.", "correct": false, "explanation": "Required fields force the model to invent values when information is missing — the opposite of what you want."}, {"letter": "D", "text": "Upgrade to a more capable model tier with improved instruction-following to reduce hallucination tendencies.", "correct": false, "explanation": "Adds cost and still doesn't tell the model your policy — returning null instead of inventing. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m53", "source": "mock", "domain": 4, "scenario": null, "situation": "After implementing tool use with strict schema definitions, JSON syntax errors are eliminated, but 5% of extractions still have valid JSON with empty arrays or null values for required fields like citations and methodology. Spot-checking reveals that source documents contain this information, but in varied formats—inline citations vs. bibliographies, methodology sections vs. details embedded in introductions.", "question": "What's the most effective way to address these failures?", "options": [{"letter": "A", "text": "Implement retry logic that re-sends requests when validation detects empty required fields.", "correct": false, "explanation": "Retry on the same prompt won't suddenly teach the model to recognize methodology embedded in an intro. The extraction capability is the gap."}, {"letter": "B", "text": "Build a regex-based post-processing layer that scans source documents for citation patterns and methodology keywords, populating empty fields when the model fails to extract.", "correct": false, "explanation": "Regex over prose is brittle, misses the nuanced cases (intro-embedded methodology), and ships silently wrong data."}, {"letter": "C", "text": "Modify your schema to make citations and methodology optional, and flag incomplete records for manual review rather than failing validation.", "correct": false, "explanation": "Papers over the symptom. The fields really are required downstream — routing them to humans trades one problem for reviewer workload."}, {"letter": "D", "text": "Add few-shot examples demonstrating extractions from documents with varied structures—showing how to identify citations in different formats and locate methodology details across section types.", "correct": true, "explanation": "Correct. The failure mode is the model not recognizing varied formats. Concrete examples across the format distribution directly raise recall on the 5%. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m54", "source": "mock", "domain": 4, "scenario": null, "situation": "Your extraction pipeline processes invoices and extracts line items, subtotals, tax amounts, and grand totals. During evaluation, you discover that in 18% of extractions, the sum of extracted line item amounts doesn't match the extracted grand total—sometimes due to OCR errors in the source document, sometimes due to extraction mistakes by the model. Downstream accounting systems reject records with mismatched totals.", "question": "What's the most effective approach to improve extraction reliability?", "options": [{"letter": "A", "text": "Add a \"`calculated_total`\" field where the model sums extracted line items alongside a \"`stated_total`\" field. Flag records for human review when values differ.", "correct": true, "explanation": "Correct. Capturing both values makes the discrepancy a first-class signal — you catch OCR errors and extraction mistakes uniformly, and you can route only the mismatched 18% to humans."}, {"letter": "B", "text": "Extract line items and totals independently, then use a separate validation model to reconcile discrepancies by determining which extracted values are most likely correct.", "correct": false, "explanation": "A reconciliation model can mask OCR errors by silently picking one number over another — the accounting system still gets wrong data without a flag."}, {"letter": "C", "text": "Add few-shot examples demonstrating invoices where extracted line items sum correctly to the stated total, encouraging the model to produce mathematically consistent extractions.", "correct": false, "explanation": "Can nudge the model toward consistency, but when the source itself is internally inconsistent (OCR errors), the model has to choose one 'wrong'."}, {"letter": "D", "text": "Implement post-processing that automatically adjusts line item amounts proportionally when their sum doesn't match the stated total.", "correct": false, "explanation": "Silent financial data rewrites are dangerous — you'd be fabricating line items for a downstream accounting system. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m56", "source": "mock", "domain": 4, "scenario": null, "situation": "Your extraction uses tool use with a JSON schema where `property_type` is defined as an enum: ['house', 'apartment', 'condo', 'townhouse']. After deployment, 8% of extractions fail schema validation. Investigation reveals listings mention many uncommon property types—\"studio\", \"loft\", \"duplex\", \"mobile home\", \"tiny house\", \"converted warehouse\"—and new types continue appearing regularly.", "question": "What's the most effective long-term solution?", "options": [{"letter": "A", "text": "Continuously expand the enum to include newly observed property types and add monitoring for additional edge cases.", "correct": false, "explanation": "Whack-a-mole enum maintenance — every new listing style risks another validation failure."}, {"letter": "B", "text": "Add an \"other\" value to your enum with a separate `property_type_detail` string field for specifics when \"other\" is selected.", "correct": true, "explanation": "Correct. Keeps the strong enum for the common cases (clean downstream joins) while giving a well-typed escape hatch that preserves detail. Stable long-term."}, {"letter": "C", "text": "Change `property_type` from an enum to a free-form string and implement a normalization step in post-processing.", "correct": false, "explanation": "Loses the validation guarantee entirely and pushes the normalization problem downstream with no canonical vocabulary."}, {"letter": "D", "text": "Add few-shot examples to your prompt demonstrating how to map unexpected property types to the closest existing enum value.", "correct": false, "explanation": "Forcing 'tiny house' into 'house' drops real distinctions downstream — you're silently lossy. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m57", "source": "mock", "domain": 4, "scenario": null, "situation": "Your extraction system parses e-commerce product descriptions to extract specifications like dimensions, weight, and materials into JSON. Despite having a well-defined schema, the model inconsistently extracts the \"materials\" field—sometimes returning \"cotton blend\", other times \"Cotton/Polyester mix\", and occasionally omitting the field when material information is clearly present in the source.", "question": "What's the most effective way to improve extraction consistency?", "options": [{"letter": "A", "text": "Make the \"materials\" field required instead of optional in the schema to force the model to always extract a value", "correct": false, "explanation": "Required-ness doesn't solve format inconsistency, and it can force invented values when material info is genuinely missing."}, {"letter": "B", "text": "Switch to a more capable model tier since inconsistent extraction indicates insufficient model capability", "correct": false, "explanation": "Costly, and doesn't address the actual cause — the model doesn't know the canonical output format you want."}, {"letter": "C", "text": "Set temperature to 0 to eliminate randomness and ensure deterministic outputs", "correct": false, "explanation": "Determinism doesn't define the right format; it just makes the wrong-format answers consistent."}, {"letter": "D", "text": "Add few-shot examples showing 2-3 complete input-output pairs with standardized material description formats", "correct": true, "explanation": "Correct. Few-shot examples demonstrate the exact canonical format you want ('cotton/polyester' as a normalized list), and they also raise recall on material info that was being skipped. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m58", "source": "mock", "domain": 4, "scenario": null, "situation": "Documents arrive continuously throughout business hours and need structured data extracted. To reduce costs, you want to use the `Message Batches API` (50% discount, up-to-24-hour processing window). Your SLA specifies that extraction results must be available within 30 hours of document arrival with 99.9% reliability.", "question": "Which batching strategy is most appropriate?", "options": [{"letter": "A", "text": "Submit batches every 6 hours containing documents from that window", "correct": false, "explanation": "Worst-case a document waits 6 hours to be batched and then up to 24 hours to process = 30 hours exactly. No safety margin for a 99.9% reliability target."}, {"letter": "B", "text": "Submit a single batch at end of day containing all documents from that day", "correct": false, "explanation": "A doc arriving just after morning startup waits all day to be batched plus up to 24 hours to process — well over 30 hours."}, {"letter": "C", "text": "Submit batches every 4 hours containing documents from that window", "correct": true, "explanation": "Correct. Max 4-hour wait + up to 24-hour batch SLO = 28-hour worst case, leaving a 2-hour cushion under the 30-hour SLA to absorb batch variance and hit 99.9%."}, {"letter": "D", "text": "Use the real-time API for all documents instead of batch processing", "correct": false, "explanation": "Meets SLA trivially but throws away the 50% cost saving the question asks you to capture. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m59", "source": "mock", "domain": 4, "scenario": null, "situation": "After deployment, you find that 12% of extractions contain semantic errors that pass JSON schema validation (e.g., a duration like \"30 minutes\" incorrectly placed in an ingredient quantity field). Human reviewers have capacity to check only 20% of extractions.", "question": "Which approach most effectively allocates reviewer attention?", "options": [{"letter": "A", "text": "Have the model output field-level confidence scores, then calibrate review thresholds using a labeled validation set.", "correct": true, "explanation": "Correct. Field-level confidence lets you route the low-confidence 20% — which is where the 12% semantic errors concentrate — to humans. Calibration makes the threshold choice data-driven."}, {"letter": "B", "text": "Randomly sample 20% of extractions for review, using corrections to track accuracy and identify error patterns.", "correct": false, "explanation": "Great for measurement, poor for coverage — random sampling only catches 20% of the 12% errors (~2.4% total). Confidence-based routing finds far more."}, {"letter": "C", "text": "Prioritize review of all extractions where required fields are empty or explicitly marked as not found.", "correct": false, "explanation": "Empty fields are a narrow error mode. The 12% problem is wrong values in populated fields, which this filter misses."}, {"letter": "D", "text": "Review all extractions from documents with formatting anomalies such as unusual layouts or mixed content types.", "correct": false, "explanation": "A useful heuristic, but formatting anomaly doesn't reliably predict where fields got confused with each other. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "g13", "source": "guide", "domain": 5, "scenario": "Multi-agent Research System", "situation": "Production monitoring shows inconsistent synthesis quality. When aggregated results are ~75K tokens, the synthesis agent reliably cites information from the first 15K tokens (web-search headlines/snippets) and the last 10K tokens (document analysis conclusions), but often misses critical findings in the middle 50K tokens—even when they directly answer the research question. How should you restructure the aggregated input?", "question": "How should you restructure the aggregated input?", "options": [{"letter": "A", "text": "Summarize all subagent outputs to under 20K tokens before aggregation to keep content within the model’s reliable processing range.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Stream subagent results to the synthesis agent incrementally, processing web-search results first to completion, then adding document analysis results.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Place a key-findings summary at the start of the aggregated input and organize detailed results with explicit section headings for easier navigation.", "correct": true, "explanation": "Putting a key-findings summary at the start leverages primacy effects so critical information sits in the most reliably processed position. Adding explicit section headings throughout helps the model navigate and attend to mid-input content, directly mitigating the “lost in the middle” phenomenon."}, {"letter": "D", "text": "Implement rotation that alternates which subagent’s results appear first across research tasks to ensure both sources get equal top positioning over time.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g14", "source": "guide", "domain": 5, "scenario": "Multi-agent Research System", "situation": "In testing, the combined output of the web-search agent (85K tokens including page content) and the document analysis agent (70K tokens including chains of thought) totals 155K tokens, but the synthesis agent performs best with inputs under 50K tokens. Which solution is most effective?", "question": "Which solution is most effective?", "options": [{"letter": "A", "text": "Modify upstream agents to return structured data (key facts, quotes, relevance scores) instead of verbose content and reasoning.", "correct": true, "explanation": "Modifying upstream agents to return structured data fixes the root cause by reducing token volume at the source while preserving essential information. It avoids passing bulky page content and reasoning traces that inflate tokens without improving the synthesis step."}, {"letter": "B", "text": "Add an intermediate summarization agent that condenses findings before passing them to synthesis.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Have the synthesis agent process findings in sequential batches, maintaining state between calls.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Store findings in a vector database and give the synthesis agent search tools to query during its work.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g45", "source": "guide", "domain": 5, "scenario": "Code Generation with Claude Code", "situation": "You’re adding error-handling wrappers around external API calls across a 120-file codebase. The work has three phases: (1) discover all call sites and patterns, (2) collaboratively design the error-handling approach, and (3) implement wrappers consistently. In Phase 1, Claude generates large output listing hundreds of call sites with context, quickly filling the context window before discovery finishes.", "question": "Which approach is most effective to complete the task while maintaining implementation consistency?", "options": [{"letter": "A", "text": "Use an Explore subagent for Phase 1 to isolate verbose discovery output and return a summary, then continue Phases 2–3 in the main conversation.", "correct": true, "explanation": "An Explore subagent isolates the verbose discovery output in a separate context and returns only a concise summary to the main conversation. This preserves the main context window for the collaborative design and consistent implementation phases where retained context is most valuable."}, {"letter": "B", "text": "Do all phases in the main conversation, periodically using `/compact` to reduce context usage while moving through files.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Switch to headless mode with `--continue`, passing explicit context summaries between batch calls to maintain continuity.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Define the error-handling pattern in CLAUDE.md, then process files in batches across multiple sessions relying on the shared memory file for consistency.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g54", "source": "guide", "domain": 5, "scenario": "Customer Support Agent", "situation": "Production logs show a pattern: customers reference specific amounts (e.g., “the 15% discount I mentioned”), but the agent responds with incorrect values. Investigation shows these details were mentioned 20+ turns ago and condensed into vague summaries like “promotional pricing was discussed.” What fix is most effective?", "question": "What fix is most effective?", "options": [{"letter": "A", "text": "Increase the summarization threshold from 70% to 85% so conversations have more room before summarization triggers.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Store full conversation history in external storage and implement retrieval when the agent detects references like “as I mentioned.”", "correct": false, "explanation": ""}, {"letter": "C", "text": "Extract transactional facts (amounts, dates, order numbers) into a persistent “case facts” block included in every prompt outside the summarized history.", "correct": true, "explanation": "Summarization inherently loses precise details. Extracting transactional facts into a structured “case facts” block outside the summarized history preserves critical information so it’s reliably available in every prompt regardless of how many turns have been summarized."}, {"letter": "D", "text": "Revise the summarization prompt to explicitly preserve all numbers, percentages, dates, and customer-stated expectations verbatim.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g63", "source": "guide", "domain": 5, "scenario": "Conversational AI Architecture Patterns", "situation": "Over several turns discussing investment strategy, a user stated \"I have a very low risk tolerance\" and later \"I want to maximize my returns.\" They now ask: \"What should I invest in?\"", "question": "Which approach best ensures the recommendation aligns with the user's actual priority?", "options": [{"letter": "A", "text": "Surface the contradiction and ask the user to clarify which matters more.", "correct": true, "explanation": "When user preferences directly contradict each other, surfacing the conflict and asking for clarification is the only way to guarantee the recommendation aligns with the user's true intent. Any other approach involves making an assumption that may be wrong—maximizing returns and low risk tolerance are fundamentally incompatible goals that require a human decision."}, {"letter": "B", "text": "Provide separate recommendations for both scenarios.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Proceed with the most recently stated preference.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Recommend a balanced portfolio without addressing the conflict.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g64", "source": "guide", "domain": 5, "scenario": "Conversational AI Architecture Patterns", "situation": "Users refine playlist preferences over multiple conversation turns. Two messages after a user said \"I love jazz,\" Claude asks \"What genres do you enjoy?\"", "question": "What is the most likely cause?", "options": [{"letter": "A", "text": "Claude requires a vector database connection to maintain conversation memory.", "correct": false, "explanation": ""}, {"letter": "B", "text": "The model's context window has been exceeded.", "correct": false, "explanation": ""}, {"letter": "C", "text": "The Claude API requires a `session_id` parameter.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Your application isn't including prior messages in the `messages` array.", "correct": true, "explanation": "Claude has no server-side memory—every API call is stateless. Without including the full conversation history in the `messages` array of each request, Claude has no knowledge of prior turns. Vector databases (A) and `session_id` (C) are not part of Claude's architecture; context window overflow (B) is impossible for two-message exchanges."}], "correct": "D"}, {"id": "g65", "source": "guide", "domain": 5, "scenario": "Conversational AI Architecture Patterns", "situation": "After a 40-minute cooking session, the conversation reaches 78,000 tokens. History includes allergies, recipe scaling, clarified cooking terms, and general discussion. You must reduce tokens while preserving important information.", "question": "What approach best balances preservation with token reduction?", "options": [{"letter": "A", "text": "Summarize the entire conversation history.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Keep only the most recent 20,000 tokens.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Extract critical structured data (allergies, quantities, preferences), summarize general discussion, and keep recent exchanges verbatim.", "correct": true, "explanation": "The hybrid approach preserves the highest-value information at the lowest cost. Critical facts like allergies and recipe quantities are extracted into a compact structured block (preventing the precision loss that occurs during summarization), general discussion is summarized, and recent exchanges are kept verbatim for conversational coherence. Options A and B risk losing critical dietary information; D is architectural overkill for a single cooking session."}, {"letter": "D", "text": "Store the full conversation externally and retrieve relevant parts via semantic search.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g66", "source": "guide", "domain": 5, "scenario": "Conversational AI Architecture Patterns", "situation": "Users report that during extended conversations the assistant loses track of earlier topics and preferences. Your current implementation keeps only the last 25 message pairs.", "question": "What is the most effective solution?", "options": [{"letter": "A", "text": "Hybrid approach: summarize older messages while keeping recent ones verbatim.", "correct": true, "explanation": "The hybrid approach addresses both dimensions of the problem: retaining exact recent context (critical for conversational coherence) while maintaining a compressed representation of earlier preferences (preventing total loss when pairs are dropped). Increasing the window (C) simply delays the same problem. Vector search (B) may miss important context that isn't semantically similar to the current query. Full per-turn summarization (D) adds overhead and accumulates summarization errors."}, {"letter": "B", "text": "Vector similarity search over the full conversation history.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Increase the window to 50 message pairs.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Summarize dropped messages every turn and prepend the running summary.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g67", "source": "guide", "domain": 5, "scenario": "Conversational AI Architecture Patterns", "situation": "Users report that latency increases and costs rise when conversations exceed 50 turns.", "question": "What is the primary cause?", "options": [{"letter": "A", "text": "The entire conversation history is included with each API request.", "correct": true, "explanation": "Claude's API is fully stateless—every request must include the complete conversation history in the `messages` array. As conversations grow, each request carries more tokens, which directly increases both processing latency and cost. The model does not maintain any internal state between calls (D is false), and response length is not inherently tied to conversation length (B)."}, {"letter": "B", "text": "The model generates progressively longer responses.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Database operations slow down as history grows.", "correct": false, "explanation": ""}, {"letter": "D", "text": "The model builds an internal user profile requiring more processing.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g68", "source": "guide", "domain": 5, "scenario": "Conversational AI Architecture Patterns", "situation": "After three months of weekly sessions, conversation history grows to 85,000 tokens. When a user asks \"What did we conclude about the theme of isolation?\", the assistant gives generic answers instead of referencing previous discussions.", "question": "What is the most effective approach?", "options": [{"letter": "A", "text": "Rolling window truncation.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Progressive summarization capturing key conclusions.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Semantic embeddings with retrieval of relevant exchanges.", "correct": true, "explanation": "Semantic search over conversation history is the only approach that scales to three months of discussion while being able to surface specific relevant exchanges on demand. Rolling window (A) would discard most of the history. Progressive summarization (B) compresses discussions into abstractions that lose the specific conclusions users are asking about. XML tags (D) require restructuring all past content and don't solve the retrieval problem at this scale."}, {"letter": "D", "text": "Add structured XML tags marking discussion conclusions.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g70", "source": "guide", "domain": 5, "scenario": "Conversational AI Architecture Patterns", "situation": "Your AI tutor has a 2,800-token system prompt defining teaching methodology and adaptation rules. After 12 turns, the assistant starts ignoring proficiency levels.", "question": "What is the most effective fix?", "options": [{"letter": "A", "text": "Inject reminders every 4–5 turns.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Replace verbose rules with few-shot examples demonstrating proficiency-level adaptation.", "correct": true, "explanation": "A 2,800-token system prompt with declarative rules is vulnerable to drift because abstract rules require the model to reason about them on every turn. Replacing verbose rules with concrete few-shot examples that demonstrate correct proficiency-level adaptation gives the model clear behavioral patterns to match—this is more reliably followed across many turns than abstract instructions. Reminder injection (A) helps but addresses symptoms; end-placement (C) helps initially but not with turn-level drift; regeneration (D) is expensive and corrective."}, {"letter": "C", "text": "Place critical rules at the end of the system prompt.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Evaluate responses and regenerate if difficulty level mismatches.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g75", "source": "guide", "domain": 5, "scenario": "Conversational AI Architecture Patterns", "situation": "Your assistant uses a contractor-persona system prompt. Early turns follow the rules, but by turn 7 the assistant gives generic advice. Conversation length is only 2,500 tokens.", "question": "What is the most likely cause?", "options": [{"letter": "A", "text": "System prompts only establish initial behavior.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Model attention weakens as turns accumulate.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Accumulated assistant responses dilute system prompt influence.", "correct": true, "explanation": "As assistant responses accumulate in the conversation history, the proportion of text reflecting the system prompt's behavioral constraints decreases relative to the growing body of assistant-generated content. The model increasingly pattern-matches to its own prior outputs rather than the system prompt, compounding drift even at short token lengths. The system prompt is included in every API call (D is false as a standalone explanation), and model attention degradation (B) doesn't operate at 2,500 tokens."}, {"letter": "D", "text": "The system prompt is only sent once.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "m18", "source": "mock", "domain": 5, "scenario": null, "situation": "During testing, you observe that in extended exploration sessions (30+ minutes), the agent starts giving inconsistent answers about code structure it discussed earlier. Engineers report having to repeat context about modules they've already explored.", "question": "What's the most effective approach to address this?", "options": [{"letter": "A", "text": "Have the agent maintain a scratchpad file that records key findings, referencing it for subsequent questions.", "correct": true, "explanation": "Correct. A scratchpad offloads findings to durable storage the agent can re-read on demand, giving it a stable 'memory' independent of how crowded the context window gets."}, {"letter": "B", "text": "Switch to a higher-capacity model tier to provide more context window space for accumulated exploration data.", "correct": false, "explanation": "A bigger window delays the problem but doesn't solve attention degradation over long, noisy contexts."}, {"letter": "C", "text": "Implement automatic context clearing every 15 minutes to ensure the agent starts with fresh, uncontaminated context.", "correc give a fresh subagent that summary plus the physics task — you preserve the important signal and escape the degraded context."}, {"letter": "D", "text": "Use /clear to reset context completely, then start fresh with physics exploration using file paths from the project's CLAUDE.md.", "correct": false, "explanation": "/clear nukes the rendering findings you actually need for the cross-cut question about collision debug overlays. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m23", "source": "mock", "domain": 5, "scenario": null, "situation": "An engineer asks the agent to understand how the caching layer works before adding a new cache invalidation trigger. After initial Grep searches, the agent has identified that caching logic spans 15 files including decorators, middleware, and service classes (~8,000 lines total).", "question": "What's the most effective next step for building understanding while managing context constraints?", "options": [{"letter": "A", "text": "Use the Read tool to sequentially load all 15 files, building complete understanding across the full caching implementation.", "correct": false, "explanation": "Loading 8,000 lines without structure floods the context and buries the invalidation logic in unrelated code."}, {"letter": "B", "text": "Analyze imports and class hierarchies to identify the base cache class, Read that file to understand the interface, then trace specific invalidation implementations.", "correct": true, "explanation": "Correct. Start from the architectural root (the interface), then navigate only the specific implementations that matter for invalidation — focused reading, low context cost."}, {"letter": "C", "text": "Use Grep to search for \"invalidate\" and \"expire\" patterns across all files, then Read only those specific line ranges with minimal surrounding context.", "correct": false, "explanation": "Keyword-only reading strips the class/method context that tells you what the inva d history length is under your control. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m42", "source": "mock", "domain": 5, "scenario": null, "situation": "A customer raises three separate issues during one session: a refund inquiry (turns 1-15), a subscription question (turns 16-30), and a payment method update (turns 31-45). At turn 48, the customer asks \"What happened with my refund?\" The conversation is approaching context limits.", "question": "What strategy best maintains the agent's ability to address all issues throughout the session?", "options": [{"letter": "A", "text": "Extract and persist structured issue data (order IDs, amounts, statuses) into a separate context layer.", "correct": false, "explanation": "A sidecar context layer adds engineering and doesn't naturally preserve the conversational narrative the customer expects."}, {"letter": "B", "text": "Rely on MCP tools to re-fetch relevant information on demand when the customer references earlier issues.", "correct": false, "explanation": "Re-fetching is fine for freshness, but it doesn't solve the context-length problem — and you lose what was said between the customer and the agent."}, {"letter": "C", "text": "Summarize earlier turns into a narrative description, preserving full message history only for the active issue.", "correct": true, "explanation": "Correct. Progressive summarization compresses stable resolved topics while keeping the active thread verbatim — the classic pattern for long multi-issue conversations near the context limit."}, {"letter": "D", "text": "Implement sliding window context that retains the most recent 30 turns.", "correct": false, "explanation": "A pure sliding window silently drops the refund issue (turns 1–15) from context, which is exactly what the customer is asking about. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m45", "source": "mock", "domain": 5, "scenario": null, "situ
