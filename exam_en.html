<style>
/* Ravn Brand System — dark canvas, white text, muted gray, single gold accent.
   Flat (no shadows/gradients), Work Sans + Source Code Pro. Functional red is
   kept only for wrong-answer / fail feedback; green marks correct answers;
   gold carries selection / emphasis. */
:root {
  --bg: #161616; --surface: #1d1d1d; --surface-2: #222222;
  --fg: #FFFFFF; --fg-soft: #D4D4D4; --muted: #ADB5BD; --subtle: #8B949E;
  --border: #2A2A2A; --border-strong: #3A3A3A;
  --gold: #B7986A; --gold-soft: rgba(183,152,106,0.12); --gold-fg: #161616;
  --bad: #C16B57; --bad-soft: rgba(193,107,87,0.14);
  --good: #6FA97C; --good-soft: rgba(111,169,124,0.14); --good-fg: #161616;
  --r-sm: 4px; --r-md: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.6; background: var(--bg); color: var(--fg);
  height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased; }

.ravn-topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
  justify-content: space-between; padding: 12px 32px; background: var(--bg); color: var(--fg);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ravn-brand { display: inline-flex; align-items: center; gap: 16px; color: var(--fg);
  text-decoration: none; font-weight: 600; }
.ravn-brand:hover { color: var(--gold); }
.ravn-brand svg { height: 20px; width: auto; fill: currentColor; flex-shrink: 0; }
.ravn-brand-tagline { font-size: 12px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.167em; font-weight: 600; }

/* Mode toggle in the brand bar */
.mode-toggle { display: inline-flex; align-items: center; gap: 0; background: transparent;
  border: 1px solid var(--border-strong); border-radius: var(--r-md); overflow: hidden; }
.mode-toggle button { background: none; border: none; color: var(--muted); cursor: pointer;
  font-family: inherit; font-size: 11.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.1em; padding: 6px 14px; transition: background .15s, color .15s; }
.mode-toggle button.active { background: var(--gold); color: var(--gold-fg); }
.mode-hint { font-size: 11.5px; color: var(--subtle); margin-left: 12px; }
.mode-controls { display: flex; align-items: center; }
.length-toggle { margin-left: 10px; }
.new-draw-btn { margin-left: 10px; }
.new-draw-btn .dn-icon { margin-right: 5px; }

/* Rotation notice — the strip under the brand bar and the summary callout both
   say the same thing: every attempt is a fresh random draw from the bank. */
.draw-note { padding: 8px 32px; background: var(--surface); color: var(--muted);
  font-size: 12.5px; line-height: 1.5; border-bottom: 1px solid var(--border);
  flex-shrink: 0; }
.dn-icon { color: var(--gold); font-weight: 700; margin-right: 7px; }
.rotate-note { margin-top: 26px; padding: 14px 18px; background: var(--gold-soft);
  border: 1px solid var(--gold); border-radius: var(--r-md); font-size: 13.5px;
  color: var(--fg-soft); line-height: 1.6; }

.shell { display: flex; flex: 1; min-height: 0; overflow: hidden; }

.sidebar { width: 272px; min-width: 272px; background: var(--surface); color: var(--muted);
  display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  border-right: 1px solid var(--border); }
.sidebar-header { padding: 18px 16px 12px; font-size: 11.5px; font-weight: 600;
  letter-spacing: .167em; text-transform: uppercase; color: var(--gold);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-progress { padding: 10px 16px; font-size: 12px; color: var(--muted);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-progress span { color: var(--fg); font-weight: 600; }
.sidebar-scroll { overflow-y: auto; flex: 1; padding: 8px 0; }
.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

.domain-group { margin-bottom: 6px; }
.domain-label { padding: 8px 16px 5px; font-size: 10px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; gap: 8px; }
.domain-label .dl-weight { color: var(--subtle); font-weight: 600; }
.q-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 16px;
  background: none; border: none; cursor: pointer; font-size: 13.5px; color: var(--muted);
  font-family: inherit; text-align: left; transition: background .15s, color .15s;
  border-left: 3px solid transparent; }
.q-btn:hover { background: var(--surface-2); color: var(--fg); }
.q-btn.active { background: var(--gold-soft); color: var(--gold); border-left-color: var(--gold); }
.q-btn.answered .q-dot { background: var(--gold); }
.q-btn.answered-correct { color: var(--good); }
.q-btn.answered-correct .q-dot { background: var(--good); }
.q-btn.answered-wrong { color: var(--bad); }
.q-btn.answered-wrong .q-dot { background: var(--bad); }
.q-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--subtle);
  flex-shrink: 0; transition: background .2s; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; min-width: 0; }
.topbar { background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 32px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-title { font-size: 15px; font-weight: 600; color: var(--fg); }
.topbar-nav { display: flex; gap: 10px; align-items: center; }
.nav-btn { padding: 8px 18px; border-radius: var(--r-md); border: 1px solid var(--border-strong);
  background: transparent; font-family: inherit; font-size: 12px; cursor: pointer; color: var(--muted);
  font-weight: 600; text-transform: uppercase; letter-spacing: .1em; transition: all .15s; }
.nav-btn:hover { color: var(--fg); border-color: var(--gold); }
.nav-btn:disabled { opacity: .35; cursor: default; }
.nav-btn.finish { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.nav-btn.finish:hover { background: var(--gold); border-color: var(--gold); color: var(--gold-fg); }
.q-counter { font-size: 13px; color: var(--muted); font-weight: 500; }

.content { flex: 1; overflow-y: auto; padding: 36px 48px; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.q-card { max-width: 820px; margin: 0 auto; }
.q-domain { display: inline-block; background: transparent; color: var(--fg); font-size: 11px;
  font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 4px 11px;
  border: 1px solid var(--border-strong); border-radius: var(--r-sm); margin-bottom: 8px; }
.q-scenario { display: inline-block; background: transparent; color: var(--gold); font-size: 11px;
  font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 4px 11px;
  border: 1px solid var(--gold); border-radius: var(--r-sm); margin-bottom: 16px; margin-left: 8px; }
.q-number { font-size: 11px; color: var(--subtle); margin-bottom: 6px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; }
.q-situation { font-size: 16.5px; color: var(--fg-soft); font-weight: 400; line-height: 1.7;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 16px 20px; margin-bottom: 22px; }
.q-situation code, .opt-text code, .explanation code, .opt-expl code {
  background: var(--surface-2); padding: 1px 5px; border-radius: var(--r-sm);
  font-family: "Source Code Pro", ui-monospace, Menlo, Monaco, monospace; font-size: 13.5px; color: var(--gold); }
.q-prompt { font-size: 17px; font-weight: 700; color: var(--fg); margin-bottom: 20px; }

.q-select { display: inline-block; background: var(--gold-soft); color: var(--gold); font-size: 11.5px;
  font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 12px;
  border-radius: var(--r-sm); margin-bottom: 16px; }
.q-select-hint { font-size: 12.5px; color: var(--subtle); margin: -8px 0 16px; }
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.option { border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface);
  transition: border-color .15s, background .15s; overflow: hidden; }
.option-head { display: flex; align-items: flex-start; gap: 14px; width: 100%; padding: 14px 18px;
  border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.option-head:focus-visible { outline: 2px solid var(--gold); outline-offset: -3px; }
.option:hover:not(.locked):not(.dimmed) .option-head { background: var(--surface-2); }
.option:hover:not(.locked):not(.dimmed) { border-color: var(--gold); }
.option.locked .option-head, .option-head[aria-disabled="true"] { cursor: default; }
.option.locked .option-head:disabled { opacity: 1; }
.option.selected { border-color: var(--gold); }
.opt-letter { width: 30px; height: 30px; min-width: 30px; border-radius: 50%; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  color: var(--muted); transition: background .2s, color .2s; flex-shrink: 0; }
.option.selected .opt-letter { background: var(--gold); color: var(--gold-fg); }
.opt-text { font-size: 15px; color: var(--fg-soft); line-height: 1.55; padding-top: 3px; }
.option.correct { border-color: var(--good); background: var(--good-soft); }
.option.correct .opt-letter { background: var(--good); color: var(--good-fg); }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.wrong .opt-letter { background: var(--bad); color: #fff; }
.option.dimmed { opacity: .5; }
.opt-expl { display: none; font-size: 13.5px; line-height: 1.6; color: var(--muted);
  padding: 0 18px 14px 62px; }
.option.locked .opt-expl.show { display: block; }
.option.correct .opt-expl { color: var(--good); }
.option.wrong .opt-expl { color: var(--bad); }

.explanation { margin-top: 4px; padding: 14px 18px; background: var(--surface);
  border-left: 3px solid var(--gold); border-radius: 0 var(--r-md) var(--r-md) 0; font-size: 14.5px;
  color: var(--muted); line-height: 1.65; display: none; }
.explanation.show { display: block; }
.explanation strong { color: var(--gold); }

.summary { max-width: 860px; margin: 0 auto; display: none; }
.summary.show { display: block; }
.summary h1 { font-size: 26px; font-weight: 800; color: var(--fg); margin-bottom: 6px; }
.summary-subtitle { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
.verdict { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; padding: 7px 18px; border-radius: var(--r-sm); margin-bottom: 22px; }
.verdict.pass { background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold); }
.verdict.fail { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.score-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 14px; }
.score-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 20px; text-align: center; }
.score-card .big { font-size: 38px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
.score-card .label { font-size: 11px; color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .12em; }
.score-card.total .big { color: var(--fg); }
.score-card.correct-c .big { color: var(--good); }
.score-card.wrong-c .big { color: var(--bad); }
.threshold-note { font-size: 12.5px; color: var(--subtle); margin-bottom: 26px; }

.domain-scores { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 8px 20px; margin-bottom: 26px; }
.ds-row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.ds-row:last-child { border-bottom: none; }
.ds-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--fg); }
.ds-name small { color: var(--subtle); font-weight: 500; }
.ds-bar { width: 160px; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.ds-bar > div { height: 100%; background: var(--gold); }
.ds-bar > div.low { background: var(--muted); }
.ds-bar > div.bad { background: var(--bad); }
.ds-pct { width: 92px; text-align: right; font-size: 13px; color: var(--muted); font-weight: 600; }

.section-title { font-size: 18px; font-weight: 700; color: var(--fg); margin-bottom: 12px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.group-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 18px 20px; margin-bottom: 16px; }
.group-title { font-size: 15px; font-weight: 700; color: var(--fg); margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px; }
.group-badge { font-size: 10px; padding: 3px 10px; border-radius: var(--r-sm); font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; background: var(--bad-soft); color: var(--bad); }
.wrong-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0;
  border-bottom: 1px solid var(--border); font-size: 14px; color: var(--muted); }
.wrong-item:last-child { border-bottom: none; }
.wrong-item .wi-n { min-width: 36px; font-weight: 700; color: var(--subtle); font-size: 12px; padding-top: 2px; }
.wrong-item .wi-q { flex: 1; }
.wrong-item .wi-situation { font-size: 13.5px; color: var(--fg-soft); font-weight: 500; margin-bottom: 4px; line-height: 1.5; }
.wrong-item .wi-prompt { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 4px; }
.wrong-item .wi-ans { font-size: 12.5px; margin-top: 3px; color: var(--muted); }
.wi-wrong-tag { color: var(--bad); font-weight: 700; }
.wi-correct-tag { color: var(--good); font-weight: 700; }
.wi-expl { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: var(--r-sm);
  padding: 8px 10px; margin-top: 6px; line-height: 1.55; }

.restart-btn { margin-top: 28px; padding: 12px 32px; background: var(--fg); color: var(--bg);
  border: none; border-radius: var(--r-md); font-family: inherit; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em; cursor: pointer; transition: background .15s, color .15s; }
.restart-btn:hover { background: var(--gold); color: var(--gold-fg); }
.screen { display: none; }
.screen.active { display: block; }

@media (max-width: 760px) {
  html, body { height: auto; }
  body { min-height: 100vh; height: auto; overflow: auto; display: block; }
  .ravn-topbar { position: static; padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
  .draw-note { padding: 8px 16px; }
  .ravn-brand-tagline { display: none; }
  .mode-controls { max-width: 100%; flex-wrap: wrap; gap: 6px 0; }
  .mode-hint { margin-left: 8px; }
  /* Phone order: question first. The navigator and the page title used to
     push the question ~590px down an 844px screen. */
  .shell { display: flex; flex-direction: column; overflow: visible; }
  .main { order: 1; display: flex; flex-direction: column; overflow: visible; }
  .sidebar { order: 2; width: 100%; min-width: 0; height: auto; max-height: 260px;
    min-height: 0; border-right: 0; border-top: 1px solid var(--border);
    border-bottom: 0; }
  .content { order: 1; overflow: visible; padding: 20px 16px 16px; }
  .topbar { order: 2; padding: 12px 16px; gap: 10px; flex-wrap: wrap;
    border-top: 1px solid var(--border); border-bottom: 0;
    position: sticky; bottom: 0; background: var(--surface); z-index: 5; }
  .topbar-title { display: none; }
  .topbar-nav { width: 100%; flex-wrap: nowrap; gap: 8px; }
  .topbar-nav .nav-btn { flex: 1; text-align: center; }
  .q-scenario { display: block; width: fit-content; margin-left: 0; }
  .score-grid { grid-template-columns: 1fr; }
  .ds-row { flex-wrap: wrap; }
  .ds-name { flex-basis: 100%; }
  .ds-bar { flex: 1; min-width: 140px; }
}

@media (max-width: 420px) {
  .mode-hint { width: 100%; margin-left: 0; order: 99; }
  .mode-toggle button { padding: 6px 9px; font-size: 0.72rem; }
  .nav-btn { padding: 8px 10px; }
  /* Keep the control strip on two tidy rows instead of orphaning New set. */
  .mode-controls { gap: 6px; justify-content: flex-start; }

<script>
const QUESTIONS = [{"id": "g1", "source": "guide", "domain": 1, "scenario": "Multi-agent Research System", "situation": "A document analysis agent discovers that two credible sources contain directly contradictory statistics for a key metric: a government report states 40% growth, while an industry analysis states 12%. Both sources look credible, and the discrepancy could materially affect the research conclusions. How should the document analysis agent handle this situation most effectively?", "question": "Which approach is most effective?", "options": [{"letter": "A", "text": "Apply credibility heuristics to pick the most likely correct number, finish analysis with that value, and add a footnote mentioning the discrepancy.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Include both numbers in the analysis output without marking them as conflicting, letting the synthesis agent decide which to use based on broader context.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Stop analysis and immediately escalate to the coordinator, asking it to decide which source is more authoritative before continuing.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Complete analysis with both numbers, explicitly annotate the conflict with source attribution, and let the coordinator decide how to reconcile the data before passing to synthesis.", "correct": true, "explanation": "This approach preserves separation of responsibilities: the analysis agent completes its core work without blocking, preserves both conflicting values with clear attribution, and correctly passes reconciliation to the coordinator, which has broader context."}], "correct": "D"}, {"id": "g2", "source": "guide", "domain": 1, "scenario": "Multi-agent Research System", "situation": "The web-search and document-analysis agents have completed their tasks and returned results to the coordinator. What is the next step for creating an integrated research report?", "question": "Which next step is most appropriate?", "options": [{"letter": "A", "text": "Each agent sends its results directly to the report-writing agent, bypassing the coordinator.", "correct": false, "explanation": ""}, {"letter": "B", "text": "The document analysis agent requests web-search results and merges them internally.", "correct": false, "explanation": ""}, {"letter": "C", "text": "The coordinator passes both sets of results to the synthesis agent for a unified integration.", "correct": true, "explanation": "In a coordinator–subagent architecture, the coordinator forwards both result sets to the synthesis agent for centralized integration, preserving control and ensuring high-quality merging."}, {"letter": "D", "text": "The coordinator concatenates the raw outputs from both agents and returns them as the final result.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g3", "source": "guide", "domain": 1, "scenario": "Multi-agent Research System", "situation": "A document analysis subagent frequently fails when processing PDF files: some have corrupted sections that trigger parsing exceptions, others are password-protected, and sometimes the parsing library hangs on large files. Currently, any exception immediately terminates the subagent and returns an error to the coordinator, which must decide whether to retry, skip, or fail the whole task. This causes excessive coordinator involvement in routine error handling. What architectural improvement is most effective?", "question": "Which improvement is most effective?", "options": [{"letter": "A", "text": "Create a dedicated error-handling agent that monitors all failures via a shared queue and decides recovery actions, sending restart commands directly to subagents.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Configure the subagent to always return partial results with a success status, embedding error details in metadata; the coordinator treats all responses as successful.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Make the coordinator validate all documents before sending them to the subagent, rejecting documents that might cause failures.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Implement local recovery in the subagent for transient failures and escalate to the coordinator only errors it cannot resolve, including attempted steps and partial results.", "correct": true, "explanation": "Handle errors at the lowest level capable of resolving them. Local recovery reduces coordinator workload while still escalating truly unrecoverable issues with full context and partial progress."}], "correct": "D"}, {"id": "g4", "source": "guide", "domain": 1, "scenario": "Multi-agent Research System", "situation": "After running the system on “AI impact on creative industries,” you observe that every subagent completes successfully: the web-search agent finds relevant articles, the document analysis agent summarizes them correctly, and the synthesis agent produces coherent text. However, final reports cover only visual art and completely miss music, literature, and film. In the coordinator logs, you see it decomposed the topic into three subtasks: “AI in digital art,” “AI in graphic design,” and “AI in photography.” What is the most likely root cause?", "question": "What is the most likely root cause?", "options": [{"letter": "A", "text": "The synthesis agent lacks instructions to detect coverage gaps.", "correct": false, "explanation": ""}, {"letter": "B", "text": "The document analysis agent filters out non-visual sources due to overly strict relevance criteria.", "correct": false, "explanation": ""}, {"letter": "C", "text": "The coordinator’s task decomposition is too narrow, assigning subagents work that does not cover all relevant areas.", "correct": true, "explanation": "The coordinator decomposed a broad topic only into visual-art subtasks, missing music, literature, and film entirely. Since subagents executed their assignments correctly, the narrow decomposition is the obvious root cause."}, {"letter": "D", "text": "The web-search agent’s queries are insufficient and should be broadened to cover more sectors.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g5", "source": "guide", "domain": 1, "scenario": "Multi-agent Research System", "situation": "The web-search subagent returns results for only 3 of 5 requested source categories (competitor sites and industry reports succeed, but news archives and social feeds time out). The document analysis subagent successfully processes all provided documents. The synthesis subagent must produce a summary from mixed-quality upstream inputs. Which error-propagation strategy is most effective?", "question": "Which error-propagation strategy is most effective?", "options": [{"letter": "A", "text": "Continue synthesis using only successful sources and produce an output without mentioning which data was unavailable.", "correct": false, "explanation": ""}, {"letter": "B", "text": "The synthesis subagent returns an error to the coordinator, triggering a full retry or task failure due to incomplete data.", "correct": false, "explanation": ""}, {"letter": "C", "text": "The synthesis subagent asks the coordinator to retry timed-out sources with a longer timeout before starting synthesis.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Structure the synthesis output with coverage annotations that indicate which conclusions are well-supported and where gaps exist due to unavailable sources.", "correct": true, "explanation": "Coverage annotations implement graceful degradation with transparency, preserving value from completed work while propagating uncertainty to enable informed decisions about confidence."}], "correct": "D"}, {"id": "g6", "source": "guide", "domain": 1, "scenario": "Multi-agent Research System", "situation": "The document analysis subagent encounters a corrupted PDF file that it cannot parse. When designing the system’s error handling, what is the most effective way to handle this failure?", "question": "Which approach is most effective?", "options": [{"letter": "A", "text": "Return an error with context to the coordinator agent, allowing it to decide how to proceed.", "correct": true, "explanation": "Returning an error with context to the coordinator is the most effective approach because it lets the coordinator make an informed decision—skip the file, try an alternative parsing method, or notify the user—while maintaining visibility into the failure."}, {"letter": "B", "text": "Silently skip the corrupted document and continue processing the remaining files to avoid interrupting the workflow.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Automatically retry parsing the document three times with exponential backoff before reporting a failure.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Throw an exception that terminates the entire research workflow.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g8", "source": "guide", "domain": 1, "scenario": "Multi-agent Research System", "situation": "A colleague proposes that the document analysis agent should send its results directly to the synthesis agent, bypassing the coordinator. What is the main advantage of keeping the coordinator as the central hub for all communication between subagents?", "question": "What is the main advantage of keeping the coordinator as the central hub?", "options": [{"letter": "A", "text": "The coordinator can observe all interactions, handle errors uniformly, and decide what information each subagent should receive.", "correct": true, "explanation": "The coordinator pattern provides centralized visibility into all interactions, uniform error handling across the system, and fine-grained control over what information each subagent receives—these are the primary advantages of a star-shaped communication topology."}, {"letter": "B", "text": "The coordinator batches multiple requests to subagents, reducing total API calls and overall latency.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Routing through the coordinator enables automatic retry logic that direct inter-agent calls cannot support.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Subagents use isolated memory, and direct communication would require complex serialization that only the coordinator can perform.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g9", "source": "guide", "domain": 1, "scenario": "Multi-agent Research System", "situation": "The web-search subagent times out while researching a complex topic. You need to design how information about this failure is returned to the coordinator. Which error-propagation approach best enables intelligent recovery?", "question": "Which error-propagation approach best enables intelligent recovery?", "options": [{"letter": "A", "text": "Return structured error context to the coordinator including the failure type, the query executed, any partial results, and potential alternative approaches.", "correct": true, "explanation": "Returning structured error context—including failure type, executed query, partial results, and alternative approaches—gives the coordinator everything needed to make intelligent recovery decisions (e.g., retry with a modified query or continue with partial results). It preserves maximum context for informed coordination-level decision-making."}, {"letter": "B", "text": "Catch the timeout within the subagent and return an empty result set marked as successful.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Implement automatic exponential-backoff retries inside the subagent, only returning a generic “search unavailable” status after exhausting retries.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Propagate the timeout exception directly to the top-level handler, terminating the entire research workflow.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "g11", "source": "guide", "domain": 1, "scenario": "Multi-agent Research System", "situation": "While researching a broad topic, you observe that the web-search agent and the document analysis agent investigate the same subtopics, leading to substantial duplication in their outputs. Token usage nearly doubles without a proportional increase in research breadth or depth. What is the most effective way to address this?", "question": "What is the most effective way to address this?", "options": [{"letter": "A", "text": "Allow both agents to finish in parallel, then have the coordinator deduplicate overlapping results before passing them to the synthesis agent.", "correct": false, "explanation": ""}, {"letter": "B", "text": "The coordinator explicitly partitions the research space before delegating, assigning each agent distinct subtopics or source types.", "correct": true, "explanation": "Having the coordinator explicitly partition the research space before delegating is most effective because it addresses the root cause—unclear task boundaries—before any work begins. It preserves parallelism while preventing duplicated effort and wasted tokens."}, {"letter": "C", "text": "Implement a shared-state mechanism where agents log their current focus area so other agents can dynamically avoid duplication during execution.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Switch to sequential execution where document analysis runs only after web search completes, using web-search results as context to avoid duplication.", "correct": false, "explanation": ""}], "correct": "B"}, {"id": "g12", "source": "guide", "domain": 1, "scenario": "Multi-agent Research System", "situation": "During research, the web-search subagent queries three source categories with different outcomes: academic databases return 15 relevant papers, industry reports return “0 results,” and patent databases return “Connection timeout.” When designing error propagation to the coordinator, which approach enables the best recovery decisions?", "question": "Which approach enables the best recovery decisions?", "options": [{"letter": "A", "text": "Aggregate the results into a single success-percentage metric (e.g., “67% source coverage”) with detailed logs available on demand.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Report both “timeout” and “0 results” as failures requiring coordinator intervention.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Retry transient failures internally and report only persistent errors.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Distinguish access failures (timeout) that require a retry decision from valid empty results (“0 results”) that represent successful queries.", "correct": true, "explanation": "A timeout (access failure) and “0 results” (valid empty result) are semantically different outcomes requiring different responses. Distinguishing them allows the coordinator to retry the patent database while accepting the industry reports “0 results” as a valid, informative finding."}], "correct": "D"}, {"id": "g47", "source": "guide", "domain": 1, "scenario": "Customer Support Agent", "situation": "Your agent handles single-issue requests with 94% accuracy (e.g., “I need a refund for order #1234”). But when customers include multiple issues in one message (e.g., “I need a refund for order #1234 and also want to update the shipping address for order #5678”), tool selection accuracy drops to 58%. The agent usually solves only one issue or mixes parameters across requests. What approach most effectively improves reliability for multi-issue requests?", "question": "What approach is most effective?", "options": [{"letter": "A", "text": "Implement a preprocessing layer that uses a separate model call to decompose multi-issue messages into separate requests, handle each independently, and merge results.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Combine related tools into fewer universal tools.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Add few-shot examples to the prompt demonstrating correct reasoning and tool sequencing for multi-issue requests.", "correct": true, "explanation": "Few-shot examples that demonstrate correct reasoning and tool sequencing for multi-issue requests are most effective because the agent already performs well on single issues—what it needs is guidance on the pattern for decomposing and routing multiple issues and keeping parameters separated."}, {"letter": "D", "text": "Implement response validation that detects incomplete answers and automatically reprompts the agent to resolve missed issues.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g48", "source": "guide", "domain": 1, "scenario": "Customer Support Agent", "situation": "Production logs show that for simple requests like “refund for order #1234,” your agent resolves the issue in 3–4 tool calls with 91% success. But for complex requests like “I was billed twice, my discount didn’t apply, and I want to cancel,” the agent averages 12+ tool calls with only 54% success—often investigating issues sequentially and fetching redundant customer data for each. What change most effectively improves handling of complex requests?", "question": "What change is most effective?", "options": [{"letter": "A", "text": "Add explicit verification checkpoints between stages, requiring the agent to record progress after resolving each issue before moving to the next.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Reduce the number of tools by combining `get_customer`, `lookup_order`, and billing-related tools into a single `investigate_issue` tool.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Decompose the request into separate issues, then investigate each in parallel using shared customer context before synthesizing a final resolution.", "correct": true, "explanation": "Decomposing into separate issues and investigating in parallel with shared customer context fixes both key problems: it eliminates redundant data retrieval by reusing shared context across issues and reduces total tool-call loops by parallelizing investigation before synthesizing a single resolution."}, {"letter": "D", "text": "Add few-shot examples to the system prompt demonstrating ideal tool-call sequences for various multi-faceted billing scenarios.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g50", "source": "guide", "domain": 1, "scenario": "Customer Support Agent", "situation": "After calling `get_customer` and `lookup_order`, the agent has all available system data but still faces uncertainty. Which situation is the most justified trigger for calling `escalate_to_human`?", "question": "Which situation is most justified for escalation?", "options": [{"letter": "A", "text": "A customer wants to cancel an order shipped yesterday and arriving tomorrow. The agent should escalate because the customer might change their mind after receiving the package.", "correct": false, "explanation": ""}, {"letter": "B", "text": "A customer claims they didn’t receive an order, but tracking shows it was delivered and signed for at their address three days ago. The agent should escalate because presenting contradictory evidence could harm the customer relationship.", "correct": false, "explanation": ""}, {"letter": "C", "text": "A customer requests competitor price matching. Your policies allow price adjustments for price drops on your own site within 14 days, but say nothing about competitor prices. The agent should escalate for policy interpretation.", "correct": true, "explanation": "This is a genuine policy gap: company rules cover price drops on your own site but do not address competitor price matching. The agent must not invent policy and should escalate for human judgment on how to interpret or extend existing rules."}, {"letter": "D", "text": "A customer message contains both a billing question and a product return. The agent should escalate so a human can coordinate both issues in one interaction.", "correct": false, "explanation": ""}], "correct": "C"}, {"id": "g53", "source": "guide", "domain": 1, "scenario": "Customer Support Agent", "situation": "Production metrics show your agent averages 4+ API loops per resolution. Analysis reveals Claude often requests `get_customer` and `lookup_order` in separate sequential turns even when both are needed initially. What is the most effective way to reduce the number of loops?", "question": "What is the most effective way to reduce loops?", "options": [{"letter": "A", "text": "Implement speculative execution that automatically calls likely-needed tools in parallel with any requested tool and returns all results regardless of what was requested.", "correct": false, "explanation": ""}, {"letter": "B", "text": "Increase `max_tokens` to give Claude more room to plan and naturally combine tool requests.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Create composite tools like `get_customer_with_orders` that bundle common lookup combinations into single calls.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Instruct Claude in the prompt to bundle tool requests into one turn and return all results together before the next API call.", "correct": true, "explanation": "Prompting Claude to bundle related tool requests into a single turn leverages its native ability to request multiple tools at once. It directly fixes the sequential-call pattern with minimal architectural change."}], "correct": "D"}, {"id": "g58", "source": "guide", "domain": 1, "scenario": "Customer Support Agent", "situation": "You are implementing the agent loop for your support agent. After each Claude API call, you must decide whether to continue the loop (run requested tools and call Claude again) or stop (present the final answer to the customer). What determines this decision?", "question": "What determines this decision?", "options": [{"letter": "A", "text": "Check the `stop_reason` field in Claude’s response—continue if it is `tool_use` and stop if it is `end_turn`.", "correct": true, "explanation": "`stop_reason` is Claude’s explicit structured signal for loop control: `tool_use` indicates Claude wants to run a tool and receive results back, while `end_turn` indicates Claude has completed its response and the loop should end."}, {"letter": "B", "text": "Parse Claude’s text for phrases like “I’m done” or “Can I help with anything else?”—natural language signals indicate task completion.", "correct": false, "explanation": ""}, {"letter": "C", "text": "Set a maximum iteration count (e.g., 10 calls) and stop when reached, regardless of whether Claude indicates more work is needed.", "correct": false, "explanation": ""}, {"letter": "D", "text": "Check whether the response contains assistant text content—if Claude generated explanatory text, the loop should terminate.", "correct": false, "explanation": ""}], "correct": "A"}, {"id": "m1", "source": "mock", "domain": 1, "scenario": null, "situation": "Your multi-agent research pipeline crashed after processing 12 of 28 documents. The web search agent had identified relevant sources, the document analysis agent had partially completed extraction, and the synthesizer had begun pattern identification. You need to resume processing without repeating work or losing fidelity of prior findings.", "question": "What state management approach best balances information fidelity with context efficiency when restoring agent state?", "options": [{"letter": "A", "text": "Have each agent maintain its own persistent state file and reload it independently at the start of each session.", "correct": false, "explanation": "Fragmented per-agent state breaks coordinator visibility and makes cross-agent reasoning brittle. Each agent reloading unrelated internal state also bloats their context with noise they don't need."}, {"letter": "B", "text": "Persist the coordinator's conversation log containing all task delegations and responses, providing this to agents when resuming.", "correct": false, "explanation": "A full conversation log is the highest-fidelity but least context-efficient option. You'd replay everything into each subagent and blow past context budgets."}, {"letter": "C", "text": "Have each agent persist a structured report to a known location. On resume, the coordinator loads the reports and injects relevant state into agent prompts.", "correct": true, "explanation": "Correct. Structured per-agent reports keep fidelity (the findings, with schema), let the coordinator stay in charge of orchestration, and keep each subagent's context focused. This is the orchestrator + compact artifact pattern."}, {"letter": "D", "text": "Index all agent outputs in a shared vector store. When resuming, each agent queries the store using semantic search to retrieve relevant prior findings.", "correct": false, "explanation": "Semantic retrieval over agent outputs is overkill for resuming a crashed pipeline — it adds a retrieval failure mode and can miss precise state that a structured report preserves exactly. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m2", "source": "mock", "domain": 1, "scenario": null, "situation": "After the web search agent finds 25 sources (120K tokens of raw content), the document analysis agent extracts key insights (15K tokens), and the synthesis agent produces a coherent narrative draft (3K tokens), the coordinator must pass context to the report generation agent for the final output with proper source citations.", "question": "What context-passing strategy provides the best balance of completeness and efficiency?", "options": [{"letter": "A", "text": "Pass only the synthesis draft and have a separate post-processing pipeline match claims to sources and insert citations after the report is generated.", "correct": false, "explanation": "Post-hoc matching is fragile — without the mapping the model used, you can't reliably bind claims to the right source. Hallucinated or misattributed citations are the usual failure mode."}, {"letter": "B", "text": "Pass the synthesis draft along with a structured source index that maps key claims to their source URLs and relevant excerpts.", "correct": true, "explanation": "Correct. The synthesis gives the narrative; the source index gives the report generator exactly the binding it needs to cite without re-reading 120K tokens of raw content."}, {"letter": "C", "text": "Pass a condensed summary of all prior stages that preserves the main findings and attributes them to sources by name only.", "correct": false, "explanation": "Name-only attribution loses URLs and excerpts, so the report generator can't quote or verify — and 'by name only' tends to drift into vague citations."}, {"letter": "D", "text": "Pass the full accumulated context from all prior agents.", "correct": false, "explanation": "Maximum completeness but wasteful — 120K+ tokens of raw search content is mostly irrelevant noise at the report-generation stage. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m4", "source": "mock", "domain": 1, "scenario": null, "situation": "The web search agent has gathered several relevant sources for a research topic. The document analysis agent now needs to examine these sources.", "question": "How does information typically flow between these two specialized subagents?", "options": [{"letter": "A", "text": "The agents communicate through an event-driven message queue, with the document analysis agent subscribing to web search completion events.", "correct": false, "explanation": "Event buses aren't part of the Claude subagent model. Subagents don't publish/subscribe to each other directly."}, {"letter": "B", "text": "The web search agent directly invokes the document analysis agent, passing the discovered sources as parameters.", "correct": false, "explanation": "Subagents are isolated — they can't directly call sibling subagents. That would also tightly couple them and defeat the orchestrator pattern."}, {"letter": "C", "text": "The coordinator agent receives the web search agent's output and includes relevant findings in the prompt when invoking the document analysis agent.", "correct": true, "explanation": "Correct. In an orchestrator-worker pattern the coordinator is the hub. It collects each subagent's output and explicitly forwards the relevant parts into the next subagent's prompt."}, {"letter": "D", "text": "Both agents access a shared memory store where the web search agent writes findings and the document analysis agent reads them.", "correct": false, "explanation": "A shared store can be layered in as an optimization, but it's not how subagents typically communicate — and it introduces stale-read and consistency problems. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m5", "source": "mock", "domain": 1, "scenario": null, "situation": "In production, you observe that simple fact-checking queries (e.g., \"What year was the Paris Climate Agreement signed?\") traverse all four subagents sequentially, consuming 40+ seconds and significant tokens per query. Complex comparative research benefits from the full pipeline. Your query distribution is diverse and evolving as users discover new applications.", "question": "What's the most effective approach to optimize for varying query complexity?", "options": [{"letter": "A", "text": "Implement pattern-based routing that categorizes queries by structure (single-fact vs. comparative vs. analytical) and maps each category to a predefined subagent combination.", "correct": false, "explanation": "Pattern routing calcifies as the query distribution evolves — new intents break the patterns and silently land on the wrong pipeline."}, {"letter": "B", "text": "Create a fast-path for factual questions that bypasses subagents entirely, routing all other queries through the complete pipeline to ensure research thoroughness.", "correct": false, "explanation": "A binary fast-path fixes the worst case but wastes the full pipeline on every moderately complex query that could have used a subset."}, {"letter": "C", "text": "Have the coordinator analyze each query and dynamically decide which subagents to invoke based on its assessment of query requirements.", "correct": true, "explanation": "Correct. Letting the coordinator LLM reason about each query and pick only the subagents it needs adapts naturally to an evolving, diverse query distribution — this is the strength of the orchestrator pattern."}, {"letter": "D", "text": "Train a query complexity classifier on labeled historical data to predict optimal subagent combinations, retraining periodically as query patterns evolve.", "correct": false, "explanation": "A trained classifier needs labels, retraining, and drift monitoring. That's over-engineered when the coordinator can make the same call at runtime from the query itself. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m6", "source": "mock", "domain": 1, "scenario": null, "situation": "When researching \"renewable energy adoption,\" the web search agent returns recent statistics (2024: 35% adoption) while the document analysis agent extracts data from internal reports (2022: 18% adoption). The synthesis agent incorrectly flags these as contradictory sources rather than recognizing the data shows growth over time.", "question": "What change would best enable the synthesis agent to correctly interpret such temporal differences?", "options": [{"letter": "A", "text": "Require subagents to include publication or data collection dates in their structured outputs.", "correct": true, "explanation": "Correct. The synthesis agent misreads the data because it never sees the dates. Making each data point carry its own timestamp in the structured output lets synthesis reason about trends instead of contradictions."}, {"letter": "B", "text": "Add a conflict resolution agent that automatically discards older data when newer data exists for the same metric.", "correct": false, "explanation": "Silently discarding older data destroys trend information — the very thing the question is asking about."}, {"letter": "C", "text": "Configure the web search agent to only return results from the past 6 months.", "correct": false, "explanation": "Shrinking the window throws away historical context and doesn't fix the architectural gap that metadata isn't being passed to synthesis."}, {"letter": "D", "text": "Instruct the synthesis agent to always treat the most recent data as authoritative and place older findings in a separate historical appendix.", "correct": false, "explanation": "Prompt instructions alone are unreliable and still hide temporal reasoning behind a rule. Structuring the data with dates is the systematic fix. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m7", "source": "mock", "domain": 1, "scenario": null, "situation": "The synthesis agent receives summarized findings from the web search and document analysis agents, then passes a consolidated summary to the report generator. During testing, you discover the generated reports make factual claims without proper citations—the report generator cannot attribute statements to their original sources because that metadata was lost during the summarization steps.", "question": "What's the most effective approach to ensure proper source attribution in the final reports?", "options": [{"letter": "A", "text": "Have each agent output structured data separating content summaries from source metadata (URLs, document names, page numbers).", "correct": true, "explanation": "Correct. Structured content + separate source metadata preserves the mapping end-to-end, so the report generator receives both what was said and where it came from."}, {"letter": "B", "text": "Have the report generator query the web search agent to re-locate sources for claims in the final report.", "correct": false, "explanation": "Re-querying is slow, lossy, and invites misattribution — the web search agent doesn't know which claim came from which source."}, {"letter": "C", "text": "Instruct the synthesis agent to embed source references inline within its summary text using a consistent citation format.", "correct": false, "explanation": "Inline citations in free text drift and get dropped during later summarization. Structured metadata survives transformations better."}, {"letter": "D", "text": "Skip summarization and pass full raw outputs from web search and document analysis directly to the report generator.", "correct": false, "explanation": "You'd blow the context budget and make the report generator's job harder. Summarization is useful; losing metadata during summarization is the actual bug. ════════════════════════════════════════════════════════════"}], "correct": "A"}, {"id": "m9", "source": "mock", "domain": 1, "scenario": null, "situation": "In production, final reports frequently contain claims without proper source attribution. Investigation shows that while the web search and document analysis agents correctly attach citations to their outputs, the synthesis agent loses track of which sources support which conclusions when combining findings.", "question": "What's the most effective architectural change?", "options": [{"letter": "A", "text": "Maintain complete transcripts of all subagent interactions and add a citation-resolution agent to analyze logs and determine attributions before report generation.", "correct": false, "explanation": "Post-hoc log analysis is fragile and expensive — and still loses bindings when synthesis merges points from multiple sources."}, {"letter": "B", "text": "Require all subagents to output structured claim-source mappings that the synthesis agent must preserve and merge when combining findings from multiple sources.", "correct": true, "explanation": "Correct. Explicit claim-source mappings are a first-class output the synthesis agent can merge deterministically — no attribution gets dropped during summarization."}, {"letter": "C", "text": "Add a verification step where the report generator uses semantic similarity matching against original sources to reconstruct which claims came from which documents.", "correct": false, "explanation": "Similarity search can attribute the wrong source when two sources say similar things. You want the model's original mapping, not a reconstruction."}, {"letter": "D", "text": "Have the coordinator inject source identifier prefixes into text before each handoff, then parse these prefixes at report generation to reconstruct citations.", "correct": false, "explanation": "Prefix tokens inside prose get dropped, paraphrased, or hallucinated. Structured mappings outside the prose are more robust. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m10", "source": "mock", "domain": 1, "scenario": null, "situation": "After the web search agent and document analysis agent complete their tasks, the coordinator invokes the synthesis agent. However, the synthesis agent responds that it cannot complete the task because no research findings were provided.", "question": "What is the most likely cause of this issue?", "options": [{"letter": "A", "text": "The synthesis agent's context window is not large enough to hold the combined outputs from both previous agents.", "correct": false, "explanation": "A context-window overflow typically surfaces as a truncation or API error, not as the agent saying 'no findings provided.'"}, {"letter": "B", "text": "The coordinator did not include the outputs from the previous agents in the synthesis agent's prompt.", "correct": true, "explanation": "Correct. Subagent invocations are isolated — nothing flows between them unless the coordinator explicitly puts it in the prompt. The message 'no findings provided' is exactly what you'd see."}, {"letter": "C", "text": "The subagents need to share a single API connection to enable automatic context sharing between invocations.", "correct": false, "explanation": "There's no 'automatic context sharing' over a shared connection. Context isolation is by design."}, {"letter": "D", "text": "The synthesis agent needs tools that can fetch results directly from the other agents' conversation histories.", "correct": false, "explanation": "Cross-agent history fetching isn't a standard capability and isn't the right fix — the coordinator should be forwarding findings explicitly. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m12", "source": "mock", "domain": 1, "scenario": null, "situation": "The coordinator provides detailed step-by-step instructions to the web search subagent, specifying exact search queries, source priorities, and date filters. Production monitoring reveals three issues: (1) the subagent reports \"insufficient results\" rather than trying alternative approaches when pre-specified searches fail, (2) research quality drops for emerging topics that don't match expected patterns, and (3) the subagent rarely surfaces valuable tangential sources.", "question": "What's the most effective way to improve subagent adaptability?", "options": [{"letter": "A", "text": "Remove procedural details entirely, delegating with simple goals like \"research X thoroughly\" and relying on the subagent's general capabilities.", "correct": false, "explanation": "Too far in the other direction — 'research X thoroughly' loses the guardrails (source quality, recency) that make delegation reliable."}, {"letter": "B", "text": "Add explicit fallback directives to the detailed instructions: \"If specified searches yield fewer than N results, attempt alternative query formulations before reporting failure.\"", "correct": false, "explanation": "Patches one failure mode but keeps the agent locked into procedural thinking — still brittle for emerging topics and tangential sources."}, {"letter": "C", "text": "Implement a topic classification step where the coordinator categorizes requests as \"well-defined\" or \"exploratory\" and uses different instruction styles for each category.", "correct": false, "explanation": "A classifier with two buckets is fragile, and you're still shipping rigid instructions in the well-defined branch."}, {"letter": "D", "text": "Specify research goals and quality criteria (coverage breadth, source diversity, recency) rather than procedural steps, letting the subagent determine its search strategy.", "correct": true, "explanation": "Correct. Delegate intent and quality bars, not procedures. The subagent can then choose queries, follow promising tangents, and recover from dead ends on its own. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m13", "source": "mock", "domain": 1, "scenario": null, "situation": "Production monitoring shows that follow-up queries like \"summarize what we learned about market trends\" consistently take 40+ seconds. Investigation reveals the coordinator spawns the synthesis subagent for each summarization request, passing 80K+ tokens of accumulated findings. The coordinator already has these findings in its context from orchestrating the research.", "question": "What's the most effective way to improve response time for these follow-up summaries?", "options": [{"letter": "A", "text": "Pre-generate and cache summaries at multiple granularities whenever new findings accumulate.", "correct": false, "explanation": "Speculative generation wastes tokens for summaries the user may never ask for, and cache granularities never quite match what's asked."}, {"letter": "B", "text": "Have the coordinator handle straightforward summarization requests directly using its existing context, reserving subagent spawning for complex analysis.", "correct": true, "explanation": "Correct. If the coordinator already has the findings, spawning a subagent to re-ingest 80K tokens is pure overhead. Let the coordinator answer simple follow-ups itself."}, {"letter": "C", "text": "Enable prompt caching on the synthesis subagent to reduce the overhead of repeatedly transferring the same research findings.", "correct": false, "explanation": "Prompt caching trims cost on the repeated prefix but the architectural waste — spawning an entire subagent for a summary — remains."}, {"letter": "D", "text": "Spawn the synthesis subagent with reduced context and have it request specific findings from the coordinator on-demand.", "correct": false, "explanation": "Adds round-trips and complexity for the same result the coordinator could produce directly. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m14", "source": "mock", "domain": 1, "scenario": null, "situation": "When analyzing complex legal cases that cite multiple precedents, the document analysis subagent processes each sequentially. A landmark case citing 12 precedents takes over 3 minutes to analyze completely.", "question": "What's the most effective way to reduce this latency while preserving the coordinator's ability to monitor and debug the system?", "options": [{"letter": "A", "text": "Implement a message queue where precedent analysis tasks are processed asynchronously by a pool of worker agents.", "correct": false, "explanation": "External queues complicate observability — the coordinator loses direct visibility into which tasks succeeded and what they produced."}, {"letter": "B", "text": "Create a recursive agent hierarchy where analysis agents subdivide work among child agents until reaching single-precedent granularity.", "correct": false, "explanation": "Recursion adds levels of indirection that make debugging and monitoring harder, for no real speedup beyond the first fan-out."}, {"letter": "C", "text": "Have the coordinator spawn parallel document analysis subagents, each handling a subset of precedents, then aggregate results before synthesis.", "correct": true, "explanation": "Correct. Coordinator-managed parallelism fans out the work, keeps each subagent's scope tight, and preserves a single hub for monitoring and aggregation."}, {"letter": "D", "text": "Enable the document analysis subagent to spawn its own specialized subagents dynamically when it encounters cases with many citations.", "correct": false, "explanation": "Nested spawning hides execution inside subagents and makes the coordinator's debug view incomplete. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m15", "source": "mock", "domain": 1, "scenario": null, "situation": "The coordinator agent has `AgentDefinitions` configured for all four specialized subagents, each with appropriate descriptions, prompts, and tool restrictions. During testing, you notice the coordinator correctly reasons about when to delegate—it generates messages like \"I'll ask the web search agent to find sources on this topic\"—but no subagent execution ever occurs. The coordinator then proceeds as if the delegation happened and continues with incomplete information. Logs show no errors.", "question": "What is the most likely cause?", "options": [{"letter": "A", "text": "The coordinator's `max_tokens` setting is too low, causing the Task tool invocation to be truncated before the subagent type parameter can be specified.", "correct": false, "explanation": "A truncation would show up in logs and usually leave partial `tool_use` blocks — not silent no-ops."}, {"letter": "B", "text": "The `AgentDefinitions` are configured correctly, but the coordinator's system prompt doesn't explicitly list the available subagent types, preventing the model from knowing they can be invoked.", "correct": false, "explanation": "Tool/agent schemas are surfaced to the model automatically — you don't need to re-list them in the system prompt for the model to see them."}, {"letter": "C", "text": "The coordinator's allowedTools configuration doesn't include \"Task\", so while it can reason about delegation, it cannot invoke the tool required to spawn subagents.", "correct": true, "explanation": "Correct. Without the Task tool in allowedTools, the coordinator can talk about delegating but has no way to actually call a subagent — which matches the 'reasons about it, no execution, no errors' symptom."}, {"letter": "D", "text": "Subagent context isolation means task descriptions from the coordinator don't automatically reach subagents; you need to configure explicit context forwarding in ClaudeAgentOptions.", "correct": false, "explanation": "Context isolation is real, but it affects what the subagent sees once spawned — not whether the coordinator can spawn it at all. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m21", "source": "mock", "domain": 1, "scenario": null, "situation": "Your codebase exploration tool stores session IDs to allow engineers to continue investigations across work sessions. An engineer spent an hour yesterday analyzing a legacy authentication module, building context about its architecture and dependencies. They want to continue today. The session ID is valid, but version control shows 3 of the 12 files the agent previously read were modified overnight by a teammate's merge.", "question": "What approach best balances efficiency and accuracy?", "options": [{"letter": "A", "text": "Resume the session without informing the agent about the changed files", "correct": false, "explanation": "Silent resume leaves the agent reasoning on stale content for 3 of 12 files — exactly the source of bad recommendations."}, {"letter": "B", "text": "Start a fresh session to ensure the agent works with current codebase state without stale assumptions", "correct": false, "explanation": "Throws away an hour of valid context about 9 files that didn't change."}, {"letter": "C", "text": "Resume the session and inform the agent which specific files changed for targeted re-analysis", "correct": true, "explanation": "Correct. Keeps the expensive context you already built, while telling the agent exactly which 3 files to re-read — minimum waste, maximum accuracy."}, {"letter": "D", "text": "Resume the session and immediately have the agent re-read all 12 previously analyzed files", "correct": false, "explanation": "Unnecessary for the 9 unchanged files. Just adds tokens without improving accuracy. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m22", "source": "mock", "domain": 1, "scenario": null, "situation": "An engineer used the agent yesterday to analyze a legacy authentication module, identifying two distinct refactoring approaches: extracting a microservice versus refactoring in-place. Today, they want to explore both approaches in depth—having the agent propose specific code changes for each—before deciding which to implement.", "question": "What's the most effective way to structure this exploration?", "options": [{"letter": "A", "text": "Resume yesterday's session to explore the first approach, then start a new session for the second, manually recreating the original context.", "correct": false, "explanation": "Manual recreation is error-prone and loses the exact working state of yesterday's analysis."}, {"letter": "B", "text": "Start two fresh sessions, manually providing a summary of yesterday's analysis findings to establish context.", "correct": false, "explanation": "Redoes work and risks the two sessions diverging from the same baseline you established yesterday."}, {"letter": "C", "text": "Resume yesterday's session and explore both approaches sequentially within the same conversation thread.", "correct": false, "explanation": "Sequential exploration in one thread lets each approach contaminate the other's context."}, {"letter": "D", "text": "Use `fork_session` to create two branches from yesterday's analysis, exploring one approach in each fork.", "correct": true, "explanation": "Correct. Forking from yesterday's session gives each approach its own independent context starting from the same analysis baseline — clean, parallel, no contamination. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m24", "source": "mock", "domain": 1, "scenario": null, "situation": "An engineer asks your agent to identify untested code paths in a legacy payment processing module spanning 45 files. After reading the first 8 source files, the agent's responses are becoming noticeably less accurate—it's forgetting previously discussed code patterns and hasn't yet located all test files or traced critical payment flows.", "question": "What's the most effective approach to complete this investigation?", "options": [{"letter": "A", "text": "Document all current findings in a summary report, clear context completely, then use that report as the sole reference for continuing the investigation.", "correct": false, "explanation": "A single report becomes the only source of truth and tends to compress away the specific code patterns you'd need later."}, {"letter": "B", "text": "Spawn subagents to investigate specific questions (e.g., \"find all test files for payment processing\", \"trace refund flow dependencies\") while the main agent coordinates findings and preserves high-level understanding.", "correct": true, "explanation": "Correct. Delegate well-scoped investigations to subagents with fresh context, while the main agent keeps the architectural overview. This is the pattern for scaling exploration beyond a single context window."}, {"letter": "C", "text": "Clear context with /clear, then selectively re-read only the most critical files discovered so far, writing key findings to a scratchpad file that persists between context resets.", "correct": false, "explanation": "Scratchpads help, but clearing + re-reading discards the understanding you already built across 8 files."}, {"letter": "D", "text": "Switch to using Grep to search for specific function names instead of reading full files, reducing the content loaded into context for remaining exploration.", "correct": false, "explanation": "You can't identify untested paths just by grepping names — you need to read enough of each path to know what branches the tests don't cover. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m25", "source": "mock", "domain": 1, "scenario": null, "situation": "A developer asks the agent to investigate why a specific API endpoint intermittently returns 500 errors. The codebase has 200+ files and the developer doesn't know which components are involved. The agent must trace the error through routing, middleware, business logic, and database layers.", "question": "What task decomposition approach would be most effective?", "options": [{"letter": "A", "text": "Have the agent first create a comprehensive plan mapping all code paths through the endpoint before beginning any file exploration or code reading.", "correct": false, "explanation": "You can't build a correct plan for an unknown error without any exploration. Planning blind wastes time and misses the actual failure path."}, {"letter": "B", "text": "Have the agent dynamically generate investigation subtasks based on what it discovers at each step, adapting its exploration plan as new information about the error path emerges.", "correct": true, "explanation": "Correct. Debugging is adaptive by nature — each file you read changes the most useful next step. Let the agent follow the evidence."}, {"letter": "C", "text": "Define a fixed sequence of investigation steps upfront—grep for error patterns, then read error handlers, then check database queries, then examine middleware—executing each step regardless of intermediate findings.", "correct": false, "explanation": "A fixed pipeline wastes work on layers that aren't involved and can lock the agent out of the actual root cause path."}, {"letter": "D", "text": "Run parallel worker agents that simultaneously investigate all four layers, then synthesize their findings to identify where the error originates.", "correct": false, "explanation": "Fan-out is useful once you have well-scoped subtasks. Here, you don't — you'd pay 4× the cost to look in three layers that aren't the problem. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m26", "source": "mock", "domain": 1, "scenario": null, "situation": "An engineer's exploration subagent spent 30 minutes analyzing a legacy payment system, reading 47 files and documenting data flows. The session was interrupted when the engineer's connection dropped. While away, a teammate merged a PR that renamed two utility functions. The engineer wants to continue the same exploration.", "question": "What's the most effective approach?", "options": [{"letter": "A", "text": "Resume the subagent from its previous transcript without mentioning the changes—the architecture understanding remains valid.", "correct": false, "explanation": "Silently resuming lets the agent keep referencing the old function names in its recommendations."}, {"letter": "B", "text": "Launch a fresh subagent and include the prior transcript in the initial prompt for context.", "correct": false, "explanation": "Loading 30 minutes of transcript into a new subagent's prompt is wasteful and pollutes its starting context."}, {"letter": "C", "text": "Launch a fresh subagent with a summary of prior findings.", "correct": false, "explanation": "Re-summarization throws away the fine-grained data flows the agent was already tracking across 47 files."}, {"letter": "D", "text": "Resume the subagent from its previous transcript and inform it about the renamed functions.", "correct": true, "explanation": "Correct. Keep the accumulated understanding, and give it a targeted delta about the renames so it can update its mental model — minimum waste, maximum accuracy. ════════════════════════════════════════════════════════════"}], "correct": "D"}, {"id": "m28", "source": "mock", "domain": 1, "scenario": null, "situation": "Your agent has analyzed a complex service module—reading 23 source files, tracing request flows, and identifying error handling patterns. A developer wants to compare two testing strategies before committing to one: end-to-end tests with mocked external services vs. snapshot tests capturing expected outputs. They need to independently develop both approaches to evaluate trade-offs.", "question": "How should you manage the sessions?", "options": [{"letter": "A", "text": "Export the analysis session's key findings to a file, then create two new sessions that reference this file.", "correct": false, "explanation": "An exported summary is lossier than the live session state the agent built up while reading 23 files."}, {"letter": "B", "text": "Resume the analysis session with `fork_session` enabled, creating a separate branch for each testing strategy.", "correct": true, "explanation": "Correct. Forking gives each strategy its own independent context starting from the exact analysis baseline — no cross-contamination, no re-analysis."}, {"letter": "C", "text": "Start two fresh sessions, having each re-read the relevant source files before beginning.", "correct": false, "explanation": "Burns tokens redoing work the original session already did, and risks each fresh session reaching different conclusions from the same code."}, {"letter": "D", "text": "Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially.", "correct": false, "explanation": "Sequential development in one thread lets the first strategy's implementation bias reasoning about the second. ════════════════════════════════════════════════════════════"}], "correct": "B"}, {"id": "m30", "source": "mock", "domain": 1, "scenario": null, "situation": "An engineer who just joined the team asks the agent to help them understand the authentication and authorization architecture before making security improvements. The codebase has 800+ files across multiple services.", "question": "What exploration strategy will most effectively build understanding, given Claude built-in tools and context limits?", "options": [{"letter": "A", "text": "Read any CLAUDE.md and README files first, then ask the engineer to specify which 10-15 files are most important for understanding the auth system.", "correct": false, "explanation": "The engineer just joined — they probably don't know which files matter. That's exactly what the agent is supposed to help with."}, {"letter": "B", "text": "Launch parallel subagents to explore different services simultaneously, then synthesize their findings into an architectural overview.", "correct": false, "explanation": "Without knowing where auth lives, fan-out explores too broadly and subagents duplicate and miss cross-service flows."}, {"letter": "C", "text": "Use Grep to find authentication entry points, read those files, then follow imports and function calls to map the auth flow incrementally.", "correct": true, "explanation": "Correct. Start at entry points (login, token verify, middleware), then trace outward following real code edges. Incremental, grounded, fits within context limits."}, {"letter": "D", "text": "Read all files containing \"auth\", \"login\", \"permission\", or \"token\" in their content or filename.", "correct": false, "explanation": "Those keywords hit a huge amount of unrelated code across 800+ files and drown context in noise. ════════════════════════════════════════════════════════════"}], "correct": "C"}, {"id": "m31", "source": "mock", "domain": 1, "scenario": null, "situation": "A customer returns 4 hours after their initial session about the same billing dispute. The previous 32-turn session contains `lookup_order` results showing \"Status: PENDING, Expected resolution: 24-48 hours.\" In testing, you observe that when resuming sessions with stale tool results, the agent often references the outdated data in responses (e.g., \"I see your refund is still being processed\") even after subsequent fresh tool calls return different information.", "question": "What approach most reliably handles returning customers?", "options": [{"letter": "A", "text": "Resume with full history but filter out previous `tool_result` messages before resuming, keeping only the human/assistant turns so the agent must re-fetch needed data.", "correct": false, "explanation": "Stripping `tool_results` from the middle of a conversation can leave assistant messages referencing nonexistent results — the transcript becomes internally inconsistent."}, {"letter": "B", "text": "Start a new session, inject a structured summary of the previous interaction (issue type, actions taken, resolution status), then make fresh tool calls before engaging.", "correct": true, "explanation": "Correct. A clean session with a summary keeps the narrative continuity while guaranteeing the agent isn't reasoning over stale tool results."}, {"letter": "C", "text": "Resume with full history and add a system prompt instruction telling the agent to always prefer the most recent tool results when multiple calls to the same tool exist in context.", "correct": false, "explanation": "Prompt instructions are suggestions. You observed that exact failure mode in testing — the model still references old results."}, {"letter": "D", "text": "Resume with full history and configure the agent to automatically re-call all previously-used tools at session start to ensure data freshness.", "correct": false, "explanation": "Blanket re-calling is wasteful, slow, and still leaves the old results sitting in context to confuse th
