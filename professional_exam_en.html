en because they already work well and cover only a narrow slice of real usage, so a pass rate on them is not evidence a regulator can rely on for actual risk."}, {"letter": "C", "text": "Inter-rater agreement between the two engineers who reviewed a sample of outputs, reported as the system's quality metric.", "correct": false, "explanation": "Agreement between two reviewers shows whether they concur with each other, not whether the guidance given is actually accurate, safe, or compliant; it is a process-consistency figure, not evidence of correctness."}, {"letter": "D", "text": "Accuracy against a labeled set of known-correct financial guidance.", "correct": true, "explanation": "Accuracy against ground-truth-labeled guidance is a core, defensible metric compliance can inspect directly."}, {"letter": "E", "text": "Safety/security, including rate of disallowed advice or PII exposure.", "correct": true, "explanation": "A regulated financial-advice agent needs an explicit, measured rate of disallowed or unsafe outputs to demonstrate risk is controlled."}], "correct": ["A", "D", "E"], "select": 3}, {"id": "p4-14", "domain": 4, "objective": "Design evaluation datasets and test frameworks using mixed methodologies", "situation": "A team building an evaluation framework for a multi-turn coding assistant wants to measure whether the agent correctly uses earlier context from the conversation, not just whether individual replies look plausible in isolation.", "question": "Which test-framework design best captures this requirement?", "options": [{"letter": "A", "text": "Score each turn independently against a reference answer, ignoring prior turns.", "correct": false, "explanation": "Independent per-turn scoring cannot detect a failure to correctly use context established in earlier turns."}, {"letter": "B", "text": "Build multi-turn test scenarios with scripted follow-ups that depend on earlier turns, scored for whether later responses correctly incorporate prior context, mixing automated checks with human review of ambiguous cases.", "correct": true, "explanation": "Scenarios that require using earlier context directly test the target behavior, and combining automated and human scoring handles both clear-cut and ambiguous cases."}, {"letter": "C", "text": "Only test single-turn prompts, since multi-turn behavior is too hard to evaluate reliably.", "correct": false, "explanation": "This avoids testing the exact multi-turn context-use behavior the team explicitly wants to measure."}, {"letter": "D", "text": "Rely on model self-report of confidence after each turn as the sole quality signal.", "correct": false, "explanation": "Self-reported confidence measures the model's own belief, not whether it actually used prior context correctly."}], "correct": "B", "select": 1}, {"id": "p4-15", "domain": 4, "objective": "Conduct A/B testing and iterative improvements", "situation": "A team runs an A/B test comparing two prompt variants for a marketing-copy generator. After one day, variant B shows a large but noisy improvement based on only 40 samples per arm.", "question": "What is the most defensible next step?", "options": [{"letter": "A", "text": "Ship variant B immediately since it is currently ahead.", "correct": false, "explanation": "The sample size is too small at this point to reliably distinguish a real effect from noise."}, {"letter": "B", "text": "Ship variant A instead, since it has been running longer in other contexts.", "correct": false, "explanation": "Performance in unrelated contexts is not relevant evidence for this specific test."}, {"letter": "C", "text": "Continue the test until the pre-defined sample size or duration is reached before deciding, per the original test plan.", "correct": true, "explanation": "Sticking to the pre-registered sample size or duration avoids acting on noise from an underpowered early read and keeps the decision defensible."}, {"letter": "D", "text": "Average the metrics from both variants and deploy a blended prompt.", "correct": false, "explanation": "Averaging metrics across two different prompts does not produce a coherent deployable variant or resolve which one is actually better."}], "correct": "C", "select": 1}, {"id": "p4-16", "domain": 4, "objective": "Diagnose system issues (prompt failure, hallucinations, model mismatch)", "situation": "A newly deployed agent begins citing a nonexistent internal policy number in about 10% of responses. The retrieval system's logs show the correct policy documents were retrieved and included in context each time.", "question": "Given retrieval was confirmed correct, what should the team investigate next?", "options": [{"letter": "A", "text": "Add a stricter system-prompt instruction telling the model never to invent policy numbers.", "correct": false, "explanation": "An instruction is not a verified fix; it does not diagnose why the model fabricates a number and may still be overridden by other pressure in the prompt to always cite one."}, {"letter": "B", "text": "Increase the model's maximum output token limit so responses have more room for the full citation text.", "correct": false, "explanation": "Token budget was never the constraint here; more room to respond does not stop a number from being fabricated when none was retrieved."}, {"letter": "C", "text": "Silently strip any policy-number-looking string from every response before it reaches the user.", "correct": false, "explanation": "This masks the symptom in the output and would also remove correct, legitimately retrieved policy numbers, without diagnosing the fabrication itself."}, {"letter": "D", "text": "Examine whether the model is hallucinating specific-sounding details not present in the retrieved context, possibly encouraged by instructions demanding a citation.", "correct": true, "explanation": "With retrieval already confirmed correct, a fabricated detail points to a hallucination pattern, which prompt instructions demanding a citation could be reinforcing."}], "correct": "D", "select": 1}, {"id": "p4-17", "domain": 4, "objective": "Optimize token usage, latency, and cost-performance trade-offs", "situation": "A document-processing agent runs three tool calls per document, each one strictly dependent on the previous call's output: extract raw text, then classify the document type from that text, then apply type-specific formatting based on the classification. Turn latency averages 3.5 seconds against a 2-second budget, while cost is within budget.", "question": "Given this genuinely sequential dependency, which two changes are most likely to bring latency within budget? (Select TWO.)", "options": [{"letter": "A", "text": "Increase the model's temperature setting to speed up generation.", "correct": false, "explanation": "Temperature controls output randomness, not generation speed, so it has no effect on latency."}, {"letter": "B", "text": "Combine the extraction and classification steps into one model call with structured output for both fields.", "correct": true, "explanation": "Merging two dependent steps into one call removes an entire round-trip from the sequential chain, cutting cumulative latency without needing the calls to be parallelizable."}, {"letter": "C", "text": "Replace the final formatting step with deterministic code instead of a third model call.", "correct": true, "explanation": "Once the document type is known, applying its format is a deterministic operation; handling it in code removes an entire model round-trip without touching the steps that still need reasoning."}, {"letter": "D", "text": "Increase the maximum token output limit so each step has more room to respond.", "correct": false, "explanation": "A larger output ceiling does not reduce latency and can increase it if the model produces longer responses."}, {"letter": "E", "text": "Add a retry-with-backoff wrapper around every tool call to improve reliability.", "correct": false, "explanation": "Retries address failure reliability, not the latency budget, and can make total turn time worse under load."}], "correct": ["B", "C"], "select": 2}, {"id": "p4-18", "domain": 4, "objective": "Monitor system performance using logging and observability tools", "situation": "A team notices via dashboards that the average cost per conversation for their agent has crept up 40% over the last month, but no code or prompt changes were deployed.", "question": "What is the most useful next observability step to explain the increase?", "options": [{"letter": "A", "text": "Immediately roll back to a previous model version without further investigation.", "correct": false, "explanation": "There is no evidence yet that a model version changed or is the cause, so a rollback is premature."}, {"letter": "B", "text": "Break down the cost metric by conversation type, tool usage, and input/output token counts to isolate which segment or tool is driving the increase.", "correct": true, "explanation": "Decomposing an aggregate metric into segments is how observability turns an unexplained trend into an actionable, specific cause."}, {"letter": "C", "text": "Stop monitoring cost metrics since no deployment change occurred, assuming it will self-correct.", "correct": false, "explanation": "This ignores a real, measured trend that still needs an explanation regardless of whether a deployment triggered it."}, {"letter": "D", "text": "Increase the alerting threshold so the metric no longer triggers notifications.", "correct": false, "explanation": "Raising the threshold hides the signal rather than investigating and explaining the actual cause of the increase."}], "correct": "B", "select": 1}, {"id": "p4-19", "domain": 4, "objective": "Define evaluation metrics (accuracy, latency, cost, safety, security)", "situation": "A team is deciding how to report safety metrics for an agent that occasionally handles ambiguous, borderline-harmful requests. Leadership wants a single pass/fail signal for the release gate.", "question": "What is the best way to define this metric so it remains meaningful over time?", "options": [{"letter": "A", "text": "Define 'safe' as zero customer complaints received, since complaints are the ultimate signal.", "correct": false, "explanation": "Complaints are a lagging, low-coverage proxy that misses unreported incidents and gives no pre-release signal."}, {"letter": "B", "text": "Define 'safe' based on a subjective overall impression from one reviewer's spot check.", "correct": false, "explanation": "A single reviewer's impression is not reproducible or clearly specified, so it cannot serve as a stable release gate over time."}, {"letter": "C", "text": "Define a labeled test set of borderline and clearly harmful requests, specify the required refusal/escalation behavior for each, and set a required pass rate threshold as the gate.", "correct": true, "explanation": "A labeled test set with specified expected behavior and a pass-rate threshold is reproducible, auditable, and can be re-run consistently as the release gate."}, {"letter": "D", "text": "Define 'safe' as the agent never using certain banned words, regardless of context.", "correct": false, "explanation": "A keyword rule does not capture actual harmful-request behavior and is easily gamed by rephrasing without becoming safer."}], "correct": "C", "select": 1}, {"id": "p4-20", "domain": 4, "objective": "Diagnose system issues (prompt failure, hallucinations, model mismatch)", "situation": "A team observes that an agent performs well in a staging environment but produces noticeably different, lower-quality outputs in production for the same inputs, despite verifying that the prompt template deployed to production matches staging exactly.", "question": "What should the team check next to diagnose the discrepancy?", "options": [{"letter": "A", "text": "Restart the production service, assuming a transient runtime glitch caused a one-off quality dip.", "correct": false, "explanation": "The team observed a consistent, reproducible pattern rather than a one-off event, and restarting does not investigate any actual difference between the two environments."}, {"letter": "B", "text": "Ask users in production to rephrase their questions.", "correct": false, "explanation": "This places the burden on users instead of diagnosing a system-side discrepancy that the team itself introduced."}, {"letter": "C", "text": "Assume the discrepancy is random noise and take no action.", "correct": false, "explanation": "This dismisses a real, reproducible difference between environments without investigating it."}, {"letter": "D", "text": "Compare the full request payloads (model version/parameters, retrieved context, tool configuration, temperature) actually sent in each environment, since an identical prompt template does not guarantee an identical full request.", "correct": true, "explanation": "The prompt template is only one part of the request; other configuration like model version, parameters, or retrieved context can differ between environments and explain the quality gap."}], "correct": "D", "select": 1}, {"id": "p5-01", "domain": 5, "objective": "Implement guardrails and safety controls", "situation": "A customer support agent built on Claude has tool access to issue refunds up to $500 automatically. An incident occurred where a user embedded conflicting instructions in a forwarded email, and the agent's reasoning concluded it had 'multiple approvals' to issue a $2000 refund.", "question": "Which guardrail change best prevents this class of failure?", "options": [{"letter": "A", "text": "Enforce a hard server-side cap on the refund tool call (e.g., max $500 per transaction) that the tool layer itself will not exceed, regardless of what the model's reasoning concludes.", "correct": true, "explanation": "A limit enforced at the tool/API boundary cannot be talked around by injected text or flawed reasoning inside the model's context. The control does not depend on the model behaving correctly."}, {"letter": "B", "text": "Add a system prompt instruction telling the model never to exceed $500 in refunds.", "correct": false, "explanation": "A prompt instruction is a policy, not an enforced control. Injected content in the conversation can still override or confuse it, as this incident shows."}, {"letter": "C", "text": "Switch to a larger model with stronger chain-of-thought reasoning before refund decisions.", "correct": false, "explanation": "More reasoning capacity does not stop an attacker's injected claims of prior authorization from being accepted; the vulnerability is architectural, not a reasoning-quality gap."}, {"letter": "D", "text": "Log all refund tool calls for weekly manual review.", "correct": false, "explanation": "Logging supports detection after the fact but does not prevent the over-refund from happening in the first place."}], "correct": "A", "select": 1}, {"id": "p5-02", "domain": 5, "objective": "Implement guardrails and safety controls", "situation": "A team is building an agentic coding assistant with shell access that reads files from untrusted third-party repositories. They want to reduce the blast radius of indirect prompt injection hidden inside file contents.", "question": "Which two guardrails most directly reduce risk from indirect prompt injection embedded in files the agent reads? (Select TWO.)", "options": [{"letter": "A", "text": "Clearly delimit and label content read from untrusted files so it is treated as data rather than as instructions from the developer or user.", "correct": true, "explanation": "Structurally separating untrusted data from trusted instructions reduces the chance the model treats embedded text as a command to obey."}, {"letter": "B", "text": "Increase the context window so the agent can read more of the repository at once.", "correct": false, "explanation": "A larger context window changes how much content fits, not whether injected instructions are distinguished from trusted ones; it does not address the risk."}, {"letter": "C", "text": "Add a system prompt line asking the model to be extra careful about suspicious instructions found in files.", "correct": false, "explanation": "This is an unenforced policy statement. It may reduce susceptibility somewhat but is not a structural control and is easily overridden by a well-crafted injection."}, {"letter": "D", "text": "Insert an additional model call that summarizes each file before the main agent reads it, to improve readability.", "correct": false, "explanation": "Summarization targets comprehension, not injection risk, and can even propagate injected instructions into the summary if not paired with sandboxing/delimiting."}, {"letter": "E", "text": "Run the agent in a sandboxed environment with no network egress and a scoped, disposable filesystem, so that even if injected instructions are followed, resulting damage is contained.", "correct": true, "explanation": "Containment limits the consequences of a successful injection even when detection fails, which is essential given injection cannot be fully prevented."}], "correct": ["A", "E"], "select": 2}, {"id": "p5-03", "domain": 5, "objective": "Implement guardrails and safety controls", "situation": "An enterprise assistant routes every user request through an external content-safety classifier before the primary model responds. During a regional outage, the classifier service becomes unreachable for 40 minutes, and the on-call engineer must decide how the system behaves for the duration of the outage.", "question": "Which behavior should the system default to during the outage?", "options": [{"letter": "A", "text": "Let the primary model proceed without the classifier check, since request volume during a short outage is assumed to be low.", "correct": false, "explanation": "Removing a required safety control during an outage does not become safer because volume is assumed to be low; the assumption is unverified and the control is skipped exactly when its absence matters."}, {"letter": "B", "text": "Continue accepting and serving all requests as normal, but log them for retroactive review by the classifier once it is reachable again.", "correct": false, "explanation": "Retroactive review only detects problems after unsafe responses have already reached users; it is a detection step, not a control that prevents the harm during the gap."}, {"letter": "C", "text": "Fail closed: block or queue requests that require the safety check until the classifier is reachable again, rather than serving them unchecked.", "correct": true, "explanation": "Failing closed treats the safety check as a hard dependency the system enforces rather than an optional step; when the control cannot run, the system withholds the action instead of silently expanding risk during the gap."}, {"letter": "D", "text": "Route requests to a larger model on the assumption that a bigger model is inherently safer without an external check.", "correct": false, "explanation": "Model size is not a substitute for the specific safety control that is unavailable; there is no basis for assuming a larger model closes the same gap the classifier was put in place to cover."}], "correct": "C", "select": 1}, {"id": "p5-04", "domain": 5, "objective": "Implement guardrails and safety controls", "situation": "A financial-advice assistant is being deployed publicly. Compliance requires strict boundaries on what topics it can discuss and resilience against attempts to bypass those boundaries (jailbreaks) using only a single-layer system prompt today.", "question": "Beyond the system prompt, which single change adds the most defense-in-depth against jailbreak attempts?", "options": [{"letter": "A", "text": "Lengthen the system prompt to explicitly list every disallowed topic in more detail.", "correct": false, "explanation": "This still relies on a single layer (the primary model reading its own instructions), which is exactly the layer jailbreaks target; more text does not add an independent check."}, {"letter": "B", "text": "Rely on the terms of service that prohibit users from attempting to misuse the assistant.", "correct": false, "explanation": "Terms of service are a legal deterrent, not a technical control, and do not stop a jailbreak attempt from succeeding at runtime."}, {"letter": "C", "text": "Increase the model's context window so it retains policy instructions for longer.", "correct": false, "explanation": "Context window size affects how much text is retained, not whether the model can be manipulated into ignoring its instructions."}, {"letter": "D", "text": "Add an independent input/output classifier layer that screens requests and responses regardless of what the primary model decides.", "correct": true, "explanation": "A separate classifier that operates outside the primary model's own reasoning provides a second, independent check, so a single successful jailbreak of the primary model does not automatically defeat the whole system."}], "correct": "D", "select": 1}, {"id": "p5-05", "domain": 5, "objective": "Identify risks, limitations, and failure modes of LLM systems", "situation": "A legal-research assistant powered by Claude occasionally cites case law that does not exist. The team's first instinct is that fine-tuning the model further will fix the problem.", "question": "What is the most likely root cause and the appropriate first fix?", "options": [{"letter": "A", "text": "The assistant lacks retrieval grounding; introduce a RAG pipeline over a verified case-law corpus so citations are drawn from retrieved documents rather than generated from the model's parametric memory.", "correct": true, "explanation": "Hallucinated citations are a classic symptom of an ungrounded generation process. Grounding answers in retrieved, verifiable source documents directly targets the root cause."}, {"letter": "B", "text": "The model's training data is insufficient, so it should be retrained from scratch on more legal text.", "correct": false, "explanation": "Retraining is costly and does not address the underlying issue: an ungrounded model will still generate plausible-sounding but unverifiable citations from parametric memory."}, {"letter": "C", "text": "The assistant's outputs are too short; increase the output token limit so the model can reason more carefully.", "correct": false, "explanation": "This conflates output length with factual grounding: a longer response gives the model more room to elaborate, but elaboration does not verify that a cited case actually exists, since the misconception here is treating verbosity as a proxy for accuracy."}, {"letter": "D", "text": "Switch to a larger, more capable model tier, which will eliminate hallucinated citations on its own.", "correct": false, "explanation": "A larger model may hallucinate less often but does not guarantee grounded, verifiable citations without a retrieval mechanism; the failure mode can still occur."}], "correct": "A", "select": 1}, {"id": "p5-06", "domain": 5, "objective": "Identify risks, limitations, and failure modes of LLM systems", "situation": "A multi-agent pipeline has a planner agent delegate tasks to worker agents through tool calls. After a minor tool schema change, the system begins silently producing wrong final answers with no errors thrown anywhere in the pipeline.", "question": "What class of failure mode does this best illustrate, and what does it imply for monitoring?", "options": [{"letter": "A", "text": "Model weight drift, since the underlying model must have changed; the fix is to pin the model version.", "correct": false, "explanation": "The scenario states the trigger was a tool schema change, not a model change, so pinning the model version does not address the actual cause."}, {"letter": "B", "text": "A silent failure caused by a tool/schema mismatch propagating undetected through agent handoffs, implying that contract validation and output-checking are needed at each handoff, not just error-code monitoring.", "correct": true, "explanation": "Because no exception was thrown, the failure is 'silent' in the monitoring sense; catching it requires validating the meaning of outputs at each agent boundary, not just watching for thrown errors."}, {"letter": "C", "text": "Prompt injection introduced by the worker agents; the fix is to sanitize worker agent outputs.", "correct": false, "explanation": "Nothing in the scenario indicates injected instructions; the trigger described is a schema change, not adversarial content."}, {"letter": "D", "text": "Insufficient context window causing truncation; the fix is to increase the maximum token limit.", "correct": false, "explanation": "Truncation is not indicated by the scenario, and increasing tokens would not address a schema mismatch between tool and agent expectations."}], "correct": "B", "select": 1}, {"id": "p5-07", "domain": 5, "objective": "Identify risks, limitations, and failure modes of LLM systems", "situation": "A team ships an agent that can call external APIs. In production they observe two separate incidents: (1) the agent repeats an expensive API call in a loop when it cannot parse an ambiguous result, and (2) the agent confidently reports success on a task it silently failed to complete.", "question": "Which two failure modes are illustrated here, paired with the control that most directly targets each? (Select TWO.)", "options": [{"letter": "A", "text": "Confident false-success reporting; require the agent to verify task completion against ground truth or tool state before declaring success, rather than trusting its own narration.", "correct": true, "explanation": "An independent completion check closes the gap between what the agent claims and what actually happened, directly addressing the false-success incident."}, {"letter": "B", "text": "Hallucination of API names; add more few-shot examples of correct API calls.", "correct": false, "explanation": "The scenario does not describe the agent inventing API names; this option addresses a different problem than the ones described."}, {"letter": "C", "text": "Latency degradation under load; cache responses more aggressively.", "correct": false, "explanation": "Latency is not mentioned in the scenario; caching does not address looping or false-success reporting."}, {"letter": "D", "text": "Training-data poisoning; retrain on curated data.", "correct": false, "explanation": "The incidents described are production behavior failures, not evidence of poisoned training data."}, {"letter": "E", "text": "Runaway looping caused by ambiguous tool feedback; add iteration/retry caps and clearer tool-output schemas so the agent can detect and exit failure states.", "correct": true, "explanation": "Bounding retries and making tool responses unambiguous directly addresses the observed looping behavior."}], "correct": ["A", "E"], "select": 2}, {"id": "p5-08", "domain": 5, "objective": "Identify risks, limitations, and failure modes of LLM systems", "situation": "An agent that started with 6 registered tools now has 40 as the product expanded. The team notices the agent increasingly calls the wrong tool for a request, or fails to call any tool when one is clearly needed, even though each individual tool's implementation is unchanged and still passes its own unit tests.", "question": "What failure mode does this best illustrate?", "options": [{"letter": "A", "text": "The model's weights have drifted over time and no longer represent the tools correctly.", "correct": false, "explanation": "Nothing in the scenario indicates the model itself changed; the trigger described is growth in the tool catalog, not a shift in model weights."}, {"letter": "B", "text": "The tools' unit tests are inadequate and should be rewritten with more edge cases.", "correct": false, "explanation": "Each tool already passes its own unit tests, which confirms tool-level correctness; the observed failure is about choosing among many tools, something a single tool's unit tests do not exercise."}, {"letter": "C", "text": "The agent should be given a larger context window so it can consider more information before choosing a tool.", "correct": false, "explanation": "A larger context window increases how much text the model can hold, not how well it discriminates between many similarly described tool options; the problem is choice quality, not available token budget."}, {"letter": "D", "text": "Tool-selection accuracy degrades as the number of available tools grows, because the model must discriminate among many similar options at once, a known scaling limitation of tool/function-calling systems rather than a defect in any individual tool's implementation.", "correct": true, "explanation": "As a tool catalog grows, the model must discriminate among an increasing number of similar-sounding options, and selection errors climb even when every individual tool is implemented correctly. This is a distinct, known limitation of scaling tool-calling systems, separate from model drift or data staleness."}], "correct": "D", "select": 1}, {"id": "p5-09", "domain": 5, "objective": "Apply human-in-the-loop validation strategies", "situation": "An agent recommends loan approvals. Leadership wants to reduce the operating cost of human review while remaining accountable for high-stakes decisions, per company policy.", "question": "Which human-in-the-loop design best balances cost and accountability?", "options": [{"letter": "A", "text": "Let the model decide automatically by default, but require mandatory human sign-off for high-value loans or low-confidence/edge-case outputs, with sampling-based audit of the remainder.", "correct": true, "explanation": "Risk-based routing concentrates costly human attention where stakes or uncertainty are highest, while sampling preserves ongoing accountability over the automated majority, satisfying both constraints."}, {"letter": "B", "text": "Require human review of every single decision regardless of confidence or loan amount.", "correct": false, "explanation": "This defeats the cost-reduction goal and does not target review effort at the cases where it matters most."}, {"letter": "C", "text": "Remove human review entirely once the model reaches high accuracy on a validation set.", "correct": false, "explanation": "High validation accuracy does not guarantee correctness on every real case, and removing all review abandons the accountability requirement for high-stakes decisions."}, {"letter": "D", "text": "Have a human review a random 1% sample of all decisions each month.", "correct": false, "explanation": "A flat random sample does not preferentially catch the highest-risk or highest-value cases, so it under-protects exactly the decisions where accountability matters most."}], "correct": "A", "select": 1}, {"id": "p5-10", "domain": 5, "objective": "Apply human-in-the-loop validation strategies", "situation": "A content moderation pipeline uses Claude to flag policy-violating posts. The team wants human reviewers to genuinely evaluate flagged content rather than rubber-stamp the model's decision.", "question": "Which practice best prevents automation bias (rubber-stamping) in the human review step?", "options": [{"letter": "A", "text": "Show reviewers the model's flag and confidence score prominently before they see the content itself.", "correct": false, "explanation": "This anchors the reviewer on the model's conclusion before they have formed an independent judgment, increasing rather than reducing automation bias."}, {"letter": "B", "text": "Present the content to the reviewer first, reveal the model's flag and rationale only afterward, and periodically inject known-answer test cases to measure reviewer independence.", "correct": true, "explanation": "Forming an independent judgment before seeing the model's conclusion reduces anchoring, and known-answer test cases give a measurable signal of whether reviewers are actually evaluating or simply agreeing."}, {"letter": "C", "text": "Batch review decisions into bulk approve/reject lists to speed throughput.", "correct": false, "explanation": "Bulk approval workflows encourage skimming and rapid agreement with the model, which is the rubber-stamping behavior the team wants to avoid."}, {"letter": "D", "text": "Remove the reviewer's ability to see the model's rationale entirely, so they focus only on the raw content.", "correct": false, "explanation": "Hiding all rationale removes useful context and does not by itself measure or prevent rubber-stamping; it is a partial step compared to actively testing reviewer independence."}], "correct": "B", "select": 1}, {"id": "p5-11", "domain": 5, "objective": "Apply human-in-the-loop validation strategies", "situation": "A team is designing escalation paths for an agent that performs medical-intake triage, where errors can be harmful and case volume is high.", "question": "Which two design choices best implement a defensible human-in-the-loop strategy at this scale? (Select TWO.)", "options": [{"letter": "A", "text": "Confidence-based routing: escalate to a human clinician only when the model's output disagrees with a secondary check or falls below a confidence threshold.", "correct": true, "explanation": "Routing scarce clinician attention to the cases most likely to be wrong or ambiguous is an efficient, risk-proportionate use of human review."}, {"letter": "B", "text": "Maintain an auditable log linking each model recommendation, the human decision, and the eventual outcome, to support review and continuous improvement.", "correct": true, "explanation": "An auditable trail is what turns human review into evidence of oversight, and it enables the team to learn from disagreements and outcomes over time."}, {"letter": "C", "text": "Require the model to always agree with the first human reviewer's note to avoid conflict.", "correct": false, "explanation": "Forcing agreement removes the value of independent model output entirely and does not constitute a coherent human-in-the-loop design."}, {"letter": "D", "text": "Have the model auto-approve all triage during peak hours to reduce clinician workload.", "correct": false, "explanation": "Removing oversight precisely when volume (and likely error risk) is highest is the opposite of a defensible escalation strategy."}, {"letter": "E", "text": "Ask the model to simulate what a human clinician would decide instead of routing the case to an actual person.", "correct": false, "explanation": "A simulated human decision is not a human-in-the-loop control at all; it removes the actual human judgment the strategy is meant to provide."}], "correct": ["A", "B"], "select": 2}, {"id": "p5-12", "domain": 5, "objective": "Ensure compliance with regulations (e.g., GDPR, HIPAA, FedRAMP)", "situation": "A healthcare company wants to deploy Claude to summarize patient chart notes. Legal requires that patient data never leave an approved processing boundary and that the arrangement with the model vendor supports the data-handling agreements required for regulated health information.", "question": "Which architectural decision most directly addresses this requirement?", "options": [{"letter": "A", "text": "Instruct the model via system prompt to never let patient data leave the conversation.", "correct": false, "explanation": "A prompt instruction cannot establish or enforce a legal data-handling agreement or a data-residency/processing boundary; those are contractual and infrastructure properties."}, {"letter": "B", "text": "Rely on the model's training to handle health data appropriately.", "correct": false, "explanation": "Training behavior is not a substitute for an enforceable processing boundary or a data-handling agreement with the vendor."}, {"letter": "C", "text": "Add a disclaimer to outputs stating that the data discussed is confidential.", "correct": false, "explanation": "A disclaimer is text, not a control; it does nothing to keep data within an approved boundary or establish the needed agreement."}, {"letter": "D", "text": "Choose a deployment path and configuration (e.g., an enterprise offering backed by the required data-handling and processing agreement) that keeps data within the approved processing boundary, rather than relying on the model's behavior alone.", "correct": true, "explanation": "Satisfying a data-boundary and data-handling-agreement requirement is a deployment and contractual/architectural decision, not something achievable through prompting; it must be established at the infrastructure and vendor-agreement level."}], "correct": "D", "select": 1}, {"id": "p5-13", "domain": 5, "objective": "Ensure compliance with regulations (e.g., GDPR, HIPAA, FedRAMP)", "situation": "An EU-facing consumer app uses Claude for personalized recommendations and must satisfy data-protection expectations around user data, including data residency, retention limits, and the ability to respond to individual data-rights requests.", "question": "Which three architectural controls are most relevant to meeting these expectations? (Select THREE.)", "options": [{"letter": "A", "text": "Build a mechanism to locate, export, and delete an individual's data on request, with an auditable trail of that action.", "correct": true, "explanation": "The ability to act on individual data-rights requests, with evidence that the action occurred, is a concrete architectural requirement, not just a policy statement."}, {"letter": "B", "text": "Publish a public-facing privacy notice describing what data is collected and why, without also building the technical means to act on individual requests.", "correct": false, "explanation": "A privacy notice communicates intent but is not itself a mechanism for locating, exporting, or deleting an individual's data; it does not fulfill a data-rights request on its own."}, {"letter": "C", "text": "Grant the support team broad standing read access to the full user database so they can manually assemble data-rights responses whenever one is requested.", "correct": false, "explanation": "Provisioning broad standing access for occasional requests expands the attack surface and is weaker than a scoped mechanism built to fulfill requests with least privilege and an auditable trail; it also does not by itself address residency or retention."}, {"letter": "D", "text": "Configure data residency/processing region controls so user data is stored and processed within the required jurisdiction.", "correct": true, "explanation": "Residency requirements are satisfied by controlling where data is stored and processed, which is an infrastructure/configuration decision."}, {"letter": "E", "text": "Implement a defined retention policy with automated deletion or expiry of stored user data and conversation logs after the required period.", "correct": true, "explanation": "Retention limits must be enforced by an automated mechanism; a policy alone does not guarantee data is actually deleted on schedule."}], "correct": ["A", "D", "E"], "select": 3}, {"id": "p5-14", "domain": 5, "objective": "Ensure compliance with regulations (e.g., GDPR, HIPAA, FedRAMP)", "situation": "A government contractor wants to deploy an internal Claude-based assistant that must meet a federal authorization-to-operate framework for cloud services handling government data.", "question": "Which factor is the most architecturally decisive one to evaluate first?", "options": [{"letter": "A", "text": "Whether the model's answers sound authoritative enough for government use.", "correct": false, "explanation": "Tone or apparent authority of responses has no bearing on whether the underlying infrastructure meets an authorization-to-operate requirement."}, {"letter": "B", "text": "Whether the chosen deployment environment and its supporting infrastructure/vendor carry the required authorization status for the applicable government compliance program, rather than assuming the model itself is 'compliant.'", "correct": true, "explanation": "Authorization-to-operate frameworks apply to the hosting environment and vendor's infrastructure and controls, not to the model in isolation; this is the first thing to verify before any other design decision."}, {"letter": "C", "text": "Whether the system prompt includes government-appropriate language.", "correct": false, "explanation": "Prompt wording does not establish or substitute for an infrastructure authorization status."}, {"letter": "D", "text": "Whether the assistant uses the largest available model tier.", "correct": false, "explanation": "Model size has no relationship to whether the deployment environment holds the required government authorization."}], "correct": "B", "select": 1}, {"id": "p5-15", "domain": 5, "objective": "Ensure compliance with regulations (e.g., GDPR, HIPAA, FedRAMP)", "situation": "An auditor asks the architecture team to demonstrate that access to a Claude-based system processing regulated data is properly controlled, and that this control can be evidenced later rather than merely asserted.", "question": "What best satisfies 'produce evidence,' not just 'have a policy'?", "options": [{"letter": "A", "text": "A written access-control policy document stored in the company wiki.", "correct": false, "explanation": "A policy document states intent but provides no evidence that access controls were actually enforced or exercised in practice."}, {"letter": "B", "text": "A verbal assurance from the engineering lead that access is restricted.", "correct": false, "explanation": "A verbal assurance is not verifiable and leaves no artifact an auditor can inspect."}, {"letter": "C", "text": "Enforced role-based access control on the system, combined with immutable audit logs capturing who accessed what data and when, retrievable for the audit period.", "correct": true, "explanation": "Enforcement plus a retrievable, tamper-resistant log is what turns a policy into a control with evidence, exactly what an auditor needs to verify after the fact."}, {"letter": "D", "text": "A one-time access review conducted before launch, not repeated since.", "correct": false, "explanation": "A single pre-launch review is stale and cannot demonstrate ongoing enforcement over the audit period being examined."}], "correct": "C", "select": 1}, {"id": "p5-16", "domain": 5, "objective": "Address ethical AI considerations (bias, fairness, transparency)", "situation": "A résumé-screening assistant built on Claude is found to rank candidates from a particular demographic group lower on average, even though demographic fields are not included anywhere in the prompt.", "question": "What is the most likely explanation and the appropriate response?", "options": [{"letter": "A", "text": "The model is inherently biased and no mitigation is possible; the project should be discontinued.", "correct": false, "explanation": "This is a fatalistic conclusion that skips the actual architectural investigation and mitigation options available before deciding the project is unworkable."}, {"letter": "B", "text": "The disparity is random noise and will resolve itself with more usage.", "correct": false, "explanation": "Dismissing a measured disparity as noise without investigation is not a defensible response to a fairness finding."}, {"letter": "C", "text": "Switching to a larger model tier will remove the bias automatically.", "correct": false, "explanation": "Model scale is not a guaranteed fix for disparate impact; larger models are not inherently unbiased and the underlying data/feature issue would likely persist."}, {"letter": "D", "text": "Proxy features correlated with the demographic (e.g., school names, employment gaps, zip codes) are likely influencing outcomes; audit inputs and outputs for disparate impact and adjust the pipeline (feature exposure, prompt design, evaluation) accordingly.", "correct": true, "explanation": "Even without explicit demographic fields, correlated proxy signals commonly drive disparate outcomes; a targeted fairness audit identifies the actual mechanism so it can be mitigated at the source."}], "correct": "D", "select": 1}, {"id": "p5-17", "domain": 5, "objective": "Address ethical AI considerations (bias, fairness, transparency)", "situation": "Users of a customer-facing assistant are not told they are interacting with an AI system, and the assistant sometimes makes claims about a product's capabilities that the company cannot fully substantiate.", "question": "Which change best addresses the transparency and trust concerns here?", "options": [{"letter": "A", "text": "Clearly disclose to users that they are interacting with an AI system, and constrain product claims to a vetted, sourced set of facts the assistant can cite.", "correct": true, "explanation": "Disclosure addresses the transparency gap directly, and grounding claims in a vetted source set addresses the substantiation problem, together closing both concerns raised."}, {"letter": "B", "text": "Improve the assistant's tone so it sounds more human and reassuring.", "correct": false, "explanation": "Making the assistant sound more human worsens the transparency problem rather than solving it, since users are already unaware they are talking to an AI."}, {"letter": "C", "text": "Add more enthusiastic marketing language to build user confidence.", "correct": false, "explanation": "This does nothing to address either the disclosure gap or the unsubstantiated-claims problem, and may make the substantiation issue worse."}, {"letter": "D", "text": "Remove disclaimers to keep the user experience seamless.", "correct": false, "explanation": "Removing disclosure mechanisms moves in the opposite direction of the transparency the scenario calls for."}], "correct": "A", "select": 1}, {"id": "p5-18", "domain": 5, "objective": "Address ethical AI considerations (bias, fairness, transparency)", "situation": "A team building a hiring-adjacent assistant wants to evaluate fairness across demographic groups but currently only has aggregate accuracy metrics.", "question": "What is the most appropriate next step?", "options": [{"letter": "A", "text": "Conclude the system is fair because aggregate accuracy is high.", "correct": false, "explanation": "High aggregate accuracy can mask significant disparities between subgroups; it is not sufficient evidence of fairness on its own."}, {"letter": "B", "text": "Disaggregate evaluation by relevant subgroups and track fairness-specific metrics (e.g., error-rate parity) alongside accuracy, before wider rollout.", "correct": true, "explanation": "Measurement is a prerequisite to informed decisions about fairness; disaggregated metrics reveal disparities that an aggregate number hides, and doing this before wider rollout limits harm."}, {"letter": "C", "text": "Wait for user complaints to surface fairness issues once the system is in production.", "correct": false, "explanation": "A reactive approach exposes real candidates to potential harm before any issue is detected, which is not appropriate given the hiring-adjacent stakes."}, {"letter": "D", "text": "Increase the size of the training data without further analysis.", "correct": false, "explanation": "More data does not address the measurement gap identified; without disaggregated evaluation, the team still cannot tell whether fairness improved."}], "correct": "B", "select": 1}, {"id": "p6-01", "domain": 6, "objective": "Conduct structured discovery and requirement gathering", "situation": "You are scoping an agentic system to triage customer support tickets. The business sponsor says the system must 'respond quickly and accurately.' No latency figure, no accuracy threshold, and no definition of an acceptable escalation rate has been written down anywhere.", "question": "What should you do before proposing an architecture?", "options": [{"letter": "A", "text": "Convert the vague goals into measurable requirements (target response latency, acceptable error/escalation rate, and who owns the threshold) before any design work.", "correct": true, "explanation": "Unquantified goals like 'quickly and accurately' cannot be architected against; discovery must produce numbers and an owner, or every later design decision is unverifiable."}, {"letter": "B", "text": "Select an architecture known to work well for support triage in other companies and present it as the baseline.", "correct": false, "explanation": "Reusing a pattern from elsewhere skips the step of finding out whether this business's latency and accuracy needs even match that pattern's tradeoffs."}, {"letter": "C", "text": "Build a prototype first and let the sponsor react to its behavior to discover the real requirements.", "correct": false, "explanation": "Prototyping before establishing even rough targets risks anchoring the sponsor on whatever the prototype happens to do, and wastes build effort discovery would have prevented cheaply."}, {"letter": "D", "text": "Assume industry-standard SLAs (e.g., sub-second response, 99% accuracy) and proceed, revisiting only if stakeholders object.", "correct": false, "explanation": "Silently assuming numbers and waiting for objections shifts the burden of discovery onto the stakeholder and risks building to the wrong target undetected until launch."}], "correct": "A", "select": 1}, {"id": "p6-02", "domain": 6, "objective": "Conduct structured discovery and requirement gathering", "situation": "During discovery for a document-processing agent, the compliance team mentions in passing that 'some of this data might be regulated' but the discovery session moves on without pinning down which regulation, which fields, or which environments are in scope.", "question": "What discovery gap creates the greatest downstream architectural risk here?", "options": [{"letter": "A", "text": "The team did not ask which model family would be used for the agent.", "correct": false, "explanation": "Model family choice is a design decision that can be revisited later; it does not block correct handling of regulated data and is not the discovery gap that creates irreversible risk."}, {"letter": "B", "text": "The team failed to convert an ambiguous compliance signal into a concrete data-classification and boundary requirement before design began.", "correct": true, "explanation": "An unresolved 'might be regulated' statement means data residency, retention, and access-control decisions could be made without knowing which constraints actually apply, and retrofitting compliance controls after storage and pipeline design is far costlier than designing for them up front."}, {"letter": "C", "text": "The team did not schedule a follow-up meeting within one week.", "correct": false, "explanation": "Meeting cadence is a process detail; the substantive risk is the unresolved classification question itself, not how quickly another meeting is booked."}, {"letter": "D", "text": "The team did not document the org chart of the compliance department.", "correct": false, "explanation": "Knowing reporting lines does not address the actual technical question of which fields are regulated and what handling they require."}], "correct": "B", "select": 1}, {"id": "p6-03", "domain": 6, "objective": "Conduct structured discovery and requirement gathering", "situation": "You are asked to design an agent that automates invoice approval. Finance says 'the agent should never approve anything it isn't sure about.' Engineering interprets this as a confidence-score threshold; Finance actually means any invoice above a dollar amount must always go to a human, regardless of model confidence.", "question": "What technique in structured discovery would have surfaced this mismatch earliest?", "options": [{"letter": "A", "text": "Asking Finance to review the final confidence-threshold value once the model was already built.", "correct": false, "explanation": "This defers discovery until after implementation, when the underlying control (dollar-amount routing versus confidence routing) is much more expensive to change."}, {"letter": "B", "text": "Sending Finance a glossary of machine-learning confidence terminology so they use the right words.", "correct": false, "explanation": "Teaching the stakeholder ML vocabulary does not resolve which control (amount-based or confidence-based) they actually intend; it addresses vocabulary, not the underlying requirement."}, {"letter": "C", "text": "Restating the requirement back with a concrete worked example (a specific dollar figure and a specific confidence score) and asking the stakeholder to confirm the expected outcome for that example.", "correct": true, "explanation": "Concrete worked examples force stakeholders to reveal the actual decision rule in their head, exposing that 'not sure' meant a dollar threshold, not a model confidence score, before any code is written."}, {"letter": "D", "text": "Documenting engineering's interpretation and circulating it for silent sign-off via email.", "correct": false, "explanation": "Silent sign-off invites the same ambiguity to pass unnoticed again; it does not actively surface the gap between the two interpretations the way a worked example does."}], "correct": "C", "select": 1}, {"id": "p6-04", "domain": 6, "objective": "Communicate architectural decisions and trade-offs", "situation": "You chose a single large orchestrator agent with many tools over a multi-agent pipeline for a claims-processing system, trading some modularity for lower latency and simpler debugging given the team's operational constraints. A stakeholder later asks why the system isn't using 'the more sophisticated multi-agent approach' they read about.", "question": "What is the best way to communicate this architectural decision?", "options": [{"letter": "A", "text": "Explain that multi-agent designs are outdated and the single-orchestrator pattern is simply the modern approach.", "correct": false, "explanation": "This is inaccurate and unfalsifiable; it substitutes a trend claim for the actual tradeoff analysis and gives the stakeholder no way to evaluate whether the decision fits their situation."}, {"letter": "B", "text": "Avoid the topic until a formal architecture review is scheduled.", "correct": false, "explanation": "Deferring an already-asked question lets the stakeholder's misunderstanding persist and risks it hardening into an unaddressed objection raised again later, at a worse time."}, {"letter": "C", "text": "Offer to switch to a multi-agent pipeline since the stakeholder expressed a preference for it.", "correct": false, "explanation": "Changing the architecture to match an uninformed preference, without first explaining the tradeoff that motivated the original choice, abandons a decision made for real constraints rather than defending or revisiting it on the merits."}, {"letter": "D", "text": "State the decision, the specific constraint it satisfies (latency and debuggability given team size), and the tradeoff accepted (less modular task decomposition), so the stakeholder can evaluate it against their own priorities.", "correct": true, "explanation": "Naming the decision, the constraint driving it, and the cost accepted lets the stakeholder judge fit rather than trust; this is what distinguishes a defensible architectural communication from a bare assertion of preference."}], "correct": "D", "select": 1}, {"id": "p6-05", "domain": 6, "objective": "Communicate architectural decisions and trade-offs", "situation": "You must present two options for a retrieval-augmented agent: Option A refreshes the index nightly (cheaper, stale up to 24 hours) and Option B refreshes on every write (near-real-time, higher infrastructure cost and added write-path latency). The product owner has not stated a tolerance for staleness.", "question": "How should you frame this decision for the product owner?", "options": [{"letter": "A", "text": "Present both options with their concrete costs (staleness window vs. infrastructure cost and write-path latency) and ask the product owner to state their staleness tolerance before recommending one.", "correct": true, "explanation": "Because the deciding variable (acceptable staleness) has not been established, the responsible move is to surface the tradeoff in concrete terms and get that threshold from the person who owns the business impact, rather than guessing."}, {"letter": "B", "text": "Recommend Option B because near-real-time is always the safer architectural choice.", "correct": false, "explanation": "Treating 'more real-time' as inherently safer skips the actual tradeoff analysis; without a stated staleness tolerance there is no basis to claim the extra cost and latency are justified."}, {"letter": "C", "text": "Choose Option A because it is cheaper and mention it only if asked.", "correct": false, "explanation": "Picking the cheaper option unilaterally and disclosing the tradeoff only reactively hides a decision that affects data freshness from the person accountable for whether that freshness is acceptable."}, {"letter": "D", "text": "Implement both in parallel and let the product owner compare them in production.", "correct": false, "explanation": "Running both live options simultaneously to discover a preference is a costly way to extract one data point that a direct question about staleness tolerance would establish immediately."}], "correct": "A", "select": 1}, {"id": "p6-06", "domain": 6, "objective": "Communicate architectural decisions and trade-offs", "situation": "An architect makes a change to how a high-volume agent's prompts are constructed. The change reduces per-call cost but imposes a new constraint on how future prompt changes must be structured to keep that saving. A stakeholder asks for a written explanation of this change ahead of a budget review.", "question": "Which two elements should the written explanation include for the budget review? (Select TWO.)", "options": [{"letter": "A", "text": "State the cost saving achieved and the specific constraint the change now imposes on future prompt work, so the stakeholder understands what has to be preserved to keep the saving.", "correct": true, "explanation": "Naming both the benefit and the ongoing constraint gives the stakeholder the full picture of what was gained and what must be respected going forward to keep gaining it, not just the favorable half of the story."}, {"letter": "B", "text": "Quantify the expected cost reduction with the assumptions behind the estimate (e.g., current baseline and traffic pattern) so the budget review can sanity-check the number.", "correct": true, "explanation": "A budget review needs a number plus its assumptions; providing both lets reviewers judge whether the estimate is credible rather than accepting a bare percentage."}, {"letter": "C", "text": "Say the change makes the system \"more efficient\" without further detail.", "correct": false, "explanation": "This is vague language that gives the budget reviewer no mechanism or number to evaluate, and does not belong in a decision communicated for a cost review."}, {"letter": "D", "text": "Describe the change as a routine performance tweak with no further detail needed.", "correct": false, "explanation": "Calling a cost-relevant architectural change 'routine' understates its relevance to the very review requesting an explanation and omits the reasoning the stakeholder asked for."}, {"letter": "E", "text": "Omit any mention of the new constraint on future prompt work since it is an implementation detail.", "correct": false, "explanation": "The constraint affects how future features can be added without losing the saving; hiding it as an 'implementation detail' leaves the stakeholder unaware of a real limitation the decision imposes."}], "correct": ["A", "B"], "select": 2}, {"id": "p6-07", "domain": 6, "objective": "Manage stakeholder feedback loops and expectation alignment (including SLAs)", "situation": "A customer-facing agent has been live for two months. Support tickets show users are frustrated with response times, but there is no written SLA and the engineering team believes the current 8-second median response is acceptable because 'nobody complained during the design review.'", "question": "What is the most significant gap in this situation?", "options": [{"letter": "A", "text": "The engineering team should have used a smaller model to reduce latency during design.", "correct": false, "explanation": "Choosing an implementation to reduce latency is a downstream design decision; it cannot be evaluated as right or wrong without first knowing what latency target was actually owed to the stakeholder."}, {"letter": "B", "text": "The support team should stop escalating latency complaints since the design was already reviewed.", "correct": false, "explanation": "Suppressing the feedback signal does not resolve the underlying absence of an agreed target; it removes the only evidence that the current behavior might be unacceptable."}, {"letter": "C", "text": "No SLA was ever agreed and confirmed with the stakeholders who experience the latency, so 'acceptable' was never actually defined by anyone accountable for the user experience.", "correct": true, "explanation": "Silence during a design review is not the same as an agreed SLA; without a number that was explicitly negotiated and owned, the team has no basis for judging the current behavior acceptable, and the resulting gap is now surfacing as user complaints."}, {"letter": "D", "text": "The agent's error rate should be measured next since latency was already reviewed.", "correct": false, "explanation": "This changes the topic to a different metric rather than closing the actual gap identified in the scenario: an SLA on response time was never established or agreed."}], "correct": "C", "select": 1}, {"id": "p6-08", "domain": 6, "objective": "Manage stakeholder feedback loops and expectation alignment (including SLAs)", "situation": "You operate an agent under a signed SLA of 99.5% successful task completion measured monthly. This month's actual rate is 99.1%, driven by a spike in tool-call timeouts against a downstream API you do not own. The downstream team says the timeouts are 'within their normal variance.'", "question": "What is the correct next step in managing this SLA breach?", "options": [{"letter": "A", "text": "Quietly widen your internal success-rate calculation so the reported figure clears 99.5% next month.", "correct": false, "explanation": "Adjusting the measurement to hide a shortfall does not change the underlying failure rate the stakeholder is exposed to and converts an honest feedback signal into a misleading one."}, {"letter": "B", "text": "Escalate to end the contract with the downstream API provider immediately.", "correct": false, "explanation": "Ending a dependency relationship over one month of variance is a disproportionate action taken without first establishing whether the variance is chronic or exploring cheaper mitigations like retries or timeout budgets."}, {"letter": "C", "text": "Wait for next month's numbers before saying anything, since 'normal variance' from the other team suggests it will self-correct.", "correct": false, "explanation": "Taking the downstream team's informal reassurance at face value and delaying disclosure of a breach against a signed SLA withholds information the SLA's owner is entitled to have promptly."}, {"letter": "D", "text": "Report the actual 99.1% figure against the agreed SLA, attribute the root cause to downstream timeouts with evidence, and negotiate either a mitigation (e.g., retries, circuit breaker, timeout budget) or a revised SLA that accounts for the dependency.", "correct": true, "explanation": "An SLA breach must be reported against the number actually agreed, with the observed root cause, so that stakeholders can jointly decide whether to fix the dependency, add resilience, or renegotiate the target realistically."}], "correct": "D", "select": 1}, {"id": "p6-09", "domain": 6, "objective": "Manage stakeholder feedback loops and expectation alignment (including SLAs)", "situation": "Three months after launch, a stakeholder says the agent 'used to feel smarter.' No SLA covers subjective quality. The team has no baseline evaluation scores from launch to compare against, only anecdotal impressions from both sides.", "question": "What should be established to manage this feedback loop going forward?", "options": [{"letter": "A", "text": "A recurring, versioned evaluation benchmark run against a fixed test set, with results shared with the stakeholder on a regular cadence so 'feels smarter/worse' claims can be checked against a number.", "correct": true, "explanation": "Without a repeatable, shared benchmark, quality complaints stay anecdotal and unresolvable in either direction; a fixed test set run on a cadence turns subjective impressions into a trackable, agreed signal both sides can reference."}, {"letter": "B", "text": "A promise to the stakeholder that the model will not be changed again without their approval.", "correct": false, "explanation": "Freezing all changes trades away the ability to improve or patch the system and does not address the actual gap, which is the absence of any way to measure whether quality changed."}, {"letter": "C", "text": "A statement that perceived quality is subjective and cannot be measured, so the complaint should be closed.", "correct": false, "explanation": "Dismissing the complaint as unmeasurable ignores that structured evaluations (accuracy on a fixed test set, task success rate) can quantify quality drift even when the original stakeholder language is informal."}, {"letter": "D", "text": "An apology and a promise to 'keep an eye on it' informally.", "correct": false, "explanation": "An informal promise creates no artifact or cadence that either side can point to later, so the same ungrounded disagreement will recur the next time perceived quality shifts."}], "correct": "A", "select": 1}, {"id": "p6-10", "domain": 6, "objective": "Manage stakeholder feedback loops and expectation alignment (including SLAs)", "situation": "A fraud-detection agent achieved 96% precision during a two-week pilot evaluated on a curated sample of historical cases selected by the data science team. After full production rollout across all live transaction volume, the operations team reports the agent 'isn't as good as promised,' and precision measured with the same metric definition comes out lower in production.", "question": "What expectation-management step would have most reduced this friction before rollout?", "options": [{"letter": "A", "text": "Promise operations that production performance would exactly match the pilot number once volume increased.", "correct": false, "explanation": "Promising equivalence between a curated pilot sample and full, unfiltered production traffic sets an expectation the underlying data does not support, and the gap resurfaces as a broken promise."}, {"letter": "B", "text": "Explicitly tell stakeholders, before rollout, that pilot metrics were measured on a curated sample and that production performance on the full, unfiltered traffic distribution should be expected to differ, with a plan to re-baseline the target once live volume is observed.", "correct": true, "explanation": "Naming, before rollout, that the pilot measured a curated sample and that production numbers on full traffic may differ turns an unavoidable measurement gap into a set expectation instead of a surprise, and pairs it with a concrete plan to re-baseline against live data."}, {"letter": "C", "text": "Wait until operations raises a formal complaint before discussing any difference between pilot and production numbers.", "correct": false, "explanation": "Waiting for a formal complaint is reactive; the gap between pilot and production measurement conditions was foreseeable before rollout and should have been surfaced proactively."}, {"letter": "D", "text": "Report only the pilot number in ongoing communications since it was the original approved figure.", "correct": false, "explanation": "Continuing to cite only the pilot figure after rollout misrepresents current performance and delays the moment operations learns the two numbers were never expected to match exactly."}], "correct": "B", "select": 1}, {"id": "p6-11", "domain": 6, "objective": "Document architectures and provide implementation guidance", "situation": "You designed a multi-tool agent for internal IT ticket resolution. The architecture document lists the tools and the model used but does not describe what happens when a tool call fails, what the fallback behavior is, or which team is paged when the agent cannot complete a ticket.", "question": "What is missing from this architecture documentation that most directly creates operational risk?", "options": [{"letter": "A", "text": "A diagram showing the visual layout of the agent's components.", "correct": false, "explanation": "A missing diagram is a presentation gap, not an operational one; the document already conveys the components in text, so this omission does not by itself cause an incident."}, {"letter": "B", "text": "A list of all the programming languages used to build the tools.", "correct": false, "explanation": "Implementation language detail does not affect an operator's ability to respond to a failure and is not the missing piece that creates operational risk here."}, {"letter": "C", "text": "Failure-mode behavior and ownership: what the agent does on tool failure, the fallback path, and which team is paged, so an on-call responder knows what to do when the agent cannot complete a ticket.", "correct": true, "explanation": "Documentation that lists happy-path components but omits failure handling and escalation ownership leaves on-call staff without a runbook exactly when they need one most: during an incident, which is the concrete consequence of this gap."}, {"letter": "D", "text": "The historical version numbers of the model used during development.", "correct": false, "explanation": "Version history is useful for audit trails but does not tell an on-call responder what to do when the agent cannot complete a ticket, which is the actual gap described."}], "correct": "C", "select": 1}, {"id": "p6-12", "domain": 6, "objective": "Document architectures and provide implementation guidance", "situation": "A junior engineer is implementing a new tool for an existing agent based on your architecture document. The document states the overall design philosophy ('the agent should minimize unnecessary tool calls') but gives no example of how to structure a new tool's input schema or error responses consistent with existing tools.", "question": "What should the documentation add to make it actionable implementation guidance rather than only a design philosophy?", "options": [{"letter": "A", "text": "A longer restatement of the design philosophy in different words.", "correct": false, "explanation": "Rephrasing the same principle does not give the engineer anything concrete to copy or check their work against; the gap is the absence of a concrete pattern, not insufficient explanation of the philosophy."}, {"letter": "B", "text": "A statement that the engineer should ask the architect before writing any code.", "correct": false, "explanation": "Requiring a synchronous check-in for every new tool does not scale and does not fix the actual documentation gap, which is the missing reusable pattern."}, {"letter": "C", "text": "A note that code review will catch any inconsistencies.", "correct": false, "explanation": "Relying on review to catch problems after implementation is a slower and costlier way to enforce consistency than giving the engineer the pattern up front."}, {"letter": "D", "text": "A concrete worked example: a reference tool schema, its error-response format, and the acceptance criteria a new tool must meet to be consistent with existing ones.", "correct": true, "explanation": "Implementation guidance must translate a philosophy into a pattern an engineer can follow and check against; a reference schema and explicit acceptance criteria let the junior engineer self-verify consistency instead of guessing what 'minimize unnecessary tool calls' implies for schema design."}], "correct": "D", "select": 1}, {"id": "p6-13", "domain": 6, "objective": "Document architectures and provide implementation guidance", "situation": "Your team is about to hand off an agentic pipeline to a separate operations team. The architecture doc explains the agent's reasoning approach in detail but is otherwise silent on how to operate the system day to day.", "question": "Which two additions to the documentation would most directly reduce the operations team's mean time to resolve an incident? (Select TWO.)", "options": [{"letter": "A", "text": "A more detailed narrative of the theoretical reasoning framework the agent's prompting strategy is based on.", "correct": false, "explanation": "Additional theory about the reasoning approach does not give operations anything actionable during an incident; the document already covers reasoning approach in detail and the gap is operational, not conceptual."}, {"letter": "B", "text": "A history of every experiment the team ran before choosing the current prompt.", "correct": false, "explanation": "A full experiment history is background context, not an operational tool; it does not tell operations how to roll back a bad change or reproduce a failure right now."}, {"letter": "C", "text": "A complete reference table of every environment variable that controls the agent's behavior, with a one-line description of each, but no guidance on how to change one safely or what to do if a value is wrong.", "correct": false, "explanation": "A reference table documents what exists but not a response procedure; it does not tell an operator how to change a value safely mid-incident or what to do if a setting turns out to be the cause, so it is less directly MTTR-reducing than a rollback path or a reproduction guide."}, {"letter": "D", "text": "A rollback procedure for prompt and configuration changes, including what a safe previous state looks like and how to restore it.", "correct": true, "explanation": "When a change causes a regression, a documented rollback path is the fastest way to restore service; without it the operations team must improvise recovery during an active incident."}, {"letter": "E", "text": "A reproduction guide describing how to replay a reported failure locally or in a sandbox using the same inputs, so operations can diagnose without needing the original architects.", "correct": true, "explanation": "The ability to reproduce a failure independently is what lets operations diagnose and fix issues without waiting on the original design team, directly shortening incident resolution time."}], "correct": ["D", "E"], "select": 2}, {"id": "p6-14", "domain": 6, "objective": "Document architectures and provide implementation guidance", "situation": "A compliance policy requires that any agent touching customer PII must mask specific fields before they reach the model context. The architecture document states this rule as a paragraph of prose in an appendix, but no test, code check, or logging exists that would catch a future tool addition that bypasses masking.", "question": "What is the central documentation and design gap here?", "options": [{"letter": "A", "text": "The masking rule should be moved to the beginning of the document instead of the appendix.", "correct": false, "explanation": "Reordering the document changes where a reader finds the rule but does not change whether the system actually enforces it against a future violation."}, {"letter": "B", "text": "The policy is documented as prose only, with no enforcing check or evidence trail, so a future tool addition could violate it without detection; the gap is a policy that is not implemented as an enforced, verifiable control.", "correct": true, "explanation": "A policy written down but not backed by a test, code check, or log that produces evidence is not actually a control; the documentation gap here is the absence of guidance and mechanism for verifying and enforcing the rule, not merely its physical location in the document."}, {"letter": "C", "text": "The prose should be translated into a different human language for wider readability.", "correct": false, "explanation": "Language translation does not address whether the system detects or prevents a violation of the masking rule; it is unrelated to the enforcement gap."}, {"letter": "D", "text": "The document should credit the compliance team by name for authoring the rule.", "correct": false, "explanation": "Attribution has no bearing on whether the masking rule is actually enforced by the system and does not address the described gap."}], "correct": "B", "select": 1}, {"id": "p6-15", "domain": 6, "objective": "Support lifecycle phases (discovery, design, handoff, monitoring, iteration)", "situation": "An agent is being handed off from the build team to a support team after a successful pilot. The handoff meeting covers the demo but no runbook, on-call rotation, or alert thresholds are defined. Two weeks after handoff, the agent starts silently returning empty responses for a subset of queries and no one notices for three days.", "question": "Which lifecycle-phase gap is most directly responsible for the three-day detection delay?", "options": [{"letter": "A", "text": "The discovery phase failed to gather enough requirements from end users.", "correct": false, "explanation": "This incident is about detecting a live production failure, not about the completeness of upfront requirements gathering, which is a separate phase and separate failure mode."}, {"letter": "B", "text": "The design phase chose the wrong model for the task.", "correct": false, "explanation": "Model selection quality is unrelated to why nobody noticed the failure for three days; even a well-chosen model can fail silently without monitoring in place."}, {"letter": "C", "text": "The handoff did not establish monitoring alert thresholds or an on-call runbook, so no one was positioned to detect or respond to the failure before it had been running for days.", "correct": true, "explanation": "Moving from build to support without defined alert thresholds and an on-call runbook means there is no mechanism to surface a silent failure; this is precisely the handoff-to-monitoring gap that let the empty-response issue run undetected."}, {"letter": "D", "text": "The iteration phase did not schedule enough future feature releases.", "correct": false, "explanation": "Feature roadmap cadence has no bearing on the ability to detect an active production failure, which is a monitoring and handoff concern, not an iteration-planning one."}], "correct": "C", "select": 1}, {"id": "p6-16", "domain": 6, "objective": "Support lifecycle phases (discovery, design, handoff, monitoring, iteration)", "situation": "A team is in the iteration phase of an agent that has been live for six months. A proposed change would swap in a newer, cheaper model. The team plans to ship the swap directly to production because 'it's the same interface,' without re-running the evaluation suite used at launch or comparing task-success metrics.", "question": "What is the risk in this iteration-phase plan?", "options": [{"letter": "A", "text": "The newer model may have a different name that confuses users.", "correct": false, "explanation": "Model naming is not user-facing in most agent deployments and is not the operationally significant risk in a silent model swap."}, {"letter": "B", "text": "The cheaper model will definitely increase latency.", "correct": false, "explanation": "This asserts a specific and unsupported outcome (increased latency) as the risk, when the actual, evidenced risk in the scenario is skipping evaluation before a behavior-affecting swap."}
