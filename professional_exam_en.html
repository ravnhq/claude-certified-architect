<style>
/* Ravn Brand System — dark canvas, white text, muted gray, single gold accent.
   Flat (no shadows/gradients), Work Sans + Source Code Pro. Functional red is
   kept only for wrong-answer / fail feedback; green marks correct answers;
   gold carries selection / emphasis. */
:root {
  --bg: #161616; --surface: #1d1d1d; --surface-2: #222222;
  --fg: #FFFFFF; --fg-soft: #D4D4D4; --muted: #ADB5BD; --subtle: #8B949E;
  --border: #2A2A2A; --border-strong: #3A3A3A;
  --gold: #B7986A; --gold-soft: rgba(183,152,106,0.12); --gold-fg: #161616;
  --bad: #C16B57; --bad-soft: rgba(193,107,87,0.14);
  --good: #6FA97C; --good-soft: rgba(111,169,124,0.14); --good-fg: #161616;
  --r-sm: 4px; --r-md: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.6; background: var(--bg); color: var(--fg);
  height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased; }

.ravn-topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
  justify-content: space-between; padding: 12px 32px; background: var(--bg); color: var(--fg);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ravn-brand { display: inline-flex; align-items: center; gap: 16px; color: var(--fg);
  text-decoration: none; font-weight: 600; }
.ravn-brand:hover { color: var(--gold); }
.ravn-brand svg { height: 20px; width: auto; fill: currentColor; flex-shrink: 0; }
.ravn-brand-tagline { font-size: 12px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.167em; font-weight: 600; }

/* Mode toggle in the brand bar */
.mode-toggle { display: inline-flex; align-items: center; gap: 0; background: transparent;
  border: 1px solid var(--border-strong); border-radius: var(--r-md); overflow: hidden; }
.mode-toggle button { background: none; border: none; color: var(--muted); cursor: pointer;
  font-family: inherit; font-size: 11.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.1em; padding: 6px 14px; transition: background .15s, color .15s; }
.mode-toggle button.active { background: var(--gold); color: var(--gold-fg); }
.mode-hint { font-size: 11.5px; color: var(--subtle); margin-left: 12px; }
.mode-controls { display: flex; align-items: center; }

.shell { display: flex; flex: 1; min-height: 0; overflow: hidden; }

.sidebar { width: 272px; min-width: 272px; background: var(--surface); color: var(--muted);
  display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  border-right: 1px solid var(--border); }
.sidebar-header { padding: 18px 16px 12px; font-size: 11.5px; font-weight: 600;
  letter-spacing: .167em; text-transform: uppercase; color: var(--gold);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-progress { padding: 10px 16px; font-size: 12px; color: var(--muted);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-progress span { color: var(--fg); font-weight: 600; }
.sidebar-scroll { overflow-y: auto; flex: 1; padding: 8px 0; }
.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

.domain-group { margin-bottom: 6px; }
.domain-label { padding: 8px 16px 5px; font-size: 10px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; gap: 8px; }
.domain-label .dl-weight { color: var(--subtle); font-weight: 600; }
.q-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 16px;
  background: none; border: none; cursor: pointer; font-size: 13.5px; color: var(--muted);
  font-family: inherit; text-align: left; transition: background .15s, color .15s;
  border-left: 3px solid transparent; }
.q-btn:hover { background: var(--surface-2); color: var(--fg); }
.q-btn.active { background: var(--gold-soft); color: var(--gold); border-left-color: var(--gold); }
.q-btn.answered .q-dot { background: var(--gold); }
.q-btn.answered-correct { color: var(--good); }
.q-btn.answered-correct .q-dot { background: var(--good); }
.q-btn.answered-wrong { color: var(--bad); }
.q-btn.answered-wrong .q-dot { background: var(--bad); }
.q-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--subtle);
  flex-shrink: 0; transition: background .2s; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; min-width: 0; }
.topbar { background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 32px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-title { font-size: 15px; font-weight: 600; color: var(--fg); }
.topbar-nav { display: flex; gap: 10px; align-items: center; }
.nav-btn { padding: 8px 18px; border-radius: var(--r-md); border: 1px solid var(--border-strong);
  background: transparent; font-family: inherit; font-size: 12px; cursor: pointer; color: var(--muted);
  font-weight: 600; text-transform: uppercase; letter-spacing: .1em; transition: all .15s; }
.nav-btn:hover { color: var(--fg); border-color: var(--gold); }
.nav-btn:disabled { opacity: .35; cursor: default; }
.nav-btn.finish { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.nav-btn.finish:hover { background: var(--gold); border-color: var(--gold); color: var(--gold-fg); }
.q-counter { font-size: 13px; color: var(--muted); font-weight: 500; }

.content { flex: 1; overflow-y: auto; padding: 36px 48px; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.q-card { max-width: 820px; margin: 0 auto; }
.q-domain { display: inline-block; background: transparent; color: var(--fg); font-size: 11px;
  font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 4px 11px;
  border: 1px solid var(--border-strong); border-radius: var(--r-sm); margin-bottom: 8px; }
.q-scenario { display: inline-block; background: transparent; color: var(--gold); font-size: 11px;
  font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 4px 11px;
  border: 1px solid var(--gold); border-radius: var(--r-sm); margin-bottom: 16px; margin-left: 8px; }
.q-number { font-size: 11px; color: var(--subtle); margin-bottom: 6px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; }
.q-situation { font-size: 16.5px; color: var(--fg-soft); font-weight: 400; line-height: 1.7;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 16px 20px; margin-bottom: 22px; }
.q-situation code, .opt-text code, .explanation code, .opt-expl code {
  background: var(--surface-2); padding: 1px 5px; border-radius: var(--r-sm);
  font-family: "Source Code Pro", ui-monospace, Menlo, Monaco, monospace; font-size: 13.5px; color: var(--gold); }
.q-prompt { font-size: 17px; font-weight: 700; color: var(--fg); margin-bottom: 20px; }

.q-select { display: inline-block; background: var(--gold-soft); color: var(--gold); font-size: 11.5px;
  font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 12px;
  border-radius: var(--r-sm); margin-bottom: 16px; }
.q-select-hint { font-size: 12.5px; color: var(--subtle); margin: -8px 0 16px; }
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.option { border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface);
  transition: border-color .15s, background .15s; overflow: hidden; }
.option-head { display: flex; align-items: flex-start; gap: 14px; width: 100%; padding: 14px 18px;
  border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.option-head:focus-visible { outline: 2px solid var(--gold); outline-offset: -3px; }
.option:hover:not(.locked):not(.dimmed) .option-head { background: var(--surface-2); }
.option:hover:not(.locked):not(.dimmed) { border-color: var(--gold); }
.option.locked .option-head, .option-head[aria-disabled="true"] { cursor: default; }
.option.locked .option-head:disabled { opacity: 1; }
.option.selected { border-color: var(--gold); }
.opt-letter { width: 30px; height: 30px; min-width: 30px; border-radius: 50%; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  color: var(--muted); transition: background .2s, color .2s; flex-shrink: 0; }
.option.selected .opt-letter { background: var(--gold); color: var(--gold-fg); }
.opt-text { font-size: 15px; color: var(--fg-soft); line-height: 1.55; padding-top: 3px; }
.option.correct { border-color: var(--good); background: var(--good-soft); }
.option.correct .opt-letter { background: var(--good); color: var(--good-fg); }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.wrong .opt-letter { background: var(--bad); color: #fff; }
.option.dimmed { opacity: .5; }
.opt-expl { display: none; font-size: 13.5px; line-height: 1.6; color: var(--muted);
  padding: 0 18px 14px 62px; }
.option.locked .opt-expl.show { display: block; }
.option.correct .opt-expl { color: var(--good); }
.option.wrong .opt-expl { color: var(--bad); }

.explanation { margin-top: 4px; padding: 14px 18px; background: var(--surface);
  border-left: 3px solid var(--gold); border-radius: 0 var(--r-md) var(--r-md) 0; font-size: 14.5px;
  color: var(--muted); line-height: 1.65; display: none; }
.explanation.show { display: block; }
.explanation strong { color: var(--gold); }

.summary { max-width: 860px; margin: 0 auto; display: none; }
.summary.show { display: block; }
.summary h1 { font-size: 26px; font-weight: 800; color: var(--fg); margin-bottom: 6px; }
.summary-subtitle { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
.verdict { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; padding: 7px 18px; border-radius: var(--r-sm); margin-bottom: 22px; }
.verdict.pass { background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold); }
.verdict.fail { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.score-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 14px; }
.score-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 20px; text-align: center; }
.score-card .big { font-size: 38px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
.score-card .label { font-size: 11px; color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .12em; }
.score-card.total .big { color: var(--fg); }
.score-card.correct-c .big { color: var(--good); }
.score-card.wrong-c .big { color: var(--bad); }
.threshold-note { font-size: 12.5px; color: var(--subtle); margin-bottom: 26px; }

.domain-scores { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 8px 20px; margin-bottom: 26px; }
.ds-row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.ds-row:last-child { border-bottom: none; }
.ds-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--fg); }
.ds-name small { color: var(--subtle); font-weight: 500; }
.ds-bar { width: 160px; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.ds-bar > div { height: 100%; background: var(--gold); }
.ds-bar > div.low { background: var(--muted); }
.ds-bar > div.bad { background: var(--bad); }
.ds-pct { width: 92px; text-align: right; font-size: 13px; color: var(--muted); font-weight: 600; }

.section-title { font-size: 18px; font-weight: 700; color: var(--fg); margin-bottom: 12px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.group-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 18px 20px; margin-bottom: 16px; }
.group-title { font-size: 15px; font-weight: 700; color: var(--fg); margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px; }
.group-badge { font-size: 10px; padding: 3px 10px; border-radius: var(--r-sm); font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; background: var(--bad-soft); color: var(--bad); }
.wrong-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0;
  border-bottom: 1px solid var(--border); font-size: 14px; color: var(--muted); }
.wrong-item:last-child { border-bottom: none; }
.wrong-item .wi-n { min-width: 36px; font-weight: 700; color: var(--subtle); font-size: 12px; padding-top: 2px; }
.wrong-item .wi-q { flex: 1; }
.wrong-item .wi-situation { font-size: 13.5px; color: var(--fg-soft); font-weight: 500; margin-bottom: 4px; line-height: 1.5; }
.wrong-item .wi-prompt { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 4px; }
.wrong-item .wi-ans { font-size: 12.5px; margin-top: 3px; color: var(--muted); }
.wi-wrong-tag { color: var(--bad); font-weight: 700; }
.wi-correct-tag { color: var(--good); font-weight: 700; }
.wi-expl { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: var(--r-sm);
  padding: 8px 10px; margin-top: 6px; line-height: 1.55; }

.restart-btn { margin-top: 28px; padding: 12px 32px; background: var(--fg); color: var(--bg);
  border: none; border-radius: var(--r-md); font-family: inherit; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em; cursor: pointer; transition: background .15s, color .15s; }
.restart-btn:hover { background: var(--gold); color: var(--gold-fg); }
.screen { display: none; }
.screen.active { display: block; }

@media (max-width: 760px) {
  html, body { height: auto; }
  body { min-height: 100vh; height: auto; overflow: auto; display: block; }
  .ravn-topbar { position: static; padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
  .ravn-brand-tagline { display: none; }
  .mode-controls { max-width: 100%; flex-wrap: wrap; gap: 6px 0; }
  .mode-hint { margin-left: 8px; }
  .shell { display: block; overflow: visible; }
  .sidebar { width: 100%; min-width: 0; height: 220px; min-height: 0;
    border-right: 0; border-bottom: 1px solid var(--border); }
  .main { overflow: visible; }
  .topbar { padding: 12px 16px; gap: 10px; flex-wrap: wrap; }
  .topbar-title { width: 100%; }
  .topbar-nav { width: 100%; flex-wrap: wrap; gap: 8px; }
  .content { overflow: visible; padding: 24px 16px 48px; }
  .q-scenario { display: block; width: fit-content; margin-left: 0; }
  .score-grid { grid-template-columns: 1fr; }
  .ds-row { flex-wrap: wrap; }
  .ds-name { flex-basis: 100%; }
  .ds-bar { flex: 1; min-width: 140px; }
}

@media (max-width: 420px) {
  .mode-hint { width: 100%; margin-left: 0; }
  .nav-btn { padding: 7px 11px; }
  .q-counter { width: 100%; }
  .wrong-item { display: block; }
  .wrong-item .wi-n { margin-bottom: 4px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
</style>

<script>
const QUESTIONS = [{"id": "p1-01", "domain": 1, "objective": "Translate business problems into Claude-based AI solutions", "situation": "A mid-size insurer's claims team spends most of its day re-typing data from scanned intake forms and PDF attachments into the claims system, then manually checking each claim against a 40-page policy handbook before routing it. Leadership wants to 'use AI' but has not stated a specific technical approach.", "question": "Which framing best translates this business problem into a Claude-based solution scope?", "options": [{"letter": "A", "text": "Scope the solution as document extraction from scans/PDFs feeding a policy-lookup and eligibility check, with human review before final routing.", "correct": true, "explanation": "This decomposes the stated pain points (manual re-typing, manual handbook lookup) into concrete capabilities Claude can perform reliably, and preserves a human checkpoint where the business impact of an error is highest."}, {"letter": "B", "text": "Deploy a single general-purpose chat assistant and let claims staff ask it questions about policies as needed.", "correct": false, "explanation": "This treats a document-extraction-and-rules problem as an open-ended chat problem. It leaves the manual re-typing step untouched and does nothing to structure the extraction-then-lookup workflow the team actually needs."}, {"letter": "C", "text": "Recommend the team adopt an agentic system that autonomously approves or denies claims end-to-end to remove human effort entirely.", "correct": false, "explanation": "Nothing in the business problem asked for autonomous approval authority, and granting it here adds risk and complexity the requirement never earned. Full autonomy on financial decisions is a scope expansion, not a translation of the stated need."}, {"letter": "D", "text": "Recommend a data warehouse migration so claims data is centralized before any AI work begins.", "correct": false, "explanation": "This addresses a plausible but unstated infrastructure concern instead of the business problem described (manual extraction and lookup). It substitutes a different project for the one requested."}], "correct": "A", "select": 1}, {"id": "p1-02", "domain": 1, "objective": "Design end-to-end architectures (input → processing → output → feedback loops)", "situation": "A support-ticket triage system ingests customer emails, classifies them with Claude, drafts a suggested reply, and sends the draft to an agent for approval before it goes out. After three months, the team notices classification accuracy is slowly declining even though the model and prompt have not changed.", "question": "Which architectural addition would most directly help the team both diagnose and correct this drift over time?", "options": [{"letter": "A", "text": "Increase the model's temperature so it produces more varied classifications and 'shakes off' the drift.", "correct": false, "explanation": "Temperature controls output randomness, not classification correctness against a changing ticket distribution. This would add noise without addressing the actual cause of drift."}, {"letter": "B", "text": "Add a structured feedback loop that logs agent corrections to each classification and periodically feeds a labeled sample back into prompt and example review.", "correct": true, "explanation": "The system already has a human-in-the-loop approval step; capturing what agents change turns that step into a data source. Closing input→processing→output→feedback lets the team see whether ticket content has shifted (new categories, new phrasing) and update the prompt/examples deliberately."}, {"letter": "C", "text": "Replace the classification step with a larger model without changing anything else.", "correct": false, "explanation": "Swapping models before diagnosing the cause assumes the problem is model capability. Since the model and prompt are unchanged, the more likely cause is a shift in incoming ticket content, which a bigger model alone will not reveal or fix."}, {"letter": "D", "text": "Remove the human approval step to speed up processing and reduce review fatigue.", "correct": false, "explanation": "Removing the one checkpoint that currently surfaces classification errors would eliminate the team's best evidence about what is going wrong, and would send unreviewed drafts straight to customers."}], "correct": "B", "select": 1}, {"id": "p1-03", "domain": 1, "objective": "Select appropriate architectural patterns (workflow, agentic, augmented LLM)", "situation": "A team must build a system that takes a structured invoice PDF, extracts five fixed fields, validates them against a vendor master list, and writes the result to a database. The steps and their order never vary between invoices.", "question": "Which architectural pattern best fits this task?", "options": [{"letter": "A", "text": "A multi-agent system where separate agents negotiate the extracted values before writing to the database.", "correct": false, "explanation": "Negotiation between agents is unneeded machinery for a task with a single fixed sequence and no competing objectives to reconcile. It adds coordination overhead the requirement never asked for."}, {"letter": "B", "text": "A fully autonomous agent that decides at runtime which tools to call and in what order for each invoice.", "correct": false, "explanation": "Letting the model choose the order of steps costs complexity and predictability that the task doesn't need — the sequence is fixed and known, so the least-complex option is preferred."}, {"letter": "C", "text": "A fixed workflow with discrete extraction, validation, and write steps, each with clear inputs and outputs.", "correct": true, "explanation": "The steps and their order are known in advance and do not vary, which is exactly the case a predefined workflow handles well: predictable, auditable, and cheaper to run than a system that has to decide its own steps."}, {"letter": "D", "text": "An augmented LLM call with no external tools, relying on the model's training data for the vendor master list.", "correct": false, "explanation": "The vendor master list is an external, changing data source; the model cannot validate against it reliably from parametric knowledge alone, and this option skips the retrieval/validation step entirely."}], "correct": "C", "select": 1}, {"id": "p1-04", "domain": 1, "objective": "Design multi-agent systems and orchestration strategies", "situation": "A market-research firm wants a system that can research a topic across dozens of independent web sources, then synthesize a report. Each sub-topic can be researched independently and does not depend on the results of the others.", "question": "Which orchestration strategy best matches this task's structure?", "options": [{"letter": "A", "text": "A single agent that processes each source strictly one after another in a long sequential loop.", "correct": false, "explanation": "Sequential processing is safe but ignores that the sub-topics are independent; it leaves a natural parallelization opportunity unused and will be slower than necessary for no accuracy benefit."}, {"letter": "B", "text": "A chain of agents where each agent's only input is the previous agent's full output, with no orchestrator.", "correct": false, "explanation": "This forces an artificial sequential dependency onto sub-topics that are actually independent, and gives no agent a global view needed to plan and later synthesize the research."}, {"letter": "C", "text": "A single monolithic prompt asking one model call to research and write the entire report in one pass.", "correct": false, "explanation": "A single call cannot browse dozens of independent sources across a genuinely broad topic; it collapses a decomposable, parallelizable task into one context window and loses the benefit of dividing the work."}, {"letter": "D", "text": "One orchestrator agent that dispatches independent research subtasks to worker agents in parallel, then a synthesis step that combines their outputs.", "correct": true, "explanation": "Because the sub-topics do not depend on each other, an orchestrator–worker pattern lets the independent research run in parallel while a single synthesis step handles the only genuinely sequential dependency: combining results after research completes."}], "correct": "D", "select": 1}, {"id": "p1-05", "domain": 1, "objective": "Apply decomposition techniques for complex problem solving", "situation": "A logistics company asks for a system that reads a shipment exception email, determines the root cause, checks contractual penalty terms, drafts a customer notification, and updates the shipment record. The team is unsure how to structure this as a single prompt.", "question": "What is the best first step in decomposing this problem?", "options": [{"letter": "A", "text": "Break the problem into its constituent sub-tasks — cause classification, penalty-term lookup, notification drafting, record update — and design each as a separate, independently testable step.", "correct": true, "explanation": "Decomposing along natural task boundaries lets each step use the right technique (classification, retrieval, generation, structured write) and be evaluated and debugged on its own, before considering how to wire them together."}, {"letter": "B", "text": "Write one very long prompt covering all four tasks and tune it until outputs look reasonable in spot checks.", "correct": false, "explanation": "Bundling distinct sub-tasks (diagnosis, contract lookup, drafting, record update) into one prompt makes failures hard to attribute to a specific step and hard to test independently."}, {"letter": "C", "text": "Skip decomposition and build a single autonomous agent with all four capabilities as tools, since agents can figure out the sub-tasks themselves.", "correct": false, "explanation": "Handing an undecomposed problem to an agent does not remove the need to think through sub-tasks — it just defers that thinking to runtime, making the system harder to test and its failures harder to localize."}, {"letter": "D", "text": "Decompose by customer account size instead of by task type, building a separate pipeline per account tier.", "correct": false, "explanation": "This decomposes along a dimension (account tier) unrelated to the actual complexity driver (four different kinds of sub-task), and would duplicate the same undecomposed problem across tiers."}], "correct": "A", "select": 1}, {"id": "p1-06", "domain": 1, "objective": "Align solutions to business value pillars (efficiency, transformation, productivity, cost, performance SLAs)", "situation": "A retailer's leadership approves budget for an AI project but tells the architect only 'make customer service faster.' The current live-chat SLA requires first response within 30 seconds, and the team already has a rule-based FAQ bot with high abandonment.", "question": "Which proposal best aligns the solution to the stated business value pillar while respecting the existing constraint?", "options": [{"letter": "A", "text": "Build a large multi-agent research system that analyzes each customer's full purchase history before responding.", "correct": false, "explanation": "Deep per-customer research adds latency that risks breaking the 30-second SLA and pursues thoroughness the leadership did not ask for, at the expense of the speed goal actually stated."}, {"letter": "B", "text": "Replace the FAQ bot with a Claude-based responder tuned for fast first-response drafting within the 30-second SLA, escalating complex queries to humans.", "correct": true, "explanation": "This targets the named pillar (speed/efficiency) directly, respects the explicit SLA constraint, and keeps a human escalation path for cases outside the bot's reliable range — matching effort to the stated goal without overreaching."}, {"letter": "C", "text": "Focus the project on reducing cloud infrastructure cost, since that is the easiest metric to report to leadership.", "correct": false, "explanation": "Cost reduction is a valid pillar in general but is not what leadership asked for here; substituting an easier-to-report goal for the stated one misaligns the solution with the actual business ask."}, {"letter": "D", "text": "Keep the existing rule-based FAQ bot unchanged and add a dashboard reporting its abandonment rate.", "correct": false, "explanation": "Measuring the problem is not the same as solving it; a dashboard alone does not make customer service faster and leaves the stated business goal unaddressed."}], "correct": "B", "select": 1}, {"id": "p1-07", "domain": 1, "objective": "Translate business problems into Claude-based AI solutions", "situation": "A payroll team wants to reduce the volume of paycheck-discrepancy inquiries it handles each pay period. Investigation shows nine out of ten inquiries trace back to a single formula error in the payroll system that miscalculates overtime; resolving each inquiry currently means manually recomputing the correct amount by hand.", "question": "Which translation of this problem into a solution scope is best?", "options": [{"letter": "A", "text": "Fix the underlying overtime-calculation error in the payroll system first, and scope any Claude-based capability narrowly — for example, drafting explanations to employees from verified, corrected figures — as a secondary aid once the data itself is trustworthy.", "correct": true, "explanation": "Most of the inquiry volume stems from a data-correctness bug, not a missing information or generation capability; translating the problem correctly means fixing that root cause before scoping any AI-assisted layer on top of it, rather than building automation on top of numbers known to be wrong."}, {"letter": "B", "text": "Build an agentic system that automatically recalculates each employee's correct pay and issues refunds without any human review.", "correct": false, "explanation": "This grants autonomous authority over financial disbursements that the stated problem never asked for, and it treats symptom automation (handling inquiries faster) as a substitute for fixing the calculation error that is generating most of them."}, {"letter": "C", "text": "Build a Claude-based chatbot that explains the current (uncorrected) overtime calculation to employees who ask about their paycheck.", "correct": false, "explanation": "This automates communicating an answer that is still wrong for nine out of ten inquiries; it addresses the symptom (employees asking questions) while leaving the actual source of the discrepancies untouched."}, {"letter": "D", "text": "Recommend hiring additional payroll staff to handle the current volume of manual recalculation without introducing any automation.", "correct": false, "explanation": "This scales up effort spent working around a known bug instead of translating the business problem into a solution that removes its actual cause, and does not use Claude to address any part of the workflow leadership wants improved."}], "correct": "A", "select": 1}, {"id": "p1-08", "domain": 1, "objective": "Design end-to-end architectures (input → processing → output → feedback loops)", "situation": "An e-commerce company is designing a product-description generator. Inputs are structured product attributes from a catalog feed; outputs are marketing copy shown on the site. Merchandisers occasionally edit the generated copy before publishing.", "question": "Which end-to-end design best closes the loop from output back to future generations?", "options": [{"letter": "A", "text": "Publish generated copy directly to the site with no review, and periodically regenerate all descriptions from scratch.", "correct": false, "explanation": "This has no feedback loop at all: merchandiser edits are discarded on each regeneration, so the same mistakes can recur indefinitely."}, {"letter": "B", "text": "Ask merchandisers to fill out a separate satisfaction survey once a quarter about the tool.", "correct": false, "explanation": "A quarterly survey is a weak, indirect signal compared to the edits merchandisers already make every day; it is not the natural feedback artifact this workflow produces."}, {"letter": "C", "text": "Add a second LLM call that scores the first call's output for quality, with no connection to merchandiser edits.", "correct": false, "explanation": "A model grading its own sibling's output is not the same as feedback from the real-world outcome (what merchandisers actually chose to change); it can miss the specific errors humans are catching."}, {"letter": "D", "text": "Store merchandiser edits alongside the original generated draft, and use a sample of edit pairs to periodically refine prompt instructions or few-shot examples.", "correct": true, "explanation": "Capturing the diff between generated and published copy turns routine human editing into a structured feedback signal, closing the loop the architecture needs to actually improve over time rather than repeating the same errors."}], "correct": "D", "select": 1}, {"id": "p1-09", "domain": 1, "objective": "Select appropriate architectural patterns (workflow, agentic, augmented LLM)", "situation": "A software company is evaluating whether to build a fixed multi-step workflow or a more open agentic system for a new internal tool: an assistant that investigates a production incident by querying logs, correlating timestamps across services, and proposing a root cause. Some incidents resolve after checking a single service; others require tracing symptoms through several unrelated systems before a plausible cause emerges, and investigators currently keep a shared runbook of common failure signatures they consult as they go.", "question": "Which two properties of this task most justify choosing an agentic pattern over a fixed workflow? (Select TWO.)", "options": [{"letter": "A", "text": "The output needs to be a single natural-language paragraph.", "correct": false, "explanation": "Output format is unrelated to whether the control flow should be fixed or agentic; a workflow can also emit a natural-language paragraph as its final step."}, {"letter": "B", "text": "The company wants to reduce the total number of model calls compared to a workflow.", "correct": false, "explanation": "Agentic systems typically use more, not fewer, model calls than an equivalent fixed workflow due to iterative planning; cost reduction is not a reason to prefer agentic control."}, {"letter": "C", "text": "The sequence of investigative steps cannot be predetermined because it depends on what earlier steps reveal.", "correct": true, "explanation": "When the next action genuinely depends on the outcome of the previous one and can't be enumerated ahead of time, a fixed workflow can't represent the task well — this is a core justification for agentic control."}, {"letter": "D", "text": "The task requires calling more than one tool in total.", "correct": false, "explanation": "Calling multiple tools is common in workflows too; tool count alone does not distinguish workflow from agentic design, since a fixed workflow can call several tools in a known order."}, {"letter": "E", "text": "Deciding whether enough evidence has been gathered to propose a root cause is itself a judgment call that cannot be reduced to a fixed stopping rule.", "correct": true, "explanation": "Beyond just which step comes next, an agentic pattern also earns its complexity when the termination condition — when to stop investigating and commit to an answer — depends on judging the evidence gathered so far, something a fixed workflow cannot encode as a simple rule in advance."}], "correct": ["C", "E"], "select": 2}, {"id": "p1-10", "domain": 1, "objective": "Design multi-agent systems and orchestration strategies", "situation": "A legal-tech startup is building a contract review system. One agent extracts clauses, a second agent checks each clause against a compliance ruleset, and a third agent drafts redline suggestions. The team is debating how strictly to isolate each agent's context.", "question": "Which orchestration decision best limits error propagation between these agents?", "options": [{"letter": "A", "text": "Give all three agents shared, unrestricted access to each other's full conversation history so nothing gets lost.", "correct": false, "explanation": "Unrestricted shared context lets an early mistake (a mis-extracted clause) propagate unchecked into every downstream agent's reasoning, and adds irrelevant content that increases the chance of confusion at each step."}, {"letter": "B", "text": "Pass each agent only the structured output it needs from the previous step, with defined schemas for extracted clauses, compliance findings, and redline suggestions.", "correct": true, "explanation": "Constraining each agent's input to a well-defined, validated handoff limits how far an error in one stage can spread, and makes it possible to test and fix each stage independently — a core orchestration discipline for multi-agent pipelines."}, {"letter": "C", "text": "Merge all three agents into a single agent with one long combined prompt covering extraction, compliance checking, and redlining.", "correct": false, "explanation": "Collapsing distinct responsibilities into one prompt removes the isolation the team is trying to design for and makes it harder to localize which stage caused an error, undermining the reason for using multiple agents at all."}, {"letter": "D", "text": "Let the compliance-checking agent silently overwrite the extraction agent's output if it disagrees, without logging the change.", "correct": false, "explanation": "Silent overwrites destroy the audit trail needed to know which agent produced which result, making failures untraceable rather than isolated."}], "correct": "B", "select": 1}, {"id": "p1-11", "domain": 1, "objective": "Apply decomposition techniques for complex problem solving", "situation": "An architect is asked to design a system that plans a multi-city business trip: it must pick flights within budget, book hotels near meeting locations, and adjust the itinerary if a meeting time changes. The team wants to avoid over-engineering.", "question": "Which decomposition best matches the actual complexity of this problem without adding unearned machinery?", "options": [{"letter": "A", "text": "Build a five-agent negotiation system where flight, hotel, budget, calendar, and weather agents bargain over the final itinerary.", "correct": false, "explanation": "A weather agent and inter-agent bargaining were never requested and add coordination overhead disproportionate to a task with a small, enumerable set of constraints."}, {"letter": "B", "text": "Treat the whole task as one indivisible prompt asking the model to output a finished itinerary in a single pass with no tool calls.", "correct": false, "explanation": "Flight and hotel availability are external, time-varying facts the model cannot know from training data; a single no-tool pass cannot decompose the retrieval and constraint-checking the task actually needs."}, {"letter": "C", "text": "Decompose into independent tool-using steps (flight search, hotel search, constraint check) coordinated by a lightweight controller that re-runs the affected step when a meeting time changes.", "correct": true, "explanation": "This separates concerns along natural task boundaries and handles the one source of real dynamism in the requirement (meeting-time changes) with a targeted re-run, rather than adding capability the requirement never asked for."}, {"letter": "D", "text": "Decompose by day of the trip, running a completely separate independent pipeline for each day with no shared state.", "correct": false, "explanation": "Splitting by day rather than by function ignores that hotel and flight choices affect multiple days at once and would require re-deriving shared constraints (budget, meeting locations) redundantly in each day's pipeline."}], "correct": "C", "select": 1}, {"id": "p1-12", "domain": 1, "objective": "Align solutions to business value pillars (efficiency, transformation, productivity, cost, performance SLAs)", "situation": "A bank's engineering leadership frames a project goal as 'transformation, not just automation': they want the AI system to enable a new self-service loan pre-qualification product that did not exist before, not merely speed up the existing manual process.", "question": "Which proposal best aligns with the stated 'transformation' pillar rather than the 'efficiency' pillar alone?", "options": [{"letter": "A", "text": "Use Claude to auto-fill the existing loan officer's paperwork faster, keeping the current officer-mediated process otherwise unchanged.", "correct": false, "explanation": "This is a genuine efficiency improvement to the existing process, but it does not create a new product or capability, which is what the stated transformation goal calls for."}, {"letter": "B", "text": "Reduce the number of servers running the current loan-processing system to cut infrastructure spend.", "correct": false, "explanation": "This targets the cost pillar, not the transformation pillar leadership explicitly named, and does not change what the bank can offer customers."}, {"letter": "C", "text": "Add a chatbot that only answers FAQ questions about existing loan products, with no eligibility checking or decisioning.", "correct": false, "explanation": "An FAQ bot is a minor productivity aid, not a new product capability; it falls well short of the transformation the leadership described."}, {"letter": "D", "text": "Design a new customer-facing pre-qualification flow where Claude interviews the applicant, checks eligibility rules, and issues a preliminary decision the customer can act on directly — a capability the bank did not previously offer.", "correct": true, "explanation": "This creates a new self-service product rather than speeding up an existing manual step, matching the stated transformation goal instead of a narrower efficiency goal."}], "correct": "D", "select": 1}, {"id": "p1-13", "domain": 1, "objective": "Translate business problems into Claude-based AI solutions", "situation": "A manufacturer's quality team wants to reduce the number of defective units that reach customers. They currently rely on inspectors reading free-text maintenance logs to spot patterns, which is slow and inconsistent across inspectors, and today any patterns inspectors do notice are only compiled into a report after the affected units have already shipped.", "question": "Which solution best translates this problem, given the stated goal is fewer defective units reaching customers rather than simply faster log reading?", "options": [{"letter": "A", "text": "A tool that extracts recurring defect patterns and likely causes across maintenance logs and surfaces them to inspectors at the earliest point in the line where they can still act, before affected units ship, rather than only compiling patterns into an after-the-fact report.", "correct": true, "explanation": "Reducing defective units reaching customers depends on when a pattern is surfaced, not just whether it is surfaced; moving the same extraction capability earlier in the line, before shipment, is what actually moves the stated outcome metric rather than only saving inspectors reading time."}, {"letter": "B", "text": "A tool that condenses each day's maintenance logs into a shorter digest for inspectors to read, with no cross-log pattern extraction and no change to when inspectors see it relative to shipment.", "correct": false, "explanation": "A shorter digest may save inspectors some reading time, but it does not surface recurring patterns or change the point in the process where a pattern could still prevent a defective unit from reaching a customer — it targets reading speed, not the stated outcome."}, {"letter": "C", "text": "A system that rewrites the maintenance logs into more formal language for archival purposes.", "correct": false, "explanation": "Reformatting logs does not address the inspectors' actual difficulty — spotting patterns across many logs — and does not reduce defective units reaching customers."}, {"letter": "D", "text": "A recommendation to replace all inspectors with a single end-to-end computer vision system unrelated to the log data described.", "correct": false, "explanation": "This substitutes an entirely different technology and problem (vision-based inspection) for the one described (text log analysis), and discards the inspectors' expertise rather than augmenting it."}], "correct": "A", "select": 1}, {"id": "p1-14", "domain": 1, "objective": "Design end-to-end architectures (input → processing → output → feedback loops)", "situation": "A news aggregator uses Claude to generate short summaries of articles for a push notification. Editors have flagged that summaries occasionally state a fact that isn't actually in the source article. There is currently no step between generation and publishing.", "question": "Which change to the end-to-end architecture would most directly address the flagged problem?", "options": [{"letter": "A", "text": "Increase the length limit on generated summaries so the model has more room to be accurate.", "correct": false, "explanation": "Length limit is not the reported cause of the problem; longer summaries do not by themselves prevent claims that are unsupported by the source article."}, {"letter": "B", "text": "Insert a verification step that checks each claim in the generated summary against the source article text before publishing, and route unverifiable summaries to an editor.", "correct": true, "explanation": "This adds a processing stage that targets the specific failure mode reported (unsupported claims) at the point in the pipeline where it can still be caught before it reaches readers, closing the gap between generation and publishing."}, {"letter": "C", "text": "Remove summaries entirely and push the full article text as the notification.", "correct": false, "explanation": "This abandons the actual product requirement (short summaries) instead of fixing the specific defect (unsupported claims), and ignores the notification-length constraint implied by the push format."}, {"letter": "D", "text": "Switch to generating summaries in a different language, since translation may reduce inaccuracies.", "correct": false, "explanation": "There is no stated reason to believe language choice affects factual grounding; this does not address the reported failure mode at all."}], "correct": "B", "select": 1}, {"id": "p1-15", "domain": 1, "objective": "Select appropriate architectural patterns (workflow, agentic, augmented LLM)", "situation": "A team is building a tool that answers employee questions about company travel policy. The policy document changes a few times a year, and each answer must cite the specific policy section it drew from. There is no need for the tool to take any action beyond answering.", "question": "Which pattern is the best fit for this requirement?", "options": [{"letter": "A", "text": "A fully agentic system with autonomous planning and access to write tools, in case future requirements expand.", "correct": false, "explanation": "Write access and autonomous planning are not needed for a question-answering task with no action requirement; provisioning them speculatively adds risk and complexity the current requirement does not justify."}, {"letter": "B", "text": "A multi-agent system with a dedicated agent per policy category (travel, expense, leave) even though only travel policy Q&A was requested.", "correct": false, "explanation": "This expands scope beyond the stated requirement (travel policy only) and introduces multi-agent coordination for a task that is a single-domain retrieval-and-answer problem."}, {"letter": "C", "text": "An augmented LLM that retrieves relevant sections of the current policy document and generates an answer grounded in, and citing, those sections.", "correct": true, "explanation": "Retrieval-augmented generation matches the requirement exactly: the source document changes periodically (so retrieval keeps answers current) and citation is required, both of which an augmented LLM with a retrieval tool supports directly, without unnecessary orchestration."}, {"letter": "D", "text": "A model call with the entire policy history for all past years pasted into every prompt to be safe.", "correct": false, "explanation": "Pasting the full policy history ignores that only the current policy version needs to be cited, wastes context on irrelevant superseded content, and is not a retrieval strategy suited to a document that changes over time."}], "correct": "C", "select": 1}, {"id": "p1-16", "domain": 1, "objective": "Design multi-agent systems and orchestration strategies", "situation": "A team is designing a multi-agent system to handle enterprise IT helpdesk tickets: a triage agent classifies the ticket, a specialist agent (network, access, or hardware) resolves it, and an escalation agent hands off to a human when confidence is low. The team wants the orchestration to fail safely.", "question": "Which three design choices most directly improve safe failure handling in this multi-agent system? (Select THREE.)", "options": [{"letter": "A", "text": "Restrict each specialist agent (network, access, hardware) to only the tools and data scoped to its own domain, so a bug or bad output in one specialist cannot reach into another's actions or the ticket state at large.", "correct": true, "explanation": "Limiting each specialist's blast radius to its own domain means a failure in one specialist stays contained instead of propagating into unrelated actions, which is a distinct safe-failure property from how or when escalation is triggered."}, {"letter": "B", "text": "Set an explicit confidence threshold, produced by the triage agent's classification, below which tickets are routed to the escalation agent regardless of which specialist agent would otherwise have handled them.", "correct": true, "explanation": "A defined threshold operationalizes 'fail safely' — it guarantees low-confidence cases reach a human rather than being silently handled by a specialist agent that may be working outside its reliable range."}, {"letter": "C", "text": "Log each agent's inputs, outputs, and confidence so a failed resolution can be traced back to the step that produced it.", "correct": true, "explanation": "Traceable logs turn a policy of safe failure into an enforceable, auditable one — without them, there is no evidence of why a given ticket was mishandled or whether the threshold logic actually fired."}, {"letter": "D", "text": "Route any ticket a specialist agent cannot resolve to a second specialist agent for a fresh attempt, before considering escalation to a human.", "correct": false, "explanation": "Shuffling an unresolved ticket between specialist agents still risks delaying, or entirely bypassing, the bounded and guaranteed path to a human that the system is supposed to provide for low-confidence cases."}, {"letter": "E", "text": "Merge the triage and escalation agents into one agent so there is one fewer handoff to manage.", "correct": false, "explanation": "Merging removes the separation that lets escalation act as an independent safety check on triage's decision; fewer handoffs here reduces the very redundancy that supports safe failure."}], "correct": ["A", "B", "C"], "select": 3}, {"id": "p1-17", "domain": 1, "objective": "Apply decomposition techniques for complex problem solving", "situation": "A university wants a system to help advisors answer 'can this student graduate on time' by checking degree requirements, completed courses, in-progress courses, and prerequisite chains, all of which interact with each other.", "question": "Which decomposition approach best handles the interdependence between these four data sources?", "options": [{"letter": "A", "text": "Decompose into: (1) gather the four data sources, (2) build the student's course-and-requirement graph reconciling prerequisites and completions, (3) evaluate remaining-requirement paths against the timeline, each as a distinct, testable step.", "correct": true, "explanation": "This decomposition separates data gathering from reconciliation from evaluation, explicitly creating the step that handles the interdependence (the graph-building stage) rather than assuming it will resolve itself, and keeps each stage independently testable."}, {"letter": "B", "text": "Decompose into independent lookups for each data source with no step that reconciles them against each other.", "correct": false, "explanation": "Because the four sources interact (a prerequisite chain depends on both completed and in-progress courses, which must be checked against requirements), treating them as fully independent lookups drops the interactions the question actually depends on."}, {"letter": "C", "text": "Ask one prompt to output a yes/no graduation answer directly from the four raw data dumps pasted in sequence.", "correct": false, "explanation": "This skips decomposition entirely; a single pass over raw, unreconciled data is unlikely to correctly resolve prerequisite chains and course interactions, and any error is untraceable to a specific step."}, {"letter": "D", "text": "Decompose by academic term, running a separate independent check for each term the student has been enrolled in.", "correct": false, "explanation": "Term-based splitting does not match the actual dependency structure (prerequisite chains span terms), so it would miss cross-term interactions the question depends on."}], "correct": "A", "select": 1}, {"id": "p1-18", "domain": 1, "objective": "Align solutions to business value pillars (efficiency, transformation, productivity, cost, performance SLAs)", "situation": "A SaaS company's support team has a contractual SLA requiring a first response to enterprise customers within 15 minutes, 24/7. The architect is designing an AI-assisted response system and must choose a model tier and architecture.", "question": "Which decision best respects the stated SLA constraint while keeping cost reasonable?", "options": [{"letter": "A", "text": "Always use the largest, most capable model available for every ticket regardless of complexity, to maximize quality.", "correct": false, "explanation": "Uniformly using the most capable model raises both cost and, for high-volume simple tickets, latency risk relative to the 15-minute SLA, without a stated requirement that justifies paying that price on every ticket."}, {"letter": "B", "text": "Route simple, high-volume ticket types to a faster, lower-cost model tier that reliably meets the 15-minute SLA, and reserve a stronger tier for complex tickets flagged as such.", "correct": true, "explanation": "This aligns model selection with both named constraints — the SLA (favoring speed on the high-volume path) and cost (avoiding uniform use of the most expensive tier) — while preserving quality where complexity actually requires it."}, {"letter": "C", "text": "Batch all enterprise tickets and process them together once per hour to reduce per-call overhead.", "correct": false, "explanation": "Hourly batching directly violates the explicit 15-minute first-response SLA; optimizing for throughput at the expense of the stated latency constraint is not an acceptable trade here."}, {"letter": "D", "text": "Remove the AI system from the enterprise ticket path entirely and route all enterprise tickets to humans only.", "correct": false, "explanation": "This ignores the business goal of using AI assistance and does not itself guarantee the SLA is met if human staffing is the current bottleneck; it discards the project rather than aligning it to the constraint."}], "correct": "B", "select": 1}, {"id": "p1-19", "domain": 1, "objective": "Translate business problems into Claude-based AI solutions", "situation": "A field-services company wants to cut equipment downtime by predicting likely failures. Two data sources are available: free-text technician notes describing what they observed during repairs, and structured numeric sensor time-series readings collected continuously from each machine. No Claude-based work currently touches either source.", "question": "Which translation of this problem into a solution scope best fits the two data sources described?", "options": [{"letter": "A", "text": "Scope Claude to extract and structure failure-relevant signals from the technician notes — a text-understanding task it is well matched to — and pair that structured output with a separate, purpose-built numeric forecasting method applied to the sensor time-series data.", "correct": true, "explanation": "This maps each data source to the technique best suited to it: language understanding for the free-text notes, and dedicated numeric forecasting for the sensor readings, rather than forcing one tool to cover both a text task and a numeric time-series task."}, {"letter": "B", "text": "Have Claude read the raw sensor time-series values directly as text and produce the failure forecast itself, without any separate numeric forecasting step.", "correct": false, "explanation": "Forecasting from a long numeric time series is a task where dedicated statistical or numeric forecasting techniques are a stronger comparative fit than a general-purpose language model reading raw numbers as text; this ignores where Claude's capability is actually strongest."}, {"letter": "C", "text": "Scope the project to the sensor time-series data only, and leave the technician notes unused because structured numeric data is simpler to work with.", "correct": false, "explanation": "This discards the one data source Claude is well matched to (unstructured text) in favor of convenience, even though the technician notes were named as an available source of failure-relevant signal."}, {"letter": "D", "text": "Recommend building an entirely custom machine-learning pipeline from scratch and drop the idea of using Claude at all, since failure prediction requires specialized models.", "correct": false, "explanation": "This overcorrects by discarding a concrete, well-matched use for Claude on the text portion of the problem, rather than scoping Claude to the part of the task it is actually suited for."}], "correct": "A", "select": 1}, {"id": "p1-20", "domain": 1, "objective": "Design end-to-end architectures (input → processing → output → feedback loops)", "situation": "An architect is reviewing a proposed design for a customer-facing product-recommendation assistant: user query goes into Claude, Claude calls a product-search tool, and the response is shown to the user. There is no logging and no mechanism to capture whether the user clicked a recommended product.", "question": "Which two changes would most improve this architecture's ability to learn from real usage over time? (Select TWO.)", "options": [{"letter": "A", "text": "Ask the user to rate their overall shopping experience once per year via email survey.", "correct": false, "explanation": "An annual survey is far too infrequent and too disconnected from individual interactions to serve as a feedback signal for a per-query recommendation system."}, {"letter": "B", "text": "Log the query, retrieved products, and generated response for each interaction so later analysis can see what the system actually produced.", "correct": true, "explanation": "Without logging, there is no record to analyze later; capturing inputs and outputs is the minimum architectural addition needed before any feedback loop can exist."}, {"letter": "C", "text": "Capture whether the user clicked a recommended product and associate that outcome with the logged interaction that produced it.", "correct": true, "explanation": "Click-through is the natural real-world outcome signal for a recommendation assistant; linking it back to the specific interaction closes the loop from output to a measurable feedback signal that can inform future tuning."}, {"letter": "D", "text": "Increase the number of products the search tool returns on every query, regardless of relevance.", "correct": false, "explanation": "Returning more products does not create any feedback mechanism; it changes the volume of candidates without capturing anything about how users respond to them."}, {"letter": "E", "text": "Remove the product-search tool and have Claude recommend products from memory only.", "correct": false, "explanation": "This removes grounding in the actual, current product catalog and has nothing to do with closing a feedback loop; it would likely make recommendations less accurate, not more learnable."}], "correct": ["B", "C"], "select": 2}, {"id": "p1-21", "domain": 1, "objective": "Align solutions to business value pillars (efficiency, transformation, productivity, cost, performance SLAs)", "situation": "A software engineering organization wants to improve developer productivity. Leadership specifically states the goal is to reduce time-to-first-draft on routine code review comments, not to replace reviewers' judgment on architecture or design decisions.", "question": "Which solution best matches the stated productivity goal without overreaching into what leadership explicitly excluded?", "options": [{"letter": "A", "text": "A tool that drafts routine review comments (style, lint-level issues, obvious bugs) for the human reviewer to accept, edit, or discard, leaving architecture and design judgment to the reviewer.", "correct": true, "explanation": "This matches the productivity pillar leadership named (faster first drafts on routine comments) and respects the explicit boundary they set (not replacing judgment on architecture/design), earning its scope from the stated goal."}, {"letter": "B", "text": "A fully autonomous agent authorized to approve and merge pull requests, including architectural decisions, without human review.", "correct": false, "explanation": "This directly contradicts the explicit exclusion leadership stated — that the tool should not replace reviewers' judgment on architecture or design — and expands scope far beyond a productivity aid for routine comments."}, {"letter": "C", "text": "A dashboard that reports how many pull requests were opened per week, with no assistance in reviewing them.", "correct": false, "explanation": "This measures activity but does not reduce time-to-first-draft on review comments, which is the specific productivity goal leadership stated."}, {"letter": "D", "text": "A tool focused entirely on reducing cloud compute cost for the CI pipeline.", "correct": false, "explanation": "This targets the cost pillar rather than the productivity pillar leadership explicitly named as the goal, and does not address code review at all."}], "correct": "A", "select": 1}, {"id": "p1-22", "domain": 1, "objective": "Select appropriate architectural patterns (workflow, agentic, augmented LLM)", "situation": "An architect is choosing between a fixed workflow and an agentic pattern for a data-pipeline monitoring assistant. The task involves checking a dashboard, and if a specific known metric crosses a specific known threshold, running one of three predefined remediation scripts based on which metric fired.", "question": "Which three considerations correctly support choosing a fixed workflow over an agentic pattern here? (Select THREE.)", "options": [{"letter": "A", "text": "The remediation actions are a small, fixed set of predefined scripts rather than open-ended tool use.", "correct": true, "explanation": "A small, closed set of predefined responses maps directly onto workflow branches; there is no need for a model to improvise or select from an unbounded action space."}, {"letter": "B", "text": "A fixed workflow is easier to test exhaustively and audit than an agentic system making its own routing decisions, which matters for an operational monitoring tool.", "correct": true, "explanation": "Exhaustive testability and auditability are genuine architectural advantages of fixed workflows for operational tooling, and they are earned here precisely because the branches are enumerable — matching complexity to the task's real requirements."}, {"letter": "C", "text": "The team can reuse an agent framework already built for another project, so the agentic version would take less developer time to stand up.", "correct": false, "explanation": "Reusing existing tooling is a real implementation-efficiency consideration, but it is not a reason grounded in this task's own structure — the case for a fixed workflow rests on the branches being small, enumerable, and auditable, not on which framework happens to be lying around."}, {"letter": "D", "text": "An agentic system could discover new remediation approaches beyond the three existing scripts, adding flexibility for future incident types.", "correct": false, "explanation": "This is actually a reason to favor an agentic pattern, not a fixed workflow. As described, the remediation set is a small, closed list of three scripts by design, so open-ended discovery is not a capability this task's requirement calls for."}, {"letter": "E", "text": "The set of possible triggering conditions (which metric, which threshold) is fully known and enumerable in advance.", "correct": true, "explanation": "When every branch condition can be listed ahead of time, encoding them as an explicit workflow is both possible and preferable — there is no unknown branching that would require the model to plan its own path."}], "correct": ["A", "B", "E"], "select": 3}, {"id": "p2-01", "domain": 2, "objective": "Select appropriate Claude models based on trade-offs", "situation": "An architect is choosing a model tier for a document-classification service expected to run for several years at high volume. Benchmarks show a lower-cost model tier can reach the required accuracy, but only after the team spends roughly two additional weeks building a more elaborate prompt with detailed few-shot examples and output constraints; the higher-cost tier reaches the same accuracy today with a much simpler prompt and little extra engineering effort.", "question": "Which trade-off should drive the model tier decision here?", "options": [{"letter": "A", "text": "Always pick the cheaper model tier, since a lower per-request price is definitionally the better choice regardless of any other cost involved.", "correct": false, "explanation": "This ignores that reaching that price point requires a real, one-time engineering investment; per-request price alone is not the full cost of the decision."}, {"letter": "B", "text": "Estimate whether the inference-cost savings from the cheaper tier, accumulated over the service's expected volume and lifetime, exceed the one-time engineering cost of building the more elaborate prompt, and choose based on that comparison.", "correct": true, "explanation": "The two tiers reach the same accuracy through different costs — inference spend versus engineering time — so the trade-off that actually decides the question is whether the service runs at enough volume and for long enough to make the upfront engineering investment pay off."}, {"letter": "C", "text": "Always pick the more capable tier whenever it requires less current engineering effort, since developer time is inherently more valuable than any amount of inference spend.", "correct": false, "explanation": "This treats developer time as always dominant without regard to the service's expected volume or lifetime; at high enough volume over a multi-year service, accumulated inference savings can outweigh a modest one-time engineering cost."}, {"letter": "D", "text": "Treat the decision as arbitrary since both tiers reach the same accuracy bar, and pick whichever is available first.", "correct": false, "explanation": "Reaching the same accuracy bar does not make the tiers equivalent; they get there through different cost structures, and that difference is exactly what the decision should be based on."}], "correct": "B", "select": 1}, {"id": "p2-02", "domain": 2, "objective": "Select appropriate Claude models based on trade-offs", "situation": "An architect is choosing a model tier for a legal document summarization tool used by in-house counsel. Outputs directly inform decisions with regulatory exposure, but volume is low (about 200 requests per day) and the latency budget is generous.", "question": "Which factor should most heavily influence the model tier chosen for this task?", "options": [{"letter": "A", "text": "Throughput requirements, since the tool must handle spikes in request volume.", "correct": false, "explanation": "Volume is low and not described as spiky; throughput is not the binding constraint here."}, {"letter": "B", "text": "Task complexity and accuracy requirements, since summarization errors carry regulatory exposure while volume and latency are not constraining.", "correct": true, "explanation": "When stakes are high, volume is low, and latency is not tight, the trade-off should favor the model tier best suited to complex, accuracy-sensitive reasoning rather than cost or speed."}, {"letter": "C", "text": "Token cost per request, since minimizing spend is the top priority for any workload.", "correct": false, "explanation": "Treating cost as the dominant factor ignores that this is a low-volume, high-stakes task where an error carries regulatory exposure; cost should not override accuracy here."}, {"letter": "D", "text": "Whichever model tier the vendor lists as the default recommendation.", "correct": false, "explanation": "Deferring to a default recommendation is not a trade-off analysis; it ignores the specific stakes and constraints described in the scenario."}], "correct": "B", "select": 1}, {"id": "p2-03", "domain": 2, "objective": "Select appropriate Claude models based on trade-offs", "situation": "A team runs a nightly batch job that must classify 2 million uniform, low-complexity support-ticket sentiment labels before a fixed 6 a.m. deadline, using a set compute budget. Every ticket in this batch is equally simple; none require escalated handling.", "question": "Which model-tier decision best fits this workload?", "options": [{"letter": "A", "text": "Use the most capable available tier and add more parallel workers to force the full batch through before the deadline.", "correct": false, "explanation": "This substitutes added compute spend for a tier decision; since every ticket in the batch is uniformly simple, paying for top-tier capability across all 2 million items is not justified by the task's actual difficulty."}, {"letter": "B", "text": "Determine the lightest model tier that meets the required accuracy on this uniform task, and run the entire batch on that tier, since the binding constraint is clearing the deadline at volume, not per-item difficulty.", "correct": true, "explanation": "Because every item in the batch is equally simple and there is no per-ticket complexity to differentiate, the right lever is choosing the cheapest tier that still clears the accuracy bar and the deadline at the required throughput — not adding capability or compute the task does not need."}, {"letter": "C", "text": "Reduce the deadline pressure by classifying only a random sample of the tickets each night and skipping the rest.", "correct": false, "explanation": "This changes what the product delivers (fewer tickets classified) rather than fixing the tier decision, and does not address whether the chosen model tier is well matched to the task."}, {"letter": "D", "text": "Split the nightly batch randomly across two different model tiers to average out cost and speed.", "correct": false, "explanation": "Randomly mixing tiers is not tied to any property of the task — the tickets are uniformly simple, so there is no basis for splitting work across tiers rather than picking the single tier that fits."}], "correct": "B", "select": 1}, {"id": "p2-04", "domain": 2, "objective": "Select appropriate Claude models based on trade-offs", "situation": "Product wants one model choice to serve two very different needs: drafting multi-step marketing campaign plans that require reasoning, and real-time chat autocomplete suggestions with a latency budget of well under one second (roughly 800ms) that a fast model tier can reliably meet.", "question": "What is the best architectural response to this request?", "options": [{"letter": "A", "text": "Use the fastest available model for both tasks so the autocomplete SLA is always met.", "correct": false, "explanation": "This meets the latency constraint but sacrifices the reasoning quality needed for multi-step campaign planning."}, {"letter": "B", "text": "Use the most capable available model for both tasks so planning quality is always preserved.", "correct": false, "explanation": "This directly violates the stated latency budget for autocomplete, ignoring an explicit constraint in the scenario."}, {"letter": "C", "text": "Insert a queuing layer so both tasks can share a single mid-tier model without violating the latency SLA.", "correct": false, "explanation": "Queuing adds latency rather than removing it, and a shared mid-tier model still under-serves the reasoning task; this is added complexity that does not solve the underlying mismatch."}, {"letter": "D", "text": "Use two different model tiers: a stronger reasoning model for campaign planning and a fast, lightweight model for latency-critical autocomplete.", "correct": true, "explanation": "The two tasks have conflicting requirements; matching each to the model tier suited for it satisfies both the reasoning need and the latency budget without compromise."}], "correct": "D", "select": 1}, {"id": "p2-05", "domain": 2, "objective": "Design system prompts, templates, and guardrails", "situation": "An internal HR assistant's system prompt lists 40 policies inline with no organization. Users report the assistant sometimes contradicts itself and drifts off-task during longer conversations.", "question": "What is the most effective structural change to the system prompt to fix this?", "options": [{"letter": "A", "text": "Reorganize the policies into clearly labeled sections with explicit precedence rules, and place stable role and scope instructions first.", "correct": true, "explanation": "Structuring instructions with clear sections and precedence reduces ambiguity about which rule governs a given situation, and ordering stable content first also keeps the prefix consistent."}, {"letter": "B", "text": "Add a closing reminder sentence telling the model \"do not contradict earlier instructions.\"", "correct": false, "explanation": "This is a surface-level patch; it does not fix the underlying lack of structure that causes the model to weight unorganized policy text inconsistently."}, {"letter": "C", "text": "Shorten the system prompt to a single sentence such as \"Follow HR policy.\"", "correct": false, "explanation": "This removes necessary detail and invites the model to hallucinate policy specifics rather than follow real ones."}, {"letter": "D", "text": "Move all 40 policies out of the system prompt and resend them in every user turn instead.", "correct": false, "explanation": "This increases token cost per turn, forfeits the caching benefit of stable content, and does not address the contradiction problem, which is about organization, not placement."}], "correct": "A", "select": 1}, {"id": "p2-06", "domain": 2, "objective": "Design system prompts, templates, and guardrails", "situation": "A customer-facing coding assistant occasionally reveals system-prompt content when a user asks \"what are your instructions?\", exposing internal guardrail wording.", "question": "Which change most directly reduces this risk?", "options": [{"letter": "A", "text": "Instruct the model in the system prompt to never reveal its instructions, and rely on that instruction alone.", "correct": false, "explanation": "An instruction with no enforcement or detection is a policy, not a control; it can still be bypassed by adversarial phrasing."}, {"letter": "B", "text": "Add a guardrail layer that detects requests probing for system-prompt content, combined with an explicit non-disclosure instruction, and test that it holds.", "correct": true, "explanation": "Pairing an explicit instruction with an enforced, tested detection layer turns the policy into an actual control with evidence it works, rather than relying on the model's compliance alone."}, {"letter": "C", "text": "Move the system prompt into a separate configuration file that is kept out of the codebase's version control, on the assumption that this location prevents disclosure.", "correct": false, "explanation": "Where the prompt text is stored has no bearing on whether the deployed model chooses to repeat it back to a user who asks; the leakage happens through model output, not through file access, so relocating the file does not address the actual risk."}, {"letter": "D", "text": "Remove the system prompt for external users so there is nothing to leak.", "correct": false, "explanation": "This eliminates the guardrail and behavior guidance the system prompt provides, degrading the assistant's core behavior control rather than fixing the leakage problem."}], "correct": "B", "select": 1}, {"id": "p2-07", "domain": 2, "objective": "Design system prompts, templates, and guardrails", "situation": "An architect is drafting a system prompt template to be reused across many internal tools serving different departments, each with distinct compliance requirements.", "question": "Which two practices produce a template that is both maintainable and safe? (Select TWO.)", "options": [{"letter": "A", "text": "Hard-code every department's compliance clause directly into one shared monolithic prompt so nothing is missed.", "correct": false, "explanation": "A monolithic prompt is hard to maintain and audit; changes for one department risk unintended effects on others, defeating the goal of a reusable template."}, {"letter": "B", "text": "Define explicit guardrail statements, describing exactly what the assistant must refuse, as a distinct and testable section rather than folding refusals into general tone language.", "correct": true, "explanation": "Explicit, isolated guardrail statements can be tested and audited directly, whereas refusals buried in tone language are hard to verify or enforce."}, {"letter": "C", "text": "Rely on the model's default training to infer each department's compliance rules without stating them explicitly.", "correct": false, "explanation": "Unstated rules are not enforced policy; the model may infer incorrectly, and there is no way to verify compliance behavior."}, {"letter": "D", "text": "Randomize prompt wording per deployment to prevent competitors from reverse-engineering the template.", "correct": false, "explanation": "This is irrelevant to maintainability or safety and introduces inconsistent behavior across deployments for no architectural benefit."}, {"letter": "E", "text": "Separate the role and behavior boilerplate common to all tools from the department-specific compliance clauses so each can be updated independently.", "correct": true, "explanation": "Modular separation lets a shared update to common boilerplate happen once, and lets department-specific compliance clauses be revised without touching unrelated tools."}], "correct": ["B", "E"], "select": 2}, {"id": "p2-08", "domain": 2, "objective": "Apply prompt engineering techniques (zero-shot, few-shot, chain-of-thought)", "situation": "A team is building an invoice data extraction tool. The calling code already enforces a strict output schema on every model response, rejecting anything that does not match the required fields and types, so structurally malformed output is not the team's current problem. The remaining defect is that invoices are formatted inconsistently across ve
