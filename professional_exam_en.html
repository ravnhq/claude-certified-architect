ndors, and the model often puts the right value in the wrong field — for example, a PO number landing in the invoice-number field.", "question": "Which prompting technique is most appropriate as the primary strategy to fix the remaining field-mapping errors?", "options": [{"letter": "A", "text": "Pure zero-shot prompting using only a plain-language instruction with no examples.", "correct": false, "explanation": "A plain instruction alone gives the model no guidance on how field placement differs across vendor layouts, leaving it to guess at the same mapping errors that are already occurring."}, {"letter": "B", "text": "Chain-of-thought prompting that has the model reason step by step before producing the answer, then discards the reasoning.", "correct": false, "explanation": "The remaining defect is a mapping problem tied to layout variation, not a multi-step reasoning problem; added reasoning steps increase latency and cost without directly showing the model which value belongs in which field."}, {"letter": "C", "text": "Add a schema-enforced output constraint layer on top of the model call, requiring the response to conform to the required fields and types.", "correct": false, "explanation": "This is already in place per the scenario and guarantees structural conformance, but it does not tell the model which extracted value belongs in which field when vendor formats differ — it would not fix the specific defect described."}, {"letter": "D", "text": "Few-shot prompting with two or three representative input/output examples drawn from different vendor invoice layouts, showing the correct field for each value.", "correct": true, "explanation": "Examples spanning different vendor formats directly demonstrate which value goes in which field when layouts vary, which is what the schema-conformance layer alone cannot provide for this specific mapping defect."}], "correct": "D", "select": 1}, {"id": "p2-09", "domain": 2, "objective": "Apply prompt engineering techniques (zero-shot, few-shot, chain-of-thought)", "situation": "An assistant must evaluate multi-step numeric eligibility rules with several nested conditions (for example, benefit qualification logic), and the final answer must be auditable by a human reviewer.", "question": "Which prompt engineering technique best fits this task?", "options": [{"letter": "A", "text": "Chain-of-thought prompting that asks the model to work through each condition explicitly before giving the final answer.", "correct": true, "explanation": "Explicit step-by-step reasoning both improves reliability on nested, multi-step logic and produces a trace a human reviewer can audit."}, {"letter": "B", "text": "Zero-shot instruction specifying only the final answer format, with no worked examples.", "correct": false, "explanation": "This gives the model no guidance on how to work through nested conditions, risking errors on multi-step logic."}, {"letter": "C", "text": "Few-shot examples that show only final answers without intermediate steps.", "correct": false, "explanation": "Without intermediate steps, there is no reasoning trace for a reviewer to audit, and the model has less structure to generalize the nested-condition logic from."}, {"letter": "D", "text": "A single example copied verbatim from a similar past case, with instructions to copy its structure exactly.", "correct": false, "explanation": "This encourages overfitting to one specific case rather than generalizing correct reasoning across the varying nested conditions."}], "correct": "A", "select": 1}, {"id": "p2-10", "domain": 2, "objective": "Apply prompt engineering techniques (zero-shot, few-shot, chain-of-thought)", "situation": "A prompt currently instructs the model with only \"Summarize this document,\" and results vary widely in tone, length, and structure across runs.", "question": "What is the most effective fix consistent with prompt engineering best practice?", "options": [{"letter": "A", "text": "Increase the max output token setting so the model has more room to summarize.", "correct": false, "explanation": "Adjusting an output budget does not address the ambiguity in style or tone that is causing the variance."}, {"letter": "B", "text": "Add explicit constraints on target length, tone, and structure, and include one or two examples showing the desired summary style.", "correct": true, "explanation": "Explicit constraints plus concrete examples directly resolve the ambiguity in the original instruction that was causing inconsistent tone and length."}, {"letter": "C", "text": "Ask the model to produce three candidate summaries and pick the best one itself.", "correct": false, "explanation": "This adds cost and latency without fixing the root cause, which is an underspecified instruction, not a lack of candidate options."}, {"letter": "D", "text": "Repeat the instruction \"Summarize this document\" three times in the prompt for emphasis.", "correct": false, "explanation": "Repetition without added information does not reduce ambiguity or variance; it only wastes tokens."}], "correct": "B", "select": 1}, {"id": "p2-11", "domain": 2, "objective": "Optimize context windows and manage token usage", "situation": "A RAG-based support assistant retrieves 20 documents per query \"to be safe.\" This pushes total context near the model's window limit, increasing both latency and cost, while measured answer accuracy has not improved.", "question": "What is the most likely root cause and best fix?", "options": [{"letter": "A", "text": "The model's weights are stale; retrain or fine-tune on newer support data.", "correct": false, "explanation": "There is no evidence pointing to a knowledge or weights problem; the symptom described is about the volume of retrieved context, not model knowledge."}, {"letter": "B", "text": "The context window itself is too small; request a larger context window from the provider.", "correct": false, "explanation": "This treats a retrieval-tuning problem as a capacity problem; a larger window would let the assistant stuff in even more irrelevant documents without fixing the accuracy plateau."}, {"letter": "C", "text": "The retrieval step is over-fetching irrelevant documents; tighten retrieval and ranking so only the most relevant few are included.", "correct": true, "explanation": "When adding more retrieved context does not improve accuracy, the likely cause is that ranking or retrieval is pulling in irrelevant material; narrowing retrieval usually restores both accuracy and efficiency."}, {"letter": "D", "text": "Ask engineers to write shorter user queries so each retrieved document is truncated to fewer characters.", "correct": false, "explanation": "Shortening queries does not change how many irrelevant documents get retrieved and included; the accuracy plateau comes from retrieval pulling in too much low-relevance material, not from the length of any individual document."}], "correct": "C", "select": 1}, {"id": "p2-12", "domain": 2, "objective": "Optimize context windows and manage token usage", "situation": "An agent appends its full conversation history to every turn. After about 40 turns, users report increasing latency and occasional loss of early instructions.", "question": "What is the best architectural response?", "options": [{"letter": "A", "text": "Truncate the conversation randomly whenever the context grows too large.", "correct": false, "explanation": "Random truncation risks discarding information still needed and has no principled way of preserving important early instructions."}, {"letter": "B", "text": "Switch to a model with a larger context window and keep appending everything indefinitely.", "correct": false, "explanation": "This defers the problem rather than solving it; latency and cost will still grow unbounded as the conversation continues."}, {"letter": "C", "text": "Ask the user to start a new conversation every five turns to avoid the issue.", "correct": false, "explanation": "This pushes the problem onto the user and degrades the product experience rather than fixing the underlying context management."}, {"letter": "D", "text": "Summarize or compact older turns into a condensed running summary while keeping stable instructions near the top of the context.", "correct": true, "explanation": "Compacting older history bounds context growth while preserving relevant information, and keeping stable instructions prominent prevents them from being lost or diluted."}], "correct": "D", "select": 1}, {"id": "p2-13", "domain": 2, "objective": "Optimize context windows and manage token usage", "situation": "An architect wants to reduce token usage and improve cache efficiency in a customer service assistant that sends a large, mostly-static system prompt plus a small amount of per-request dynamic data.", "question": "Which two practices best optimize context window usage and cost for this workload? (Select TWO.)", "options": [{"letter": "A", "text": "Trim retrieved or historical content to only what is relevant to the current request rather than including everything available.", "correct": true, "explanation": "Reducing included content to what is actually relevant directly reduces token usage without affecting the cacheable static prefix."}, {"letter": "B", "text": "Increase the max output token setting on every request to leave headroom regardless of actual need.", "correct": false, "explanation": "This does not reduce token usage or improve caching; it only affects output budget, unrelated to context optimization."}, {"letter": "C", "text": "Always request the largest available context window tier by default so content never needs to be trimmed.", "correct": false, "explanation": "This avoids doing the actual optimization work and increases cost unnecessarily rather than managing token usage."}, {"letter": "D", "text": "Place the static system prompt and instructions first, and append per-request dynamic data at the end.", "correct": true, "explanation": "Ordering stable content before dynamic content keeps the prompt prefix identical across requests, which is what makes prefix caching effective."}, {"letter": "E", "text": "Interleave the dynamic data throughout the system prompt so related content stays together.", "correct": false, "explanation": "Interleaving dynamic content breaks the stable prefix that caching depends on, increasing effective token cost per request."}], "correct": ["A", "D"], "select": 2}, {"id": "p2-14", "domain": 2, "objective": "Implement prompt reuse strategies (caching, modular prompts, Skills)", "situation": "A shared \"output-formatting\" prompt component is composed into the system prompts of 12 different internal agents. An engineer edits the shared component to fix a bug affecting one of those agents, and the edit takes effect for all 12 agents in production immediately, with none of them individually tested against the new wording before the change went live.", "question": "Which reuse-strategy change would best prevent this kind of incident going forward?", "options": [{"letter": "A", "text": "Give the shared component explicit versions, and have each agent pin to a specific tested version, upgrading deliberately rather than automatically inheriting every edit.", "correct": true, "explanation": "Explicit versioning turns an uncontrolled, blast-radius-of-twelve change into a deliberate, per-agent upgrade decision, so a fix intended for one agent can be validated before any other agent is exposed to it."}, {"letter": "B", "text": "Abandon the shared component and give each of the 12 agents its own independent copy of the formatting instructions.", "correct": false, "explanation": "This removes the reuse benefit entirely and reintroduces the duplicated-boilerplate maintenance burden that a shared component was meant to solve, rather than fixing how changes to it are rolled out."}, {"letter": "C", "text": "Require the engineer to notify all 12 agent owners by email before making any future edit to the shared component.", "correct": false, "explanation": "A notification process is not an architectural control; it depends on people remembering to read and act on the email, and does nothing to stop an untested edit from taking effect for all consumers immediately."}, {"letter": "D", "text": "Add a check that the shared component's text is syntactically well-formed before merging any edit to it.", "correct": false, "explanation": "A syntax check catches malformed text but not behavioral regressions across the 12 consuming agents, which is the actual failure mode described."}], "correct": "A", "select": 1}, {"id": "p2-15", "domain": 2, "objective": "Implement prompt reuse strategies (caching, modular prompts, Skills)", "situation": "An organization has built five Claude-based assistants, each with its own bespoke system prompt containing duplicated boilerplate for tone, refusal policy, and formatting. Updating shared policy currently requires five separate edits.", "question": "What is the most effective structural fix?", "options": [{"letter": "A", "text": "Consolidate all five assistants into a single assistant with one large prompt covering every use case.", "correct": false, "explanation": "Merging unrelated use cases into one monolithic prompt increases complexity and drift risk instead of enabling clean reuse of shared components."}, {"letter": "B", "text": "Have engineers manually copy any future policy update into all five prompts each time it changes.", "correct": false, "explanation": "This is a process workaround, not a structural fix, and remains error-prone since it depends on someone remembering to update every copy."}, {"letter": "C", "text": "Extract the shared boilerplate into a modular, reusable prompt component that each assistant composes with its own task-specific instructions.", "correct": true, "explanation": "Modularizing shared content lets a single update propagate to every assistant that composes it, which is the core benefit of a prompt reuse strategy."}, {"letter": "D", "text": "Remove the shared tone, refusal, and formatting sections entirely to eliminate duplication.", "correct": false, "explanation": "This removes needed guardrail and behavior content instead of reusing it properly, trading duplication for a loss of necessary controls."}], "correct": "C", "select": 1}, {"id": "p2-16", "domain": 2, "objective": "Implement prompt reuse strategies (caching, modular prompts, Skills)", "situation": "A platform team is packaging a growing library of specialized capabilities, such as PDF generation, spreadsheet analysis, and code review templates, for reuse across multiple agents. They favor progressive discovery over stuffing everything into one prompt.", "question": "Which two design choices best support scalable prompt/capability reuse in this scenario? (Select TWO.)", "options": [{"letter": "A", "text": "Package each capability as a discrete, independently loadable module with a clear name and description, so an agent or router can decide when to load it instead of loading everything by default.", "correct": true, "explanation": "Discrete packaging paired with discoverable metadata is what lets an agent or router select and load only the relevant capability on demand, which is the basis of progressive discovery and scalable reuse."}, {"letter": "B", "text": "Concatenate every capability's full instructions into the base system prompt so no agent ever needs to look anything up.", "correct": false, "explanation": "This reintroduces monolithic context bloat and directly contradicts the stated preference for progressive discovery over a monolithic strategy."}, {"letter": "C", "text": "Write each capability's instructions to be fully self-contained, with no implicit dependency on wording that happens to live in a particular agent's base prompt, so it behaves the same no matter which agent loads it.", "correct": true, "explanation": "This is a separate concern from how a capability is packaged or discovered: a capability that silently depends on context only some agents carry will behave inconsistently across the library, undermining reuse even if it is discretely packaged and discoverable."}, {"letter": "D", "text": "Require every agent to eagerly load all capabilities at session start to guarantee availability.", "correct": false, "explanation": "Eager loading of everything is the opposite of progressive discovery and wastes context and tokens on capabilities that are rarely needed for a given task."}, {"letter": "E", "text": "Store capabilities as unstructured free text scattered across unrelated documents, to be searched manually by developers at build time.", "correct": false, "explanation": "Unstructured, manually-searched content is not discoverable by an agent or router at runtime, so it does not scale as a reuse mechanism."}], "correct": ["A", "C"], "select": 2}, {"id": "p3-01", "domain": 3, "objective": "Evaluate tool/agent configuration for capability bloat", "situation": "A customer-support agent has been granted the full internal ops toolkit (23 tools: refunds, account deletion, inventory adjustments, discount codes, and more) even though its charter is answering FAQs and looking up order status. A security review flags this as high risk.", "question": "What is the best first step to reduce the risk from this configuration?", "options": [{"letter": "A", "text": "Remove the tools the agent's charter does not require, leaving only FAQ and order-status lookups.", "correct": true, "explanation": "Removing unnecessary capability at the source eliminates the risk instead of monitoring or gating it."}, {"letter": "B", "text": "Add a confirmation prompt before the agent calls any high-risk tool.", "correct": false, "explanation": "A confirmation step doesn't remove the underlying capability; the agent (or a manipulated user) can still push through the confirmation."}, {"letter": "C", "text": "Add a monitoring dashboard that flags every high-risk tool call for later audit.", "correct": false, "explanation": "This only detects misuse after the fact; the excess capability remains available to be misused."}, {"letter": "D", "text": "Keep the full toolkit but add a system-prompt instruction telling the agent to only use tools relevant to support.", "correct": false, "explanation": "A prompt-level instruction is not an enforced control; it can be bypassed by prompt injection or model error while the dangerous tools remain reachable."}], "correct": "A", "select": 1}, {"id": "p3-02", "domain": 3, "objective": "Evaluate tool/agent configuration for capability bloat", "situation": "An internal engineering agent has 31 registered tools spanning three unrelated systems (CI/CD, billing, and HR). Post-incident review shows the agent occasionally invokes billing tools it was never asked to use, and tool-selection latency has grown as the tool count increased.", "question": "Select the TWO changes that directly reduce capability bloat rather than merely observing it. (Select TWO.)", "options": [{"letter": "A", "text": "Rename the billing tools to clearer, more specific names so the agent is less likely to select them by mistake.", "correct": false, "explanation": "Renaming changes only the label on a tool the agent should never have had access to; the unnecessary capability remains present and reachable."}, {"letter": "B", "text": "Remove the billing tools from the engineering agent's configuration entirely since it has no task requiring them.", "correct": true, "explanation": "Deleting unneeded tools at the source directly removes the capability that caused the unwanted invocations."}, {"letter": "C", "text": "Increase the model's context window so it can reason over more tool descriptions before choosing.", "correct": false, "explanation": "A larger context window lets more tool descriptions fit but does not reduce the number of unnecessary tools available."}, {"letter": "D", "text": "Add a rate limiter on billing tool calls to cap how often they can be invoked.", "correct": false, "explanation": "Rate limiting constrains frequency but leaves the unnecessary capability present and reachable."}, {"letter": "E", "text": "Split the agent into task-scoped agents, each exposing only the tool subset for its domain.", "correct": true, "explanation": "Scoping each agent to a narrow tool set removes the unnecessary capability instead of just watching for its misuse."}], "correct": ["B", "E"], "select": 2}, {"id": "p3-03", "domain": 3, "objective": "Evaluate tool/agent configuration for capability bloat", "situation": "An MCP server exposes 40 fine-grained tools (get_user, get_user_v2, get_user_by_email, list_users_paginated, and similar near-duplicates) to a single planning agent. Logs show the agent frequently selects the wrong near-duplicate tool, producing incorrect results.", "question": "What change most directly fixes the root cause?", "options": [{"letter": "A", "text": "Add few-shot examples in the system prompt showing correct tool selection for each duplicate pair.", "correct": false, "explanation": "This patches the symptom for the examples shown but leaves the confusing, overlapping tool surface intact for new cases."}, {"letter": "B", "text": "Increase the model tier used for planning so it reasons more carefully among the 40 tools.", "correct": false, "explanation": "This treats a configuration problem as a model-capability problem, adding cost without removing the ambiguous duplicate tools."}, {"letter": "C", "text": "Curate and consolidate the tool set into a smaller, non-overlapping set matched to the agent's actual tasks.", "correct": true, "explanation": "Removing near-duplicate, overlapping tools eliminates the ambiguity that causes wrong selections at its source."}, {"letter": "D", "text": "Log every tool call for later review to catch misuse after the fact.", "correct": false, "explanation": "Logging detects mis-selection after it happens; it does not prevent the confusing tool set from causing it again."}], "correct": "C", "select": 1}, {"id": "p3-04", "domain": 3, "objective": "Analyze authentication and authorization requirements to identify security gaps", "situation": "A reporting agent only needs to run read-only SQL queries against a sales database. It currently authenticates using a long-lived admin database credential shared with several other internal services.", "question": "What is the best fix for this authorization gap?", "options": [{"letter": "A", "text": "Add logging that records every query the agent runs against the database.", "correct": false, "explanation": "Logging detects what happened after the fact; it does not remove the excess admin privilege the agent should never have held."}, {"letter": "B", "text": "Rotate the shared admin credential every 24 hours.", "correct": false, "explanation": "Rotation shortens the exposure window for a leaked credential but the agent still holds far more privilege than it needs."}, {"letter": "C", "text": "Require a human to approve each query before execution.", "correct": false, "explanation": "Manual approval adds friction and does not scale, and it does not fix the underlying over-privileged credential."}, {"letter": "D", "text": "Issue the agent a dedicated, scoped credential limited to read-only access on the sales tables it needs.", "correct": true, "explanation": "Scoping the credential to only the required read-only access removes the excess privilege at the source."}], "correct": "D", "select": 1}, {"id": "p3-05", "domain": 3, "objective": "Analyze authentication and authorization requirements to identify security gaps", "situation": "An automation pipeline authenticates to internal services using a personal API token that an engineer generated two years ago when the pipeline was first built. The engineer left the company eight months ago, but the token is still active and the pipeline still runs successfully every night.", "question": "What is the most important authorization gap to close here?", "options": [{"letter": "A", "text": "Replace the personal token with a service identity whose lifecycle doesn't depend on any one engineer's employment status.", "correct": true, "explanation": "Tying the credential's lifecycle to a service identity rather than a person closes the actual gap: authorization that silently outlives the individual it was issued to."}, {"letter": "B", "text": "Ask the departed engineer to confirm the token is still safe to use.", "correct": false, "explanation": "The person who generated the token no longer works here and has no ongoing accountability for it; relying on them does not close the gap."}, {"letter": "C", "text": "Reduce the token's scope to only the tables the pipeline touches.", "correct": false, "explanation": "Narrowing scope is good practice generally, but it does not fix the core problem that the credential's identity and validity are tied to someone no longer employed here."}, {"letter": "D", "text": "Add monitoring to alert if the token is used outside business hours.", "correct": false, "explanation": "Monitoring usage patterns does not address the orphaned credential itself; it only watches for one narrow kind of misuse after the fact."}], "correct": "A", "select": 1}, {"id": "p3-06", "domain": 3, "objective": "Analyze authentication and authorization requirements to identify security gaps", "situation": "A finance agent calls tools that read and modify payroll records. There is no record anywhere of which tool calls were made, by which session, touching which records, so a recent unexplained payroll discrepancy cannot be traced to its cause.", "question": "What is the most important gap to close first?", "options": [{"letter": "A", "text": "Add a stricter system prompt telling the agent to double-check payroll edits before submitting them.", "correct": false, "explanation": "This may reduce future errors but creates no evidence of what already happened, so it does not solve the traceability problem described."}, {"letter": "B", "text": "Implement per-call audit logging that captures identity, tool, parameters, and affected records for every payroll tool invocation.", "correct": true, "explanation": "Auditable, evidence-producing logs are what turn access controls into something that can actually be traced and enforced after the fact."}, {"letter": "C", "text": "Reduce the number of payroll tools available to the agent.", "correct": false, "explanation": "Reducing capability bloat is useful in general but does not address the described gap of having no record of what actions occurred."}, {"letter": "D", "text": "Require the agent to summarize its actions in natural language at the end of each session.", "correct": false, "explanation": "A model-generated summary is unreliable and unenforced evidence; it can omit or misstate the actions that actually occurred."}], "correct": "B", "select": 1}, {"id": "p3-07", "domain": 3, "objective": "Evaluate accuracy-latency trade-offs and justify configuration decisions", "situation": "An agent answers customer questions by calling three independent internal lookup tools (inventory, shipping, loyalty status) whose results do not depend on each other. The support SLA requires a 2-second response, and today's sequential calls average 2.6 seconds.", "question": "Which change best addresses the latency budget without reducing accuracy?", "options": [{"letter": "A", "text": "Drop the loyalty-status lookup since it is used least often.", "correct": false, "explanation": "This trades away accuracy for the queries that do need loyalty status, and does not address the real cause of the slowdown."}, {"letter": "B", "text": "Switch to a faster but less accurate model to compensate for tool latency.", "correct": false, "explanation": "This trades away accuracy in the wrong place; the bottleneck is tool call sequencing, not model reasoning speed."}, {"letter": "C", "text": "Issue the three independent tool calls in parallel instead of sequentially.", "correct": true, "explanation": "Since the calls have no dependency on each other, running them in parallel cuts wall-clock latency while preserving every result needed for accuracy."}, {"letter": "D", "text": "Cache the agent's previous full response and reuse it for similar-looking questions.", "correct": false, "explanation": "Reusing a cached full answer risks returning stale or incorrect per-customer data and is not a sound trade for independent, per-request lookups."}], "correct": "C", "select": 1}, {"id": "p3-08", "domain": 3, "objective": "Evaluate accuracy-latency trade-offs and justify configuration decisions", "situation": "A document-review agent must classify contracts as compliant or non-compliant within a 5-second SLA per document. Accuracy has been slipping (12% misclassification) since a new contract template was introduced, and the team wants to raise accuracy without breaking the SLA.", "question": "Select the TWO changes most likely to improve accuracy while respecting the latency budget. (Select TWO.)", "options": [{"letter": "A", "text": "Increase the temperature setting to encourage more varied reasoning paths.", "correct": false, "explanation": "Higher temperature increases output variance rather than accuracy and does not address the actual cause (an unfamiliar new template)."}, {"letter": "B", "text": "Add a lightweight confidence check that only triggers a short second-pass review when confidence is low.", "correct": true, "explanation": "Reserving extra work for only the uncertain cases raises accuracy where it is needed while keeping the average latency within budget."}, {"letter": "C", "text": "Remove the SLA entirely so the agent can take as long as needed to be accurate.", "correct": false, "explanation": "This violates an explicit stated constraint rather than working within it, and is not a legitimate configuration choice."}, {"letter": "D", "text": "Add a targeted retrieval step that pulls the relevant clause definitions for the new template before classification.", "correct": true, "explanation": "Grounding the classifier in the new template's actual clause definitions directly addresses the accuracy drop caused by the template change, with a bounded latency cost."}, {"letter": "E", "text": "Run the classification twice with two different models and average their confidence, regardless of latency impact.", "correct": false, "explanation": "Duplicating the full classification work is likely to push most documents over the 5-second SLA."}], "correct": ["B", "D"], "select": 2}, {"id": "p3-09", "domain": 3, "objective": "Evaluate accuracy-latency trade-offs and justify configuration decisions", "situation": "A fraud-triage agent must flag transactions within a strict 1-second SLA per transaction, feeding a downstream blocking decision. An engineer proposes a five-step chain-of-thought verification process per transaction that measurably improves accuracy by 3% but averages 4 seconds.", "question": "What is the best way to resolve this trade-off?", "options": [{"letter": "A", "text": "Keep a single lightweight pass with a calibrated confidence threshold, and route only low-confidence cases to the slower five-step review.", "correct": true, "explanation": "This captures most of the accuracy gain for the transactions that actually need deeper review, while keeping the common-case latency within the strict SLA."}, {"letter": "B", "text": "Adopt the five-step process for every transaction since accuracy matters most in fraud detection.", "correct": false, "explanation": "This ignores the explicit 1-second SLA and would delay the blocking decision for every transaction, including the ones that don't need it."}, {"letter": "C", "text": "Keep the original single-pass process unchanged since the SLA is fixed.", "correct": false, "explanation": "This leaves a usable 3% accuracy improvement on the table when it could be captured safely for the subset of cases that need it."}, {"letter": "D", "text": "Run the five-step process asynchronously after the blocking decision is already made.", "correct": false, "explanation": "A triage decision that arrives after the blocking action has already happened no longer informs that decision, defeating its purpose."}], "correct": "A", "select": 1}, {"id": "p3-10", "domain": 3, "objective": "Analyze observability challenges and select monitoring strategies at scale", "situation": "A production system routes requests through four cooperating agents and a dozen tool calls. When a customer reports a wrong answer, engineers currently grep through each agent's separate console logs by timestamp, which takes hours and often fails to reconstruct the request path.", "question": "What is the best strategy to fix this at scale?", "options": [{"letter": "A", "text": "Ask each agent to log more verbosely to its own console.", "correct": false, "explanation": "More log volume in the same fragmented, unlinked logs makes manual reconstruction even harder, not easier."}, {"letter": "B", "text": "Implement distributed tracing with a shared correlation ID propagated across every agent and tool call in a request.", "correct": true, "explanation": "A shared correlation ID lets engineers reconstruct the full multi-agent, multi-tool path for a single request, which is what root-causing at scale requires."}, {"letter": "C", "text": "Add a dashboard showing aggregate error rates per agent.", "correct": false, "explanation": "Aggregate rates describe overall health but cannot reconstruct the path of a single customer's request."}, {"letter": "D", "text": "Increase log retention from 7 to 90 days.", "correct": false, "explanation": "Longer retention keeps the same fragmented logs around longer; it does not link them into a traceable path."}], "correct": "B", "select": 1}, {"id": "p3-11", "domain": 3, "objective": "Analyze observability challenges and select monitoring strategies at scale", "situation": "A team instruments every agent metric (latency, error count, tool-call count) with a label for the raw user ID and raw session ID, alongside dozens of other dimensions. Within weeks the monitoring backend's storage and query cost grow far faster than traffic, and dashboards begin timing out.", "question": "What is the most direct fix for this scaling problem?", "options": [{"letter": "A", "text": "Increase the monitoring backend's storage capacity to keep up with the growth.", "correct": false, "explanation": "This pays for more of the same unbounded growth rather than addressing the labeling choice that is causing it, so cost keeps climbing as usage grows."}, {"letter": "B", "text": "Sample metrics at a fixed 1% rate across the board to reduce volume.", "correct": false, "explanation": "Uniform sampling reduces overall volume but does not address the labeling choice driving cardinality, and can hide rare but important combinations of labels."}, {"letter": "C", "text": "Remove raw high-cardinality identifiers like user or session IDs from metric labels, using grouped or derived dimensions instead.", "correct": true, "explanation": "Metric cardinality grows with the number of distinct label values; per-user and per-session labels create effectively unbounded cardinality, while the same identifiers remain available for tracing without being metric dimensions."}, {"letter": "D", "text": "Reduce the dashboard refresh interval from every minute to every hour.", "correct": false, "explanation": "Querying less often lowers read load but does not change the underlying per-label storage growth that is the actual cause."}], "correct": "C", "select": 1}, {"id": "p3-12", "domain": 3, "objective": "Analyze observability challenges and select monitoring strategies at scale", "situation": "A team built a detailed dashboard tracking tool-call error rates, latency percentiles, and token cost per agent. Six months later, the same class of incident (a downstream tool silently returning stale cached data) has recurred four times, each time discovered only when a customer complained.", "question": "What is missing?", "options": [{"letter": "A", "text": "More granular metrics broken down by tool version.", "correct": false, "explanation": "This adds more measurement of the same kind without acting on the condition that keeps recurring."}, {"letter": "B", "text": "A postmortem document describing each of the four incidents, to be reviewed at the next quarterly meeting.", "correct": false, "explanation": "Documenting past incidents for a future meeting does not create anything that catches the condition automatically the next time it recurs, before a customer notices."}, {"letter": "C", "text": "A retraining of the underlying model to be more robust to stale data.", "correct": false, "explanation": "This misdiagnoses a caching and observability gap as a model-quality problem; the model has no way to know the cache is stale."}, {"letter": "D", "text": "An automated alert tied to a runbook that flags stale-cache conditions and triggers a fix or fallback without waiting for customer reports.", "correct": true, "explanation": "Measurement alone does not reduce risk; it must be tied to an automated response that acts on the specific recurring failure mode."}], "correct": "D", "select": 1}, {"id": "p3-13", "domain": 3, "objective": "Design a RAG pipeline with appropriate chunking and indexing strategies", "situation": "A legal-tech company is building RAG over long commercial contracts (50-150 pages each), where answers must cite the exact clause and section they came from, and clauses are logically self-contained but often split across page boundaries.", "question": "Select the TWO design choices best suited to this data shape. (Select TWO.)", "options": [{"letter": "A", "text": "Store section and clause identifiers as metadata on each chunk to support exact citation.", "correct": true, "explanation": "Metadata identifiers are what let the system point back to the exact clause and section a retrieved chunk came from."}, {"letter": "B", "text": "Embed entire contracts as a single vector per document to simplify the index.", "correct": false, "explanation": "A single document-level vector loses the clause-level precision needed to retrieve and cite a specific section."}, {"letter": "C", "text": "Discard section headings before chunking to reduce token count.", "correct": false, "explanation": "Section headings carry the identifying information needed for accurate citation; discarding them removes what the requirement depends on."}, {"letter": "D", "text": "Chunk by fixed 500-token windows regardless of clause boundaries, for uniform chunk size.", "correct": false, "explanation": "Fixed windows can split a clause mid-thought, breaking the self-contained unit that needs to be retrieved and cited as a whole."}, {"letter": "E", "text": "Chunk along clause and section boundaries so each chunk is a complete, citable unit.", "correct": true, "explanation": "Aligning chunk boundaries with clause structure preserves each clause as a self-contained, accurately citable unit."}], "correct": ["A", "E"], "select": 2}, {"id": "p3-14", "domain": 3, "objective": "Design a RAG pipeline with appropriate chunking and indexing strategies", "situation": "A team is designing the ingestion pipeline for a policy knowledge base whose source documents are revised roughly weekly. Each revision must fully replace the prior version's content in the retrieval index.", "question": "Which ingestion design should the team choose?", "options": [{"letter": "A", "text": "Append the revised document's new chunks alongside the prior version's chunks, distinguishing them only by an ingestion timestamp.", "correct": false, "explanation": "This leaves both the old and new clauses coexisting and retrievable in the index, which is exactly the mixed-version outcome the requirement rules out."}, {"letter": "B", "text": "Upsert each document's chunks keyed on a stable document ID with version metadata, so a new revision atomically replaces every chunk from the prior version.", "correct": true, "explanation": "Keying on a stable document ID lets the ingestion step delete the old version's chunks in the same operation that adds the new ones, guaranteeing no mixed-version state in the index."}, {"letter": "C", "text": "Rebuild the entire index from every source document once per night, regardless of which documents changed.", "correct": false, "explanation": "A single revision published mid-day would be entirely absent from the index for up to a day, and a full rebuild is heavier than the task requires for a single-document change."}, {"letter": "D", "text": "Keep the old chunks in the index indefinitely and rely on retrieval ranking to prefer the most recent chunks by a recency score.", "correct": false, "explanation": "Ranking by recency does not remove anything from the index, so a lower-ranked stale chunk can still be retrieved and surfaced alongside the new one."}], "correct": "B", "select": 1}, {"id": "p3-15", "domain": 3, "objective": "Design a RAG pipeline with appropriate chunking and indexing strategies", "situation": "A team is designing a chunking strategy for a knowledge base that serves two very different query types: short factual lookups (\"what is the warranty period for model X?\") and long synthesis requests (\"summarize all safety recalls for model X across the last five years\").", "question": "What chunking approach best serves both query patterns?", "options": [{"letter": "A", "text": "Use one large fixed chunk size tuned for the synthesis queries, since it can be truncated for the factual queries.", "correct": false, "explanation": "Large chunks return excess irrelevant context for short factual lookups, diluting retrieval precision exactly where precision matters most."}, {"letter": "B", "text": "Use one small fixed chunk size tuned for the factual queries, since more of them can be retrieved for synthesis.", "correct": false, "explanation": "Many small, disconnected chunks lose the surrounding context and coherence a synthesis request needs to summarize accurately."}, {"letter": "C", "text": "Maintain multiple chunk granularities, or a hierarchical index, and route retrieval depth to the detected query type.", "correct": true, "explanation": "Matching granularity to query pattern lets short lookups get precise small chunks and synthesis requests get broader, connected context."}, {"letter": "D", "text": "Only index the small factual snippets and answer synthesis queries from the model's general training knowledge instead of retrieval.", "correct": false, "explanation": "This abandons retrieval for exactly the queries that most need grounded, current data spanning multiple recall records."}], "correct": "C", "select": 1}, {"id": "p3-16", "domain": 3, "objective": "Apply retrieval strategies matched to data shape and query pattern", "situation": "An analytics agent must answer questions like \"what were total refunds by region last quarter\" against a well-structured relational sales database with millions of rows.", "question": "What retrieval approach best matches this data shape?", "options": [{"letter": "A", "text": "Chunk the database export into text passages and embed them for vector similarity search.", "correct": false, "explanation": "Relational aggregate queries don't map well to unstructured passage similarity, and this approach would miss most of the rows needed for an accurate total."}, {"letter": "B", "text": "Summarize the entire database into a single document and let the agent read the summary.", "correct": false, "explanation": "A summary loses row-level precision, making it unsuitable for exact aggregate figures like total refunds."}, {"letter": "C", "text": "Fine-tune the model on the database contents so it can answer from memory.", "correct": false, "explanation": "This is unreliable for exact aggregates and becomes stale as soon as the underlying data changes, unlike a live query."}, {"letter": "D", "text": "Translate the question into a SQL query (text-to-SQL) executed directly against the structured database.", "correct": true, "explanation": "A structured query against structured data returns exact, complete aggregates in a way unstructured similarity search cannot."}], "correct": "D", "select": 1}, {"id": "p3-17", "domain": 3, "objective": "Apply retrieval strategies matched to data shape and query pattern", "situation": "Field technicians query a support assistant using exact part numbers and error codes (\"E-4471-B\"), which must match precisely; a colleague suggests pure vector or embedding search will handle this well.", "question": "What is the best retrieval design for this query pattern?", "options": [{"letter": "A", "text": "Hybrid search combining keyword or exact-match retrieval (e.g., BM25) with embeddings, favoring exact match for code-like tokens.", "correct": true, "explanation": "Hybrid search lets exact-match retrieval handle precise codes while embeddings still cover semantically phrased questions."}, {"letter": "B", "text": "Pure vector embedding search only, since embeddings capture semantic meaning well.", "correct": false, "explanation": "Short alphanumeric codes carry little semantic signal, so exact matches can be missed by pure embedding similarity."}, {"letter": "C", "text": "Increase the embedding model's dimensionality to better capture exact codes.", "correct": false, "explanation": "Higher dimensionality does not fix the fundamental mismatch between semantic embeddings and exact lexical matching."}, {"letter": "D", "text": "Ask the agent to reformat the query into natural language before embedding it.", "correct": false, "explanation": "Rephrasing an exact code into prose does not improve exact-match retrieval for that code."}], "correct": "A", "select": 1}, {"id": "p3-18", "domain": 3, "objective": "Apply retrieval strategies matched to data shape and query pattern", "situation": "An internal assistant must answer questions about reporting-line and approval-chain relationships (\"who are the two levels of managers above this employee who can approve this expense\"), where the underlying data is a highly connected organizational hierarchy.", "question": "Which retrieval approach best matches this data shape?", "options": [{"letter": "A", "text": "Chunk employee profile documents and rely on embedding similarity to find related managers.", "correct": false, "explanation": "Embedding similarity does not reliably encode multi-hop hierarchical relationships between specific employees."}, {"letter": "B", "text": "A graph-based retrieval or traversal over the organizational hierarchy rather than flat document search.", "correct": true, "explanation": "Multi-hop relationships like reporting chains are exactly what graph traversal is built to answer accurately."}, {"letter": "C", "text": "Increase the number of retrieved chunks (top-k) in a standard vector search to compensate.", "correct": false, "explanation": "Retrieving more irrelevant chunks does not recover an accurate multi-hop traversal; it just adds noise."}, {"letter": "D", "text": "Summarize the entire org chart into one paragraph for the agent to reason over.", "correct": false, "explanation": "A single summary loses precision and does not scale as the organization and its reporting lines grow."}], "correct": "B", "select": 1}, {"id": "p3-19", "domain": 3, "objective": "Evaluate connection protocols and select the appropriate integration mechanism (MCP, API/CLI, agent-to-agent)", "situation": "A platform team is standing up integrations for (1) a shared library of tools that many independent agents across the company should discover and reuse, and (2) a single internal agent that needs to make very frequent, tightly-coupled, high-throughput calls to one well-known internal service.", "question": "Select the TWO integration approaches that best fit these two needs respectively. (Select TWO.)", "options": [{"letter": "A", "text": "Require every agent to communicate only via agent-to-agent messaging for both needs, to keep the integration pattern uniform.", "correct": false, "explanation": "Agent-to-agent protocol adds negotiation complexity that neither a plain reusable tool library nor a tightly-coupled service call actually requires."}, {"letter": "B", "text": "Replace both integrations with a hardcoded prompt describing each system in natural language.", "correct": false, "explanation": "A natural-language description is not an integration mechanism and cannot reliably invoke real calls against either system."}, {"letter": "C", "text": "Expose the shared, reusable tool library through an MCP server so any compliant agent can discover and use it.", "correct": true, "explanation": "MCP's discoverable, standardized tool interface is exactly suited to a capability meant to be found and reused by many independent agents."}, {"letter": "D", "text": "Wrap the high-throughput internal service in the same MCP server as the shared library, to keep everything in one place.", "correct": false, "explanation": "This adds discovery and protocol overhead to a tightly-coupled, high-frequency call where that overhead isn't needed."}, {"letter": "E", "text": "Call the high-throughput internal service directly via its existing API or CLI, since it's tightly coupled and doesn't need discovery.", "correct": true, "explanation": "A direct API/CLI call is the least-complex mechanism suited to a single, tightly-coupled, high-frequency integration that no other agent needs to discover."}], "correct": ["C", "E"], "select": 2}, {"id": "p3-20", "domain": 3, "objective": "Evaluate connection protocols and select the appropriate integration mechanism (MCP, API/CLI, agent-to-agent)", "situation": "Five different internal agent teams each need to call the same document-search capability, and new agent teams are added every quarter. Currently each team has built its own bespoke API client with slightly different behavior, causing duplicated bugs.", "question": "What integration mechanism best fits this need?", "options": [{"letter": "A", "text": "Have each new team keep writing its own direct API client, since the underlying service is stable.", "correct": false, "explanation": "This perpetuates the duplication and inconsistent behavior that is already causing bugs."}, {"letter": "B", "text": "Migrate the capability to an agent-to-agent protocol so agents can negotiate the interface at runtime.", "correct": false, "explanation": "Runtime negotiation adds complexity that isn't needed when the interface is simply meant to be reused consistently, not negotiated."}, {"letter": "C", "text": "Publish a CLI tool and require every agent's runtime to shell out to it.", "correct": false, "explanation": "Shelling out to a CLI is heavier and less standardized for agent tool-calling across many independent teams than a proper discoverable tool interface."}, {"letter": "D", "text": "Expose the capability as an MCP server with a standardized tool interface that any agent can discover and call consistently.", "correct": true, "explanation": "A standardized, discoverable interface removes the need for each team to reimplement its own client, matching the recurring-reuse pattern described."}], "correct": "D", "select": 1}, {"id": "p3-21", "domain": 3, "objective": "Evaluate connection protocols and select the appropriate integration mechanism (MCP, API/CLI, agent-to-agent)", "situation": "A developer needs a single internal agent to run one simple, well-known internal script once during a batch job, with no other agent or team ever expected to reuse this integration.", "question": "What is the most appropriate integration mechanism?", "options": [{"letter": "A", "text": "Call the script directly via a simple API or CLI invocation.", "correct": true, "explanation": "The least-complex mechanism that meets the stated requirement is a direct call, with no unearned discovery or negotiation machinery."}, {"letter": "B", "text": "Stand up a dedicated MCP server to expose the script as a discoverable tool.", "correct": false, "explanation": "This adds discovery and protocol overhead that is disproportionate to a one-off integration nobody else will reuse."}, {"letter": "C", "text": "Design an agent-to-agent negotiation protocol so the batch agent and the script can coordinate dynamically.", "correct": false, "explanation": "Dynamic negotiation is unnecessary complexity for a simple, well-known, one-off call."}, {"letter": "D", "text": "Build a general-purpose plugin framework so future scripts can be added the same way.", "correct": false, "explanation": "This is speculative generality not justified by the stated single-use requirement."}], "correct": "A", "select": 1}, {"id": "p3-22", "domain": 3, "objective": "Evaluate progressive discovery vs. monolithic context strategy", "situation": "An agent's system prompt currently embeds full documentation for 60 tools upfront (over 20,000 tokens), even though a typical task only uses two or three of them. Response latency and token cost have grown as more tools were added.", "question": "What is the best fix?", "options": [{"letter": "A", "text": "Summarize each tool's documentation to a single sentence to shrink the upfront prompt.", "correct": false, "explanation": "This still front-loads all 60 tools on every turn, even if compressed, and does not scale as more tools are added."}, {"letter": "B", "text": "Use progressive discovery: expose only a lightweight index of tools upfront, retrieving full documentation for a tool only when it looks relevant to the current task.", "correct": true, "explanation": "Loading detail on demand keeps the upfront context small while still making full documentation available exactly when a task needs it."}, {"letter": "C", "text": "Enable prompt caching on the full 20,000-token tool-documentation block so every session reuses the same cached prefix.", "correct": false, "explanation": "Caching can reduce the cost of reprocessing the same tokens, but every session still must include all 60 tools' documentation up front, so the upfront load keeps growing as more tools are added instead of being loaded on demand."}, {"letter": "D", "text": "Remove tool documentation entirely and let the agent guess parameters from tool names.", "correct": false, "explanation": "This removes needed information rather than loading it on demand, risking incorrect tool calls."}], "correct": "B", "select": 1}, {"id": "p3-23", "domain": 3, "objective": "Evaluate progressive discovery vs. monolithic context strategy", "situation": "A team is converting an agent from a monolithic, upfront-context design (all tool docs and reference data loaded every turn) to a progressive discovery design, in order to cut token usage while preserving correctness.", "question": "Select the TWO elements required to implement progressive discovery correctly. (Select TWO.)", "options": [{"letter": "A", "text": "Deleting the detailed resources once summarized, since only the index needs to be kept.", "correct": false, "explanation": "If the underlying details are deleted, the on-demand fetch step has nothing left to load, breaking the pattern."}, {"letter": "B", "text": "Loading all detailed resources into context by default, in addition to the index, \"just in case.\"", "correct": false, "explanation": "This reproduces the monolithic upfront-context problem the change was meant to fix."}, {"letter": "C", "text": "A rule that the agent must never load more than one resource per session, regardless of task complexity.", "correct": false, "explanation": "An arbitrary rigid cap is unrelated to progressive discovery and could block legitimate tasks that need more than one resource."}, {"letter": "D", "text": "A lightweight, always-available index or directory the agent can search to find which detailed resource to load next.", "correct": true, "explanation": "An index is what lets the agent know what detail exists and is retrievable without loading everything upfront."}, {"letter": "E", "text": "A way to release fetched detail once its sub-task is done, so earlier loads don't quietly regrow the context toward the monolithic size being avoided.", "correct": true, "explanation": "Without a release step, every resource fetched over a long session stays in context permanently, and the token savings the change was meant to deliver erode back toward the original monolithic footprint by the end of the session."}], "correct": ["D", "E"], "select": 2}, {"id": "p3-24", "domain": 3, "objective": "Evaluate progressive discovery vs. monolithic context strategy", "situation": "A small internal agent has exactly four tools, each with brief documentation (under 500 tokens total), used for a single well-defined workflow that rarely changes. An architect proposes building a progressive-discovery, on-demand-loading system for these tool docs to \"future-proof\" the design.", "question": "What is the best judgment here?", "options": [{"letter": "A", "text": "Build the progressive discovery system now, since it will always outperform monolithic context regardless of scale.", "correct": false, "explanation": "This assumes discovery is unconditionally superior; at this small, stable scale the added complexity is not justified by any stated requirement."}, {"letter": "B", "text": "Split the four tools into four separate agents each with progressive discovery of its own single tool.", "correct": false, "explanation": "This massively overcomplicates a small, stable, well-understood workflow that a single agent already handles well."}, {"letter": "C", "text": "Remove tool documentation to save tokens even further since it's already small.", "correct": false, "explanation": "Removing needed documentation addresses a token budget that isn't actually a problem here, at the cost of correctness."}, {"letter": "D", "text": "Keep the monolithic upfront context; with only four tools and low token cost, progressive discovery adds complexity that isn't earned by the current requirement.", "correct": true, "explanation": "The least complex architecture that meets the stated requirement is best; here the small, stable toolset does not justify the added complexity of on-demand loading."}], "correct": "D", "select": 1}, {"id": "p4-01", "domain": 4, "objective": "Define evaluation metrics (accuracy, latency, cost, safety, security)", "situation": "A team ships a customer-support agent that drafts email replies. Legal requires that the agent never fabricate policy details, and the support lead wants replies sent within 5 seconds. The team currently only tracks whether replies were 'helpful' per a thumbs-up survey.", "question": "Which additional metric set would best let the team defend both compliance and user-experience goals?", "options": [{"letter": "A", "text": "Add a factual-accuracy score against a labeled policy reference set, a hallucination/safety flag rate, and p95 latency, tracked separately.", "correct": true, "explanation": "Each stated requirement (no fabrication, response speed) gets its own measurable, independently reportable metric, which is what Legal and the support lead can each act on."}, {"letter": "B", "text": "Track only average thumbs-up rate, since it already reflects user perception of every dimension.", "correct": false, "explanation": "A single subjective proxy conflates distinct, measurable properties like accuracy, safety, and latency into one vague signal."}, {"letter": "C", "text": "Replace the survey with total token count per response, since that best predicts cost.", "correct": false, "explanation": "Token count is a cost proxy and says nothing about factual accuracy or safety, which are the actual stated concerns."}, {"letter": "D", "text": "Track only p95 latency, since Legal's fabrication concern is a training-time problem the eval framework cannot influence.", "correct": false, "explanation": "Fabrication and hallucination rate are exactly the kind of thing an evaluation framework is meant to measure and gate on before release."}], "correct": "A", "select": 1}, {"id": "p4-02", "domain": 4, "objective": "Design evaluation datasets and test frameworks using mixed methodologies", "situation": "A fintech team builds a document-extraction agent. They have 40 hand-labeled invoices covering typical cases only. Before wider rollout, they want a test suite that will catch regressions on edge cases like handwritten totals and multi-currency invoices, not just the happy path.", "question": "What should the team add to the evaluation dataset to responsibly test for these edge cases?", "options": [{"letter": "A", "text": "Increase repetitions of the same 40 invoices to increase statistical confidence.", "correct": false, "explanation": "Repeating identical cases reduces measurement noise but adds no coverage of new failure classes such as handwriting or multi-currency totals."}, {"letter": "B", "text": "Curate a stratified set of adversarial and edge cases (handwriting, multi-currency, low-quality scans) alongside the existing labeled set, combining automated scoring with targeted human review.", "correct": true, "explanation": "Deliberately sampling known failure-prone categories and mixing automated and human judgment is the mixed-methodology approach needed to catch regressions before rollout."}, {"letter": "C", "text": "Rely solely on the underlying model's published general document-understanding benchmark scores.", "correct": false, "explanation": "Published general benchmarks do not reflect this team's specific production distribution or edge cases."}, {"letter": "D", "text": "Ask end users to report issues after go-live instead of testing beforehand.", "correct": false, "explanation": "This is purely reactive and provides no pre-release safety net for known edge-case risks."}], "correct": "B", "select": 1}, {"id": "p4-03", "domain": 4, "objective": "Conduct A/B testing and iterative improvements", "situation": "A team wants to test whether a new system prompt for a sales-assistant chatbot increases conversion without hurting satisfaction. They plan to roll the new prompt out to 50% of traffic for two weeks and compare it against the existing prompt.", "question": "Which practice is most important to make the A/B test result trustworthy?", "options": [{"letter": "A", "text": "Let users opt into whichever variant looks better to them mid-conversation.", "correct": false, "explanation": "Self-selection introduces bias, since the users who switch are not representative of the whole population."}, {"letter": "B", "text": "Compare the first week of the new prompt against the last week of the old prompt from six months ago.", "correct": false, "explanation": "Comparing across different time periods confounds the prompt change with any other seasonal or market changes that happened in between."}, {"letter": "C", "text": "Randomly and consistently assign each user session to a single variant for the whole test, and pre-register the primary success metric before launch.", "correct": true, "explanation": "Consistent random assignment avoids selection bias and cross-contamination, and pre-registering the metric prevents cherry-picking a favorable result after the fact."}, {"letter": "D", "text": "Change the system prompt again partway through the test if early results look weak.", "correct": false, "explanation": "Altering the treatment mid-test invalidates the comparison, since the two arms are no longer testing the same fixed variants."}], "correct": "C", "select": 1}, {"id": "p4-04", "domain": 4, "objective": "Diagnose system issues (prompt failure, hallucinations, model mismatch)", "situation": "A retrieval-augmented support bot begins giving confidently wrong answers about a product's warranty terms two days after the support team updated the warranty policy page in the knowledge base.", "question": "Which two actions should the team take first to diagnose the failure? (Select TWO.)", "options": [{"letter": "A", "text": "Switch to a larger, more capable model to improve reasoning about warranty terms.", "correct": false, "explanation": "There is no evidence of a reasoning or model-capability gap here; the symptom pattern points to content/retrieval, not model mismatch."}, {"letter": "B", "text": "Add a manual disclaimer to every response regardless of topic.", "correct": false, "explanation": "This masks the symptom for users without diagnosing or fixing the underlying stale-retrieval cause."}, {"letter": "C", "text": "Check whether an application-level response cache is still serving previously generated answers to repeated warranty questions.", "correct": true, "explanation": "A response cache sits above the retrieval index and can keep returning an old answer for a repeated question even after the underlying content has been correctly updated."}, {"letter": "D", "text": "Confirm whether the updated page was actually re-indexed and is retrievable by the current chunking/embedding pipeline.", "correct": true, "explanation": "The timing (failure right after a content update) strongly suggests a stale index, so verifying indexing status is the direct first check."}, {"letter": "E", "text": "Increase the number of retrieved documents passed to the model for every query.", "correct": false, "explanation": "Broadening retrieval without first diagnosing whether the index or a cache is stale just adds more of the same potentially outdated content."}], "correct": ["C", "D"], "select": 2}, {"id": "p4-05", "domain": 4, "objective": "Optimize token usage, latency, and cost-performance trade-offs", "situation": "A coding assistant's call chain sends the same 6,000-token style guide and repo README as part of every prompt, then appends the user's short question at the end. Latency and cost are both above target, but accuracy is fine.", "question": "What is the most effective first change to reduce cost and latency without harming accuracy?", "options": [{"letter": "A", "text": "Reorder the prompt so the stable style guide and README come first and are prompt-cached, appending the variable user question last.", "correct": true, "explanation": "Placing stable content in a cacheable prefix and putting only the variable question at the end lets repeated requests reuse cached processing, cutting cost and latency without touching content or model choice."}, {"letter": "B", "text": "Reduce the model to a smaller variant for every request regardless of task complexity.", "correct": false, "explanation": "This risks an accuracy drop, which the team explicitly wants to preserve, and does not address the real inefficiency of re-sending large stable content."}, {"letter": "C", "text": "Compress the user's question by removing words to save tokens.", "correct": false, "explanation": "The user's question is already short; trimming it yields negligible savings compared to the 6,000-token stable content."}, {"letter": "D", "text": "Remove the style guide and README entirely from the prompt.", "correct": false, "explanation": "This content is presumably needed for correct answers, so removing it risks the accuracy the team wants to keep."}], "correct": "A", "select": 1}, {"id": "p4-06", "domain": 4, "objective": "Monitor system performance using logging and observability tools", "situation": "An agent orchestration platform runs hundreds of tool-calling agents per minute in production. Engineers currently learn about failures only when customers complain, sometimes days later.", "question": "What is the most effective way to close this feedback gap?", "options": [{"letter": "A", "text": "Require every agent run to be manually reviewed by an engineer before completion.", "correct": false, "explanation": "Manual review of every run does not scale at hundreds of runs per minute and defeats the purpose of automation."}, {"letter": "B", "text": "Instrument structured logging of prompts, tool calls, outputs, and errors, with dashboards and alerting on anomaly rates.", "correct": true, "explanation": "Structured, correlated logging plus dashboards and alerting gives engineers near-real-time visibility into failures instead of waiting on delayed customer reports."}, {"letter": "C", "text": "Ask customers to fill out a satisfaction survey after every interaction.", "correct": false, "explanation": "Surveys are reactive, have low response rates, and provide no root-cause detail compared to structured system logs."}, {"letter": "D", "text": "Increase the model's context window so it can self-correct more often.", "correct": false, "explanation": "A larger context window does not create the visibility engineers are missing; it does not address the observability gap at all."}], "correct": "B", "select": 1}, {"id": "p4-07", "domain": 4, "objective": "Define evaluation metrics (accuracy, latency, cost, safety, security)", "situation": "A healthcare intake assistant must never expose another patient's PHI, must respond within 3 seconds during business hours, and must stay within a monthly compute budget. The team is designing its evaluation harness.", "question": "Which metric definition set best matches these constraints?", "options": [{"letter": "A", "text": "A single composite 'quality score' blending speed, cost, and safety into one number reported weekly.", "correct": false, "explanation": "A composite score can hide a serious safety regression behind good latency or cost numbers, making it unsuitable for a PHI-sensitive system."}, {"letter": "B", "text": "Only a PHI-leakage rate, since patient safety subsumes all other business concerns.", "correct": false, "explanation": "This ignores the explicit latency and cost constraints stated in the scenario, both of which the team is also responsible for meeting."}, {"letter": "C", "text": "A PHI-leakage rate (security), p95 response latency during peak hours (latency), and cost per resolved conversation (cost), each tracked and gated independently.", "correct": true, "explanation": "Each explicit constraint from the scenario maps to its own dedicated, measurable metric, letting each be reported and gated separately as required."}, {"letter": "D", "text": "Only monthly compute cost, since that is the easiest metric to measure automatically.", "correct": false, "explanation": "Ease of measurement is not a valid reason to drop the explicit safety and latency requirements stated in the scenario."}], "correct": "C", "select": 1}, {"id": "p4-08", "domain": 4, "objective": "Design evaluation datasets and test frameworks using mixed methodologies", "situation": "A team is designing an evaluation dataset and test framework for a legal-summarization agent. They want to catch both objective errors and subjective quality issues before launch.", "question": "Which two elements should the test framework include? (Select TWO.)", "options": [{"letter": "A", "text": "Automated checks (e.g., factual-consistency scoring, citation presence, format validation) run on every candidate response.", "correct": true, "explanation": "Automated checks give fast, reproducible, scalable coverage of objective properties, complementing the slower human review of subjective quality."}, {"letter": "B", "text": "A single end-to-end demo run in front of stakeholders as the sole acceptance gate.", "correct": false, "explanation": "One demo cannot represent the distribution of real inputs the agent will face and provides no systematic coverage."}, {"letter": "C", "text": "Excluding rare document types from testing since they occur less than 5% of the time in production.", "correct": false, "explanation": "Rare cases are exactly where a mixed test framework should provide deliberate coverage, since low frequency does not mean low impact when they fail."}, {"letter": "D", "text": "Automated string-match scoring against reference summaries as the only method, since it is fully reproducible.", "correct": false, "explanation": "String matching penalizes correct paraphrases and cannot capture subjective quality dimensions like tone or completeness."}, {"letter": "E", "text": "A held-out set of documents with human-reviewed rubric-based judgments for tone, completeness, and legal accuracy.", "correct": true, "explanation": "Subjective and nuanced qualities like tone and legal accuracy require structured human judgment against a clear rubric, which automated matching alone cannot provide."}], "correct": ["A", "E"], "select": 2}, {"id": "p4-09", "domain": 4, "objective": "Conduct A/B testing and iterative improvements", "situation": "After an A/B test, the new retrieval configuration shows a statistically significant 3% improvement in answer accuracy, but the team also hears informally that a few testers found it 'felt slower.'", "question": "What should the team do before deciding to roll out the new configuration fully?", "options": [{"letter": "A", "text": "Measure latency formally as a secondary metric in the same test before deciding, since a real latency regression could offset the accuracy gain for the business.", "correct": true, "explanation": "Formally measuring the metric that the anecdote raised turns a vague impression into evidence the team can weigh against the confirmed accuracy improvement."}, {"letter": "B", "text": "Roll out immediately since accuracy improvement was statistically significant.", "correct": false, "explanation": "This ignores a plausible latency regression that was never formally measured and could offset the business value of the accuracy gain."}, {"letter": "C", "text": "Discard the new configuration since informal feedback mentioned it felt slower.", "correct": false, "explanation": "An informal anecdote is not a measured result and should prompt a formal check, not an outright rejection of a statistically significant accuracy gain."}, {"letter": "D", "text": "Ask the same testers again next week and go with whichever answer is louder.", "correct": false, "explanation": "Repeating an informal, unstructured ask does not produce rigorous, measured evidence suitable for a rollout decision."}], "correct": "A", "select": 1}, {"id": "p4-10", "domain": 4, "objective": "Diagnose system issues (prompt failure, hallucinations, model mismatch)", "situation": "A support agent powered by a smaller, faster Claude model starts giving noticeably shallow answers to a subset of complex multi-step billing disputes, while performing fine on routine questions. The prompt and knowledge base have not changed.", "question": "What is the most likely root cause to investigate first?", "options": [{"letter": "A", "text": "Hallucination caused by an outdated knowledge base.", "correct": false, "explanation": "The knowledge base is unchanged and routine questions are unaffected, so stale or wrong retrieved content is not implicated."}, {"letter": "B", "text": "A model-task mismatch, where the smaller/faster model lacks the reasoning depth needed for the more complex subset of cases.", "correct": true, "explanation": "Shallow answers concentrated on complex, multi-step cases while simple cases stay fine is the classic signature of choosing a model whose capability doesn't match task difficulty."}, {"letter": "C", "text": "A prompt injection attack from end users.", "correct": false, "explanation": "There is no evidence of adversarial input; the symptom correlates with task complexity, not with any manipulation pattern."}, {"letter": "D", "text": "A logging misconfiguration hiding successful responses.", "correct": false, "explanation": "A logging issue would not explain an actual quality gap that appears only on complex disputes."}], "correct": "B", "select": 1}, {"id": "p4-11", "domain": 4, "objective": "Optimize token usage, latency, and cost-performance trade-offs", "situation": "A batch-processing pipeline classifies thousands of support tickets nightly. Each ticket is short, and the task is simple triage into five categories. The team currently sends every ticket to the largest available Claude model to 'be safe.'", "question": "What change best optimizes cost without materially harming accuracy?", "options": [{"letter": "A", "text": "Send each ticket twice to two different models and average the result.", "correct": false, "explanation": "This doubles cost and adds unnecessary complexity for a task that is already simple triage."}, {"letter": "B", "text": "Keep the largest model but reduce the number of tickets processed per night.", "correct": false, "explanation": "This reduces coverage and throughput instead of fixing the underlying cost-per-ticket inefficiency of using an oversized model."}, {"letter": "C", "text": "Route the simple triage task to a smaller, faster model, reserving the larger model for tickets flagged as ambiguous by a lightweight confidence check.", "correct": true, "explanation": "Matching a low-complexity, high-volume task to a cheaper model, with the larger model reserved for genuinely ambiguous cases, reduces cost while preserving accuracy where it matters most."}, {"letter": "D", "text": "Cache every model response so repeated identical tickets are free.", "correct": false, "explanation": "Support tickets are largely unique in content, so caching identical requests provides minimal benefit here."}], "correct": "C", "select": 1}, {"id": "p4-12", "domain": 4, "objective": "Monitor system performance using logging and observability tools", "situation": "An on-call rotation receives a page for every tool-call retry, including retries that succeed within milliseconds, alongside pages for real sustained outages. Engineers have started ignoring pages because most of them turn out to be benign, self-resolved retries.", "question": "What is the best fix for this alerting design?", "options": [{"letter": "A", "text": "Increase the retry limit so fewer retries are needed before a call succeeds.", "correct": false, "explanation": "This changes how many retries occur but not what triggers a page, so benign retries can still generate pages and fatigue continues."}, {"letter": "B", "text": "Page every engineer on the team simultaneously for every alert so someone is more likely to notice a real one.", "correct": false, "explanation": "This increases total paging volume and noise rather than reducing it, worsening the fatigue that is already causing pages to be ignored."}, {"letter": "C", "text": "Turn off paging entirely until the retry behavior is fixed.", "correct": false, "explanation": "This removes visibility into genuine outages along with the noise, trading one risk for a different, more serious one."}, {"letter": "D", "text": "Reserve paging for conditions with real, sustained impact, and route benign, self-resolved retries to logs and dashboards instead of a page.", "correct": true, "explanation": "Separating what must interrupt a human from what should merely be recorded restores signal to pages and directly addresses the alert fatigue causing real outages to be ignored."}], "correct": "D", "select": 1}, {"id": "p4-13", "domain": 4, "objective": "Define evaluation metrics (accuracy, latency, cost, safety, security)", "situation": "A financial-advice agent is evaluated before a regulated launch. The compliance team wants defensible, separately reportable evidence across several risk dimensions, not a vague sense that 'it seems fine.'", "question": "Which three metric categories should the evaluation explicitly define and report? (Select THREE.)", "options": [{"letter": "A", "text": "Latency and cost under expected production load.", "correct": true, "explanation": "Operational metrics like latency and cost under realistic load are needed to confirm the system performs acceptably at scale, not just in small tests."}, {"letter": "B", "text": "Pass rate on the small set of demo scenarios the team used internally during development, before broader testing began.", "correct": false, "explanation": "Hand-picked demo scenarios are typically chos
