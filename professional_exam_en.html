, {"letter": "C", "text": "Stakeholders will object to any cost reduction regardless of quality.", "correct": false, "explanation": "This assumes stakeholder reaction rather than identifying the actual architectural risk, which is deploying an unevaluated behavioral change to production."}, {"letter": "D", "text": "Swapping models without re-running the evaluation suite risks a silent regression in task success or output quality that will only surface as unexplained stakeholder complaints, since an unchanged interface does not guarantee unchanged behavior.", "correct": true, "explanation": "Interface compatibility says nothing about behavioral equivalence; skipping the same evaluation suite used at launch removes the only mechanism that would catch a quality regression before it reaches users, repeating the pattern where a change is deployed and only detected later through complaints."}], "correct": "D", "select": 1}, {"id": "p6-17", "domain": 6, "objective": "Support lifecycle phases (discovery, design, handoff, monitoring, iteration)", "situation": "An agent's monitoring dashboard shows steady task-success rate over three months, but no one has reviewed the underlying sample of transcripts in that time. A stakeholder asks whether the metric can be trusted as evidence the agent still meets the original design intent.", "question": "Which of the following should be verified before answering the stakeholder? (Select TWO.)", "options": [{"letter": "A", "text": "Whether a fresh manual sample of real transcripts confirms the automated scoring still matches actual observed agent behavior, ruling out a silently broken scoring or logging pipeline.", "correct": true, "explanation": "An automated metric can stay flat even if the scoring or logging mechanism itself has degraded; spot-checking real transcripts is the only way to confirm the number still reflects reality."}, {"letter": "B", "text": "Whether the dashboard's visual theme matches company branding.", "correct": false, "explanation": "Visual styling has no bearing on whether the underlying metric still reflects the agent's actual behavior against design intent."}, {"letter": "C", "text": "Whether the dashboard refreshes fast enough to be considered real-time.", "correct": false, "explanation": "Refresh speed is about timeliness of display, not about whether the metric's definition or scoring pipeline still corresponds to the original design intent."}, {"letter": "D", "text": "Whether more stakeholders have access to view the dashboard.", "correct": false, "explanation": "Dashboard access permissions do not address whether the metric itself remains a valid measure of the agent meeting its design intent."}, {"letter": "E", "text": "Whether the definition of \"success\" used to compute the metric still matches the original design intent, since a fixed metric label can silently diverge from what it originally measured.", "correct": true, "explanation": "A steady number can mask drift if the success definition itself has quietly changed or was always loosely specified relative to design intent; this must be re-confirmed, not assumed."}], "correct": ["A", "E"], "select": 2}, {"id": "p6-18", "domain": 6, "objective": "Support lifecycle phases (discovery, design, handoff, monitoring, iteration)", "situation": "A build team is preparing to hand off a fraud-detection agent to an operations team. The build team wants to close out the project quickly and proposes a handoff consisting of a single email with a link to the code repository.", "question": "Which elements should be required in the handoff before the build team disengages? (Select THREE.)", "options": [{"letter": "A", "text": "A named point of contact and escalation path for issues the runbook does not cover.", "correct": true, "explanation": "No runbook anticipates every failure mode; an explicit escalation path prevents operations from being stuck with an unresolvable issue and no one to ask, especially critical for a fraud-detection system where false negatives have direct financial impact."}, {"letter": "B", "text": "A 30-day warranty period during which the build team fixes defects found by operations.", "correct": false, "explanation": "A time-boxed warranty is a defensible transitional practice, but it is not itself a handoff prerequisite: it does not give operations the runbook, escalation path, or monitoring thresholds needed to run the system once the warranty period ends."}, {"letter": "C", "text": "A one-time knowledge-transfer session where the build team walks operations through the code, with no written artifact retained afterward.", "correct": false, "explanation": "A verbal walkthrough with nothing durable left behind means the knowledge is gone the moment questions arise later; unlike a runbook or documented escalation path, it leaves no artifact operations can reference during an actual incident."}, {"letter": "D", "text": "A runbook covering known failure modes, how to detect them, and the response procedure for each.", "correct": true, "explanation": "Operations needs a concrete procedure for known failure modes so they can respond without needing to reach the original build team during an incident."}, {"letter": "E", "text": "Defined monitoring thresholds and alert routing so operations knows what triggers a page and who receives it.", "correct": true, "explanation": "Without agreed thresholds and routing, degraded behavior can run silently, exactly as in a case where no one is positioned to detect a live failure."}], "correct": ["A", "D", "E"], "select": 3}, {"id": "p7-01", "domain": 7, "objective": "Configure Claude tools and environments for teams (e.g., Claude Code)", "situation": "A platform team onboards 40 engineers onto Claude Code across several repositories. Each repo has its own conventions (test commands, lint rules, code-review checklist) that new hires currently learn by reading old pull requests. The team wants every engineer's assistant to consistently ry comment for the pull request. Each engineer phrases the request slightly differently, and some steps get skipped.", "question": "What change best improves consistency and reduces repeated manual instruction for this recurring task?", "options": [{"letter": "A", "text": "Send a team-wide message reminding everyone to phrase the request the same way in the future.", "correct": false, "explanation": "A verbal reminder does not change tooling and will not hold up over time; engineers will drift back to inconsistent phrasing and it does not prevent skipped steps."}, {"letter": "B", "text": "Switch to a more capable model so it infers the missing steps automatically, without changing how the task is invoked.", "correct": false, "explanation": "This adds capability rather than fixing the process; the task still lacks a defined, repeatable structure, so inconsistency is likely to remain even with a stronger model."}, {"letter": "C", "text": "Ask engineers to write out the full multi-step instructions from scratch in each session as documentation.", "correct": false, "explanation": "This still requires manual repetition every session and does not remove the inconsistency; it only adds overhead without solving the underlying repeatability problem."}, {"letter": "D", "text": "Package the multi-step task as a reusable command or skill that any engineer can invoke by name, so the same steps run the same way every time.", "correct": true, "explanation": "Turning a recurring, well-defined sequence into a reusable named command standardizes the steps, removes reliance on each engineer's phrasing, and makes it far less likely a step is skipped."}], "correct": "D", "select": 1}, {"id": "p7-05", "domain": 7, "objective": "Improve developer workflows using AI-assisted tooling", "situation": "A team is deciding how to introduce AI-assisted tooling into their existing code-review process. One proposal is to have an autonomous multi-step agent independently review every pull request, approve minor ones, and escalate to a human only when it judges the change to be risky. A simpler alternative is a single-step assistant call that summarizes the diff and flags common issues for a human reviewer to confirm.", "question": "Given that most pull requests in this team are small, low-risk documentation and config changes, which approach best fits the stated need?", "options": [{"letter": "A", "text": "Use the simpler single-step summarize-and-flag assistant, keeping a human as the final approver.", "correct": true, "explanation": "The workload is mostly small, low-risk changes, so the least complex architecture that meets the need is appropriate; a single-step summary with human confirmation delivers the workflow benefit without unjustified autonomy or approval risk."}, {"letter": "B", "text": "Adopt the autonomous multi-step review agent with self-approval authority, since it can scale further as the team grows.", "correct": false, "explanation": "This introduces agentic complexity and unsupervised approval authority that has not been justified by the actual workload, which is mostly small and low-risk; the added complexity does not earn its keep here."}, {"letter": "C", "text": "Build a custom multi-agent pipeline with separate agents for style, security, and business-logic review before any human sees the pull request.", "correct": false, "explanation": "A multi-agent pipeline is disproportionate complexity for a workload dominated by small, low-risk changes; the stated need does not justify this level of architecture."}, {"letter": "D", "text": "Skip AI assistance entirely and keep the review process fully manual to avoid any risk of a missed issue.", "correct": false, "explanation": "This ignores the improvement opportunity entirely; a lightweight assistant step can reduce reviewer effort on repetitive small changes without materially increasing risk, so discarding tooling outright is not the best fit."}], "correct": "A", "select": 1}, {"id": "p7-06", "domain": 7, "objective": "Improve developer workflows using AI-assisted tooling", "situation": "A team is rolling out Claude Code to improve day-to-day developer workflows. Leadership wants to select a small set of practices most likely to yield durable, teamwide gains rather than one-off convenience for individual engineers.", "question": "Which two practices are most likely to produce durable, teamwide workflow improvements? (Select TWO.)", "options": [{"letter": "A", "text": "Check reusable commands/skills and shared project instructions into version control so they are available to the whole team and evolve with the codebase.", "correct": true, "explanation": "Versioned, shared configuration benefits every engineer automatically and stays in sync with the code it supports, producing a durable, teamwide improvement rather than a personal convenience."}, {"letter": "B", "text": "Identify recurring, well-defined multi-step tasks across the team and convert them into standardized reusable workflows.", "correct": true, "explanation": "Targeting genuinely recurring tasks for standardization produces compounding, teamwide time savings and consistency, which is a durable improvement rather than a one-off convenience."}, {"letter": "C", "text": "Encourage each engineer to keep their own private set of ad hoc prompts tailored to their personal style.", "correct": false, "explanation": "Private, individual prompt customization does not transfer to the rest of the team and produces personal convenience rather than a durable, teamwide improvement."}, {"letter": "D", "text": "Wait until every engineer independently discovers useful patterns before standardizing anything.", "correct": false, "explanation": "This delays teamwide benefit indefinitely and leaves individuals to duplicate effort in isolation, rather than deliberately identifying and standardizing what already recurs."}, {"letter": "E", "text": "Measure how many prompts each engineer sends per day and reward the highest-volume users.", "correct": false, "explanation": "This is a vanity metric that does not measure workflow quality or team-level improvement, and can incentivize busywork rather than genuine gains."}], "correct": ["A", "B"], "select": 2}, {"id": "p7-07", "domain": 7, "objective": "Support debugging and operational issue resolution", "situation": "An engineer notices that a coding-assistant agent produces a different code suggestion for the exact same file and the exact same prompt on two runs a few minutes apart. Nothing else changed between the runs: not the prompt, not the file, not the model version. The engineer suspects a bug in the tool's file-reading logic and is about to start auditing that code.", "question": "What should the engineer check first, before auditing the file-access code?", "options": [{"letter": "A", "text": "Whether the file-reading tool has a bug that reads a corrupted version of the file on the second run.", "correct": false, "explanation": "This jumps straight to auditing a specific piece of code before ruling out the much simpler explanation of sampling randomness, and the scenario states the exact same file was used both times."}, {"letter": "B", "text": "Whether the agent's tool permissions changed between the two runs.", "correct": false, "explanation": "There is no evidence or reason given to suspect a permissions change, and this does not explain a difference in the generated code suggestion itself."}, {"letter": "C", "text": "Whether the model call used a nonzero sampling temperature or other randomness setting, which alone is sufficient to produce different outputs from identical inputs.", "correct": true, "explanation": "Sampling randomness is a simpler and more common explanation for run-to-run variation on identical input than a bug in file-reading logic, and should be ruled out before a code audit begins."}, {"letter": "D", "text": "Whether a different engineer's session interfered with the same shared agent instance.", " ite actions against production.", "correct": true, "explanation": "Removing destructive capability at the source prevents an incorrect hypothesis from ever being able to cause harm, regardless of how confidently it is stated."}, {"letter": "E", "text": "Require the engineer to verify each hypothesis against actual system output such as logs, metrics, or the current process state before acting on it.", "correct": true, "explanation": "Grounding any proposed explanation in the system's own observed output, rather than accepting a plausible narrative, is the safeguard against acting on an unverified cause under time pressure."}], "correct": ["D", "E"], "select": 2}];
const DOMAINS = {"1": {"name": "Solution Design & Architecture", "weight": 17}, "2": {"name": "Claude Models, Prompting & Context Engineering", "weight": 13}, "3": {"name": "Integration", "weight": 19}, "4": {"name": "Evaluation, Testing & Optimization", "weight": 16}, "5": {"name": "Governance, Safety & Risk Management", "weight": 14}, "6": {"name": "Stakeholder Communication & Lifecycle Management", "weight": 14}, "7": {"name": "Developer Productivity & Operational Enablement", "weight": 7}};
const T = {"questions": "Questions", "answered": "Answered", "mode_study": "Study", "mode_exam": "Exam", "mode_hint_study": "Answers reveal as you go", "mode_hint_exam": "Answers reveal at the end", "prev": "← Prev", "next": "Next →", "finish": "Finish &amp; Review", "question": "Question", "your_answer": "Your answer", "correct": "Correct", "why": "Why", "complete": "Exam Complete", "answered_of": "You answered {a} of {t} questions.", "unanswered": "&#9888; {n} question(s) not answered (counted as incorrect).", "score": "Score", "pass": "PASS", "fail": "FAIL", "by_domain": "Score by domain", "review_wrong": "Review incorrect answers", "all_correct": "Every question correct — outstanding!", "restart": "Restart (new draw)", "weight": "weight", "threshold_note": "Pass mark set at {p}/1000, the real CCAR-P cut score. Each attempt draws 63 questions weighted to the official domain blueprint (11/8/12/10/9/9/4). Multiple-response items are scored all-or-nothing. The score is scaled to 1000 as a study approximation of the real 100–1,000 scaled score. These are Ravn-authored practice items, not real exam content.", "incorrect": "incorrect", "domain": "Domain", "select_n": "Select {n} responses.", "select_full": "All {n} responses chosen. Deselect one to change your answer.", "not_answered": "Not answered", "incomplete_answer": "incomplete answer"};
const PASS_PCT = 72;          // per-domain bar coloring threshold (%)
const PASS_SCORE = 720;  // overall cut score on the 100–1000 scale
// Questions drawn per domain each attempt. Either a single number applied to
// every domain (Foundations: 12 across 5 domains) or a { domain: count } map
// when the draw is weighted (Professional: 11/8/12/10/9/9/4 across 7 domains).
const PER_DOMAIN = {"1": 11, "2": 8, "3": 12, "4": 10, "5": 9, "6": 9, "7": 4};
const STORE_KEY = "ccarp-exam-en";
// Bumped when a saved attempt stops being valid — a blueprint revision that
// changes the per-domain draw, or a change to the shape of a stored answer.
// An older payload is dropped, which resets an attempt in progress once.
const STORE_VERSION = 2;

function drawCount(domain) {
  return (typeof PER_DOMAIN === "number") ? PER_DOMAIN : (PER_DOMAIN[domain] ?? 0);
}

// The draw actually achievable per domain: the requested count, capped by how
// many questions that domain holds (so it never over-draws a small domain).
function drawPerDomain() {
  const byDomain = {};
  QUESTIONS.forEach(q => { byDomain[q.domain] = (byDomain[q.domain] || 0) + 1; });
  const out = {};
  Object.keys(byDomain).forEach(d => { out[d] = Math.min(byDomain[d], drawCount(d)); });
  return out;
}

// Number of questions in one attempt.
function examSize() {
  return Object.values(drawPerDomain()).reduce((s, c) => s + c, 0);
}

// ---- answer shape --------------------------------------------------------
// Single-response items store a letter ("B"); multiple-response items store an
// array of letters (["A","C"]) and carry an array `correct`. Everything below
// branches on that so both shapes share one engine.
function isMulti(q) { return Array.isArray(q.correct); }
function selectCount(q) { return isMulti(q) ? q.correct.length : 1; }

function asLetters(v) {
  if (v === undefined || v === null) return [];
  return (Array.isArray(v) ? v.slice() : [v]).sort();
}

// "Answered" means a *complete* answer of the shape this item expects: one
// letter, or exactly the required number of letters. A partly-filled multi item
// does not count as answered, and neither does a stored value of the wrong
// shape — that is stale state from an item that changed response type.
function hasAnswer(q, ans) {
  if (ans === undefined || ans === null) return false;
  if (Array.isArray(ans) !== isMulti(q)) return false;
  return Array.isArray(ans) ? ans.length === selectCount(q) : true;
}

// Multiple-response items are scored all-or-nothing, like the real exam.
function isCorrect(q, ans) {
  if (!hasAnswer(q, ans)) return false;
  const a = asLetters(ans), c = asLetters(q.correct);
  return a.length === c.length && a.every((v, i) => v === c[i]);
}

function isChosenLetter(ans, letter) {
  if (ans === undefined || ans === null) return false;
  return Array.isArray(ans) ? ans.indexOf(letter) >= 0 : ans === letter;
}

function letterLabel(v) { return asLetters(v).join(", "); }

// ---- grading -------------------------------------------------------------
// "incomplete" is a multiple-response item with some but not all of its letters
// picked. It is not an answer, so it scores as incorrect — and it must still
// reach the review pane, or the candidate never sees the rationale.
function classify(q, ans) {
  if (!hasAnswer(q, ans)) return "incomplete";
  return isCorrect(q, ans) ? "correct" : "incorrect";
}

// Tally one attempt. Pure on purpose: the summary screen below only renders
// what this returns, so the regression harness can check the bucketing.
function tallyAttempt(active, answers) {
  const domStat = {}, wrongByDomain = {};
  let answered = 0, correct = 0;
  active.forEach(q => {
    domStat[q.domain] = domStat[q.domain] || { correct: 0, total: 0 };
    domStat[q.domain].total++;
    const ans = answers[q.id];
    const verdict = classify(q, ans);
    if (verdict !== "incomplete") answered++;
    if (verdict === "correct") { correct++; domStat[q.domain].correct++; return; }
    (wrongByDomain[q.domain] = wrongByDomain[q.domain] || [])
      .push({ q: q, chosen: ans, verdict: verdict });
  });
  const total = active.length;
  return { total: total, answered: answered, correct: correct,
           wrong: answered - correct, unanswered: total - answered,
           domStat: domStat, wrongByDomain: wrongByDomain };
}

const state = { current: 0, answers: {}, order: [], mode: "study" };

// ---- persistence ---------------------------------------------------------
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(
    { v: STORE_VERSION, answers: state.answers, order: state.order,
      mode: state.mode, current: state.current })); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    // A payload from a different version is discarded, not migrated. A payload
    // written before versioning existed carries no stamp: it is still accepted,
    // because nothing about it is known to be stale and the checks below
    // validate it on its own terms. That keeps attempts in progress alive.
    if (d.v !== undefined && d.v !== STORE_VERSION) return null;
    // Order is valid only if it still matches the current attempt size.
    if (!Array.isArray(d.order) || d.order.length !== examSize()) return null;
    const ids = new Set(QUESTIONS.map(q => q.id));
    if (!d.order.every(id => ids.has(id))) return null;
    // The total survives a blueprint revision that only moves items between
    // domains, so check the per-domain mix too. Without this a returning
    // candidate keeps the old weighting under a note that claims the new one.
    const want = drawPerDomain(), got = {};
    d.order.forEach(id => { const q = qById(id); if (q) got[q.domain] = (got[q.domain] || 0) + 1; });
    if (Object.keys(want).some(d2 => (got[d2] || 0) !== want[d2])) return null;
    return d;
  } catch (e) { return null; }
}

// ---- order ---------------------------------------------------------------
// Draw PER_DOMAIN random questions from each domain (the "question bank"
// behavior), keeping domains in order. Within a domain the drawn questions are
// already in random order from the shuffle. Option order is never shuffled (the
// answer key is by letter).
function shuffleOrder() {
  const byDomain = {};
  QUESTIONS.forEach(q => { (byDomain[q.domain] = byDomain[q.domain] || []).push(q.id); });
  const order = [];
  Object.keys(byDomain).sort((a, b) => a - b).forEach(d => {
    const ids = byDomain[d].slice();
    for (let i = ids.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ids[i], ids[j]] = [ids[j], ids[i]];
    }
    order.push(...ids.slice(0, drawCount(d)));
  });
  return order;
}
function qById(id) { return QUESTIONS.find(q => q.id === id); }
function orderedQuestions() { return state.order.map(qById); }

// Everything below writes into innerHTML, and every string it writes is
// authored data. esc() runs first so a raw "<" in an item ("latency < 500 ms")
// stays text instead of becoming markup.
function esc(text) {
  if (text === undefined || text === null) return "";
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function md(text) {
  if (!text) return "";
  return esc(text).replace(/`([^`]+)`/g, "<code>$1</code>")
                  .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
                  .replace(/\n/g, " ");
}

// ---- sidebar -------------------------------------------------------------
function buildSidebar() {
  const list = document.getElementById("sidebarList");
  list.innerHTML = "";
  document.getElementById("totalCount").textContent = state.order.length;
  const qs = orderedQuestions();
  let curDomain = null, groupEl = null;
  qs.forEach((q, idx) => {
    if (q.domain !== curDomain) {
      curDomain = q.domain;
      const sg = document.createElement("div");
      sg.className = "domain-group";
      const lbl = document.createElement("div");
      lbl.className = "domain-label";
      const dm = DOMAINS[q.domain];
      lbl.innerHTML = "<span>" + T.domain + " " + q.domain + " · " + esc(dm.name) +
        "</span><span class='dl-weight'>" + dm.weight + "%</span>";
      sg.appendChild(lbl);
      groupEl = sg;
      list.appendChild(sg);
    }
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "q-btn";
    btn.id = "sb-" + idx;
    btn.onclick = () => goto(idx);
    btn.innerHTML = "<span class='q-dot'></span> " + (idx + 1);
    groupEl.appendChild(btn);
  });
}

function updateSidebar() {
  const qs = orderedQuestions();
  let answeredCount = 0;
  qs.forEach((q, idx) => {
    const btn = document.getElementById("sb-" + idx);
    if (!btn) return;
    btn.className = "q-btn";
    if (idx === state.current) btn.classList.add("active");
    const ans = state.answers[q.id];
    if (hasAnswer(q, ans)) {
      answeredCount++;
      if (state.mode === "exam") btn.classList.add("answered");
      else btn.classList.add(isCorrect(q, ans) ? "answered-correct" : "answered-wrong");
    }
  });
  document.getElementById("answeredCount").textContent = answeredCount;
}

// ---- question render -----------------------------------------------------
function renderQuestion(idx) {
  const qs = orderedQuestions();
  const q = qs[idx];
  const chosen = state.answers[q.id];
  // Study mode reveals only once the answer is complete — for a multi item that
  // means all N letters are selected, so partial picks stay editable.
  const reveal = hasAnswer(q, chosen) && state.mode === "study";

  document.getElementById("qCounter").textContent = (idx + 1) + " / " + qs.length;
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === qs.length - 1;

  const dm = DOMAINS[q.domain];
  const scenarioTag = q.scenario ? "<span class='q-scenario'>" + esc(q.scenario) + "</span>" : "";
  const situation = q.situation ? "<div class='q-situation'>" + md(q.situation) + "</div>" : "";

  // A multi item with all N picks in place: the remaining options are dimmed
  // and inert, so it reads as "deselect one first" instead of a dead click.
  const atCapacity = !reveal && isMulti(q) && hasAnswer(q, chosen);

  const optionsHtml = q.options.map(opt => {
    let cls = "option";
    const isChosen = isChosenLetter(chosen, opt.letter);
    if (reveal) {
      cls += " locked";
      if (opt.correct) cls += " correct";
      else if (isChosen) cls += " wrong";
      else cls += " dimmed";
    } else if (isChosen) {
      cls += " selected";
    } else if (atCapacity) {
      cls += " dimmed";
    }
    // In study mode after answering, show explanation for the correct option
    // and for the (wrong) one the user picked.
    const showExpl = reveal && opt.explanation && (opt.correct || isChosen);
    // A revealed option is inert for good, so `disabled` fits. An at-capacity
    // option is not: it becomes selectable again as soon as the candidate
    // deselects a letter, so it stays in the tab order and only reports itself
    // as unavailable. `disabled` here would hide it from keyboard and screen
    // reader users, and the visible hint below explains the state.
    const disabled = reveal ? " disabled"
                   : ((atCapacity && !isChosen) ? " aria-disabled='true'" : "");
    const expl = opt.explanation
      ? "<div class='opt-expl" + (showExpl ? " show" : "") + "'>" + md(opt.explanation) + "</div>"
      : "";
    return "<div class='" + cls + "' data-letter='" + opt.letter + "'>" +
      "<button type='button' class='option-head' aria-pressed='" + String(isChosen) + "'" + disabled +
        " onclick=\"answer('" + q.id + "','" + opt.letter + "')\">" +
        "<span class='opt-letter'>" + opt.letter + "</span>" +
        "<span class='opt-text'>" + md(opt.text) + "</span>" +
      "</button>" + expl + "</div>";
  }).join("");

  document.getElementById("qCard").innerHTML =
    "<div class='q-number'>" + T.question + " " + (idx + 1) + "</div>" +
    "<div><span class='q-domain'>" + T.domain + " " + q.domain + " · " + esc(dm.name) + "</span>" +
    scenarioTag + "</div>" +
    situation +
    "<div class='q-prompt'>" + md(q.question) + "</div>" +
    (isMulti(q)
      ? "<div class='q-select'>" + T.select_n.replace("{n}", selectCount(q)) + "</div>" +
        (atCapacity
          ? "<div class='q-select-hint'>" + T.select_full.replace("{n}", selectCount(q)) + "</div>"
          : "")
      : "") +
    "<div class='options'>" + optionsHtml + "</div>";
}

function answer(id, letter) {
  const q = qById(id);
  const n = selectCount(q);
  const locked = state.mode === "study" && hasAnswer(q, state.answers[id]);
  if (locked) return;

  if (n === 1) {
    state.answers[id] = letter;
  } else {
    // Toggle within the allowed number of selections. Re-clicking a chosen
    // letter removes it, so a candidate can correct a pick before completing.
    const cur = Array.isArray(state.answers[id]) ? state.answers[id].slice() : [];
    const at = cur.indexOf(letter);
    if (at >= 0) cur.splice(at, 1);
    else if (cur.length < n) cur.push(letter);
    // At capacity on an unpicked letter: nothing changes, so return before the
    // re-render. Repainting the card would throw away the keyboard focus.
    else return;
    state.answers[id] = cur;
  }
  save();
  renderQuestion(state.current);
  updateSidebar();
}

function navigate(dir) { goto(state.current + dir); }
function goto(idx) {
  const qs = orderedQuestions();
  if (idx < 0 || idx >= qs.length) return;
  document.getElementById("questionScreen").classList.add("active");
  document.getElementById("summaryScreen").classList.remove("active");
  state.current = idx;
  save();
  renderQuestion(idx);
  updateSidebar();
}

function setMode(mode) {
  state.mode = mode;
  document.getElementById("modeStudy").classList.toggle("active", mode === "study");
  document.getElementById("modeExam").classList.toggle("active", mode === "exam");
  document.getElementById("modeStudy").setAttribute("aria-pressed", String(mode === "study"));
  document.getElementById("modeExam").setAttribute("aria-pressed", String(mode === "exam"));
  document.getElementById("modeHint").textContent =
    mode === "study" ? T.mode_hint_study : T.mode_hint_exam;
  save();
  renderQuestion(state.current);
  updateSidebar();
}

// ---- summary -------------------------------------------------------------
function showSummary() {
  document.getElementById("questionScreen").classList.remove("active");
  document.getElementById("summaryScreen").classList.add("active");

  // Only the questions in this attempt (PER_DOMAIN per domain) count. The
  // review pane lists every item that did not score, including the ones left
  // blank or half-picked: those count as incorrect, so they need a rationale.
  const active = orderedQuestions();
  const tally = tallyAttempt(active, state.answers);
  const total = tally.total, answered = tally.answered, correct = tally.correct;
  const wrong = tally.wrong, unanswered = tally.unanswered;
  const domStat = tally.domStat, wrongByDomain = tally.wrongByDomain;

  const pct = total ? Math.round(correct / total * 100) : 0;
  const score = total ? Math.round(correct / total * 1000) : 0; // scaled to 1000
  const passed = score >= PASS_SCORE;

  let domainScoresHtml = "";
  Object.keys(domStat).sort((a, b) => a - b).forEach(d => {
    const s = domStat[d], dm = DOMAINS[d];
    const dpct = s.total ? Math.round(s.correct / s.total * 100) : 0;
    const barCls = dpct >= PASS_PCT ? "" : (dpct >= 50 ? "low" : "bad");
    domainScoresHtml +=
      "<div class='ds-row'>" +
        "<div class='ds-name'>" + T.domain + " " + d + " · " + esc(dm.name) +
          " <small>(" + dm.weight + "% " + T.weight + ")</small></div>" +
        "<div class='ds-bar'><div class='" + barCls + "' style='width:" + dpct + "%'></div></div>" +
        "<div class='ds-pct'>" + s.correct + "/" + s.total + " · " + dpct + "%</div>" +
      "</div>";
  });

  let wrongGroupsHtml = "";
  Object.keys(wrongByDomain).sort((a, b) => a - b).forEach(d => {
    const items = wrongByDomain[d], dm = DOMAINS[d];
    const rows = items.map(item => {
      // Both shapes resolve to a list of letters, so a multi item shows every
      // letter it needed and every letter the candidate actually picked.
      const optText = letters => letters
        .map(L => { const o = item.q.options.find(x => x.letter === L); return o ? md(o.text) : ""; })
        .filter(Boolean).join("<br>");
      const chosenLetters = asLetters(item.chosen);
      const correctLetters = asLetters(item.q.correct);
      // One block per correct letter. Joining them into a single paragraph left
      // the reader unable to tell which rationale explained which letter.
      const expl = correctLetters.map(L => {
        const o = item.q.options.find(x => x.letter === L);
        return (o && o.explanation)
          ? "<div class='wi-expl'><strong>" + T.why + " " + L + ":</strong> " + md(o.explanation) + "</div>"
          : "";
      }).join("");
      // Nothing picked reads as "Not answered" rather than an empty dash; a
      // half-picked multi item shows its letters and says it is incomplete.
      const yours = chosenLetters.length
        ? "<span class='wi-wrong-tag'>" + letterLabel(chosenLetters) + "</span>" +
          (item.verdict === "incomplete"
            ? " <span class='wi-wrong-tag'>(" + T.incomplete_answer + ")</span>" : "") +
          " — " + optText(chosenLetters)
        : "<span class='wi-wrong-tag'>" + T.not_answered + "</span>";
      return "<div class='wrong-item'>" +
        "<div class='wi-n'>" + esc(item.q.id).toUpperCase() + "</div>" +
        "<div class='wi-q'>" +
          (item.q.situation ? "<div class='wi-situation'>" + md(item.q.situation) + "</div>" : "") +
          "<div class='wi-prompt'>" + md(item.q.question) + "</div>" +
          "<div class='wi-ans'>" + T.your_answer + ": " + yours + "<br>" +
            T.correct + ": <span class='wi-correct-tag'>" + letterLabel(correctLetters) + "</span> — " +
            optText(correctLetters) + "</div>" + expl +
        "</div></div>";
    }).join("");
    wrongGroupsHtml += "<div class='group-block'><div class='group-title'>" +
      T.domain + " " + d + " · " + esc(dm.name) +
      "<span class='group-badge'>" + items.length + " " + T.incorrect + "</span></div>" + rows + "</div>";
  });

  const unansweredNote = unanswered > 0
    ? "<p style='color:#e53e3e;font-size:14px;margin-bottom:18px;font-weight:600;'>" +
      T.unanswered.replace("{n}", unanswered) + "</p>" : "";

  document.getElementById("summaryContent").innerHTML =
    "<h1>" + T.complete + "</h1>" +
    "<p class='summary-subtitle'>" + T.answered_of.replace("{a}", answered).replace("{t}", total) + "</p>" +
    "<div class='verdict " + (passed ? "pass" : "fail") + "'>" + (passed ? T.pass : T.fail) + "</div>" +
    unansweredNote +
    "<div class='score-grid'>" +
      "<div class='score-card total'><div class='big'>" + score +
        "<span style='font-size:18px;color:#a0aec0;font-weight:700;'>/1000</span></div>" +
        "<div class='label'>" + T.score + "</div></div>" +
      "<div class='score-card correct-c'><div class='big'>" + correct + "</div><div class='label'>" + T.correct + "</div></div>" +
      "<div class='score-card wrong-c'><div class='big'>" + (wrong + unanswered) + "</div><div class='label'>" + T.incorrect + "</div></div>" +
    "</div>" +
    "<p class='threshold-note'>" + T.threshold_note.replace("{p}", PASS_SCORE) + "</p>" +
    "<div class='section-title'>" + T.by_domain + "</div>" +
    "<div class='domain-scores'>" + domainScoresHtml + "</div>" +
    ((wrong + unanswered) > 0
      ? "<div class='section-title'>" + T.review_wrong + "</div>" + wrongGroupsHtml
      : "<p style='color:#38a169;font-weight:700;font-size:17px;'>" + T.all_correct + "</p>") +
    "<button type='button' class='restart-btn' onclick='restart()'>" + T.restart + "</button>";
}

function restart() {
  state.answers = {};
  state.current = 0;
  state.order = shuffleOrder();
  save();
  buildSidebar();
  document.getElementById("questionScreen").classList.add("active");
  document.getElementById("summaryScreen").classList.remove("active");
  renderQuestion(0);
  updateSidebar();
}

// ---- init ----------------------------------------------------------------
(function init() {
  const saved = load();
  if (saved) {
    state.answers = saved.answers || {};
    state.order = saved.order;
    state.mode = saved.mode || "study";
    state.current = Math.min(saved.current || 0, state.order.length - 1);
  } else {
    state.order = shuffleOrder();
  }
  setMode(state.mode);
  buildSidebar();
  renderQuestion(state.current);
  updateSidebar();
})();
</script>
</body>
