the remaining 370 in one pass.", "correct": false, "explanation": "Doing the hard files first is defensible, but 'the remaining 370 in one pass' repeats the same problem of an unreviewable batch, and the mechanical bulk is the part best done by a deterministic transformation anyway."}, {"letter": "C", "text": "Apply the uniform change with a scripted transformation verified by the test suite, then have the agent handle the 30 exceptional files individually with human review of each.", "correct": true, "explanation": "The migration has two different problems inside it. The uniform part is deterministic and belongs in a script that can be verified wholesale, and the 30 files that need judgment get individual attention and review — which is where the risk actually is."}, {"letter": "D", "text": "Have the agent rewrite the deprecated library so the 400 files do not need to change.", "correct": false, "explanation": "This replaces a bounded migration with ownership of a logging library the team did not want to maintain, and it leaves the deprecated dependency in place indefinitely."}], "correct": "C", "select": 1}, {"id": "d2-18", "domain": 2, "objective": "Software Engineering Foundations", "situation": "An engineer runs an agent on a task that touches a shared library. Over two hours the agent makes 60 edits across 14 files: some are the intended change, some are experiments it later reversed, and some are unrelated formatting. Everything sits uncommitted in the working tree. The engineer now wants a reviewable change.", "question": "What is the best way to get from this working tree to something a reviewer can act on?", "options": [{"letter": "A", "text": "Commit the whole working tree as one commit titled after the task, and let the reviewer read the diff.", "correct": false, "explanation": "This preserves the experiments and the unrelated formatting alongside the real change, which is what makes the diff hard to review. The commit records where the agent ended up, not what the change is."}, {"letter": "B", "text": "Revert everything and re-run the agent with a more precise prompt, hoping for a cleaner working tree.", "correct": false, "explanation": "Throwing away two hours of work to gamble on a tidier second run is expensive, and an agent working freely will produce exploratory edits again. The output still has to be curated either way."}, {"letter": "C", "text": "Ask the agent to summarise which of its 60 edits were intentional and commit those files.", "correct": false, "explanation": "This delegates the curation back to the source of the mess and works at file granularity, which cannot separate an intended change from unrelated formatting inside the same file."}, {"letter": "D", "text": "Review the working tree hunk by hunk, stage only the edits that belong to the intended change, commit them separately from any formatting cleanup, and discard the reversed experiments.", "correct": true, "explanation": "Version control's job here is to turn an unstructured working tree into a sequence of changes each of which means something. Selective staging separates the intended change from noise at the granularity the noise occurs, and a separate formatting commit keeps the reviewable diff about the behaviour that changed."}], "correct": "D", "select": 1}, {"id": "d2-19", "domain": 2, "objective": "Software Engineering Foundations", "situation": "A Claude-backed service returns a JSON object to several internal consumers. The team needs to add a new field and rename an existing one. Consumers are deployed independently and cannot all be updated at the same time.", "question": "How should the change be sequenced?", "options": [{"letter": "A", "text": "Make both changes in one release and coordinate a simultaneous deploy of every consumer.", "correct": false, "explanation": "The scenario states that consumers deploy independently, so a synchronised release is not available. Attempting it guarantees a window in which some consumers are broken."}, {"letter": "B", "text": "Add the new field and emit both the old and new names for a transition period, migrate consumers, then remove the old name.", "correct": true, "explanation": "Additive changes are backward compatible, so the new field is safe immediately. Emitting both names lets consumers migrate on their own schedule, and removal becomes safe only once none of them reads the old name."}, {"letter": "C", "text": "Rename the field and let consumers fail fast, so it is obvious which ones need updating.", "correct": false, "explanation": "Deliberately breaking production consumers to discover the dependency graph converts a planning problem into an incident."}, {"letter": "D", "text": "Version the response by asking the model to return whichever field names the caller mentions in its request.", "correct": false, "explanation": "Making the response schema depend on model interpretation of the request is unpredictable exactly where a contract needs to be stable. Compatibility belongs in the service's serialization layer, not in the prompt."}], "correct": "B", "select": 1}, {"id": "d2-20", "domain": 2, "objective": "Software Engineering Foundations", "situation": "A team's CI pipeline runs unit tests, linting, and a type check on every pull request. They have just added a Claude-based summarization feature with an evaluation set of 120 labelled examples that takes eleven minutes and real API spend to run.", "question": "How should the evaluation be integrated into the development process?", "options": [{"letter": "A", "text": "Run the full evaluation on every commit alongside the unit tests, so no regression can reach main.", "correct": false, "explanation": "Eleven minutes and real spend on every commit makes the feedback loop slow and the bill unpredictable, which usually ends with the team disabling the check entirely."}, {"letter": "B", "text": "Run the evaluation manually before each release, since it cannot be automated reliably.", "correct": false, "explanation": "It automates perfectly well; the question is when it runs. A manual step before release is the one most likely to be skipped under time pressure, which is when it matters most."}, {"letter": "C", "text": "Run a small fast subset on every pull request that touches the prompt or model configuration, and the full set on merge to main and on a schedule.", "correct": true, "explanation": "This matches check cost to change risk: a quick signal where a regression can be introduced, and the authoritative run where it can be afforded. Path-based triggering also keeps unrelated pull requests fast."}, {"letter": "D", "text": "Replace the evaluation with monitoring of production quality metrics, which reflects real usage.", "correct": false, "explanation": "Production monitoring is valuable and complementary, but as a replacement it means every regression is discovered by users. Pre-merge evaluation exists to catch it before that."}], "correct": "C", "select": 1}, {"id": "d2-21", "domain": 2, "objective": "Software Engineering Foundations", "situation": "An engineer asks an agent to 'clean up' a 3,000-line module while also fixing a reported bug in it. The resulting pull request renames dozens of symbols, reorganises the file, and contains the bug fix somewhere inside.", "question": "Which two problems does this create? (Select TWO.)", "options": [{"letter": "A", "text": "The bug fix cannot be reviewed independently of the reorganisation, so a reviewer cannot confirm the fix is correct or minimal.", "correct": true, "explanation": "A behavioural change buried in a large structural diff is effectively unreviewable. The reviewer either approves the whole thing on trust or re-derives the fix by hand."}, {"letter": "B", "text": "If a regression appears, reverting the change also reverts the bug fix, and bisecting cannot separate the two.", "correct": true, "explanation": "Mixing a refactor with a fix in one commit destroys the ability to undo one without the other, which is exactly what version control is meant to preserve."}, {"letter": "C", "text": "Renaming symbols always breaks external callers, so refactoring should be avoided in shared modules.", "correct": false, "explanation": "Renames within a module need not affect external callers, and refactoring shared code is normal. The problem here is that the changes are combined, not that they happened."}, {"letter": "D", "text": "Agents cannot perform refactoring correctly, so structural changes must always be done by hand.", "correct": false, "explanation": "Agents handle mechanical restructuring well, particularly with tests to verify it. The failure here is in how the task was scoped, not in who performed it."}, {"letter": "E", "text": "The pull request is too large to be checked by the test suite.", "correct": false, "explanation": "Test suites are indifferent to diff size. A large change is harder for humans to review, not for tests to run."}], "correct": ["A", "B"], "select": 2}, {"id": "d2-22", "domain": 2, "objective": "Configuration Management", "situation": "A production service specifies its Claude model by a general alias rather than a fixed version. One Monday, output formatting changes across the board and a downstream parser starts rejecting about 8% of responses. No deployment took place.", "question": "What practice would have prevented this, and what should the team do now?", "options": [{"letter": "A", "text": "Nothing would have prevented it; the parser should be rewritten to accept any formatting.", "correct": false, "explanation": "A parser tolerant of arbitrary formatting is barely a parser, and the team would still have no control over when the model behind their service changes."}, {"letter": "B", "text": "The alias should have been cached locally so the same model is resolved on every request.", "correct": false, "explanation": "Caching a name resolution is not how model selection works. The request names a model; the fix is to name a specific one, not to memoise a lookup."}, {"letter": "C", "text": "The service should have pinned to the newest model automatically, so changes arrive gradually rather than all at once.", "correct": false, "explanation": "Automatic adoption of the newest model is the same uncontrolled exposure by another name, and it does not make behaviour changes gradual."}, {"letter": "D", "text": "Pin an explicit model version in configuration so upgrades are a deliberate, tested change, and treat any future model change as a release that runs the evaluation set first.", "correct": true, "explanation": "Pinning makes the model a managed part of the configuration rather than something that can change underneath a running service. The upgrade then happens on the team's schedule, behind the same evaluation gate as any other behaviour change."}], "correct": "D", "select": 1}, {"id": "d2-23", "domain": 2, "objective": "Configuration Management", "situation": "A team adopts a third-party plugin that adds several agents, a hook, and an MCP server to their Claude Code setup. It works well. Three weeks later a plugin update changes the hook's behaviour and blocks a command the team relies on, and nobody can identify which version introduced it.", "question": "Which configuration practice should the team adopt?", "options": [{"letter": "A", "text": "Pin the plugin to a specific version in committed configuration, and treat an update as a reviewed change — reading what the new version's hooks and servers do before adopting it.", "correct": true, "explanation": "A plugin is a dependency that executes code and installs hooks that fire on the team's tool calls, so it belongs under the same version discipline as any other dependency. Pinning makes the version knowable, and review before adoption is warranted because the update changes what runs on every matching call."}, {"letter": "B", "text": "Configure the plugin to auto-update so the team always has the latest fixes.", "correct": false, "explanation": "Auto-update is what produced the untraceable behaviour change. It maximises exposure to unreviewed third-party code running with the team's privileges."}, {"letter": "C", "text": "Copy the plugin's useful agents into the repository and stop using plugins.", "correct": false, "explanation": "This solves version drift by taking on maintenance of someone else's work and giving up upstream fixes. Pinning achieves the control without the fork."}, {"letter": "D", "text": "Disable hooks globally so a plugin update can never block a command.", "correct": false, "explanation": "Hooks are the team's own enforcement mechanism for safety rules. Disabling them all to contain one plugin removes a control the team depends on elsewhere."}], "correct": "A", "select": 1}, {"id": "d2-24", "domain": 2, "objective": "Configuration Management", "situation": "A team runs the same Claude application in development, staging, and production. Development should use a cheaper model and verbose logging, production must use the pinned production model with strict guardrails, and the prompt text should be identical everywhere. Currently an engineer edits constants in the code before deploying to each environment.", "question": "How should this configuration be managed?", "options": [{"letter": "A", "text": "Maintain three long-lived branches, one per environment, each with its constants set appropriately.", "correct": false, "explanation": "Per-environment branches drift apart and turn every change into three merges. It also means the code deployed to production is not the code tested in staging."}, {"letter": "B", "text": "Have the application detect its environment at runtime and choose settings with conditionals scattered through the code.", "correct": false, "explanation": "Environment conditionals spread through the code make the effective configuration impossible to read in one place, which is how a development-only setting reaches production unnoticed."}, {"letter": "C", "text": "Keep editing the constants but add a checklist to the deployment runbook.", "correct": false, "explanation": "A manual step guarded by a checklist is the failure mode with paperwork attached. It leaves the deployed configuration dependent on someone remembering."}, {"letter": "D", "text": "Externalise the environment-varying values — model version, logging level, guardrail settings — into per-environment configuration, keep the shared prompt in one versioned artefact, and deploy the same code everywhere.", "correct": true, "explanation": "This separates what genuinely varies from what must not: one build and one prompt version travel through every environment, and only the declared settings differ. The effective configuration is then readable per environment and auditable in version control."}], "correct": "D", "select": 1}, {"id": "d2-25", "domain": 2, "objective": "Configuration Management", "situation": "A team is writing down what must be under configuration management for their Claude application, so that any production behaviour can be reproduced from a recorded state.", "question": "Which two items are essential to include for that goal? (Select TWO.)", "options": [{"letter": "A", "text": "The exact model version the service requests.", "correct": true, "explanation": "Model version is a primary determinant of behaviour. Without it recorded, a past response cannot be reproduced and a behaviour change cannot be attributed."}, {"letter": "B", "text": "The version of the prompt and instruction files the service sent, including any memory or configuration files that shaped the request.", "correct": true, "explanation": "The instructions are as much an input to behaviour as the code. Recording which version was in effect is what lets the team reproduce a response and identify which change altered it."}, {"letter": "C", "text": "The wall-clock time each request was made.", "correct": false, "explanation": "A timestamp is useful for correlating logs, but it does not reproduce behaviour: the same request at a different time behaves identically if the model and instructions are unchanged."}, {"letter": "D", "text": "The exact token counts of every historical request.", "correct": false, "explanation": "Token counts are an observation about a request, useful for cost analysis. They are output of the configuration, not part of it."}, {"letter": "E", "text": "The name of the engineer who most recently deployed the service.", "correct": false, "explanation": "Deployment attribution belongs in the change record and helps with process questions, but it has no bearing on reproducing the system's behaviour."}], "correct": ["A", "B"], "select": 2}, {"id": "d2-26", "domain": 2, "objective": "Claude Application Design", "situation": "A developer prototyped a research assistant by chatting on claude.ai. It worked well: it remembered earlier turns, used web search, and followed instructions given once at the start of the conversation. Ported to the API, the same instructions produce an assistant that forgets everything between calls and cannot search.", "question": "What explains the difference?", "options": [{"letter": "A", "text": "The chat product supplies conversation state and a set of tools around the model; an API integration must supply both itself.", "correct": true, "explanation": "The chat interface is an application built on the model, with history management and tooling included. The API exposes the model, so the integration owns what the product was providing — resending conversation state each request and declaring the tools it wants available."}, {"letter": "B", "text": "The API uses a smaller model than the chat product, which is why capability appears reduced.", "correct": false, "explanation": "The model is chosen explicitly in an API request. The observed gap is in state and tooling, not in model capability."}, {"letter": "C", "text": "Instructions given at the start of a conversation are only honoured in the chat product; the API requires them on every message.", "correct": false, "explanation": "Instructions persist across turns in an API conversation too, because the whole conversation is resent. The developer's problem is that they are not resending it."}, {"letter": "D", "text": "The API disables built-in tools by default for security and they must be enabled in account settings.", "correct": false, "explanation": "Tools are declared per request, not toggled in account settings. Nothing is being blocked; nothing has been requested."}], "correct": "A", "select": 1}, {"id": "d2-27", "domain": 2, "objective": "Claude Application Design", "situation": "A team's repository has a CLAUDE.md that says all monetary values must be formatted with two decimal places and an explicit currency code. Their Claude Code sessions follow it consistently. Their production billing service, which calls the Messages API from the same repository, produces inconsistent currency formatting.", "question": "Why is the production service not following the rule?", "options": [{"letter": "A", "text": "The rule is being followed but the billing service post-processes the output and strips the formatting.", "correct": false, "explanation": "This invents a step the scenario does not describe. The straightforward explanation is that the instruction never reached the model at all."}, {"letter": "B", "text": "CLAUDE.md rules apply only to code generation, not to runtime output.", "correct": false, "explanation": "There is no such content-based restriction. The distinction is which surface loads the file, not what the instruction is about."}, {"letter": "C", "text": "CLAUDE.md is loaded by the Claude Code environment; a direct API call sends only what the request contains, so the rule must be part of that request's instructions.", "correct": true, "explanation": "Instruction files are a feature of the environment that reads them. An API request carries exactly the system and message content the code puts in it, so a rule that must hold at runtime belongs in the service's own prompt — or better, in output validation."}, {"letter": "D", "text": "The production service is using a different model that does not support instruction files.", "correct": false, "explanation": "No model reads files from a repository. Loading project instructions is done by the surrounding tooling, not by the model."}], "correct": "C", "select": 1}, {"id": "d2-28", "domain": 2, "objective": "Claude Application Design", "situation": "A support tool keeps one long-lived Claude conversation per agent seat, reused across every customer that agent handles during a shift. By late afternoon, agents report the assistant referencing details from earlier, unrelated customers and applying the wrong account's policy.", "question": "What is the correct fix?", "options": [{"letter": "A", "text": "Instruct the model at the start of each new customer to disregard everything before that point.", "correct": false, "explanation": "The earlier customers' data is still in the context and still influences the response. An instruction to ignore it is unreliable and, more importantly, leaves one customer's data present while another is being served."}, {"letter": "B", "text": "Truncate the conversation to the last twenty messages when a new customer begins.", "correct": false, "explanation": "An arbitrary window may still carry the previous customer's details and may cut the current one's mid-conversation. It approximates a boundary instead of drawing one."}, {"letter": "C", "text": "Increase the context window so the model can hold the whole shift without confusion.", "correct": false, "explanation": "More room for irrelevant customer data makes the confusion more likely, not less, and it extends how long unrelated personal data stays in context."}, {"letter": "D", "text": "Scope a conversation to a single customer interaction and start a fresh one when the agent moves to the next customer.", "correct": true, "explanation": "The session boundary should follow the task boundary. A fresh conversation per customer removes the cross-contamination at its source and has the side benefit of not carrying one customer's personal data into another's interaction."}], "correct": "D", "select": 1}, {"id": "d2-29", "domain": 2, "objective": "Claude Application Design", "situation": "A healthcare intake assistant collects a patient's symptoms, date of birth, and insurance number in conversation, then produces a structured referral. The team stores the full conversation transcript indefinitely so the assistant can be improved later, and every stored transcript is used unfiltered as evaluation data.", "question": "Which concern should the design address first?", "options": [{"letter": "A", "text": "Transcripts grow large, so storage cost will become significant.", "correct": false, "explanation": "Storage cost is real but minor next to what is being stored. Text transcripts are small, and the problem here is the nature of the data rather than its volume."}, {"letter": "B", "text": "The transcripts contain identifiable patient data, so retention must be bounded and the evaluation set must be redacted or built from consented, de-identified records.", "correct": true, "explanation": "Indefinite retention of identifiable health data, then reuse of it for a secondary purpose, is the significant exposure here. Bounding retention and de-identifying anything reused for evaluation addresses both the storage and the reuse."}, {"letter": "C", "text": "Evaluation sets built from real conversations will overfit the assistant to past patients.", "correct": false, "explanation": "Real traffic is usually the best source of evaluation data and representative examples are a strength. The problem is the identifiable content, not the provenance."}, {"letter": "D", "text": "Storing transcripts means the model can be queried about past patients.", "correct": false, "explanation": "A stored transcript is application data; the model has no access to it unless the application sends it. The exposure is in the team's own storage and reuse, not in the model."}], "correct": "B", "select": 1}, {"id": "d2-30", "domain": 2, "objective": "Claude Application Design", "situation": "A developer is designing the schema for a structured extraction that pulls purchase-order details out of supplier emails. Some emails omit a delivery date, some list several line items, and some quote amounts in different currencies.", "question": "Which two schema choices make the extraction more reliable to consume? (Select TWO.)", "options": [{"letter": "A", "text": "Model the currency as an explicit field with an enumerated set of codes rather than embedding it in the amount string.", "correct": true, "explanation": "A separate enumerated field makes the currency machine-readable and constrains it to values the consumer handles, instead of leaving downstream code to parse a symbol or code out of free text."}, {"letter": "B", "text": "Represent a missing delivery date as an explicit null or a documented 'not stated' value, rather than as an empty string or an invented default.", "correct": true, "explanation": "Absence is real information in this data. Encoding it distinctly stops a consumer from confusing 'the supplier did not say' with a real date, which is the kind of ambiguity that causes silent downstream errors."}, {"letter": "C", "text": "Return line items as a single newline-delimited string so the schema stays flat.", "correct": false, "explanation": "Flattening a repeated structure into delimited text pushes parsing back onto the consumer and reintroduces the ambiguity the schema was meant to remove. A list of objects is the natural representation."}, {"letter": "D", "text": "Make every field optional, so the extraction never fails validation.", "correct": false, "explanation": "Validation that cannot fail provides no guarantee. Fields the business genuinely requires should be required, so a missing one surfaces at extraction rather than three systems later."}, {"letter": "E", "text": "Add a free-text field for anything the model considers noteworthy, so no information is lost.", "correct": false, "explanation": "An open field with no defined consumer accumulates unstructured content that nothing reads and no one validates. Information worth keeping deserves a defined field."}], "correct": ["A", "B"], "select": 2}, {"id": "d2-31", "domain": 2, "objective": "Claude Application Design", "situation": "A developer designs the request for a compliance assistant. The prompt is assembled as: system instructions, then the retrieved policy excerpts, then the customer's message, then the retrieved excerpts again 'for emphasis', then a reminder of the instructions. Responses are inconsistent, and caching never hits.", "question": "Which restructuring addresses both problems?", "options": [{"letter": "A", "text": "Remove the retrieved excerpts entirely and rely on the model's knowledge of the policy domain.", "correct": false, "explanation": "The excerpts are the grounding that makes the answers about this company's policy rather than a generic one. Removing them trades an assembly problem for a correctness problem."}, {"letter": "B", "text": "Keep the structure and lower the temperature, which will make responses consistent.", "correct": false, "explanation": "Sampling settings do not resolve contradictory or duplicated content in the prompt, and they have no effect on whether a prefix is cacheable."}, {"letter": "C", "text": "Put stable system instructions first, then the retrieved excerpts in a clearly labelled section stated once, then the customer message last — dropping the duplicate block and the reminder.", "correct": true, "explanation": "One clear boundary per kind of content removes the duplication the model has to reconcile, and ordering stable content ahead of per-request content restores a cacheable prefix. Both symptoms come from the same disordered assembly."}, {"letter": "D", "text": "Move the customer's message into the system instructions so it carries the same authority as the policy.", "correct": false, "explanation": "The customer's message is untrusted per-request content. Giving it system-position authority is both a prompt-injection hazard and the worst possible placement for caching."}], "correct": "C", "select": 1}, {"id": "d2-32", "domain": 2, "objective": "Claude Application Design", "situation": "A knowledge assistant answers from three sources: the company handbook, a public vendor documentation site, and notes typed by employees. Users have started acting on answers that turn out to come from an outdated employee note, believing they came from the handbook.", "question": "Which design change addresses this?", "options": [{"letter": "A", "text": "Rank handbook content highest so it is always used when available, and drop employee notes from the index.", "correct": false, "explanation": "Removing a source loses information the assistant is asked about, and ranking alone still leaves the user unable to tell where an answer came from when the handbook does not cover the question."}, {"letter": "B", "text": "Add a disclaimer to every answer stating that information may be inaccurate.", "correct": false, "explanation": "A blanket disclaimer on every answer is quickly ignored and gives the user nothing to act on. It does not distinguish the authoritative answer from the unreliable one."}, {"letter": "C", "text": "Instruct the model to mention its source in the answer text.", "correct": false, "explanation": "This is closer, but a source named in prose is generated text and can be wrong. Attribution that users rely on should come from the retrieval layer, which knows what was actually supplied."}, {"letter": "D", "text": "Label each retrieved passage with its source and recency in the context, and carry that attribution through to the answer the user sees.", "correct": true, "explanation": "The problem is that three sources of very different authority arrive as undifferentiated text. Marking provenance in the context lets the model weigh it, and surfacing the same attribution to the user restores the judgment they were unknowingly deprived of."}], "correct": "D", "select": 1}, {"id": "d2-33", "domain": 2, "objective": "Claude Application Design", "situation": "A platform team has built a set of Claude Code agents, slash commands, and a hook that eight product teams should all use. Today they distribute them by asking each team to copy files into their repository. Versions have drifted and three teams are running an old hook.", "question": "What is the better distribution mechanism?", "options": [{"letter": "A", "text": "Package the agents, commands, and hook as a plugin that teams install and pin, so updates are published once and adopted deliberately.", "correct": true, "explanation": "A plugin is the packaging unit for exactly this bundle, and it turns eight divergent copies into one published artefact with a version each team can pin and upgrade on purpose. The drift disappears because there is no longer anything to copy."}, {"letter": "B", "text": "Put the files in a shared network location and have each repository symlink to them.", "correct": false, "explanation": "Symlinks to a mutable shared location mean every team silently changes behaviour whenever the platform team edits a file, with no version anyone can pin or roll back."}, {"letter": "C", "text": "Add the files to the organisation-wide user-level configuration on every engineer's machine.", "correct": false, "explanation": "User-level configuration applies to every project an engineer opens, including ones these agents do not suit, and it depends on per-machine setup that new hires and CI environments will not have."}, {"letter": "D", "text": "Have each team maintain its own copy and hold a quarterly sync meeting to reconcile differences.", "correct": false, "explanation": "This formalises the drift rather than removing it, and it puts a recurring manual process where a versioned dependency belongs."}], "correct": "A", "select": 1}, {"id": "d2-34", "domain": 2, "objective": "Claude Application Design", "situation": "A company wants three things: engineers able to ask questions about their own codebase from the terminal, a customer-facing assistant embedded in their web product, and a nightly job that summarises new support tickets into a digest.", "question": "Which two statements correctly match a surface to a need here? (Select TWO.)", "options": [{"letter": "A", "text": "The customer-facing assistant should be built on the API, because it must run inside the company's product with its own authentication, data access, and interface.", "correct": true, "explanation": "An embedded product feature needs the company to control identity, data access, and presentation. That is what an API integration provides; a general-purpose chat product cannot be embedded with those properties."}, {"letter": "B", "text": "The terminal codebase questions are a fit for Claude Code, which already operates on a repository from the command line.", "correct": true, "explanation": "This is the surface's purpose: it works against a local repository with file and search tooling in place, so the need is met without the company building an integration."}, {"letter": "C", "text": "The nightly digest should be built as a Claude Code session, since it runs on a schedule.", "correct": false, "explanation": "Running on a schedule says nothing about the surface. The digest reads tickets from a system and writes a summary — it does not operate on a repository, which is what the coding surface is for."}, {"letter": "D", "text": "All three should use the same surface, because using one surface reduces maintenance.", "correct": false, "explanation": "Consistency is worth something, but these three needs differ in where they run, who uses them, and what they access. Forcing one surface means at least two of them are poorly served."}, {"letter": "E", "text": "The customer-facing assistant should direct customers to claude.ai with a prepared prompt, which avoids building an integration.", "correct": false, "explanation": "Sending customers to a separate product gives up authentication, the company's data, and the product experience entirely. It is not an embedded assistant."}], "correct": ["A", "B"], "select": 2}, {"id": "d3-01", "domain": 3, "objective": "Claude Code Operation", "situation": "A backend team shares one repository. Everyone must follow the same rule that database migrations are generated with the project's CLI and never hand-written. One engineer additionally wants Claude Code to always run her personal linter wrapper, a script that only exists on her machine and that the rest of the team does not have.", "question": "Where should each instruction live so the shared rule reaches every engineer and the personal one does not break anyone else's session?", "options": [{"letter": "A", "text": "Put both instructions in the repository's committed CLAUDE.md, marking the personal one as applying to one engineer only.", "correct": false, "explanation": "A committed CLAUDE.md loads for every engineer on the repository, so the personal linter wrapper enters everyone's context and Claude may try to run a script that does not exist on their machines. Naming the owner in prose does not stop the instruction from being read and acted on."}, {"letter": "B", "text": "Put the migration rule in the repository's committed CLAUDE.md and the linter wrapper in the engineer's own local, uncommitted memory for that project.", "correct": true, "explanation": "The CLAUDE.md hierarchy exists for exactly this split: repository-level memory is committed and shared, and local project memory stays on one machine and is not committed, so a machine-specific instruction never reaches teammates."}, {"letter": "C", "text": "Put both instructions in the engineer's user-level CLAUDE.md in her home directory.", "correct": false, "explanation": "User-level memory applies to every project that engineer opens and to no other engineer. The shared migration rule would not reach the team, and the linter wrapper would leak into unrelated repositories where it does not apply."}, {"letter": "D", "text": "Put neither in memory; paste both instructions at the start of each session instead.", "correct": false, "explanation": "Retyping instructions each session is exactly the repetition the memory hierarchy removes, and it gives no guarantee the shared rule is applied consistently across the team — the rule holds only when someone remembers to paste it."}], "correct": "B", "select": 1}, {"id": "d3-02", "domain": 3, "objective": "Claude Code Operation", "situation": "A platform team wants Claude Code to triage new issues automatically. A CI job will run on each issue, hand Claude the issue body, and capture a structured verdict to post back as a comment. No human will be at a terminal while it runs, and the job must fail the build if Claude cannot complete the triage.", "question": "Which way of invoking Claude Code fits this job best?", "options": [{"letter": "A", "text": "Launch an interactive session in the CI container and drive it with keystrokes written to the terminal.", "correct": false, "explanation": "The interactive interface is designed for a human at a keyboard. Simulating keystrokes in CI is brittle, gives no reliable exit status to fail the build on, and breaks whenever the interface changes."}, {"letter": "B", "text": "Run Claude Code in headless mode with the prompt supplied as an argument, and read its output and exit status from the job.", "correct": true, "explanation": "Headless mode is the non-interactive entry point built for scripts and CI: it takes the prompt as input, emits the result to stdout for the job to capture, and returns an exit status the pipeline can gate on."}, {"letter": "C", "text": "Add the triage instructions to CLAUDE.md so any session started in the repository performs triage automatically.", "correct": false, "explanation": "CLAUDE.md shapes how a session behaves once started; it does not start a session or provide the per-issue input. The CI job still needs a way to invoke Claude and collect a result."}, {"letter": "D", "text": "Define the triage steps as a custom slash command and rely on CI to type the command name.", "correct": false, "explanation": "A custom slash command is a good way to package the triage prompt, but it is invoked from a session. It answers what to run, not how an unattended job runs it and gets a machine-readable result back."}], "correct": "B", "select": 1}, {"id": "d3-03", "domain": 3, "objective": "Claude Code Operation", "situation": "An engineer has typed the same release checklist to Claude Code four times this month. The checklist is long, cites a 30-page internal release policy, and includes a shell script that generates the changelog. She wants it available on demand without inflating every session's context.", "question": "Which two properties of this procedure make a Skill the right package for it, rather than more text in CLAUDE.md? (Select TWO.)", "options": [{"letter": "A", "text": "The bulky reference policy can sit in a supporting file the Skill loads only when the release procedure is actually invoked.", "correct": true, "explanation": "Progressive disclosure is the point of a Skill's file layout: the entry file stays short and the long reference material is read on demand, so an unrelated session never pays for the 30-page policy."}, {"letter": "B", "text": "CLAUDE.md content is advisory, whereas a Skill's instructions are enforced by the runtime and cannot be skipped.", "correct": false, "explanation": "A Skill's instructions are model-directed text, exactly like CLAUDE.md content. Neither is enforced by the runtime; enforcement comes from hooks and permission settings, not from where instructions are stored."}, {"letter": "C", "text": "The changelog script can ship inside the Skill and be executed as part of the procedure instead of being described in prose.", "correct": true, "explanation": "A Skill is a folder, not just text, so an executable helper travels with the instructions. Claude runs the script rather than reconstructing its behaviour from a description, which is both cheaper and more reliable."}, {"letter": "D", "text": "A Skill guarantees the procedure runs identically on every machine regardless of local tooling.", "correct": false, "explanation": "A Skill packages instructions and files; it makes no promise about the host environment. If the changelog script needs a tool that is missing locally, the Skill fails there just as a pasted procedure would."}, {"letter": "E", "text": "Storing the checklist as a Skill removes the need to keep the release policy up to date.", "correct": false, "explanation": "Packaging changes where the policy lives, not whether it is accurate. A stale reference file misleads Claude exactly as stale prose in CLAUDE.md would."}], "correct": ["A", "C"], "select": 2}, {"id": "d3-04", "domain": 3, "objective": "Claude Code Operation", "situation": "A team is onboarding Claude Code onto a large monorepo that has no Claude configuration yet. They want a starting CLAUDE.md that reflects the repository's actual build commands, test runner, and layout, and they want per-repository tool permissions that apply to everyone who clones it.", "question": "What is the most direct way to establish this baseline?", "options": [{"letter": "A", "text": "Copy the CLAUDE.md and settings file from another team's repository and edit the parts that look wrong.", "correct": false, "explanation": "Inherited configuration encodes another repository's build commands and directory layout. The parts that 'look wrong' are the visible ones; the subtly wrong commands survive and mislead every session."}, {"letter": "B", "text": "Run the repository initialization command so Claude inspects the codebase and generates a CLAUDE.md, then commit project-scoped permissions in the repository's settings file.", "correct": true, "explanation": "Initialization is the built-in path for bootstrapping memory from the actual repository, and project-scoped settings committed alongside it are how permissions travel to everyone who clones the repository."}, {"letter": "C", "text": "Write the permissions into CLAUDE.md as a list of tools Claude is allowed to use.", "correct": false, "explanation": "Memory files are instructions the model reads, not a permission mechanism. Allowed and denied tools belong in settings, which the harness enforces before a tool runs."}, {"letter": "D", "text": "Have each engineer set the permissions in their user-level settings so the rules follow them everywhere.", "correct": false, "explanation": "User-level settings apply to one person across all repositories, which is the opposite of the requirement. Nothing guarantees a new clone of the monorepo gets the same rules, and unrelated projects inherit them by accident."}], "correct": "B", "select": 1}, {"id": "d4-01", "domain": 4, "objective": "Debugging and Error Handling", "situation": "A production service calls Claude to extract fields from invoices and parse the JSON it returns. Roughly one request in forty fails. The team's log line for a failure records only the message 'extraction failed' and the invoice id. Some failures are the client library raising a rate-limit error, some are a JSON parse error on a response that came back fine, and some are a request that took longer than the client's timeout.", "question": "What is the most useful first change to make debugging tractable?", "options": [{"letter": "A", "text": "Record, per failure, which layer raised it — a transport or API status error, a timeout, or a validation failure on the returned content — along with the request identifier and the raw response.", "correct": true, "explanation": "The three failure classes have different fixes: rate limits need backoff, timeouts need client configuration or streaming, and parse failures need prompt or schema work. Until the log distinguishes the layer that failed, every fix is a guess and the 1-in-40 rate cannot be attributed."}, {"letter": "B", "text": "Wrap the whole call in a retry loop that retries any failure up to five times before logging.", "correct": false, "explanation": "Blanket retries hide the distinction rather than exposing it, and they are actively wrong for a malformed-output failure: the same prompt is likely to produce the same unparseable response while the account pays for five attempts."}, {"letter": "C", "text": "Increase the client timeout and raise the retry count, then re-measure the failure rate next week.", "correct": false, "explanation": "This changes two variables at once against an unknown mix of causes. If the rate improves it is unclear which class of failure improved, and the parse failures are untouched because they never depended on time."}, {"letter": "D", "text": "Switch to a more capable model, since a stronger model produces valid JSON more reliably.", "correct": false, "explanation": "This treats every failure as a model-output problem when at least two of the three observed classes originate in the integration layer. A stronger model does not stop a rate limit or a client timeout, and the change costs more per call."}], "correct": "A", "select": 1}, {"id": "d4-02", "domain": 4, "objective": "Debugging and Error Handling", "situation": "A support agent loops over tool calls. A user reports the agent 'silently gave up' on a refund request. The trace shows: user message, one tool call to look up the order, a tool result carrying an error string from the orders service, then a final assistant message apologising and ending the turn. No further tool calls were made and the application logged nothing unusual.", "question": "What does this trace most directly indicate about where the failure originated?", "options": [{"letter": "A", "text": "The model refused the request, so the system prompt needs stronger instructions about completing refunds.", "correct": false, "explanation": "A refusal would not be preceded by a successful tool call and an error result from the orders service. The trace shows the model working the task until it received bad data, which is a different failure than declining to act."}, {"letter": "B", "text": "The agent loop ended prematurely; the loop should be changed to keep calling tools until a fixed step count is reached.", "correct": false, "explanation": "The loop behaved correctly — it ran until the model stopped requesting tools. Forcing a fixed number of iterations would make the agent churn on an unrecoverable error rather than surface it, and it does not address the underlying orders-service failure."}, {"letter": "C", "text": "The orders tool failed and returned its error as ordinary text, so the model treated the error message as the answer and concluded the turn.", "correct": true, "explanation": "The trace isolates the origin to the integration layer: the tool call succeeded structurally but returned a service error. Returning an error as an unmarked result gives the model nothing to distinguish 'this failed, retry or escalate' from 'here is your data', so ending the turn is a reasonable response to what it was handed."}, {"letter": "D", "text": "The context window overflowed, dropping the refund instruction before the model could act on it.", "correct": false, "explanation": "An overflow would not produce a coherent apology that references the refund, and the trace is only a handful of messages long. Nothing in it suggests the instruction was lost."}], "correct": "C", "select": 1}, {"id": "d5-01", "domain": 5, "objective": "LLM Fundamentals", "situation": "A developer files a bug: 'The model is broken — I sent the same request twice and got two different answers, even though I set temperature to 0.' The two answers were both correct and differed only in wording.", "question": "What is the accurate response to this report?", "options": [{"letter": "A", "text": "Temperature 0 guarantees identical output, so the two requests must have differed; diff the payloads to find the change.", "correct": false, "explanation": "Low temperature makes token selection much more deterministic but does not guarantee byte-identical responses across requests. Sending the operator on a hunt for a payload difference that may not exist is the wrong first answer."}, {"letter": "B", "text": "The model is non-deterministic because it samples randomly from its entire vocabulary regardless of temperature.", "correct": false, "explanation": "This overstates the mechanism. Sampling is shaped by the predicted distribution and by temperature; the model is not choosing uniformly at random, and at low temperature the output is close to but not exactly reproducible."}, {"letter": "C", "text": "Different wording means the model is unreliable and the application should be redesigned around a deterministic rules engine.", "correct": false, "explanation": "Both answers were correct. Discarding a language model because its phrasing varies mistakes surface variation for an error, and a rules engine cannot do the work the model was chosen for."}, {"letter": "D", "text": "Identical output is not guaranteed even at low temperature; if the application needs a stable shape, constrain the output format and compare on the fields that matter rather than on the exact text.", "correct": true, "explanation": "Generation is inherently probabilistic and exact reproducibility is not a property to rely on. The productive move is to stop depending on it: constrain the response to a schema and compare the values the application uses, so wording variation becomes irrelevant."}], "correct": "D", "select": 1}, {"id": "d5-02", "domain": 5, "objective": "LLM Fundamentals", "situation": "A developer is sizing a summarization feature. Documents average about 30 pages of dense text and the summary should be roughly 500 words. They need to know whether a request will fit and what it will cost, and they have been estimating tokens by dividing the character count by four.", "question": "What is the more reliable way to establish the token counts?", "options": [{"letter": "A", "text": "Send a request with a very small output cap and read the input token count from the error.", "correct": false, "explanation": "A small output cap does not produce an error that reports the input size, and this consumes a real request to obtain a number a dedicated endpoint returns directly."}, {"letter": "B", "text": "Use a general-purpose tokenizer library to count the tokens locally.", "correct": false, "explanation": "A third-party tokenizer implements another vendor's vocabulary. Its counts are approximations for Claude and can drift further when the tokenizer changes between model generations."}, {"letter": "C", "text": "Call the token-counting endpoint with the exact request content, and read the usage figures returned on real responses to confirm.", "correct": true, "explanation": "The token-counting endpoint counts the same content the same way the model will, so it answers both the fit question and the cost estimate before any generation is paid for. Reported usage on real responses then confirms the estimate against actual billing."}, {"letter": "D", "text": "Keep the characters-divided-by-four estimate; it is accurate enough for both fit and cost.", "correct": false, "explanation": "The ratio varies substantially with language, code, punctuation, and formatting. It is a rough intuition, not a basis for deciding whether a 30-page document fits or what it will cost."}], "correct": "C", "select": 1}, {"id": "d5-03", "domain": 5, "objective": "LLM Fundamentals", "situation": "A developer needs Claude to classify short messages into one of five well-known categories such as 'complaint' and 'praise'. The categories are ordinary English concepts with no company-specific meaning. The developer's first draft includes twelve worked examples.", "question": "What is the most reasonable starting point?", "options": [{"letter": "A", "text": "Try a zero-shot prompt that names and defines the five categories, and add examples only if measurement shows they are needed.", "correct": true, "explanation": "For concepts the model already understands, a clear instruction and an enumerated category set often suffice. Starting zero-shot keeps the prompt small and cheap and establishes a baseline; examples can then be added where measurement shows a specific weakness."}, {"letter": "B", "text": "Keep the twelve examples, since more examples always improve classification accuracy.", "correct": false, "explanation": "Returns from additional examples diminish quickly, and every example is paid for on every request. 'Always improves' is not true, especially for categories the model already knows."}, {"letter": "C", "text": "Use a single example, because one-shot prompting is the recommended default for classification.", "correct": false, "explanation": "There is no default example count that is right regardless of task. The number of examples should follow from what the model gets wrong without them."}, {"letter": "D", "text": "Skip prompting technique entirely and fine-tune a model on the five categories.", "correct": false, "explanation": "This is a large investment before anything simpler has been tried, for a task that ordinary instructions are likely to handle. It also creates an artefact to maintain across model changes."}], "correct": "A", "select": 1}, {"id": "d5-04", "domain": 5, "objective": "LLM Fundamentals", "situation": "A team is porting code that sets a fixed thinking token budget on every request to a current Claude model. They want the model to reason more on hard planning requests and less on routine formatting requests, and they want a single mechanism they can tune per route.", "question": "Which configuration matches the current API and the requirement?", "options": [{"letter": "A", "text": "Keep the fixed thinking budget and set it higher on the planning route.", "correct": false, "explanation": "The fixed thinking-token-budget parameter has been removed on current models and is rejected. It is also the wrong shape for the requirement, since a fixed number cannot adapt to how hard an individual request turns out to be."}, {"letter": "B", "text": "Disable thinking on the formatting route and leave the planning route unset so it defaults to maximum reasoning.", "correct": false, "explanation": "Turning thinking off is a coarse switch with its own failure modes, and relying on an unstated default for the planning route makes the important setting invisible. Neither gives the per-route dial the team asked for."}, {"letter": "C", "text": "Set a low temperature on the formatting route and a high temperature on the planning route.", "correct": false, "explanation": "Sampling settings influence how varied the wording is, not how much the model reasons before answering. They are the wrong control for this requirement, and on current models they are not the dial that depth is set with."}, {"letter": "D", "text": "Use adaptive thinking and set the effort level per route — lower for formatting, higher for planning.", "correct": true, "explanation": "Adaptive thinking lets the model decide how much reasoning a given request warrants, and the effort level is the per-route dial for overall depth and token spend. Together they replace the fixed budget with the exact control the team described."}], "correct": "D", "select": 1}, {"id": "d5-05", "domain": 5, "objective": "LLM Fundamentals", "situation": "A developer is building an interactive assistant whose replies can run to several thousand tokens. Users complain that nothing appears for fifteen seconds and then the whole answer arrives at once. Occasionally a long request fails with a client timeout.", "question": "Which change addresses both complaints?", "options": [{"letter": "A", "text": "Reduce the output cap so responses are shorter and arrive sooner.", "correct": false, "explanation": "This trims the symptom by truncating the answers users asked for. A response cut off mid-thought is a worse outcome than a slow one, and long requests can still time out."}, {"letter": "B", "text": "Stream the response so tokens render as they are generated, which also keeps the connection active for long generations.", "correct": true, "explanation": "Streaming addresses both at once: users see output immediately instead of waiting for the full response, and because data flows continuously the request does not sit idle long enough to hit the client's timeout on large outputs."}, {"letter": "C", "text": "Move the requests to the batch endpoint so they are processed asynchronously.", "correct": false, "explanation": "Batch is for latency-tolerant work and returns results long after submission. Applying it to an interactive assistant makes the perceived delay dramatically worse."}, {"letter": "D", "text": "Raise the client timeout and show a spinner for the full fifteen seconds.", "correct": false, "explanation": "A longer timeout prevents the failure but leaves users staring at a spinner. It concedes the responsiveness problem rather than solving it."}], "correct": "B", "select": 1}, {"id": "d5-06", "domain": 5, "objective": "LLM Fundamentals", "situation": "A team is deciding whether to enable fast mode for a latency-sensitive interactive route, and whether to use it for their nightly bulk-classification job as well.", "question": "Which two statements about fast mode are accurate and relevant to this decision? (Select TWO.)", "options": [{"letter": "A", "text": "It raises output throughput on the same model at premium per-token pricing, so it trades cost for speed rather than quality.", "correct": true, "explanation": "Fast mode runs the same model with higher output tokens per second and is priced above the standard rate. That makes it a latency-for-cost trade, which is exactly the question for an interactive route."}, {"letter": "B", "text": "It is not available for batch processing, so it cannot be applied to the nightly bulk job.", "correct": true, "explanation": "Fast mode does not apply to the batch endpoint. The nightly job is latency-tolerant anyway, so batch's discount is the right lever there and fast mode is not an option."}, {"letter": "C", "text": "It substitutes a smaller, faster model behind the same model identifier.", "correct": false, "explanation": "The model is unchanged. Fast mode alters serving speed, not which model answers, which is why it does not carry the quality tradeoff a smaller model would."}, {"letter": "D", "text": "It is available on every current Claude model and on every deployment platform.", "correct": false, "explanation": "Availability is restricted to specific models and platforms, so it cannot be assumed. A team planning to depend on it must confirm their model and platform support it."}, {"letter": "E", "text": "It reduces total token consumption, so the higher per-token rate is offset.", "correct": false, "explanation": "Faster generation does not generate fewer tokens. The premium rate applies to the same volume of work, so the cost genuinely rises."}], "correct": ["A", "B"], "select": 2}, {"id": "d5-07", "domain": 5, "objective": "Technical Fundamentals", "situation": "A team is adding Claude to an existing Python service. One engineer proposes calling the REST endpoint directly with the HTTP library already in the project, arguing it avoids a dependency. The service needs retry on transient failures, distinct handling for rate limits versus bad requests, and streaming.", "question": "Which argument should decide this?", "options": [{"letter": "A", "text": "Raw HTTP is preferable because it avoids being locked into an SDK's release cadence.", "correct": false, "explanation": "The wire protocol is the same either way, so the lock-in is minimal, and the team would be maintaining their own version of the SDK's behaviour instead of consuming it."}, {"letter": "B", "text": "Either is fine; the choice is a matter of team preference with no practical difference.", "correct": false, "explanation": "The requirements listed — retries, typed error handling, streaming — are concrete work that one option provides and the other requires the team to write and keep correct."}, {"letter": "C", "text": "The official SDK already implements retries, typed exceptions per error class, and stream assembly, so hand-rolled HTTP means re-implementing and maintaining that behaviour.", "correct": true, "explanation": "Every named requirement is something the SDK provides and tests. Writing them again is real, ongoing work — retry policy, error classification, and incremental stream parsing are all easy to get subtly wrong — and it buys nothing the project needs."}, {"letter": "D", "text": "Raw HTTP is required whenever the application must handle streaming responses.", "correct": false, "explanation": "The SDKs support streaming directly and expose helpers for assembling the final message. Streaming is an argument for the SDK, not against it."}], "correct": "C", "select": 1}, {"id": "d5-08", "domain": 5, "objective": "Technical Fundamentals", "situation": "A developer is building a browser chat UI. They plan a websocket between the browser and their own backend so the UI updates live, and the backend will call Claude. A teammate says they should 'open a websocket to the model API instead of using two hops'.", "question": "What is the correct assessment?", "options": [{"letter": "A", "text": "The teammate is right; calling the API from the browser over a websocket removes a hop and is the standard pattern.", "correct": false, "explanation": "Calling the model API from the browser would put the API credential in client code where any user can read it. The backend hop is a security requirement, not an inefficiency."}, {"letter": "B", "text": "The websocket to the browser should be replaced with polling, because streaming from the backend cannot be forwarded live.", "correct": false, "explanation": "A backend that receives an incremental stream can forward it to the browser as it arrives over a websocket or server-sent events. Polling would add latency for no reason."}, {"letter": "C", "text": "The two hops should be collapsed by having the backend wait for the complete response and return it in one piece.", "correct": false, "explanation": "This does not collapse a hop, and it discards the incremental delivery the websocket was added to provide, reintroducing the long silence a chat UI is trying to avoid."}, {"letter": "D", "text": "The design is right: the browser-to-backend websocket is the team's own transport, and the backend consumes the API's streaming response and relays chunks as they arrive.", "correct": true, "explanation": "These are two separate transports serving two purposes. The websocket is the team's own channel to the browser; the backend consumes the API's incremental stream through the SDK and relays it, keeping the credential server-side."}], "correct": "D", "select": 1}, {"id": "d5-09", "domain": 5, "objective": "Technical Fundamentals", "situation": "A service calls Claude inside a request handler. Under load it begins returning 500s to users. The logs show a mix of rate-limit responses, a few gateway errors from upstream, and some malformed-request errors caused by a bug in how one field is built. The current code catches a single broad exception type and returns 500 for all of them.", "question": "How should the error handling be restructured?", "options": [{"letter": "A", "text": "Distinguish the classes: back off and retry on rate limits and server-side errors, and fail fast without retrying on malformed-request errors, surfacing each appropriately.", "correct": true, "explanation": "The classes call for opposite responses. Rate limits and upstream server errors are transient and worth retrying with backoff; a malformed request will fail identically every time, so retrying it wastes quota and delays the real fix. One broad handler cannot express that difference."}, {"letter": "B", "text": "Retry every failure with exponential backoff up to five attempts, since all three classes are transient under load.", "correct": false, "explanation": "The malformed-request error is caused by a bug in the caller and is not transient. Retrying it five times multiplies the load during an incident and hides the defect."}, {"letter": "C", "text": "Catch nothing and let exceptions propagate, so the platform's error reporting captures the detail.", "correct": false, "explanation": "This gives good visibility and no resilience: every transient rate limit becomes a user-visible failure that a short backoff would have absorbed."}, {"letter": "D", "text": "Match on the error message text to decide what to do, since that carries the most detail.", "correct": false, "explanation": "Message strings are not a stable interface and change without notice. The SDKs expose typed exceptions and status codes precisely so that branching does not depend on prose."}], "correct": "A", "select": 1}, {"id": "d5-10", "domain": 5, "objective": "Technical Fundamentals", "situation": "A developer submits 12,000 classification requests as one asynchronous job and stores the responses when it completes. Their code writes each response into an output list in the order results are read, matching it to the input at the same index. Spot checks show classifications attached to the wrong records, and about 40 records have no classification at all.", "question": "What is wrong with this result-handling code?", "options": [{"letter": "A", "text": "The job completed before all requests were processed, so the missing records were never sent.", "correct": false, "explanation": "A completed job has reached a terminal state for every request it contained. Records with no classification have an outcome recorded; the code is not reading it."}, {"letter": "B", "text": "The output list is being written concurrently without a lock, so entries overwrite each other.", "correct": false, "explanation": "The described code reads results sequentially as they arrive. A concurrency bug would produce a different pattern than a systematic misalignment plus a set of silently absent entries."}, {"letter": "C", "text": "The response objects were truncated because the output cap was too low, losing the record association.", "correct": false, "explanation": "A truncated response would produce a short or malformed classification, not one correctly attached to the wrong record. Truncation does not move a result to another index."}, {"letter": "D", "text": "Results are not returned in submission order, so they must be matched by the identifier supplied with each request — and each result's outcome must be checked, because some will have failed rather than succeeded.", "correct": true, "explanation": "Both symptoms follow from indexing by position. Results come back in arbitrary order, so position carries no meaning and the identifier submitted alongside each request is the only correct join key. The 40 blanks are requests with a non-success outcome, which the code never inspects."}], "correct": "D", "select": 1}, {"id": "d5-11", "domain": 5, "objective": "Technical Fundamentals", "situation": "A team's service must run in a specific cloud provider's environment for procurement reasons, and their code currently constructs the standard first-party client and overrides its base URL to point at the provider's endpoint. Requests fail authentication.", "question": "What is the correct approach?", "options": [{"letter": "A", "text": "Add the provider's credentials as a bearer token on the standard client's authorization header.", "correct": false, "explanation": "Cloud providers use their own credential and signing schemes, which a manually attached header does not reproduce. This addresses one symptom of using the wrong client rather than the cause."}, {"letter": "B", "text": "Use the SDK's dedicated client class for that provider, constructed with the provider's required parameters, and use the provider's model identifiers.", "correct": true, "explanation": "The SDKs ship provider-specific client classes that handle that platform's authentication and endpoint conventions, and model identifiers differ by platform. After construction the request surface is the same, so only the client setup changes."}, {"letter": "C", "text": "Call the provider's REST endpoint directly, since the SDK does not support third-party platforms.", "correct": false, "explanation": "The SDKs do support the major cloud platforms through dedicated clients. Dropping to raw HTTP would forfeit that support for no reason."}, {"letter": "D", "text": "Keep the base-URL override and disable TLS verification, which is the usual cause of authentication failures against a proxy.", "correct": false, "explanation": "Disabling certificate verification is a serious security regression and has nothing to do with the failure, which comes from using a client that does not implement the provider's credential scheme."}], "correct": "B", "select": 1}, {"id": "d5-12", "domain": 5, "objective": "Technical Fundamentals", "situation": "A developer is adding Claude to a TypeScript service and is setting the client's request timeout and retry configuration. They previously wrote a Python integration and are copying those values across.", "question": "Which two cautions apply when carrying configuration between SDKs? (Select TWO.)", "options": [{"letter": "A", "text": "Timeout units differ between SDKs, so a value copied without checking can be off by a factor of a thousand.", "correct": true, "explanation": "Some SDKs express the timeout in seconds and others in milliseconds. A number copied literally between them silently produces either an instant timeout or an effectively infinite one."}, {"letter": "B", "text": "Because timeouts are retried, the worst-case wall-clock time is the timeout multiplied by the number of attempts, which must fit within any outer deadline.", "correct": true, "explanation": "A timed-out request is a retryable failure, so total elapsed time compounds across attempts. A configuration that looks safe per attempt can exceed an upstream request deadline once retries are counted."}, {"letter": "C", "text": "Retries must be disabled in every SDK, because the API does not tolerate repeated requests.", "correct": false, "explanation": "Retrying transient failures is expected and the SDKs do it by default. There is no prohibition on repeated requests after a failure."}, {"letter": "D", "text": "Configuration set on the client cannot be overridden for an individual request, so any exception requires a second client.", "correct": false, "explanation": "The SDKs provide per-request overrides for options such as timeout, so a single unusual call does not require a separate client."}, {"letter": "E", "text": "Timeout and retry settings affect only streaming requests, so a non-streaming integration can ignore them.", "correct": false, "explanation": "Both settings apply to non-streaming requests as well, and non-streaming calls with large outputs are the ones most likely to hit a timeout."}], "correct": ["A", "B"], "select": 2}, {"id": "d5-13", "domain": 5, "objective": "Model Selection and Tradeoffs", "situation": "A product has three Claude-backed features: a high-volume tagger that assigns one of eight labels to short user posts, a customer-facing chat assistant with moderate reasoning demands, and a weekly job that analyses a complex regulatory filing and drafts a compliance assessment. Budget is finite and the team wants each feature on an appropriate model.", "question": "Which allocation is most defensible as a starting point?", "options": [{"letter": "A", "text": "Put all three on the most capable model, then downgrade only if the bill becomes a problem.", "correct": false, "explanation": "This pays top-tier prices for a high-volume labelling task that does not need them, and it defers the evaluation work that would tell the team where capability actually matters."}, {"letter": "B", "text": "Put all three on the smallest model, then upgrade only the features that users complain about.", "correct": false, "explanation": "Using customer complaints as the evaluation signal means the regulatory assessment fails in front of the people it matters most to. Features with a high cost of error should not be the ones discovering their model is too small."}, {"letter": "C", "text": "Tagger on the small, fast tier; chat assistant on the mid tier; regulatory analysis on the most capable tier — then validate each choice against a task-specific evaluation.", "correct": true, "explanation": "This matches each model tier to its intended shape of work: high-volume simple classification, balanced interactive reasoning, and hardest-reasoning analysis where the cost of an error is highest. Treating it as a starting point to be validated is what makes it defensible rather than a guess."}, {"letter": "D", "text": "Route all three through the most capable model but cap output length to control cost.", "correct": false, "explanation": "Output caps limit response length, not the input-heavy cost of a high-volume tagger, and truncating a compliance assessment damages the one feature that needs room to reason."}], "correct": "C", "select": 1}, {"id": "d5-14", "domain": 5, "objective": "Model Selection and Tradeoffs", "situation": "A team pins a specific model identifier in production. A newer model is released with better benchmark results and a lower price. The team's prompts include an assistant-turn prefill and a fixed thinking budget, and their downstream parser depends on the exact response formatting they have tuned over a year.", "question": "What is the appropriate way to adopt the new model?", "options": [{"letter": "A", "text": "Change the model identifier in production and monitor the error rate for a week.", "correct": false, "explanation": "Two of the team's patterns are rejected outright on newer models, so this is likely to fail immediately in production rather than degrade gently. Model changes are behaviour changes, not configuration flips."}, {"letter": "B", "text": "Keep the old model indefinitely, since any change risks the tuned formatting.", "correct": false, "explanation": "Pinning is right for stability, but pinning forever is not a strategy: models are eventually retired, and the migration only gets harder as more behaviour is tuned to the old one."}, {"letter": "C", "text": "Adopt the new model only for new features and leave the existing integration untouched.", "correct": false, "explanation": "This leaves the team maintaining two model behaviours and two sets of prompting conventions, and it still leaves the old integration facing the same migration later."}, {"letter": "D", "text": "Review the new model's breaking changes first, replace the prefill with structured output and the fixed budget with adaptive thinking and an effort level, then re-run the evaluation set against both models before switching.", "correct": true, "explanation": "A model release can remove request parameters and shift response style, so the migration starts with what actually breaks. Replacing the two removed patterns and comparing both models on the team's own evaluation set turns the switch into a measured decision rather than a hope."}], "correct": "D", "select": 1}, {"id": "d5-15", "domain": 5, "objective": "Model Selection and Tradeoffs", "situation": "A team is writing the model-selection section of a design document. Two engineers disagree about what should drive the choice for a document-extraction feature that runs on 50,000 documents a day with a strict 2-second response budget.", "question": "Which two factors should carry the most weight in this decision? (Select TWO.)", "options": [{"letter": "A", "text": "Measured accuracy of each candidate model on a representative sample of the team's own documents.", "correct": true, "explanation": "Published benchmarks describe other tasks. Only an evaluation on the team's own documents shows whether a cheaper model is good enough for this extraction, which is the question the decision turns on."}, {"letter": "B", "text": "Each candidate's latency at the required volume against the 2-second budget.", "correct": true, "explanation": "A hard response budget is a constraint, not a preference. A model that cannot meet it at production volume is disqualified regardless of how accurate or cheap it is."}, {"letter": "C", "text": "Which model is newest, since newer releases supersede older ones for every task.", "correct": false, "explanation": "Recency is not a selection criterion. A newer, more capable model may be slower or more expensive than what this task needs, and capability tiers exist alongside each other on purpose."}, {"letter": "D", "text": "Which model the team is most familiar with, to reduce prompt-engineering effort.", "correct": false, "explanation": "Familiarity is a small one-time cost against a decision that will be paid for on 50,000 documents a day. It should not outweigh accuracy or a hard latency constraint."}, {"letter": "E", "text": "The size of each model's context window, since a larger window always improves extraction quality.", "correct": false, "explanation": "The window must be large enough for the documents, but beyond that it is a capacity limit rather than a quality dial. Extra unused capacity does not make extraction more accurate."}], "correct": ["A", "B"], "select": 2}, {"id": "d5-16", "domain": 5, "objective": "Cost and Token Management", "situation": "A support assistant sends a 9,000-token system prompt — product documentation and policy — with every request, followed by a short conversation. Traffic is steady all day and the same system prompt is used for every user. The monthly bill is dominated by input tokens.", "question": "Which change most reduces cost without changing what the model can see?", "options": [{"letter": "A", "text": "Mark the stable system prompt as cacheable so repeated requests read it from cache rather than reprocessing it at full input price.", "correct": true, "explanation": "A large prefix that is identical on every request is the ideal caching case: the content the model sees is unchanged, but repeated reads are billed far below the standard input rate. Steady all-day traffic also keeps the cache warm."}, {"letter": "B", "text": "Summarize the documentation down to 2,000 tokens.", "correct": false, "explanation": "This does reduce cost, but by removing information the assistant relies on. The question asks for a reduction that does not change what the model can see."}, {"letter": "C", "text": "Move the system prompt into every user message instead.", "correct": false, "explanation": "The same tokens are still sent, now in a position that is worse for both caching and instruction placement. Nothing is saved."}, {"letter": "D", "text": "Switch to a model with a lower output price.", "correct": false, "explanation": "The bill is dominated by input tokens, so optimising the output rate targets the smaller half of the cost. It also changes model behaviour to solve a problem caching addresses directly."}], "correct": "A", "select": 1}, {"id": "d5-17", "domain": 5, "objective": "Cost and Token Management", "situation": "A platform team runs one Claude-backed service that four product teams call through different endpoints. The monthly bill has tripled and nobody can say which product caused it. The service logs a request identifier and a latency figure per call, and the team reads the total from the billing console at month end.", "question": "What should the team instrument to answer the question?", "options": [{"letter": "A", "text": "Sample one request per minute and extrapolate its
