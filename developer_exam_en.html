<style>
/* Ravn Brand System — dark canvas, white text, muted gray, single gold accent.
   Flat (no shadows/gradients), Work Sans + Source Code Pro. Functional red is
   kept only for wrong-answer / fail feedback; green marks correct answers;
   gold carries selection / emphasis. */
:root {
  --bg: #161616; --surface: #1d1d1d; --surface-2: #222222;
  --fg: #FFFFFF; --fg-soft: #D4D4D4; --muted: #ADB5BD; --subtle: #8B949E;
  --border: #2A2A2A; --border-strong: #3A3A3A;
  --gold: #B7986A; --gold-soft: rgba(183,152,106,0.12); --gold-fg: #161616;
  --bad: #C16B57; --bad-soft: rgba(193,107,87,0.14);
  --good: #6FA97C; --good-soft: rgba(111,169,124,0.14); --good-fg: #161616;
  --r-sm: 4px; --r-md: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.6; background: var(--bg); color: var(--fg);
  height: 100vh; overflow: hidden; display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased; }

.ravn-topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center;
  justify-content: space-between; padding: 12px 32px; background: var(--bg); color: var(--fg);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ravn-brand { display: inline-flex; align-items: center; gap: 16px; color: var(--fg);
  text-decoration: none; font-weight: 600; }
.ravn-brand:hover { color: var(--gold); }
.ravn-brand svg { height: 20px; width: auto; fill: currentColor; flex-shrink: 0; }
.ravn-brand-tagline { font-size: 12px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.167em; font-weight: 600; }

/* Mode toggle in the brand bar */
.mode-toggle { display: inline-flex; align-items: center; gap: 0; background: transparent;
  border: 1px solid var(--border-strong); border-radius: var(--r-md); overflow: hidden; }
.mode-toggle button { background: none; border: none; color: var(--muted); cursor: pointer;
  font-family: inherit; font-size: 11.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.1em; padding: 6px 14px; transition: background .15s, color .15s; }
.mode-toggle button.active { background: var(--gold); color: var(--gold-fg); }
.mode-hint { font-size: 11.5px; color: var(--subtle); margin-left: 12px; }
.mode-controls { display: flex; align-items: center; }

.shell { display: flex; flex: 1; min-height: 0; overflow: hidden; }

.sidebar { width: 272px; min-width: 272px; background: var(--surface); color: var(--muted);
  display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  border-right: 1px solid var(--border); }
.sidebar-header { padding: 18px 16px 12px; font-size: 11.5px; font-weight: 600;
  letter-spacing: .167em; text-transform: uppercase; color: var(--gold);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-progress { padding: 10px 16px; font-size: 12px; color: var(--muted);
  border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sidebar-progress span { color: var(--fg); font-weight: 600; }
.sidebar-scroll { overflow-y: auto; flex: 1; padding: 8px 0; }
.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

.domain-group { margin-bottom: 6px; }
.domain-label { padding: 8px 16px 5px; font-size: 10px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; gap: 8px; }
.domain-label .dl-weight { color: var(--subtle); font-weight: 600; }
.q-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 16px;
  background: none; border: none; cursor: pointer; font-size: 13.5px; color: var(--muted);
  font-family: inherit; text-align: left; transition: background .15s, color .15s;
  border-left: 3px solid transparent; }
.q-btn:hover { background: var(--surface-2); color: var(--fg); }
.q-btn.active { background: var(--gold-soft); color: var(--gold); border-left-color: var(--gold); }
.q-btn.answered .q-dot { background: var(--gold); }
.q-btn.answered-correct { color: var(--good); }
.q-btn.answered-correct .q-dot { background: var(--good); }
.q-btn.answered-wrong { color: var(--bad); }
.q-btn.answered-wrong .q-dot { background: var(--bad); }
.q-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--subtle);
  flex-shrink: 0; transition: background .2s; }

.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-height: 0; min-width: 0; }
.topbar { background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 32px;
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-title { font-size: 15px; font-weight: 600; color: var(--fg); }
.topbar-nav { display: flex; gap: 10px; align-items: center; }
.nav-btn { padding: 8px 18px; border-radius: var(--r-md); border: 1px solid var(--border-strong);
  background: transparent; font-family: inherit; font-size: 12px; cursor: pointer; color: var(--muted);
  font-weight: 600; text-transform: uppercase; letter-spacing: .1em; transition: all .15s; }
.nav-btn:hover { color: var(--fg); border-color: var(--gold); }
.nav-btn:disabled { opacity: .35; cursor: default; }
.nav-btn.finish { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.nav-btn.finish:hover { background: var(--gold); border-color: var(--gold); color: var(--gold-fg); }
.q-counter { font-size: 13px; color: var(--muted); font-weight: 500; }

.content { flex: 1; overflow-y: auto; padding: 36px 48px; }
.content::-webkit-scrollbar { width: 6px; }
.content::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

.q-card { max-width: 820px; margin: 0 auto; }
.q-domain { display: inline-block; background: transparent; color: var(--fg); font-size: 11px;
  font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 4px 11px;
  border: 1px solid var(--border-strong); border-radius: var(--r-sm); margin-bottom: 8px; }
.q-scenario { display: inline-block; background: transparent; color: var(--gold); font-size: 11px;
  font-weight: 600; letter-spacing: .12em; text-transform: uppercase; padding: 4px 11px;
  border: 1px solid var(--gold); border-radius: var(--r-sm); margin-bottom: 16px; margin-left: 8px; }
.q-number { font-size: 11px; color: var(--subtle); margin-bottom: 6px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; }
.q-situation { font-size: 16.5px; color: var(--fg-soft); font-weight: 400; line-height: 1.7;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 16px 20px; margin-bottom: 22px; }
.q-situation code, .opt-text code, .explanation code, .opt-expl code {
  background: var(--surface-2); padding: 1px 5px; border-radius: var(--r-sm);
  font-family: "Source Code Pro", ui-monospace, Menlo, Monaco, monospace; font-size: 13.5px; color: var(--gold); }
.q-prompt { font-size: 17px; font-weight: 700; color: var(--fg); margin-bottom: 20px; }

.q-select { display: inline-block; background: var(--gold-soft); color: var(--gold); font-size: 11.5px;
  font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 12px;
  border-radius: var(--r-sm); margin-bottom: 16px; }
.q-select-hint { font-size: 12.5px; color: var(--subtle); margin: -8px 0 16px; }
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
.option { border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface);
  transition: border-color .15s, background .15s; overflow: hidden; }
.option-head { display: flex; align-items: flex-start; gap: 14px; width: 100%; padding: 14px 18px;
  border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.option-head:focus-visible { outline: 2px solid var(--gold); outline-offset: -3px; }
.option:hover:not(.locked):not(.dimmed) .option-head { background: var(--surface-2); }
.option:hover:not(.locked):not(.dimmed) { border-color: var(--gold); }
.option.locked .option-head, .option-head[aria-disabled="true"] { cursor: default; }
.option.locked .option-head:disabled { opacity: 1; }
.option.selected { border-color: var(--gold); }
.opt-letter { width: 30px; height: 30px; min-width: 30px; border-radius: 50%; background: var(--surface-2);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
  color: var(--muted); transition: background .2s, color .2s; flex-shrink: 0; }
.option.selected .opt-letter { background: var(--gold); color: var(--gold-fg); }
.opt-text { font-size: 15px; color: var(--fg-soft); line-height: 1.55; padding-top: 3px; }
.option.correct { border-color: var(--good); background: var(--good-soft); }
.option.correct .opt-letter { background: var(--good); color: var(--good-fg); }
.option.wrong { border-color: var(--bad); background: var(--bad-soft); }
.option.wrong .opt-letter { background: var(--bad); color: #fff; }
.option.dimmed { opacity: .5; }
.opt-expl { display: none; font-size: 13.5px; line-height: 1.6; color: var(--muted);
  padding: 0 18px 14px 62px; }
.option.locked .opt-expl.show { display: block; }
.option.correct .opt-expl { color: var(--good); }
.option.wrong .opt-expl { color: var(--bad); }

.explanation { margin-top: 4px; padding: 14px 18px; background: var(--surface);
  border-left: 3px solid var(--gold); border-radius: 0 var(--r-md) var(--r-md) 0; font-size: 14.5px;
  color: var(--muted); line-height: 1.65; display: none; }
.explanation.show { display: block; }
.explanation strong { color: var(--gold); }

.summary { max-width: 860px; margin: 0 auto; display: none; }
.summary.show { display: block; }
.summary h1 { font-size: 26px; font-weight: 800; color: var(--fg); margin-bottom: 6px; }
.summary-subtitle { color: var(--muted); font-size: 15px; margin-bottom: 22px; }
.verdict { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; padding: 7px 18px; border-radius: var(--r-sm); margin-bottom: 22px; }
.verdict.pass { background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold); }
.verdict.fail { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.score-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 14px; }
.score-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 20px; text-align: center; }
.score-card .big { font-size: 38px; font-weight: 800; line-height: 1; margin-bottom: 6px; }
.score-card .label { font-size: 11px; color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .12em; }
.score-card.total .big { color: var(--fg); }
.score-card.correct-c .big { color: var(--good); }
.score-card.wrong-c .big { color: var(--bad); }
.threshold-note { font-size: 12.5px; color: var(--subtle); margin-bottom: 26px; }

.domain-scores { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 8px 20px; margin-bottom: 26px; }
.ds-row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.ds-row:last-child { border-bottom: none; }
.ds-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--fg); }
.ds-name small { color: var(--subtle); font-weight: 500; }
.ds-bar { width: 160px; height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.ds-bar > div { height: 100%; background: var(--gold); }
.ds-bar > div.low { background: var(--muted); }
.ds-bar > div.bad { background: var(--bad); }
.ds-pct { width: 92px; text-align: right; font-size: 13px; color: var(--muted); font-weight: 600; }

.section-title { font-size: 18px; font-weight: 700; color: var(--fg); margin-bottom: 12px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.group-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: 18px 20px; margin-bottom: 16px; }
.group-title { font-size: 15px; font-weight: 700; color: var(--fg); margin-bottom: 12px;
  display: flex; align-items: center; gap: 10px; }
.group-badge { font-size: 10px; padding: 3px 10px; border-radius: var(--r-sm); font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase; background: var(--bad-soft); color: var(--bad); }
.wrong-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0;
  border-bottom: 1px solid var(--border); font-size: 14px; color: var(--muted); }
.wrong-item:last-child { border-bottom: none; }
.wrong-item .wi-n { min-width: 36px; font-weight: 700; color: var(--subtle); font-size: 12px; padding-top: 2px; }
.wrong-item .wi-q { flex: 1; }
.wrong-item .wi-situation { font-size: 13.5px; color: var(--fg-soft); font-weight: 500; margin-bottom: 4px; line-height: 1.5; }
.wrong-item .wi-prompt { font-size: 13px; color: var(--muted); font-style: italic; margin-bottom: 4px; }
.wrong-item .wi-ans { font-size: 12.5px; margin-top: 3px; color: var(--muted); }
.wi-wrong-tag { color: var(--bad); font-weight: 700; }
.wi-correct-tag { color: var(--good); font-weight: 700; }
.wi-expl { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: var(--r-sm);
  padding: 8px 10px; margin-top: 6px; line-height: 1.55; }

.restart-btn { margin-top: 28px; padding: 12px 32px; background: var(--fg); color: var(--bg);
  border: none; border-radius: var(--r-md); font-family: inherit; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em; cursor: pointer; transition: background .15s, color .15s; }
.restart-btn:hover { background: var(--gold); color: var(--gold-fg); }
.screen { display: none; }
.screen.active { display: block; }

@media (max-width: 760px) {
  html, body { height: auto; }
  body { min-height: 100vh; height: auto; overflow: auto; display: block; }
  .ravn-topbar { position: static; padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
  .ravn-brand-tagline { display: none; }
  .mode-controls { max-width: 100%; flex-wrap: wrap; gap: 6px 0; }
  .mode-hint { margin-left: 8px; }
  .shell { display: block; overflow: visible; }
  .sidebar { width: 100%; min-width: 0; height: 220px; min-height: 0;
    border-right: 0; border-bottom: 1px solid var(--border); }
  .main { overflow: visible; }
  .topbar { padding: 12px 16px; gap: 10px; flex-wrap: wrap; }
  .topbar-title { width: 100%; }
  .topbar-nav { width: 100%; flex-wrap: wrap; gap: 8px; }
  .content { overflow: visible; padding: 24px 16px 48px; }
  .q-scenario { display: block; width: fit-content; margin-left: 0; }
  .score-grid { grid-template-columns: 1fr; }
  .ds-row { flex-wrap: wrap; }
  .ds-name { flex-basis: 100%; }
  .ds-bar { flex: 1; min-width: 140px; }
}

@media (max-width: 420px) {
  .mode-hint { width: 100%; margin-left: 0; }
  .nav-btn { padding: 7px 11px; }
  .q-counter { width: 100%; }
  .wrong-item { display: block; }
  .wrong-item .wi-n { margin-bottom: 4px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; }
}
</style>

<script>
const QUESTIONS = [{"id": "d1-01", "domain": 1, "objective": "Agent Architecture", "situation": "A payroll team processes timesheets. Every timesheet goes through the same four steps in the same order: validate hours against the schedule, apply the overtime rules, compute gross pay, and write a payroll record. The rules are documented, the order never varies, and any exception is routed to a human.", "question": "Which architecture fits this problem?", "options": [{"letter": "A", "text": "A fixed workflow whose steps call Claude where judgment is needed and ordinary code where the rules are deterministic.", "correct": true, "explanation": "The steps and their order are known in advance and never vary, which is the definition of a workflow. Reserving model calls for the steps that need judgment keeps the deterministic arithmetic in code, where it is cheaper, testable, and exact."}, {"letter": "B", "text": "An agent that decides for each timesheet which of the four steps to run and in what order.", "correct": false, "explanation": "Agentic control earns its cost when the path cannot be predetermined. Here it can, so the agent adds latency, cost, and non-determinism to a sequence that is already fully specified."}, {"letter": "C", "text": "A manager agent that delegates each step to a dedicated subagent.", "correct": false, "explanation": "A supervisor hierarchy is a way to organise work whose shape is uncertain or whose subtasks need context isolation. Neither applies to four known steps on one small record, so the hierarchy is overhead without a benefit."}, {"letter": "D", "text": "A single prompt containing all four rule sets, asking the model to produce the payroll record in one call.", "correct": false, "explanation": "Collapsing four checkable steps into one opaque call removes every intermediate result the team could validate or audit, and it puts exact arithmetic on the model when code would do it reliably."}], "correct": "A", "select": 1}, {"id": "d1-02", "domain": 1, "objective": "Agent Architecture", "situation": "A security team wants an assistant that investigates suspicious login alerts. Some alerts resolve after one lookup; others require pivoting through device history, related accounts, and network logs, where each finding determines what to check next. The team cannot enumerate the investigation paths in advance.", "question": "Which property of this task most justifies an agentic design over a fixed workflow?", "options": [{"letter": "A", "text": "The investigation involves more than one data source.", "correct": false, "explanation": "A fixed workflow can query several data sources in a known order. The number of sources does not distinguish the two designs."}, {"letter": "B", "text": "The output is a written narrative rather than a structured record.", "correct": false, "explanation": "Output format is independent of control flow. A workflow's final step can produce a narrative just as easily."}, {"letter": "C", "text": "The next step depends on what the previous step revealed, so the sequence cannot be fixed ahead of time.", "correct": true, "explanation": "This is the core criterion. When the path through the task is discovered during execution rather than known before it, no fixed sequence can represent the work, and the model must be allowed to choose the next action from what it has learned."}, {"letter": "D", "text": "The team wants to reduce the number of model calls per alert.", "correct": false, "explanation": "Agentic designs generally make more model calls than an equivalent workflow, not fewer. Cost reduction argues for the workflow, not against it."}], "correct": "C", "select": 1}, {"id": "d1-03", "domain": 1, "objective": "Agent Architecture", "situation": "A team's due-diligence assistant must review a target company across four independent areas: financial filings, litigation history, key-personnel background, and technology stack. Each area requires reading a large volume of source material and produces a short assessment. The four assessments are then combined into one memo.", "question": "Why is a manager-with-subagents structure a good fit here?", "options": [{"letter": "A", "text": "Because subagents can be run on a cheaper model, which is the main saving available.", "correct": false, "explanation": "Routing a subagent to a cheaper model is sometimes worthwhile, but it is a secondary optimisation. It is not what makes the structure fit this problem, and the areas here involve judgment that may not tolerate a downgrade."}, {"letter": "B", "text": "Because a manager agent produces more accurate output than a single agent on any task.", "correct": false, "explanation": "No structure is universally more accurate. Delegation adds coordination overhead and information loss at each handoff, which makes it a poor choice for tasks that are not decomposable."}, {"letter": "C", "text": "Because the four areas are independent, so each subagent can read its own bulky sources in isolation and return only a short assessment to the manager.", "correct": true, "explanation": "Independence makes the work decomposable, and the ratio of bulky input to compact output is what makes delegation pay: the manager's context holds four short assessments instead of four large document sets, and the four investigations can proceed in parallel."}, {"letter": "D", "text": "Because the manager can re-run any subagent that returns an answer it disagrees with until the answers are consistent.", "correct": false, "explanation": "Re-running a subagent until its answer matches the manager's expectation selects for agreement rather than correctness, and independent areas are not expected to be consistent with each other in the first place."}], "correct": "C", "select": 1}, {"id": "d1-04", "domain": 1, "objective": "Agent Architecture", "situation": "A developer has built a single agent that handles customer email end to end: it classifies the message, looks up the account, drafts a reply, and — for refund requests — issues the refund. It has eleven tools. Quality is acceptable but the team is nervous about the refund capability being available on every message, and the agent occasionally uses an account-lookup tool when classification alone would do.", "question": "Which restructuring addresses both concerns?", "options": [{"letter": "A", "text": "Add a system-prompt rule that the refund tool may only be used for refund requests.", "correct": false, "explanation": "This asks the model to police its own capability. The refund tool remains reachable on every message, so a misclassification or an injected instruction can still reach it."}, {"letter": "B", "text": "Keep one agent and reduce its tool count by merging the eleven tools into three broader ones.", "correct": false, "explanation": "Merging tools hides the refund capability inside a broader tool rather than removing it from the classification path, and broader tools with mode parameters are usually harder for the model to use correctly, not easier."}, {"letter": "C", "text": "Split the work: a classification step with no account or refund tools, routing to a handler that holds only the tools its branch needs, with the refund branch gated by approval.", "correct": true, "explanation": "Decomposing along the natural boundary gives each step only the capability it requires, which both narrows the blast radius of the refund tool and removes the ambiguity that was causing unnecessary lookups during classification."}, {"letter": "D", "text": "Run the same agent twice per message and act only when the two runs agree.", "correct": false, "explanation": "Doubling the cost buys agreement between two runs that share the same tools and the same exposure. Neither concern — capability scope or tool selection ambiguity — is affected."}], "correct": "C", "select": 1}, {"id": "d1-05", "domain": 1, "objective": "Agent Architecture", "situation": "A team is deciding whether to build a customer-onboarding assistant as an agent. The task involves several steps, the cost of a wrong action is a mis-provisioned account that support can fix within a day, and the volume is high but the process is documented and rarely varies.", "question": "Which two of these considerations argue against an agentic design for this task? (Select TWO.)", "options": [{"letter": "A", "text": "The process is documented and rarely varies, so the sequence of steps can be specified in advance.", "correct": true, "explanation": "Predictability is the strongest argument for a workflow. When the steps can be written down, letting a model rediscover them on every run pays for flexibility the task does not use."}, {"letter": "B", "text": "The volume is high, so the per-run cost and latency of an agentic loop are multiplied across many runs.", "correct": true, "explanation": "An agentic loop costs more per run than a fixed sequence. At high volume that difference compounds, and it is only worth paying when the task genuinely needs the flexibility."}, {"letter": "C", "text": "Errors are recoverable within a day, which means an agent's mistakes would be too expensive to tolerate.", "correct": false, "explanation": "This reverses the reasoning. Recoverable errors make an autonomous design more tolerable, not less; it is unrecoverable errors that argue for tighter control."}, {"letter": "D", "text": "The task involves several steps, and multi-step tasks require agentic control.", "correct": false, "explanation": "Multi-step is not the same as unpredictable. A workflow is by definition a multi-step structure, so step count alone never decides this question."}, {"letter": "E", "text": "Onboarding touches customer data, and agents cannot be given access to customer data.", "correct": false, "explanation": "Agents routinely operate on sensitive data under appropriate access controls. There is no such categorical prohibition, so this is not a real consideration."}], "correct": ["A", "B"], "select": 2}, {"id": "d1-06", "domain": 1, "objective": "Agent Construction with Claude", "situation": "A developer is writing a minimal agent loop by hand against the Messages API. The loop sends a request, and if the response contains tool calls, executes them and sends the results back. In testing, the loop sometimes exits while the model still intended to continue, and sometimes keeps looping after the model has finished.", "question": "What should the loop's continuation condition be based on?", "options": [{"letter": "A", "text": "Whether the response text ends with a question mark or an explicit statement that more work remains.", "correct": false, "explanation": "Inferring intent from the prose is guesswork against free-form text. The API reports how the turn ended explicitly, so parsing the wording is both fragile and unnecessary."}, {"letter": "B", "text": "A fixed iteration count tuned to the longest task observed in testing.", "correct": false, "explanation": "A fixed count cuts off long tasks and wastes calls on short ones. It is a useful safety ceiling against runaway loops, but it cannot be the primary signal for whether the model is done."}, {"letter": "C", "text": "Whether any tool result is still pending in the developer's own queue.", "correct": false, "explanation": "The queue reflects work the developer has dispatched, not whether the model wants another turn. A model can request more tools after every pending result has been returned."}, {"letter": "D", "text": "The response's stop reason: continue while it indicates the model is requesting tool use, and stop when it indicates the turn ended normally.", "correct": true, "explanation": "The stop reason is the API's explicit statement of why generation ended, and it is what the loop condition exists to read. Both observed bugs are the result of inferring that state instead of reading it."}], "correct": "D", "select": 1}, {"id": "d1-07", "domain": 1, "objective": "Agent Construction with Claude", "situation": "A team wants a coding agent that can read and edit files in a repository, run shell commands, and search the codebase. They want to run it on their own infrastructure, inside their VPC, and they would rather not implement file editing, search, and command execution themselves.", "question": "Which option best matches these requirements?", "options": [{"letter": "A", "text": "The Claude Agent SDK, which supplies the agent loop and a set of built-in file, search, and command tools while the team hosts it.", "correct": true, "explanation": "The requirements name a batteries-included coding harness that the team deploys itself. That is what the Agent SDK provides: the loop and the built-in tooling, running wherever the team runs it — in this case inside their VPC."}, {"letter": "B", "text": "A hand-written loop over the Messages API with custom tools for file editing, search, and command execution.", "correct": false, "explanation": "This meets the hosting requirement but implements from scratch exactly the tooling the team said they would rather not build. It is the right answer only when the team needs control the existing harness does not give."}, {"letter": "C", "text": "A managed, Anthropic-hosted agent, since the team wants a workspace with file and command access.", "correct": false, "explanation": "A hosted agent supplies the workspace but places execution on Anthropic's infrastructure, which conflicts with the stated requirement to run inside the team's own VPC."}, {"letter": "D", "text": "A batch job that sends each file to the API separately and collects the edits.", "correct": false, "explanation": "Batch processing handles independent, latency-tolerant requests. A coding agent needs an interactive loop that reacts to the result of each command, which batch does not provide."}], "correct": "A", "select": 1}, {"id": "d1-08", "domain": 1, "objective": "Agent Construction with Claude", "situation": "A team runs a nightly agent that must operate for a long session, keep a persistent workspace between turns, resume after client disconnects, and be started on a schedule with no server of the team's own kept running.", "question": "Which deployment model fits these constraints with the least infrastructure of the team's own?", "options": [{"letter": "A", "text": "A self-hosted loop on a virtual machine the team keeps running, with a cron entry to trigger it.", "correct": false, "explanation": "This satisfies the functional needs but requires the team to operate the machine, the scheduler, the workspace persistence, and the reconnect handling — precisely the infrastructure the requirement asks to avoid."}, {"letter": "B", "text": "A managed, Anthropic-hosted agent with a scheduled deployment, where the session workspace and event stream are provided by the platform.", "correct": true, "explanation": "Managed agents supply the loop, a per-session workspace, a resumable event stream, and scheduled firing. Every listed constraint maps to something the platform provides, so the team operates no server of its own."}, {"letter": "C", "text": "A batch request submitted each night containing the whole task as a single prompt.", "correct": false, "explanation": "Batch runs one-shot requests asynchronously. It offers no persistent workspace, no multi-turn session, and no way to resume, so it does not match a long-running agent."}, {"letter": "D", "text": "A headless coding-agent invocation triggered from the team's CI runner.", "correct": false, "explanation": "This is workable for short automated jobs but still depends on the team's CI infrastructure, and CI runners are ephemeral, which conflicts with a persistent workspace across a long session."}], "correct": "B", "select": 1}, {"id": "d1-09", "domain": 1, "objective": "Agent Construction with Claude", "situation": "A team's agent edits source files. Their policy is that every edited file must be run through the project formatter and that each edit must be appended to a change log the release process reads. Both steps are described in the agent's system prompt. Reviewing three weeks of runs, the team finds the formatter was skipped on about one edit in eight and several log entries are missing.", "question": "How should these two steps be implemented so they happen on every edit?", "options": [{"letter": "A", "text": "Restate both steps as a numbered checklist in the system prompt and require the agent to confirm each one in its response.", "correct": false, "explanation": "A confirmation in the response is generated text, not evidence the step ran. The agent can report completing a step it skipped, which leaves the team no better off than the current instruction."}, {"letter": "B", "text": "Give the agent a formatter tool and a log-append tool and describe when to call them.", "correct": false, "explanation": "Tools make the steps available but leave the decision to call them with the model, which is the decision that is already failing one time in eight."}, {"letter": "C", "text": "Attach hooks that run the formatter and append the log entry automatically after the edit tool completes, so neither step depends on the agent choosing to perform it.", "correct": true, "explanation": "These are deterministic follow-up actions with no judgment in them, so they belong in the harness rather than in the agent's decision-making. A hook fires on the edit itself, which makes the coverage complete by construction and also removes two steps from the model's workload."}, {"letter": "D", "text": "Run the formatter and reconstruct the change log in a nightly batch job over the day's commits.", "correct": false, "explanation": "A nightly sweep can restore formatting, but reconstructing per-edit log entries after the fact loses the detail the release process expects, and it leaves unformatted code in the repository during the day."}], "correct": "C", "select": 1}, {"id": "d1-10", "domain": 1, "objective": "Agent Construction with Claude", "situation": "A developer's custom harness executes each tool call the model requests, appends the result, and loops. A code review asks what happens when the model requests a tool that does not exist, when a tool raises, and when the model requests fifty tool calls in a row without converging.", "question": "Which set of harness behaviours handles these cases correctly?", "options": [{"letter": "A", "text": "Return an error result naming the unknown tool, return an error result for the raised exception, and stop the loop at a configured iteration ceiling with a reported reason.", "correct": true, "explanation": "Each case is answered in the loop rather than by crashing: an unknown-tool error lets the model correct its call, a marked error result lets it recover or escalate, and an iteration ceiling bounds a non-converging run while making the stop visible rather than silent."}, {"letter": "B", "text": "Ignore unknown tool calls, swallow exceptions and return empty results, and let the loop run until the model stops on its own.", "correct": false, "explanation": "Unanswered and empty results leave the model with no information about what went wrong, and an unbounded loop has no defence against a run that never converges. Both invite silent, expensive failure."}, {"letter": "C", "text": "Raise an exception out of the harness in all three cases so the caller decides what to do.", "correct": false, "explanation": "Terminating the run on any recoverable condition discards the agent's ability to correct a bad tool name or route around a failing tool, which is a large part of what the loop is for."}, {"letter": "D", "text": "Retry each failing tool call indefinitely until it succeeds, and remove the iteration limit so long tasks are never cut short.", "correct": false, "explanation": "An indefinite retry on a permanently failing tool never terminates, and removing the ceiling leaves nothing to stop a runaway loop. This converts recoverable failures into unbounded cost."}], "correct": "A", "select": 1}, {"id": "d1-11", "domain": 1, "objective": "Agent Construction with Claude", "situation": "A team is choosing between writing their own loop over the Messages API and using the SDK's tool-runner helper for an agent with six custom tools. They need an approval gate before one tool executes, want to log each turn, and expect to modify some tool results before returning them.", "question": "Which two statements correctly inform this decision? (Select TWO.)", "options": [{"letter": "A", "text": "The tool-runner helper drives the request-execute-loop cycle, so the team writes the tool functions rather than the loop.", "correct": true, "explanation": "That is what the helper provides: it removes the boilerplate loop while the team supplies the tools. It is the usual starting point for a custom-tool agent."}, {"letter": "B", "text": "Per-turn hooks in the helper cover approval gates, logging, and modifying results, so those three needs do not by themselves require a hand-written loop.", "correct": true, "explanation": "These are exactly the interception points the helper exposes. A hand-written loop becomes the right answer when the control flow itself must differ, not merely because the team needs to intervene each turn."}, {"letter": "C", "text": "The tool-runner helper also supplies built-in file, search, and command tools, so the six custom tools may be unnecessary.", "correct": false, "explanation": "The helper runs only the tools the developer defines. Built-in filesystem and command tooling belongs to the separate agent SDK, which is a different product with a different purpose."}, {"letter": "D", "text": "Using the helper means Anthropic hosts the agent, removing the need for the team to deploy anything.", "correct": false, "explanation": "The helper is a client-side convenience in the API SDK. The team still hosts and deploys the process; hosted execution is what managed agents provide."}, {"letter": "E", "text": "A hand-written loop is required whenever an agent has more than a few tools.", "correct": false, "explanation": "Tool count does not determine the choice. The helper handles many tools; what argues for a hand-written loop is a control flow the helper's structure cannot express."}], "correct": ["A", "B"], "select": 2}, {"id": "d1-12", "domain": 1, "objective": "Agent Patterns and Frameworks", "situation": "A support agent handles conversations that span days. Users expect it to remember their reported issue, the troubleshooting already attempted, and their stated preference for email over phone — but not every message verbatim. Sessions are resumed from a mobile app after arbitrary gaps.", "question": "Which approach to memory fits this pattern?", "options": [{"letter": "A", "text": "Replay the entire conversation history on every request so nothing is ever lost.", "correct": false, "explanation": "Over days of conversation this grows without bound, eventually exceeding the window, and it pays full token cost on every message to carry detail the task explicitly does not need."}, {"letter": "B", "text": "Persist a structured record of the durable facts — the issue, steps attempted, and contact preference — outside the conversation, and load it when a session resumes.", "correct": true, "explanation": "The requirement distinguishes durable facts from transcript detail. Storing those facts in application state and injecting them on resume gives the agent what it needs at bounded cost, and the record survives arbitrary gaps between sessions."}, {"letter": "C", "text": "Rely on the model to recall previous sessions, since conversations with the same user share context automatically.", "correct": false, "explanation": "Model requests are stateless. Nothing carries over between sessions unless the application sends it, so this design remembers nothing at all."}, {"letter": "D", "text": "Store the full transcript and, on resume, send the most recent 50 messages.", "correct": false, "explanation": "A recency window is arbitrary with respect to importance: the originally reported issue is the oldest message and the first to fall out, while 50 messages of pleasantries are retained."}], "correct": "B", "select": 1}, {"id": "d1-13", "domain": 1, "objective": "Agent Patterns and Frameworks", "situation": "A team is choosing between building directly on the API's tool-use loop and adopting an agent framework such as LangGraph, Strands, or PydanticAI for a multi-step document-processing agent. The team is small, the workflow has branching and retry logic, and they want the state of a run to be inspectable when something fails.", "question": "What is a fair characterisation of the tradeoff?", "options": [{"letter": "A", "text": "A framework supplies structure for branching, state, and retries that the team would otherwise write, at the cost of a dependency and its abstractions; building directly keeps full control and fewer moving parts.", "correct": true, "explanation": "This is the actual tradeoff. Frameworks package the orchestration concerns the scenario names, and the price is a dependency whose model the team must learn and live within. Neither side is universally right; it turns on how much of that structure the team needs."}, {"letter": "B", "text": "Frameworks are required for any agent with more than one tool, because the raw API cannot express branching.", "correct": false, "explanation": "The API's tool-use loop expresses branching perfectly well in ordinary code. Frameworks are a convenience, not a capability the API lacks."}, {"letter": "C", "text": "Building directly on the API is always cheaper at runtime, because frameworks add model calls.", "correct": false, "explanation": "A framework is orchestration code running in the team's process; it does not by itself add model calls. Runtime cost is determined by the agent's design, not by whether a library organises it."}, {"letter": "D", "text": "Adopting a framework removes the need to design the agent's control flow, since the framework decides it.", "correct": false, "explanation": "A framework provides the vocabulary for expressing control flow; the team still designs it. Believing otherwise leads to a poorly designed agent expressed in someone else's abstractions."}], "correct": "A", "select": 1}, {"id": "d1-14", "domain": 1, "objective": "Agent Patterns and Frameworks", "situation": "A data-cleanup agent processes a queue of 5,000 records. Each record needs the same three tool calls, and records are entirely independent. The developer has implemented it as one long-running agent conversation that works through the queue record by record, and quality degrades noticeably after a few hundred records.", "question": "What is the most likely cause and the appropriate fix?", "options": [{"letter": "A", "text": "The model is fatigued by repetitive work; introduce variation in the prompt wording between records.", "correct": false, "explanation": "Models do not fatigue. Attributing the degradation to repetition points the fix at a cause that does not exist and leaves the real one in place."}, {"letter": "B", "text": "The tools are being called too quickly; add a delay between records.", "correct": false, "explanation": "Pacing affects rate limits, not output quality. Nothing about the interval between calls would produce a gradual decline over hundreds of records."}, {"letter": "C", "text": "The queue is ordered badly; sort the records so similar ones are adjacent.", "correct": false, "explanation": "The records are independent, so their order carries no meaning. Sorting them changes nothing about the growing context that is causing the decline."}, {"letter": "D", "text": "Context from every prior record accumulates in the one conversation; process each record in its own fresh conversation instead.", "correct": true, "explanation": "Independent units of work do not belong in a shared conversation. Hundreds of records of history crowd out the current record and eventually exceed the window, while a fresh context per record keeps input size constant and lets the work run in parallel."}], "correct": "D", "select": 1}, {"id": "d1-15", "domain": 1, "objective": "Agent Patterns and Frameworks", "situation": "A team is adding subagents to an existing research agent. A colleague argues that subagents will make the system faster and more accurate in every case, and proposes routing all work through them.", "question": "Which two limitations of the subagent pattern should temper that proposal? (Select TWO.)", "options": [{"letter": "A", "text": "A subagent returns a summary, so detail the parent might have needed is lost at the handoff.", "correct": true, "explanation": "Compression is the mechanism that makes delegation useful and also its main cost. When the parent's next decision depends on detail the subagent discarded, the handoff has destroyed the information the task needed."}, {"letter": "B", "text": "Each delegation adds its own model calls and coordination overhead, so it is not free and can be slower for small tasks.", "correct": true, "explanation": "Spawning a subagent costs a full request cycle plus the parent's dispatch and integration turns. For a task the parent could have finished in one call, that overhead dominates."}, {"letter": "C", "text": "Subagents cannot use tools, so any tool-using step must stay in the parent.", "correct": false, "explanation": "Subagents commonly have their own tools — that is often the point of delegating to one. There is no such restriction."}, {"letter": "D", "text": "Subagents always share the parent's context window, so they provide no isolation benefit.", "correct": false, "explanation": "This is the opposite of how the pattern works. A subagent runs with its own context, which is precisely why it can absorb bulky reading without polluting the parent."}, {"letter": "E", "text": "A subagent's result cannot be validated by the parent, so errors propagate silently.", "correct": false, "explanation": "A parent can and should check a subagent's result. Validation is a design choice available to the parent, not a limitation of the pattern."}], "correct": ["A", "B"], "select": 2}, {"id": "d1-16", "domain": 1, "objective": "Agent Patterns and Frameworks", "situation": "A build-diagnosis agent reads CI logs. A single failing build produces about 40,000 tokens of log output, and the agent typically inspects three or four builds before identifying a pattern. By the fourth build it starts losing track of what it found in the first.", "question": "Which technique best preserves the agent's ability to compare findings across builds?", "options": [{"letter": "A", "text": "After analysing each build, record a short structured finding and clear that build's raw log from the working context.", "correct": true, "explanation": "The comparison needs the findings, not the logs that produced them. Distilling each build to a compact record and clearing the source keeps all four findings simultaneously in view at a fraction of the tokens, which is exactly what the cross-build comparison requires."}, {"letter": "B", "text": "Feed all four logs at once so the model can compare them directly in a single pass.", "correct": false, "explanation": "160,000 tokens of raw log is the bloat causing the problem, and a single pass over all of it makes the relevant lines harder to find rather than easier."}, {"letter": "C", "text": "Ask the model to re-read the earlier logs when it needs to recall a finding.", "correct": false, "explanation": "Re-reading pays the full token cost again for information the agent already extracted, and it does nothing to stop the context from growing past the point where the problem started."}, {"letter": "D", "text": "Reduce the number of builds inspected to two so the context stays small.", "correct": false, "explanation": "This keeps the context manageable by not doing the task. Identifying a pattern is what the agent is for, and it needs several builds to do it."}], "correct": "A", "select": 1}, {"id": "d2-01", "domain": 2, "objective": "Understanding Requirements", "situation": "A product owner asks for 'an AI assistant that helps our warehouse staff'. In discovery the developer learns that staff spend most of their shift looking up which bin holds a given part, that the bin data lives in a warehouse system with a REST API, that staff work on handheld scanners with intermittent connectivity, and that a wrong bin number costs about twenty minutes.", "question": "Which of these is the infrastructure requirement the design must account for, as distinct from the functional one?", "options": [{"letter": "A", "text": "Staff need to look up which bin holds a given part.", "correct": false, "explanation": "This is the functional requirement — what the system must do. It says nothing about the environment the system has to run in."}, {"letter": "B", "text": "A wrong bin number costs about twenty minutes.", "correct": false, "explanation": "This is a statement of the cost of error. It informs how much verification and human confirmation the design needs, but it is not an infrastructure constraint."}, {"letter": "C", "text": "The handhelds have intermittent connectivity, so the design must define behaviour when a request cannot complete.", "correct": true, "explanation": "Connectivity is a property of the environment the system must operate in, and it forces concrete design decisions — timeouts, retries, cached results, and what the scanner shows when nothing can be reached. That is what makes it an infrastructure requirement."}, {"letter": "D", "text": "The assistant should be helpful to warehouse staff.", "correct": false, "explanation": "This is the original unrefined goal, which is what discovery exists to turn into something specific. It is neither functional nor infrastructural until it is made concrete."}], "correct": "C", "select": 1}, {"id": "d2-02", "domain": 2, "objective": "Understanding Requirements", "situation": "A business sponsor says: 'We want Claude to answer our customers' questions instead of the support team.' The developer needs to turn this into something buildable. Support currently handles password resets, order-status lookups, refund requests, and complex product-compatibility questions, and it has a 4-hour response SLA.", "question": "What is the most useful next step in turning this into a technical requirement?", "options": [{"letter": "A", "text": "Build a prototype that answers all four categories and let the sponsor react to it.", "correct": false, "explanation": "A prototype is a good way to test a scoped hypothesis, but building all four categories first commits effort before anyone has decided which are appropriate for automation or what 'answered' means for a refund."}, {"letter": "B", "text": "Estimate the token cost of the current support volume so the sponsor can approve a budget.", "correct": false, "explanation": "A cost estimate over an undefined scope is a number without meaning. The scope has to exist before it can be priced."}, {"letter": "C", "text": "Ask the sponsor to confirm the 4-hour SLA applies to the automated path as well.", "correct": false, "explanation": "This is a fair question and worth asking, but it refines one constraint on a scope that has not yet been defined. A 4-hour budget is generous for every category listed, so it is not the binding decision."}, {"letter": "D", "text": "Decompose the four categories by what each requires — data access, action authority, and cost of a wrong answer — and agree which are in scope for automation and which escalate.", "correct": true, "explanation": "The four categories differ in every dimension that matters: an order lookup is a read, a refund is an authorized action, and a compatibility question needs product knowledge. Deciding scope per category, with an explicit escalation path, is what turns the sponsor's sentence into something that can be designed and tested."}], "correct": "D", "select": 1}, {"id": "d2-03", "domain": 2, "objective": "Understanding Requirements", "situation": "A team is gathering requirements for a Claude-based contract-review assistant for an in-house legal group. The sponsor has described the desired output but nothing else.", "question": "Which two questions most directly shape the technical design, rather than the user experience? (Select TWO.)", "options": [{"letter": "A", "text": "Where do the contracts live, in what formats, and how will the system be authorized to read them?", "correct": true, "explanation": "Data location, format, and access authorization determine the integration surface, whether document input handling is needed, and what the security model must be. Nothing can be designed until these are known."}, {"letter": "B", "text": "What happens when the assistant is wrong — who reviews its output, and what is the consequence of a missed clause?", "correct": true, "explanation": "The cost of an error and the review path determine how much human-in-the-loop structure, validation, and conservatism the design needs. A missed clause with legal consequences implies a very different system from a first-pass triage aid."}, {"letter": "C", "text": "Should the assistant appear as a chat panel or as an annotation layer over the document?", "correct": false, "explanation": "This is a genuine product question, but it is a presentation choice that can change without altering the underlying integration, model selection, or safety design."}, {"letter": "D", "text": "What should the assistant be called, and should it have a distinct tone of voice?", "correct": false, "explanation": "Naming and tone shape adoption but impose no technical constraint. They can be settled at any point."}, {"letter": "E", "text": "Which Claude model has the highest published benchmark scores this quarter?", "correct": false, "explanation": "Model selection follows from the requirements and is validated by evaluation on the team's own contracts. Starting from a benchmark leaderboard puts the decision before the information needed to make it."}], "correct": ["A", "B"], "select": 2}, {"id": "d2-04", "domain": 2, "objective": "Systems Life Cycle", "situation": "A Claude-powered triage feature has been in production for eight months. It was accurate at launch. Recently the support team reports it is misrouting a growing share of tickets. Nothing in the prompt, model version, or code has changed.", "question": "What is the most likely explanation and the right operational response?", "options": [{"letter": "A", "text": "The input distribution has shifted — new products, new terminology, or new ticket types — and the system needs periodic re-evaluation against current traffic.", "correct": true, "explanation": "When the system is unchanged but performance falls, the world it operates on has changed. This is why an operate-and-maintain phase includes regular re-evaluation on recent data rather than trusting a launch-time result indefinitely."}, {"letter": "B", "text": "The model has degraded through use and should be reset by redeploying the service.", "correct": false, "explanation": "Models do not degrade through use, and a pinned model behaves the same on day 240 as on day 1. Redeploying changes nothing."}, {"letter": "C", "text": "The prompt cache has become stale and is returning outdated responses.", "correct": false, "explanation": "Prompt caching reduces the cost of reprocessing identical input; it does not serve stored responses. It cannot cause a routing accuracy change."}, {"letter": "D", "text": "Support staff have become less tolerant of errors that were always present.", "correct": false, "explanation": "Possible in principle, but it assumes the reported change is illusory without checking. The first move is to measure current accuracy on current tickets, not to dismiss the report."}], "correct": "A", "select": 1}, {"id": "d2-05", "domain": 2, "objective": "Systems Life Cycle", "situation": "A team is preparing to hand a Claude-based document-classification service from the build team to the operations team, who will own it going forward. The operations team has no LLM experience.", "question": "What must the handoff include for the service to be maintainable?", "options": [{"letter": "A", "text": "The source repository and access to the API account, since everything else can be read from the code.", "correct": false, "explanation": "Code shows what the system does, not why the prompt is worded as it is, what accuracy is expected, or which failures are known. An operations team reading only code has no basis for deciding whether the system is behaving correctly."}, {"letter": "B", "text": "A recorded walkthrough of the architecture, so the operations team can re-watch it as needed.", "correct": false, "explanation": "A walkthrough helps with onboarding but is not an operational artefact. It cannot be run against a suspected regression or diffed when the prompt changes."}, {"letter": "C", "text": "A guarantee from the build team that they will handle any incident involving model behaviour.", "correct": false, "explanation": "This is not a handoff; it leaves ownership with the build team indefinitely and gives the operations team no ability to act during an incident."}, {"letter": "D", "text": "The evaluation set and current baseline results, the pinned model version and prompt version, the known failure modes and their handling, and the monitoring signals that indicate a problem.", "correct": true, "explanation": "Each item answers a question the operations team will face: what 'working' means and how to check it, exactly what is deployed, what to expect when it fails, and how a problem announces itself. Without them, maintenance is guesswork on a system whose behaviour is probabilistic."}], "correct": "D", "select": 1}, {"id": "d2-06", "domain": 2, "objective": "Systems Life Cycle", "situation": "A team ships prompt changes to a production Claude feature by editing a string in the application code and deploying. Twice this quarter a prompt edit degraded quality and the cause took days to identify, because the deployment also contained unrelated code changes.", "question": "Which two practices would most improve this? (Select TWO.)", "options": [{"letter": "A", "text": "Version prompts explicitly and record which prompt version produced each production response.", "correct": true, "explanation": "An identified prompt version is what makes a quality change attributable. Without it, the only evidence linking behaviour to a prompt is the deployment timestamp, which is exactly what failed when the deploy bundled other changes."}, {"letter": "B", "text": "Run the evaluation set against a prompt change before it is deployed, and gate the deploy on the result.", "correct": true, "explanation": "A prompt edit is a behaviour change, so it deserves the same pre-merge check as a code change. Catching the regression before release removes the days spent identifying it afterwards."}, {"letter": "C", "text": "Move the prompt out of version control into a configuration service so it can be changed without a deploy.", "correct": false, "explanation": "Faster changes without review or evaluation makes untracked regressions easier to introduce, not harder. Editing production behaviour outside the change process is the opposite of the fix."}, {"letter": "D", "text": "Have two engineers review every prompt change by reading it.", "correct": false, "explanation": "Review helps, but prompt quality is not reliably assessable by reading. Two people can agree a prompt looks better and still ship a regression that a measurement would have caught."}, {"letter": "E", "text": "Freeze the prompt after launch and route all improvements through model upgrades instead.", "correct": false, "explanation": "Prompts need iteration as the product changes, and model upgrades address a different variable entirely. Freezing removes the team's main tuning mechanism."}], "correct": ["A", "B"], "select": 2}, {"id": "d2-07", "domain": 2, "objective": "Claude API Mechanics", "situation": "A developer's agent sends a request with three tools defined. The response comes back containing an assistant text block and two tool-use blocks, and the stop reason indicates tool use. The developer executes both tools and wants to continue the conversation.", "question": "What must the next request contain?", "options": [{"letter": "A", "text": "A new user message with the tool outputs as plain text, and the prior assistant message omitted to save tokens.", "correct": false, "explanation": "Dropping the assistant message removes the tool-use blocks the results refer to, leaving results with nothing to attach to. Plain text also loses the association between each result and the call that produced it."}, {"letter": "B", "text": "Only the second tool's result, since the model will infer the first from context.", "correct": false, "explanation": "Every tool call issued must be answered with a corresponding result. An unanswered call leaves the conversation in an invalid state."}, {"letter": "C", "text": "The full prior conversation including the assistant message with both tool-use blocks, followed by a user message carrying both tool results, each referencing its call.", "correct": true, "explanation": "The API is stateless, so the whole conversation is resent each turn, and results are matched to calls by identifier. Both results belong in a single user message following the assistant turn that requested them."}, {"letter": "D", "text": "A fresh conversation containing a summary of what happened and the tool outputs.", "correct": false, "explanation": "Starting over discards the structured tool-use exchange the model needs to continue coherently, and a prose summary is a lossy substitute for the actual results."}], "correct": "C", "select": 1}, {"id": "d2-08", "domain": 2, "objective": "Claude API Mechanics", "situation": "A logistics team must extract structured data from 40,000 scanned delivery notes. The images are already stored. Results feed a report that is reviewed the following week. The team's first implementation issues 40,000 synchronous requests and is being throttled.", "question": "Which approach best matches the workload?", "options": [{"letter": "A", "text": "Keep the synchronous calls and add exponential backoff so throttled requests eventually succeed.", "correct": false, "explanation": "Backoff is necessary for correctness under throttling but it only paces a workload that is on the wrong endpoint. It leaves the full synchronous price in place for work with no latency requirement."}, {"letter": "B", "text": "Submit the work through the batch endpoint, which processes large asynchronous workloads at reduced cost, and collect the results by identifier when the batch ends.", "correct": true, "explanation": "The work is high-volume, independent, and not needed until next week, which is precisely the batch profile: substantially cheaper than synchronous calls and free of the throttling that comes from hammering the realtime path. Results are matched by the identifier supplied per request."}, {"letter": "C", "text": "Split the images into 40 jobs of 1,000 and run them on separate API keys to avoid the rate limit.", "correct": false, "explanation": "Spreading the same load across keys to evade a limit is an abuse pattern rather than a design, and it still pays the synchronous rate for latency the team does not need."}, {"letter": "D", "text": "Convert the images to text with an OCR library first, since the API cannot accept images.", "correct": false, "explanation": "Claude accepts image input directly, so a separate OCR step adds a component, a failure mode, and a quality ceiling for no benefit."}], "correct": "B", "select": 1}, {"id": "d2-09", "domain": 2, "objective": "Claude API Mechanics", "situation": "A developer wants Claude to answer questions about a 90-page PDF technical manual that customers upload. The same manual is queried many times across a session, and several customers share a small set of common manuals.", "question": "Which handling of the document is most appropriate?", "options": [{"letter": "A", "text": "Convert the PDF to plain text with a local library and paste the text into every request.", "correct": false, "explanation": "Local text extraction discards layout, tables, and diagrams that a technical manual relies on, and pasting the full text into every request is exactly the repeated cost the scenario invites the developer to avoid."}, {"letter": "B", "text": "Send only the page the customer's question appears to reference, selected by keyword match.", "correct": false, "explanation": "A keyword match on the question is a crude retrieval strategy that will miss the relevant page whenever the manual's wording differs from the customer's. It is a retrieval design, not document handling, and a poor one."}, {"letter": "C", "text": "Ask the customer to summarize the relevant section and send only the summary.", "correct": false, "explanation": "This asks the customer to do the work they came for. If they could identify and summarize the relevant section, they would not need the assistant."}, {"letter": "D", "text": "Pass the PDF as a document to the API, and for the shared common manuals upload once and reference the stored file across requests, marking the stable document content as cacheable.", "correct": true, "explanation": "Native document input preserves the manual's structure, uploading a shared file once avoids resending its bytes on every request, and caching the stable document prefix cuts the cost of repeated queries against the same manual."}], "correct": "D", "select": 1}, {"id": "d2-10", "domain": 2, "objective": "Claude API Mechanics", "situation": "A developer streams a response and needs to know both the final text and how many input and output tokens the request consumed, in order to log per-request cost. Their current code concatenates text deltas as they arrive and never reads anything else from the stream.", "question": "How should they obtain the token usage?", "options": [{"letter": "A", "text": "Take the assembled final message from the stream, which carries the usage figures alongside the content.", "correct": true, "explanation": "The stream is not only text deltas: it resolves into a complete message whose usage figures report exactly what the request consumed. Using the SDK's final-message helper gives both the text and the authoritative counts in one place."}, {"letter": "B", "text": "Estimate the counts from the length of the concatenated text using a characters-per-token ratio.", "correct": false, "explanation": "An estimate is unnecessary when the exact figures are reported, and it cannot account for input tokens, cached reads, or anything other than the visible output text."}, {"letter": "C", "text": "Issue a second, non-streaming request with the same input and read the usage from it.", "correct": false, "explanation": "This doubles the cost of every request to measure the cost of every request, and the second response's output length will differ from the first."}, {"letter": "D", "text": "Call the token-counting endpoint on the assembled response text.", "correct": false, "explanation": "Counting the response text gives a count of that text, not the request's billed usage — it omits the input side entirely and does not reflect cached reads."}], "correct": "A", "select": 1}, {"id": "d2-11", "domain": 2, "objective": "Claude API Mechanics", "situation": "A team runs Claude through a cloud marketplace deployment because of an existing procurement relationship. They want to use a feature they read about in the API documentation, and it is not working. Their code is otherwise correct and the same request works against the first-party API.", "question": "What is the most likely explanation?", "options": [{"letter": "A", "text": "The cloud deployment requires all requests to be sent as batch jobs.", "correct": false, "explanation": "Third-party deployments serve synchronous requests normally. There is no such blanket requirement."}, {"letter": "B", "text": "Features are identical across deployments, so the failure must be a bug in the team's credentials.", "correct": false, "explanation": "Working credentials would not produce a feature-specific failure, and feature parity across platforms is exactly the assumption that does not hold."}, {"letter": "C", "text": "Feature availability differs by deployment platform, so the feature may not be offered there; the platform's availability documentation has to be checked before depending on it.", "correct": true, "explanation": "Model availability, feature availability, and even model identifiers vary between the first-party API and third-party platforms. Confirming support on the target platform is a required design step, not an afterthought."}, {"letter": "D", "text": "The feature requires a newer SDK version, and third-party deployments always lag by one major version.", "correct": false, "explanation": "SDK version is worth checking generally, but there is no rule that third-party platforms lag a fixed number of versions. The platform-specific availability question is the one that explains a feature working in one place and not another."}], "correct": "C", "select": 1}, {"id": "d2-12", "domain": 2, "objective": "Claude API Mechanics", "situation": "A developer needs a guaranteed JSON shape from a Claude call so downstream code can consume it without defensive parsing. They also want the model to reason before producing the answer on hard inputs.", "question": "Which combination achieves both on a current Claude model?", "options": [{"letter": "A", "text": "Prefill the assistant turn with an opening brace and instruct the model to think in a scratchpad first.", "correct": false, "explanation": "Assistant-turn prefill is rejected on current models, and a hand-rolled scratchpad puts reasoning text into the response that the parser then has to strip — the opposite of a guaranteed shape."}, {"letter": "B", "text": "Configure structured output so the response conforms to the schema, and enable adaptive thinking so reasoning happens outside the structured answer.", "correct": true, "explanation": "Structured output constrains the response to the declared schema, and adaptive thinking lets the model reason without that reasoning contaminating the output the parser reads. The two are complementary rather than in tension."}, {"letter": "C", "text": "Ask for JSON in the prompt and validate with a regular expression, since no API-level mechanism exists.", "correct": false, "explanation": "An API-level mechanism does exist. Falling back to prompt instructions plus regex accepts a failure rate the platform can remove."}, {"letter": "D", "text": "Use a tool call as the only output path and set a fixed thinking budget for the reasoning.", "correct": false, "explanation": "A tool call with a strict schema is a legitimate way to obtain structured data, but the fixed thinking budget is removed on current models, so this combination does not work as described."}], "correct": "B", "select": 1}, {"id": "d2-13", "domain": 2, "objective": "Claude API Mechanics", "situation": "A team is deciding between the realtime and batch paths for two workloads: a user-facing 'explain this chart' button, and a monthly job that re-scores 200,000 archived records against an updated rubric.", "question": "Which two considerations correctly drive this split? (Select TWO.)", "options": [{"letter": "A", "text": "The chart button blocks a user who is waiting, so it must take the synchronous path regardless of the cost difference.", "correct": true, "explanation": "Batch results are returned asynchronously over a long window, which is incompatible with a user waiting for a button to respond. A hard interactivity requirement removes the choice."}, {"letter": "B", "text": "The re-scoring job is large, independent, and has no per-item deadline, so batch's lower price applies to the workload it was designed for.", "correct": true, "explanation": "High volume, independence between items, and tolerance for delayed completion are the conditions under which batch is the right path, and the discount over synchronous calls is substantial at 200,000 items."}, {"letter": "C", "text": "Batch should be preferred for both, because it removes the risk of rate limiting on the interactive path.", "correct": false, "explanation": "Rate limits on an interactive path are handled with backoff and capacity planning. Moving a user-blocking call to an asynchronous path to avoid them replaces a manageable problem with a broken feature."}, {"letter": "D", "text": "Realtime should be preferred for both, because batch cannot guarantee that every request in a submission succeeds.", "correct": false, "explanation": "Per-item outcomes are reported individually in both paths, and a synchronous call can fail just as an item in a batch can. This is not a distinguishing property."}, {"letter": "E", "text": "The re-scoring job should use realtime calls with high concurrency, since finishing sooner reduces total cost.", "correct": false, "explanation": "Finishing sooner does not lower the per-token price. Concurrency shortens wall-clock time on the more expensive path, which is the opposite of the stated objective for that workload."}], "correct": ["A", "B"], "select": 2}, {"id": "d2-14", "domain": 2, "objective": "Software Engineering Foundations", "situation": "A Python service must enrich each incoming record with three independent Claude calls before responding. Each call takes roughly 800 ms. The current implementation awaits them one after another, and the endpoint's p95 latency is about 2.5 seconds against a 1.5-second budget.", "question": "Which change addresses the latency without changing what the model is asked to do?", "options": [{"letter": "A", "text": "Combine the three prompts into one call that returns all three enrichments.", "correct": false, "explanation": "This can be a reasonable design, but it changes what the model is asked to do — one call producing three answers has different quality characteristics — and the question asks for a change that does not."}, {"letter": "B", "text": "Cache the responses so repeated records are served from memory.", "correct": false, "explanation": "A result cache helps only on repeated inputs. It does nothing for the first request for any record, which is where the 2.5-second latency is measured."}, {"letter": "C", "text": "Move the three calls to a background job and return a placeholder immediately.", "correct": false, "explanation": "This meets the latency number by not delivering the enrichment in the response. It changes the endpoint's contract rather than making it faster."}, {"letter": "D", "text": "Issue the three independent calls concurrently and await them together, so total latency is roughly that of the slowest call.", "correct": true, "explanation": "The calls are independent and I/O bound, so nothing requires them to be serial. Awaiting them concurrently collapses about 2.4 seconds of stacked waiting into roughly 800 ms, with no change to any prompt."}], "correct": "D", "select": 1}, {"id": "d2-15", "domain": 2, "objective": "Software Engineering Foundations", "situation": "A team is designing the internal REST endpoint that fronts a Claude-based report generator. Generation takes 40 to 120 seconds. Their gateway times out client connections at 30 seconds, and callers include a browser app and a nightly script.", "question": "Which API design fits these constraints?", "options": [{"letter": "A", "text": "Accept the request, return a job identifier immediately with an accepted status, and let callers poll a status endpoint or receive a callback when the report is ready.", "correct": true, "explanation": "Work that outlasts the connection budget should not be modelled as a synchronous request. Returning a job handle decouples the work from the connection, and it serves both callers: the browser can poll or subscribe, and the script can wait."}, {"letter": "B", "text": "Keep the synchronous endpoint and raise the gateway timeout to 180 seconds.", "correct": false, "explanation": "This makes the whole gateway tolerate long-held connections for one endpoint's benefit, and a browser holding a two-minute request is fragile against any network interruption."}, {"letter": "C", "text": "Keep the synchronous endpoint and have callers retry on timeout until one attempt completes within 30 seconds.", "correct": false, "explanation": "Generation takes at least 40 seconds, so no attempt can complete in time. Each retry starts the expensive work again and is abandoned, multiplying cost while never succeeding."}, {"letter": "D", "text": "Stream the model's response directly through the endpoint so the connection stays active.", "correct": false, "explanation": "Streaming keeps the connection alive and is worth doing for a report the user reads progressively, but it still holds a connection open for two minutes and does not serve the nightly script, which wants a completed artefact."}], "correct": "A", "select": 1}, {"id": "d2-16", "domain": 2, "objective": "Software Engineering Foundations", "situation": "A team has started using an AI coding assistant heavily. Pull requests are larger than before and reviewers report that the code 'looks right' but has produced two production incidents from logic that was subtly wrong in edge cases.", "question": "Which change to the review process most directly addresses this?", "options": [{"letter": "A", "text": "Require that pull requests state which parts were AI-generated so reviewers can scrutinise those parts harder.", "correct": false, "explanation": "Provenance labelling encourages reviewers to trust the rest by default, and the incidents came from code that read well. The origin of a line is not what determines whether its edge cases are correct."}, {"letter": "B", "text": "Set a maximum pull-request size and reject anything larger.", "correct": false, "explanation": "Smaller reviews genuinely help attention, and this is a reasonable secondary measure. On its own it addresses review volume rather than the specific failure, which is plausible-looking code passing a reading-based review."}, {"letter": "C", "text": "Have a second AI assistant review each pull request and require it to approve.", "correct": false, "explanation": "This adds a reviewer with the same weakness as the reading-based review it supplements: it evaluates whether the code looks right rather than whether it behaves right."}, {"letter": "D", "text": "Require tests that exercise the edge cases for the behaviour being changed, and review the tests as carefully as the implementation.", "correct": true, "explanation": "Code that reads well and behaves wrong is exactly what execution catches and reading does not. Making the edge-case tests part of the deliverable and reviewing them shifts the review from plausibility to evidence."}], "correct": "D", "select": 1}, {"id": "d2-17", "domain": 2, "objective": "Software Engineering Foundations", "situation": "A team wants to migrate 400 files from a deprecated logging library to a new one. The mechanical part of the change is uniform, but about 30 files use the old library's custom formatters in ways that have no direct equivalent. They plan to use a Claude-based agent.", "question": "How should the migration be structured?", "options": [{"letter": "A", "text": "Hand the whole repository to the agent in one session and ask it to complete the migration.", "correct": false, "explanation": "A single session over 400 files accumulates context until quality degrades, produces one enormous diff no one can review, and gives no checkpoint at which the mechanical and judgment-heavy parts can be separated."}, {"letter": "B", "text": "Migrate the 30 hard files first by hand, then have the agent do
